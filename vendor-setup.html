<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor Setup</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="settings.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  color-scheme: light;
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC; --muted: #8B7D72;
  --accent: #8B3A2A; --accent-light: #F2E8E5; --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8; --done-bg: #EAF3DE; --done-text: #27500A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; padding: 14px; }
input, select, button, textarea { font: inherit; color: var(--ink); }
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
.subtitle { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
.panel { background: white; border: 1.5px solid var(--rule); border-radius: 8px; padding: 13px 14px; margin-bottom: 14px; }
.panel h2 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
input[type=text], input[type=email], input[type=tel], select {
  width: 100%; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px; background: white; }
input.code { font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .1em; width: 90px; }
.hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
.hint.bad { color: var(--accent); }
.hint.ok { color: var(--done-text); }
.alt { font-family: 'DM Mono', monospace; font-size: 11px; border: 1px solid var(--rule); background: var(--paper);
  border-radius: 10px; padding: 1px 7px; margin-right: 4px; cursor: pointer; }
.preview { margin-top: 10px; padding: 9px 11px; background: var(--paper); border-radius: 6px; font-size: 11.5px; line-height: 1.8; }
.preview code, .mono { font-family: 'DM Mono', monospace; }
.btn { font-size: 11px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--teal);
  background: var(--teal); color: white; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.secondary { background: white; color: var(--ink); border-color: var(--rule); font-weight: 500; }
.btn.danger { background: white; color: var(--accent); border-color: var(--accent); }
.btn.tiny { font-size: 10px; padding: 4px 9px; }
.btn:disabled { opacity: .5; cursor: default; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.bar .grow { flex: 1; }
.banner { margin-bottom: 12px; padding: 9px 12px; border-radius: 6px; font-size: 11.5px; line-height: 1.6;
  background: white; border: 1px solid var(--rule); color: #6B5E52; }
.banner.warn { background: var(--gold-light); border-color: #E4CF9E; color: #6E4C13; }
.banner.bad { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.banner.good { background: var(--done-bg); border-color: #BBD79A; color: var(--done-text); }
.strip { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.stat { font-size: 11px; padding: 5px 11px; border-radius: 6px; font-weight: 600; background: white;
  border: 1px solid var(--rule); color: #6B5E52; cursor: pointer; }
.stat.on { background: var(--ink); border-color: var(--ink); color: white; }
.card { background: white; border: 1.5px solid var(--rule); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
.card.ok { border-left: 4px solid var(--teal); }
.card.warn { border-left: 4px solid var(--gold); }
.card.bad { border-left: 4px solid var(--accent); }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.name { font-size: 14px; font-weight: 600; }
.code-tag { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
.badge { font-size: 9px; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--done-bg); color: var(--done-text); }
.badge.warn { background: var(--gold-light); color: var(--gold); }
.badge.bad { background: var(--accent-light); color: var(--accent); }
.badge.none { background: var(--warm); color: #6B5E52; }
.spacer { margin-left: auto; }
.when { font-size: 10.5px; color: var(--muted); }
.fibers { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.fib { display: inline-flex; gap: 4px; align-items: center; font-size: 11.5px; color: var(--ink); margin: 0 10px 0 0; cursor: pointer; }
.links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; }
.links a { color: var(--teal); text-decoration: none; font-weight: 500; }
.links a:hover { text-decoration: underline; }
.saved-status { font-size: 11px; color: #6B5E52; margin-top: 4px; }
.checks { margin-top: 8px; border-top: 1px solid var(--warm); padding-top: 6px; }
.part { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 6px 0 2px; }
.chk { display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 2px 0; }
.chk .ic { width: 14px; flex: none; text-align: center; font-weight: 700; }
.chk.ok .ic { color: var(--teal); } .chk.warn .ic { color: var(--gold); } .chk.bad .ic { color: var(--accent); }
.chk .det { font-size: 11px; color: var(--muted); }
.chk .btn { margin-left: auto; }
.did { margin-top: 6px; font-size: 11.5px; color: var(--done-text); }
.err { margin-top: 6px; font-size: 11.5px; color: var(--accent); }
.note { margin-top: 4px; font-size: 11px; color: #6E4C13; }
.empty { color: var(--muted); font-style: italic; padding: 20px; text-align: center; }
.toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white;
  padding: 9px 16px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="title">Vendor Setup</div>
<div class="subtitle">Each wholesale vendor gets a customer in the vendor store tagged <span class="mono">Vendor-XXX</span>, a private collection of products with that tag, and a Locksmith lock so only they can see it.</div>
<div id="app"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
const WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/vendor-setup';
const TIMEOUT_MS = 120000;
const BATCH = 4;
const TEMPLATE_KEY = 'Vendor_Lock_Template_Code';
const REQUIRED_TAGS_KEY = 'Vendor_Required_Tags';
const FIBER_TAGS_KEY = 'Vendor_Fiber_Tags';
/* Fiber name → Shopify customer tag, e.g. "FF Nylon=Fiber-FFN, FF Cotton=Fiber-FFC, E Nylon=Fiber-EN". */
function fiberMap() {
  const out = {};
  SSSettings.text(FIBER_TAGS_KEY, 'FF Nylon=Fiber-FFN, FF Cotton=Fiber-FFC, E Nylon=Fiber-EN').split(/[,;]+/).forEach(p => {
    const [k, t] = p.split('=').map(x => (x || '').trim()); if (k && t) out[k] = t;
  });
  return out;
}
const fiberList = v => (Array.isArray(v) ? v.filter(x => x !== 'L') : []).map(String);
const requiredTags = () => SSSettings.text(REQUIRED_TAGS_KEY, 'Vendor-All, Wholesaler').split(/[,;]+/).map(t => t.trim()).filter(Boolean);
const VENDOR_TYPE = 'Wholesale Vendor';
const SHOP_ADMIN = 'https://admin.shopify.com/store/squirrelvender';
const STOP_WORDS = new Set(['and', '&', 'of', 'the', '+']);

const S = {
  vendors: [], codes: {}, results: {}, busy: false, busyRow: null, error: '', filter: 'all',
  form: { name: '', email: '', phone: '', code: '', codeEdited: false, first: '', last: '', splitEdited: false, fibers: null },
  template: '', formMsg: null, banner: null, gristRowLink: null,
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}
const col = (t, name) => t[name] || [];

/* ── Code + name helpers ──────────────────────────────────────────────── */

function words(name) {
  return String(name || '').split(/[\s.\-_/]+/).map(w => w.replace(/[^A-Za-z0-9]/g, '')).filter(w => w && !STOP_WORDS.has(w.toLowerCase()));
}
function suggestCode(name) {
  const ws = words(name);
  if (!ws.length) return '';
  let s = '';
  ws.forEach(w => { s += (w.length > 1 && w === w.toUpperCase() && /[A-Z]/.test(w)) ? w : w[0]; });
  s = s.toUpperCase();
  if (s.length < 3) s = (ws[0] + ws.slice(1).join('')).toUpperCase();
  return s.slice(0, 3);
}
function altCodes(name, taken) {
  const letters = words(name).join('').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const out = [];
  if (!letters) return out;
  const a = letters[0];
  for (let i = 1; i < letters.length && out.length < 4; i++)
    for (let j = i + 1; j < letters.length && out.length < 4; j++) {
      const c = a + letters[i] + letters[j];
      if (!taken(c) && !out.includes(c)) out.push(c);
    }
  return out;
}
function splitName(name) {
  const ws = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (ws.length <= 1) return { first: ws[0] || '', last: '' };
  return { first: ws.slice(0, -1).join(' '), last: ws[ws.length - 1] };
}
const codeOwner = code => S.codes[String(code || '').trim().toUpperCase()];

/* ── Grist ────────────────────────────────────────────────────────────── */

/* Link to a vendor's Customers row: /<docId>/<slug>/p/<page>#a1.s<section>.r<row>.c<col>.
   Opens the Customers record card for that row. Same doc-address trick as the Settings Desk. */
async function loadGristLinks() {
  S.gristRowLink = null;
  let base = '';
  try {
    const tok = await (grist.getAccessToken ? grist.getAccessToken({ readOnly: true }) : grist.docApi.getAccessToken({ readOnly: true }));
    const m = String(tok && tok.baseUrl || '').match(/^(https?:\/\/[^/]+)\/(?:o\/[^/]+\/)?api\/docs\/([^/?#]+)/);
    if (m) {
      let slug = 'doc';
      try { const n = await grist.docApi.getDocName(); if (n) slug = String(n).trim().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'doc'; } catch (e) {}
      base = `${m[1]}/${m[2]}/${slug}`;
    }
  } catch (e) {}
  if (!base) return;
  try {
    const [T, C] = await Promise.all(['_grist_Tables', '_grist_Tables_column'].map(t => grist.docApi.fetchTable(t)));
    const ti = T.tableId.indexOf('Customers'); if (ti < 0) return;
    const tref = T.id[ti];
    const ci = C.id.findIndex((id, i) => C.parentId[i] === tref && C.colId[i] === 'Customer_Name');
    const colRef = ci >= 0 ? C.id[ci] : null;
    const c = colRef ? '.c' + colRef : '';
    /* The table's record card (a pop-up of every field for one customer); raw data view if there is none. */
    const card = (T.recordCardViewSectionRef && T.recordCardViewSectionRef[ti]) || (T.rawViewSectionRef && T.rawViewSectionRef[ti]);
    if (card) S.gristRowLink = row => `${base}/p/data#a1.s${card}.r${row}${c}`;
  } catch (e) { console.warn('No page links', e); }
}

async function load() {
  S.error = '';
  try {
    if (!S.gristRowLink) await loadGristLinks();
    await SSSettings.load(true);
    S.template = SSSettings.text(TEMPLATE_KEY, '').trim().toUpperCase();
    const t = await grist.docApi.fetchTable('Customers');
    S.codes = {};
    S.vendors = [];
    (t.id || []).forEach((id, i) => {
      const code = String(col(t, 'Code')[i] || '').trim().toUpperCase();
      const name = String(col(t, 'Customer_Name')[i] || '').trim();
      if (code) S.codes[code] = { id, name };
      if (col(t, 'Type')[i] !== VENDOR_TYPE) return;
      S.vendors.push({
        id, name, code,
        email: String(col(t, 'Email')[i] || '').trim(),
        phone: String(col(t, 'Phone')[i] || '').trim(),
        status: String(col(t, 'Status')[i] || ''),
        fibers: fiberList(col(t, 'Vendor_Fibers')[i]),
        contacts: [col(t, 'Main_Contact')[i], col(t, 'Owner_Name')[i], col(t, 'Ship_To_Name')[i]]
          .map(x => String(x || '').trim()).filter(Boolean),
        customer_id: String(col(t, 'Shopify_Customer_ID')[i] || ''),
        collection_id: String(col(t, 'Shopify_Collection_ID')[i] || ''),
        lock_id: String(col(t, 'Locksmith_Lock_ID')[i] || ''),
        setupStatus: String(col(t, 'Vendor_Setup_Status')[i] || ''),
        checked: String(col(t, 'Vendor_Setup_Checked')[i] || ''),
      });
    });
    S.vendors.sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) {
    console.error(e); S.error = (e && e.message) || String(e);
  }
  render();
}

function templateLockId() {
  if (!S.template) return '';
  const v = S.vendors.find(x => x.code === S.template);
  return v ? v.lock_id : '';
}

async function setTemplate(code) {
  code = String(code || '').toUpperCase();
  try {
    const t = await grist.docApi.fetchTable('Settings');
    const i = (t.Key || []).indexOf(TEMPLATE_KEY);
    if (i >= 0) await grist.docApi.applyUserActions([['UpdateRecord', 'Settings', t.id[i], { Text: code }]]);
    else await grist.docApi.applyUserActions([['AddRecord', 'Settings', null, { Key: TEMPLATE_KEY, Text: code }]]);
    S.template = code;
    toast(code ? `Lock template: ${code}` : 'Lock template cleared');
  } catch (e) { toast('Could not save the template: ' + ((e && e.message) || e)); }
  render();
}

/* Collections are named after either the business or the contact person.
   The workflow only compares with the business name, so sort that out here:
   named after the contact = fine; anything else = say which names it was compared with. */
const nameKey = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function explainTitle(r) {
  const v = S.vendors.find(x => x.id === r.row_id);
  if (!v) return;
  r.checks.forEach(c => {
    if (!/^Title differs/.test(c.label)) return;
    const m = String(c.detail || '').match(/Store: “(.*?)”/);
    const title = m ? m[1] : '';
    const contact = (v.contacts || []).find(n => nameKey(n) === nameKey(title));
    if (contact) {
      c.status = 'ok'; c.label = 'Collection is named after the contact';
      c.detail = `“${title}” (Grist contact: ${contact})`;
    } else {
      c.label = 'Collection name matches neither the business nor the contact';
      c.detail = `Collection: “${title}” · Grist business: “${v.name}”` +
        ((v.contacts || []).length ? ` · Grist contact: “${v.contacts[0]}”` : ' · no contact name in Grist') +
        '. Rename the collection in Shopify, or fix the name in the Grist record.';
    }
  });
  r.status = r.checks.some(c => c.status === 'bad') ? 'bad' : r.checks.some(c => c.status === 'warn') ? 'warn' : 'ok';
}

async function saveResult(r) {
  const v = S.vendors.find(x => x.id === r.row_id);
  if (!v) return;
  const problems = r.checks.filter(c => c.status === 'bad').map(c => c.label);
  const warns = r.checks.filter(c => c.status === 'warn').map(c => c.label);
  const status = problems.length ? 'Needs fixing: ' + problems.join('; ')
    : warns.length ? 'OK with notes: ' + warns.join('; ') : 'OK';
  const now = new Date();
  const stamp = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const upd = { Vendor_Setup_Status: status, Vendor_Setup_Checked: stamp };
  if (r.ids.customer_id) upd.Shopify_Customer_ID = r.ids.customer_id;
  if (r.ids.collection_id) upd.Shopify_Collection_ID = r.ids.collection_id;
  upd.Locksmith_Lock_ID = r.ids.lock_id || '';
  await grist.docApi.applyUserActions([['UpdateRecord', 'Customers', v.id, upd]]);
  Object.assign(v, { setupStatus: status, checked: stamp, customer_id: upd.Shopify_Customer_ID || v.customer_id,
    collection_id: upd.Shopify_Collection_ID || v.collection_id, lock_id: upd.Locksmith_Lock_ID });
}

/* ── n8n ──────────────────────────────────────────────────────────────── */

async function callWorkflow(action, vendors, fix) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store', signal: ctrl.signal,
      body: JSON.stringify({ action, fix: fix || [], template_lock_id: templateLockId(), required_tags: requiredTags(),
        vendors: vendors.map(v => ({ row_id: v.id, name: v.name, code: v.code, email: v.email, phone: v.phone,
          first_name: v.first_name, last_name: v.last_name,
          fiber_tags: (v.fibers || []).map(f => fiberMap()[f]).filter(Boolean),
          remove_tags: Object.entries(fiberMap()).filter(([f]) => !(v.fibers || []).includes(f)).map(([, t]) => t),
          customer_id: v.customer_id, collection_id: v.collection_id, lock_id: v.lock_id })) }),
    });
    const txt = await res.text();
    if (!res.ok) throw new Error(res.status === 404 ? 'the vendor-setup workflow is not active in n8n' : `n8n answered ${res.status}: ${txt.slice(0, 200)}`);
    const data = JSON.parse(txt);
    if (!data || !Array.isArray(data.results)) throw new Error('unexpected answer from n8n');
    return data.results;
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('n8n did not answer within two minutes');
    throw e;
  } finally { clearTimeout(timer); }
}

/* action = check | setup | fix. After any change, re-check so the list shows the real state. */
async function run(action, vendors, fix) {
  if (S.busy) return;
  S.busy = true; S.banner = null; render();
  let n = 0;
  try {
    for (let i = 0; i < vendors.length; i += BATCH) {
      const batch = vendors.slice(i, i + BATCH);
      S.banner = { kind: '', text: `${action === 'check' ? 'Checking' : 'Working on'} ${batch.map(v => v.name).join(', ')}…` }; render();
      let results = await callWorkflow(action, batch, fix);
      const changes = {};
      if (action !== 'check') {
        results.forEach(r => { changes[r.row_id] = { did: r.did, errors: r.errors, notes: r.notes };
          const v = S.vendors.find(x => x.id === r.row_id);
          if (v) { ['customer_id', 'collection_id', 'lock_id'].forEach(k => { if (r.ids[k]) v[k] = r.ids[k]; });
                   if (r.did.some(d => /Removed the old lock/.test(d)) && !r.ids.lock_id) v.lock_id = ''; } });
        results = await callWorkflow('check', batch.map(b => S.vendors.find(x => x.id === b.id) || b));
      }
      for (const r of results) {
        explainTitle(r);
        if (changes[r.row_id]) Object.assign(r, { did: changes[r.row_id].did, errors: [...changes[r.row_id].errors, ...r.errors], notes: [...changes[r.row_id].notes, ...r.notes] });
        S.results[r.row_id] = r;
        await saveResult(r);
        n++;
      }
      render();
    }
    S.banner = { kind: 'good', text: `${action === 'check' ? 'Checked' : 'Done —'} ${n} vendor${n === 1 ? '' : 's'}.` };
  } catch (e) {
    console.error(e);
    S.banner = { kind: 'bad', text: 'Stopped: ' + ((e && e.message) || e) };
  } finally {
    S.busy = false; render();
  }
}

/* ── New vendor form ──────────────────────────────────────────────────── */

function formField(id, value) {
  const f = S.form;
  if (id === 'name') {
    f.name = value;
    if (!f.codeEdited) f.code = suggestCode(value);
    if (!f.splitEdited) { const sp = splitName(value); f.first = sp.first; f.last = sp.last; }
  } else if (id === 'code') { f.code = value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6); f.codeEdited = true; }
  else if (id === 'first' || id === 'last') { f[id] = value; f.splitEdited = true; }
  else f[id] = value;
  renderFormHints();
}
function useCode(c) { S.form.code = c; S.form.codeEdited = true; render(); }

function formProblems() {
  const f = S.form, p = [];
  if (!f.name.trim()) p.push('business name');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.trim())) p.push('a valid email');
  if (!f.code) p.push('a code');
  else if (codeOwner(f.code)) p.push(`a code not already used (${f.code} is ${codeOwner(f.code).name})`);
  if (S.vendors.some(v => v.name.toLowerCase() === f.name.trim().toLowerCase())) p.push('a name not already in Customers');
  return p;
}

function renderFormHints() {
  const f = S.form;
  const owner = codeOwner(f.code);
  const ch = document.getElementById('codeHint');
  if (ch) {
    if (!f.code) ch.innerHTML = '<span class="hint">Usually the first letter of each word.</span>';
    else if (owner) {
      const alts = altCodes(f.name, c => !!codeOwner(c));
      ch.innerHTML = `<span class="hint bad">${esc(f.code)} is taken by ${esc(owner.name)}.</span>` +
        (alts.length ? `<div class="hint">Free: ${alts.map(a => `<span class="alt" onclick="useCode('${a}')">${a}</span>`).join('')}</div>` : '');
    } else ch.innerHTML = `<span class="hint ok">${esc(f.code)} is free.</span>`;
  }
  const codeInput = document.getElementById('f-code');
  if (codeInput && document.activeElement !== codeInput) codeInput.value = f.code;
  ['first', 'last'].forEach(k => { const el = document.getElementById('f-' + k); if (el && document.activeElement !== el) el.value = f[k]; });
  const pv = document.getElementById('preview');
  if (pv) {
    const tag = 'Vendor-' + (f.code || 'XXX');
    pv.innerHTML = `Shopify customer: <b>${esc(f.first || '—')}</b> <b>${esc(f.last)}</b> · ${esc(f.email || 'email')}${f.phone ? ' · ' + esc(f.phone) : ''} · tags ${[tag, ...requiredTags(), ...formFibers().map(fb => fiberMap()[fb])].map(t => `<code>${esc(t)}</code>`).join(', ')}<br>
      Collection: <b>${esc(f.name || 'Business name')}</b> — products tagged <code>${esc(tag)}</code><br>
      Lock: only customers tagged <code>${esc(tag)}</code>; hidden from menus, lists and sitemaps`;
  }
  const btn = document.getElementById('addBtn');
  const probs = formProblems();
  if (btn) { btn.disabled = S.busy || probs.length > 0; btn.title = probs.length ? 'Needs ' + probs.join(', ') : ''; }
  const need = document.getElementById('needs');
  if (need) need.textContent = probs.length && S.form.name ? 'Needs ' + probs.join(', ') + '.' : '';
}

async function addVendor() {
  const f = S.form;
  if (formProblems().length || S.busy) return;
  try {
    const res = await grist.docApi.applyUserActions([['AddRecord', 'Customers', null, {
      Customer_Name: f.name.trim(), Code: f.code, Type: VENDOR_TYPE, Status: 'Active',
      Email: f.email.trim(), Phone: f.phone.trim(), Vendor_Fibers: ['L', ...formFibers()],
    }]]);
    const rowId = res && res.retValues ? res.retValues[0] : null;
    toast(`${f.name} added to Customers`);
    const v = { id: rowId, name: f.name.trim(), code: f.code, email: f.email.trim(), phone: f.phone.trim(),
      first_name: f.first.trim(), last_name: f.last.trim(), fibers: formFibers(), customer_id: '', collection_id: '', lock_id: '', setupStatus: '', checked: '' };
    S.vendors.push(v); S.vendors.sort((a, b) => a.name.localeCompare(b.name));
    S.codes[v.code] = { id: rowId, name: v.name };
    S.form = { name: '', email: '', phone: '', code: '', codeEdited: false, first: '', last: '', splitEdited: false, fibers: null };
    await run('setup', [v]);
  } catch (e) {
    console.error(e); toast('Could not add: ' + ((e && e.message) || e));
  }
}

/* ── Actions from the list ────────────────────────────────────────────── */

const byId = id => S.vendors.find(v => v.id === id);
function checkOne(id) { run('check', [byId(id)]); }
function setupOne(id) { run('setup', [byId(id)]); }
function fixPart(id, part) {
  const v = byId(id);
  if (part === 'lock_rebuild' && !confirm(`Rebuild the Locksmith lock for ${v.name}?\n\nThe current lock is deleted and a new one is made from the template, protecting the same collection. The collection is unprotected for a second or two in between.`)) return;
  run('fix', [v], [part]);
}
function fixAll(id) {
  const r = S.results[id]; const v = byId(id);
  const parts = [...new Set((r ? r.checks : []).filter(c => c.fix && c.status !== 'ok').map(c => c.fix))];
  if (!parts.length) return;
  if (parts.includes('lock_rebuild') && !confirm(`This includes rebuilding the Locksmith lock for ${v.name} (delete and re-create). Go ahead?`)) return;
  run('fix', [v], parts);
}
function checkAll() {
  const list = S.vendors.filter(v => v.code && v.status !== 'Inactive');
  run('check', list);
}
/* Add/remove missing customer tags (own, shared, fiber) for every vendor whose last check flagged them. */
function fixAllTags() {
  const list = S.vendors.filter(v => { const r = S.results[v.id]; return r && r.checks.some(c => c.fix === 'customer' && c.status !== 'ok'); });
  if (!list.length) { toast('Nothing to fix — run Check all first'); return; }
  if (!confirm(`Update customer tags for ${list.length} vendor${list.length === 1 ? '' : 's'}?\n\n` + list.map(v => v.name).join(', '))) return;
  run('fix', list, ['customer']);
}
function setFilter(f) { S.filter = f; render(); }

/* ── Render ───────────────────────────────────────────────────────────── */

const FIX_LABEL = { customer: 'Fix customer', collection: 'Create collection', collection_rule: 'Fix rule',
  publish: 'Publish', lock: 'Create lock', lock_rebuild: 'Rebuild lock' };
const PART_LABEL = { customer: 'Customer', collection: 'Collection', lock: 'Lock' };

function vendorState(v) {
  const r = S.results[v.id];
  if (r) return r.status;
  if (!v.setupStatus) return 'none';
  return v.setupStatus === 'OK' ? 'ok' : /^OK/.test(v.setupStatus) ? 'warn' : 'bad';
}

function vendorCard(v) {
  const r = S.results[v.id];
  const st = vendorState(v);
  const badge = { ok: 'Set up', warn: 'Check notes', bad: 'Needs fixing', none: 'Not checked' }[st];
  const noCode = !v.code;
  let body = '';
  if (r) {
    const groups = {};
    r.checks.forEach(c => (groups[c.part] = groups[c.part] || []).push(c));
    body += '<div class="checks">' + Object.keys(PART_LABEL).filter(p => groups[p]).map(p =>
      `<div class="part">${PART_LABEL[p]}</div>` + groups[p].map(c => `
        <div class="chk ${c.status}"><span class="ic">${c.status === 'ok' ? '✓' : c.status === 'warn' ? '!' : '✕'}</span>
          <span>${esc(c.label)}${c.detail ? ` <span class="det">— ${esc(c.detail)}</span>` : ''}</span>
          ${c.fix && c.status !== 'ok' ? `<button class="btn tiny ${c.fix === 'lock_rebuild' ? 'danger' : 'secondary'}" ${S.busy ? 'disabled' : ''} onclick="fixPart(${v.id}, '${c.fix}')">${FIX_LABEL[c.fix]}</button>` : ''}
        </div>`).join('')).join('') + '</div>';
    if (r.did && r.did.length) body += `<div class="did">✓ ${r.did.map(esc).join(' · ')}</div>`;
    if (r.errors && r.errors.length) body += `<div class="err">${r.errors.map(esc).join('<br>')}</div>`;
    if (r.notes && r.notes.length) body += r.notes.map(n => `<div class="note">${esc(n)}</div>`).join('');
  } else if (v.setupStatus && v.setupStatus !== 'OK') {
    body += `<div class="saved-status">${esc(v.setupStatus)}</div>`;
  }
  const fixable = r && r.checks.some(c => c.fix && c.status !== 'ok');
  return `<div class="card ${st === 'none' ? '' : st}">
    <div class="card-top">
      <span class="name">${esc(v.name)}</span>
      <span class="code-tag">${noCode ? 'no code' : 'Vendor-' + esc(v.code)}</span>
      <span class="badge ${st}">${badge}</span>
      ${v.checked ? `<span class="when">checked ${esc(v.checked)}</span>` : ''}
      <span class="spacer"></span>
      ${fixable ? `<button class="btn tiny" ${S.busy ? 'disabled' : ''} onclick="fixAll(${v.id})">Fix all</button>` : ''}
      ${st === 'none' || st === 'bad' ? `<button class="btn tiny secondary" ${S.busy || noCode ? 'disabled' : ''} onclick="setupOne(${v.id})" title="Creates whatever is missing; never changes what exists">Set up</button>` : ''}
      <button class="btn tiny secondary" ${S.busy || noCode ? 'disabled' : ''} onclick="checkOne(${v.id})">Check</button>
    </div>${vendorLinks(v)}${fiberRow(v)}${body}</div>`;
}

function formFibers() { return S.form.fibers || Object.keys(fiberMap()); }
function toggleFormFiber(fb, on) {
  const cur = new Set(formFibers()); on ? cur.add(fb) : cur.delete(fb);
  S.form.fibers = Object.keys(fiberMap()).filter(x => cur.has(x)); renderFormHints();
}
/* Ticking a fiber saves it to Grist straight away; the store changes on Fix / Check → Fix customer. */
function fiberRow(v) {
  return `<div class="fibers">Fibers: ${Object.keys(fiberMap()).map(fb => `<label class="fib"><input type="checkbox" ${(v.fibers || []).includes(fb) ? 'checked' : ''} ${S.busy ? 'disabled' : ''} onchange="toggleVendorFiber(${v.id}, '${esc(fb)}', this.checked)"> ${esc(fb)}</label>`).join('')}</div>`;
}
async function toggleVendorFiber(id, fb, on) {
  const v = byId(id); if (!v) return;
  const cur = new Set(v.fibers || []); on ? cur.add(fb) : cur.delete(fb);
  v.fibers = Object.keys(fiberMap()).filter(x => cur.has(x));
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Customers', id, { Vendor_Fibers: ['L', ...v.fibers] }]]);
    toast(`${v.name}: ${v.fibers.join(', ') || 'no fibers'} — click Check, then Fix customer to update the store`);
  } catch (e) { toast('Could not save: ' + ((e && e.message) || e)); }
}

function vendorLinks(v) {
  const a = [];
  if (S.gristRowLink) a.push(['Grist record', S.gristRowLink(v.id)]);
  if (v.customer_id) a.push(['Shopify customer', `${SHOP_ADMIN}/customers/${v.customer_id}`]);
  if (v.collection_id) a.push(['Shopify collection', `${SHOP_ADMIN}/collections/${v.collection_id}`]);
  if (v.lock_id) a.push(['Locksmith lock', `${SHOP_ADMIN}/apps/locksmith/locks/${v.lock_id}`]);
  if (!a.length) return '';
  return `<div class="links">${a.map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join('')}</div>`;
}

function render() {
  const app = document.getElementById('app');
  if (S.error) { app.innerHTML = `<div class="banner bad">Could not read Customers: ${esc(S.error)}</div>`; return; }
  const f = S.form;
  const counts = { all: S.vendors.length, bad: 0, warn: 0, ok: 0, none: 0 };
  S.vendors.forEach(v => counts[vendorState(v)]++);
  const list = S.vendors.filter(v => S.filter === 'all' || vendorState(v) === S.filter);
  const withLock = S.vendors.filter(v => v.lock_id && v.code);
  const tplV = S.vendors.find(v => v.code === S.template);

  app.innerHTML = `
  <div class="panel">
    <h2>Add a new vendor</h2>
    <div class="grid">
      <div><label>Business name</label><input type="text" id="f-name" value="${esc(f.name)}" oninput="formField('name', this.value)" placeholder="e.g. Midwest Musical Imports"></div>
      <div><label>Contact email</label><input type="email" id="f-email" value="${esc(f.email)}" oninput="formField('email', this.value)"></div>
      <div><label>Phone (optional)</label><input type="tel" id="f-phone" value="${esc(f.phone)}" oninput="formField('phone', this.value)" placeholder="+1 503 555 1212"></div>
      <div><label>Code</label><input type="text" class="code" id="f-code" value="${esc(f.code)}" oninput="formField('code', this.value)"><div id="codeHint"></div></div>
    </div>
    <div class="grid" style="margin-top:10px">
      <div><label>Shopify first name</label><input type="text" id="f-first" value="${esc(f.first)}" oninput="formField('first', this.value)"></div>
      <div><label>Shopify last name</label><input type="text" id="f-last" value="${esc(f.last)}" oninput="formField('last', this.value)"></div>
    </div>
    <div style="margin-top:10px"><label>Fibers they can see</label>
      ${Object.keys(fiberMap()).map(fb => `<label class="fib"><input type="checkbox" ${formFibers().includes(fb) ? 'checked' : ''} onchange="toggleFormFiber('${esc(fb)}', this.checked)"> ${esc(fb)}</label>`).join('')}</div>
    <div class="preview" id="preview"></div>
    <div class="bar"><span class="hint grow" id="needs"></span>
      <button class="btn" id="addBtn" onclick="addVendor()">Add to Grist & set up in Shopify</button></div>
  </div>

  <div class="panel">
    <h2>Vendors in the store</h2>
    ${S.banner ? `<div class="banner ${S.banner.kind}">${esc(S.banner.text)}</div>` : ''}
    <div class="bar" style="margin-top:0">
      <button class="btn" ${S.busy ? 'disabled' : ''} onclick="checkAll()">Check all</button>
      <button class="btn secondary" ${S.busy ? 'disabled' : ''} onclick="fixAllTags()" title="Adds/removes Vendor-XXX, shared and fiber tags where the last check flagged them">Fix tags for all</button>
      <span class="grow"></span>
      <label style="margin:0">Lock template</label>
      <select style="width:auto" onchange="setTemplate(this.value)" ${S.busy ? 'disabled' : ''}>
        <option value="">— none (use standard settings) —</option>
        ${withLock.map(v => `<option value="${esc(v.code)}" ${v.code === S.template ? 'selected' : ''}>${esc(v.name)} (${esc(v.code)})</option>`).join('')}
      </select>
    </div>
    ${!S.template ? `<div class="hint" style="margin-top:6px">Pick a vendor whose lock is set up exactly right. New locks copy its settings (protect products, shop channel and the rest), and Check compares every lock against it. Run Check all first so the lock IDs are filled in.</div>`
      : !tplV || !tplV.lock_id ? `<div class="hint bad" style="margin-top:6px">${esc(S.template)} has no lock ID saved yet — run Check on it.</div>` : ''}
    <div class="strip">
      ${[['all', 'All'], ['bad', 'Needs fixing'], ['warn', 'Notes'], ['ok', 'Set up'], ['none', 'Not checked']].map(([k, l]) =>
        `<span class="stat ${S.filter === k ? 'on' : ''}" onclick="setFilter('${k}')">${l} ${counts[k]}</span>`).join('')}
    </div>
    ${list.length ? list.map(vendorCard).join('') : '<div class="empty">Nothing here.</div>'}
  </div>`;
  renderFormHints();
}

grist.ready({ requiredAccess: 'full' });
load();
</script>
</body>
</html>
