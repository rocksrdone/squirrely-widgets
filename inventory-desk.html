<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Desk</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@700&family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC; --muted: #8B7D72;
  --accent: #8B3A2A; --accent-light: #F2E8E5;
  --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8;
  --held: #6B5E52;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif;
  font-size: 13px; line-height: 1.5; padding: 14px;
}
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; }
.sub { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }

.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search {
  flex: 1; min-width: 160px; padding: 7px 10px; border: 1px solid var(--rule);
  border-radius: 6px; font-size: 12.5px; font-family: 'Inter', sans-serif; outline: none;
}
.btn {
  font-size: 12px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rule); background: white; color: var(--ink); font-family: 'Inter', sans-serif;
}
.btn:hover { border-color: var(--accent); }
.btn.solid { background: var(--teal); border-color: var(--teal); color: white; }
.btn.tiny { font-size: 11px; padding: 4px 9px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { border-color: var(--rule); }

/* Totals across everything, so a number that moves is visible at a glance. */
.totals { display: flex; gap: 0; margin-bottom: 14px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tot { flex: 1; padding: 9px 12px; background: white; border-right: 1px solid var(--rule); }
.tot:last-child { border-right: none; }
.tot .n { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; }
.tot .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tot.held .n { color: var(--held); }
.tot.vendor .n { color: var(--teal); }
.tot.retail .n { color: var(--gold); }

.card { background: white; border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 7px; }
.card-head {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
}
.card-head:hover { background: var(--paper); }
.cw-name { font-weight: 600; font-size: 13.5px; }
.cw-meta { font-size: 10.5px; color: var(--muted); }
/* ── One colour per fibre ─────────────────────────────────────────────────
   Deliberately OUTSIDE the bucket palette. Teal already means "vendor store",
   gold means "retail store" and brown means "held back", all of them in the
   same row as the fibre tag — so a fibre borrowing one of those colours would
   collide with the thing it sits beside. Blue, violet and magenta are free.

   This matters most when a colourway is listed in ONE fibre: there is no second
   row to compare against, so the colour is the only thing saying which spool
   you are about to put on sale. */
.fiber-tag {
  font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px;
  border-radius: 4px; background: var(--warm); color: var(--held); border: 1px solid var(--rule);
  white-space: nowrap;
}
.fib-ffn  { background: #E7EEFA; color: #2F5FA8; border-color: #A9C2E8; }
.fib-en   { background: #F2E9F9; color: #7A3FA8; border-color: #CEB2E4; }
.fib-ffc  { background: #FAE8F1; color: #A8366F; border-color: #E6B3CC; }
.fib-bw   { background: #E8E6E3; color: #2A2A2A; border-color: #BDB8B2; }
/* The same colour as a 4px edge, which is what you actually catch at a glance
   when scanning a column of cards rather than reading one. */
.edge-ffn { border-left: 4px solid #2F5FA8; }
.edge-en  { border-left: 4px solid #7A3FA8; }
.edge-ffc { border-left: 4px solid #A8366F; }
.edge-bw  { border-left: 4px solid #2A2A2A; }
.edge-other { border-left: 4px solid var(--rule); }
.fb-head { border-left-width: 4px; border-left-style: solid; }
.buckets { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.bucket {
  min-width: 62px; text-align: center; padding: 4px 8px; border-radius: 5px;
  border: 1px solid var(--rule); background: var(--paper);
}
.bucket .n { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; display: block; }
.bucket .l { font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.bucket.held { border-color: #C9BCAE; }
.bucket.held .n { color: var(--held); }
.bucket.vendor { border-color: #9ACFC7; background: var(--teal-light); }
.bucket.vendor .n { color: var(--teal); }
.bucket.retail { border-color: #D4B07A; background: var(--gold-light); }
.bucket.retail .n { color: var(--gold); }
.bucket.zero { opacity: .4; }
.onhand { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; min-width: 38px; text-align: right; }

.body { border-top: 1px solid var(--rule); padding: 11px 12px; }
.moverow { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.qty-in {
  width: 58px; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 5px;
  font-size: 12.5px; text-align: center; font-family: 'DM Mono', monospace;
}
select.pick {
  padding: 5px 7px; border: 1px solid var(--rule); border-radius: 5px;
  font-size: 12px; font-family: 'Inter', sans-serif; background: white;
}
.arrow { color: var(--muted); font-size: 13px; }
.hint { font-size: 10.5px; color: var(--muted); margin-top: 7px; line-height: 1.5; }

.card.multi { border-color: #9ACFC7; }
.fibre-block { border-top: 1px solid var(--rule); }
.fibre-block:first-of-type { border-top: 1px solid var(--warm); }
.fb-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px 4px; }
.fb-fiber { font-weight: 700; font-size: 12.5px; }
.fb-sku { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--muted); }
.fiber-tag.multi { background: var(--gold-light); color: var(--gold); border-color: #D4B07A; }
.lots { margin-top: 10px; border-top: 1px dotted var(--rule); padding-top: 8px; }
.lot-line {
  display: flex; gap: 10px; align-items: center; font-size: 11.5px;
  padding: 3px 0; color: #4A403A;
}
.lot-no { font-family: 'DM Mono', monospace; font-size: 11px; min-width: 108px; }
.lot-b { font-family: 'DM Mono', monospace; font-size: 11px; min-width: 34px; text-align: right; }
.lot-age { color: var(--muted); font-size: 10px; margin-left: auto; }
/* Three bare numbers per lot are unreadable without saying which is which —
   this is an auditing view, so the columns are labelled. */
.lot-head span { font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); font-family: 'Inter', sans-serif; }
.lot-head { border-bottom: 1px solid var(--warm); padding-bottom: 2px; margin-bottom: 2px; }

.log { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 9px; }
.log-line {
  display: flex; gap: 9px; align-items: baseline; font-size: 11.5px;
  padding: 3px 0; border-bottom: 1px solid var(--warm);
}
.undo { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 10.5px; margin-left: auto; }
.empty { color: var(--muted); font-style: italic; padding: 26px; text-align: center; }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px;
  font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
}
.toast.show { opacity: 1; }
/* Store comparison. Muted when it agrees, loud only when it does not — an
   audit screen that shouts on every row teaches you to stop reading it. */
.cmp { font-size: 10.5px; margin-left: 8px; white-space: nowrap; }
.cmp.ok { color: var(--teal); }
.cmp.bad { color: var(--accent); font-weight: 600; }
.cmp.unknown { color: var(--muted); font-style: italic; }
.store-bar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: white; border: 1px solid var(--rule); border-radius: 8px;
  padding: 9px 12px; margin-bottom: 12px; font-size: 12px;
}
.store-bar .stamp { color: var(--muted); font-size: 11px; }
.store-bar .bad { color: var(--accent); font-weight: 600; }
.warn-banner {
  background: var(--gold-light); border: 1px solid #D4B07A; color: #7A5518;
  padding: 8px 11px; border-radius: 6px; font-size: 11.5px; margin-bottom: 12px; line-height: 1.5;
}
</style>
</head>
<body>

<div class="title">Inventory Desk</div>
<div class="sub">Every colourway you physically have, and where each spool is listed.</div>
<div id="banner"></div>
<div class="toolbar">
  <input class="search" id="search" placeholder="Search colourway or SKU…">
  <button class="btn" id="showAll">Show colourways with none on hand</button>
  <button class="btn" id="checkStores">Check stores</button>
  <button class="btn" id="reload">↻ Reload</button>
</div>
<div id="totals"></div>
<div id="storeBar"></div>
<div id="list"><div class="empty">Loading…</div></div>
<div id="log"></div>
<div class="toast" id="toast"></div>

<script>
/* ── Inventory Desk ───────────────────────────────────────────────────────
   One physical pile per colourway; the three stock columns on Production_Lots
   say where that pile is LISTED, not which shelf it sits on:

     General_Stock_Spools  held back, listed nowhere (LEs, waiting for the
                           monthly retail push)
     Vendor_Stock_Spools   live on the vendor store
     Store_Stock_Spools    live on the retail store

   On hand = General + Vendor + Store. Moving between the columns IS the act of
   listing or de-listing, which is the thing that had no home before and sent
   people into Grist by hand.

   Deliberately NOT a Shopify sync. Nothing here talks to either store — Grist
   is not the master and a wrong automatic write to a live storefront is far
   worse than a number being stale. The comparison against what each store
   actually reports is a separate step that needs an n8n webhook to fetch it. */

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function columnAsArray(t, c) { return c && Array.isArray(t[c]) ? t[c] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k =>
      k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function normalize(s) { return (s || '').toString().toLowerCase().replace(/[^a-z0-9]/g, ''); }
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function fiberCode(f) {
  const s = (f || '').toString().trim().toUpperCase();
  if (!s) return '';
  if (/^(FFN|FFC|EN|BW|CN)$/.test(s)) return s;
  if (/E\s*NYLON/.test(s)) return 'EN';
  if (/COTTON/.test(s)) return 'FFC';
  if (/NYLON/.test(s)) return 'FFN';
  return s;
}
/* Fibre -> css suffix. Unknown fibres get the neutral edge rather than an
   invented colour, because a colour nobody assigned means nothing. */
function fibClass(code) {
  const c = (code || '').toString().toUpperCase();
  return ['FFN', 'EN', 'FFC', 'BW'].includes(c) ? c.toLowerCase() : 'other';
}
function fiberTag(r) {
  const name = r.fiberName || r.fiber;
  if (!name) return '';
  return `<span class="fiber-tag fib-${fibClass(r.fiber)}">${esc(name)}</span>`;
}

function daysSince(v) {
  const n = Number(v);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.floor((Date.now() / 1000 - n) / 86400);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

/* The three buckets, in the order they are shown and in the order a fallback
   picks them. `col` is filled in from the document's real column ids at load. */
const BUCKETS = [
  { key: 'held',   label: 'Held back',    short: 'held',   cands: ['General_Stock_Spools'] },
  { key: 'vendor', label: 'Vendor store', short: 'vendor', cands: ['Vendor_Stock_Spools'] },
  { key: 'retail', label: 'Retail store', short: 'retail', cands: ['Store_Stock_Spools'] },
];

let S = {
  cols: null, recipes: {}, lots: [], byRecipe: [],
  search: '', showEmpty: false, open: {},
  moveQty: {}, moveFrom: {}, moveTo: {},
  log: [], ready: false,
  store: null, storeLoading: false, storeError: '',
};

/* Read-only snapshot of what the vendor store actually reports, via
   "SS - Store Inventory Snapshot". A widget cannot call the Shopify Admin API
   itself — the token cannot live in client-side code and CORS blocks it — so
   n8n holds the credential and this only ever reads the result.

   Nothing on this screen writes to Shopify. The comparison exists so YOU can
   decide what to correct and where; an automatic reconcile would be writing to
   a live storefront off a number that might itself be the stale one. */
const STORE_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/store-inventory';

async function loadAll() {
  try {
    const [lotsT, recT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Recipes'),
    ]);

    const LOT = {
      recipe: findColumn(lotsT, ['Recipe']),
      lotNumber: findColumn(lotsT, ['Lot_Number']),
      date: findColumn(lotsT, ['Date_Dyed']),
      fiber: findColumn(lotsT, ['Fiber']),
      made: findColumn(lotsT, ['Spools_Made']),
    };
    BUCKETS.forEach(b => { b.col = findColumn(lotsT, b.cands); });
    const missing = BUCKETS.filter(b => !b.col);

    const REC = {
      name: findColumn(recT, ['Recipe_Name']),
      sku: findColumn(recT, ['SKU_Base']),
      fiber: findColumn(recT, ['Fiber_Type']),
    };

    S.recipes = {};
    (recT.id || []).forEach((id, i) => {
      S.recipes[id] = {
        id,
        name: columnAsArray(recT, REC.name)[i] || `Recipe #${id}`,
        sku: columnAsArray(recT, REC.sku)[i] || '',
        fiber: fiberCode(columnAsArray(recT, REC.fiber)[i] || ''),
        /* The CODE is for matching; the NAME is for reading. This screen lists
           spools on live storefronts, and "FFN" beside "EN" is exactly the
           glance-alike pair that gets the wrong product put on sale. */
        fiberName: String(columnAsArray(recT, REC.fiber)[i] || '').trim(),
      };
    });

    S.lots = [];
    (lotsT.id || []).forEach((id, i) => {
      const rid = getRefId(columnAsArray(lotsT, LOT.recipe)[i]);
      if (!rid) return;   // a lot with no recipe can't be attributed to a colourway
      const vals = {};
      BUCKETS.forEach(b => { vals[b.key] = b.col ? num(columnAsArray(lotsT, b.col)[i]) : 0; });
      S.lots.push({
        id, recipeId: rid,
        lotNumber: columnAsArray(lotsT, LOT.lotNumber)[i] || `Lot #${id}`,
        date: LOT.date ? columnAsArray(lotsT, LOT.date)[i] : 0,
        fiber: fiberCode(columnAsArray(lotsT, LOT.fiber)[i] || ''),
        made: LOT.made ? num(columnAsArray(lotsT, LOT.made)[i]) : 0,
        vals,
      });
    });

    // Oldest first everywhere, so a move rotates stock without being asked to.
    S.lots.sort((a, b) => (Number(a.date) || 0) - (Number(b.date) || 0));

    const map = new Map();
    S.lots.forEach(l => {
      if (!map.has(l.recipeId)) {
        const r = S.recipes[l.recipeId] || { name: `Recipe #${l.recipeId}`, sku: '', fiber: '' };
        map.set(l.recipeId, { recipeId: l.recipeId, recipe: r, lots: [], held: 0, vendor: 0, retail: 0 });
      }
      const g = map.get(l.recipeId);
      g.lots.push(l);
      BUCKETS.forEach(b => { g[b.key] += l.vals[b.key]; });
    });
    S.byRecipe = [...map.values()]
      .map(g => { g.onHand = g.held + g.vendor + g.retail; return g; })
      .sort((a, b) => String(a.recipe.name).localeCompare(String(b.recipe.name)));

    /* ── One card per COLOURWAY, fibres as rows inside it ──────────────────
       FF and E of one colour are separate recipes with separate SKUs, and they
       sorted next to each other under the same name, told apart by a 9px tag.
       Moving spools here is the act of LISTING them on a storefront, so a
       mis-click puts the wrong product on sale and the first you hear of it is
       from a customer.

       Grouping them removes the error rather than warning about it: there is no
       wrong card to click, because each fibre is a labelled row carrying its own
       SKU beside its own buttons.

       A colourway in ONE fibre renders exactly as before. Restructuring every
       card to guard against an ambiguity most of them do not have would be
       paying the cost everywhere to fix it in a few places. */
    const cwMap = new Map();
    S.byRecipe.forEach(g => {
      const k = normalize(g.recipe.name) || ('r' + g.recipeId);
      if (!cwMap.has(k)) cwMap.set(k, { key: k, name: g.recipe.name, members: [] });
      cwMap.get(k).members.push(g);
    });
    S.byColourway = [...cwMap.values()].map(c => {
      /* FF first, then E, then the rest. Alphabetical put EN above FFN, which
         reads as though E were the primary — it is the variant. Stable, so a
         row never moves under the pointer. */
      const rank = (g) => ({ FFN: 0, EN: 1, FFC: 2 })[g.recipe.fiber] ?? 3;
      c.members.sort((a, b) => rank(a) - rank(b)
        || String(a.recipe.fiber).localeCompare(String(b.recipe.fiber)));
      BUCKETS.forEach(b => { c[b.key] = c.members.reduce((t, g) => t + g[b.key], 0); });
      c.onHand = c.members.reduce((t, g) => t + g.onHand, 0);
      c.multi = c.members.length > 1;
      return c;
    }).sort((a, b) => String(a.name).localeCompare(String(b.name)));

    S.cols = { LOT };
    S.ready = true;
    document.getElementById('banner').innerHTML = missing.length
      ? `<div class="warn-banner"><strong>${missing.map(b => esc(b.cands[0])).join(', ')}</strong>
          ${missing.length === 1 ? 'is' : 'are'} not on Production_Lots, so that bucket always reads 0 and
          cannot be moved into. Add the column${missing.length === 1 ? '' : 's'} to use it.</div>`
      : '';
    render();
  } catch (e) {
    console.error('Inventory Desk: load failed', e);
    document.getElementById('list').innerHTML =
      `<div class="empty">Could not load — ${esc(e && e.message ? e.message : e)}</div>`;
  }
}

async function checkStores() {
  if (S.storeLoading) return;
  S.storeLoading = true; S.storeError = '';
  render();
  try {
    const res = await fetch(STORE_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ from: 'inventory-desk' }),
    });
    if (!res.ok) throw new Error('webhook returned ' + res.status);
    const data = await res.json();
    if (data && data.ok === false) throw new Error(data.error || 'the workflow reported a failure');
    const bySku = {};
    (data.variants || []).forEach(v => { bySku[normalize(v.sku)] = v; });
    S.store = { ...data, bySku };
  } catch (e) {
    console.error('Inventory Desk: store check failed', e);
    S.store = null;
    S.storeError = (e && e.message) ? e.message : String(e);
  }
  S.storeLoading = false;
  render();
}

/* What the vendor store says about one colourway, against what Grist claims is
   listed there. Returns null when there is nothing to say, so an un-checked
   screen looks exactly as it did before. */
function storeCmp(g) {
  if (!S.store) return null;
  const sku = g.recipe.sku;
  if (!sku) return { kind: 'unknown', text: 'no SKU on the recipe' };
  const v = S.store.bySku[normalize(sku)];
  if (!v) {
    return g.vendor > 0
      ? { kind: 'bad', text: `not on the vendor store, but Grist lists ${g.vendor}` }
      : { kind: 'unknown', text: 'not on the vendor store' };
  }
  // Quantity alone is misleading: stock on a draft product cannot be bought.
  if (!v.active && (v.qty > 0 || g.vendor > 0)) {
    return { kind: 'bad', text: `Shopify ${v.qty}, product is ${v.status} — not buyable` };
  }
  if (v.qty === g.vendor) return { kind: 'ok', text: `Shopify ${v.qty} \u2713` };
  const d = v.qty - g.vendor;
  return { kind: 'bad', text: `Shopify ${v.qty} (${d > 0 ? '+' : ''}${d})` };
}

function storeBarHtml() {
  const el = document.getElementById('storeBar');
  if (!el) return;
  if (S.storeLoading) { el.innerHTML = `<div class="store-bar">Reading the vendor store\u2026</div>`; return; }
  if (S.storeError) {
    el.innerHTML = `<div class="store-bar"><span class="bad">Could not read the vendor store</span>
      <span class="stamp">${esc(S.storeError)}</span>
      <span class="stamp">Grist figures below are unaffected.</span></div>`;
    return;
  }
  if (!S.store) { el.innerHTML = ''; return; }

  const rows = visibleRecipes();
  const diffs = rows.map(g => ({ g, c: storeCmp(g) })).filter(x => x.c && x.c.kind === 'bad');
  const c = S.store.counts || {};
  el.innerHTML = `<div class="store-bar">
    <span><strong>${diffs.length}</strong> ${diffs.length === 1 ? 'colourway disagrees' : 'colourways disagree'} with the vendor store</span>
    <span class="stamp">${c.variants || 0} SKUs read${c.not_active ? ` \u00b7 ${c.not_active} not active` : ''} \u00b7 ${
      S.store.fetched_at ? new Date(S.store.fetched_at).toLocaleTimeString() : ''}</span>
    ${S.store.truncated ? '<span class="bad">partial snapshot \u2014 250-product cap hit</span>' : ''}
    ${(S.store.notes || []).map(n => `<span class="stamp">${esc(n)}</span>`).join('')}
    <span class="stamp">Comparison only \u2014 nothing is written to Shopify.</span>
  </div>`;
}

function visible() {
  const q = normalize(S.search);
  return (S.byColourway || []).filter(c => {
    if (!S.showEmpty && c.onHand <= 0) return false;
    if (!q) return true;
    // A SKU search must find the colourway through ANY of its fibres.
    return normalize(c.name).includes(q)
      || c.members.some(g => normalize(g.recipe.sku).includes(q));
  });
}
/* The store comparison is per SKU, so it works on recipes, not colourways. */
function visibleRecipes() {
  return visible().reduce((a, c) => a.concat(c.members), []);
}

function bucketHtml(g, b) {
  const v = g[b.key];
  return `<div class="bucket ${b.key} ${v ? '' : 'zero'}">
    <span class="n">${v}</span><span class="l">${esc(b.short)}</span>
  </div>`;
}

function cmpHtml(g) {
  const c = storeCmp(g);
  return c ? `<span class="cmp ${c.kind}">${esc(c.text)}</span>` : '';
}

/* The move controls and lot list for ONE recipe — one fibre of one colourway.
   Unchanged in substance; it just no longer owns the card. */
function fibreBlockHtml(g) {
  const r = g.recipe;
  const from = S.moveFrom[g.recipeId] || 'held';
  const to = S.moveTo[g.recipeId] || (from === 'held' ? 'vendor' : 'held');
  const qty = S.moveQty[g.recipeId] !== undefined ? S.moveQty[g.recipeId] : '';
  const avail = g[from] || 0;
  const n = Math.max(0, Number(qty) || 0);
  const canMove = n > 0 && n <= avail && from !== to;

  const lotLines = g.lots.map(l => {
    const d = daysSince(l.date);
    const tot = BUCKETS.reduce((a, b) => a + l.vals[b.key], 0);
    if (!tot && !S.showEmpty) return '';
    return `<div class="lot-line">
      <span class="lot-no">${esc(l.lotNumber)}</span>
      ${BUCKETS.map(b => `<span class="lot-b" title="${esc(b.label)}">${l.vals[b.key] || '·'}</span>`).join('')}
      <span class="lot-age">${d === null ? '' : d + 'd old'}</span>
    </div>`;
  }).join('');

  return `<div class="fibre-block">
    <div class="fb-head edge-${fibClass(r.fiber)}">
      <div>
        <div class="fb-fiber fib-${fibClass(r.fiber)}" style="background:none;border:none;padding:0">${
          esc(r.fiberName || r.fiber || 'no fibre set')}</div>
        <div class="fb-sku">${esc(r.sku || 'no SKU')}${g.lots.length ? ` · ${g.lots.length} lot${g.lots.length === 1 ? '' : 's'}` : ''}</div>
      </div>
      <div class="buckets">
        ${BUCKETS.map(b => bucketHtml(g, b)).join('')}
        ${cmpHtml(g)}
        <span class="onhand" title="On hand — the sum of all three">${g.onHand}</span>
      </div>
    </div>
    <div class="body">
      <div class="moverow">
        <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Move</span>
        <input class="qty-in" data-qty="${g.recipeId}" value="${esc(String(qty))}" placeholder="0">
        <select class="pick" data-from="${g.recipeId}">
          ${BUCKETS.map(b => `<option value="${b.key}" ${from === b.key ? 'selected' : ''}>from ${esc(b.label)} (${g[b.key]})</option>`).join('')}
        </select>
        <span class="arrow">→</span>
        <select class="pick" data-to="${g.recipeId}">
          ${BUCKETS.map(b => `<option value="${b.key}" ${to === b.key ? 'selected' : ''}>to ${esc(b.label)}</option>`).join('')}
        </select>
        <button class="btn tiny solid" data-move="${g.recipeId}" ${canMove ? '' : 'disabled'}>Move</button>
        ${g[from] > 0 ? `<button class="btn tiny" data-all="${g.recipeId}">All ${g[from]}</button>` : ''}
      </div>
      <div class="hint">${
        from === to ? 'Pick two different places.'
        : n > avail ? `Only ${avail} in ${esc(BUCKETS.find(b => b.key === from).label.toLowerCase())}.`
        : 'Nothing is sent to Shopify — this only records where the spools are listed. Oldest lot is drawn from first.'
      }</div>
      ${lotLines ? `<div class="lots">
        <div class="lot-line lot-head">
          <span class="lot-no">Lot</span>
          ${BUCKETS.map(b => `<span class="lot-b">${esc(b.short)}</span>`).join('')}
          <span class="lot-age"></span>
        </div>
        ${lotLines}</div>` : ''}
    </div>
  </div>`;
}

/* The card is the colourway. With one fibre it reads as it always did; with
   more, each fibre is its own labelled row carrying its own SKU. */
function cardHtml(c) {
  const open = !!S.open[c.key];
  const fibres = c.members.map(g => g.recipe.fiberName || g.recipe.fiber || '?').join(' + ');
  /* A single-fibre card wears the fibre's colour as its own left edge — the
     only cue available when there is nothing beside it to compare with. A
     multi-fibre card stays neutral at the top and colours each block instead,
     so the edge never claims a fibre the card does not solely contain. */
  const edge = c.multi ? 'edge-other' : `edge-${fibClass(c.members[0].recipe.fiber)}`;
  return `<div class="card${c.multi ? ' multi' : ''} ${edge}">
    <div class="card-head" data-toggle="${esc(c.key)}">
      <div>
        <div class="cw-name">${esc(c.name)} ${c.members.map(g => fiberTag(g.recipe)).join(' ')}</div>
        <div class="cw-meta">${c.multi
          ? `${c.members.length} fibres — ${esc(c.members.map(g => g.recipe.sku || '?').join(', '))}`
          : esc(c.members[0].recipe.sku || '')}</div>
      </div>
      <div class="buckets">
        ${BUCKETS.map(b => `<div class="bucket ${b.key} ${c[b.key] ? '' : 'zero'}"
          title="${c.multi ? 'Combined across ' + c.members.length + ' fibres — open to see the split' : esc(b.label)}">
          <span class="n">${c[b.key]}</span><span class="l">${esc(b.short)}</span></div>`).join('')}
        ${c.multi ? '' : cmpHtml(c.members[0])}
        <span class="onhand" title="On hand">${c.onHand}</span>
      </div>
    </div>
    ${open ? c.members.map(fibreBlockHtml).join('') : ''}
  </div>`;
}

function render() {
  if (!S.ready) return;
  const rows = visible();

  const tot = { held: 0, vendor: 0, retail: 0 };
  S.byRecipe.forEach(g => BUCKETS.forEach(b => { tot[b.key] += g[b.key]; }));
  const onHand = tot.held + tot.vendor + tot.retail;
  document.getElementById('totals').innerHTML = `<div class="totals">
    <div class="tot"><div class="n">${onHand}</div><div class="l">On hand</div></div>
    <div class="tot held"><div class="n">${tot.held}</div><div class="l">Held back</div></div>
    <div class="tot vendor"><div class="n">${tot.vendor}</div><div class="l">Vendor store</div></div>
    <div class="tot retail"><div class="n">${tot.retail}</div><div class="l">Retail store</div></div>
  </div>`;

  document.getElementById('list').innerHTML = rows.length
    ? rows.map(cardHtml).join('')
    : `<div class="empty">${S.search ? 'Nothing matches that.' : 'No colourways with spools on hand.'}</div>`;

  document.getElementById('showAll').textContent = S.showEmpty
    ? 'Hide colourways with none on hand' : 'Show colourways with none on hand';

  wire();
  storeBarHtml();
  renderLog();
}

function wire() {
  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.toggle;
    S.open[k] = !S.open[k];
    render();
  }));
  document.querySelectorAll('[data-qty]').forEach(el => el.addEventListener('input', () => {
    S.moveQty[Number(el.dataset.qty)] = el.value;
    render();
    const again = document.querySelector(`[data-qty="${el.dataset.qty}"]`);
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  }));
  document.querySelectorAll('[data-from]').forEach(el => el.addEventListener('change', () => {
    S.moveFrom[Number(el.dataset.from)] = el.value;
    render();
  }));
  document.querySelectorAll('[data-to]').forEach(el => el.addEventListener('change', () => {
    S.moveTo[Number(el.dataset.to)] = el.value;
    render();
  }));
  document.querySelectorAll('[data-all]').forEach(el => el.addEventListener('click', () => {
    const id = Number(el.dataset.all);
    const g = S.byRecipe.find(x => x.recipeId === id);
    if (g) S.moveQty[id] = String(g[S.moveFrom[id] || 'held'] || 0);
    render();
  }));
  document.querySelectorAll('[data-move]').forEach(el =>
    el.addEventListener('click', () => doMove(Number(el.dataset.move))));
}

function renderLog() {
  document.getElementById('log').innerHTML = S.log.length
    ? `<div class="log">${S.log.map((e, i) => `
        <div class="log-line"><span>${esc(e.text)}</span>
        <span class="undo" data-undo="${i}">↺ undo</span></div>`).join('')}</div>`
    : '';
  document.querySelectorAll('[data-undo]').forEach(el =>
    el.addEventListener('click', () => undo(Number(el.dataset.undo))));
}

/* Move spools between two buckets for one colourway.

   Drawn oldest lot first so stock rotates, and applied per lot: the whole point
   is that a colourway's pile is spread across several lots, and a move that
   wrote a single total somewhere would lose which lot the spools came from —
   which is what makes a lot's arithmetic stop balancing. Both columns of a lot
   are written in the same action, so the lot's total never changes. */
async function doMove(recipeId) {
  const g = S.byRecipe.find(x => x.recipeId === recipeId);
  if (!g) return;
  const from = S.moveFrom[recipeId] || 'held';
  const to = S.moveTo[recipeId] || 'vendor';
  if (from === to) { showToast('Pick two different places'); return; }
  const want = Math.max(0, Number(S.moveQty[recipeId]) || 0);
  if (!want) { showToast('Set a quantity first'); return; }

  const fromB = BUCKETS.find(b => b.key === from);
  const toB = BUCKETS.find(b => b.key === to);
  if (!fromB.col || !toB.col) { showToast('That column does not exist on Production_Lots'); return; }
  if (want > g[from]) { showToast(`Only ${g[from]} in ${fromB.label.toLowerCase()}`); return; }

  let left = want;
  const actions = [], inverse = [], touched = [];
  for (const l of g.lots) {          // already oldest-first
    if (left <= 0) break;
    const have = l.vals[from];
    if (have <= 0) continue;
    const take = Math.min(have, left);
    left -= take;
    actions.push(['UpdateRecord', 'Production_Lots', l.id, {
      [fromB.col]: l.vals[from] - take,
      [toB.col]: l.vals[to] + take,
    }]);
    inverse.push(['UpdateRecord', 'Production_Lots', l.id, {
      [fromB.col]: l.vals[from],
      [toB.col]: l.vals[to],
    }]);
    touched.push(`${l.lotNumber} ${take}`);
  }
  if (!actions.length) { showToast('Nothing to move'); return; }

  try {
    await grist.docApi.applyUserActions(actions);
    S.log.unshift({
      text: `${want} × ${g.recipe.name} — ${fromB.label.toLowerCase()} → ${toB.label.toLowerCase()}` +
        (touched.length > 1 ? ` (${touched.length} lots)` : ` (${touched[0]})`),
      inverse,
    });
    delete S.moveQty[recipeId];
    showToast('Moved ✓');
    await loadAll();
  } catch (e) {
    console.error('Inventory Desk: move failed', e);
    showToast('Move failed — check Production_Lots');
  }
}

async function undo(i) {
  const entry = S.log[i];
  if (!entry) return;
  try {
    await grist.docApi.applyUserActions(entry.inverse);
    S.log.splice(i, 1);
    showToast('Undone');
    await loadAll();
  } catch (e) {
    console.error('Inventory Desk: undo failed', e);
    showToast('Undo failed — check the console');
  }
}

document.getElementById('search').addEventListener('input', (e) => { S.search = e.target.value; render(); });
document.getElementById('showAll').addEventListener('click', () => { S.showEmpty = !S.showEmpty; render(); });
document.getElementById('reload').addEventListener('click', () => loadAll());
document.getElementById('checkStores').addEventListener('click', () => checkStores());

// Static shell is already rendered. Only now talk to Grist.
try {
  grist.ready({ requiredAccess: 'full' });
  loadAll();
} catch (e) {
  document.getElementById('list').innerHTML =
    `<div class="empty">Grist plugin API unavailable: ${esc(e && e.message ? e.message : e)}</div>`;
}
</script>
</body>
</html>
