<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Desk</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@700&family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC; --muted: #8B7D72;
  --accent: #8B3A2A; --accent-light: #F2E8E5;
  --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8;
  --held: #6B5E52;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif;
  font-size: 13px; line-height: 1.5; padding: 14px;
}
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; }
.sub { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }

.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.search {
  flex: 1; min-width: 160px; padding: 7px 10px; border: 1px solid var(--rule);
  border-radius: 6px; font-size: 12.5px; font-family: 'Inter', sans-serif; outline: none;
}
.btn {
  font-size: 12px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rule); background: white; color: var(--ink); font-family: 'Inter', sans-serif;
}
.btn:hover { border-color: var(--accent); }
.btn.solid { background: var(--teal); border-color: var(--teal); color: white; }
.btn.tiny { font-size: 11px; padding: 4px 9px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { border-color: var(--rule); }

/* Totals across everything, so a number that moves is visible at a glance. */
.totals { display: flex; gap: 0; margin-bottom: 14px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tot { flex: 1; padding: 9px 12px; background: white; border-right: 1px solid var(--rule); }
.tot:last-child { border-right: none; }
.tot .n { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; }
.tot .l { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tot.held .n { color: var(--held); }
.tot.vendor .n { color: var(--teal); }
.tot.retail .n { color: var(--gold); }

.card { background: white; border: 1px solid var(--rule); border-radius: 8px; margin-bottom: 7px; }
.card-head {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer;
}
.card-head:hover { background: var(--paper); }
.cw-name { font-weight: 600; font-size: 13.5px; }
.cw-meta { font-size: 10.5px; color: var(--muted); }
/* ── One colour per fibre ─────────────────────────────────────────────────
   Deliberately OUTSIDE the bucket palette. Teal already means "vendor store",
   gold means "retail store" and brown means "held back", all of them in the
   same row as the fibre tag — so a fibre borrowing one of those colours would
   collide with the thing it sits beside. Blue, violet and magenta are free.

   This matters most when a colourway is listed in ONE fibre: there is no second
   row to compare against, so the colour is the only thing saying which spool
   you are about to put on sale. */
.fiber-tag {
  font-size: 10.5px; font-weight: 700; letter-spacing: .03em; padding: 2px 7px;
  border-radius: 4px; background: var(--warm); color: var(--held); border: 1px solid var(--rule);
  white-space: nowrap;
}
.fib-ffn  { background: #E7EEFA; color: #2F5FA8; border-color: #A9C2E8; }
.fib-en   { background: #F2E9F9; color: #7A3FA8; border-color: #CEB2E4; }
.fib-ffc  { background: #FAE8F1; color: #A8366F; border-color: #E6B3CC; }
.fib-bw   { background: #E8E6E3; color: #2A2A2A; border-color: #BDB8B2; }
/* The same colour as a 4px edge, which is what you actually catch at a glance
   when scanning a column of cards rather than reading one. */
.edge-ffn { border-left: 4px solid #2F5FA8; }
.edge-en  { border-left: 4px solid #7A3FA8; }
.edge-ffc { border-left: 4px solid #A8366F; }
.edge-bw  { border-left: 4px solid #2A2A2A; }
.edge-other { border-left: 4px solid var(--rule); }
.fb-head { border-left-width: 4px; border-left-style: solid; }
.buckets { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.bucket {
  min-width: 62px; text-align: center; padding: 4px 8px; border-radius: 5px;
  border: 1px solid var(--rule); background: var(--paper);
}
.bucket .n { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; display: block; }
.bucket .l { font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.bucket.held { border-color: #C9BCAE; }
.bucket.held .n { color: var(--held); }
.bucket.vendor { border-color: #9ACFC7; background: var(--teal-light); }
.bucket.vendor .n { color: var(--teal); }
.bucket.retail { border-color: #D4B07A; background: var(--gold-light); }
.bucket.retail .n { color: var(--gold); }
.bucket.zero { opacity: .4; }
.onhand { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; min-width: 38px; text-align: right; }

.body { border-top: 1px solid var(--rule); padding: 11px 12px; }
.moverow { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.qty-in {
  width: 58px; padding: 5px 6px; border: 1px solid var(--rule); border-radius: 5px;
  font-size: 12.5px; text-align: center; font-family: 'DM Mono', monospace;
}
/* Form controls don't inherit text colour. On a computer set to dark mode the
   browser drew them light-on-white, so the choices were invisible. Pin both. */
:root { color-scheme: light; }
select.pick, select.pick option {
  padding: 5px 7px; border: 1px solid var(--rule); border-radius: 5px;
  font-size: 12px; font-family: 'Inter', sans-serif; background: white; color: var(--ink);
}
.qty-in { background: white; color: var(--ink); }
.arrow { color: var(--muted); font-size: 13px; }
.hint { font-size: 10.5px; color: var(--muted); margin-top: 7px; line-height: 1.5; }

.card.multi { border-color: #9ACFC7; }
.fibre-block { border-top: 1px solid var(--rule); }
.fibre-block:first-of-type { border-top: 1px solid var(--warm); }
.fb-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px 4px; }
.fb-fiber { font-weight: 700; font-size: 12.5px; }
.fb-sku { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--muted); }
.fiber-tag.multi { background: var(--gold-light); color: var(--gold); border-color: #D4B07A; }
.lots { margin-top: 10px; border-top: 1px dotted var(--rule); padding-top: 8px; }
.lot-line {
  display: flex; gap: 10px; align-items: center; font-size: 11.5px;
  padding: 3px 0; color: #4A403A;
}
.lot-no { font-family: 'DM Mono', monospace; font-size: 11px; min-width: 108px; }
.lot-b { font-family: 'DM Mono', monospace; font-size: 11px; min-width: 34px; text-align: right; }
.lot-age { color: var(--muted); font-size: 10px; margin-left: auto; }
/* Three bare numbers per lot are unreadable without saying which is which —
   this is an auditing view, so the columns are labelled. */
.lot-head span { font-size: 8.5px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--muted); font-family: 'Inter', sans-serif; }
.lot-head { border-bottom: 1px solid var(--warm); padding-bottom: 2px; margin-bottom: 2px; }

.log { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 9px; }
.log-line {
  display: flex; gap: 9px; align-items: baseline; font-size: 11.5px;
  padding: 3px 0; border-bottom: 1px solid var(--warm);
}
.undo { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 10.5px; margin-left: auto; }
.empty { color: var(--muted); font-style: italic; padding: 26px; text-align: center; }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px;
  font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
}
.toast.show { opacity: 1; }
/* Store comparison. Muted when it agrees, loud only when it does not — an
   audit screen that shouts on every row teaches you to stop reading it. */
.cmp { font-size: 10.5px; margin-left: 8px; white-space: nowrap; }
.cmp.ok { color: var(--teal); }
.cmp.bad { color: var(--accent); font-weight: 600; }
.cmp.unknown { color: var(--muted); font-style: italic; }
.store-bar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: white; border: 1px solid var(--rule); border-radius: 8px;
  padding: 9px 12px; margin-bottom: 12px; font-size: 12px;
}
.store-bar .stamp { color: var(--muted); font-size: 11px; }
.store-bar .bad { color: var(--accent); font-weight: 600; }
/* Bins. A chip per bin the colourway's spools are recorded in. More than one
   bin for one colourway is worth seeing (they are meant to bag together), so
   the chips sit on the closed card head rather than inside it. */
.bin-chip {
  display: inline-block; font-family: 'DM Mono', monospace; font-size: 10.5px; font-weight: 500;
  padding: 0 6px; margin-right: 3px; border-radius: 4px; line-height: 17px;
  background: var(--paper); border: 1px solid var(--rule); color: var(--ink); white-space: nowrap;
}
.bin-chip.none { color: var(--accent); border-color: #D9A89C; background: var(--accent-light); font-family: 'Inter', sans-serif; }
.bin-chip.hit { background: var(--ink); color: white; border-color: var(--ink); }
.bins-line { margin-top: 3px; }
.lot-bin { font-family: 'DM Mono', monospace; font-size: 11px; min-width: 52px; }
.lot-bin.none { color: var(--accent); font-family: 'Inter', sans-serif; font-size: 10px; }
.pdf-bar {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  background: var(--teal-light); border: 1px solid #9ACFC7; border-radius: 8px;
  padding: 8px 12px; margin-bottom: 12px; font-size: 12px;
}
.pdf-bar a { color: var(--teal); font-weight: 600; }
.pdf-bar .stamp { color: var(--muted); font-size: 11px; }
.warn-banner {
  background: var(--gold-light); border: 1px solid #D4B07A; color: #7A5518;
  padding: 8px 11px; border-radius: 6px; font-size: 11.5px; margin-bottom: 12px; line-height: 1.5;
}
</style>
</head>
<body>

<div class="title">Inventory Desk</div>
<div class="sub">Every colourway you physically have, and where each spool is listed.</div>
<div id="banner"></div>
<div class="toolbar">
  <input class="search" id="search" placeholder="Search colourway or SKU…">
  <button class="btn" id="showAll">Show colourways with none on hand</button>
  <select class="pick" id="binFilter" title="Show only what is recorded in one bin"><option value="">All bins</option></select>
  <button class="btn" id="checkStores">Check stores</button>
  <button class="btn" id="binPdf" title="Printable count sheet, one section per bin">⬇ Bin check PDF</button>
  <button class="btn" id="reload">↻ Reload</button>
</div>
<div id="totals"></div>
<div id="storeBar"></div>
<div id="pdfBar"></div>
<div id="list"><div class="empty">Loading…</div></div>
<div id="log"></div>
<div class="toast" id="toast"></div>

<script>
/* ── Inventory Desk ───────────────────────────────────────────────────────
   One physical pile per colourway; the three stock columns on Production_Lots
   say where that pile is LISTED, not which shelf it sits on:

     General_Stock_Spools  held back, listed nowhere (LEs, waiting for the
                           monthly retail push)
     Vendor_Stock_Spools   live on the vendor store
     Store_Stock_Spools    live on the retail store

   On hand = General + Vendor + Store. Moving between the columns IS the act of
   listing or de-listing, which is the thing that had no home before and sent
   people into Grist by hand.

   Since 2026-10-05 General is a formula (On_Hand + Hank_Est − Vendor − Store),
   so a move writes only Vendor/Store and Held back follows. Retail lists wound
   spools only; hank can be held back or on the vendor store.

   Deliberately NOT a Shopify sync. Nothing here talks to either store — Grist
   is not the master and a wrong automatic write to a live storefront is far
   worse than a number being stale. The comparison against what each store
   actually reports is a separate step that needs an n8n webhook to fetch it. */

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function columnAsArray(t, c) { return c && Array.isArray(t[c]) ? t[c] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k =>
      k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function normalize(s) { return (s || '').toString().toLowerCase().replace(/[^a-z0-9]/g, ''); }
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function fiberCode(f) {
  const s = (f || '').toString().trim().toUpperCase();
  if (!s) return '';
  if (/^(FFN|FFC|EN|BW|CN)$/.test(s)) return s;
  if (/E\s*NYLON/.test(s)) return 'EN';
  if (/COTTON/.test(s)) return 'FFC';
  if (/NYLON/.test(s)) return 'FFN';
  return s;
}
/* Fibre -> css suffix. Unknown fibres get the neutral edge rather than an
   invented colour, because a colour nobody assigned means nothing. */
function fibClass(code) {
  const c = (code || '').toString().toUpperCase();
  return ['FFN', 'EN', 'FFC', 'BW'].includes(c) ? c.toLowerCase() : 'other';
}
function fiberTag(r) {
  const name = r.fiberName || r.fiber;
  if (!name) return '';
  return `<span class="fiber-tag fib-${fibClass(r.fiber)}">${esc(name)}</span>`;
}

function daysSince(v) {
  const n = Number(v);
  if (!Number.isFinite(n) || n <= 0) return null;
  return Math.floor((Date.now() / 1000 - n) / 86400);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

/* The three buckets, in the order they are shown and in the order a fallback
   picks them. `col` is filled in from the document's real column ids at load. */
const BUCKETS = [
  { key: 'held',   label: 'Held back',    short: 'held',   cands: ['General_Stock_Spools'] },
  { key: 'vendor', label: 'Vendor store', short: 'vendor', cands: ['Vendor_Stock_Spools'] },
  { key: 'retail', label: 'Retail store', short: 'retail', cands: ['Store_Stock_Spools'] },
];

let S = {
  cols: null, recipes: {}, lots: [], byRecipe: [],
  search: '', showEmpty: false, open: {},
  moveQty: {}, moveFrom: {}, moveTo: {},
  log: [], ready: false,
  store: null, storeLoading: false, storeError: '',
  binById: {}, locations: [], binFilter: '', pdfBusy: false, pdfUrl: '', pdfName: '',
};

/* Read-only snapshot of what the vendor store actually reports, via
   "SS - Store Inventory Snapshot". A widget cannot call the Shopify Admin API
   itself — the token cannot live in client-side code and CORS blocks it — so
   n8n holds the credential and this only ever reads the result.

   Nothing on this screen writes to Shopify. The comparison exists so YOU can
   decide what to correct and where; an automatic reconcile would be writing to
   a live storefront off a number that might itself be the stale one. */
const STORE_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/store-inventory';

/* ── Stock model v2 (2026-10-05) ──────────────────────────────────────────
   Production_Lots stock columns:
     On_Hand_Spools        typed    wound spools physically here, counted
     Hank_Est_Spools       typed    thread still in hank, estimated in spools
     Vendor_Stock_Spools   typed    listed on the vendor store (wound or hank)
     Store_Stock_Spools    typed    listed on retail (wound only)
     General_Stock_Spools  FORMULA  On_Hand + Hank − Vendor − Store = held back
   Total stock is still General + Vendor + Store, so code that only READS
   stock is unchanged. General can no longer be written: every stock write
   goes through stockMove()/stockSet(), which turn the old idea "change
   General/Vendor/Store by n" into the typed columns it means physically:
     +n to general  → On_Hand +n
     +n to vendor   → On_Hand +n, Vendor +n
     +n to store    → On_Hand +n, Store +n
     −n from any    → vendor/store listing −n, and n spools leave the shelf:
                      wound first, then hank (retail never holds hank). A hank
                      that leaves had to be wound, so Spools_Made rises by it.
   The same block is pasted into every widget that writes stock. Change them
   together. */
function stock2Cols(lotsT) {
  const keys = Object.keys(lotsT || {});
  const f = name => keys.find(k => k.toLowerCase() === name.toLowerCase()) || null;
  return {
    onHand: f('On_Hand_Spools'), hank: f('Hank_Est_Spools'),
    vendor: f('Vendor_Stock_Spools'), store: f('Store_Stock_Spools'),
    general: f('General_Stock_Spools'), made: f('Spools_Made'),
  };
}
function stock2Row(lotsT, C, i) {
  const n = c => (c && Array.isArray(lotsT[c])) ? (Number(lotsT[c][i]) || 0) : 0;
  return { onHand: n(C.onHand), hank: n(C.hank), vendor: n(C.vendor), store: n(C.store), made: n(C.made) };
}
function stock2Held(row) { return row.onHand + row.hank - row.vendor - row.store; }
const STOCK2_KEYS = ['onHand', 'hank', 'vendor', 'store', 'made'];
function stock2Diff(before, row, C) {
  const fields = {}, inverse = {};
  STOCK2_KEYS.forEach(k => {
    if (row[k] !== before[k] && C[k]) { fields[C[k]] = row[k]; inverse[C[k]] = before[k]; }
  });
  return { fields, inverse };
}
/* Mutates `row` so several moves on one lot accumulate correctly. */
function stockMove(row, C, where, delta) {
  const before = Object.assign({}, row);
  let short = 0;
  if (delta > 0) {
    row.onHand += delta;
    if (where === 'vendor') row.vendor += delta;
    else if (where === 'store') row.store += delta;
  } else if (delta < 0) {
    let n = -delta;
    if (where === 'vendor') row.vendor = Math.max(0, row.vendor - n);
    else if (where === 'store') row.store = Math.max(0, row.store - n);
    const w = Math.min(n, row.onHand); row.onHand -= w; n -= w;
    if (where !== 'store' && C.hank) {
      const h = Math.min(n, row.hank); row.hank -= h; row.made += h; n -= h;
    }
    short = n;
  }
  return Object.assign(stock2Diff(before, row, C), { short });
}
/* Absolute values, for editors. Only keys present in `vals` change. */
function stockSet(row, C, vals) {
  const before = Object.assign({}, row);
  STOCK2_KEYS.forEach(k => { if (vals[k] != null) row[k] = Math.max(0, Number(vals[k]) || 0); });
  return stock2Diff(before, row, C);
}
/* Shown when a write is refused because the switch-over hasn't happened. */
const STOCK2_NOT_READY =
  'Stock columns not switched over yet — On_Hand_Spools must be a data column and General a formula.';

/* ── Thread bins ──────────────────────────────────────────────────────────
   Production_Lots.Storage_Bin is a REFERENCE to Storage_Locations, so a lot
   filed correctly comes back as a row id and a lot filed by the old
   string-writing path comes back as the code itself. Both are read here, as
   in back-stock and bin-audit. These are thread bins (back stock A1–D7,
   staging S-…) — NOT dye bins, so normBin() must not touch them.

   A colourway's bins are the bins of its lots that still hold spools. A lot
   with spools and no bin is shown as "no bin" rather than dropped: those are
   exactly the spools a bin check is looking for. */
const NO_BIN_KEY = '__none';
function binFromRaw(raw) {
  if (raw == null || raw === '' || raw === 0) return '';
  if (typeof raw === 'number') return S.binById[raw] || ('#' + raw);
  if (typeof raw === 'string') return raw.replace(/^#Invalid Ref:\s*/i, '').trim().toUpperCase();
  const id = getRefId(raw);
  return id ? (S.binById[id] || ('#' + id)) : '';
}
function lotTotal(l) { return BUCKETS.reduce((a, b) => a + (l.vals[b.key] || 0), 0); }
function lotBinKey(l) { return l.bin || NO_BIN_KEY; }
function binText(key) { return key === NO_BIN_KEY ? 'no bin' : key; }
/* Shelf order: back stock (A1, A2 … D7) first, then prefixed racks (S-…),
   then anything off-grid, then "no bin" last. Numbers compare as numbers, so
   A10 follows A9. */
function binRank(key) {
  if (key === NO_BIN_KEY) return [9, '', '', 0];
  const m = /^(?:([A-Z]+)-)?([A-Z])(\d+)$/.exec(String(key));
  if (!m) return [8, String(key), '', 0];
  return [m[1] ? 2 : 1, m[1] || '', m[2], Number(m[3])];
}
function binCmp(a, b) {
  const x = binRank(a), y = binRank(b);
  for (let i = 0; i < 4; i++) {
    if (x[i] < y[i]) return -1;
    if (x[i] > y[i]) return 1;
  }
  return 0;
}
/* Bins holding spools of these recipes, sorted on the shelf. */
function binsOf(groups) {
  const set = new Set();
  groups.forEach(g => g.lots.forEach(l => { if (lotTotal(l) > 0) set.add(lotBinKey(l)); }));
  return [...set].sort(binCmp);
}
function binChipsHtml(keys) {
  if (!keys.length) return '';
  return keys.map(k => `<span class="bin-chip${k === NO_BIN_KEY ? ' none' : ''}${
    S.binFilter && k === S.binFilter ? ' hit' : ''}" title="${k === NO_BIN_KEY
      ? 'Spools with no Storage_Bin recorded' : 'Bin ' + esc(k)}">${esc(binText(k))}</span>`).join('');
}

async function loadAll() {
  try {
    const [lotsT, recT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Recipes'),
    ]);

    /* Optional: without it a bin stored as a reference shows as "#id". */
    S.binById = {}; S.locations = [];
    try {
      const locT = await grist.docApi.fetchTable('Storage_Locations');
      const codeCol = findColumn(locT, ['Bin_Code']);
      if (codeCol) (locT.id || []).forEach((id, i) => {
        const c = String(columnAsArray(locT, codeCol)[i] || '').trim().toUpperCase();
        if (!c) return;
        S.binById[id] = c;
        S.locations.push(c);
      });
    } catch (e) {
      console.warn('Inventory Desk: Storage_Locations unavailable — bins shown as stored', e);
    }

    const LOT = {
      bin: findColumn(lotsT, ['Storage_Bin']),
      recipe: findColumn(lotsT, ['Recipe']),
      lotNumber: findColumn(lotsT, ['Lot_Number']),
      date: findColumn(lotsT, ['Date_Dyed']),
      fiber: findColumn(lotsT, ['Fiber']),
      made: findColumn(lotsT, ['Spools_Made']),
    };
    BUCKETS.forEach(b => { b.col = findColumn(lotsT, b.cands); });
    // Held back (General) is a formula now — read, never written.
    S.stock2 = stock2Cols(lotsT);
    const missing = BUCKETS.filter(b => !b.col);

    const REC = {
      name: findColumn(recT, ['Recipe_Name']),
      sku: findColumn(recT, ['SKU_Base']),
      fiber: findColumn(recT, ['Fiber_Type']),
    };

    S.recipes = {};
    (recT.id || []).forEach((id, i) => {
      S.recipes[id] = {
        id,
        name: columnAsArray(recT, REC.name)[i] || `Recipe #${id}`,
        sku: columnAsArray(recT, REC.sku)[i] || '',
        fiber: fiberCode(columnAsArray(recT, REC.fiber)[i] || ''),
        /* The CODE is for matching; the NAME is for reading. This screen lists
           spools on live storefronts, and "FFN" beside "EN" is exactly the
           glance-alike pair that gets the wrong product put on sale. */
        fiberName: String(columnAsArray(recT, REC.fiber)[i] || '').trim(),
      };
    });

    S.lots = [];
    (lotsT.id || []).forEach((id, i) => {
      const rid = getRefId(columnAsArray(lotsT, LOT.recipe)[i]);
      if (!rid) return;   // a lot with no recipe can't be attributed to a colourway
      const vals = {};
      BUCKETS.forEach(b => { vals[b.key] = b.col ? num(columnAsArray(lotsT, b.col)[i]) : 0; });
      S.lots.push({
        id, recipeId: rid,
        lotNumber: columnAsArray(lotsT, LOT.lotNumber)[i] || `Lot #${id}`,
        date: LOT.date ? columnAsArray(lotsT, LOT.date)[i] : 0,
        fiber: fiberCode(columnAsArray(lotsT, LOT.fiber)[i] || ''),
        made: LOT.made ? num(columnAsArray(lotsT, LOT.made)[i]) : 0,
        bin: LOT.bin ? binFromRaw(columnAsArray(lotsT, LOT.bin)[i]) : '',
        vals,
        row: stock2Row(lotsT, S.stock2, i),
      });
    });

    // Oldest first everywhere, so a move rotates stock without being asked to.
    S.lots.sort((a, b) => (Number(a.date) || 0) - (Number(b.date) || 0));

    const map = new Map();
    S.lots.forEach(l => {
      if (!map.has(l.recipeId)) {
        const r = S.recipes[l.recipeId] || { name: `Recipe #${l.recipeId}`, sku: '', fiber: '' };
        map.set(l.recipeId, { recipeId: l.recipeId, recipe: r, lots: [], held: 0, vendor: 0, retail: 0, hank: 0 });
      }
      const g = map.get(l.recipeId);
      g.lots.push(l);
      g.hank += l.row.hank;
      BUCKETS.forEach(b => { g[b.key] += l.vals[b.key]; });
    });
    S.byRecipe = [...map.values()]
      .map(g => { g.onHand = g.held + g.vendor + g.retail; return g; })
      .sort((a, b) => String(a.recipe.name).localeCompare(String(b.recipe.name)));

    /* ── One card per COLOURWAY, fibres as rows inside it ──────────────────
       FF and E of one colour are separate recipes with separate SKUs, and they
       sorted next to each other under the same name, told apart by a 9px tag.
       Moving spools here is the act of LISTING them on a storefront, so a
       mis-click puts the wrong product on sale and the first you hear of it is
       from a customer.

       Grouping them removes the error rather than warning about it: there is no
       wrong card to click, because each fibre is a labelled row carrying its own
       SKU beside its own buttons.

       A colourway in ONE fibre renders exactly as before. Restructuring every
       card to guard against an ambiguity most of them do not have would be
       paying the cost everywhere to fix it in a few places. */
    const cwMap = new Map();
    S.byRecipe.forEach(g => {
      const k = normalize(g.recipe.name) || ('r' + g.recipeId);
      if (!cwMap.has(k)) cwMap.set(k, { key: k, name: g.recipe.name, members: [] });
      cwMap.get(k).members.push(g);
    });
    S.byColourway = [...cwMap.values()].map(c => {
      /* FF first, then E, then the rest. Alphabetical put EN above FFN, which
         reads as though E were the primary — it is the variant. Stable, so a
         row never moves under the pointer. */
      const rank = (g) => ({ FFN: 0, EN: 1, FFC: 2 })[g.recipe.fiber] ?? 3;
      c.members.sort((a, b) => rank(a) - rank(b)
        || String(a.recipe.fiber).localeCompare(String(b.recipe.fiber)));
      BUCKETS.forEach(b => { c[b.key] = c.members.reduce((t, g) => t + g[b.key], 0); });
      c.onHand = c.members.reduce((t, g) => t + g.onHand, 0);
      c.multi = c.members.length > 1;
      return c;
    }).sort((a, b) => String(a.name).localeCompare(String(b.name)));

    S.cols = { LOT };
    S.hasBinCol = !!LOT.bin;
    // A filter for a bin that no longer holds anything would show an empty list.
    if (S.binFilter && !allBinKeys().includes(S.binFilter)) S.binFilter = '';
    S.ready = true;
    document.getElementById('banner').innerHTML = missing.length
      ? `<div class="warn-banner"><strong>${missing.map(b => esc(b.cands[0])).join(', ')}</strong>
          ${missing.length === 1 ? 'is' : 'are'} not on Production_Lots, so that bucket always reads 0 and
          cannot be moved into. Add the column${missing.length === 1 ? '' : 's'} to use it.</div>`
      : '';
    render();
  } catch (e) {
    console.error('Inventory Desk: load failed', e);
    document.getElementById('list').innerHTML =
      `<div class="empty">Could not load — ${esc(e && e.message ? e.message : e)}</div>`;
  }
}

async function checkStores() {
  if (S.storeLoading) return;
  S.storeLoading = true; S.storeError = '';
  render();
  try {
    /* The workflow looks up exactly the SKUs it is sent (by SKU, so there is no
       250-product cap to fall off). It used to be called with no SKUs at all,
       answered "nothing was looked up", and every colourway then read as "not
       on the vendor store". Send every SKU this screen knows, in batches. */
    const skus = [...new Set(Object.values(S.recipes)
      .map(r => String(r.sku || '').trim()).filter(Boolean))];
    if (!skus.length) throw new Error('no recipe has a SKU to look up');
    const BATCH = 100;
    const merged = { variants: [], missing: [], notes: [], counts: { variants: 0, not_active: 0, missing: 0 } };
    for (let i = 0; i < skus.length; i += BATCH) {
      const res = await fetch(STORE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ from: 'inventory-desk', skus: skus.slice(i, i + BATCH) }),
      });
      if (!res.ok) throw new Error('webhook returned ' + res.status);
      const data = await res.json();
      if (data && data.ok === false) throw new Error(data.error || 'the workflow reported a failure');
      merged.variants.push(...(data.variants || []));
      merged.missing.push(...(data.missing || []));
      (data.notes || []).forEach(n => { if (!merged.notes.includes(n)) merged.notes.push(n); });
      const c = data.counts || {};
      merged.counts.variants += c.variants || 0;
      merged.counts.not_active += c.not_active || 0;
      merged.counts.missing += c.missing || 0;
      merged.fetched_at = data.fetched_at;
    }
    const bySku = {};
    merged.variants.forEach(v => { bySku[normalize(v.sku)] = v; });
    /* Only a SKU that was asked about can be called missing. Anything not asked
       (a recipe with no SKU) says so instead of claiming it isn't listed. */
    const asked = new Set(skus.map(normalize));
    S.store = { ...merged, bySku, asked };
  } catch (e) {
    console.error('Inventory Desk: store check failed', e);
    S.store = null;
    S.storeError = (e && e.message) ? e.message : String(e);
  }
  S.storeLoading = false;
  render();
}

/* What the vendor store says about one colourway, against what Grist claims is
   listed there. Returns null when there is nothing to say, so an un-checked
   screen looks exactly as it did before. */
function storeCmp(g) {
  if (!S.store) return null;
  const sku = g.recipe.sku;
  if (!sku) return { kind: 'unknown', text: 'no SKU on the recipe' };
  const v = S.store.bySku[normalize(sku)];
  if (!v) {
    return g.vendor > 0
      ? { kind: 'bad', text: `not on the vendor store, but Grist lists ${g.vendor}` }
      : { kind: 'unknown', text: 'not on the vendor store' };
  }
  // Quantity alone is misleading: stock on a draft product cannot be bought.
  if (!v.active && (v.qty > 0 || g.vendor > 0)) {
    return { kind: 'bad', text: `Shopify ${v.qty}, product is ${v.status} — not buyable` };
  }
  if (v.qty === g.vendor) return { kind: 'ok', text: `Shopify ${v.qty} \u2713` };
  /* Spelled out. "Shopify 4 (+2)" left you to work out what the +2 was
     relative to; this says both numbers and which way they differ. */
  const d = v.qty - g.vendor;
  const text = v.qty < 0
    ? `Shopify ${v.qty} (oversold) · Grist ${g.vendor}`
    : `Shopify ${v.qty} · Grist ${g.vendor} — Shopify has ${Math.abs(d)} ${d > 0 ? 'more' : 'fewer'}`;
  return { kind: 'bad', text,
    tip: `If Grist is right, set the vendor store to ${g.vendor}. If Shopify is right, change Vendor here to ${Math.max(0, v.qty)}.` };
}

function storeBarHtml() {
  const el = document.getElementById('storeBar');
  if (!el) return;
  if (S.storeLoading) { el.innerHTML = `<div class="store-bar">Reading the vendor store\u2026</div>`; return; }
  if (S.storeError) {
    el.innerHTML = `<div class="store-bar"><span class="bad">Could not read the vendor store</span>
      <span class="stamp">${esc(S.storeError)}</span>
      <span class="stamp">Grist figures below are unaffected.</span></div>`;
    return;
  }
  if (!S.store) { el.innerHTML = ''; return; }

  const rows = visibleRecipes();
  const diffs = rows.map(g => ({ g, c: storeCmp(g) })).filter(x => x.c && x.c.kind === 'bad');
  const c = S.store.counts || {};
  el.innerHTML = `<div class="store-bar">
    <span><strong>${diffs.length}</strong> ${diffs.length === 1 ? 'SKU disagrees' : 'SKUs disagree'} with the vendor store</span>
    ${diffs.length ? `<button class="btn tiny" id="onlyDiff">${S.onlyDiff ? 'Show everything' : 'Show only these'}</button>` : ''}
    <span class="stamp">${c.variants || 0} SKUs read${c.not_active ? ` \u00b7 ${c.not_active} not active` : ''} \u00b7 ${
      S.store.fetched_at ? new Date(S.store.fetched_at).toLocaleTimeString() : ''}</span>
    ${S.store.truncated ? '<span class="bad">partial snapshot \u2014 250-product cap hit</span>' : ''}
    ${(S.store.notes || []).map(n => `<span class="stamp">${esc(n)}</span>`).join('')}
    <span class="stamp">Comparison only \u2014 nothing is written to Shopify.</span>
  </div>`;
  const od = document.getElementById('onlyDiff');
  if (od) od.addEventListener('click', () => { S.onlyDiff = !S.onlyDiff; render(); });
}

function visible(ignoreDiff) {
  const q = normalize(S.search);
  return (S.byColourway || []).filter(c => {
    if (!S.showEmpty && c.onHand <= 0) return false;
    if (!ignoreDiff && S.onlyDiff && S.store && !hasDiff(c)) return false;
    if (S.binFilter && !c.members.some(g => g.lots.some(l =>
      lotTotal(l) > 0 && lotBinKey(l) === S.binFilter))) return false;
    if (!q) return true;
    // A SKU search must find the colourway through ANY of its fibres.
    return normalize(c.name).includes(q)
      || c.members.some(g => normalize(g.recipe.sku).includes(q));
  });
}
/* The store comparison is per SKU, so it works on recipes, not colourways. */
function visibleRecipes() {
  return visible(true).reduce((a, c) => a.concat(c.members), []);
}

function bucketHtml(g, b) {
  const v = g[b.key];
  return `<div class="bucket ${b.key} ${v ? '' : 'zero'}">
    <span class="n">${v}</span><span class="l">${esc(b.short)}</span>
  </div>`;
}

function cmpHtml(g) {
  const c = storeCmp(g);
  return c ? `<span class="cmp ${c.kind}"${c.tip ? ` title="${esc(c.tip)}"` : ''}>${esc(c.text)}</span>` : '';
}
/* A two-fibre card used to say nothing on its closed head, so the summary
   counted differences you could not see without opening every card. */
function cmpRollupHtml(c) {
  if (!S.store) return '';
  const res = c.members.map(storeCmp).filter(Boolean);
  const bad = res.filter(x => x.kind === 'bad').length;
  if (bad) return `<span class="cmp bad" title="Open the card to see which">${bad} of ${c.members.length} fibres differ</span>`;
  if (res.length && res.every(x => x.kind === 'ok')) return `<span class="cmp ok">Shopify \u2713 all fibres</span>`;
  return `<span class="cmp unknown">not all fibres listed</span>`;
}
function hasDiff(c) { return c.members.some(g => { const x = storeCmp(g); return x && x.kind === 'bad'; }); }

/* The move controls and lot list for ONE recipe — one fibre of one colourway.
   Unchanged in substance; it just no longer owns the card. */
function fibreBlockHtml(g) {
  const r = g.recipe;
  const from = S.moveFrom[g.recipeId] || 'held';
  const to = S.moveTo[g.recipeId] || (from === 'held' ? 'vendor' : 'held');
  const qty = S.moveQty[g.recipeId] !== undefined ? S.moveQty[g.recipeId] : '';
  /* Retail only ever lists wound spools, so a move to retail can take no more
     than each lot's wound spools not already on retail. */
  const avail = to === 'retail' ? movable(g, from, to) : (g[from] || 0);
  const n = Math.max(0, Number(qty) || 0);
  const canMove = n > 0 && n <= avail && from !== to;

  const lotLines = g.lots.map(l => {
    const d = daysSince(l.date);
    const tot = BUCKETS.reduce((a, b) => a + l.vals[b.key], 0);
    if (!tot && !S.showEmpty) return '';
    return `<div class="lot-line">
      <span class="lot-no">${esc(l.lotNumber)}</span>
      <span class="lot-bin${l.bin ? '' : ' none'}">${tot ? esc(l.bin || 'no bin') : ''}</span>
      ${BUCKETS.map(b => `<span class="lot-b" title="${esc(b.label)}">${l.vals[b.key] || '·'}</span>`).join('')}
      <span class="lot-age">${d === null ? '' : d + 'd old'}</span>
    </div>`;
  }).join('');

  return `<div class="fibre-block">
    <div class="fb-head edge-${fibClass(r.fiber)}">
      <div>
        <div class="fb-fiber fib-${fibClass(r.fiber)}" style="background:none;border:none;padding:0">${
          esc(r.fiberName || r.fiber || 'no fibre set')}</div>
        <div class="fb-sku">${esc(r.sku || 'no SKU')}${g.lots.length ? ` · ${g.lots.length} lot${g.lots.length === 1 ? '' : 's'}` : ''}${
          g.hank ? ` · ~${g.hank} in hank` : ''}</div>
        ${binsOf([g]).length ? `<div class="bins-line">${binChipsHtml(binsOf([g]))}</div>` : ''}
      </div>
      <div class="buckets">
        ${BUCKETS.map(b => bucketHtml(g, b)).join('')}
        ${cmpHtml(g)}
        <span class="onhand" title="On hand — the sum of all three">${g.onHand}</span>
      </div>
    </div>
    <div class="body">
      <div class="moverow">
        <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;">Move</span>
        <input class="qty-in" data-qty="${g.recipeId}" value="${esc(String(qty))}" placeholder="0">
        <select class="pick" data-from="${g.recipeId}">
          ${BUCKETS.map(b => `<option value="${b.key}" ${from === b.key ? 'selected' : ''}>from ${esc(b.label)} (${g[b.key]})</option>`).join('')}
        </select>
        <span class="arrow">→</span>
        <select class="pick" data-to="${g.recipeId}">
          ${BUCKETS.map(b => `<option value="${b.key}" ${to === b.key ? 'selected' : ''}>to ${esc(b.label)}</option>`).join('')}
        </select>
        <button class="btn tiny solid" data-move="${g.recipeId}" ${canMove ? '' : 'disabled'}>Move</button>
        ${g[from] > 0 ? `<button class="btn tiny" data-all="${g.recipeId}">All ${g[from]}</button>` : ''}
      </div>
      <div class="hint">${
        from === to ? 'Pick two different places.'
        : n > avail ? (to === 'retail' && avail < (g[from] || 0)
            ? `Only ${avail} of these are wound — retail can't list hank. Wind it first.`
            : `Only ${avail} in ${esc(BUCKETS.find(b => b.key === from).label.toLowerCase())}.`)
        : 'Nothing is sent to Shopify — this only records where the spools are listed. Oldest lot is drawn from first.'
      }</div>
      ${lotLines ? `<div class="lots">
        <div class="lot-line lot-head">
          <span class="lot-no">Lot</span>
          <span class="lot-bin">bin</span>
          ${BUCKETS.map(b => `<span class="lot-b">${esc(b.short)}</span>`).join('')}
          <span class="lot-age"></span>
        </div>
        ${lotLines}</div>` : ''}
    </div>
  </div>`;
}

/* The card is the colourway. With one fibre it reads as it always did; with
   more, each fibre is its own labelled row carrying its own SKU. */
function cardHtml(c) {
  const open = !!S.open[c.key] || (S.onlyDiff && c.multi && hasDiff(c));
  const fibres = c.members.map(g => g.recipe.fiberName || g.recipe.fiber || '?').join(' + ');
  /* A single-fibre card wears the fibre's colour as its own left edge — the
     only cue available when there is nothing beside it to compare with. A
     multi-fibre card stays neutral at the top and colours each block instead,
     so the edge never claims a fibre the card does not solely contain. */
  const edge = c.multi ? 'edge-other' : `edge-${fibClass(c.members[0].recipe.fiber)}`;
  return `<div class="card${c.multi ? ' multi' : ''} ${edge}">
    <div class="card-head" data-toggle="${esc(c.key)}">
      <div>
        <div class="cw-name">${esc(c.name)} ${c.members.map(g => fiberTag(g.recipe)).join(' ')}</div>
        <div class="cw-meta">${c.multi
          ? `${c.members.length} fibres — ${esc(c.members.map(g => g.recipe.sku || '?').join(', '))}`
          : esc(c.members[0].recipe.sku || '')}</div>
        ${c.onHand > 0 ? `<div class="bins-line">${binChipsHtml(binsOf(c.members))}</div>` : ''}
      </div>
      <div class="buckets">
        ${BUCKETS.map(b => `<div class="bucket ${b.key} ${c[b.key] ? '' : 'zero'}"
          title="${c.multi ? 'Combined across ' + c.members.length + ' fibres — open to see the split' : esc(b.label)}">
          <span class="n">${c[b.key]}</span><span class="l">${esc(b.short)}</span></div>`).join('')}
        ${c.multi ? cmpRollupHtml(c) : cmpHtml(c.members[0])}
        <span class="onhand" title="On hand">${c.onHand}</span>
      </div>
    </div>
    ${open ? c.members.map(fibreBlockHtml).join('') : ''}
  </div>`;
}

function render() {
  if (!S.ready) return;
  const rows = visible();

  const tot = { held: 0, vendor: 0, retail: 0 };
  S.byRecipe.forEach(g => BUCKETS.forEach(b => { tot[b.key] += g[b.key]; }));
  const onHand = tot.held + tot.vendor + tot.retail;
  document.getElementById('totals').innerHTML = `<div class="totals">
    <div class="tot"><div class="n">${onHand}</div><div class="l">On hand</div></div>
    <div class="tot held"><div class="n">${tot.held}</div><div class="l">Held back</div></div>
    <div class="tot vendor"><div class="n">${tot.vendor}</div><div class="l">Vendor store</div></div>
    <div class="tot retail"><div class="n">${tot.retail}</div><div class="l">Retail store</div></div>
  </div>`;

  document.getElementById('list').innerHTML = rows.length
    ? rows.map(cardHtml).join('')
    : `<div class="empty">${S.search ? 'Nothing matches that.' : 'No colourways with spools on hand.'}</div>`;

  document.getElementById('showAll').textContent = S.showEmpty
    ? 'Hide colourways with none on hand' : 'Show colourways with none on hand';

  renderBinFilter();
  pdfBarHtml();
  wire();
  storeBarHtml();
  renderLog();
}

function allBinKeys() {
  const set = new Set(S.locations);
  S.lots.forEach(l => { if (lotTotal(l) > 0) set.add(lotBinKey(l)); });
  return [...set].sort(binCmp);
}
function renderBinFilter() {
  const sel = document.getElementById('binFilter');
  if (!sel) return;
  if (!S.hasBinCol) { sel.style.display = 'none'; return; }
  const used = new Set();
  S.lots.forEach(l => { if (lotTotal(l) > 0) used.add(lotBinKey(l)); });
  sel.innerHTML = `<option value="">All bins</option>` + allBinKeys().map(k =>
    `<option value="${esc(k)}" ${k === S.binFilter ? 'selected' : ''}>${
      k === NO_BIN_KEY ? 'No bin recorded' : 'Bin ' + esc(k)}${used.has(k) ? '' : ' (empty)'}</option>`).join('');
}

function wire() {
  document.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.toggle;
    S.open[k] = !S.open[k];
    render();
  }));
  document.querySelectorAll('[data-qty]').forEach(el => el.addEventListener('input', () => {
    S.moveQty[Number(el.dataset.qty)] = el.value;
    render();
    const again = document.querySelector(`[data-qty="${el.dataset.qty}"]`);
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  }));
  document.querySelectorAll('[data-from]').forEach(el => el.addEventListener('change', () => {
    S.moveFrom[Number(el.dataset.from)] = el.value;
    render();
  }));
  document.querySelectorAll('[data-to]').forEach(el => el.addEventListener('change', () => {
    S.moveTo[Number(el.dataset.to)] = el.value;
    render();
  }));
  document.querySelectorAll('[data-all]').forEach(el => el.addEventListener('click', () => {
    const id = Number(el.dataset.all);
    const g = S.byRecipe.find(x => x.recipeId === id);
    if (g) S.moveQty[id] = String(g[S.moveFrom[id] || 'held'] || 0);
    render();
  }));
  document.querySelectorAll('[data-move]').forEach(el =>
    el.addEventListener('click', () => doMove(Number(el.dataset.move))));
}

function renderLog() {
  document.getElementById('log').innerHTML = S.log.length
    ? `<div class="log">${S.log.map((e, i) => `
        <div class="log-line"><span>${esc(e.text)}</span>
        <span class="undo" data-undo="${i}">↺ undo</span></div>`).join('')}</div>`
    : '';
  document.querySelectorAll('[data-undo]').forEach(el =>
    el.addEventListener('click', () => undo(Number(el.dataset.undo))));
}

/* Move spools between two buckets for one colourway.

   Drawn oldest lot first so stock rotates, and applied per lot: the whole point
   is that a colourway's pile is spread across several lots, and a move that
   wrote a single total somewhere would lose which lot the spools came from —
   which is what makes a lot's arithmetic stop balancing. Both columns of a lot
   are written in the same action, so the lot's total never changes. */
/* How many of one lot's spools can go from one place to another. */
function lotMovable(l, from, to) {
  const have = Math.max(0, l.vals[from] || 0);
  if (to !== 'retail') return have;
  // Wound spools on this lot not already listed on retail.
  const wound = Math.max(0, l.row.onHand - l.vals.retail);
  return Math.min(have, wound);
}
function movable(g, from, to) {
  return g.lots.reduce((t, l) => t + lotMovable(l, from, to), 0);
}

async function doMove(recipeId) {
  const g = S.byRecipe.find(x => x.recipeId === recipeId);
  if (!g) return;
  const from = S.moveFrom[recipeId] || 'held';
  /* Same default the picker shows. This used to assume 'vendor', so choosing
     "from Vendor" and leaving "to Held back" as displayed read as vendor →
     vendor and was refused as "pick two different places". */
  const to = S.moveTo[recipeId] || (from === 'held' ? 'vendor' : 'held');
  if (from === to) { showToast('Pick two different places'); return; }
  const want = Math.max(0, Number(S.moveQty[recipeId]) || 0);
  if (!want) { showToast('Set a quantity first'); return; }

  const fromB = BUCKETS.find(b => b.key === from);
  const toB = BUCKETS.find(b => b.key === to);
  if (!fromB.col || !toB.col) { showToast('That column does not exist on Production_Lots'); return; }
  if (!S.stock2.onHand) { showToast(STOCK2_NOT_READY); return; }
  const cap = movable(g, from, to);
  if (want > cap) {
    showToast(to === 'retail' && cap < g[from]
      ? `Only ${cap} wound — retail can't list hank`
      : `Only ${g[from]} in ${fromB.label.toLowerCase()}`);
    return;
  }

  /* Moving is listing or de-listing, so only the Vendor and Retail columns
     change. Held back is a formula (On hand + Hank − listed): it goes down by
     itself when spools are listed and up when they are de-listed. */
  let left = want;
  const actions = [], inverse = [], touched = [];
  for (const l of g.lots) {          // already oldest-first
    if (left <= 0) break;
    const have = lotMovable(l, from, to);
    if (have <= 0) continue;
    const take = Math.min(have, left);
    left -= take;
    const f = {}, inv = {};
    if (from !== 'held') { f[fromB.col] = l.vals[from] - take; inv[fromB.col] = l.vals[from]; }
    if (to !== 'held') { f[toB.col] = l.vals[to] + take; inv[toB.col] = l.vals[to]; }
    actions.push(['UpdateRecord', 'Production_Lots', l.id, f]);
    inverse.push(['UpdateRecord', 'Production_Lots', l.id, inv]);
    touched.push(`${l.lotNumber} ${take}`);
  }
  if (!actions.length) { showToast('Nothing to move'); return; }

  try {
    await grist.docApi.applyUserActions(actions);
    S.log.unshift({
      text: `${want} × ${g.recipe.name} — ${fromB.label.toLowerCase()} → ${toB.label.toLowerCase()}` +
        (touched.length > 1 ? ` (${touched.length} lots)` : ` (${touched[0]})`),
      inverse,
    });
    delete S.moveQty[recipeId];
    showToast('Moved ✓');
    await loadAll();
  } catch (e) {
    console.error('Inventory Desk: move failed', e);
    showToast('Move failed — check Production_Lots');
  }
}

async function undo(i) {
  const entry = S.log[i];
  if (!entry) return;
  try {
    await grist.docApi.applyUserActions(entry.inverse);
    S.log.splice(i, 1);
    showToast('Undone');
    await loadAll();
  } catch (e) {
    console.error('Inventory Desk: undo failed', e);
    showToast('Undo failed — check the console');
  }
}

/* ── Bin check PDF ─────────────────────────────────────────────────────────
   A count sheet to walk the shelf with. One section per bin, in shelf order;
   one row per colourway-fibre in that bin (lots of one recipe in one bin are
   summed — you count the bag, not the lot), then a blank line for anything
   found in the bin that the sheet doesn't list.

   Each row says what Grist expects (wound and hank separately, because they
   look different on the shelf), where it is listed, and — when "Check stores"
   was pressed first — what the vendor store reports. Then: a box to tick when
   it is right, blanks for the actual count when it isn't, and boxes for where
   the fix belongs. Nothing is changed from the sheet; it goes back to this
   screen (or Quick Log) and the store by hand.

   Prints what the screen is showing: the search and bin filter apply, so one
   rack column or one bin can be printed on its own. Lots with no bin get
   their own section at the end — they are the spools being looked for. */
const PDF_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js',
];
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.onload = resolve;
    s.onerror = () => reject(new Error('could not load ' + src.split('/').slice(-2).join('/')));
    document.head.appendChild(s);
  });
}
async function ensurePdfLibs() {
  if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript(PDF_LIBS[0]);
  if (!window.jspdf.jsPDF.API.autoTable) await loadScript(PDF_LIBS[1]);
  return window.jspdf.jsPDF;
}

/* Plain data for the sheet, from what is on screen. */
function binSheetData() {
  const groups = visible().reduce((a, c) => a.concat(c.members), []);
  const byBin = new Map();
  groups.forEach(g => {
    const allBins = binsOf([g]);
    const per = new Map();
    g.lots.forEach(l => {
      const tot = lotTotal(l);
      if (tot <= 0) return;
      const key = lotBinKey(l);
      if (S.binFilter && key !== S.binFilter) return;
      if (!per.has(key)) per.set(key, { lots: [], wound: 0, hank: 0, vendor: 0, retail: 0, held: 0, total: 0 });
      const e = per.get(key);
      e.lots.push(l.lotNumber);
      const hank = Math.max(0, l.row.hank || 0);
      e.hank += hank;
      e.wound += S.stock2.onHand ? Math.max(0, l.row.onHand || 0) : Math.max(0, tot - hank);
      e.vendor += l.vals.vendor || 0;
      e.retail += l.vals.retail || 0;
      e.held += l.vals.held || 0;
      e.total += tot;
    });
    per.forEach((e, key) => {
      let shop = null;
      if (S.store) {
        const v = g.recipe.sku ? S.store.bySku[normalize(g.recipe.sku)] : null;
        shop = !g.recipe.sku ? 'no SKU' : !v ? 'not listed'
          : (v.active ? String(v.qty) : `${v.qty} (${v.status})`);
        // Same rule as the screen: a draft product with stock either side is wrong.
        if (v && (v.active ? v.qty !== g.vendor : (v.qty > 0 || g.vendor > 0))) shop += ' !';
      }
      if (!byBin.has(key)) byBin.set(key, []);
      byBin.get(key).push({
        name: g.recipe.name, fiber: g.recipe.fiberName || g.recipe.fiber || '',
        fiberCode: g.recipe.fiber, sku: g.recipe.sku || '',
        lots: e.lots, wound: e.wound, hank: e.hank, vendor: e.vendor, retail: e.retail,
        held: e.held, total: e.total,
        gristVendor: g.vendor, shop,
        otherBins: allBins.filter(k => k !== key).map(binText),
      });
    });
  });
  /* Bins that exist but hold nothing on record still get a section — finding
     something in an "empty" bin is as much a fix as a wrong count. Only when
     the whole shelf is being printed, not a search. */
  if (!S.search) {
    S.locations.forEach(code => {
      if (S.binFilter && code !== S.binFilter) return;
      if (!byBin.has(code)) byBin.set(code, []);
    });
  }
  const rank = f => ({ FFN: 0, EN: 1, FFC: 2 })[f] ?? 3;
  const bins = [...byBin.keys()].sort(binCmp).map(key => {
    const rows = byBin.get(key).sort((a, b) =>
      String(a.name).localeCompare(String(b.name)) || rank(a.fiberCode) - rank(b.fiberCode));
    return { key, label: binText(key), rows,
      total: rows.reduce((t, r) => t + r.total, 0) };
  });
  const filters = [];
  if (S.binFilter) filters.push(S.binFilter === NO_BIN_KEY ? 'no-bin lots only' : 'bin ' + S.binFilter);
  if (S.search) filters.push(`search "${S.search}"`);
  if (S.onlyDiff && S.store) filters.push('store differences only');
  return {
    bins,
    printedAt: new Date(),
    filters,
    storeAt: S.store && S.store.fetched_at ? new Date(S.store.fetched_at) : null,
    storeChecked: !!S.store,
  };
}

/* jsPDF's built-in Helvetica is WinAnsi: accented Latin is fine, but symbols
   like ≈ ✓ ☐ come out as junk. Boxes are drawn, not typed. */
function pdfSafe(s) {
  return String(s == null ? '' : s)
    .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
    .replace(/—/g, '-').replace(/≈/g, '~')
    .replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ–]/g, '?');
}

function drawBinSheet(JsPDF, data) {
  const doc = new JsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 30;
  const INK = [26, 22, 20], MUTED = [139, 125, 114], RULE = [212, 201, 188];
  const WARM = [232, 223, 212], ACCENT = [139, 58, 42];
  const fmtDate = d => d.toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  const fmtTime = d => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

  // ── Header ──
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(...INK);
  doc.text('Bin check', M, M + 6);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...MUTED);
  const spools = data.bins.reduce((t, b) => t + b.total, 0);
  const binsWith = data.bins.filter(b => b.rows.length).length;
  doc.text(pdfSafe(`Printed ${fmtDate(data.printedAt)} ${fmtTime(data.printedAt)}  ·  ` +
    `${data.bins.length} bin section${data.bins.length === 1 ? '' : 's'} (${binsWith} with stock on record)  ·  ` +
    `${spools} spools expected` + (data.filters.length ? `  ·  Showing ${data.filters.join(', ')}` : '')),
    M, M + 20);
  doc.text(pdfSafe(data.storeChecked
    ? `Vendor store read at ${data.storeAt ? fmtTime(data.storeAt) : '?'} - "!" means Shopify and Grist disagree on what is listed. Retail is not read.`
    : 'Vendor store not read - press "Check stores" before printing to include the Shopify column.'),
    M, M + 31);
  doc.setTextColor(...INK);
  doc.text('Count each bag. Tick OK if it matches. If not, write what is actually there and tick where it needs fixing: '
    + 'Grist (counts / bin on the lot) and/or Shopify (listed quantity).', M, M + 44);

  // ── Table ──
  const head = [['Colourway · fibre · SKU · lots', 'Wound', 'Hank', 'Listed', 'Shopify V', 'OK',
    'Actual wound', 'Actual hank', 'Fix in']];
  const body = [];
  const meta = [];   // parallel to body: what kind of row, for drawing
  const COLS = 9;
  data.bins.forEach(b => {
    body.push([{ content: pdfSafe(
      (b.key === '__none' ? 'NO BIN RECORDED' : 'BIN ' + b.label) +
      (b.rows.length
        ? `      ${b.rows.length} item${b.rows.length === 1 ? '' : 's'} · ${b.total} spools expected`
        : '      nothing on record - empty?')),
      colSpan: COLS,
      styles: { fillColor: WARM, fontStyle: 'bold', fontSize: 10.5, textColor: INK, cellPadding: { top: 5, bottom: 5, left: 6, right: 6 } } }]);
    meta.push({ kind: 'bin' });
    b.rows.forEach(r => {
      const where = [];
      if (r.vendor) where.push(`V ${r.vendor}`);
      if (r.retail) where.push(`R ${r.retail}`);
      if (r.held) where.push(`held ${r.held}`);
      const sub = [r.fiber, r.sku].filter(Boolean).join(' · ');
      const lots = 'Lots: ' + r.lots.join(', ') +
        (r.otherBins.length ? `   (also in ${r.otherBins.join(', ')})` : '');
      body.push([
        pdfSafe(`\n${sub}\n${lots}`),
        String(r.wound || '-'),
        r.hank ? '~' + r.hank : '-',
        pdfSafe(where.join('\n') || '-'),
        pdfSafe(r.shop == null ? '' : r.shop + (r.otherBins.length && r.shop && !/^no|^not/.test(r.shop) ? '\n(all bins)' : '')),
        '', '', '', '',
      ]);
      meta.push({ kind: 'item', row: r });
    });
    body.push([{ content: 'Also in this bin, not listed above:', colSpan: COLS,
      styles: { fontSize: 8, textColor: MUTED, minCellHeight: 22, cellPadding: { top: 4, left: 6 } } }]);
    meta.push({ kind: 'extra' });
  });

  const box = (x, y, s) => { doc.setDrawColor(...INK); doc.setLineWidth(0.8); doc.rect(x, y, s, s); };
  doc.autoTable({
    head, body,
    startY: M + 54,
    margin: { left: M, right: M, top: M + 6, bottom: M },
    theme: 'grid',
    rowPageBreak: 'avoid',
    styles: { font: 'helvetica', fontSize: 9, textColor: INK, lineColor: RULE, lineWidth: 0.5,
      cellPadding: 4, valign: 'middle', overflow: 'linebreak' },
    headStyles: { fillColor: INK, textColor: 255, fontSize: 8, fontStyle: 'bold', halign: 'center' },
    columnStyles: {
      0: { cellWidth: 238, halign: 'left' },
      1: { cellWidth: 48, halign: 'center', fontStyle: 'bold', fontSize: 11 },
      2: { cellWidth: 48, halign: 'center', fontSize: 10 },
      3: { cellWidth: 60, halign: 'center', fontSize: 8.5 },
      4: { cellWidth: 62, halign: 'center', fontSize: 9 },
      5: { cellWidth: 34 },
      6: { cellWidth: 72 },
      7: { cellWidth: 72 },
      8: { cellWidth: 98 },
    },
    showHead: 'everyPage',
    didParseCell: (h) => {
      if (h.section !== 'body') return;
      const m = meta[h.row.index];
      if (m && m.kind === 'item' && h.column.index === 0) {
        h.cell.styles.valign = 'top'; h.cell.styles.textColor = [90, 80, 72]; h.cell.styles.fontSize = 8.5;
      }
      if (m && m.kind === 'item' && h.column.index === 4 && /!$/.test(String(m.row.shop || ''))) {
        h.cell.styles.textColor = ACCENT; h.cell.styles.fontStyle = 'bold';
      }
    },
    didDrawCell: (h) => {
      if (h.section !== 'body') return;
      const m = meta[h.row.index];
      if (!m || m.kind !== 'item') return;
      const c = h.cell, cx = c.x + c.width / 2, cy = c.y + c.height / 2;
      if (h.column.index === 0) {
        /* The first line of the cell is left blank and the name drawn into it
           in bold — AutoTable can't mix weights inside one cell. */
        doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...INK);
        let name = pdfSafe(m.row.name);
        const room = c.width - c.padding('left') - c.padding('right');
        while (name.length > 4 && doc.getTextWidth(name) > room) name = name.slice(0, -2);
        if (name !== pdfSafe(m.row.name)) name = name.replace(/\s*$/, '') + '...';
        doc.text(name, c.x + c.padding('left'), c.y + c.padding('top'), { baseline: 'top' });
        doc.setFont('helvetica', 'normal');
      }
      if (h.column.index === 5) box(cx - 6, cy - 6, 12);
      if (h.column.index === 6 || h.column.index === 7) {
        doc.setDrawColor(...MUTED); doc.setLineWidth(0.6);
        doc.line(c.x + 10, c.y + c.height - 9, c.x + c.width - 10, c.y + c.height - 9);
      }
      if (h.column.index === 8) {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...INK);
        box(c.x + 7, cy - 5, 10); doc.text('Grist', c.x + 20, cy + 3);
        box(c.x + 49, cy - 5, 10); doc.text('Shopify', c.x + 62, cy + 3);
      }
    },
  });

  // ── Footer: page numbers + sign-off ──
  const pages = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(`Page ${i} of ${pages}`, W - M, H - 14, { align: 'right' });
    doc.text('Checked by ____________________   Date ________   Entered in Grist / Shopify ________',
      M, H - 14);
  }
  return doc;
}

async function makeBinPdf() {
  if (S.pdfBusy || !S.ready) return;
  if (!S.hasBinCol) { showToast('Production_Lots has no Storage_Bin column'); return; }
  S.pdfBusy = true;
  const btn = document.getElementById('binPdf');
  if (btn) { btn.disabled = true; btn.textContent = 'Making PDF…'; }
  try {
    const data = binSheetData();
    if (!data.bins.length) { showToast('Nothing on screen to print'); return; }
    const JsPDF = await ensurePdfLibs();
    const doc = drawBinSheet(JsPDF, data);
    const d = data.printedAt;
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const scope = S.binFilter ? '-' + (S.binFilter === NO_BIN_KEY ? 'no-bin' : S.binFilter) : '';
    S.pdfName = `bin-check-${stamp}${scope}.pdf`;
    if (S.pdfUrl) URL.revokeObjectURL(S.pdfUrl);
    S.pdfUrl = URL.createObjectURL(doc.output('blob'));
    /* Try the download straight away; the bar keeps a link in case the Grist
       frame blocks it, plus an Open link that prints from the browser. */
    const a = document.createElement('a');
    a.href = S.pdfUrl; a.download = S.pdfName;
    document.body.appendChild(a); a.click(); a.remove();
    showToast('PDF ready');
  } catch (e) {
    console.error('Inventory Desk: PDF failed', e);
    showToast('PDF failed — ' + (e && e.message ? e.message : e));
  } finally {
    S.pdfBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = '⬇ Bin check PDF'; }
    pdfBarHtml();
  }
}
function pdfBarHtml() {
  const el = document.getElementById('pdfBar');
  if (!el) return;
  el.innerHTML = S.pdfUrl ? `<div class="pdf-bar">
      <span>Bin check ready</span>
      <a href="${S.pdfUrl}" download="${esc(S.pdfName)}">Download ${esc(S.pdfName)}</a>
      <a href="${S.pdfUrl}" target="_blank" rel="noopener">Open to print</a>
      <span class="stamp">Made from the screen as it was — press the button again after changes.</span>
    </div>` : '';
}

document.getElementById('search').addEventListener('input', (e) => { S.search = e.target.value; render(); });
document.getElementById('showAll').addEventListener('click', () => { S.showEmpty = !S.showEmpty; render(); });
document.getElementById('reload').addEventListener('click', () => loadAll());
document.getElementById('checkStores').addEventListener('click', () => checkStores());
document.getElementById('binFilter').addEventListener('change', (e) => { S.binFilter = e.target.value; render(); });
document.getElementById('binPdf').addEventListener('click', () => makeBinPdf());

// Static shell is already rendered. Only now talk to Grist.
try {
  grist.ready({ requiredAccess: 'full' });
  loadAll();
} catch (e) {
  document.getElementById('list').innerHTML =
    `<div class="empty">Grist plugin API unavailable: ${esc(e && e.message ? e.message : e)}</div>`;
}
</script>
