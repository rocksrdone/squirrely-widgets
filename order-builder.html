function pushPanelHtml(o) {
  const p = S.push;
  if (S.pushBusy) return `<div class="banner">Talking to Shopify…</div>`;
  if (!p) return '';

  if (p.created) {
    return `<div class="banner" style="background:var(--done-bg);border-color:#BBD79A;color:var(--done-text)">
      <strong>Created in Shopify as ${esc(p.shopify_name || p.shopify_order_id)}.</strong>
      ${p.wrote_back ? ' Its id is recorded here, so it can\'t be pushed twice.' : ''}
      ${(p.reasons || []).length ? `<div style="margin-top:6px">${p.reasons.map(esc).join('<br>')}</div>` : ''}
    </div>`;
  }
  if (p.reasons && p.reasons.length && !p.preview) {
    return `<div class="banner bad"><strong>${p.already_pushed ? 'Already pushed.'
      : (p.uncertain ? 'Uncertain — read this.' : 'Not sent.')}</strong>
      <ul style="margin:5px 0 0 16px">${p.reasons.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`;
  }

  const sm = p.summary || {};
  const warn = sm.addressConfident === false;
  return `<div class="banner ${warn ? 'warn' : ''}">
    <strong>This is what would be sent.</strong> Nothing has been created yet.
    <table style="margin-top:6px;border-collapse:collapse">
      <tr><td style="padding-right:10px;color:#8B7D72">Customer</td><td>${esc(sm.customer || '—')}</td></tr>
      <tr><td style="padding-right:10px;color:#8B7D72">Contents</td>
        <td>${esc(sm.spools)} spool(s) across ${esc(sm.lines)} line(s), $${esc(sm.value)}</td></tr>
      <tr><td style="padding-right:10px;color:#8B7D72">Ship to</td><td>${esc(sm.address || '—')}</td></tr>
      <tr><td style="padding-right:10px;color:#8B7D72">Weights</td>
        <td>${esc(sm.weightsFromGrist)} of ${esc(sm.lines)} line(s) carry a Grist weight</td></tr>
    </table>
    ${warn ? `<div style="margin-top:6px"><strong>Check the address.</strong>
      The city/state/ZIP column ${esc(sm.addressParse)}. Fix it on the customer record if that split is wrong —
      a parcel goes where this says.</div>` : ''}
    ${(p.notes || []).length ? `<div style="margin-top:6px;color:#8B7D72">
      ${p.notes.map(esc).join('<br>')}</div>` : ''}
    <div style="margin-top:8px">
      <button class="btn" onclick="doPush(${o.id})">Send it</button>
      <button class="btn secondary" onclick="S.push = null; render()">Cancel</button>
    </div>
  </div>`;
}

/* ── Render ─────────────────────────────────────────────────────────────── */

function selectOrder(id) { S.selected = id; render(); }

function renderBanners() {
  const out = [];
  if (S.error) {
    out.push(`<div class="banner bad"><strong>Couldn't load.</strong> ${esc(S.error)}</div>`);
  }
  if (S.missing.length) {
    out.push(`<div class="banner bad"><strong>Can't build orders yet.</strong>
      These columns don't exist, and writing to a missing column fails the whole request:
      ${S.missing.map(m => `<code>${esc(m)}</code>`).join(', ')}.</div>`);
  }
  if (!S.customers.length && !S.loading && !S.error) {
    out.push(`<div class="banner warn">No <code>Customers</code> table found, so the customer has to be
      typed by hand and won't be linked to a customer record.</div>`);
  }
  /* Only worth saying once the shelf is readable and something is on it —
     otherwise this is a setup note for a feature nobody is reaching for. */
  /* A setup note is only worth raising once there is stock it would apply to.
     A READ FAILURE is always worth raising: staying quiet there leaves an
     empty screen that looks exactly like having no stock. */
  if (!S.loading && !S.error && S.stockNote
      && (S.stockFailed || (Object.keys(S.stockCols).length
                            && Object.keys(S.stockByRecipe).length))) {
    out.push(`<div class="banner warn"><strong>${S.stockFailed
      ? "Couldn't read stock."
      : "Stock is shown but can't be reserved."}</strong>
      ${esc(S.stockNote)}</div>`);
  }
  /* Last, so it sits closest to the work — and it is the one banner that is
     about physical spools rather than about setting something up. */
  out.push(todoPanelHtml());
  document.getElementById('banners').innerHTML = out.join('');
}

function renderSide() {
  const mine = S.orders.filter(isManual)
    .sort((a, b) => {
      const an = parseInt((/\d+/.exec(a.number) || [0])[0], 10);
      const bn = parseInt((/\d+/.exec(b.number) || [0])[0], 10);
      return bn - an;
    });
  const box = document.getElementById('side');
  if (!mine.length) {
    box.innerHTML = `<div class="empty" style="padding:16px">No manual orders yet.</div>`;
    return;
  }
  box.innerHTML = mine.map(o => {
    const lines = S.lines[o.id] || [];
    const spools = lines.reduce((n, l) => n + l.qty, 0);
    const badge = o.shopifyId
      ? '<span class="badge pushed">in Shopify</span>'
      : (o.status === BUILDING_STATUS
          ? '<span class="badge building">building</span>'
          : '<span class="badge active">released</span>');
    return `<div class="order-item ${S.selected === o.id ? 'sel' : ''}" onclick="selectOrder(${o.id})">
      <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
        <span class="num">${esc(o.number)}</span> ${badge}
      </div>
      <div class="cust">${esc(o.customerName || '(no customer)')}</div>
      <div class="meta">${spools} spool(s) · ${lines.length} line(s)</div>
    </div>`;
  }).join('');
}

/* What is on hand for a colourway, said in the picker itself.

   Without this you cannot tell which colourways have retail stock until after
   the line exists — you add it, look, and delete it again if the answer is no.
   That is the wrong way round when the whole reason for opening this screen
   may be to build an order out of what is already sitting on a storefront.

   A plain <option> cannot carry markup, so this is text only. */
function stockHint(recipeId) {
  const lots = S.stockByRecipe[recipeId] || [];
  if (!lots.length) return '';
  const by = {};
  SOURCES.forEach(s => { by[s] = lots.reduce((n, l) => n + num(l.by[s]), 0); });
  const parts = SOURCES.filter(s => by[s] > 0)
    .map(s => `${by[s]} ${SOURCE_META[s].short}`);
  return parts.length ? `  —  ${parts.join(', ')}` : '';
}

/* The shelf, per line. Reading only — every write is behind a button and a
   confirmation that names the lots. */
function stockLineHtml(l) {
  if (!Object.keys(S.stockCols).length) return '';
  const st = lineStock(l);
  const anyAvail = SOURCES.some(s => st.avail[s] > 0);
  /* A make-fresh line always shows its marker, even with an empty shelf —
     otherwise the decision becomes invisible the moment stock runs out, and
     reappears as a surprise when the next lot is dyed.

     And a storefront pull no longer depends on a count, so a line with nothing
     showing anywhere must still offer it. Suppressing the row here took the
     retail button away in exactly the case it was built for. */
  const storefrontPossible = SOURCES.some(x => SOURCE_META[x].listed && st.canReserve(x));
  if (!st.reserved && !anyAvail && !l.makeFresh && !storefrontPossible) return '';

  const busy0 = S.stockBusy ? 'disabled' : '';
  if (l.makeFresh) {
    return `<div class="stock-line">
      <span class="st-fresh">dyeing fresh</span>
      <span class="st-sep">·</span>
      <span class="st-short">${st.short} to dye</span>
      ${anyAvail ? `<span class="st-none">stock on hand, not offered</span>` : ''}
      <span class="st-actions"><button class="btn secondary small" ${busy0}
        onclick="allowStock(${l.id})"
        title="Offer stock for this line again">allow stock</button></span></div>`;
  }

  const bits = [];
  const RESERVED_HERE = '\u0000R';   // placeholder: the held chip goes here
  const SHELF_HERE = '\u0000S';      // placeholder: the available chip goes here
  if (st.reserved) {
    /* Named by source, because "4 reserved" tells you nothing about whether a
       storefront still has them on sale. */
    const parts = SOURCES.filter(s => st.bySource[s] > 0)
      .map(s => `${st.bySource[s]} from ${SOURCE_META[s].short}`);
    bits.push(`<span class="st-res">${esc(parts.join(' + '))} reserved</span>`);
    bits.push(RESERVED_HERE);
  }
  if (st.avail.General) {
    bits.push(`<span class="${st.avail.General >= st.short && st.short ? 'st-ok' : 'st-some'}">${
      st.avail.General} on the shelf</span>`);
    bits.push(SHELF_HERE);
  } else if (!st.reserved) {
    bits.push(`<span class="st-none">none on the shelf</span>`);
  }
  /* Grist's storefront numbers are labelled as the guesses they are, so they
     are never read as an amount you can count on. */
  SOURCES.filter(s => SOURCE_META[s].listed && st.avail[s] > 0).forEach(s =>
    bits.push(`<span class="st-listed" title="Grist's own figure — nothing updates it when a customer buys">${
      st.avail[s]} in ${SOURCE_META[s].short} per Grist</span>`));

  const live = S.live[l.recipeId];
  if (live) {
    if (live.pending) bits.push(`<span class="st-live pending">checking the store…</span>`);
    else if (!live.ok) bits.push(`<span class="st-live bad" title="${esc(live.error || '')}">${
      esc('retail check failed')}</span>`);
    else if (!live.listed) bits.push(`<span class="st-live none">not on the retail store</span>`);
    else bits.push(`<span class="st-live" title="${esc((live.matched || []).join(', '))}">${
      live.qty} on the retail store at ${esc(live.at)}${live.oversell ? ' · oversell on' : ''}</span>`);
  }

  const stillShort = st.short - Math.min(st.short, st.avail.General || 0);
  if (stillShort > 0) bits.push(`<span class="st-short">${stillShort} to dye</span>`);

  /* WHERE THE RESERVED SPOOLS ARE. Until now only shelf stock listed a bin, so
     a retail pull said "2 from retail reserved" and nothing about where to go
     and get them. The reservation knows its lot, and the lot knows its bin. */
  const held = {};
  st.allocs.filter(a => a.source).forEach(a => {
    const k = a.lotId + '|' + a.source;
    held[k] = held[k] || { lotId: a.lotId, source: a.source, qty: 0 };
    held[k].qty += a.qty;
  });
  const heldList = Object.values(held).map(h => {
    const info = S.lotInfo[h.lotId] || {};
    const where = SOURCE_META[h.source].listed ? SOURCE_META[h.source].short : '';
    return `${esc(info.lotNumber || ('lot ' + h.lotId))}${
      info.bin ? ' · ' + esc(info.bin) : ''}${where ? ' · ' + esc(where) : ''} (${h.qty})`;
  }).slice(0, 4).join(', ');

  /* What is still ON the shelf, for deciding what to reserve next. */
  const bins = st.lots.filter(x => num(x.by.General) > 0)
    .map(x => `${esc(x.lotNumber)}${x.bin ? ' · ' + esc(x.bin) : ''} (${num(x.by.General)})`)
    .slice(0, 4).join(', ');

  const busy = S.stockBusy ? 'disabled' : '';
  const actions = [];
  SOURCES.forEach(s => {
    if (!st.canReserve(s)) return;
    /* A storefront button names no quantity: it asks. Printing a number there
       would be quoting Grist's guess back as though it were an amount on the
       shelf, which is the whole thing this is trying to stop. */
    const label = SOURCE_META[s].listed
      ? `take from ${SOURCE_META[s].short}…`
      : `reserve ${Math.min(st.short, st.avail[s])} from ${SOURCE_META[s].short}`;
    actions.push(`<button class="btn small ${SOURCE_META[s].listed ? 'listed' : ''}" ${busy}
      onclick="reserveFromStock(${l.id}, '${s}')"
      title="${esc(SOURCE_META[s].listed
        ? 'Asks how many you are taking, then leaves it on the list to change in ' + SOURCE_META[s].store
        : 'Held back, listed nowhere — no storefront to adjust')}"
      >${esc(label)}</button>`);
  });
  /* Offered whenever a storefront pull is possible, because the answer is the
     only reliable input to that decision. */
  if (SOURCES.some(x => SOURCE_META[x].listed && st.canReserve(x))) {
    actions.push(`<button class="btn secondary small" ${busy}
      onclick="checkRetail(${l.id})"
      title="Ask the retail store what it holds right now">${
        S.live[l.recipeId] ? 're-check store' : 'check store'}</button>`);
  }
  if (st.reserved > 0) {
    actions.push(`<button class="btn secondary small" ${busy}
      onclick="releaseReservation(${l.id})">release ${st.reserved}</button>`);
  }
  if (!st.anySource && !st.reserved && anyAvail && st.short > 0 && S.stockNote) {
    actions.push(`<span class="st-why" title="${esc(S.stockNote)}">why can't I reserve?</span>`);
  }
  /* Offered whenever stock is in play for this line — before reserving as much
     as after, since the spools can be judged on the shelf as easily as in the
     hand. */
  if (S.lineCols.makeFresh && (st.reserved > 0 || st.anySource)) {
    actions.push(`<button class="btn secondary small" ${busy}
      onclick="makeFreshInstead(${l.id})"
      title="Send the spools back and dye this line new">make fresh${
        st.reserved ? ' instead' : ''}</button>`);
  }

  /* Each chip sits next to the phrase it belongs to. Left to the end they
     line up as two near-identical grey boxes and it stops being obvious which
     is what you hold and which is what is left. */
  const heldChip = heldList
    ? `<span class="st-bins held" title="Where the reserved spools are">${heldList}</span>` : '';
  const shelfChip = bins
    ? `<span class="st-bins" title="Still on the shelf">${bins}</span>` : '';
  const line = bits
    .filter(b => (b !== RESERVED_HERE || heldChip) && (b !== SHELF_HERE || shelfChip))
    .join('<span class="st-sep">·</span>')
    .replace(RESERVED_HERE, heldChip)
    .replace(SHELF_HERE, shelfChip);

  return `<div class="stock-line">${line}
    ${actions.length ? `<span class="st-actions">${actions.join('')}</span>` : ''}</div>`;
}

/* The de-list list. Deliberately at the top of the screen and deliberately
   not per-order: the spools are off the shelf in Grist but still on sale on a
   storefront, and that is true whichever order you happen to be looking at. */
function todoPanelHtml() {
  if (!S.todoQueue.length) return '';
  const total = S.todoQueue.reduce((n, x) => n + x.qty, 0);
  const canTick = !!(S.allocCols && S.allocCols.adjusted);
  const busy = S.stockBusy ? 'disabled' : '';
  return `<div class="banner warn todo">
    <strong>Change these quantities in Shopify — ${total} spool(s).</strong>
    They are reserved here but still for sale on the storefront, because nothing in this
    stack writes inventory to Shopify. Until you change the number there, the same spool
    can be sold twice. Ticking a row only stops the reminder; it changes nothing by itself.
    <div class="todo-rows">
      ${S.todoQueue.map(x => `<div class="todo-row">
        <span class="todo-qty">${x.qty}×</span>
        <span class="todo-name">${esc(x.name)}</span>
        ${x.sku ? `<span class="code">${esc(x.sku)}</span>` : ''}
        <span class="todo-where">${esc(SOURCE_META[x.source].store)}</span>
        ${x.orderNumber ? `<span class="code">${esc(x.orderNumber)}</span>` : ''}
        ${canTick
          ? `<button class="btn secondary tiny" ${busy}
              onclick="markAdjusted(${x.allocId})">done</button>`
          : ''}
      </div>`).join('')}
    </div>
    ${canTick ? '' : `<div style="margin-top:6px">Add a Toggle column
      <code>Storefront_Adjusted</code> to <code>Lot_Allocations</code> to tick these off.</div>`}
  </div>`;
}


function renderMain() {
  const box = document.getElementById('main');
  if (S.loading) { box.innerHTML = `<div class="panel"><div class="empty">Loading…</div></div>`; return; }
  const o = S.selected ? S.orders.find(x => x.id === S.selected) : null;
  if (!o) {
    box.innerHTML = `<div class="panel"><div class="empty">
      Pick an order on the left, or start a new one.</div></div>`;
    return;
  }

  const lines = S.lines[o.id] || [];
  const spools = lines.reduce((n, l) => n + l.qty, 0);
  const value = lines.reduce((n, l) => n + l.qty * l.price, 0);
  const building = o.status === BUILDING_STATUS;
  const pushed = !!o.shopifyId;

  const custOptions = S.customers.length
    ? `<select onchange="pickCustomer(${o.id}, this.value)">
         <option value="">— pick a customer —</option>
         ${S.customers.map(c => `<option value="${c.id}" ${c.id === o.customerId ? 'selected' : ''}>
           ${esc(c.name)}${c.code ? ' (' + esc(c.code) + ')' : ''}</option>`).join('')}
       </select>`
    : `<input type="text" value="${esc(o.customerName)}" placeholder="Customer name"
         onchange="setOrderField(${o.id}, ${JSON.stringify(S.cols.customerName)}, this.value)">`;

  const lineRows = lines.length
    ? lines.map(l => `<tr>
        <td>${esc(l.recipeName || l.sku)}${stockLineHtml(l)}</td>
        <td class="sku">${esc(l.sku)}</td>
        <td class="num"><input type="number" min="0" value="${l.qty}"
          onchange="setLineQty(${l.id}, this.value)"></td>
        <td class="num">${l.price ? '$' + (l.qty * l.price).toFixed(2) : '—'}</td>
        <td style="text-align:right">
          <button class="btn danger small"
            onclick="removeLine(${l.id}, ${esc(JSON.stringify(l.recipeName || l.sku))})">remove</button></td>
      </tr>`).join('')
    : `<tr><td colspan="5" class="empty" style="padding:14px">No lines yet.</td></tr>`;

  box.innerHTML = `<div class="panel">
    <h3>${esc(o.number)} ${building ? '<span class="badge building">building</span>'
      : '<span class="badge active">released</span>'}</h3>
    <div class="sub">${building
      ? 'Editable, invisible to production, and not in Shopify.'
      : 'Released for production. Still not in Shopify.'}</div>

    <div class="field-row">
      <label class="lab">Customer</label>${custOptions}
    </div>

    <table class="lines">
      <thead><tr><th>Colourway</th><th>SKU</th><th style="text-align:right">Spools</th>
        <th style="text-align:right">Value</th><th></th></tr></thead>
      <tbody>${lineRows}</tbody>
      ${lines.length ? `<tfoot><tr><td colspan="2">Total</td>
        <td class="num">${spools}</td>
        <td class="num">${value ? '$' + value.toFixed(2) : '—'}</td><td></td></tr></tfoot>` : ''}
    </table>

    ${(() => {
      /* An order at 0.00 is only obvious at the push preview, by which point
         you are one click from an invoice you would have to void. Say it here. */
      if (!lines.length) return '';
      /* NO PRICE COLUMN AT ALL is the loudest version of this problem, not a
         reason to stay quiet. Every Value cell reads '—', the total reads '—',
         and the push still goes over at 0.00 because the workflow reads a
         field that is not there. Silence here was indistinguishable from an
         order that happens to be priced. */
      if (!S.lineCols.price) {
        return `<div class="banner bad" style="margin-top:10px">
          <strong>Work_Order_Lines has no price column</strong>, so every line here would go
          to Shopify at $0.00 and there is nowhere to put a rate. Add a Numeric column
          <code>Unit_Price</code> to <code>Work_Order_Lines</code> — the push workflow already
          reads that name — then reload and press <strong>apply pricing</strong>.</div>`;
      }
      const noPrice = lines.filter(l => !num(l.price));
      if (!noPrice.length) return '';
      const linked = !!o.customerId;
      const haveRates = linked && !!S.pricing[o.customerId];
      return `<div class="banner warn" style="margin-top:10px">
        <strong>${noPrice.length} line(s) have no price</strong> and would go over at $0.00.
        ${!linked
          ? 'This order is not linked to a row in <code>Customers</code>, and pricing is looked up by that link rather than by the name — pick the customer from the dropdown above.'
          : !haveRates
            ? `No usable rates for ${esc(o.customerName || 'this customer')}. ${S.pricingNote
                ? esc(S.pricingNote)
                : `Add a row to <code>${esc(S.pricingTable || 'Customer_Pricing')}</code> with a blank Recipe for their standard rate.`}`
            : 'Their rates are on file — use <strong>apply pricing</strong> to fill these in.'}
      </div>`;
    })()}
    <div class="add-row">
      <select id="addRecipe" class="grow" onchange="setAddRecipe(this.value)">
        <option value="">— add a colourway —</option>
        ${S.recipes.map(r => `<option value="${r.id}" ${String(r.id) === String(S.addRecipe) ? 'selected' : ''}>
          ${esc(r.name)} · ${esc(r.sku)}${esc(stockHint(r.id))}</option>`).join('')}
      </select>
      ${(() => {
        const opts = addSourceOptions();
        if (!opts.length) return '';   // only before a colourway is picked
        return `<select id="addSource" class="src" onchange="setAddSource(this.value)"
          title="Where these spools come from">
          ${opts.map((o, i) => `<option value="${esc(o.v)}" ${o.off ? 'disabled' : ''} ${
            !o.off && o.v === S.addSource && !(o.v === '' && i > 0) ? 'selected' : ''
          }>${esc(o.label)}</option>`).join('')}
        </select>`;
      })()}
      <input type="number" min="1" value="${esc(S.addQty)}" onchange="S.addQty = this.value">
      <button class="btn" onclick="addLine(${o.id})">Add</button>
    </div>

    ${pushPanelHtml(o)}

    <div class="actions">
      ${building
        ? `<button class="btn" onclick="markReady(${o.id})">Release for production</button>`
        : `<button class="btn secondary" onclick="backToBuilding(${o.id})">Back to building</button>`}
      <button class="btn secondary" onclick="previewPush(${o.id})"
        ${building || pushed || S.pushBusy ? 'disabled' : ''}
        title="${pushed ? 'Already in Shopify' : building
          ? 'Release it for production first' : 'Shows what would be sent before anything is created'}">
        ${pushed ? 'In Shopify' : 'Push to Shopify…'}</button>
      ${lines.length ? `<button class="btn secondary" onclick="applyPricing(${o.id})"
        ${S.stockBusy ? 'disabled' : ''}
        title="${pushed
          ? 'Already in Shopify — this fixes Grist\'s record, not the Shopify invoice'
          : !S.lineCols.price
            ? 'Work_Order_Lines has no price column — press this to see what to add'
            : 'Fill in blank prices from this customer\'s rates'}">apply pricing</button>` : ''}
      <button class="btn danger" onclick="deleteOrder(${o.id})" ${pushed ? 'disabled' : ''}>Delete</button>
    </div>
  </div>`;
}

function render() {
  renderBanners();
  renderSide();
  renderMain();
}

grist.ready({ requiredAccess: 'full' });
loadAll();
</script>
</body>
</html>
