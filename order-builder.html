<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Builder</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC;
  --accent: #8B3A2A; --accent-light: #F2E8E5; --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8; --done-bg: #EAF3DE; --done-text: #27500A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; padding: 14px; }
.top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
.subtitle { font-size: 11.5px; color: #8B7D72; margin-bottom: 12px; }

.btn { font-size: 11px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--teal);
  background: var(--teal); color: white; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.secondary { background: white; color: var(--ink); border-color: var(--rule); font-weight: 500; }
.btn.danger { background: white; color: var(--accent); border-color: var(--rule); font-weight: 500; }
.btn.danger:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { font-size: 10px; padding: 4px 9px; }

.banner { margin-bottom: 12px; padding: 9px 12px; border-radius: 6px; font-size: 11.5px; line-height: 1.6;
  background: white; border: 1px solid var(--rule); color: #6B5E52; }
.banner.warn { background: var(--gold-light); border-color: #E4CF9E; color: #6E4C13; }
.banner.bad { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.banner code { font-family: 'DM Mono', monospace; background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 3px; }

.cols { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.side { width: 240px; flex-shrink: 0; }
.main { flex: 1; min-width: 320px; }

.order-item { background: white; border: 1.5px solid var(--rule); border-radius: 7px; padding: 8px 10px;
  margin-bottom: 6px; cursor: pointer; }
.order-item:hover { border-color: var(--teal); }
.order-item.sel { border-color: var(--accent); background: var(--accent-light); }
.order-item .num { font-family: 'DM Mono', monospace; font-weight: 700; font-size: 12px; }
.order-item .cust { font-size: 12px; font-weight: 600; }
.order-item .meta { font-size: 10.5px; color: #8B7D72; margin-top: 2px; }

.panel { background: white; border: 1.5px solid var(--rule); border-radius: 8px; padding: 14px; }
.panel h3 { font-family: 'Libre Baskerville', serif; font-size: 15px; margin-bottom: 2px; }
.panel .sub { font-size: 11px; color: #8B7D72; margin-bottom: 12px; }

.field-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
/* The add row, kept on one line. A <select> sizes itself to its WIDEST option,
   and the colourway options carry a stock summary now, so left alone it demands
   the whole row and pushes the quantity and the button onto the next one.
   min-width:0 is what actually lets a flex item shrink below that intrinsic
   width — flex-basis alone does not. */
.add-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.add-row .grow { flex: 1 1 140px; min-width: 0; }
.add-row select { max-width: 100%; text-overflow: ellipsis; }
.add-row .src { flex: 0 1 auto; min-width: 0; }
.add-row input[type=number] { flex: 0 0 64px; }
.add-row .btn { flex: 0 0 auto; }
label.lab { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #8B7D72; min-width: 70px; }
select, input[type=text], input[type=number] {
  padding: 7px 9px; border: 1px solid var(--rule); border-radius: 5px; font-size: 12.5px;
  font-family: 'Inter', sans-serif; background: white; color: var(--ink);
}
select:focus, input:focus { outline: none; border-color: var(--teal); }
input[type=number] { width: 70px; font-family: 'DM Mono', monospace; }

table.lines { width: 100%; border-collapse: collapse; margin-top: 4px; }
table.lines th { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: #8B7D72;
  text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule); }
table.lines td { padding: 5px 6px; border-bottom: 1px solid #F0EAE2; font-size: 12.5px; vertical-align: middle; }
table.lines td.sku { font-family: 'DM Mono', monospace; font-size: 11px; color: #8B7D72; }
table.lines td.num { font-family: 'DM Mono', monospace; text-align: right; }
table.lines tfoot td { font-weight: 700; border-top: 2px solid var(--rule); border-bottom: none; }

.totals { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.tot { font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 600;
  background: var(--warm); color: #6B5E52; }

.badge { font-size: 9px; padding: 3px 8px; border-radius: 10px; text-transform: uppercase;
  letter-spacing: .03em; font-weight: 700; white-space: nowrap; }
.badge.building { background: var(--gold-light); color: var(--gold); }
.badge.active { background: var(--teal-light); color: var(--teal); }
.badge.pushed { background: var(--done-bg); color: var(--done-text); }

.empty { color: #8B7D72; font-style: italic; padding: 24px; text-align: center; }

/* Back stock, under each line. Deliberately quiet: it is context for a
   decision, not the decision. */
.stock-line { margin-top: 5px; font-size: 10.5px; line-height: 1.7; color: #6B5E52;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.st-sep { color: #C4B8AB; }
.st-ok { color: var(--teal); font-weight: 600; }
.st-some { color: var(--gold); font-weight: 600; }
.st-none { color: #A89B8F; }
.st-short { color: var(--accent); font-weight: 600; }
.st-res { color: var(--teal); font-weight: 700; }
.st-listed { color: #A89B8F; font-style: italic; }
.st-bins { font-family: 'DM Mono', monospace; font-size: 10px; color: #8B7D72;
  background: rgba(0,0,0,.035); padding: 1px 6px; border-radius: 3px; }
/* Where the RESERVED spools are — the picking information, so it reads louder
   than the what-is-still-available list beside it. */
.st-bins.held { color: var(--teal); background: var(--teal-light); font-weight: 500; }
.st-actions { display: inline-flex; gap: 5px; flex-wrap: wrap; }
.st-why { font-size: 10px; color: var(--gold); text-decoration: underline dotted; cursor: help; }
.st-live { color: var(--teal); font-weight: 700; background: var(--teal-light);
  padding: 2px 7px; border-radius: 9px; font-size: 10px; }
.st-live.pending { color: #8B7D72; background: var(--warm); font-weight: 500; }
.st-live.bad { color: var(--accent); background: var(--accent-light); }
.st-live.none { color: #8B7D72; background: var(--warm); }
.st-fresh { color: var(--accent); font-weight: 700; text-transform: uppercase;
  font-size: 9.5px; letter-spacing: .04em; background: var(--accent-light);
  padding: 2px 7px; border-radius: 9px; }
/* A pull from a listed source carries an obligation, so its button never looks
   like the consequence-free one next to it. */
.btn.listed { background: var(--gold); border-color: var(--gold); }
.btn.tiny { font-size: 9.5px; padding: 3px 7px; }

.banner.todo { border-width: 1.5px; }
.todo-rows { margin-top: 7px; display: flex; flex-direction: column; gap: 4px; }
.todo-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  background: rgba(255,255,255,.6); padding: 4px 8px; border-radius: 4px; }
.todo-qty { font-weight: 700; font-family: 'DM Mono', monospace; }
.todo-name { font-weight: 600; }
.todo-where { font-size: 10px; font-style: italic; }
.todo-row .btn { margin-left: auto; }
.toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 9px 16px; border-radius: 6px; font-size: 12px;
  opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.actions { display: flex; gap: 8px; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--rule); flex-wrap: wrap; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <span class="title">Order Builder</span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn secondary" onclick="loadAll()">↻ Reload</button>
    <button class="btn" onclick="newOrder()">+ New order</button>
  </div>
</div>
<div class="subtitle">
  Build a vendor order here while it is still changing. It lives only in Grist — nothing reaches Shopify,
  so no notification can fire — until you deliberately push it.
</div>

<div id="banners"></div>

<div class="cols">
  <div class="side" id="side"></div>
  <div class="main" id="main"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── Order Builder ─────────────────────────────────────────────────────────
   Somewhere to build a vendor order before it exists in Shopify.

   WHY THIS EXISTS. A Shopify draft order is silent, but it is also invisible
   to ShipStation — nothing can be shipped until the draft is completed into a
   real order, and completing it emails the customer. Shopify is explicit that
   this cannot be turned off: the only workaround they offer is to create the
   draft with no customer details at all and attach the customer afterwards,
   which means the draft does not say who it is for during exactly the period
   you are working on it.

   So an order that is still being negotiated has nowhere good to live. Here it
   lives in Grist, where it can be edited for as long as it takes and nothing
   can be sent to anyone, because there is nothing in Shopify to send about.

   SAFE FROM THE EXISTING SYNC, by construction. "Diff Draft Quantities" looks
   up each Active work order in Shopify and, finding none, records it as
   unmatched and moves on — it returns before reaching the line loop, so
   CANCEL_REMOVED_LINES can never zero these lines out. Orders held at
   BUILDING_STATUS are skipped earlier still, on the status check. Neither path
   writes anything.

   Order numbers are prefixed so they cannot collide with Shopify's. The import
   branch dedupes on Order_Number, so a Shopify order could in principle share a
   number with a manual one and be skipped as "already imported" — the prefix
   makes that impossible. */

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function columnAsArray(t, c) { return c && Array.isArray(t[c]) ? t[c] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k =>
      k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
function up(s) { return String(s == null ? '' : s).trim().toUpperCase(); }

/* Accent folding — KEEP BYTE-IDENTICAL ACROSS WIDGETS.
   normalize() strips anything outside a-z0-9, which DELETES accented letters
   rather than folding them: "Pathétique" became "pathtique" while the file
   "Pathetique.jpg" became "pathetique", so the two never matched and the widget
   reported nothing found. NFD splits a letter from its diacritic so the
   diacritic can be dropped and the base letter kept; the map handles the
   characters that have no decomposition (ß, ø, æ and friends).
   Display is untouched — this only ever builds comparison keys. */
const ACCENT_FOLD_MAP = { 'æ':'ae','Æ':'ae','œ':'oe','Œ':'oe','ø':'o','Ø':'o',
  'ß':'ss','đ':'d','Đ':'d','ð':'d','Ð':'d','ł':'l','Ł':'l','þ':'th','Þ':'th' };
function foldAccents(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[æÆœŒøØßđĐðÐłŁþÞ]/g, c => ACCENT_FOLD_MAP[c] || c);
}
function sortKey(s) { return foldAccents(s || '').toLowerCase(); }

/* ── Vocabulary, shared with the rest of the stack ────────────────────────
   MANUAL_PREFIX keeps these numbers out of Shopify's namespace. Shopify uses
   bare integers for orders and a "D" prefix for drafts, so "M-" is free.

   BUILDING_STATUS is a status no other widget treats as live work: Thread
   Board and Order Overview look for Active or blank, and the quantity sync
   only touches Active. An order sitting here is therefore invisible to
   production until it is deliberately released — which is the point, because
   a fluid order should not be sending anyone to a kettle. */
/* ── Pushing to Shopify ───────────────────────────────────────────────────
   Two presses, deliberately. The first previews — the workflow builds exactly
   what it would send and returns it without touching anything — and the second
   sends. It is the same webhook and the same code path either way, so what you
   are shown is produced by the thing that does the sending rather than by a
   second implementation that can drift.

   The preview matters most for the address: Grist keeps city, state and
   postcode in one column and Shopify needs them apart, so the workflow has to
   split them. A silently mis-split address is a parcel that goes to the wrong
   place and a customer who finds out before you do. */
const PUSH_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/push-manual-order';
const PUSH_TIMEOUT_MS = 60000;

const MANUAL_PREFIX = 'M-';
const BUILDING_STATUS = 'Building';
const READY_STATUS = 'Active';
const MANUAL_TYPE = 'Manual';

/* ── Reserving stock ───────────────────────────────────────────────────────
   Pulling spools for an order means two writes, the same pair batch-assignment
   makes: an allocation row against the line, and the source lot's stock column
   down by what was taken.

   RELEASING IT AGAIN IS THE HARD PART, and it is why this needs a column of
   its own. Winding new production writes an allocation with exactly the same
   Status as a stock pull does ('Wound - Needs Labels' in both), so status
   cannot tell the two apart. Releasing a wound allocation would credit a lot
   with spools that were never on the shelf — inventing stock out of nothing.

   So a reservation records WHERE IT CAME FROM, not merely that it came from
   somewhere. Lot_Allocations needs a Choice column Stock_Source holding
   exactly General, Store or Vendor; blank means wound production. A boolean
   would not do: per stock-model.md those are three states of one pile, and
   releasing has to credit the column the spools actually left. A retail pull
   handed back into General would quietly move stock between storefronts.

   Blank as the safe default is the point — an allocation nobody marked is not
   a reservation and will never be released. Without the column the shelf is
   still shown, because reading was never the risky part; only reserving is
   refused, so nothing irreversible can be made. */
const STOCK_SOURCE_COL = ['Stock_Source', 'Stock_Bucket', 'Reserved_From'];

/* The three sources, in the order they should be offered. General first
   because it is the only one with no consequence outside Grist. */
const SOURCES = ['General', 'Store', 'Vendor'];
const SOURCE_META = {
  General: { label: 'back stock', col: ['General_Stock_Spools'], listed: false,
             short: 'shelf' },
  Store:   { label: 'retail stock', col: ['Store_Stock_Spools'], listed: true,
             short: 'retail', store: 'the retail store' },
  Vendor:  { label: 'vendor stock', col: ['Vendor_Stock_Spools'], listed: true,
             short: 'vendor', store: 'the vendor store' },
};

/* Pulling from a LISTED source is not finished when Grist is updated.
   Nothing in this stack writes inventory to Shopify — stock-model.md is
   explicit that Grist is deliberately not the master — so a spool taken out
   of Store stock here is still on sale on the storefront until someone
   adjusts it there by hand. That gap is how the same spool gets sold twice,
   and the only defence is that the gap stays visible until it is closed.

   This column records ONLY that the human has been to Shopify and changed the
   number. It has no effect on anything: not on the allocation, not on the lot,
   not on Shopify. It is a tick on a to-do list and nothing more, which is why
   it is named for what the person did rather than for what the storefront
   shows. Toggle default false = not adjusted yet = still on the list. */
const ADJUSTED_COL = ['Storefront_Adjusted', 'Retail_Delisted', 'Delisted'];

const RESERVE_STATUS_FALLBACK = 'Wound - Needs Labels';

/* Live retail inventory. Store_Stock_Spools is a number nobody updates when a
   retail customer buys something — a starting guess, not a fact — so reserving
   against it means reserving spools that may have sold last week. This asks
   the storefront what it actually holds, at the moment of reserving. */
const RETAIL_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/retail-inventory';
const RETAIL_TIMEOUT_MS = 30000;

const S = {
  orders: [], lines: {}, recipes: [], recipesById: {}, customers: [],
  pricing: {},           // customerId -> recipeId -> unit price
  pricingNote: '',       // why the rate card is thinner than expected, when it is
  pricingTable: '',      // which table the rates actually came from
  pricingRows: 0,        // how many rate rows were usable
  selected: null,
  cols: {}, lineCols: {},
  loading: true, error: '',
  addRecipe: '', addQty: 1, addSource: '',
  missing: [],
  push: null,        // the last preview or push response
  pushBusy: false,

  stockByRecipe: {},   // recipeId -> [{ lotId, lotNumber, bin, sortAt, by: {source: n} }]
  lotStock: {},        // lotId    -> { General, Store, Vendor } as they stand now
  lotInfo: {},         // lotId    -> { lotNumber, bin } for every lot, empty or not
  lotCols: {},         // resolved Production_Lots columns, for creating one
  freshLot: null,      // a lot created moments ago, still awaiting its made count
  allocByLine: {},     // lineId   -> [{ id, lotId, qty, source, adjusted }]
  allocCols: null,     // resolved Lot_Allocations columns, null when unreadable
  stockCols: {},       // source -> the Production_Lots column it draws down
  reserveStatus: RESERVE_STATUS_FALLBACK,
  stockNote: '',       // why reserving is unavailable, when it is
  stockBusy: false,
  live: {},            // recipeId -> { at, qty, notes, error, listed } from the storefront
  prefixGroups: [],    // [['FFN','NFF'], ...] — every spelling of one fibre
  todoQueue: [],       // storefront quantities still needing a manual change
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── Load ───────────────────────────────────────────────────────────────── */

async function loadAll() {
  S.loading = true; S.error = ''; render();
  try {
    const [woT, wolT, recT] = await Promise.all([
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Recipes'),
    ]);

    const c = (cands) => findColumn(woT, cands);
    S.cols = {
      number: c(['Order_Number']), shopifyId: c(['Shopify_Order_ID']),
      customerName: c(['Customer_Name']), customer: c(['Customer']),
      status: c(['Status']), channel: c(['Channel']), type: c(['Order_Type']),
      orderDate: c(['Order_Date']), dueDate: c(['Due_Date']), notes: c(['Notes']),
    };
    const lc = (cands) => findColumn(wolT, cands);
    S.lineCols = {
      wo: lc(['Work_Order']), sku: lc(['SKU']), qty: lc(['Qty_Needed']),
      dyed: lc(['Qty_Dyed']), recipe: lc(['Recipe']), queue: lc(['Queue_Status']),
      priority: lc(['Production_Priority']), notes: lc(['Notes']),
      price: lc(['Unit_Price', 'Price']),
      /* Set when the spools on the shelf were looked at and judged not good
         enough for THIS customer. It only ever restricts — a line without it
         behaves exactly as before — so the Toggle default of false is the
         safe one, and an older doc without the column simply never overrides. */
      makeFresh: lc(['Make_Fresh', 'Dye_Fresh', 'No_Stock']),
    };

    /* Writing to a column that does not exist 400s the whole request, so the
       ones this widget writes are checked up front and the builder refuses
       rather than failing halfway through creating an order. */
    S.missing = [];
    [['Order_Number', S.cols.number], ['Customer_Name', S.cols.customerName],
     ['Status', S.cols.status], ['Order_Type', S.cols.type]]
      .forEach(([name, col]) => { if (!col) S.missing.push('Work_Orders.' + name); });
    [['Work_Order', S.lineCols.wo], ['SKU', S.lineCols.sku], ['Qty_Needed', S.lineCols.qty]]
      .forEach(([name, col]) => { if (!col) S.missing.push('Work_Order_Lines.' + name); });

    const rc = (cands) => findColumn(recT, cands);
    const REC = { name: rc(['Recipe_Name']), sku: rc(['SKU_Base']), fiber: rc(['Fiber_Type']) };
    S.recipes = (recT.id || []).map((id, i) => ({
      id,
      name: columnAsArray(recT, REC.name)[i] || `Recipe #${id}`,
      sku: columnAsArray(recT, REC.sku)[i] || '',
      fiber: columnAsArray(recT, REC.fiber)[i] || '',
    })).filter(r => r.sku).sort((a, b) => sortKey(a.name).localeCompare(sortKey(b.name)));
    S.recipesById = {};
    S.recipes.forEach(r => { S.recipesById[r.id] = r; });

    S.orders = (woT.id || []).map((id, i) => ({
      id,
      number: String(columnAsArray(woT, S.cols.number)[i] || ''),
      shopifyId: String(columnAsArray(woT, S.cols.shopifyId)[i] || ''),
      customerName: columnAsArray(woT, S.cols.customerName)[i] || '',
      customerId: S.cols.customer ? getRefId(columnAsArray(woT, S.cols.customer)[i]) : null,
      status: String(columnAsArray(woT, S.cols.status)[i] || ''),
      type: String(columnAsArray(woT, S.cols.type)[i] || ''),
      notes: columnAsArray(woT, S.cols.notes)[i] || '',
    }));

    S.lines = {};
    (wolT.id || []).forEach((id, i) => {
      const woId = getRefId(columnAsArray(wolT, S.lineCols.wo)[i]);
      if (!woId) return;
      const recipeId = S.lineCols.recipe ? getRefId(columnAsArray(wolT, S.lineCols.recipe)[i]) : null;
      (S.lines[woId] = S.lines[woId] || []).push({
        id,
        sku: columnAsArray(wolT, S.lineCols.sku)[i] || '',
        qty: num(columnAsArray(wolT, S.lineCols.qty)[i]),
        dyed: num(columnAsArray(wolT, S.lineCols.dyed)[i]),
        recipeId,
        recipeName: recipeId && S.recipesById[recipeId] ? S.recipesById[recipeId].name : '',
        price: S.lineCols.price ? num(columnAsArray(wolT, S.lineCols.price)[i]) : 0,
        makeFresh: S.lineCols.makeFresh
          ? !!columnAsArray(wolT, S.lineCols.makeFresh)[i] : false,
      });
    });

    await loadCustomers();
    await loadPricing();
    await loadStock();

    // Keep the selection across a reload if it still exists.
    if (S.selected && !S.orders.some(o => o.id === S.selected)) S.selected = null;

    S.loading = false;
    render();
  } catch (e) {
    console.error('Order Builder failed to load:', e);
    S.error = e && e.message ? e.message : String(e);
    S.loading = false;
    render();
  }
}

/* ── Back stock ───────────────────────────────────────────────────────────
   Entirely optional. Every failure in here leaves S.stockNote explaining what
   is missing and leaves the rest of the builder working — an order can always
   be built and pushed without ever touching the shelf. */
async function loadStock() {
  S.stockByRecipe = {}; S.allocByLine = {}; S.allocCols = null;
  S.stockCols = {}; S.lotStock = {}; S.lotInfo = {}; S.stockNote = ''; S.todoQueue = [];
  S.stockFailed = false;
  try {
    const [lotT, allocT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Lot_Allocations'),
    ]);

    const lc = (cands) => findColumn(lotT, cands);
    const LOT = { recipe: lc(['Recipe']), number: lc(['Lot_Number']),
                  date: lc(['Date_Dyed']), bin: lc(['Storage_Bin']),
                  made: lc(['Spools_Made']), notes: lc(['Notes']) };
    S.lotCols = LOT;
    SOURCES.forEach(s => {
      const col = lc(SOURCE_META[s].col);
      if (col) S.stockCols[s] = col;
    });
    if (!Object.keys(S.stockCols).length) {
      S.stockNote = 'Production_Lots has no stock columns, so there is nothing to reserve from.';
      return;
    }
    if (!LOT.recipe) {
      S.stockNote = 'Production_Lots has no Recipe column, so lots cannot be matched to a colourway.';
      return;
    }

    const ac = (cands) => findColumn(allocT, cands);
    const ALLOC = {
      lot: ac(['Lot']), qty: ac(['Qty_Spools']), status: ac(['Status']),
      customer: ac(['Customer']), line: ac(['Work_Order_Line']),
      source: ac(STOCK_SOURCE_COL), adjusted: ac(ADJUSTED_COL),
    };
    if (ALLOC.lot && ALLOC.qty && ALLOC.line) S.allocCols = ALLOC;

    /* Reuse whatever status the doc already uses rather than inventing one —
       an unknown value in a Choice column renders as invalid. */
    if (ALLOC.status) {
      const seen = new Set();
      (allocT.id || []).forEach((id, i) => {
        const v = columnAsArray(allocT, ALLOC.status)[i];
        if (v) seen.add(String(v));
      });
      S.reserveStatus = ['Wound - Needs Labels', 'Wound', 'Packed', 'Packaged - Shipped']
        .find(v => seen.has(v)) || RESERVE_STATUS_FALLBACK;
    }

    if (S.allocCols) {
      (allocT.id || []).forEach((id, i) => {
        const lineId = getRefId(columnAsArray(allocT, ALLOC.line)[i]);
        if (!lineId) return;
        /* Only a value this widget understands counts as a reservation. An
           unrecognised one is treated as production — the cautious reading,
           since it means release leaves it alone rather than crediting a
           column it guessed at. */
        const raw = ALLOC.source ? String(columnAsArray(allocT, ALLOC.source)[i] || '').trim() : '';
        const source = SOURCES.find(s => s.toLowerCase() === raw.toLowerCase()) || '';
        (S.allocByLine[lineId] = S.allocByLine[lineId] || []).push({
          id, source,
          lotId: getRefId(columnAsArray(allocT, ALLOC.lot)[i]),
          qty: num(columnAsArray(allocT, ALLOC.qty)[i]),
          adjusted: ALLOC.adjusted ? !!columnAsArray(allocT, ALLOC.adjusted)[i] : false,
        });
      });
    }
    if (!ALLOC.source) {
      S.stockNote = 'Add a Choice column Stock_Source to Lot_Allocations, with the values '
        + 'General, Store and Vendor, to reserve. Without it a reservation could not be '
        + 'told apart from newly wound spools, and releasing one would credit a lot with '
        + 'stock that was never there.';
    }

    /* Every lot's current values, including lots with nothing left. A lot
       reserved down to zero drops out of the display below, and release still
       has to add its spools back — reading from the display list would find
       nothing and silently release zero. */
    (lotT.id || []).forEach((id, i) => {
      const by = {};
      Object.entries(S.stockCols).forEach(([s, col]) => { by[s] = num(columnAsArray(lotT, col)[i]); });
      S.lotStock[id] = by;
      /* Name and bin for EVERY lot, not just ones with stock left. A lot
         reserved down to zero is exactly the one whose spools are in a box
         waiting to be picked, and "where are they" is the question that
         matters then. */
      S.lotInfo[id] = {
        lotNumber: String(columnAsArray(lotT, LOT.number)[i] || ('lot ' + id)),
        bin: String(columnAsArray(lotT, LOT.bin)[i] || '').trim(),
      };
    });

    (lotT.id || []).forEach((id, i) => {
      const recipeId = getRefId(columnAsArray(lotT, LOT.recipe)[i]);
      if (!recipeId) return;
      const by = S.lotStock[id] || {};
      /* Empty lots are kept. A lot reading zero everywhere is still a lot of
         this colourway, and a storefront reserve needs one to hang the
         allocation on — Grist's storefront count being zero is precisely the
         case where the spools are on the shop floor anyway. Dropping them here
         made "reserve from retail" impossible exactly when it was needed.
         Nothing displays them: the availability figures are sums, and the bin
         chip only lists lots with shelf stock. */
      (S.stockByRecipe[recipeId] = S.stockByRecipe[recipeId] || []).push({
        lotId: id,
        lotNumber: String(columnAsArray(lotT, LOT.number)[i] || ('lot ' + id)),
        bin: String(columnAsArray(lotT, LOT.bin)[i] || '').trim(),
        sortAt: num(columnAsArray(lotT, LOT.date)[i]) || id,
        by,
      });
    });
    /* Oldest first, so stock rotates rather than growing a stale layer. */
    Object.values(S.stockByRecipe).forEach(list =>
      list.sort((a, b) => a.sortAt - b.sortAt || a.lotId - b.lotId));

    await loadPrefixGroups();
    buildTodoQueue();
  } catch (e) {
    console.warn('Stock unavailable:', e);
    S.stockFailed = true;
    S.stockNote = 'Could not read Production_Lots or Lot_Allocations, so stock is not shown.';
  }
}

/* Which SKU prefixes mean the same fibre. Optional and entirely additive: with
   no Item_Weights table a SKU is simply looked up under the one spelling it
   already has, which is right for a catalogue that does not transpose. */
async function loadPrefixGroups() {
  S.prefixGroups = [];
  try {
    const t = await grist.docApi.fetchTable('Item_Weights');
    const col = findColumn(t, ['SKU_Prefixes', 'SKU_Prefix', 'Prefixes']);
    if (!col) return;
    (t.id || []).forEach((id, i) => {
      const group = String(columnAsArray(t, col)[i] || '')
        .split(/[,;\s]+/).map(x => x.trim().toUpperCase().replace(/_+$/, '')).filter(Boolean);
      if (group.length > 1) S.prefixGroups.push([...new Set(group)]);
    });
  } catch (e) {
    console.warn('Item_Weights unavailable — SKUs looked up under one spelling', e);
  }
}

/* Spools pulled out of a storefront's stock whose quantity has not yet been
   changed on that storefront by hand. Built across every order, not just the
   selected one: the obligation belongs to the storefront, and an order you
   are not currently looking at is exactly the one whose pull gets forgotten. */
function buildTodoQueue() {
  S.todoQueue = [];
  if (!S.allocCols || !S.allocCols.source) return;
  const lineIndex = {};
  Object.entries(S.lines).forEach(([woId, arr]) =>
    arr.forEach(l => { lineIndex[l.id] = { line: l, orderId: Number(woId) }; }));

  Object.entries(S.allocByLine).forEach(([lineId, allocs]) => {
    allocs.forEach(a => {
      if (!a.source || !SOURCE_META[a.source].listed || a.adjusted) return;
      const found = lineIndex[Number(lineId)];
      const order = found ? S.orders.find(o => o.id === found.orderId) : null;
      /* Shopify already did it. An order IMPORTED from a storefront was
         decremented by that storefront at checkout, so pulling the matching
         stock here is Grist catching up — not a change the storefront still
         needs. Nagging about it would walk you into decrementing twice.

         A manual order is the opposite case even after it is pushed: the push
         runs orderCreate with inventoryBehaviour BYPASS, which tells Shopify
         explicitly NOT to touch inventory. So it keeps its Shopify_Order_ID
         and still needs the manual change — which is why this tests the order
         TYPE and not merely the presence of an id. */
      if (order && orderCameFrom(order) === a.source) return;
      S.todoQueue.push({
        allocId: a.id, qty: a.qty, source: a.source,
        sku: found ? (found.line.sku || '') : '',
        name: found ? (found.line.recipeName || found.line.sku) : ('line ' + lineId),
        orderNumber: order ? order.number : '',
        orderId: order ? order.id : null,
      });
    });
  });
  S.todoQueue.sort((a, b) => String(a.orderNumber).localeCompare(String(b.orderNumber)));
}

/* What a line already holds, split by where it came from. Only the reserved
   part is this screen's to hand back. */
function lineStock(line) {
  const allocs = S.allocCols ? (S.allocByLine[line.id] || []) : [];
  const bySource = {};
  SOURCES.forEach(s => { bySource[s] = 0; });
  let reserved = 0;
  allocs.forEach(a => { if (a.source) { bySource[a.source] += a.qty; reserved += a.qty; } });

  /* Qty_Dyed is the guard the delete paths have always used, and it holds even
     when Lot_Allocations cannot be read at all. Taking the larger of the two
     means an unreadable allocation table, or a Qty_Dyed maintained by some
     route this widget does not know about, still stops a destructive click —
     the old refusal survives rather than being replaced by a better-informed
     one that happens to know nothing. */
  const fromAllocs = allocs.filter(a => !a.source).reduce((n, a) => n + a.qty, 0);
  const produced = Math.max(fromAllocs, num(line.dyed) - reserved);

  const lots = line.recipeId ? (S.stockByRecipe[line.recipeId] || []) : [];
  const avail = {};
  SOURCES.forEach(s => { avail[s] = lots.reduce((n, l) => n + num(l.by[s]), 0); });
  const short = Math.max(0, line.qty - reserved - produced);

  /* A line marked make-fresh offers no stock at all, whatever is on the
     shelf. That is the whole point of the flag: the spools were looked at and
     turned down, and without this the next click would reserve them again.

     A STOREFRONT SOURCE IS NOT GATED ON THE GRIST COUNT. That number is only
     ever a guess — retail sells without telling Grist — so hiding the button
     when it reads zero would hide the option exactly when the shelf might
     actually have stock, and offering it at five says nothing about whether
     five are there. The count decides nothing; the person does, after looking.
     General is different: nothing sells out of it behind your back, so its
     number is authoritative and gating on it is right. */
  const canReserve = (s) => {
    if (!(S.allocCols && S.allocCols.source && S.stockCols[s])) return false;
    if (short <= 0 || line.makeFresh) return false;
    return SOURCE_META[s].listed ? true : avail[s] > 0;
  };
  return { allocs, reserved, bySource, produced, lots, avail, short, canReserve,
    anySource: SOURCES.some(s => canReserve(s)) };
}

/* Customers and pricing are both optional — the builder works without either,
   it just asks you to type a name and a price instead of offering them. */
async function loadCustomers() {
  S.customers = [];
  try {
    const t = await grist.docApi.fetchTable('Customers');
    const nameCol = findColumn(t, ['Customer_Name', 'Name']);
    const codeCol = findColumn(t, ['Code']);
    S.customers = (t.id || []).map((id, i) => ({
      id,
      name: columnAsArray(t, nameCol)[i] || `Customer #${id}`,
      code: columnAsArray(t, codeCol)[i] || '',
    })).sort((a, b) => sortKey(a.name).localeCompare(sortKey(b.name)));
  } catch (e) {
    console.warn('Customers table unavailable — type the name instead', e);
  }
}

/* Every way this can fail used to fail silently — a missing table, an
   unresolved column, a row whose Customer did not resolve — and all three came
   out the other end as \"no rates for this customer\", which is the one thing
   they were not. S.pricingNote records what actually happened so the button
   can say it instead of guessing.

   THE ROW-LEVEL ONE IS THE TRAP. Customer_Pricing.Customer is meant to be a
   Reference to Customers; if it is a plain Text column holding the name, every
   row is dropped on the !cid check and a full rate card reports as empty. So a
   name is matched against Customers rather than discarded — the table is
   already loaded, the names are unique enough to match on, and the failure it
   replaces is silent and total. */
async function loadPricing() {
  S.pricing = {}; S.pricingNote = ''; S.pricingRows = 0;
  const TABLES = ['Customer_Pricing', 'Customer_Prices', 'Pricing'];
  let t = null, from = '';
  for (const name of TABLES) {
    try { t = await grist.docApi.fetchTable(name); from = name; break; }
    catch (e) { /* try the next spelling */ }
  }
  if (!t) {
    S.pricingNote = `No ${TABLES.map(n => n).join(' / ')} table was found in this document.`;
    console.warn('Customer_Pricing unavailable — prices left blank');
    return;
  }
  S.pricingTable = from;
  const custCol = findColumn(t, ['Customer', 'Customer_Ref', 'Vendor', 'Customer_Name']);
  const recCol = findColumn(t, ['Recipe', 'Colourway', 'Colorway']);
  const priceCol = findColumn(t, ['Unit_Price', 'Price', 'Rate', 'Wholesale_Price', 'Price_Per_Spool']);
  const cols = Object.keys(t).filter(k => k !== 'id');
  if (!custCol || !priceCol) {
    S.pricingNote = `${from} has ` +
      (!custCol ? 'no Customer column' : '') +
      (!custCol && !priceCol ? ' and ' : '') +
      (!priceCol ? 'no price column (Unit_Price or Price)' : '') +
      `. Its columns are: ${cols.join(', ')}.`;
    return;
  }

  /* Name -> row id, for the text-column case. Folded the same way every other
     lookup in this stack folds, so an accent or a stray capital does not
     decide whether a customer gets priced. */
  const byName = {};
  S.customers.forEach(c => { byName[sortKey(c.name)] = c.id; });

  let unresolved = 0;
  const unresolvedNames = [];
  (t.id || []).forEach((id, i) => {
    const raw = columnAsArray(t, custCol)[i];
    let cid = getRefId(raw);
    if (!cid && typeof raw === 'string' && raw.trim()) {
      cid = byName[sortKey(raw)] || null;
      /* Distinct names only. A rate card has a row per colourway, so one
         mistyped customer repeats as many times as they have rates and the
         list becomes the same name five times over. */
      if (!cid) {
        const n = raw.trim();
        unresolved++;
        if (unresolvedNames.length < 5 && !unresolvedNames.includes(n)) unresolvedNames.push(n);
        return;
      }
    }
    if (!cid) { unresolved++; return; }
    const rid = recCol ? getRefId(columnAsArray(t, recCol)[i]) : null;
    S.pricing[cid] = S.pricing[cid] || {};
    // A row with no recipe is the customer's default rate.
    S.pricing[cid][rid || 'default'] = num(columnAsArray(t, priceCol)[i]);
    S.pricingRows++;
  });

  if (unresolved) {
    S.pricingNote = `${unresolved} of ${(t.id || []).length} rows in ${from} have a Customer ` +
      `that doesn't point at any row in Customers, so their rates can't be used` +
      (unresolvedNames.length ? ` (${unresolvedNames.join(', ')})` : '') + '.';
  }
}

function priceFor(customerId, recipeId) {
  const p = S.pricing[customerId];
  if (!p) return 0;
  return num(p[recipeId] != null ? p[recipeId] : p.default);
}

/* ── Order numbering ────────────────────────────────────────────────────── */

/* Next free M- number. Derived from what is in the table rather than stored in
   a counter, so a deleted order's number is reused and nothing drifts if two
   people build at once — the worst case is a collision that Grist itself would
   accept, which is why the number is re-derived at the moment of creation
   rather than when the panel opens. */
function nextManualNumber() {
  let max = 0;
  for (const o of S.orders) {
    const m = /^M-(\d+)$/i.exec(String(o.number || '').trim());
    if (m) max = Math.max(max, parseInt(m[1], 10));
  }
  return MANUAL_PREFIX + (max + 1);
}

function isManual(o) {
  return String(o.type || '') === MANUAL_TYPE ||
    /^M-\d+$/i.test(String(o.number || '').trim());
}

/* Which storefront's checkout has ALREADY decremented for this order, if any.
   Only the vendor store's orders reach Grist — the importer reads
   squirrelvender and nothing else, and retail orders are deliberately absent
   — so an imported order can only have come from there. A manual order has
   no storefront behind it whatever its id, because the push bypasses
   inventory. Returns '' when no storefront has decremented anything. */
function orderCameFrom(o) {
  if (!o || isManual(o)) return '';
  return String(o.shopifyId || '').trim() ? 'Vendor' : '';
}

/* ── Writes ─────────────────────────────────────────────────────────────── */

async function newOrder() {
  if (S.missing.length) { toast('Missing columns — see the banner'); return; }
  const fields = {
    [S.cols.number]: nextManualNumber(),
    [S.cols.customerName]: '',
    [S.cols.status]: BUILDING_STATUS,
    [S.cols.type]: MANUAL_TYPE,
  };
  if (S.cols.channel) fields[S.cols.channel] = 'Wholesale';
  /* Grist Date columns hold epoch SECONDS at UTC midnight — never
     milliseconds, and never local midnight, which lands on the previous day
     for anyone west of UTC. */
  if (S.cols.orderDate) {
    const now = new Date();
    fields[S.cols.orderDate] =
      Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 1000;
  }
  try {
    const res = await grist.docApi.applyUserActions([['AddRecord', 'Work_Orders', null, fields]]);
    const newId = res && res.retValues && res.retValues[0];
    await loadAll();
    if (newId) S.selected = newId;
    render();
    toast('Created ' + fields[S.cols.number]);
  } catch (e) {
    console.error('Could not create the order:', e);
    alert('Could not create the order — this widget needs Full document access. Nothing was changed.');
  }
}

async function setOrderField(id, col, value) {
  if (!col) return;
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Work_Orders', id, { [col]: value }]]);
  } catch (e) {
    console.error('Could not save:', e);
    alert('Could not save that change.');
    await loadAll();
  }
}

async function pickCustomer(id, customerId) {
  const cid = customerId ? Number(customerId) : null;
  const cust = S.customers.find(c => c.id === cid);
  const fields = {};
  if (S.cols.customer) fields[S.cols.customer] = cid;
  if (S.cols.customerName) fields[S.cols.customerName] = cust ? cust.name : '';
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Work_Orders', id, fields]]);
    const o = S.orders.find(x => x.id === id);
    if (o) { o.customerId = cid; o.customerName = cust ? cust.name : ''; }
    render();
  } catch (e) {
    console.error('Could not set the customer:', e);
    alert('Could not set the customer.');
  }
}

/* Where the spools for a NEW line should come from, chosen while adding it
   rather than as a second step afterwards. '' means decide later: the line is
   created and nothing is committed, which is what this screen did before. */
function setAddRecipe(v) { S.addRecipe = v; S.addSource = ''; render(); }
function setAddSource(v) { S.addSource = v; render(); }

async function addLine(orderId) {
  const recipeId = Number(S.addRecipe);
  const qty = Math.max(1, Math.round(num(S.addQty)));
  const r = S.recipesById[recipeId];
  if (!r) { toast('Pick a colourway first'); return; }
  const source = S.addSource;

  const o = S.orders.find(x => x.id === orderId);
  const existing = (S.lines[orderId] || []).find(l => l.recipeId === recipeId);
  /* One line per colourway. The quantity sync cannot tell two lines with the
     same SKU apart — it skips both and says so — so merging here keeps a
     pushed order syncable later. */
  if (existing) {
    await setLineQty(existing.id, existing.qty + qty);
    toast(`${r.name} → ${existing.qty + qty}`);
    /* The merged quantity is now short by what was just added, so the chosen
       source still applies — to the increase, not to the whole line. */
    if (source === 'fresh') await makeFreshInstead(existing.id);
    else if (source) await reserveFromStock(existing.id, source);
    return;
  }

  const fields = {
    [S.lineCols.wo]: orderId,
    [S.lineCols.sku]: r.sku,
    [S.lineCols.qty]: qty,
  };
  if (S.lineCols.recipe) fields[S.lineCols.recipe] = recipeId;
  if (S.lineCols.dyed) fields[S.lineCols.dyed] = 0;
  if (S.lineCols.queue) fields[S.lineCols.queue] = 'Open';
  if (S.lineCols.priority) fields[S.lineCols.priority] = 'Normal';
  if (S.lineCols.notes) fields[S.lineCols.notes] = r.name;
  if (S.lineCols.price && o) {
    const p = priceFor(o.customerId, recipeId);
    if (p) fields[S.lineCols.price] = p;
  }
  /* "make new" is set on the row itself, so the line is never briefly open to
     a stock pull. A stock source cannot be: the allocation needs the line's
     row id, which does not exist until this write returns. If that second step
     fails the line is simply there unreserved — harmless, and the reserve
     button on the line is right there. */
  if (source === 'fresh' && S.lineCols.makeFresh) fields[S.lineCols.makeFresh] = true;

  try {
    const res = await grist.docApi.applyUserActions([
      ['AddRecord', 'Work_Order_Lines', null, fields]]);
    const newId = (res && res.retValues && res.retValues[0]) || null;
    await loadAll();
    if (source && source !== 'fresh' && newId) {
      await reserveFromStock(newId, source);
    } else {
      toast(source === 'fresh'
        ? `Added ${qty}× ${r.name} — dyeing fresh`
        : `Added ${qty}× ${r.name}`);
    }
    S.addSource = '';
  } catch (e) {
    console.error('Could not add the line:', e);
    alert('Could not add that line.');
  }
}

/* The options for the source picker, for whichever colourway is selected.

   ALWAYS at least two entries, so the control never vanishes. Hiding it when
   there was nothing to offer looked exactly like the feature being broken —
   a colourway with no stock and a doc without Make_Fresh left one option, the
   picker disappeared, and there was nothing on screen to explain why. A
   disabled line that says what is missing is worth more than a clean gap. */
function addSourceOptions() {
  const r = S.recipesById[Number(S.addRecipe)];
  if (!r) return [];
  const lots = S.stockByRecipe[r.id] || [];
  const out = [{ v: '', label: 'decide later' }];

  let offered = 0;
  if (S.allocCols && S.allocCols.source) {
    SOURCES.forEach(s => {
      if (!S.stockCols[s]) return;
      const have = lots.reduce((n, l) => n + num(l.by[s]), 0);
      if (have > 0) { out.push({ v: s, label: `from ${SOURCE_META[s].short} (${have})` }); offered++; }
    });
    if (!offered) out.push({ v: '', label: 'no stock for this colourway', off: true });
  } else {
    out.push({ v: '', label: 'add Stock_Source to reserve stock', off: true });
  }

  out.push(S.lineCols.makeFresh
    ? { v: 'fresh', label: 'make new' }
    : { v: '', label: 'make new — add Make_Fresh column', off: true });
  return out;
}

async function setLineQty(lineId, qty) {
  const n = Math.max(0, Math.round(num(qty)));
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Work_Order_Lines', lineId, { [S.lineCols.qty]: n }],
    ]);
    await loadAll();
  } catch (e) {
    console.error('Could not change the quantity:', e);
    alert('Could not change that quantity.');
  }
}

/* ── Reserve / release ───────────────────────────────────────────────────── */

function lineById(lineId) {
  return Object.values(S.lines).flat().find(l => l.id === lineId) || null;
}
function orderForLine(lineId) {
  const entry = Object.entries(S.lines).find(([, arr]) => arr.some(l => l.id === lineId));
  return entry ? S.orders.find(o => o.id === Number(entry[0])) : null;
}

/* Draw oldest lot first, the same rotation batch-assignment uses. Returns the
   draws without writing, so the confirmation can name real lots and bins. */
function planDraw(line, source, wantOverride) {
  const st = lineStock(line);
  const listed = SOURCE_META[source].listed;
  /* For General the Grist count is the limit. For a storefront it is not a
     limit at all, only a hint, so an explicit quantity wins. */
  let want = wantOverride != null ? Math.max(0, Math.round(wantOverride))
    : (listed ? st.short : Math.min(st.short, st.avail[source] || 0));

  const draws = [];
  for (const lot of st.lots) {
    if (want <= 0) break;
    const have = num(lot.by[source]);
    const take = Math.min(want, have);
    if (take <= 0) continue;
    draws.push({ lot, take, counted: true });
    want -= take;
  }

  /* Still short on a storefront source: the spools are on the shop floor even
     though Grist's number says otherwise, so the remainder is hung on the
     oldest lot of this colourway. The allocation is the truth — these spools
     are committed to this order — and the lot's column, already wrong, is left
     at zero rather than driven negative. */
  let unbacked = 0;
  if (want > 0 && listed) {
    const anchor = st.lots[0] || null;
    if (anchor) {
      /* Folded into the draw already on that lot rather than added as a second
         one. Two rows for one lot on one line say nothing extra and show up
         twice on the storefront reminder list. */
      const existing = draws.find(d => d.lot.lotId === anchor.lotId);
      if (existing) existing.take += want;
      else draws.push({ lot: anchor, take: want, counted: false });
    }
    unbacked = want;
    want = 0;
  }
  return { draws, total: draws.reduce((n, d) => n + d.take, 0), st, unbacked,
           noLot: unbacked > 0 && !st.lots.length };
}

async function reserveFromStock(lineId, source, qtyOverride) {
  if (S.stockBusy) return;
  if (!SOURCE_META[source]) return;
  const line = lineById(lineId);
  if (!line) return;
  const order = orderForLine(lineId);
  const listed = SOURCE_META[source].listed;

  /* A storefront count cannot be trusted, so the number is asked for rather
     than assumed. The live check, if it has been run, supplies the default. */
  let want = qtyOverride;
  if (want == null && listed) {
    const pre = lineStock(line);
    const live = S.live[line.recipeId];
    const suggested = Math.min(pre.short,
      (live && live.ok && live.qty > 0) ? live.qty : pre.short);
    const said = prompt(
      `How many of ${line.recipeName || line.sku} are you taking from ` +
      `${SOURCE_META[source].store}?\n\n` +
      (live && live.ok
        ? `The storefront reported ${live.qty} when checked at ${live.at}.`
        : `Nothing has been checked — Grist says ${pre.avail[source]}, but that number ` +
          `is only a guess. Look before you commit.`) +
      `\n\nThis line still needs ${pre.short}.`,
      String(Math.max(1, suggested)));
    if (said === null) return;
    want = Math.max(0, Math.round(Number(said)));
    if (!(want > 0)) { alert('Nothing reserved — that was not a quantity.'); return; }
  }

  const { draws, total, st, unbacked, noLot } = planDraw(line, source, want);

  /* NO LOT AT ALL. Common for a colourway that was dyed before Grist tracked
     it, and near-universal for limited editions: the spools are on the shop
     floor, Grist has simply never had a row for them. Refusing here made the
     storefront pull useless for exactly the case it was built for, so the lot
     is offered instead — an honest record of spools that existed and went to
     this order. */
  if (noLot) {
    if (!listed) {
      alert(`${line.recipeName || line.sku} has no production lot in Grist, so there is ` +
        `nothing to record a reservation against.\n\nAdd a lot for it first.`);
      return;
    }
    const made = await createLotFor(line, source, want);
    if (!made) return;
    /* Remembered across the reload so the write below knows this lot still
       has no made count. A property on the lot object would not survive
       loadAll rebuilding them. */
    S.freshLot = made;
    await loadAll();
    return reserveFromStock(lineId, source, want);   // the lot exists now
  }
  if (!st.canReserve(source) || !total) {
    alert(`Nothing available to reserve from ${SOURCE_META[source].label} for this line.`);
    return;
  }
  const A = S.allocCols;
  const col = S.stockCols[source];

  const where = draws.map(d =>
    `  ${d.take} from ${d.lot.lotNumber}${d.lot.bin ? ' (bin ' + d.lot.bin + ')' : ''}`).join('\n');
  /* A listed source needs the consequence spelled out at the moment of the
     click, not only afterwards in a list. Nothing here reaches Shopify —
     unless that storefront's own checkout already did it, in which case
     warning would talk you into decrementing the same spools twice. */
  const unbackedNote = unbacked > 0
    ? `\n\n${unbacked} of these are not reflected in Grist's count for that pile — it ` +
      `reads lower than what you are taking. The reservation records all ${total}; the ` +
      `count stays at zero rather than going negative.`
    : '';
  const already = orderCameFrom(order) === source;
  const warning = !SOURCE_META[source].listed ? ''
    : already
      ? `\n\nThis order came from ${SOURCE_META[source].store}, so its checkout has already ` +
        `taken these off that storefront. Nothing to change in Shopify — this is just Grist ` +
        `catching up.`
      : `\n\nThese spools are LISTED FOR SALE on ${SOURCE_META[source].store}. Grist does not ` +
        `write inventory to Shopify, so they stay on sale until you change the quantity there ` +
        `yourself. They stay listed on this screen until you have done that and ticked them off.`;
  if (!confirm(
    `Reserve ${total} spool(s) of ${line.recipeName || line.sku} from ${SOURCE_META[source].label}?` +
    `\n\n${where}${unbackedNote}${warning}`)) return;

  S.stockBusy = true; render();
  try {
    const acts = [];
    draws.forEach(d => {
      const f = {};
      f[A.lot] = d.lot.lotId;
      f[A.qty] = d.take;
      if (A.status) f[A.status] = S.reserveStatus;
      if (A.customer && order && order.customerId) f[A.customer] = order.customerId;
      f[A.line] = line.id;
      /* Written explicitly. A blank Stock_Source would make this reservation
         permanently unreleasable, and a wrong one would credit the wrong
         storefront when it is released. */
      f[A.source] = source;
      if (A.adjusted) f[A.adjusted] = false;   // the pull itself changes nothing on Shopify
      acts.push(['AddRecord', 'Lot_Allocations', null, f]);
    });
    draws.forEach(d => {
      const now = num((S.lotStock[d.lot.lotId] || {})[source]);
      const fields = { [col]: Math.max(0, now - d.take) };
      /* A lot this screen just created carries no made count yet — it is set
         here so the row only ever claims spools it can also account for. */
      if (d.lot.lotId === S.freshLot && S.lotCols.made) fields[S.lotCols.made] = d.take;
      acts.push(['UpdateRecord', 'Production_Lots', d.lot.lotId, fields]);
    });
    await grist.docApi.applyUserActions(acts);
    S.freshLot = null;
    await loadAll();
    toast(`Reserved ${total} from ${SOURCE_META[source].short}`);
  } catch (e) {
    console.error('Could not reserve:', e);
    alert('Could not reserve those spools. Nothing was changed.');
  } finally {
    S.stockBusy = false; render();
  }
}

/* A lot for a colourway Grist has never recorded, created at the moment its
   spools are taken off a storefront.

   THE ARITHMETIC HAS TO BALANCE. stock-model.md:
     Spools_Made - allocations - (General+Vendor+Store) - Broken = unaccounted
   So the lot is written with Spools_Made equal to what is being taken and the
   stock columns at zero: made N, allocated N, nothing left over, balance zero.
   Writing Spools_Made as zero instead would leave every one of these lots
   permanently short by the amount taken.

   Spools_Made is set in the SECOND call, alongside the allocation, so a
   failure between the two leaves a lot reading 0 made and 0 allocated — which
   still balances — rather than one claiming spools that nothing accounts for. */
async function createLotFor(line, source, want) {
  const L = S.lotCols || {};
  if (!L.recipe) { alert('Production_Lots has no Recipe column, so a lot cannot be created.'); return null; }

  const name = line.recipeName || line.sku;
  if (!confirm(
    `${name} has no production lot in Grist.\n\n` +
    `Create one for the ${want} spool(s) you are taking from ${SOURCE_META[source].store}?\n\n` +
    `It records that these spools existed and went to this order. It does NOT invent ` +
    `shelf stock — the lot is created with nothing left on it.`)) return null;

  const fields = { [L.recipe]: line.recipeId };
  if (L.number) fields[L.number] = nextLotNumber();
  /* Grist Date columns hold epoch SECONDS at UTC midnight. A local-midnight
     value lands on the previous day for anyone west of UTC. */
  if (L.date) {
    const d = new Date();
    fields[L.date] = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
  }
  if (L.made) fields[L.made] = 0;
  Object.values(S.stockCols).forEach(col => { fields[col] = 0; });
  if (L.notes) fields[L.notes] = `Created by the order builder for a ${SOURCE_META[source].short} pull — `
    + `this colourway had no lot.`;

  try {
    const res = await grist.docApi.applyUserActions([['AddRecord', 'Production_Lots', null, fields]]);
    const id = res && res.retValues && res.retValues[0];
    if (!id) throw new Error('no row id came back');
    return id;
  } catch (e) {
    console.error('Could not create a lot:', e);
    alert('Could not create a production lot. Nothing was changed.');
    return null;
  }
}

/* LOT-YYMMDD-NN, continuing the day's numbering rather than restarting it. */
function nextLotNumber() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  const prefix = 'LOT-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-';
  let max = 0;
  Object.values(S.lotInfo || {}).forEach(info => {
    const s = String(info.lotNumber || '');
    if (s.indexOf(prefix) === 0) {
      const n = parseInt(s.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + p(max + 1);
}

/* Build the exact reversal of whatever this screen reserved against a line.
   Only rows carrying a Stock_Source are touched, so an allocation made by
   winding real production can never be turned back into stock — and each one
   is credited to the column it actually left, so a retail pull does not come
   back as back stock. */
function releaseActions(line) {
  const allocs = (S.allocByLine[line.id] || []).filter(a => a.source && S.stockCols[a.source]);
  const backTo = {};   // lotId -> source -> qty
  const acts = [];
  allocs.forEach(a => {
    acts.push(['RemoveRecord', 'Lot_Allocations', a.id]);
    if (!a.lotId) return;
    backTo[a.lotId] = backTo[a.lotId] || {};
    backTo[a.lotId][a.source] = (backTo[a.lotId][a.source] || 0) + a.qty;
  });
  /* One UpdateRecord per lot even when several sources are credited, so two
     draws on one lot cannot each overwrite the other's column. */
  Object.entries(backTo).forEach(([lotId, bySource]) => {
    const fields = {};
    Object.entries(bySource).forEach(([source, qty]) => {
      fields[S.stockCols[source]] = num((S.lotStock[lotId] || {})[source]) + qty;
    });
    acts.push(['UpdateRecord', 'Production_Lots', Number(lotId), fields]);
  });
  return { acts, total: allocs.reduce((n, a) => n + a.qty, 0), backTo };
}

async function releaseReservation(lineId, skipConfirm) {
  if (S.stockBusy) return;
  const line = lineById(lineId);
  if (!line) return;
  const { acts, total, backTo } = releaseActions(line);
  if (!total) { alert('Nothing on this line is reserved from stock.'); return; }

  const lotName = (id) => {
    const lot = (S.stockByRecipe[line.recipeId] || []).find(l => l.lotId === Number(id));
    return lot ? lot.lotNumber : 'lot ' + id;
  };
  const where = Object.entries(backTo).flatMap(([id, bySource]) =>
    Object.entries(bySource).map(([s, q]) =>
      `  ${q} back to ${lotName(id)} · ${SOURCE_META[s].label}`)).join('\n');
  if (!skipConfirm && !confirm(
    `Release ${total} spool(s) of ${line.recipeName || line.sku}?\n\n${where}\n\n` +
    `Only spools this screen reserved are handed back — anything wound in production stays put.`)) return;

  S.stockBusy = true; render();
  try {
    await grist.docApi.applyUserActions(acts);
    await loadAll();
    toast(`Released ${total} back to stock`);
    return true;
  } catch (e) {
    console.error('Could not release the reservation:', e);
    alert('Could not release those spools. Nothing was changed.');
    return false;
  } finally {
    S.stockBusy = false; render();
  }
}

/* ── Asking the storefront what it actually holds ─────────────────────────
   Every spelling of the SKU goes in one request. The two catalogues transpose
   the fibre prefix — Grist FFC_LE1, retail CFF_LE1 — and which is which is
   not recorded anywhere, so asking about both removes the need to know. Only
   one will match, and that is the answer.

   The aliases come from Item_Weights.SKU_Prefixes, the same table ship-preview
   resolves weights from, so the mapping stays data rather than a rule baked
   into three widgets. */
function skuSpellings(sku) {
  const s = String(sku || '').trim();
  if (!s) return [];
  const i = s.indexOf('_');
  if (i < 0) return [s];
  const head = s.slice(0, i).toUpperCase(), tail = s.slice(i);
  const row = S.prefixGroups.find(g => g.includes(head));
  const out = row ? row.map(p => p + tail) : [s];
  return [...new Set([s, ...out])];
}

async function checkRetail(lineId) {
  const line = lineById(lineId);
  if (!line || !line.recipeId) return;
  const skus = skuSpellings(line.sku);
  if (!skus.length) { alert('That line has no SKU to look up.'); return; }

  S.live[line.recipeId] = { pending: true, skus };
  render();

  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), RETAIL_TIMEOUT_MS) : null;
  try {
    const res = await fetch(RETAIL_WEBHOOK_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ skus }), cache: 'no-store',
      ...(ctrl ? { signal: ctrl.signal } : {}),
    });
    if (!res.ok) throw new Error(`the lookup answered ${res.status} ${res.statusText}`);
    const data = await res.json();
    if (data && data.ok === false) throw new Error(data.error || 'the lookup failed');

    const variants = (data && data.variants) || [];
    const qty = variants.reduce((n, v) => n + num(v.onHand), 0);
    S.live[line.recipeId] = {
      ok: true, qty, skus,
      /* Only the spelling the store actually uses comes back, which is worth
         showing: it confirms the lookup found the right product. */
      matched: variants.map(v => v.sku).filter(Boolean),
      listed: variants.length > 0,
      oversell: variants.some(v => v.oversellAllowed),
      notes: (data && data.notes) || [],
      at: new Date().toLocaleTimeString(),
    };
  } catch (e) {
    console.error('Retail lookup failed:', e);
    S.live[line.recipeId] = { ok: false, skus,
      error: (e && e.name === 'AbortError')
        ? `the retail store didn't answer within ${Math.round(RETAIL_TIMEOUT_MS / 1000)}s`
        : ((e && e.message) || String(e)),
      at: new Date().toLocaleTimeString() };
  } finally {
    if (timer) clearTimeout(timer);
    render();
  }
}

/* ── Applying customer pricing ────────────────────────────────────────────
   A line's Unit_Price is written when the line is ADDED, from Customer_Pricing.
   Set a customer's rates after their first order and every existing line keeps
   the zero it was born with — and an order pushed at 0.00 has to be voided and
   redone in Shopify, so this is worth a button rather than twelve hand edits.

   IT FILLS BLANKS ONLY. A price already on a line may have been negotiated for
   this order, and quietly replacing it with the standard rate would be the
   expensive kind of helpful. Lines that disagree with the rate card are
   reported instead, so the difference is visible without being acted on. */
function pricingPlan(orderId) {
  const o = S.orders.find(x => x.id === orderId);
  const lines = S.lines[orderId] || [];
  const fill = [], differ = [], unpriced = [];
  lines.forEach(l => {
    const p = priceFor(o && o.customerId, l.recipeId);
    if (!p) { if (!l.price) unpriced.push(l); return; }
    if (!l.price) fill.push({ l, p });
    else if (Math.abs(num(l.price) - p) > 0.005) differ.push({ l, p });
  });
  return { o, lines, fill, differ, unpriced };
}

async function applyPricing(orderId) {
  if (S.stockBusy) return;
  const o = S.orders.find(x => x.id === orderId);
  if (!o) return;
  if (!S.lineCols.price) {
    alert('Work_Order_Lines has no Unit_Price column, so there is nowhere to put a price.');
    return;
  }
  /* The lookup keys on the customer REFERENCE, not the typed name. A name with
     no link behind it silently prices everything at zero, which is exactly the
     failure this button exists to clean up — so it is named rather than
     producing an empty plan. */
  if (!o.customerId) {
    alert(`${o.customerName || 'This order'} is not linked to a row in Customers, and pricing ` +
      `is looked up by that link rather than by the name.\n\nPick the customer from the ` +
      `dropdown, then try again.`);
    return;
  }
  if (!S.pricing[o.customerId]) {
    /* \"No rows\" is a conclusion, and it was being reported for at least three
       causes that are not that. Whatever the load actually found gets said
       here, because the fix is different for each one. */
    alert(`No usable rates for ${o.customerName || 'this customer'}.\n\n` +
      (S.pricingNote
        ? S.pricingNote + '\n\n'
        : `${S.pricingTable || 'Customer_Pricing'} loaded ${S.pricingRows} rate(s), but none ` +
          `of them point at this customer.\n\n`) +
      `A rate row needs: Customer pointing at the ${o.customerName || 'customer'} row in ` +
      `Customers, a blank Recipe for their standard rate (or a Recipe for one colourway), ` +
      `and a price.`);
    return;
  }

  /* A pushed order is not a reason to disable this. The invoice in Shopify is
     already wrong and nothing here can reach it — but leaving Grist at zero as
     well means the order reads as free in every report that sums these lines.
     A disabled button also looked exactly like a broken one. So: allowed, with
     the limit stated plainly rather than implied by a greyed-out control. */
  if (o.shopifyId && !confirm(
    `${o.number} is already in Shopify.\n\n` +
    `Writing prices here will NOT change the Shopify invoice — that has to be fixed ` +
    `in Shopify itself.\n\n` +
    `Fill them in here anyway, so Grist's record matches what you actually charge?`)) return;

  const { fill, differ, unpriced } = pricingPlan(orderId);
  const name = (l) => l.recipeName || l.sku;
  if (!fill.length) {
    alert(`Nothing to fill in on ${o.number}.` +
      (differ.length ? `\n\n${differ.length} line(s) already have a price that differs from the ` +
        `rate card; those are left alone.` : '') +
      (unpriced.length ? `\n\n${unpriced.length} line(s) have no rate for this customer: ` +
        unpriced.map(name).join(', ') : ''));
    return;
  }

  const money = (n) => '$' + num(n).toFixed(2);
  const added = fill.reduce((t, f) => t + f.p * f.l.qty, 0);
  if (!confirm(
    `Price ${fill.length} line(s) on ${o.number}?\n\n` +
    fill.map(f => `  ${name(f.l)}  ${money(f.p)} × ${f.l.qty} = ${money(f.p * f.l.qty)}`).join('\n') +
    `\n\nOrder value goes up by ${money(added)}.` +
    (differ.length ? `\n\nLEFT ALONE — these already have a price that differs from the rate ` +
      `card, which may be deliberate:\n` +
      differ.map(d => `  ${name(d.l)}  ${money(d.l.price)}, card says ${money(d.p)}`).join('\n') : '') +
    (unpriced.length ? `\n\nNO RATE for this customer, so still unpriced: ` +
      unpriced.map(name).join(', ') : ''))) return;

  S.stockBusy = true; render();
  try {
    await grist.docApi.applyUserActions(fill.map(f =>
      ['UpdateRecord', 'Work_Order_Lines', f.l.id, { [S.lineCols.price]: f.p }]));
    await loadAll();
    toast(`Priced ${fill.length} line(s)`);
  } catch (e) {
    console.error('Could not apply pricing:', e);
    alert('Could not write those prices. Nothing was changed.');
  } finally {
    S.stockBusy = false; render();
  }
}

/* ── Make fresh instead ───────────────────────────────────────────────────
   The spools on the shelf were looked at and turned down for this customer.
   Two things have to happen together: the reservation goes back, and the line
   remembers the decision — otherwise the next click reserves the same spools
   again, and batch-assignment's stock pull would grab them the next time this
   colourway is batched.

   Both writes go in ONE applyUserActions call. Split in two, a failure between
   them leaves spools back on the shelf with the line still inviting a pull, or
   a line refusing stock while still holding it. */
async function makeFreshInstead(lineId) {
  if (S.stockBusy) return;
  const line = lineById(lineId);
  if (!line) return;
  if (!S.lineCols.makeFresh) {
    alert('Add a Toggle column Make_Fresh to Work_Order_Lines to use this.');
    return;
  }
  const { acts, total } = S.allocCols ? releaseActions(line) : { acts: [], total: 0 };
  const name = line.recipeName || line.sku;
  if (!confirm(
    `Dye ${name} fresh for this order?\n\n` +
    (total
      ? `The ${total} spool(s) reserved for it go back to stock — they stay perfectly ` +
        `sellable, just not to this customer.\n\n`
      : '') +
    `This line will stop offering stock and shows as needing production. ` +
    `You can put it back with "allow stock".`)) return;

  S.stockBusy = true; render();
  try {
    acts.push(['UpdateRecord', 'Work_Order_Lines', lineId, { [S.lineCols.makeFresh]: true }]);
    await grist.docApi.applyUserActions(acts);
    await loadAll();
    toast(total ? `Released ${total} — ${name} will be dyed fresh` : `${name} will be dyed fresh`);
  } catch (e) {
    console.error('Could not switch to fresh:', e);
    alert('Could not change that line. Nothing was changed.');
  } finally {
    S.stockBusy = false; render();
  }
}

async function allowStock(lineId) {
  if (S.stockBusy || !S.lineCols.makeFresh) return;
  S.stockBusy = true; render();
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Work_Order_Lines', lineId, { [S.lineCols.makeFresh]: false }]]);
    await loadAll();
    toast('Stock offered again');
  } catch (e) {
    console.error('Could not allow stock:', e);
    alert('Could not change that line.');
  } finally {
    S.stockBusy = false; render();
  }
}

/* Records that the human has been to Shopify and changed the number. It does
   NOT touch the allocation, the lot, or Shopify — the spools stay reserved and
   the storefront is whatever the person made it. All that changes is that the
   reminder stops. */
async function markAdjusted(allocId) {
  if (S.stockBusy) return;
  const A = S.allocCols;
  if (!A || !A.adjusted) {
    alert('Add a Toggle column Storefront_Adjusted to Lot_Allocations to tick these off.');
    return;
  }
  const item = S.todoQueue.find(x => x.allocId === allocId);
  if (item && !confirm(
    `Mark ${item.qty} × ${item.name} as already adjusted on ${SOURCE_META[item.source].store}?\n\n` +
    `This only stops the reminder. Nothing here reaches Shopify — tick it once you have ` +
    `changed the quantity there yourself.`)) return;
  S.stockBusy = true; render();
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Lot_Allocations', allocId, { [A.adjusted]: true }]]);
    await loadAll();
    toast('Reminder cleared');
  } catch (e) {
    console.error('Could not mark it adjusted:', e);
    alert('Could not update that row.');
  } finally {
    S.stockBusy = false; render();
  }
}


async function removeLine(lineId, label) {
  const line = lineById(lineId);
  /* A line with dyed spools against it has real production behind it.
     Removing it would orphan whatever was made, so say so plainly rather
     than letting a click throw work away.

     Unless what is against it is a reservation THIS screen made, in which
     case refusing would be a dead end of our own making: the line cannot be
     removed and the only thing standing in the way is undoable right here.
     So offer the undo instead of the refusal. */
  let asked = false;
  const st = line ? lineStock(line) : null;
  /* Gated on the reservation as well as Qty_Dyed. Qty_Dyed is usually a
     formula over the allocations, but if it is ever maintained some other way
     a reservation would slip past this check entirely — the line would go and
     its allocation rows would stay, holding spools off the shelf and pointing
     at a line that no longer exists. */
  if (line && (line.dyed > 0 || st.reserved > 0)) {
    if (st.reserved > 0 && st.produced === 0) {
      if (!confirm(`${label} has ${st.reserved} spool(s) reserved from back stock.\n\n` +
        `Release them to the shelf and remove the line?`)) return;
      const ok = await releaseReservation(lineId, true);
      if (!ok) return;
      asked = true;   // that prompt covered the removal too
    } else {
      alert(`${label} already has ${line.dyed} spool(s) recorded as dyed` +
        (st.reserved ? `, ${st.reserved} of which is reserved back stock` : '') + `.\n\n` +
        `Removing the line would leave those unaccounted for. Set the quantity to 0 instead, ` +
        `or sort out the allocation first.`);
      return;
    }
  }
  if (!asked && !confirm(`Remove ${label} from this order?`)) return;
  try {
    await grist.docApi.applyUserActions([['RemoveRecord', 'Work_Order_Lines', lineId]]);
    await loadAll();
    toast('Removed ' + label);
  } catch (e) {
    console.error('Could not remove the line:', e);
    alert('Could not remove that line.');
  }
}

async function markReady(id) {
  const o = S.orders.find(x => x.id === id);
  const lines = S.lines[id] || [];
  if (!o) return;
  if (!lines.length) { alert('This order has no lines yet.'); return; }
  if (!o.customerName) { alert('Set a customer first.'); return; }
  const spools = lines.reduce((n, l) => n + l.qty, 0);
  if (!confirm(`Release ${o.number} for production?\n\n` +
      `${spools} spool(s) across ${lines.length} line(s) for ${o.customerName}.\n\n` +
      `Status becomes "${READY_STATUS}", which puts it on Thread Board and the work lists. ` +
      `It still does not exist in Shopify and no one is emailed.`)) return;
  await setOrderField(id, S.cols.status, READY_STATUS);
  await loadAll();
  toast(o.number + ' released');
}

async function backToBuilding(id) {
  await setOrderField(id, S.cols.status, BUILDING_STATUS);
  await loadAll();
  toast('Back to building');
}

async function deleteOrder(id) {
  const o = S.orders.find(x => x.id === id);
  if (!o) return;
  const lines = S.lines[id] || [];
  /* Shopify first. An order that exists in Shopify may ALSO have dyed spools
     against it, and if the dyed check ran first you would be told to sort out
     an allocation when the real answer is that this row is no longer yours to
     delete — the order lives somewhere else now. Most actionable reason wins. */
  if (o.shopifyId) {
    alert('This order has already been pushed to Shopify. Cancel it there rather than deleting it here.');
    return;
  }
  /* Same reasoning as removeLine: a reservation this screen made is not a
     reason to refuse, it is a thing to hand back on the way out. Real
     production still stops the delete. */
  const withStock = lines.map(l => ({ l, st: lineStock(l) }));
  if (withStock.some(x => x.st.produced > 0)) {
    const made = withStock.filter(x => x.st.produced > 0)
      .map(x => `${x.l.recipeName || x.l.sku}: ${x.st.produced}`).join(', ');
    alert(`Some lines already have wound spools against them (${made}).\n\n` +
      `Sort those out before deleting the order.`);
    return;
  }
  const reserved = withStock.reduce((n, x) => n + x.st.reserved, 0);
  if (!confirm(`Delete ${o.number} and its ${lines.length} line(s)?\n\n` +
    (reserved ? `${reserved} spool(s) reserved from back stock will be released to the shelf first.\n\n` : '') +
    `This cannot be undone.`)) return;
  try {
    const acts = [];
    /* Release before removing the lines. A Work_Order_Line removed while
       allocations still point at it would orphan them, and orphaned rows are
       exactly the unaccounted spools the arithmetic in stock-model.md is
       meant to surface. */
    withStock.filter(x => x.st.reserved > 0)
      .forEach(x => acts.push(...releaseActions(x.l).acts));
    lines.forEach(l => acts.push(['RemoveRecord', 'Work_Order_Lines', l.id]));
    acts.push(['RemoveRecord', 'Work_Orders', id]);
    await grist.docApi.applyUserActions(acts);
    S.selected = null;
    await loadAll();
    toast('Deleted ' + o.number);
  } catch (e) {
    console.error('Could not delete:', e);
    alert('Could not delete that order.');
  }
}

/* ── Push to Shopify ────────────────────────────────────────────────────── */

async function callPush(workOrderId, dryRun) {
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), PUSH_TIMEOUT_MS) : null;
  try {
    const res = await fetch(PUSH_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ workOrderId, dryRun: !!dryRun }),
      cache: 'no-store',
      ...(ctrl ? { signal: ctrl.signal } : {}),
    });
    if (!res.ok) throw new Error(`the workflow answered ${res.status} ${res.statusText}`);
    return await res.json();
  } finally {
    if (timer) clearTimeout(timer);
  }
}

async function previewPush(id) {
  if (S.pushBusy) return;
  S.pushBusy = true; S.push = null; render();
  try {
    S.push = await callPush(id, true);
  } catch (e) {
    console.error('Preview failed:', e);
    S.push = { ok: false, created: false, transport: true,
      reasons: [(e && e.name === 'AbortError')
        ? `The workflow didn't answer within ${Math.round(PUSH_TIMEOUT_MS / 1000)} seconds. ` +
          `Nothing was sent — a preview never sends.`
        : (e && e.message) || String(e)] };
  } finally {
    S.pushBusy = false; render();
  }
}

async function doPush(id) {
  if (S.pushBusy) return;
  const o = S.orders.find(x => x.id === id);
  const p = S.push;
  if (!o || !p || !p.summary) return;
  if (!confirm(`Create a real Shopify order for ${o.number}?\n\n` +
      `${p.summary.spools} spool(s), ${p.summary.lines} line(s), $${p.summary.value} ` +
      `to ${p.summary.customer}.\n${p.summary.address}\n\n` +
      `No email is sent and Shopify inventory is not touched. ` +
      `Once it exists it can't be deleted from here — you'd cancel it in Shopify.`)) return;

  S.pushBusy = true; render();
  try {
    S.push = await callPush(id, false);
    await loadAll();
    if (S.push && S.push.created) toast('Pushed as ' + (S.push.shopify_name || S.push.shopify_order_id));
  } catch (e) {
    console.error('Push failed:', e);
    /* A transport failure is the one case where the order may or may not exist
       in Shopify — the request could have landed and the answer been lost. Say
       that plainly rather than implying nothing happened. */
    S.push = { ok: false, created: false, transport: true, uncertain: true,
      reasons: [((e && e.name === 'AbortError')
        ? `The workflow didn't answer within ${Math.round(PUSH_TIMEOUT_MS / 1000)} seconds.`
        : (e && e.message) || String(e)) +
        ` The order MAY still have been created — check the vendor store in Shopify before ` +
        `pressing this again. If it exists, put its id into Shopify_Order_ID on this row by hand.`] };
  } finally {
    S.pushBusy = false; render();
  }
}
