<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dye Prep Sheet</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --ink: #1A1614;
    --paper: #F7F3EE;
    --warm: #E8DFD4;
    --rule: #D4C9BC;
    --muted: #8B7D72;
    --accent: #8B3A2A;
    --teal-light: #E5F2EF;
    --gold: #B07D2A;
    --gold-light: #F5EDD8;
    --urgent: #A01830;
    --urgent-light: #F5E0E4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.45;
    padding: 16px;
  }

  /* ── Controls (screen only) ─────────────────────────────────── */
  .controls {
    display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 16px; border-bottom: 2px solid var(--rule);
  }
  .ctl { display: flex; flex-direction: column; gap: 3px; }
  .ctl label { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .ctl select, .ctl input {
    font-family: 'Inter', sans-serif; font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--rule); border-radius: 5px; background: white; color: var(--ink);
  }
  .ctl input[type="number"] { width: 68px; }
  .btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor: pointer;
  }
  .btn.secondary { background: white; color: var(--ink); border-color: var(--rule); }
  .btn:hover { opacity: .88; }
  .ctl-spacer { flex: 1; }

  /* ── Sheet ──────────────────────────────────────────────────── */
  .sheet-head { margin-bottom: 14px; }
  .sheet-title { font-family: 'Libre Baskerville', serif; font-size: 22px; font-weight: 700; }
  .sheet-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .how { font-size: 11px; color: var(--ink); background: var(--warm); border-radius: 5px; padding: 7px 10px; margin-top: 8px; }

  /* ── A tray: one batch, everything for it ───────────────────── */
  .tray {
    break-inside: avoid; page-break-inside: avoid;
    border: 1.5px solid var(--ink); border-radius: 8px; background: white;
    margin-bottom: 12px; overflow: hidden;
  }
  .tray-head {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 11px; background: var(--warm); border-bottom: 1.5px solid var(--ink);
  }
  .seq {
    flex: none; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 17px;
    min-width: 38px; height: 32px; line-height: 30px; text-align: center; padding: 0 6px;
    border: 1.6px solid var(--ink); border-radius: 5px; background: var(--paper);
  }
  .tray-name { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
  .tray-name .sku { display: block; font-family: 'DM Mono', monospace; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .tray-count { flex: none; font-size: 10px; color: var(--muted); text-align: right; }
  .swatch-strip { display: flex; gap: 3px; flex: none; }
  .swatch-strip .dot { width: 19px; height: 19px; }

  /* ── Item table: made dye and powder side by side ───────────── */
  table.items { width: 100%; border-collapse: collapse; }
  table.items th {
    font-size: 10px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700;
    color: var(--muted); text-align: left; padding: 7px 10px 4px; border-bottom: 1px solid var(--rule);
  }
  table.items th .ico { vertical-align: -3px; margin-right: 4px; }
  table.items td { padding: 9px 10px; border-bottom: 1px solid var(--warm); vertical-align: middle; }
  table.items tr:last-child td { border-bottom: none; }
  td.c-box { width: 34px; padding-right: 0; }
  td.c-dye { width: 38%; }
  td.c-jar, td.c-powder { width: 20%; }
  td.c-flag { width: 160px; text-align: right; }

  .dye-name { font-weight: 600; font-size: 16px; line-height: 1.25; }
  .dye-name .brand { display: inline; font-weight: 400; color: var(--muted); font-size: 13px; }
  .sub { display: block; font-size: 12px; color: var(--muted); }
  .sub.again { color: var(--accent); font-style: italic; }
  .sub.flag { color: var(--urgent); font-weight: 600; }
  .where { font-size: 15px; font-weight: 600; }
  .where.none { color: var(--rule); font-weight: 400; font-size: 16px; }
  .mono { font-family: 'DM Mono', monospace; font-size: 13.5px; font-weight: 500; }

  /* Liquid vs powder, told apart at a glance without reading a word. */
  /* 20px, not 18 — the powder pile needs the extra two pixels to keep its
     grains from merging into the outline. */
  .ico { display: inline-block; width: 20px; height: 20px; vertical-align: -5px; flex: none; }
  .bring { display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end;
    font-size: 13px; font-weight: 700; white-space: nowrap; }
  .bring.made { color: #1F5A4C; }
  .bring.both { color: #7A5410; }
  .bring.dry  { color: #4B3A73; }

  .box {
    display: block; width: 21px; height: 21px; border: 2px solid var(--ink);
    border-radius: 4px; cursor: pointer; background: white; margin-top: 1px;
  }
  .box:hover { background: var(--warm); }
  .box.checked { background: #2D6A2D; border-color: #2D6A2D; position: relative; }
  .box.checked::after {
    content: '✓'; color: white; font-size: 16px; font-weight: 700; line-height: 18px;
    position: absolute; inset: 0; text-align: center;
  }
  tr.ticked td { background: #F3F8EE; }
  tr.ticked .dye-name, tr.ticked .where, tr.ticked .sub { opacity: .5; }
  tr.ticked .dye-name { text-decoration: line-through; }

  /* Tray-level reassurance: a running count, and the whole tray turns green
     the moment every line in it has been ticked. */
  .tray-check {
    flex: none; display: flex; align-items: center; gap: 7px; cursor: pointer;
    border: 2px solid var(--ink); border-radius: 6px; padding: 3px 9px; background: var(--paper);
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .tray-check:hover { background: white; }
  .tray-check .mark { font-size: 15px; line-height: 1; }
  .tray.done { border-color: #2D6A2D; }
  .tray.done .tray-head { background: #E4F1DA; border-bottom-color: #2D6A2D; }
  .tray.done .tray-check { background: #2D6A2D; color: white; border-color: #2D6A2D; }

  .dot {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.28); vertical-align: -2px; margin-right: 5px;
  }
  .dot.unknown { background: repeating-linear-gradient(45deg,#fff,#fff 3px,#DDD4C8 3px,#DDD4C8 6px); }

  .tag {
    display: inline-block; font-size: 8.5px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 2px 5px; border-radius: 3px; white-space: nowrap;
    border: 1px solid;
  }
  .tag.ready  { background: var(--teal-light); color: #1F5A4C; border-color: #8FC4B7; }
  .tag.mix    { background: var(--gold-light); color: #7A5410; border-color: #D9BC7C; }
  .tag.dry    { background: #EDE7F5; color: #4B3A73; border-color: #BFB0DC; }
  .tag.slot   { background: white; color: var(--ink); border-color: var(--ink); font-family: 'DM Mono', monospace; }

  .progress { margin-top: 9px; }
  .progress-bar {
    height: 7px; background: var(--warm); border-radius: 4px; overflow: hidden;
    border: 1px solid var(--rule);
  }
  .progress-bar span { display: block; height: 100%; background: #2D6A2D; transition: width .18s ease; }
  .progress-text { font-size: 10.5px; color: var(--muted); margin-top: 3px; }
  .linkbtn {
    font-family: 'Inter', sans-serif; font-size: 10.5px; color: var(--accent);
    background: none; border: none; text-decoration: underline; cursor: pointer; padding: 0 0 0 6px;
  }

  .legend { font-size: 12.5px; color: var(--muted); display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .legend .ico { margin-right: 2px; }
  .legend strong { color: var(--ink); }
  /* ── Put-away strip: pen-and-paper, filled in by me while I work ── */
  .chk { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
  tr.pa td { padding: 0 10px 9px 44px; border-bottom: 1px solid var(--warm); }
  tr.pa.last td { border-bottom: none; }
  .pa-strip {
    display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
    background: #FBF8F4; border: 1px dashed var(--rule); border-radius: 6px; padding: 7px 11px;
  }
  .pa-grp { display: flex; gap: 9px; align-items: baseline; flex-wrap: wrap; }
  .pa-lbl {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 700; white-space: nowrap;
  }
  .pa-opt { white-space: nowrap; font-size: 13px; font-weight: 600; }
  .pabox {
    display: inline-block; width: 14px; height: 14px; border: 1.6px solid var(--ink);
    border-radius: 3px; vertical-align: -2px; margin-right: 5px; background: white;
  }
  .rule { display: inline-block; border-bottom: 1.3px solid var(--rule); height: 16px; min-width: 90px; flex: 1; }
  .tray-foot {
    display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: baseline;
    padding: 9px 11px; border-top: 1.5px solid var(--ink); background: #FBF8F4;
  }
  .ff { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 240px; }
  .ff .rule { min-width: 130px; }

  .empty-state { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }
  .warn-banner {
    background: var(--urgent-light); border: 1px solid #E0A5AF; color: var(--urgent);
    padding: 8px 11px; border-radius: 6px; font-size: 11.5px; margin-bottom: 14px;
  }

  /* ── Print ──────────────────────────────────────────────────── */
  @media print {
    @page { margin: 11mm; }
    body { background: white; padding: 0; font-size: 12.5px; }
    .no-print { display: none !important; }
    .tray-head, .dot, .tag, .pa-strip, .tray-foot { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pa-strip, .tray-foot { background: white; }
    .box { width: 18px; height: 18px; }
    .box.checked { background: white; border-color: var(--ink); }
    .box.checked::after { color: var(--ink); }
    tr.ticked td { background: white; }
    tr.ticked .dye-name, tr.ticked .where, tr.ticked .sub { opacity: 1; }
    tr.ticked .dye-name { text-decoration: none; }
    .tray.done .tray-head { background: var(--warm); }
    .tray.done .tray-check { background: var(--paper); color: var(--ink); }
    .progress-bar { display: none; }
  }
</style>
</head>
<body>

<div class="controls no-print">
  <div class="ctl">
    <label for="dateSel">Plan day</label>
    <select id="dateSel" onchange="render()"></select>
  </div>
  <div class="ctl">
    <label for="viewSel">Lay out</label>
    <select id="viewSel" onchange="render()">
      <option value="batch">One tray per batch</option>
      <option value="day">Everything for the day, one list</option>
    </select>
  </div>
  <label class="chk"><input type="checkbox" id="paToggle" onchange="render()" checked> put-away section</label>
  <div class="ctl">
    <label for="lowInput">Jar is low under (mL)</label>
    <input type="number" id="lowInput" value="10" min="0" step="5" onchange="render()">
  </div>
  <div class="ctl-spacer"></div>
  <button class="btn secondary" onclick="loadEverything()">↻ Refresh</button>
  <button class="btn" onclick="window.print()">🖨 Print</button>
</div>

<div id="content"><div class="empty-state">Loading…</div></div>

<script>
// ── Shared helpers (keep in sync with the rest of the widget suite) ──
function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
// Matches a column id ignoring case and non-alphanumerics, trying each candidate.
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${tableName}.${cands[0]}`);
  }
  return out;
}
function todayEpochSeconds() {
  const n = new Date();
  return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000;
}
function dateLabel(epoch) {
  const d = new Date(Number(epoch) * 1000);
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });
}
function hexOf(s) {
  const v = (s || '').toString().trim();
  return /^#?[0-9a-fA-F]{6}$/.test(v) ? (v[0] === '#' ? v : '#' + v) : null;
}

// ── State ────────────────────────────────────────────────────────
let planByDate = {};
let recipeById = {};
let dyeById = {};
let dyeNameCounts = {};
let compsByRecipe = {};
let stockByDyeId = {};
let loadError = null;

// A name shared by two brands is never shown bare — brand is the only thing
// that tells the two tubs apart on the shelf. Twenty-six names in the catalog
// are shared (Turquoise is CC, J and PF), so this is normal, not an edge case.
function dyeLabel(info) {
  if (!info) return '';
  return (dyeNameCounts[normalize(info.name)] > 1 && info.brand)
    ? `${info.name} (${info.brand})` : info.name;
}
// Where the powder tub lives. Powder_Location doesn't exist in Dyes today, so
// brand + serial is the address — that's what's printed on the tub. If a
// Powder_Location column is ever added it's picked up and shown instead.
function powderAddress(info) {
  if (!info) return '';
  if (info.powderLoc) return info.powderLoc;
  return [info.brand, info.serial].filter(Boolean).join(' · ');
}

async function loadEverything() {
  loadError = null;
  document.getElementById('content').innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const [planTable, recipesTable, compTable, dyesTable, stockTable] = await Promise.all([
      grist.docApi.fetchTable('Day_Plan'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Recipe_Dye_Components'),
      grist.docApi.fetchTable('Dyes'),
      grist.docApi.fetchTable('Dye_Stock'),
    ]);

    const missing = [];
    const opt = cands => ({ cands, required: false });
    const PLAN = resolveCols(planTable, 'Day_Plan', {
      planDate: ['Plan_Date'], recipe: ['Recipe'],
      sequence: ['Sequence'], prepSlot: opt(['Prep_Slot']),
    }, missing);
    const REC = resolveCols(recipesTable, 'Recipes', {
      name: ['Recipe_Name'], sku: opt(['SKU_Base']), fiber: opt(['Fiber_Type']),
    }, missing);
    const COMP = resolveCols(compTable, 'Recipe_Dye_Components', {
      recipe: ['Recipe'], dye: ['Dye_Name'],
      isPowder: opt(['Is_Powder']), measureMode: opt(['Measure_Mode']),
      step: opt(['Step_Number']), dilution: opt(['Dilution']),
      notes: opt(['Application_Notes']),
    }, missing);
    const DYE = resolveCols(dyesTable, 'Dyes', {
      name: ['Dye_Name'], brand: opt(['Brand']), serial: opt(['Serial']),
      swatch: opt(['Swatch_Hex']), powderLoc: opt(['Powder_Location']),
    }, missing);
    const STOCK = resolveCols(stockTable, 'Dye_Stock', {
      dye: ['Dye'], quantity: ['Quantity_mL'], bin: opt(['Bin_Location']),
    }, missing);

    if (missing.length) {
      loadError = 'Missing columns: ' + [...new Set(missing)].join(', ') +
                  ' — a table or column was likely renamed.';
      render();
      return;
    }

    // ── Dye catalog, keyed by ROW ID ──────────────────────────────
    // Never key a dye by its name. Bin, powder tub and swatch all differ
    // between two dyes that share a name, and pulling the wrong one puts
    // the wrong colour in the kettle.
    dyeById = {}; dyeNameCounts = {};
    (dyesTable.id || []).forEach((id, i) => {
      const name = (columnAsArray(dyesTable, DYE.name)[i] || '').toString();
      dyeById[id] = {
        id, name,
        brand: (columnAsArray(dyesTable, DYE.brand)[i] || '').toString().trim(),
        serial: (columnAsArray(dyesTable, DYE.serial)[i] || '').toString().trim(),
        swatch: hexOf(columnAsArray(dyesTable, DYE.swatch)[i]),
        powderLoc: (columnAsArray(dyesTable, DYE.powderLoc)[i] || '').toString().trim(),
      };
      const k = normalize(name);
      if (k) dyeNameCounts[k] = (dyeNameCounts[k] || 0) + 1;
    });
    // Free text only resolves when a name belongs to exactly one dye — an
    // ambiguous name resolves to nothing rather than to a coin flip.
    const dyeIdByUniqueName = {};
    Object.values(dyeById).forEach(d => {
      const k = normalize(d.name);
      if (k && dyeNameCounts[k] === 1) dyeIdByUniqueName[k] = d.id;
    });

    recipeById = {};
    (recipesTable.id || []).forEach((id, i) => {
      recipeById[id] = {
        id,
        name: (columnAsArray(recipesTable, REC.name)[i] || '').toString(),
        sku: (columnAsArray(recipesTable, REC.sku)[i] || '').toString(),
        fiber: (columnAsArray(recipesTable, REC.fiber)[i] || '').toString(),
      };
    });

    compsByRecipe = {};
    (compTable.id || []).forEach((id, i) => {
      const recipeRef = getRefId(columnAsArray(compTable, COMP.recipe)[i]);
      if (!recipeRef) return;
      const rawDye = columnAsArray(compTable, COMP.dye)[i];
      let dyeRefId = getRefId(rawDye);
      if (!dyeRefId && typeof rawDye === 'string') {
        dyeRefId = dyeIdByUniqueName[normalize(rawDye)] || null;
      }
      const info = dyeRefId ? dyeById[dyeRefId] : null;
      const name = info ? info.name : (typeof rawDye === 'string' ? rawDye : '');
      if (!name) return;

      const measure = (columnAsArray(compTable, COMP.measureMode)[i] || '').toString();
      const isPowder = !!columnAsArray(compTable, COMP.isPowder)[i] || /powder/i.test(measure);
      const key = dyeRefId ? 'id:' + dyeRefId : 'nm:' + normalize(name);
      const step = Number(columnAsArray(compTable, COMP.step)[i]) || 0;

      if (!compsByRecipe[recipeRef]) compsByRecipe[recipeRef] = [];
      // One dye can appear at two steps of a recipe; that's still one jar and
      // one tub to fetch, so collapse it and keep the earliest step for order.
      const existing = compsByRecipe[recipeRef].find(c => c.key === key);
      if (existing) {
        if (step && (!existing.step || step < existing.step)) existing.step = step;
        existing.isPowder = existing.isPowder || isPowder;
        return;
      }
      compsByRecipe[recipeRef].push({
        key, dyeId: dyeRefId, name,
        label: info ? dyeLabel(info) : name,
        swatch: info ? info.swatch : null,
        powder: powderAddress(info),
        isPowder, step,
        notes: (columnAsArray(compTable, COMP.notes)[i] || '').toString().trim(),
        unresolved: !dyeRefId,
      });
    });
    Object.values(compsByRecipe).forEach(l => l.sort((a, b) => (a.step || 99) - (b.step || 99)));

    // ── Premade stock, keyed by dye ROW ID ────────────────────────
    stockByDyeId = {};
    (stockTable.id || []).forEach((id, i) => {
      const dyeRef = getRefId(columnAsArray(stockTable, STOCK.dye)[i]);
      if (!dyeRef || !dyeById[dyeRef]) return;
      if (!stockByDyeId[dyeRef]) stockByDyeId[dyeRef] = [];
      stockByDyeId[dyeRef].push({
        qty: Number(columnAsArray(stockTable, STOCK.quantity)[i]) || 0,
        bin: (columnAsArray(stockTable, STOCK.bin)[i] || '').toString().trim(),
      });
    });

    // ── Day plans, collapsed to one entry per sequence step ───────
    // Day_Plan holds one row per order line; several lines share a Sequence
    // when two customers ordered the same colorway. That's one trip to the
    // kettle, so it's one tray.
    planByDate = {};
    const seen = {};
    (planTable.id || []).forEach((id, i) => {
      const d = Number(columnAsArray(planTable, PLAN.planDate)[i]);
      const recipeId = getRefId(columnAsArray(planTable, PLAN.recipe)[i]);
      const seq = Number(columnAsArray(planTable, PLAN.sequence)[i]) || 0;
      if (!d || !recipeId) return;
      const k = `${d}|${seq}|${recipeId}`;
      if (seen[k]) return;
      seen[k] = true;
      if (!planByDate[d]) planByDate[d] = [];
      planByDate[d].push({
        seq, recipeId,
        prepSlot: (columnAsArray(planTable, PLAN.prepSlot)[i] || '').toString().trim(),
      });
    });
    Object.values(planByDate).forEach(l => l.sort((a, b) => a.seq - b.seq));

    buildDateOptions();
    render();
  } catch (e) {
    console.error('Failed to load dye prep sheet:', e);
    loadError = 'Failed to load — ' + ((e && e.message) ? e.message : String(e));
    render();
  }
}

function buildDateOptions() {
  const sel = document.getElementById('dateSel');
  const prev = sel.value;
  const dates = Object.keys(planByDate).map(Number).sort((a, b) => b - a);
  const today = todayEpochSeconds();
  sel.innerHTML = dates.map(d =>
    `<option value="${d}">${esc(dateLabel(d))}${d === today ? ' — today' : ''}</option>`
  ).join('') || '<option value="">No saved plans</option>';
  if (prev && dates.indexOf(Number(prev)) >= 0) sel.value = prev;
  else if (dates.indexOf(today) >= 0) sel.value = String(today);
}

// ── What to physically pick up ───────────────────────────────────
// Two forms only, because that's the whole decision at the shelf: a jar of
// made dye, a tub of powder, or both. Why a jar needs topping up is my
// problem at the kettle, not something he has to read on this sheet.
// Two shapes, no reading required: the square container the made dye lives in
// (straight sides, snap lid, liquid with a wavy surface) and an open pile of
// powder with grains in it. Solid-with-light-detail against outline-with-dots,
// so they stay apart at 20px and in black-and-white on the printed sheet.
//
// The liquid wave spans 3.15 → 12.85, the full inner width between the walls.
// Four segments of 2.425, not 2.13 — at 2.13 it stops short of the right wall
// and leaves a notch that looks like a rendering fault.
const ICO_JAR = `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
  <rect x="1.2" y="2.5" width="13.6" height="2.3" rx=".7" fill="currentColor"/>
  <rect x="2.5" y="4.8" width="11" height="9.4" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <path d="M3.15 8.3c1.2125 0 1.2125.85 2.425.85s1.2125-.85 2.425-.85 1.2125.85 2.425.85 1.2125-.85 2.425-.85v4.85a1.05 1.05 0 0 1-1.05 1.05H4.2a1.05 1.05 0 0 1-1.05-1.05z" fill="currentColor" opacity=".8"/>
</svg>`;
const ICO_TUB = `<svg class="ico" viewBox="0 0 16 16" aria-hidden="true">
  <path d="M.9 13.9c1.95 0 2.95-1.65 3.95-3.25C5.85 9.05 6.8 7.75 8 7.75s2.15 1.3 3.15 2.9c1 1.6 2 3.25 3.95 3.25z"
        fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
  <g fill="currentColor">
    <circle cx="6.1" cy="12.2" r=".78"/><circle cx="9.9" cy="12.4" r=".7"/>
    <circle cx="8" cy="10.6" r=".68"/>
    <circle cx="3.8" cy="13" r=".55"/><circle cx="12.2" cy="13" r=".55"/>
  </g>
</svg>`;

function itemFor(comp, lowMl) {
  const rows = comp.dyeId ? (stockByDyeId[comp.dyeId] || []) : [];
  const total = rows.reduce((s, r) => s + r.qty, 0);
  // One dye lives in one bin. More than one is a data error, not a location.
  const bins = [...new Set(rows.map(r => r.bin).filter(Boolean))].sort((a, b) => {
    const na = Number(a), nb = Number(b);
    return (!isNaN(na) && !isNaN(nb)) ? na - nb : a.localeCompare(b);
  });

  // Dry-powder recipes and dyes with nothing premade both come to the same
  // instruction: bring the tub. No reason to make him tell them apart.
  if (comp.isPowder || total <= 0) {
    return { jar: null, powder: comp.powder, bins: [], total,
             form: 'dry', label: 'Powder', icons: ICO_TUB };
  }
  if (total < lowMl) {
    return { jar: { bins, total }, powder: comp.powder, bins, total,
             form: 'both', label: 'Made dye + powder', icons: ICO_JAR + ICO_TUB };
  }
  return { jar: { bins, total }, powder: null, bins, total,
           form: 'made', label: 'Made dye', icons: ICO_JAR };
}

// ── Ticks ────────────────────────────────────────────────────────
// Purely the assistant's own checklist — nothing is written to Grist. It's
// remembered across a refresh so an accidental reload doesn't wipe half an
// hour of pulling, and it's keyed by plan date so yesterday's ticks don't
// carry over onto today's sheet.
const TICK_STORE = 'ss-prep-ticks';
let ticks = new Set();

function loadTicks() {
  try {
    const raw = window.localStorage.getItem(TICK_STORE);
    ticks = new Set(raw ? JSON.parse(raw) : []);
  } catch (e) {
    // Storage blocked in this frame — ticks still work, just for this session.
    ticks = new Set();
    return;
  }
  // Every id starts with its plan date, so anything older than a fortnight is
  // a finished day nobody will look at again. Drop it rather than let the
  // store grow without bound.
  const cutoff = todayEpochSeconds() - 14 * 86400;
  let pruned = false;
  [...ticks].forEach(id => {
    const d = Number(String(id).split('|')[0]);
    if (!isNaN(d) && d < cutoff) { ticks.delete(id); pruned = true; }
  });
  if (pruned) saveTicks();
}
function saveTicks() {
  try { window.localStorage.setItem(TICK_STORE, JSON.stringify([...ticks])); } catch (e) {}
}
function tickId(dateVal, scope, key) { return `${dateVal}|${scope}|${key}`; }

function toggleTick(id, el) {
  if (ticks.has(id)) ticks.delete(id); else ticks.add(id);
  saveTicks();
  el.classList.toggle('checked', ticks.has(id));
  const row = el.closest('tr');
  if (row) row.classList.toggle('ticked', ticks.has(id));
  refreshTrayState(el.closest('.tray'));
  refreshProgress();
}

// Tick or clear a whole tray in one go — if anything is outstanding, fill it
// in; only a fully ticked tray clears back to empty.
function toggleTray(trayEl) {
  const boxes = [...trayEl.querySelectorAll('.box[data-tick]')];
  if (!boxes.length) return;
  const target = boxes.some(b => !ticks.has(b.dataset.tick));
  boxes.forEach(b => {
    const id = b.dataset.tick;
    if (target) ticks.add(id); else ticks.delete(id);
    b.classList.toggle('checked', target);
    const row = b.closest('tr');
    if (row) row.classList.toggle('ticked', target);
  });
  saveTicks();
  refreshTrayState(trayEl);
  refreshProgress();
}

function refreshTrayState(trayEl) {
  if (!trayEl) return;
  const boxes = [...trayEl.querySelectorAll('.box[data-tick]')];
  const done = boxes.filter(b => ticks.has(b.dataset.tick)).length;
  const all = boxes.length && done === boxes.length;
  trayEl.classList.toggle('done', all);
  const badge = trayEl.querySelector('.tray-check');
  if (badge) {
    badge.innerHTML = `<span class="mark">${all ? '✓' : '☐'}</span><span>${done} of ${boxes.length}</span>`;
  }
}
function refreshAllTrays() {
  document.querySelectorAll('.tray').forEach(refreshTrayState);
}
function clearTicks() {
  ticks = new Set();
  saveTicks();
  render();
}

function dot(hex) {
  return hex ? `<span class="dot" style="background:${esc(hex)}"></span>`
             : `<span class="dot unknown" title="no swatch recorded"></span>`;
}
function nameHtml(comp) {
  const info = comp.dyeId ? dyeById[comp.dyeId] : null;
  const bare = info ? info.name : comp.name;
  const ambiguous = info && dyeNameCounts[normalize(info.name)] > 1;
  return `${esc(bare)}${ambiguous && info.brand ? ` <span class="brand">(${esc(info.brand)})</span>` : ''}`;
}
function jarCell(it) {
  if (!it.jar) return `<span class="where none">—</span>`;
  const bins = it.jar.bins;
  if (!bins.length) return `<span class="where">bin not recorded</span>`;
  // One dye lives in one bin — the old jar is dumped or used up before a new
  // one is made. Two bins is always a data error, so say so rather than send
  // him hunting through three bins for a jar that should be in one.
  if (bins.length > 1) {
    return `<span class="where">bin ${esc(bins[0])}
      <span class="sub flag">⚠ also in bin ${esc(bins.slice(1).join(', '))} — check the audit</span></span>`;
  }
  return `<span class="where">bin ${esc(bins[0])}</span>`;
}
function powderCell(it) {
  if (!it.powder) return `<span class="where none">—</span>`;
  return `<span class="where mono">${esc(it.powder)}</span>`;
}
// Prep_Slot is a human-readable line the planner writes, e.g.
// "P1 Turquoise · P2 Buttercup". Nice-to-have, so a format change just means
// no slot tags — never a broken sheet.
function parseSlots(prepSlot) {
  const out = {};
  if (!prepSlot || prepSlot === '—') return out;
  prepSlot.split('·').forEach(part => {
    const m = part.trim().match(/^(P\d+)\s+(.+)$/);
    if (m) out[normalize(m[2])] = m[1];
  });
  return out;
}

const ITEM_HEAD = () => `<tr>
  <th></th><th>Dye</th>
  <th>${ICO_JAR}Made dye</th>
  <th>${ICO_TUB}Powder tub</th>
  <th style="text-align:right">Bring</th>
</tr>`;

// ── Put-away strip ───────────────────────────────────────────────
// Printed empty. I tick it at the kettle, hand the paper back, and he clears
// the table from it while I carry on. The options differ by what's actually
// on the line: a container can go back, be dumped, or stay out for the next
// batch — a powder tub only ever goes back on the shelf.
const box = label => `<span class="pa-opt"><span class="pabox"></span>${label}</span>`;

function putAwayRow(comp, it, isLast) {
  const parts = [];

  if (it.jar) {
    const bin = it.jar.bins.length ? 'Bin ' + esc(it.jar.bins[0]) : 'Bin ___';
    parts.push(`<span class="pa-grp"><span class="pa-lbl">Made dye</span>
      ${box(bin)}${box('Dumped')}${box('Kept out')}</span>`);
    // Whether the solution is fresh decides its shelf life from today, so it
    // has to be recorded at the kettle — nobody can reconstruct it later.
    parts.push(`<span class="pa-grp"><span class="pa-lbl">Solution</span>
      ${box('Made new')}${box('Same as before')}</span>`);
  }
  if (it.powder) {
    parts.push(`<span class="pa-grp"><span class="pa-lbl">Powder</span>
      ${box('Back to ' + esc(it.powder))}</span>`);
  }
  parts.push(`<span class="pa-grp" style="flex:1;min-width:150px">
    <span class="pa-lbl">Note</span><span class="rule"></span></span>`);

  return `<tr class="pa${isLast ? ' last' : ''}"><td colspan="5">
    <div class="pa-strip">${parts.join('')}</div>
  </td></tr>`;
}

// Per batch, not per line: how many spools in each lot, so he can log them
// while I move on, plus room for anything the sheet can't anticipate.
function trayFooter() {
  return `<div class="tray-foot">
    <div class="ff"><span class="pa-lbl">Lots to log</span><span class="rule"></span></div>
    <div class="ff"><span class="pa-lbl">Extra steps</span><span class="rule"></span></div>
  </div>`;
}

function itemRow(comp, it, slot, extraSub, id) {
  const on = ticks.has(id);
  return `<tr class="${on ? 'ticked' : ''}">
    <td class="c-box"><span class="box${on ? ' checked' : ''}" data-tick="${esc(id)}"
      onclick="toggleTick('${esc(id)}', this)" title="Tick when it's on the tray"></span></td>
    <td class="c-dye">
      <span class="dye-name">${dot(comp.swatch)}${nameHtml(comp)}</span>
      ${slot ? `<span class="sub"><span class="tag slot">${esc(slot)}</span></span>` : ''}
      ${comp.notes ? `<span class="sub">${esc(comp.notes)}</span>` : ''}
      ${extraSub || ''}
    </td>
    <td class="c-jar">${jarCell(it)}</td>
    <td class="c-powder">${powderCell(it)}</td>
    <td class="c-flag"><span class="bring ${it.form}">${it.icons}${esc(it.label)}</span></td>
  </tr>`;
}

const LEGEND = `<div class="legend">
  <span>${ICO_JAR} <strong>Made dye</strong> — the container, from its bin</span>
  <span>${ICO_TUB} <strong>Powder</strong> — the powder tub</span>
  <span>${ICO_JAR}${ICO_TUB} <strong>Made dye + powder</strong> — both; the container is nearly out</span>
</div>`;

function render() {
  const content = document.getElementById('content');
  if (loadError) { content.innerHTML = `<div class="warn-banner">${esc(loadError)}</div>`; return; }

  const dateVal = Number(document.getElementById('dateSel').value);
  const lowMl = Number(document.getElementById('lowInput').value) || 0;
  const mode = document.getElementById('viewSel').value;
  const showPA = document.getElementById('paToggle').checked;
  const batches = planByDate[dateVal] || [];

  if (!batches.length) {
    content.innerHTML = `<div class="empty-state">No plan saved for this day.<br>
      <span style="font-size:11px">Run Batch Planner and hit <strong>Save Today's Plan</strong> first.</span></div>`;
    return;
  }

  // Which batches use each dye — so a jar that's wanted again later never
  // gets put back in the bin between trays.
  const usedIn = {};
  batches.forEach(b => (compsByRecipe[b.recipeId] || []).forEach(c => {
    if (!usedIn[c.key]) usedIn[c.key] = [];
    usedIn[c.key].push(b.seq);
  }));

  let unresolved = 0;
  let body, subline;

  if (mode === 'batch') {
    body = batches.map(b => {
      const recipe = recipeById[b.recipeId] || { name: 'Recipe #' + b.recipeId, sku: '', fiber: '' };
      const comps = compsByRecipe[b.recipeId] || [];
      const slots = parseSlots(b.prepSlot);

      const rows = comps.map((comp, i) => {
        if (comp.unresolved) unresolved++;
        const it = itemFor(comp, lowMl);
        const others = (usedIn[comp.key] || []).filter(s => s !== b.seq);
        const again = others.length
          ? `<span class="sub again">also batch ${others.join(', ')} — don't put it back</span>` : '';
        return itemRow(comp, it, slots[normalize(comp.name)], again, tickId(dateVal, b.seq, comp.key))
             + (showPA ? putAwayRow(comp, it, i === comps.length - 1) : '');
      }).join('') || `<tr><td class="c-box"></td><td colspan="4"><span class="where none">No dyes recorded for this recipe.</span></td></tr>`;

      const strip = comps.slice(0, 6).map(c => dot(c.swatch)).join('');
      const n = comps.length;
      return `<div class="tray">
        <div class="tray-head">
          <span class="seq">${b.seq}</span>
          <span class="tray-name">${esc(recipe.name)}
            ${recipe.sku ? `<span class="sku">${esc(recipe.sku)}${recipe.fiber ? ' · ' + esc(recipe.fiber) : ''}</span>` : ''}
          </span>
          <span class="swatch-strip">${strip}</span>
          <span class="tray-check" onclick="toggleTray(this.closest('.tray'))"
            title="Tick the whole tray"><span class="mark">☐</span><span>0 of ${n}</span></span>
        </div>
        <table class="items">${ITEM_HEAD()}${rows}</table>
        ${showPA ? trayFooter() : ''}
      </div>`;
    }).join('');
    subline = `${batches.length} tray${batches.length === 1 ? '' : 's'} — one per batch, in the order I'll work them`;
  } else {
    // One flat list: every distinct dye the day needs, jar and tub together.
    const seen = {};
    const flat = [];
    batches.forEach(b => (compsByRecipe[b.recipeId] || []).forEach(c => {
      if (seen[c.key]) return;
      seen[c.key] = true;
      flat.push(c);
    }));
    flat.sort((a, b) => (usedIn[a.key][0] - usedIn[b.key][0]) || a.label.localeCompare(b.label));
    const rows = flat.map(comp => {
      if (comp.unresolved) unresolved++;
      const it = itemFor(comp, lowMl);
      const seqs = [...new Set(usedIn[comp.key])].sort((a, b) => a - b);
      return itemRow(comp, it, null, `<span class="sub">batch ${seqs.join(', ')}</span>`,
                     tickId(dateVal, 'day', comp.key))
           + (showPA ? putAwayRow(comp, it, false) : '');
    }).join('');
    body = `<div class="tray">
      <div class="tray-head">
        <span class="tray-name">Everything for the day
          <span class="sku">${flat.length} dye${flat.length === 1 ? '' : 's'} across ${batches.length} batch${batches.length === 1 ? '' : 'es'}</span>
        </span>
        <span class="tray-check" onclick="toggleTray(this.closest('.tray'))"
          title="Tick the whole list"><span class="mark">☐</span><span>0 of ${flat.length}</span></span>
      </div>
      <table class="items">${ITEM_HEAD()}${rows}</table>
    </div>`;
    subline = `${flat.length} dyes — everything the day needs, gathered in one place`;
  }

  const warn = unresolved ? `<div class="warn-banner">
    ${unresolved} dye${unresolved === 1 ? '' : 's'} on this plan ${unresolved === 1 ? 'is' : 'are'} not linked to a catalog row —
    no bin, no tub, no swatch shown. Ask before pulling ${unresolved === 1 ? 'it' : 'them'}.
  </div>` : '';

  content.innerHTML = `
    <div class="sheet-head">
      <div class="sheet-title">Dye Prep Sheet</div>
      <div class="sheet-sub">${esc(dateLabel(dateVal))} · ${esc(subline)}</div>
      <div class="how">Set out whatever each line asks for, together, so a whole batch can be picked up and carried to the kettle in one go. Don't open or mix anything.
      <strong>Tick each one off as it lands on the tray</strong> — the count is kept if the page reloads.
      The dashed strips stay empty: I fill those in at the kettle and hand the sheet back for putting away.</div>
      <div class="progress" id="progress"></div>
    </div>
    ${warn}
    ${body}
    ${LEGEND}`;

  refreshAllTrays();
  refreshProgress();
}

// Whole-sheet progress, so they can see at a glance how much is left.
function refreshProgress() {
  const el = document.getElementById('progress');
  if (!el) return;
  const boxes = [...document.querySelectorAll('.box[data-tick]')];
  const done = boxes.filter(b => ticks.has(b.dataset.tick)).length;
  if (!boxes.length) { el.innerHTML = ''; return; }
  const pct = Math.round((done / boxes.length) * 100);
  el.innerHTML = `
    <div class="progress-bar"><span style="width:${pct}%"></span></div>
    <div class="progress-text">${done} of ${boxes.length} pulled${done === boxes.length ? ' — tray set is complete ✓' : ''}
      ${done ? `<button class="linkbtn no-print" onclick="clearTicks()">clear ticks</button>` : ''}</div>`;
}

loadTicks();
grist.ready({ requiredAccess: 'read table' });
loadEverything();
</script>
</body>
</html>
