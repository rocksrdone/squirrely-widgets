<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dye Prep Sheet</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --ink: #1A1614;
    --paper: #F7F3EE;
    --warm: #E8DFD4;
    --rule: #D4C9BC;
    --muted: #8B7D72;
    --accent: #8B3A2A;
    --teal: #3A8B7A;
    --teal-light: #E5F2EF;
    --gold: #B07D2A;
    --gold-light: #F5EDD8;
    --urgent: #A01830;
    --urgent-light: #F5E0E4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 16px;
  }

  /* ── Controls (screen only) ─────────────────────────────────── */
  .controls {
    display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 16px; border-bottom: 2px solid var(--rule);
  }
  .ctl { display: flex; flex-direction: column; gap: 3px; }
  .ctl label { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .ctl select, .ctl input {
    font-family: 'Inter', sans-serif; font-size: 12px; padding: 5px 8px;
    border: 1px solid var(--rule); border-radius: 5px; background: white; color: var(--ink);
  }
  .ctl input[type="number"] { width: 68px; }
  .btn {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--ink);
    background: var(--ink); color: var(--paper); cursor: pointer;
  }
  .btn.secondary { background: white; color: var(--ink); border-color: var(--rule); }
  .btn:hover { opacity: .88; }
  .ctl-spacer { flex: 1; }

  /* ── Sheet ──────────────────────────────────────────────────── */
  .sheet-head { margin-bottom: 18px; }
  .sheet-title { font-family: 'Libre Baskerville', serif; font-size: 22px; font-weight: 700; }
  .sheet-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .section { margin-bottom: 26px; }
  .section-head {
    font-family: 'Libre Baskerville', serif; font-size: 15px; font-weight: 700;
    border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-bottom: 4px;
  }
  .section-note { font-size: 10.5px; color: var(--muted); margin-bottom: 10px; }

  /* Pull list */
  .bin-block { break-inside: avoid; page-break-inside: avoid; margin-bottom: 12px; }
  .bin-head {
    display: flex; align-items: baseline; gap: 8px;
    background: var(--warm); border-left: 4px solid var(--ink);
    padding: 4px 9px; font-weight: 700; font-size: 12.5px;
  }
  .bin-head .count { font-size: 10px; color: var(--muted); font-weight: 500; }
  .bin-block.powder .bin-head { border-left-color: var(--gold); background: var(--gold-light); }

  .pull-row {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 9px 5px 6px; border-bottom: 1px solid var(--warm);
  }
  .pull-row:last-child { border-bottom: none; }
  .pull-main { display: block; flex: 1; min-width: 0; }
  .pull-name { display: block; font-weight: 600; font-size: 12.5px; }
  .pull-name .brand { display: inline; font-weight: 400; color: var(--muted); font-size: 11px; }
  .pull-meta { display: block; font-size: 10.5px; color: var(--muted); }
  .pull-for { display: block; font-size: 10px; color: var(--muted); font-style: italic; }

  .box {
    flex: none; width: 15px; height: 15px; border: 1.6px solid var(--ink);
    border-radius: 3px; cursor: pointer; background: white;
  }
  .box.checked { background: var(--ink); position: relative; }
  .box.checked::after {
    content: '✓'; color: var(--paper); font-size: 11px; line-height: 13px;
    position: absolute; inset: 0; text-align: center;
  }

  .dot {
    flex: none; width: 13px; height: 13px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.28);
  }
  .dot.unknown { background: repeating-linear-gradient(45deg,#fff,#fff 3px,#DDD4C8 3px,#DDD4C8 6px); }

  .tag {
    display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 3px; white-space: nowrap;
    border: 1px solid;
  }
  .tag.jar     { background: var(--teal-light); color: #1F5A4C; border-color: #8FC4B7; }
  .tag.both    { background: var(--gold-light); color: #7A5410; border-color: #D9BC7C; }
  .tag.mix     { background: var(--urgent-light); color: var(--urgent); border-color: #E0A5AF; }
  .tag.powder  { background: #EDE7F5; color: #4B3A73; border-color: #BFB0DC; }
  .tag.slot    { background: white; color: var(--ink); border-color: var(--ink); font-family: 'DM Mono', monospace; }
  .tag.out     { background: white; color: var(--muted); border-color: var(--rule); }

  /* Batch order */
  .batch {
    break-inside: avoid; page-break-inside: avoid;
    border: 1px solid var(--rule); border-radius: 7px; background: white;
    margin-bottom: 10px; overflow: hidden;
  }
  .batch-head {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; background: var(--warm); border-bottom: 1px solid var(--rule);
  }
  .seq {
    flex: none; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 14px;
    width: 30px; height: 26px; line-height: 24px; text-align: center;
    border: 1.6px solid var(--ink); border-radius: 5px; background: var(--paper);
  }
  .batch-name { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 14px; flex: 1; min-width: 0; }
  .batch-name .sku { font-family: 'DM Mono', monospace; font-weight: 400; font-size: 10px; color: var(--muted); display: block; }
  .swatch-strip { display: flex; gap: 3px; flex: none; }
  .swatch-strip .dot { width: 16px; height: 16px; }

  .batch-dyes { padding: 2px 10px 7px; }
  .dye-row {
    display: flex; align-items: center; gap: 9px;
    padding: 5px 0; border-bottom: 1px solid var(--warm);
  }
  .dye-row:last-child { border-bottom: none; }
  .dye-row.carry { opacity: .62; }
  .dye-main { display: block; flex: 1; min-width: 0; }
  .dye-name { display: block; font-weight: 600; font-size: 12.5px; }
  .dye-name .brand { display: inline; font-weight: 400; color: var(--muted); font-size: 11px; }
  .dye-where { display: block; font-size: 10.5px; color: var(--muted); }
  .dye-note { display: block; font-size: 10px; color: var(--accent); font-style: italic; }

  .empty-state { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }
  .warn-banner {
    background: var(--urgent-light); border: 1px solid #E0A5AF; color: var(--urgent);
    padding: 8px 11px; border-radius: 6px; font-size: 11.5px; margin-bottom: 14px;
  }
  .legend { font-size: 10px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }

  /* ── Print ──────────────────────────────────────────────────── */
  @media print {
    @page { margin: 12mm; }
    body { background: white; padding: 0; font-size: 11px; }
    .no-print { display: none !important; }
    .batch, .bin-block { box-shadow: none; }
    .batch-head, .bin-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .dot, .tag { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .box.checked { background: white; }
    .box.checked::after { color: var(--ink); }
    .section { page-break-before: auto; }
  }
</style>
</head>
<body>

<div class="controls no-print">
  <div class="ctl">
    <label for="dateSel">Plan day</label>
    <select id="dateSel" onchange="render()"></select>
  </div>
  <div class="ctl">
    <label for="lowInput">Low jar under (mL)</label>
    <input type="number" id="lowInput" value="10" min="0" step="5" onchange="render()">
  </div>
  <div class="ctl">
    <label for="viewSel">Show</label>
    <select id="viewSel" onchange="render()">
      <option value="both">Pull list + batch order</option>
      <option value="pull">Pull list only</option>
      <option value="batches">Batch order only</option>
    </select>
  </div>
  <div class="ctl-spacer"></div>
  <button class="btn secondary" onclick="loadEverything()">↻ Refresh</button>
  <button class="btn" onclick="window.print()">🖨 Print</button>
</div>

<div id="content"><div class="empty-state">Loading…</div></div>

<script>
// ── Shared helpers (keep in sync with the rest of the widget suite) ──
function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
// Matches a column id ignoring case and non-alphanumerics, trying each candidate.
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${tableName}.${cands[0]}`);
  }
  return out;
}
function todayEpochSeconds() {
  const n = new Date();
  return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000;
}
function dateLabel(epoch) {
  const d = new Date(Number(epoch) * 1000);
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' });
}
function isHex(s) { return /^#?[0-9a-fA-F]{6}$/.test((s || '').toString().trim()); }
function hexOf(s) {
  const v = (s || '').toString().trim();
  return isHex(v) ? (v[0] === '#' ? v : '#' + v) : null;
}

// ── State ────────────────────────────────────────────────────────
let planByDate = {};   // epochSeconds -> [{seq, recipeId, prepSlot}]
let recipeById = {};
let dyeById = {};
let dyeNameCounts = {};
let compsByRecipe = {};   // recipeId -> [{dyeId, name, label, isPowder, step, notes}]
let stockByDyeId = {};    // dyeId -> [{qty, bin}]
let loadError = null;

// A name shared by two brands is never shown bare — brand is the only thing
// that tells the two jars apart on the shelf. Twenty-six names in the catalog
// are shared (Turquoise is CC, J and PF), so this is the normal case, not an edge.
function dyeLabel(info) {
  if (!info) return '';
  return (dyeNameCounts[normalize(info.name)] > 1 && info.brand)
    ? `${info.name} (${info.brand})`
    : info.name;
}

// Where the powder jar lives. Powder_Location doesn't exist in Dyes today, so
// brand + serial is the address — that's what's printed on the tub. If a
// Powder_Location column is ever added it gets picked up and shown first.
function powderAddress(info) {
  if (!info) return '';
  if (info.powderLoc) return info.powderLoc;
  const bits = [info.brand, info.serial].filter(Boolean);
  return bits.join(' · ');
}

async function loadEverything() {
  loadError = null;
  document.getElementById('content').innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const [planTable, recipesTable, compTable, dyesTable, stockTable] = await Promise.all([
      grist.docApi.fetchTable('Day_Plan'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Recipe_Dye_Components'),
      grist.docApi.fetchTable('Dyes'),
      grist.docApi.fetchTable('Dye_Stock'),
    ]);

    const missing = [];
    const opt = cands => ({ cands, required: false });
    const PLAN = resolveCols(planTable, 'Day_Plan', {
      planDate: ['Plan_Date'], recipe: ['Recipe'],
      sequence: ['Sequence'], prepSlot: opt(['Prep_Slot']),
    }, missing);
    const REC = resolveCols(recipesTable, 'Recipes', {
      name: ['Recipe_Name'], sku: opt(['SKU_Base']),
      fiber: opt(['Fiber_Type']), notes: opt(['Notes']),
    }, missing);
    const COMP = resolveCols(compTable, 'Recipe_Dye_Components', {
      recipe: ['Recipe'], dye: ['Dye_Name'],
      isPowder: opt(['Is_Powder']), measureMode: opt(['Measure_Mode']),
      step: opt(['Step_Number']), layer: opt(['Layer_Order']),
      dilution: opt(['Dilution']), notes: opt(['Application_Notes']),
    }, missing);
    const DYE = resolveCols(dyesTable, 'Dyes', {
      name: ['Dye_Name'], brand: opt(['Brand']), serial: opt(['Serial']),
      swatch: opt(['Swatch_Hex']), powderLoc: opt(['Powder_Location']),
      stdPowder: opt(['Std_Powder_tsp']), stdWater: opt(['Std_Water_mL']),
    }, missing);
    const STOCK = resolveCols(stockTable, 'Dye_Stock', {
      dye: ['Dye'], quantity: ['Quantity_mL'], bin: opt(['Bin_Location']),
    }, missing);

    if (missing.length) {
      loadError = 'Missing columns: ' + [...new Set(missing)].join(', ') +
                  ' — a table or column was likely renamed.';
      render();
      return;
    }

    // ── Dye catalog, keyed by ROW ID ──────────────────────────────
    // Never key a dye by its name. Bin, powder tub and swatch all differ
    // between two dyes that share a name, and getting the wrong one means
    // the wrong colour in the kettle.
    dyeById = {}; dyeNameCounts = {};
    (dyesTable.id || []).forEach((id, i) => {
      const name = (columnAsArray(dyesTable, DYE.name)[i] || '').toString();
      dyeById[id] = {
        id, name,
        brand: (columnAsArray(dyesTable, DYE.brand)[i] || '').toString().trim(),
        serial: (columnAsArray(dyesTable, DYE.serial)[i] || '').toString().trim(),
        swatch: hexOf(columnAsArray(dyesTable, DYE.swatch)[i]),
        powderLoc: (columnAsArray(dyesTable, DYE.powderLoc)[i] || '').toString().trim(),
        stdPowder: columnAsArray(dyesTable, DYE.stdPowder)[i],
        stdWater: columnAsArray(dyesTable, DYE.stdWater)[i],
      };
      const k = normalize(name);
      if (k) dyeNameCounts[k] = (dyeNameCounts[k] || 0) + 1;
    });
    // Free text only resolves when the name belongs to exactly one dye —
    // an ambiguous name resolves to nothing rather than to a coin flip.
    const dyeIdByUniqueName = {};
    Object.values(dyeById).forEach(d => {
      const k = normalize(d.name);
      if (k && dyeNameCounts[k] === 1) dyeIdByUniqueName[k] = d.id;
    });

    // ── Recipes ───────────────────────────────────────────────────
    recipeById = {};
    (recipesTable.id || []).forEach((id, i) => {
      recipeById[id] = {
        id,
        name: (columnAsArray(recipesTable, REC.name)[i] || '').toString(),
        sku: (columnAsArray(recipesTable, REC.sku)[i] || '').toString(),
        fiber: (columnAsArray(recipesTable, REC.fiber)[i] || '').toString(),
      };
    });

    // ── Components ────────────────────────────────────────────────
    compsByRecipe = {};
    (compTable.id || []).forEach((id, i) => {
      const recipeRef = getRefId(columnAsArray(compTable, COMP.recipe)[i]);
      if (!recipeRef) return;
      const rawDye = columnAsArray(compTable, COMP.dye)[i];
      let dyeRefId = getRefId(rawDye);
      if (!dyeRefId && typeof rawDye === 'string') {
        dyeRefId = dyeIdByUniqueName[normalize(rawDye)] || null;
      }
      const info = dyeRefId ? dyeById[dyeRefId] : null;
      const name = info ? info.name : (typeof rawDye === 'string' ? rawDye : '');
      if (!name) return;

      const measure = (columnAsArray(compTable, COMP.measureMode)[i] || '').toString();
      const isPowder = !!columnAsArray(compTable, COMP.isPowder)[i] || /powder/i.test(measure);

      if (!compsByRecipe[recipeRef]) compsByRecipe[recipeRef] = [];
      // One dye can appear at two steps of a recipe; that's still one container
      // to fetch, so collapse it and keep the earliest step for ordering.
      const existing = compsByRecipe[recipeRef].find(c => c.key === (dyeRefId ? 'id:' + dyeRefId : 'nm:' + normalize(name)));
      const step = Number(columnAsArray(compTable, COMP.step)[i]) || 0;
      if (existing) {
        if (step && (!existing.step || step < existing.step)) existing.step = step;
        existing.isPowder = existing.isPowder || isPowder;
        return;
      }
      compsByRecipe[recipeRef].push({
        key: dyeRefId ? 'id:' + dyeRefId : 'nm:' + normalize(name),
        dyeId: dyeRefId,
        name,
        label: info ? dyeLabel(info) : name,
        swatch: info ? info.swatch : null,
        isPowder,
        step,
        dilution: (columnAsArray(compTable, COMP.dilution)[i] || '').toString().trim(),
        notes: (columnAsArray(compTable, COMP.notes)[i] || '').toString().trim(),
        unresolved: !dyeRefId,
      });
    });
    Object.values(compsByRecipe).forEach(list => list.sort((a, b) => (a.step || 99) - (b.step || 99)));

    // ── Premade stock, keyed by dye ROW ID ────────────────────────
    stockByDyeId = {};
    (stockTable.id || []).forEach((id, i) => {
      const dyeRef = getRefId(columnAsArray(stockTable, STOCK.dye)[i]);
      if (!dyeRef || !dyeById[dyeRef]) return;
      if (!stockByDyeId[dyeRef]) stockByDyeId[dyeRef] = [];
      stockByDyeId[dyeRef].push({
        qty: Number(columnAsArray(stockTable, STOCK.quantity)[i]) || 0,
        bin: (columnAsArray(stockTable, STOCK.bin)[i] || '').toString().trim(),
      });
    });

    // ── Day plans, collapsed to one entry per sequence step ───────
    // Day_Plan holds one row per order line; several lines share a Sequence
    // when two customers ordered the same colorway. That's one trip to the
    // kettle, so it's one thing to prep.
    planByDate = {};
    const seenSeq = {};
    (planTable.id || []).forEach((id, i) => {
      const d = Number(columnAsArray(planTable, PLAN.planDate)[i]);
      const recipeId = getRefId(columnAsArray(planTable, PLAN.recipe)[i]);
      const seq = Number(columnAsArray(planTable, PLAN.sequence)[i]) || 0;
      if (!d || !recipeId) return;
      const dedupe = `${d}|${seq}|${recipeId}`;
      if (seenSeq[dedupe]) return;
      seenSeq[dedupe] = true;
      if (!planByDate[d]) planByDate[d] = [];
      planByDate[d].push({
        seq, recipeId,
        prepSlot: (columnAsArray(planTable, PLAN.prepSlot)[i] || '').toString().trim(),
      });
    });
    Object.values(planByDate).forEach(list => list.sort((a, b) => a.seq - b.seq));

    buildDateOptions();
    render();
  } catch (e) {
    console.error('Failed to load dye prep sheet:', e);
    loadError = 'Failed to load — ' + ((e && e.message) ? e.message : String(e));
    render();
  }
}

function buildDateOptions() {
  const sel = document.getElementById('dateSel');
  const prev = sel.value;
  const dates = Object.keys(planByDate).map(Number).sort((a, b) => b - a);
  const today = todayEpochSeconds();
  sel.innerHTML = dates.map(d =>
    `<option value="${d}">${esc(dateLabel(d))}${d === today ? ' — today' : ''}</option>`
  ).join('') || '<option value="">No saved plans</option>';
  if (prev && dates.indexOf(Number(prev)) >= 0) sel.value = prev;
  else if (dates.indexOf(today) >= 0) sel.value = String(today);
}

// ── What the assistant does with each dye ────────────────────────
// POWDER RECIPE — dry powder straight into the kettle, there is no jar.
// JAR          — enough premade solution on hand, bring the jar.
// JAR + POWDER — jar is running low, bring the tub too so it can be topped up.
// MIX NEEDED   — no premade solution at all, bring the tub only.
function planFor(comp, lowMl) {
  const info = comp.dyeId ? dyeById[comp.dyeId] : null;
  const rows = comp.dyeId ? (stockByDyeId[comp.dyeId] || []) : [];
  const total = rows.reduce((s, r) => s + r.qty, 0);
  // Two containers in the same bin is one place to look. Two different bins
  // still both show — that one is real.
  const bins = [...new Set(rows.map(r => r.bin).filter(Boolean))].sort();
  const powder = powderAddress(info);

  if (comp.isPowder) {
    return { kind: 'powder', tag: 'Powder recipe', cls: 'powder', bins: [], total: 0, powder,
             where: powder ? `powder tub — ${powder}` : 'powder tub', needPowder: true };
  }
  if (total <= 0) {
    return { kind: 'mix', tag: 'Mix needed', cls: 'mix', bins: [], total: 0, powder,
             where: powder ? `no jar on record — powder tub ${powder}` : 'no jar on record — powder tub',
             needPowder: true };
  }
  const binTxt = bins.length ? `bin ${bins.join(' + ')}` : 'bin not recorded';
  if (total < lowMl) {
    return { kind: 'both', tag: 'Jar + powder', cls: 'both', bins, total, powder,
             where: `${binTxt} · ${Math.round(total)}mL left${powder ? ` · powder ${powder}` : ''}`,
             needPowder: true };
  }
  return { kind: 'jar', tag: 'Jar', cls: 'jar', bins, total, powder,
           where: `${binTxt} · ${Math.round(total)}mL`, needPowder: false };
}

function dotFor(hex) {
  return hex
    ? `<span class="dot" style="background:${esc(hex)}"></span>`
    : `<span class="dot unknown" title="no swatch recorded"></span>`;
}
function nameHtml(comp) {
  const info = comp.dyeId ? dyeById[comp.dyeId] : null;
  const bare = info ? info.name : comp.name;
  const ambiguous = info && dyeNameCounts[normalize(info.name)] > 1;
  return `${esc(bare)}${ambiguous && info.brand ? ` <span class="brand">(${esc(info.brand)})</span>` : ''}`;
}

function render() {
  const content = document.getElementById('content');
  if (loadError) {
    content.innerHTML = `<div class="warn-banner">${esc(loadError)}</div>`;
    return;
  }
  const dateVal = Number(document.getElementById('dateSel').value);
  const lowMl = Number(document.getElementById('lowInput').value) || 0;
  const view = document.getElementById('viewSel').value;
  const batches = planByDate[dateVal] || [];

  if (!batches.length) {
    content.innerHTML = `<div class="empty-state">No plan saved for this day.<br>
      <span style="font-size:11px">Run Batch Planner and hit <strong>Save Today's Plan</strong> first.</span></div>`;
    return;
  }

  // Walk the batches once, building both halves of the sheet from the same pass.
  const pull = {};        // location key -> [{comp, plan, batches:[seq]}]
  const powderPulls = {}; // dyeKey -> {comp, plan, batches:[seq]}
  let prevKeys = new Set();
  let unresolvedCount = 0;

  const batchHtml = batches.map(b => {
    const recipe = recipeById[b.recipeId] || { name: 'Recipe #' + b.recipeId, sku: '', fiber: '' };
    const comps = compsByRecipe[b.recipeId] || [];
    const slotByName = parseSlots(b.prepSlot);
    const thisKeys = new Set(comps.map(c => c.key));

    const rows = comps.map(comp => {
      const p = planFor(comp, lowMl);
      if (comp.unresolved) unresolvedCount++;

      // Pull list: jars grouped by bin, powder tubs grouped separately.
      if (p.kind === 'jar' || p.kind === 'both') {
        const binKey = p.bins.length ? p.bins[0] : '—';
        if (!pull[binKey]) pull[binKey] = [];
        const hit = pull[binKey].find(x => x.comp.key === comp.key);
        if (hit) hit.batches.push(b.seq);
        else pull[binKey].push({ comp, plan: p, batches: [b.seq] });
      }
      if (p.needPowder) {
        if (!powderPulls[comp.key]) powderPulls[comp.key] = { comp, plan: p, batches: [] };
        powderPulls[comp.key].batches.push(b.seq);
      }

      const carry = prevKeys.has(comp.key);
      const slot = slotByName[normalize(comp.name)];
      return `
        <div class="dye-row${carry ? ' carry' : ''}">
          <span class="box" onclick="this.classList.toggle('checked')"></span>
          ${dotFor(comp.swatch)}
          <span class="dye-main">
            <span class="dye-name">${nameHtml(comp)}</span>
            <span class="dye-where">${esc(p.where)}</span>
            ${comp.notes ? `<span class="dye-note">${esc(comp.notes)}</span>` : ''}
          </span>
          ${slot ? `<span class="tag slot">${esc(slot)}</span>` : ''}
          ${carry ? '<span class="tag out">already out</span>' : ''}
          <span class="tag ${p.cls}">${esc(p.tag)}</span>
        </div>`;
    }).join('') || '<div class="dye-row"><span class="dye-where">No dyes recorded for this recipe.</span></div>';

    prevKeys = thisKeys;

    const strip = comps.slice(0, 6).map(c => dotFor(c.swatch)).join('');
    return `
      <div class="batch">
        <div class="batch-head">
          <span class="seq">${b.seq}</span>
          <span class="batch-name">${esc(recipe.name)}
            ${recipe.sku ? `<span class="sku">${esc(recipe.sku)}${recipe.fiber ? ' · ' + esc(recipe.fiber) : ''}</span>` : ''}
          </span>
          <span class="swatch-strip">${strip}</span>
        </div>
        <div class="batch-dyes">${rows}</div>
      </div>`;
  }).join('');

  // ── Pull list ───────────────────────────────────────────────────
  const binKeys = Object.keys(pull).sort((a, b) => {
    const na = Number(a), nb = Number(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });

  const jarBlocks = binKeys.map(bin => {
    const items = pull[bin].sort((x, y) => x.batches[0] - y.batches[0]);
    return `
      <div class="bin-block">
        <div class="bin-head">${bin === '—' ? 'Bin not recorded' : 'Bin ' + esc(bin)}
          <span class="count">${items.length} jar${items.length === 1 ? '' : 's'}</span></div>
        ${items.map(it => pullRow(it)).join('')}
      </div>`;
  }).join('');

  const powderItems = Object.values(powderPulls).sort((a, b) => a.batches[0] - b.batches[0]);
  const powderBlock = powderItems.length ? `
    <div class="bin-block powder">
      <div class="bin-head">Powder tubs
        <span class="count">${powderItems.length} tub${powderItems.length === 1 ? '' : 's'} — leave sealed, I mix these</span></div>
      ${powderItems.map(it => pullRow(it, true)).join('')}
    </div>` : '';

  const jarCount = binKeys.reduce((s, k) => s + pull[k].length, 0);

  const pullSection = `
    <div class="section">
      <div class="section-head">1 · Pull list — one trip per bin</div>
      <div class="section-note">Everything today needs, gathered once. ${jarCount} jar${jarCount === 1 ? '' : 's'} from ${binKeys.length} bin${binKeys.length === 1 ? '' : 's'}${powderItems.length ? `, plus ${powderItems.length} powder tub${powderItems.length === 1 ? '' : 's'}` : ''}. Tick as you go.</div>
      ${jarBlocks}
      ${powderBlock}
      <div class="legend">
        <span><span class="tag jar">Jar</span> enough premade — bring the jar</span>
        <span><span class="tag both">Jar + powder</span> jar is low — bring the tub too</span>
        <span><span class="tag mix">Mix needed</span> no jar exists — tub only</span>
        <span><span class="tag powder">Powder recipe</span> dry powder, never a jar</span>
      </div>
    </div>`;

  const batchSection = `
    <div class="section">
      <div class="section-head">2 · Table order — set out one batch at a time</div>
      <div class="section-note">Run top to bottom. <strong>Already out</strong> means it was on the table for the batch before — leave it there.</div>
      ${batchHtml}
    </div>`;

  const warn = unresolvedCount ? `<div class="warn-banner">
    ${unresolvedCount} dye${unresolvedCount === 1 ? '' : 's'} on this plan ${unresolvedCount === 1 ? 'is' : 'are'} not linked to a
    catalog row — no bin, no swatch, no powder tub shown for ${unresolvedCount === 1 ? 'it' : 'them'}. Ask before pulling.
  </div>` : '';

  content.innerHTML = `
    <div class="sheet-head">
      <div class="sheet-title">Dye Prep Sheet</div>
      <div class="sheet-sub">${esc(dateLabel(dateVal))} · ${batches.length} batch${batches.length === 1 ? '' : 'es'} · jar counts as low under ${lowMl}mL</div>
    </div>
    ${warn}
    ${view !== 'batches' ? pullSection : ''}
    ${view !== 'pull' ? batchSection : ''}`;
}

function pullRow(it, powderMode) {
  const p = it.plan;
  const seqs = [...new Set(it.batches)].sort((a, b) => a - b);
  const where = powderMode
    ? (p.powder || 'tub location not recorded')
    : (p.bins.length > 1 ? `also in bin ${p.bins.slice(1).join(', ')} · ${Math.round(p.total)}mL total` : `${Math.round(p.total)}mL`);
  return `
    <div class="pull-row">
      <span class="box" onclick="this.classList.toggle('checked')"></span>
      ${dotFor(it.comp.swatch)}
      <span class="pull-main">
        <span class="pull-name">${nameHtml(it.comp)}</span>
        <span class="pull-meta">${esc(where)}</span>
        <span class="pull-for">for batch ${seqs.join(', ')}</span>
      </span>
      <span class="tag ${p.cls}">${esc(p.tag)}</span>
    </div>`;
}

// Prep_Slot is a human-readable line the planner writes, e.g.
// "P1 Turquoise · P2 Buttercup · P3 Very Hot Pink". It's a nice-to-have label,
// so a format change just means no slot tags — never a broken sheet.
function parseSlots(prepSlot) {
  const out = {};
  if (!prepSlot || prepSlot === '—') return out;
  prepSlot.split('·').forEach(part => {
    const m = part.trim().match(/^(P\d+)\s+(.+)$/);
    if (m) out[normalize(m[2])] = m[1];
  });
  return out;
}

grist.ready({ requiredAccess: 'read table' });
loadEverything();
</script>
</body>
</html>
