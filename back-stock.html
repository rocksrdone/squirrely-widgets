<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --ink: #3A3028; --rule: #DDD3C7; --paper: #FDFBF7;
    --teal: #2A6B6B; --teal-light: #E4F0EF;
    --done-bg: #E8F3E8; --done-text: #2D6A2D;
    --warn-bg: #FBF0E4; --warn-text: #8B5A2A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #8B7D72; margin-bottom: 8px; }
  .search-input { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
  .add-panel { background: var(--teal-light); border: 1px solid var(--teal); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .add-row { display: flex; gap: 5px; }
  .add-color { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 5px; font-size: 13px; }
  .add-qty { width: 68px; padding: 7px; border: 1px solid var(--rule); border-radius: 5px; font-size: 13px; text-align: center; }
  .add-btn { padding: 0 12px; border: none; border-radius: 5px; background: var(--teal); color: white; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .add-btn:disabled { background: #A9C3C3; cursor: default; }
  .add-hint { font-size: 10px; color: #8B7D72; margin-top: 5px; }
  .total-line { font-size: 11px; color: var(--teal); font-weight: 600; margin-bottom: 8px; }

  .color-card { background: white; border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 5px; overflow: hidden; }
  .color-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 9px; cursor: pointer;
  }
  .color-head:hover { background: #FAF7F2; }
  .color-name { font-weight: 700; font-size: 13px; }
  .color-meta { font-size: 10px; color: #8B7D72; margin-top: 1px; }
  .color-total { font-size: 13px; font-weight: 700; color: var(--teal); white-space: nowrap; }

  .lot-rows { border-top: 1px solid var(--rule); padding: 4px 9px 8px; }
  .lot-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #F0EAE1; }
  .lot-row:last-child { border-bottom: none; }
  .lot-row.nobin { background: var(--warn-bg); margin: 0 -9px; padding-left: 9px; padding-right: 9px; }
  .bin-chip { display: inline-block; font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10px; padding: 1px 6px; border-radius: 9px; background: var(--teal-light);
    color: var(--teal); font-weight: 700; margin-left: 4px; }
  .bin-chip.none { background: var(--warn-bg); color: var(--warn-text); }
  .color-bins { margin-top: 3px; }
  .color-bins .bin-chip { margin-left: 0; margin-right: 4px; }
  .lot-info { flex: 1; min-width: 0; }
  .lot-no { font-weight: 600; font-size: 12px; }
  .lot-sub { font-size: 10px; color: #8B7D72; }
  .lot-adjust { display: flex; align-items: center; gap: 4px; }
  .lot-adjust button {
    width: 26px; height: 26px; border: 1px solid var(--rule); background: white;
    border-radius: 5px; font-size: 15px; font-weight: 700; cursor: pointer; color: var(--teal); line-height: 1;
  }
  .lot-adjust button:active { background: var(--teal-light); }
  .lot-adjust input {
    width: 46px; padding: 4px; border: 1px solid var(--rule); border-radius: 4px;
    font-size: 13px; text-align: center;
  }
  .lot-adjust .save {
    width: auto; padding: 0 9px; font-size: 11px; font-weight: 700;
    background: var(--teal); color: white; border: none;
  }
  .lot-adjust .save:disabled { background: #C3BCB2; cursor: default; }

  .bs-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .bs-tab { flex: 1; padding: 7px 10px; border: 1px solid var(--rule); background: white;
    border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .bs-tab.on { background: var(--ink); border-color: var(--ink); color: white; }
  .bs-tab-n { font-weight: 700; opacity: .75; }
  .put-search { width: 100%; padding: 11px 12px; border: 1.5px solid var(--rule);
    border-radius: 7px; font-size: 15px; margin-bottom: 8px; }
  .put-search:focus { outline: none; border-color: var(--teal); }
  .put-card { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 6px;
    background: var(--warn-bg); border: 1px solid #E8D3B8; margin-bottom: 5px; flex-wrap: wrap; }
  .put-card.filed { background: white; border-color: var(--rule); }
  .put-name { font-weight: 700; font-size: 13px; }
  .put-fib { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: #8B7D72; font-weight: 400; }
  .put-meta { font-size: 10px; color: #8B7D72; }
  .put-go { padding: 9px 12px; border: none; border-radius: 5px; background: var(--teal);
    color: white; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .put-bin { width: 96px; padding: 7px; border: 1px solid var(--rule); border-radius: 5px; font-size: 12px; }
  .put-done { margin-top: 14px; }
  .put-done-head { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--teal); margin-bottom: 5px; padding-bottom: 3px; border-bottom: 1px solid var(--rule); }
  .put-done-row { display: flex; align-items: baseline; gap: 8px; font-size: 12px;
    padding: 3px 0; border-bottom: 1px solid #F0EAE1; }
  .put-done-meta { font-size: 10px; color: #8B7D72; margin-left: auto; }
  .put-done-bin { font-family: ui-monospace, Menlo, monospace; font-weight: 700; color: var(--teal); }

  .empty-state { text-align: center; color: #8B7D72; padding: 24px 12px; font-size: 12px; line-height: 1.6; }
  #toast {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 8px 14px; border-radius: 5px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="content"><div class="empty-state">Loading...</div></div>
<div id="toast"></div>

<script>
function getRefId(ref) {
  if (ref == null) return null;
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1] || null;
  if (typeof ref === 'object' && ref.rowId) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
function esc(s) { return (s == null ? '' : String(s)).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function fmtDate(v) {
  if (!v) return '';
  const ms = typeof v === 'number' ? v * 1000 : new Date(v).getTime();
  if (!ms || isNaN(ms)) return '';
  return new Date(ms).toLocaleDateString();
}
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${tableName}.${cands[0]}`);
  }
  return out;
}
const FIBER_NAME_TO_CODE = { 'FF Nylon': 'FFN', 'E Nylon': 'EN', 'FF Cotton': 'FFC', 'Blackwing': 'BW' };
function fiberCode(v) {
  const s = (v || '').toString().trim();
  if (!s) return '';
  if (FIBER_NAME_TO_CODE[s]) return FIBER_NAME_TO_CODE[s];
  const up = s.toUpperCase();
  return ['FFN', 'FFC', 'EN', 'BW'].includes(up) ? up : s;
}

let S = { colors: [], search: '', open: {}, stockCol: null, allRecipes: [], lotCols: null, adding: false,
  binCol: null, locations: [], view: 'stock', putQuery: '', putDone: [] };

function allLots() { return S.colors.flatMap(c => c.lots); }

/* Spools already sitting in each bin, so a suggestion can tell a full bin from
   an empty one. Keyed case-folded because the rack codes are typed by hand;
   the code WRITTEN is always the one Storage_Locations holds. */
function spoolsByBin() {
  const out = {};
  allLots().forEach(l => {
    if (!l.bin) return;
    const k = normalize(l.bin);
    out[k] = (out[k] || 0) + l.stock;
  });
  return out;
}
function binCapacity(loc) { return loc.max > 0 ? loc.max : (loc.target > 0 ? loc.target : 0); }

/* ── Where should this lot go? ─────────────────────────────────────────────
   There was nothing doing this for thread. The made-dye shelf has had
   suggestBinForDye since it was built, but back stock has only ever let you
   type a bin in Bin Audit — fine for correcting one lot, useless for a box of
   forty.

   WHAT "EVENLY DISTRIBUTED" ACTUALLY MEANS HERE. The first version balanced on
   spool count, which is the wrong quantity. Digging through a bin is caused by
   the number of DIFFERENT colourways in it, not the number of spools: sixty
   spools that are all Laguna is a bin you can read at a glance, while sixty
   spools across twelve colourways is a rummage every single time.

   So the thing spread evenly is colourways per bin, and lots of the same
   colourway still land together. Those two goals only look opposed — balancing
   on the right quantity satisfies both. Spool capacity stays a hard limit on
   top, so a balanced bin still cannot be overfilled. */

/* Above this, a bin starts to feel like a rummage. Bins under the figure are
   always preferred; when every eligible bin is over it, the emptiest still
   wins rather than the suggestion giving up. */
const COMFORTABLE_COLOURWAYS_PER_BIN = 4;

function binLoad() {
  const out = {};
  allLots().forEach(l => {
    if (!l.bin) return;
    const k = normalize(l.bin);
    if (!out[k]) out[k] = { spools: 0, colours: new Set() };
    out[k].spools += l.stock;
    out[k].colours.add(l.recipeId);
  });
  return out;
}

function suggestBinForLot(lot) {
  if (!S.locations.length) {
    return { bin: '', note: 'no Storage_Locations table, so there is no bin list to choose from' };
  }
  const load = binLoad();
  const at = (code) => load[normalize(code)] || { spools: 0, colours: new Set() };
  const room = (loc) => {
    const cap = binCapacity(loc);
    if (!cap) return Infinity;            // no cap recorded — treated as open
    return cap - at(loc.code).spools;
  };
  const colours = (loc) => at(loc.code).colours.size;
  const fibreOk = (loc) => !loc.fiber || !lot.fiber || fiberCode(loc.fiber) === fiberCode(lot.fiber);

  /* Fewest colourways first — that is the whole point. Room breaks a tie, so
     between two equally tidy bins the emptier one still wins. A bin that
     already holds this colourway counts as tidier by one, because adding to it
     does not make the bin any harder to read. */
  const tidiest = (list) => [...list].sort((a, b) => {
    const ca = colours(a) - (at(a.code).colours.has(lot.recipeId) ? 1 : 0);
    const cb = colours(b) - (at(b.code).colours.has(lot.recipeId) ? 1 : 0);
    if (ca !== cb) return ca - cb;
    return room(b) - room(a);
  });
  const prefer = (list) => {
    const fits = list.filter(L => room(L) >= lot.stock);
    if (!fits.length) return null;
    const comfy = fits.filter(L => colours(L) < COMFORTABLE_COLOURWAYS_PER_BIN
      || at(L.code).colours.has(lot.recipeId));
    return tidiest(comfy.length ? comfy : fits)[0];
  };

  // 1. Wherever this colourway already lives — it adds no clutter there.
  const homes = S.locations.filter(L => at(L.code).colours.has(lot.recipeId));
  const home = prefer(homes);
  if (home) {
    return { bin: home.code,
             note: `${lot.recipeName} is already in ${home.code} — keeping it together adds no clutter` };
  }
  if (homes.length) {
    // Its home bins are all too full for this lot; say so before moving on.
    const other = allLots().find(l => l.recipeId === lot.recipeId && l.bin && l.lotId !== lot.lotId);
    if (other && !S.locations.some(L => normalize(L.code) === normalize(other.bin))) {
      return { bin: other.bin, note: `${lot.recipeName} is already in ${other.bin} (not a listed bin code)` };
    }
  }

  // 2. A bin set aside for this colourway by name.
  const reserved = prefer(S.locations.filter(L =>
    L.reservedFor && normalize(L.reservedFor) === normalize(lot.recipeName)));
  if (reserved) return { bin: reserved.code, note: `reserved for ${lot.recipeName}` };

  // 3. A bin for this fibre, tidiest first.
  const fibreBin = prefer(S.locations.filter(L => L.fiber && fibreOk(L) && !L.reservedFor));
  if (fibreBin) {
    const n = colours(fibreBin);
    return { bin: fibreBin.code,
             note: `${lot.fiber || 'this fibre'} bin, ${n === 0 ? 'currently empty' : `only ${n} colourway${n === 1 ? '' : 's'} in it`}` };
  }

  // 4. Any unrestricted bin, tidiest first.
  const open = prefer(S.locations.filter(L => !L.fiber && !L.reservedFor));
  if (open) {
    const n = colours(open);
    return { bin: open.code,
             note: n === 0 ? 'empty bin' : `open bin, only ${n} colourway${n === 1 ? '' : 's'} in it` };
  }

  /* Nothing fits. Saying which constraint bit is the difference between a
     useful answer and a shrug. */
  if (!S.locations.some(L => fibreOk(L))) {
    return { bin: '', note: `no bin is set up for ${lot.fiber || 'this fibre'}` };
  }
  return { bin: '', note: `every ${lot.fiber || ''} bin is full — ${lot.stock} spools need space` };
}

async function loadStock() {
  try {
    const [lotsT, recipesT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Recipes'),
    ]);
    const missing = [];
    const opt = cands => ({ cands, required: false });
    const LOT = resolveCols(lotsT, 'Production_Lots', {
      lotNumber: ['Lot_Number'], recipe: ['Recipe'],
      store: opt(['Store_Stock_Spools']), vendor: opt(['Vendor_Stock_Spools']),
      general: opt(['General_Stock_Spools']),
      fiber: opt(['Fiber']), date: opt(['Date_Dyed']),
      drying: opt(['Drying_Status']), spoolsMade: opt(['Spools_Made']),
      yardsMade: opt(['Total_Yards_Made']),
      /* Where the spools physically are. Back-stock bins are the bare A1..D7
         rack — a DIFFERENT rack from the made-dye M- shelf, not being renamed,
         and never passed through the M- normaliser. Compared case-folded only. */
      bin: opt(['Storage_Bin']),
    }, missing);
    const REC = resolveCols(recipesT, 'Recipes', {
      name: ['Recipe_Name'], fiber: opt(['Fiber_Type']), method: opt(['Dye_Method']),
    }, missing);
    if (missing.length) {
      document.getElementById('content').innerHTML =
        `<div class="empty-state">Can't load — missing columns:<br><br><strong>${[...new Set(missing)].join('<br>')}</strong></div>`;
      return;
    }
    // Single back-stock bucket (you collapsed store/vendor into General_Stock_Spools).
    S.stockCol = LOT.general || LOT.store || LOT.vendor;
    S.lotCols = LOT;
    S.binCol = LOT.bin;

    /* Storage_Locations is the bin list, and it carries the two things that
       make a suggestion possible rather than a guess: which fibre a bin is for,
       and how much it holds. Optional — without it the screen still shows where
       things are, it just cannot propose anywhere to put them. */
    S.locations = [];
    try {
      const locT = await grist.docApi.fetchTable('Storage_Locations');
      const LOC = resolveCols(locT, 'Storage_Locations', {
        code: ['Bin_Code'], fiber: opt(['Fiber']), reserved: opt(['Reserved_For']),
        target: opt(['Target_Spools']), max: opt(['Max_Spools']),
      }, []);
      if (LOC.code) {
        (locT.id || []).forEach((id, i) => {
          const code = (columnAsArray(locT, LOC.code)[i] || '').toString().trim();
          if (!code) return;
          S.locations.push({
            code,
            fiber: fiberCode((columnAsArray(locT, LOC.fiber)[i] || '').toString().trim()),
            reservedFor: (columnAsArray(locT, LOC.reserved)[i] || '').toString().trim(),
            target: Number(columnAsArray(locT, LOC.target)[i]) || 0,
            max: Number(columnAsArray(locT, LOC.max)[i]) || 0,
          });
        });
      }
    } catch (e) {
      console.warn('Storage_Locations unavailable — no bin suggestions', e);
    }

    const recipeById = {};
    const allRecipes = [];
    (recipesT.id || []).forEach((id, i) => {
      const rec = {
        id,
        name: columnAsArray(recipesT, REC.name)[i] || `Recipe #${id}`,
        fiber: columnAsArray(recipesT, REC.fiber)[i] || '',
        method: columnAsArray(recipesT, REC.method)[i] || '',
      };
      recipeById[id] = rec;
      allRecipes.push(rec);
    });
    S.allRecipes = allRecipes.sort((a, b) => a.name.localeCompare(b.name));

    // Group lots that hold back stock, by colorway
    const byRecipe = {};
    (lotsT.id || []).forEach((id, i) => {
      const stock = (Number(columnAsArray(lotsT, LOT.store)[i]) || 0)
        + (Number(columnAsArray(lotsT, LOT.vendor)[i]) || 0)
        + (LOT.general ? (Number(columnAsArray(lotsT, LOT.general)[i]) || 0) : 0);
      if (stock <= 0) return;
      const recipeId = getRefId(columnAsArray(lotsT, LOT.recipe)[i]);
      const recipe = recipeById[recipeId] || { name: `Recipe #${recipeId}`, fiber: '', method: '' };
      (byRecipe[recipeId] = byRecipe[recipeId] || { recipeId, recipe, lots: [], total: 0 });
      byRecipe[recipeId].lots.push({
        lotId: id,
        lotNumber: columnAsArray(lotsT, LOT.lotNumber)[i] || `Lot #${id}`,
        fiber: fiberCode(columnAsArray(lotsT, LOT.fiber)[i] || recipe.fiber),
        date: LOT.date ? columnAsArray(lotsT, LOT.date)[i] : 0,
        stock,
        bin: LOT.bin ? (columnAsArray(lotsT, LOT.bin)[i] || '').toString().trim() : '',
        recipeId, recipeName: recipe.name,
      });
      byRecipe[recipeId].total += stock;
    });

    S.colors = Object.values(byRecipe)
      .map(c => { c.lots.sort((a, b) => (a.date || 0) - (b.date || 0)); return c; })
      .sort((a, b) => a.recipe.name.localeCompare(b.recipe.name));

    render();
  } catch (e) {
    console.error('Failed to load back stock:', e);
    const msg = (e && e.message ? e.message : String(e)).replace(/[<>]/g, '');
    document.getElementById('content').innerHTML = `<div class="empty-state">Failed to load.<br><span style="font-size:10px">${msg}</span></div>`;
  }
}

function onSearch(v) { S.search = v; renderList(); }
function toggle(rid) { S.open[rid] = !S.open[rid]; renderList(); }

/* The bin, where you look for it: on the lot. Without it this screen could tell
   you that you own 40 spools of something and nothing about where they are. */
function binChip(l) {
  if (!S.binCol) return '';
  if (l.bin) return `<span class="bin-chip">${esc(l.bin)}</span>`;
  return `<span class="bin-chip none">no bin</span>`;
}

function colorCard(c) {
  const isOpen = !!S.open[c.recipeId];
  const fibers = [...new Set(c.lots.map(l => l.fiber).filter(Boolean))].join(', ');
  const bins = [...new Set(c.lots.map(l => l.bin).filter(Boolean))];
  const loose = c.lots.filter(l => !l.bin).reduce((n, l) => n + l.stock, 0);
  const lotRows = c.lots.map(l => `
    <div class="lot-row${l.bin ? '' : ' nobin'}">
      <div class="lot-info">
        <div class="lot-no">${esc(l.lotNumber)} ${binChip(l)}</div>
        <div class="lot-sub">${l.fiber ? esc(l.fiber) : ''}${l.date ? (l.fiber ? ' · ' : '') + 'made ' + fmtDate(l.date) : ''}</div>
      </div>
      <div class="lot-adjust">
        <button onclick="event.stopPropagation();step(${l.lotId},-1)">−</button>
        <input type="number" min="0" id="q-${l.lotId}" value="${l.stock}" data-orig="${l.stock}"
               onclick="event.stopPropagation()" oninput="dirty(${l.lotId})">
        <button onclick="event.stopPropagation();step(${l.lotId},1)">+</button>
        <button class="save" id="save-${l.lotId}" disabled onclick="event.stopPropagation();saveLot(${l.lotId})">save</button>
      </div>
    </div>`).join('');

  return `
    <div class="color-card">
      <div class="color-head" onclick="toggle(${c.recipeId})">
        <div>
          <div class="color-name">${esc(c.recipe.name)}</div>
          <div class="color-meta">${c.lots.length} lot${c.lots.length === 1 ? '' : 's'}${fibers ? ' · ' + esc(fibers) : ''}${/hand/i.test(c.recipe.method) ? ' · hand-dye' : (/kettle/i.test(c.recipe.method) ? ' · kettle' : '')}</div>
          <div class="color-bins">${bins.length ? bins.map(b => `<span class="bin-chip">${esc(b)}</span>`).join('')
            : (S.binCol ? '' : '')}${loose ? `<span class="bin-chip none">${loose} loose</span>` : ''}</div>
        </div>
        <span class="color-total">${c.total} spool${c.total === 1 ? '' : 's'}</span>
      </div>
      ${isOpen ? `<div class="lot-rows">${lotRows}</div>` : ''}
    </div>`;
}

function renderList() {
  const q = normalize(S.search);
  const list = S.colors.filter(c => !q || normalize(c.recipe.name).includes(q)
    || c.lots.some(l => l.bin && normalize(l.bin).includes(q)));
  const total = list.reduce((s, c) => s + c.total, 0);
  const el = document.getElementById('list');
  const totalEl = document.getElementById('total');
  if (totalEl) totalEl.textContent = `${total} spool${total === 1 ? '' : 's'} in back stock · ${list.length} colorway${list.length === 1 ? '' : 's'}`;
  if (!el) return;
  el.innerHTML = list.length
    ? list.map(colorCard).join('')
    : `<div class="empty-state">${q ? 'No back stock matches that search.' : 'No back stock yet.<br>Surplus spools land here when you wind more than an order needs.'}</div>`;
}

function render() {
  const recipeOptions = S.allRecipes.map(r =>
    `<option value="${esc(r.name)}${r.fiber ? ' — ' + esc(fiberCode(r.fiber)) : ''}">`).join('');
  document.getElementById('content').innerHTML = `
    <div class="header-title">Back Stock</div>
    <div class="header-sub">What is on the shelf and where. Tap a colorway to see its lots, bins and counts.</div>
    <div class="bs-tabs">
      <button class="bs-tab ${S.view === 'stock' ? 'on' : ''}" onclick="setBsView('stock')">Stock</button>
      <button class="bs-tab ${S.view === 'putaway' ? 'on' : ''}" onclick="setBsView('putaway')">Put Away${
        unbinnedCount() ? ` <span class="bs-tab-n">${unbinnedCount()}</span>` : ''}</button>
    </div>
    <div class="add-panel">
      <div class="add-row">
        <input list="recipeList" id="add-color" class="add-color" placeholder="Colorway to add stock for..." oninput="onAddColorInput()">
        <input type="number" id="add-qty" class="add-qty" min="1" placeholder="spools" oninput="onAddColorInput()">
        <button class="add-btn" id="add-btn" onclick="addStock()" disabled>+ Add</button>
      </div>
      <datalist id="recipeList">${recipeOptions}</datalist>
      <div class="add-hint" id="add-hint">Pick any colorway — no order needed. Creates a lot in back stock.</div>
    </div>
    <input class="search-input" id="searchBox" placeholder="Search colorway or bin..." value="${esc(S.search)}" oninput="onSearch(this.value)">
    <div class="total-line" id="total"></div>
    <div id="list"></div>
  `;
  renderList();
}

function unbinnedCount() {
  return allLots().filter(l => !l.bin).length;
}
function setBsView(v) {
  S.view = v;
  if (v === 'putaway') { renderPutAway(); focusPut(); } else { render(); }
}
function focusPut() {
  setTimeout(() => { const el = document.getElementById('putBox'); if (el) { el.focus(); el.select(); } }, 30);
}
function onPutQuery(v) { S.putQuery = v; renderPutAway(); }

/* Same shape as the dye put-away: you are holding spools, not reading a list.
   Unbinned lots lead, because those are the ones in the box. */
function putCandidates() {
  const q = normalize(S.putQuery);
  return allLots()
    .filter(l => !q || normalize(l.recipeName).includes(q) || normalize(l.lotNumber).includes(q)
      || (l.fiber && normalize(l.fiber) === q))
    .sort((a, b) => {
      if (!a.bin !== !b.bin) return a.bin ? 1 : -1;
      return a.recipeName.localeCompare(b.recipeName) || (a.date || 0) - (b.date || 0);
    })
    .slice(0, 12);
}

async function putLotAway(lotId, bin) {
  if (!S.binCol) { showToast('Production_Lots has no Storage_Bin column'); return; }
  const lot = allLots().find(l => l.lotId === lotId);
  const code = (bin || '').trim();
  if (!code) { showToast('Enter a bin first'); return; }
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Production_Lots', lotId, { [S.binCol]: code }]]);
    if (lot) lot.bin = code;
    S.putDone.unshift({ name: lot ? lot.recipeName : 'Lot', lot: lot ? lot.lotNumber : '',
      spools: lot ? lot.stock : 0, bin: code });
    S.putDone = S.putDone.slice(0, 15);
    S.putQuery = '';
    showToast(`${lot ? lot.recipeName : 'Lot'} → ${code} ✓`);
    renderPutAway();
    focusPut();
  } catch (e) {
    console.error('Failed to set the bin:', e);
    showToast('Failed to save the bin — check Production_Lots');
  }
}

function renderPutAway() {
  const waiting = unbinnedCount();
  const cands = S.putQuery ? putCandidates() : allLots().filter(l => !l.bin).slice(0, 12);

  const cards = cands.map(l => {
    const sug = l.bin ? null : suggestBinForLot(l);
    return `<div class="put-card ${l.bin ? 'filed' : ''}">
      <div style="flex:1;min-width:0">
        <div class="put-name">${esc(l.recipeName)}${l.fiber ? ` <span class="put-fib">${esc(l.fiber)}</span>` : ''}</div>
        <div class="put-meta">${esc(l.lotNumber)} · ${l.stock} spool${l.stock === 1 ? '' : 's'}${
          l.date ? ' · made ' + fmtDate(l.date) : ''}</div>
        <div class="put-meta">${l.bin
          ? `already in <strong>${esc(l.bin)}</strong> — set it again only if it has moved`
          : esc(sug.note)}</div>
      </div>
      ${(l.bin || (sug && sug.bin))
        ? `<button class="put-go" onclick="putLotAway(${l.lotId}, ${esc(JSON.stringify(l.bin || sug.bin))})">
             ${l.bin ? 'Back to' : 'Put in'} ${esc(l.bin || sug.bin)}</button>`
        : ''}
      <input class="put-bin" placeholder="or a bin" list="binList"
        onchange="if (this.value.trim()) putLotAway(${l.lotId}, this.value)">
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="header-title">Back Stock</div>
    <div class="header-sub">Spools in your hand, not a list to read. Type a colorway; the field clears after each one.</div>
    <div class="bs-tabs">
      <button class="bs-tab" onclick="setBsView('stock')">Stock</button>
      <button class="bs-tab on" onclick="setBsView('putaway')">Put Away${
        waiting ? ` <span class="bs-tab-n">${waiting}</span>` : ''}</button>
    </div>
    <input class="put-search" id="putBox" value="${esc(S.putQuery)}"
      placeholder="Colorway, lot number or fibre…" oninput="onPutQuery(this.value)">
    <datalist id="binList">${S.locations.map(l =>
      `<option value="${esc(l.code)}">${esc([l.fiber, l.reservedFor].filter(Boolean).join(' · '))}</option>`).join('')}</datalist>
    <div class="total-line">${waiting
      ? `${waiting} lot${waiting === 1 ? '' : 's'} with no bin`
      : 'Every lot has a bin.'}${S.locations.length ? '' : ' · no Storage_Locations table, so nothing can be suggested'}</div>
    ${cards || `<div class="empty-state">${S.putQuery
      ? 'No back stock matches that.'
      : 'Nothing waiting. Search to move something that has already been filed.'}</div>`}
    ${S.putDone.length ? `<div class="put-done">
      <div class="put-done-head">Put away just now</div>
      ${S.putDone.map(x => `<div class="put-done-row">${esc(x.name)}
        <span class="put-done-meta">${x.spools} sp</span>
        <span class="put-done-bin">${esc(x.bin)}</span></div>`).join('')}
    </div>` : ''}
  `;
}

// Match the typed value ("Fern Green — FFN") back to a recipe.
function matchedRecipe() {
  const raw = (document.getElementById('add-color').value || '').trim();
  if (!raw) return null;
  const name = raw.split(' — ')[0].trim().toUpperCase();
  return S.allRecipes.find(r => r.name.toUpperCase() === name) || null;
}
function onAddColorInput() {
  const r = matchedRecipe();
  const hint = document.getElementById('add-hint');
  const btn = document.getElementById('add-btn');
  const qty = Number((document.getElementById('add-qty') || {}).value) || 0;
  if (r) {
    hint.textContent = `${r.name}${r.fiber ? ' · ' + fiberCode(r.fiber) : ''}${/hand/i.test(r.method) ? ' · hand-dye (own lot)' : ''}`;
    hint.style.color = 'var(--teal)';
  } else {
    hint.textContent = 'Pick any colorway — no order needed. Creates a lot in back stock.';
    hint.style.color = '#8B7D72';
  }
  if (btn) btn.disabled = !(r && qty > 0);
}

function nextLotNumber(existing) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const prefix = 'LOT-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-';
  let max = 0;
  existing.forEach(v => {
    const s = (v || '').toString();
    if (s.indexOf(prefix) === 0) { const n = parseInt(s.slice(prefix.length), 10); if (!isNaN(n) && n > max) max = n; }
  });
  return prefix + (max + 1);
}

async function addStock() {
  const r = matchedRecipe();
  const qty = Math.max(0, Number((document.getElementById('add-qty') || {}).value) || 0);
  if (!r || qty <= 0) { showToast('Pick a colorway and a spool count'); return; }
  const LOT = S.lotCols;
  const bucket = S.stockCol;
  if (!bucket) { showToast('No stock column to write to'); return; }
  try {
    // Need current lot numbers to mint the next one.
    const lotsT = await grist.docApi.fetchTable('Production_Lots');
    const lotNumber = nextLotNumber(columnAsArray(lotsT, LOT.lotNumber));
    const fields = {};
    fields[LOT.lotNumber] = lotNumber;
    if (LOT.recipe) fields[LOT.recipe] = r.id;
    fields[bucket] = qty;                       // spools land straight in back stock
    if (LOT.spoolsMade) fields[LOT.spoolsMade] = qty;
    if (LOT.yardsMade) fields[LOT.yardsMade] = qty * (fiberCode(r.fiber) === 'EN' ? 150 : 100);
    if (LOT.fiber && r.fiber) fields[LOT.fiber] = fiberCode(r.fiber);
    if (LOT.drying) fields[LOT.drying] = 'Drying - Dry Rack'; // ready, not on a rack to move
    if (LOT.date) fields[LOT.date] = Math.floor(Date.now() / 1000);
    await grist.docApi.applyUserActions([['AddRecord', 'Production_Lots', null, fields]]);
    showToast(`Added ${qty} ${r.name} → ${lotNumber} ✓`);
    await loadStock();
  } catch (e) {
    console.error('Failed to add stock:', e);
    showToast('Failed to add — check Production_Lots');
  }
}

function step(lotId, delta) {
  const el = document.getElementById(`q-${lotId}`);
  el.value = Math.max(0, (Number(el.value) || 0) + delta);
  dirty(lotId);
}
function dirty(lotId) {
  const el = document.getElementById(`q-${lotId}`);
  const btn = document.getElementById(`save-${lotId}`);
  const changed = String(Math.max(0, Number(el.value) || 0)) !== el.dataset.orig;
  if (btn) btn.disabled = !changed;
}

async function saveLot(lotId) {
  const el = document.getElementById(`q-${lotId}`);
  const val = Math.max(0, Number(el.value) || 0);
  if (!S.stockCol) { showToast('No stock column to write to'); return; }
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Production_Lots', lotId, { [S.stockCol]: val }]]);
    showToast(`Saved — ${val} spool${val === 1 ? '' : 's'} ✓`);
    // update local model so totals stay right without a full reload flicker
    for (const c of S.colors) {
      const lot = c.lots.find(l => l.lotId === lotId);
      if (lot) { c.total += (val - lot.stock); lot.stock = val; break; }
    }
    // drop lots/colors that hit zero
    S.colors.forEach(c => { c.lots = c.lots.filter(l => l.stock > 0); });
    S.colors = S.colors.filter(c => c.total > 0 && c.lots.length);
    renderList();
  } catch (e) {
    console.error('Failed to save stock:', e);
    showToast('Failed to save — check Production_Lots');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

grist.ready({ requiredAccess: 'full' });
loadStock();
</script>
