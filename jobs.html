<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="settings.js"></script>
<script src="stock-ops.js?v=20261030c"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600;700&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC; --muted: #8B7D72;
  --accent: #8B3A2A; --accent-light: #F2E8E5; --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8; --purple: #5B4A8B; --purple-light: #EEE8F7;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.45; padding: 14px; }
.top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.title { font-family: 'Libre Baskerville', serif; font-size: 21px; }
.sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.btn { font: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 14px; border-radius: 7px; border: 1px solid var(--rule); background: white; color: var(--ink); cursor: pointer; }
.btn.go { background: var(--teal); border-color: var(--teal); color: white; }
.btn.warn { color: var(--accent); }
.btn.small { font-size: 11px; padding: 5px 10px; font-weight: 500; }
.right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 16px 0 8px; display: flex; gap: 8px; align-items: center; }
h2 .n { background: var(--ink); color: white; border-radius: 10px; padding: 1px 8px; font-size: 10.5px; letter-spacing: 0; }
.job { background: white; border: 1.5px solid var(--rule); border-left: 6px solid var(--rule); border-radius: 9px; padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.job.put { border-left-color: var(--teal); }
.job.retail { border-left-color: var(--gold); }
.job.vendor { border-left-color: var(--purple); }
.job.problem { border-color: var(--accent); background: var(--accent-light); }
.job .what { flex: 1 1 260px; min-width: 0; }
.job .what b { font-size: 15px; }
.job .what .d { font-size: 12px; color: #4A403A; margin-top: 2px; }
.job .what .m { font-size: 10.5px; color: var(--muted); margin-top: 3px; font-family: 'DM Mono', monospace; }
.pill { display: inline-block; font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; padding: 3px 9px; border-radius: 6px; background: var(--paper); border: 1px solid var(--rule); white-space: nowrap; }
.pill.bin { background: var(--ink); color: white; border-color: var(--ink); }
.pill.set { background: var(--purple-light); color: var(--purple); border-color: #C9BEE3; }
.acts { display: flex; gap: 8px; }
.done { font-size: 18px; padding: 10px 18px; }
.prob { display: flex; gap: 8px; align-items: center; flex-basis: 100%; margin-top: 4px; flex-wrap: wrap; }
.prob input { padding: 8px; border: 1.5px solid var(--rule); border-radius: 6px; font: inherit; background: white; color: var(--ink); }
.prob input.n { width: 80px; font-family: 'DM Mono', monospace; text-align: center; font-size: 16px; }
.prob input.t { flex: 1 1 200px; }
.donelist div { font-size: 12px; padding: 5px 0; border-bottom: 1px solid var(--warm); display: flex; gap: 8px; color: #4A403A; }
.donelist a { margin-left: auto; color: var(--muted); cursor: pointer; text-decoration: underline; font-size: 11px; }
.empty { color: var(--muted); font-style: italic; padding: 22px; text-align: center; background: white; border: 1px dashed var(--rule); border-radius: 9px; }
.banner { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 8px 11px; font-size: 12px; margin-bottom: 12px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 9px 16px; border-radius: 6px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="top">
  <div class="title">Jobs</div>
  <div class="right">
    <button class="btn small" id="fixneg" style="display:none">⚡ Fix the ones showing negative</button>
    <button class="btn small" id="print">⬇ Print checklist</button>
    <button class="btn small" id="extra">⬇ Today's extra pots</button>
    <button class="btn small" id="reload">↻</button>
  </div>
</div>
<div class="sub">What to do right now. Tap ✓ when it's done. If something doesn't match, tap Problem and say what you found.</div>
<div id="banner"></div>
<div id="content"><div class="empty">Loading…</div></div>
<div class="toast" id="toast"></div>

<script>
/* ── Jobs ────────────────────────────────────────────────────────────────
   Reads Worker_Tasks. Jobs are created elsewhere — put-away on the Lot Desk,
   store fixes and retail moves on the Inventory Desk — and only their status
   is changed here. Grist is already updated when a job appears; ticking it
   records that the physical move happened. A Problem keeps the job in front
   of whoever corrects the counts until it is marked resolved. */
const { esc, num } = StockOps;
const S = { jobs: [], T: null, open: null, busy: false, bins: {}, binsWhy: '' };
const TYPES = [
  { key: 'Put away', cls: 'put', title: 'Put away' },
  { key: 'Retail store', cls: 'retail', title: 'Retail store' },
  { key: 'Vendor store', cls: 'vendor', title: 'Vendor store — set quantities' },
];
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); }

/* Column ids matched ignoring case and punctuation, the way every other
   widget resolves them. Reading lotsT.On_Hand_Spools directly meant one
   renamed or differently-cased column emptied the whole lookup without a
   word. */
function findCol(t, names) {
  if (!t) return null;
  const keys = Object.keys(t);
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  for (const want of names) {
    const w = norm(want);
    const hit = keys.find(k => norm(k) === w && Array.isArray(t[k]));
    if (hit) return hit;
  }
  return null;
}

function refIdOf(v) {
  if (typeof v === 'number') return v || null;
  if (Array.isArray(v)) return v[1] || null;
  if (v && typeof v === 'object' && 'rowId' in v) return v.rowId || null;
  return null;
}

/* ── Where a colourway actually is ────────────────────────────────────────
   A put-away job carries its own bin, written when the job was made. A vendor
   store job does not: Inventory Desk raises it from a SKU and a number, and
   nothing in it says where to go and count. So the bin is looked up from the
   colourway's lots — every bin holding stock of it, with how much is in each,
   newest-stocked first.

   Storage_Bin is a Reference, but older rows hold the bin CODE as text, so
   both shapes are translated (the same trap Bin Audit documents: reading it
   raw shows "32" as the bin for every correctly-filed lot). */
async function loadBins() {
  S.binsWhy = '';
  let lotsT, locT;
  try {
    [lotsT, locT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Storage_Locations'),
    ]);
  } catch (e) { S.binsWhy = 'No bins shown — could not read Production_Lots / Storage_Locations.'; return {}; }
  const codeById = {};
  const cCode = findCol(locT, ['Bin_Code']);
  if (cCode) (locT.id || []).forEach((id, i) => {
    const c = String(locT[cCode][i] || '').trim();
    if (c) codeById[id] = c;
  });
  const cRecN = findCol(lotsT, ['Recipe']), cBinN = findCol(lotsT, ['Storage_Bin']);
  const cOnN = findCol(lotsT, ['On_Hand_Spools']), cHankN = findCol(lotsT, ['Hank_Est_Spools']);
  /* Say which column is missing rather than returning an empty map and
     printing a blank Bin column — a silent absence here reads as "nothing is
     in a bin", which is never true and is impossible to tell from a bug. */
  const missing = [];
  if (!cRecN) missing.push('Production_Lots.Recipe');
  if (!cBinN) missing.push('Production_Lots.Storage_Bin');
  if (!cOnN && !cHankN) missing.push('Production_Lots.On_Hand_Spools');
  if (!cCode) missing.push('Storage_Locations.Bin_Code');
  if (missing.length) { S.binsWhy = 'No bins shown — could not read ' + missing.join(', ') + '.'; return {}; }
  const cRec = lotsT[cRecN], cBin = lotsT[cBinN];
  const cOn = cOnN ? lotsT[cOnN] : null, cHank = cHankN ? lotsT[cHankN] : null;
  const byRecipe = {};
  (lotsT.id || []).forEach((id, i) => {
    const rid = refIdOf(cRec[i]);
    if (!rid) return;
    const raw = cBin[i];
    const code = typeof raw === 'string' ? raw.trim() : (codeById[refIdOf(raw)] || '');
    if (!code) return;
    const have = (cOn ? Number(cOn[i]) || 0 : 0) + (cHank ? Number(cHank[i]) || 0 : 0);
    if (have <= 0) return;   // an empty bin is not where to go and count
    const m = byRecipe[rid] = byRecipe[rid] || {};
    m[code] = (m[code] || 0) + have;
  });
  const out = {};
  Object.keys(byRecipe).forEach(rid => {
    out[rid] = Object.entries(byRecipe[rid])
      .map(([code, qty]) => ({ code, qty }))
      .sort((a, b) => b.qty - a.qty || a.code.localeCompare(b.code, undefined, { numeric: true }));
  });
  return out;
}

async function load() {
  let t;
  try { t = await grist.docApi.fetchTable('Worker_Tasks'); }
  catch (e) { document.getElementById('content').innerHTML = `<div class="banner">No Worker_Tasks table.</div>`; return; }
  S.T = StockOps.taskCols(t);
  const T = S.T, a = (c, i) => (c && t[c]) ? t[c][i] : null;
  S.jobs = (t.id || []).map((id, i) => ({
    id, created: num(a(T.created, i)), type: a(T.type, i) || '', text: a(T.instruction, i) || '',
    qty: a(T.qty, i), form: a(T.form, i) || '', bin: a(T.bin, i) || '', sku: a(T.sku, i) || '',
    recipeId: refIdOf(a(T.recipe, i)),
    storeQty: a(T.storeQty, i), status: a(T.status, i) || 'To do', found: a(T.found, i),
    note: a(T.note, i) || '', doneAt: num(a(T.doneAt, i)),
  }));
  render();                       // jobs first — the bins are an extra, not a gate
  S.bins = await loadBins();
  render();
}

/* Which bins a job points at, as data rather than markup, so the screen pill
   and the printed checklist read from one place and cannot drift apart.
   A job's OWN bin wins: that is an instruction, "put it here", not a
   direction to where the thread already is. */
function binsFor(j) {
  if (j.bin) return { own: j.bin, list: [] };
  return { own: '', list: ((S.bins && j.recipeId) ? S.bins[j.recipeId] : null) || [] };
}

/* Two bins at most, then a count. A colourway spread across more is a
   counting job in itself, and a wall of codes helps nobody. Quantities are
   shown either way, so a short count is obvious standing at the shelf. */
function binPills(j) {
  const b = binsFor(j);
  if (b.own) return `<span class="pill bin">${esc(b.own)}</span>`;
  if (!b.list.length) return '';
  const shown = b.list.slice(0, 2)
    .map(x => `${esc(x.code)}<span style="opacity:.65"> ${esc(x.qty)}</span>`).join(' · ');
  const more = b.list.length > 2 ? ` <span style="opacity:.65">+${b.list.length - 2}</span>` : '';
  return `<span class="pill bin" title="Where ${esc(j.sku || 'this colourway')} is now">${shown}${more}</span>`;
}

/* Same thing for the printed Bin column, one bin per line and the count
   spelled out. On screen the number is dimmed and the pill has a tooltip; on
   paper there is neither, and "D3 21" beside "set to 16" is two bare numbers
   inviting someone to type the wrong one into the store. "21 in bin" cannot
   be read as an instruction. */
function binCellText(j) {
  const b = binsFor(j);
  if (b.own) return b.own;
  if (!b.list.length) return '';
  const lines = b.list.slice(0, 2).map(x => `${x.code} - ${x.qty} in bin`);
  if (b.list.length > 2) lines.push(`+${b.list.length - 2} more`);
  return lines.join('\n');
}

/* The note only counts as "already set" when it is one this screen wrote —
   a problem note must never be mistaken for work already done. */
function storeSetNote(j) {
  return (j.type === 'Vendor store' && j.status !== 'Problem'
    && j.note && j.note.indexOf(SET_NOTE) === 0) ? j.note : '';
}

function jobHtml(j) {
  const ty = TYPES.find(x => x.key === j.type) || TYPES[0];
  const problem = j.status === 'Problem';
  const head = j.text.split(':')[0];
  const rest = j.text.includes(':') ? j.text.slice(j.text.indexOf(':') + 1).trim() : '';
  return `<div class="job ${ty.cls} ${problem ? 'problem' : ''}" data-id="${j.id}">
    <div class="what"><b>${esc(head)}</b>${rest ? `<div class="d">${esc(rest)}</div>` : ''}
      ${problem ? `<div class="d" style="color:var(--accent);font-weight:600">Found ${j.found == null ? '?' : esc(j.found)}${j.qty != null ? ` of ${esc(j.qty)}` : ''}${j.note ? ' — ' + esc(j.note) : ''}</div>` : ''}
      ${storeSetNote(j) ? `<div class="d" style="color:var(--teal);font-weight:600">${esc(storeSetNote(j))} — Grist not updated, so this is still listed as open</div>` : ''}
      <div class="m">${j.created ? new Date(j.created * 1000).toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : ''}</div></div>
    ${j.qty != null && j.type !== 'Vendor store' ? `<span class="pill">${esc(j.qty)} ${esc((j.form || '').toLowerCase())}</span>` : ''}
    ${binPills(j)}
    ${j.storeQty != null && j.sku ? `<span class="pill set">${esc(j.sku)} → ${esc(j.storeQty)}</span>` : ''}
    <div class="acts">
      ${problem
        ? `<button class="btn go" data-act="resolve">Resolved</button>`
        : `${j.type === 'Vendor store' && j.sku ? `<button class="btn" data-act="vendor" style="border-color:var(--purple);color:var(--purple)">Check &amp; set</button>` : ''}<button class="btn go done" data-act="done" title="${storeSetNote(j) ? 'The store was already set - tick this off' : 'Done'}">${storeSetNote(j) ? '✓ Corrected' : '✓'}</button><button class="btn warn" data-act="problem">Problem</button>`}
    </div>
    ${S.open === j.id ? `<div class="prob">
      <span>Found</span><input class="n" type="number" min="0" id="pf" value="${j.qty != null ? esc(j.qty) : ''}">
      <input class="t" id="pn" placeholder="What's wrong? (optional)">
      <button class="btn go" data-act="send">Send</button><button class="btn small" data-act="cancel">Cancel</button></div>` : ''}
  </div>`;
}

function render() {
  const open = S.jobs.filter(j => j.status === 'To do' || j.status === 'Problem');
  const problems = open.filter(j => j.status === 'Problem');
  const todo = open.filter(j => j.status === 'To do');
  const today = StockOps.ymd(new Date());
  const doneToday = S.jobs.filter(j => (j.status === 'Done' || j.status === 'Resolved') && j.doneAt && StockOps.ymd(new Date(j.doneAt * 1000)) === today)
    .sort((a, b) => b.doneAt - a.doneAt);
  let html = '';
  if (problems.length) html += `<h2>Problems <span class="n">${problems.length}</span></h2>${problems.map(jobHtml).join('')}`;
  TYPES.forEach(ty => {
    const list = todo.filter(j => j.type === ty.key).sort((a, b) => a.created - b.created || a.id - b.id);
    if (list.length) html += `<h2>${esc(ty.title)} <span class="n">${list.length}</span></h2>${list.map(jobHtml).join('')}`;
  });
  if (!todo.length && !problems.length) html += `<div class="empty">Nothing to do right now. ✓</div>`;
  if (doneToday.length) html += `<h2>Done today <span class="n">${doneToday.length}</span></h2><div class="donelist">${doneToday.map(j =>
    `<div><span>${esc(j.text)}</span><a data-undo="${j.id}">undo</a></div>`).join('')}</div>`;
  /* A vendor store job with no Recipe reference can never find a bin, and
     that is a schema fact, not an empty shelf — say so rather than printing
     blanks. */
  if (!S.binsWhy) {
    const vend = S.jobs.filter(j => j.type === 'Vendor store' && (j.status === 'To do' || j.status === 'Problem'));
    if (vend.length && !vend.some(j => j.recipeId)) {
      S.binsWhy = 'No bins shown — these jobs carry no Recipe link' +
        (S.T && !S.T.recipe ? ' (Worker_Tasks has no Recipe column)' : '') +
        ', so there is nothing to look a bin up from.';
    }
  }
  if (!BULK.running) bulkBanner(S.binsWhy ? esc(S.binsWhy) : '');
  // Only offered when there is a batch worth batching, and never mid-run.
  const fx = document.getElementById('fixneg');
  if (fx && !BULK.running) {
    const n = bulkEligible().length;
    fx.style.display = n > 1 ? '' : 'none';
    fx.textContent = `⚡ Re-check all ${n} and tidy up`;
  }
  document.getElementById('content').innerHTML = html;
  wire();
}

function wire() {
  document.querySelectorAll('.job [data-act]').forEach(b => b.addEventListener('click', () => {
    const id = Number(b.closest('.job').dataset.id);
    const act = b.dataset.act;
    if (act === 'done') return setStatus(id, 'Done');
    if (act === 'resolve') return setStatus(id, 'Resolved');
    if (act === 'vendor') {
      const j = S.jobs.find(x => x.id === id);
      // Setting the store to the job's number IS the job, so it ticks itself off.
      return StockOps.openVendorStock(j.sku, { target: j.storeQty, targetLabel: 'job says', title: j.text.split(':')[0],
        /* Landing on the number the job asked for finishes it. Landing on a
           different one does not — but the store HAS been changed, and that
           has to be visible on the card, or the next pass through the list
           looks identical to the first and gets done again. */
        onSet: (now) => {
          if (Number(now) === Number(j.storeQty)) { setStatus(id, 'Done'); return; }
          noteStoreSet(id, now);
        },
        /* Setting the store to some OTHER number leaves the job open, which is
           right — it asked for 16 and got 13. But answering the "Grist expected
           16" question settles it: Grist and the store now agree, and the job's
           premise is gone. Without this the job came straight back wearing its
           old number, as if nothing had happened. An undo is not a resolution,
           so only the applied fix closes it. */
        onGrist: (applied) => { if (applied) setStatus(id, 'Done'); else load(); } });
    }
    if (act === 'problem') { S.open = id; render(); const f = document.getElementById('pf'); if (f) { f.focus(); f.select(); } return; }
    if (act === 'cancel') { S.open = null; return render(); }
    if (act === 'send') {
      const found = document.getElementById('pf').value;
      const note = document.getElementById('pn').value.trim();
      return setStatus(id, 'Problem', { found: found === '' ? null : num(found), note });
    }
  }));
  document.querySelectorAll('[data-undo]').forEach(a => a.addEventListener('click', () => setStatus(Number(a.dataset.undo), 'To do')));
}

/* ── Clear the vendor store's negative quantities ──────────────────────────
   A storefront that has oversold sits below zero, and on old listings that
   number is just noise — but there are 141 of them and the single Check & set
   is two taps each.

   Every SKU is re-checked live rather than trusting the "(shows -32)" in the
   job text: that figure was true when Inventory Desk raised the job and the
   store has been selling since. The set is still compare-and-set against the
   number just read, so a sale landing mid-run makes Shopify refuse that one
   rather than overwrite it — it is reported and skipped, never forced.

   Only SKUs reading below zero are touched. A job whose store figure is
   merely wrong (say 3 where 7 is wanted) is a judgement call and stays for
   the person. */
const BULK = { running: false, stop: false };

function bulkEligible() {
  return S.jobs.filter(j => (j.status === 'To do' || j.status === 'Problem')
    && j.type === 'Vendor store' && j.sku && j.storeQty != null);
}

function bulkBanner(html) {
  const el = document.getElementById('banner');
  if (el) el.innerHTML = html ? `<div class="banner">${html}</div>` : '';
}

async function bulkFixNegatives() {
  if (BULK.running || S.busy) return;
  const list = bulkEligible();
  if (!list.length) { toast('No vendor store jobs to check'); return; }
  if (!confirm(`Re-check ${list.length} vendor store SKU${list.length === 1 ? '' : 's'}?\n\n`
    + `Each is read from the store. One already showing the number its job asks for is ticked off — nothing is written. `
    + `One showing a negative is set to the number its job asks for. Anything else is left for you to judge.\n\n`
    + `You can stop it part way; whatever has been done stays done.`)) return;

  BULK.running = true; BULK.stop = false;
  const btn = document.getElementById('fixneg');
  if (btn) { btn.textContent = '■ Stop'; btn.onclick = () => { BULK.stop = true; }; }

  const fixed = [], skipped = [], failed = [], agreed = [];
  const doneIds = [];
  let i = 0;
  /* try/finally around the whole walk. Without it one throw inside the loop
     rejected this function silently: the banner froze mid-count, BULK.running
     stayed true and the button stayed on Stop for ever, with nothing on
     screen or in the UI saying anything had gone wrong. A bug in here should
     cost the run, not the widget. */
  let crashed = null;
  try {
  for (const j of list) {
    if (BULK.stop) break;
    /* Paced per ITEM, not per write. A run that only paused after a set still
       fired checks back to back, and the eighth-or-so request stopped
       reaching n8n at all - no execution logged, no response, and before the
       timeout that was the end of the run. Shopify rate-limits besides. */
    if (i) await new Promise(r => setTimeout(r, 250));
    i++;
    bulkBanner(`Checking ${i} of ${list.length} — <b>${esc(j.sku)}</b> · ${fixed.length} fixed, ${agreed.length} already right, ${skipped.length} left alone`
      + (failed.length ? `, <b>${failed.length} failed</b>` : '') + ' — press Stop to halt.');
    let chk;
    try { chk = await StockOps.vendorCheck(j.sku); }
    catch (e) { failed.push(`${j.sku}: could not reach the store`); continue; }
    if (BULK.stop) break;          // honoured as soon as a call returns
    const now = (chk && chk.available != null) ? Number(chk.available) : null;
    if (!chk || !chk.ok || now == null) { failed.push(`${j.sku}: ${(chk && chk.error) || 'no answer'}`); continue; }
    const want = Number(j.storeQty);
    if (now === want) {
      /* Already on the number it asks for. The job was raised when that was
         not true and nothing closes one just because the problem went away,
         so a run of these sits on the list looking like work. */
      agreed.push(j.sku); doneIds.push(j.id); continue;
    }
    if (!(now < 0)) { skipped.push(j.sku); continue; }
    let res;
    try { res = await StockOps.vendorSet(j.sku, want, now); }
    catch (e) { failed.push(`${j.sku}: set failed`); continue; }
    /* `ok` alone means the call came back, not that the store was written.
       The single dialog has always required `ok && set` (stock-ops.js, in
       vendorSet's caller); this path checked only `ok` and then trusted
       `res.available`, which is whatever the workflow echoed rather than a
       re-read. A Respond node returning {ok:true, available:<requested>} on a
       path that did not write would march every SKU through as fixed, tick
       every job Done, and empty the Jobs list — leaving nothing pointing back
       at stores that are all still negative. */
    if (!res || !res.ok || !res.set) {
      failed.push(`${j.sku}: ${(res && res.error) || (res && res.ok ? 'the store did not report the change as made' : 'the store refused')}`);
      continue;
    }
    /* Confirm against a fresh read rather than the echo. A set that reports
       success and lands on the wrong number is exactly the case this run
       exists to catch, so it must not be the one thing taken on trust. */
    let after = null;
    try {
      const c = await StockOps.vendorCheck(j.sku);
      // Same null-safe read this loop already uses above for `now`: a missing
      // available must not become 0, because Number(null) is 0 and finite.
      after = (c && c.ok && c.available != null) ? Number(c.available) : null;
    } catch (e) { after = null; }
    if (after == null || !Number.isFinite(after)) {
      // The set reported success; only the confirmation is missing. Say so
      // rather than calling it a failure, and leave the job open to re-run.
      fixed.push(`${j.sku} ${now} → ${want} (unconfirmed)`);
      continue;
    }
    fixed.push(`${j.sku} ${now} → ${after}`);
    // Tick the job off only when the store really landed on what it asked for.
    if (after === want) doneIds.push(j.id);
  }
  } catch (e) {
    console.error('Tidy-up stopped:', e);
    crashed = (e && e.message) || String(e);
  }

  // One write for every job ticked off, rather than a round trip each.
  if (doneIds.length && S.T) {
    const T = S.T;
    const f = (id) => ['UpdateRecord', 'Worker_Tasks', id,
      Object.assign({ [T.status]: 'Done' }, T.doneAt ? { [T.doneAt]: Math.floor(Date.now() / 1000) } : {})];
    try { await grist.docApi.applyUserActions(doneIds.map(f)); }
    catch (e) { console.error(e); failed.push(`${doneIds.length} were set on the store but their jobs could not be ticked off`); }
  }

  BULK.running = false; BULK.stop = false;
  if (btn) { btn.textContent = '⚡ Re-check all and tidy up'; btn.onclick = bulkFixNegatives; }
  bulkBanner((crashed ? `<b>Stopped early — ${esc(crashed)}</b><br>` : '')
    + `${crashed ? 'Got through' : 'Finished —'} <b>${fixed.length}</b> fixed, <b>${agreed.length}</b> already matched and ticked off, ${skipped.length} left for you`
    + (failed.length ? `, <b>${failed.length} could not be done</b>:<br>${failed.slice(0, 15).map(esc).join('<br>')}`
       + (failed.length > 15 ? `<br>…and ${failed.length - 15} more` : '') : '')
    + (fixed.length ? `<br><span style="opacity:.75">${fixed.slice(0, 8).map(esc).join(' · ')}${fixed.length > 8 ? ' · …' : ''}</span>` : ''));
  await load();
}

/* Record on the job that its store quantity was already changed, and to what.
   Written to Worker_Note, which a vendor store job otherwise never uses — it
   is the problem note, and a job being worked is not a problem. */
const SET_NOTE = 'Store set to ';
async function noteStoreSet(id, now) {
  if (!S.T || !S.T.note) return;
  const stamp = new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Worker_Tasks', id,
      { [S.T.note]: `${SET_NOTE}${now} at ${stamp}` }]]);
    await load();
  } catch (e) { console.error(e); }
}

async function setStatus(id, status, extra) {
  if (S.busy || !S.T) return;
  const T = S.T, f = { [T.status]: status };
  if (T.doneAt) f[T.doneAt] = (status === 'Done' || status === 'Resolved') ? Math.floor(Date.now() / 1000) : null;
  if (extra && T.found) f[T.found] = extra.found;
  if (extra && T.note && extra.note) f[T.note] = extra.note;
  S.busy = true;
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Worker_Tasks', id, f]]);
    S.open = null;
    toast(status === 'Done' ? 'Done ✓' : status === 'Problem' ? 'Sent — flagged for correction' : status === 'Resolved' ? 'Resolved' : 'Back on the list');
    await load();
  } catch (e) { console.error(e); toast('Could not save — try again'); }
  finally { S.busy = false; }
}

async function printChecklist() {
  const open = S.jobs.filter(j => j.status === 'To do');
  if (!open.length) { toast('Nothing to print'); return; }
  // Bins arrive a moment after the jobs. Printing in that gap would hand out
  // a sheet with an empty Bin column, so wait for them rather than race.
  if (!S.bins || !Object.keys(S.bins).length) S.bins = await loadBins();
  try {
    const JsPDF = await StockOps.pdfLib();
    const doc = new JsPDF({ unit: 'pt', format: 'letter' });
    const M = 32;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text('Jobs', M, M + 6);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(139, 125, 114);
    doc.text(StockOps.pdfSafe(new Date().toLocaleString(undefined, { weekday: 'long', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) +
      '  -  Tick when done. If it doesn\'t match, write what you found.'), M + 46, M + 6);
    doc.setTextColor(26, 22, 20);
    const body = [], meta = [];
    TYPES.forEach(ty => {
      const list = open.filter(j => j.type === ty.key);
      if (!list.length) return;
      body.push([{ content: ty.title.toUpperCase(), colSpan: 5, styles: { fillColor: [232, 223, 212], fontStyle: 'bold', fontSize: 9.5 } }]); meta.push(null);
      list.forEach(j => {
        const what = j.type === 'Vendor store' ? `Set ${j.sku} to ${j.storeQty}` : j.text;
        body.push([StockOps.pdfSafe(what),
          j.type === 'Vendor store' ? '' : `${j.qty != null ? j.qty : ''} ${(j.form || '').toLowerCase()}`.trim(),
          StockOps.pdfSafe(binCellText(j)), '', '']);
        meta.push(j);
      });
    });
    doc.autoTable({
      startY: M + 18, margin: { left: M, right: M }, theme: 'grid',
      head: [['Job', 'Qty', 'Bin', 'Found', 'Done']], body,
      styles: { font: 'helvetica', fontSize: 9.5, cellPadding: 5, lineColor: [212, 201, 188], lineWidth: 0.5, valign: 'middle', minCellHeight: 22 },
      headStyles: { fillColor: [26, 22, 20], textColor: 255, fontSize: 8.5 },
      /* Bin is wider and left-aligned now that it carries "M-B2 - 21 in bin"
         (16 chars of courier ~ 91pt). 110 leaves the Job column 286pt, well
         clear of the longest SKU line. */
      columnStyles: { 1: { cellWidth: 56, halign: 'center' }, 2: { cellWidth: 110, halign: 'left', font: 'courier', fontStyle: 'bold' },
        3: { cellWidth: 56 }, 4: { cellWidth: 40 } },
      didDrawCell: h => {
        if (h.section !== 'body' || !meta[h.row.index]) return;
        const c = h.cell; doc.setDrawColor(26, 22, 20); doc.setLineWidth(0.8);
        if (h.column.index === 4) doc.rect(c.x + c.width / 2 - 6, c.y + c.height / 2 - 6, 12, 12);
        if (h.column.index === 3) doc.rect(c.x + 6, c.y + 4, c.width - 12, c.height - 8);
      },
    });
    StockOps.downloadPdf(doc, `jobs-${StockOps.ymd(new Date())}.pdf`);
  } catch (e) { console.error(e); toast('Could not make the PDF'); }
}

document.getElementById('reload').addEventListener('click', load);
document.getElementById('fixneg').onclick = bulkFixNegatives;
document.getElementById('print').addEventListener('click', printChecklist);
document.getElementById('extra').addEventListener('click', async () => {
  try {
    const n = await StockOps.printExtraPots(grist.docApi, new Date());
    toast(n ? `${n} extra pot${n === 1 ? '' : 's'} — PDF downloaded` : 'No pots logged with + Log a pot today');
  } catch (e) { console.error(e); toast('Could not make the PDF'); }
});
// New jobs arrive from other screens; check every minute unless someone is typing a problem.
setInterval(() => { if (!S.open && !S.busy) load(); }, 60000);
try { grist.ready({ requiredAccess: 'full' }); load(); }
catch (e) { document.getElementById('content').innerHTML = '<div class="empty">Grist plugin API unavailable</div>'; }
</script>
</body>
