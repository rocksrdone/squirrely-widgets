<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Log</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --ink: #3A3028; --rule: #DDD3C7; --paper: #FDFBF7; --warm: #F6F1E9;
    --mid: #6B5E52; --muted: #9A8E82;
    --teal: #2A6B6B; --teal-light: #E4F0EF;
    --done-bg: #E8F3E8; --done-text: #2D6A2D;
    --bin-bg: #F3EAF5; --bin-text: #6B3A7A;
    --warn-bg: #FBF0E4; --warn-text: #8B5A2A;
    --accent: #A0522D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px;
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .head h1 { font-size: 15px; font-weight: 700; margin: 0; }
  .head-sub { font-size: 11px; color: var(--muted); }
  .btn {
    border: 1px solid var(--rule); background: white; color: var(--mid);
    border-radius: 5px; padding: 5px 9px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .btn:hover { border-color: var(--teal); color: var(--teal); }
  .btn.solid { background: var(--teal); border-color: var(--teal); color: white; }
  .btn.solid:hover { opacity: .9; color: white; }
  .btn.tiny { padding: 3px 7px; font-size: 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 8px 0 6px; }
  .toolbar input.search {
    flex: 1; min-width: 150px; padding: 6px 9px; border: 1px solid var(--rule);
    border-radius: 5px; font-size: 12px; background: white; color: var(--ink);
  }
  .toolbar select.cust-sel {
    padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px;
    font-size: 12px; background: white; color: var(--ink); max-width: 200px;
  }
  .filters { display: flex; gap: 3px; }
  .fbtn {
    padding: 5px 8px; font-size: 10.5px; font-weight: 700; border: 1px solid var(--rule);
    border-radius: 5px; background: white; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .fbtn.on { background: var(--teal); border-color: var(--teal); color: white; }
  .fbtn .n { opacity: .7; font-weight: 600; }

  table.grid { width: 100%; border-collapse: collapse; }
  table.grid thead th {
    text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: .05em;
    color: white; background: var(--ink); padding: 5px 7px; position: sticky; top: 0; z-index: 2;
  }
  table.grid td { padding: 3px 7px; border-bottom: 1px solid var(--rule); vertical-align: middle; font-size: 12px; }
  tr.ord-head td {
    background: var(--warm); font-size: 11px; padding: 5px 7px; border-bottom: 1px solid var(--rule);
  }
  tr.ord-head .onum { font-weight: 700; }
  tr.ord-head .ocust { color: var(--mid); }
  tr.ord-head .ometa { color: var(--muted); font-size: 10px; }
  tr.line:hover { background: var(--warm); }
  tr.line.sel { background: var(--teal-light); }
  tr.line.done td { color: var(--muted); }
  .cw { font-weight: 600; }
  .fib { font-size: 9px; font-weight: 700; color: var(--teal); background: var(--teal-light); padding: 1px 5px; border-radius: 8px; margin-left: 4px; }
  .num { font-family: 'DM Mono', ui-monospace, monospace; text-align: right; white-space: nowrap; }
  .num.bin { color: var(--bin-text); font-weight: 700; }
  .num.boxed { color: var(--done-text); font-weight: 700; }
  .num.zero { color: var(--muted); font-weight: 400; }
  .num.rem { font-weight: 700; }
  .qty-in {
    width: 52px; padding: 3px 5px; border: 1px solid var(--rule); border-radius: 4px;
    font-size: 12px; text-align: center; font-family: 'DM Mono', ui-monospace, monospace;
  }
  /* Wider than .qty-in and left-aligned: this holds a colourway name, not a count. */
  .name-in {
    flex: 1; min-width: 0; padding: 3px 6px; border: 1px solid var(--rule);
    border-radius: 4px; font-size: 12px; font-family: 'Inter', sans-serif;
  }
  .acts { display: flex; gap: 3px; justify-content: flex-end; white-space: nowrap; }
  .pill {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 6px; border-radius: 9px;
  }
  .pill.done { background: var(--done-bg); color: var(--done-text); }
  .pill.bin { background: var(--bin-bg); color: var(--bin-text); }
  .pill.open { background: var(--rule); color: var(--mid); }
  .avail {
    font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 9px;
    font-family: 'DM Mono', ui-monospace, monospace; cursor: help; white-space: nowrap;
  }
  .avail.ok { background: var(--done-bg); color: var(--done-text); }
  .avail.part { background: var(--warn-bg); color: var(--warn-text); }
  .avail.none { background: var(--rule); color: var(--muted); }
  .avail.rack { background: #E8EEF6; color: #2A5B8B; }

  tr.drawer td { background: var(--warm); padding: 8px 10px; }
  .drawer-grid { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  .dblock { background: white; border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; min-width: 210px; flex: 1; }
  .dblock h4 { margin: 0 0 5px; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .drow { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  .drow:last-child { margin-bottom: 0; }
  .drow select, .drow input {
    padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px; font-size: 11.5px;
    background: white; color: var(--ink); max-width: 100%;
  }
  .drow select { flex: 1; min-width: 0; }
  .dnote { font-size: 10px; color: var(--muted); line-height: 1.5; margin-top: 5px; }
  .dstat {
    display: flex; flex-direction: column; gap: 1px; margin-top: 6px;
    padding: 5px 7px; background: var(--paper); border-radius: 4px; font-size: 11px;
  }
  .dstat strong { font-family: 'DM Mono', ui-monospace, monospace; font-size: 13px; }
  .dstat-sub { font-size: 10px; color: var(--muted); }
  .dstat.warn { background: var(--warn-bg); color: var(--warn-text); }

  .footbar {
    position: sticky; bottom: 0; margin-top: 8px; display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; background: white; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px;
  }
  .footbar .count { font-size: 11.5px; color: var(--mid); flex: 1; }
  .footbar .count strong { color: var(--ink); }

  .log-line {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 11px; background: var(--done-bg); color: var(--done-text);
    border-radius: 5px; padding: 4px 8px; margin-bottom: 3px;
  }
  .log-line.warnish { background: var(--bin-bg); color: var(--bin-text); }
  .undo { cursor: pointer; text-decoration: underline; white-space: nowrap; font-size: 10px; }
  .banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 6px; padding: 8px 10px; font-size: 11.5px; margin-bottom: 8px; line-height: 1.5; }
  .empty-note { text-align: center; color: var(--muted); font-style: italic; padding: 20px; font-size: 12px; }
  #toast {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 8px 14px; border-radius: 5px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99; max-width: 90%;
  }
  #toast.show { opacity: 1; }

  /* Lot stock editor */
  .sk-in {
    width: 50px; padding: 3px 4px; border: 1px solid var(--rule); border-radius: 4px;
    font-size: 12px; text-align: right; font-family: 'DM Mono', ui-monospace, monospace;
  }
  .sk-in.changed { border-color: var(--teal); background: var(--teal-light); }
  td.held { font-family: 'DM Mono', ui-monospace, monospace; text-align: right; font-weight: 700; }
  td.held.bad, .sk-warn.bad { color: #A33; }
  .sk-warn { font-size: 10px; color: var(--warn-text); display: block; line-height: 1.3; }
  .sk-legend { font-size: 10.5px; color: var(--muted); line-height: 1.5; margin: 2px 0 6px; }
  .sk-legend b { color: var(--mid); }
  .lotno { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; color: var(--mid); }
</style>
</head>
<body>

<div class="head">
  <div>
    <h1>Quick Log</h1>
    <div class="head-sub">Orders: log, move or return spools. Lot stock: set any lot's numbers directly.</div>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <div class="filters">
      <button class="fbtn on" id="modeOrders">Orders</button>
      <button class="fbtn" id="modeStock">Lot stock</button>
    </div>
    <button class="btn" id="refreshBtn">&#8635; Refresh</button>
  </div>
</div>

<div id="banner"></div>
<div id="log"></div>
<div id="pane"><div class="empty-note">Loading...</div></div>
<div id="toast"></div>

<script>
/* Quick Log — Squirrely Stash
   ---------------------------
   The wind-routing widget walks the normal path: dry rack -> bin -> labels ->
   box. This one is the side door, for the odd jobs that never went through it.
   Everything here writes the same Lot_Allocations rows the rest of the system
   derives from, so nothing gets a private notion of progress.

   Four things it does that nothing else does:
     1. One-click "wound & boxed" for a whole line, straight to Packed.
     2. Bulk: tick many lines, box all their remaining in one action.
     3. Transfer spools already allocated to one line over to another line,
        possibly on a different order.
     4. Send allocated spools back to back stock on their lot.
     5. Lot stock: set a lot's Made / On hand / Hank / Vendor / Retail /
        Written off directly, with Held back worked out live.               */

/* ---------- small helpers (same contracts as the other widgets) ---------- */
function getRefId(ref) {
  if (ref == null) return null;
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1] || null;
  if (typeof ref === 'object' && ref.rowId) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
function esc(s) { return (s == null ? '' : String(s)).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${tableName}.${cands[0]}`);
  }
  return out;
}
/* applyUserActions returns {actionNum, retValues, ...}, never a bare array. */
function retValues(res) {
  if (!res) return [];
  if (Array.isArray(res)) return res;
  return Array.isArray(res.retValues) ? res.retValues : [];
}
function fmtDate(v) {
  if (!v) return '';
  const ms = typeof v === 'number' ? v * 1000 : new Date(v).getTime();
  if (!ms || isNaN(ms)) return '';
  return new Date(ms).toLocaleDateString();
}
const FIBER_NAME_TO_CODE = { 'FF Nylon': 'FFN', 'E Nylon': 'EN', 'FF Cotton': 'FFC', 'Blackwing': 'BW' };
function fiberCode(v) {
  const s = (v || '').toString().trim();
  if (!s) return '';
  if (FIBER_NAME_TO_CODE[s]) return FIBER_NAME_TO_CODE[s];
  const up = s.toUpperCase();
  return ['FFN', 'FFC', 'EN', 'BW'].includes(up) ? up : s;
}
function yardsPerSpool(fiber) { return fiberCode(fiber) === 'EN' ? 150 : 100; }

/* ── Stock model v2 (2026-10-05) ──────────────────────────────────────────
   Production_Lots stock columns:
     On_Hand_Spools        typed    wound spools physically here, counted
     Hank_Est_Spools       typed    thread still in hank, estimated in spools
     Vendor_Stock_Spools   typed    listed on the vendor store (wound or hank)
     Store_Stock_Spools    typed    listed on retail (wound only)
     General_Stock_Spools  FORMULA  On_Hand + Hank − Vendor − Store = held back
   Total stock is still General + Vendor + Store, so code that only READS
   stock is unchanged. General can no longer be written: every stock write
   goes through stockMove()/stockSet(), which turn the old idea "change
   General/Vendor/Store by n" into the typed columns it means physically:
     +n to general  → On_Hand +n
     +n to vendor   → On_Hand +n, Vendor +n
     +n to store    → On_Hand +n, Store +n
     −n from any    → vendor/store listing −n, and n spools leave the shelf:
                      wound first, then hank (retail never holds hank). A hank
                      that leaves had to be wound, so Spools_Made rises by it.
   The same block is pasted into every widget that writes stock. Change them
   together. */
function stock2Cols(lotsT) {
  const keys = Object.keys(lotsT || {});
  const f = name => keys.find(k => k.toLowerCase() === name.toLowerCase()) || null;
  return {
    onHand: f('On_Hand_Spools'), hank: f('Hank_Est_Spools'),
    vendor: f('Vendor_Stock_Spools'), store: f('Store_Stock_Spools'),
    general: f('General_Stock_Spools'), made: f('Spools_Made'),
  };
}
function stock2Row(lotsT, C, i) {
  const n = c => (c && Array.isArray(lotsT[c])) ? (Number(lotsT[c][i]) || 0) : 0;
  return { onHand: n(C.onHand), hank: n(C.hank), vendor: n(C.vendor), store: n(C.store), made: n(C.made) };
}
function stock2Held(row) { return row.onHand + row.hank - row.vendor - row.store; }
const STOCK2_KEYS = ['onHand', 'hank', 'vendor', 'store', 'made'];
function stock2Diff(before, row, C) {
  const fields = {}, inverse = {};
  STOCK2_KEYS.forEach(k => {
    if (row[k] !== before[k] && C[k]) { fields[C[k]] = row[k]; inverse[C[k]] = before[k]; }
  });
  return { fields, inverse };
}
/* Mutates `row` so several moves on one lot accumulate correctly. */
function stockMove(row, C, where, delta) {
  const before = Object.assign({}, row);
  let short = 0;
  if (delta > 0) {
    row.onHand += delta;
    if (where === 'vendor') row.vendor += delta;
    else if (where === 'store') row.store += delta;
  } else if (delta < 0) {
    let n = -delta;
    if (where === 'vendor') row.vendor = Math.max(0, row.vendor - n);
    else if (where === 'store') row.store = Math.max(0, row.store - n);
    const w = Math.min(n, row.onHand); row.onHand -= w; n -= w;
    if (where !== 'store' && C.hank) {
      const h = Math.min(n, row.hank); row.hank -= h; row.made += h; n -= h;
    }
    short = n;
  }
  return Object.assign(stock2Diff(before, row, C), { short });
}
/* Absolute values, for editors. Only keys present in `vals` change. */
function stockSet(row, C, vals) {
  const before = Object.assign({}, row);
  STOCK2_KEYS.forEach(k => { if (vals[k] != null) row[k] = Math.max(0, Number(vals[k]) || 0); });
  return stock2Diff(before, row, C);
}
/* Shown when a write is refused because the switch-over hasn't happened. */
const STOCK2_NOT_READY =
  'Stock columns not switched over yet — On_Hand_Spools must be a data column and General a formula.';

/* Same three-bucket split order-overview uses. "Wound - Needs Labels" contains
   the word "Wound", so the needs-labels test must run before the catch-all. */
const BIN_STATUS = 'Wound - Needs Labels';
const PACKED_CANDIDATES = ['Packed', 'Packaged - Shipped', 'Wound'];
function allocBucket(status) {
  const s = (status == null ? '' : status).toString();
  if (/unwound|in bin|to wind/i.test(s)) return 'pending';
  if (/needs? labels?|awaiting labels?|unlabel/i.test(s)) return 'wound';
  return 'boxed';
}

let S = {
  cols: null, packedStatus: 'Packed',
  orders: {}, recipes: {}, lots: [], lotsByRecipe: {}, availByRecipe: {},
  lines: [], allocs: [],
  search: '', filter: 'open', customer: '',
  picked: {},          // lineId -> true
  openDrawer: null,    // lineId whose action drawer is open
  qty: {},             // lineId -> qty override typed into the row
  lotChoice: {},       // lineId -> lotId chosen in the drawer
  linkChoice: {},      // lineId -> recipeId chosen in the "link a colourway" picker
  nameDraft: {},       // lineId -> the one-time customer name being typed
  xferTarget: {}, xferQty: {}, stockQty: {},
  log: [],             // [{text, cls, inverse:[actions]}]
  ready: false,
  mode: 'orders',      // 'orders' | 'stock'
  stockSearch: '', stockAll: false,
  stockDraft: {},      // lotId -> { made|onHand|hank|vendor|store|broken: typed value }
};

/* ---------- load ---------- */
async function loadAll() {
  document.getElementById('pane').innerHTML = '<div class="empty-note">Loading...</div>';
  let lotsT, recT, allocT, wolT, woT, custT;
  try {
    [lotsT, recT, allocT, wolT, woT, custT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Lot_Allocations'),
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Customers'),
    ]);
  } catch (e) {
    console.error('Quick Log: tables unavailable', e);
    document.getElementById('pane').innerHTML =
      `<div class="empty-note">Couldn't read the document. Set this widget's access to <strong>Full document</strong>.</div>`;
    return;
  }

  const missing = [];
  const opt = cands => ({ cands, required: false });
  const LOT = resolveCols(lotsT, 'Production_Lots', {
    lotNumber: ['Lot_Number'], recipe: ['Recipe'],
    spoolsMade: opt(['Spools_Made']), yardsMade: opt(['Total_Yards_Made']),
    drying: opt(['Drying_Status']), fiber: opt(['Fiber']),
    storeStock: opt(['Store_Stock_Spools']), vendorStock: opt(['Vendor_Stock_Spools']),
    generalStock: opt(['General_Stock_Spools']),
    broken: opt(['Broken_Spools', 'Broken_Spool_Count']), date: opt(['Date_Dyed']),
  }, missing);
  const REC = resolveCols(recT, 'Recipes', {
    name: ['Recipe_Name'], fiber: opt(['Fiber_Type']), sku: opt(['SKU_Base']),
  }, missing);
  const ALLOC = resolveCols(allocT, 'Lot_Allocations', {
    lot: ['Lot'], qty: ['Qty_Spools'], status: ['Status'],
    customer: opt(['Customer']), line: ['Work_Order_Line'],
    labelsApplied: opt(['Labels_Applied', 'Label_Applied', 'Labels_Used']),
  }, missing);
  const WOL = resolveCols(wolT, 'Work_Order_Lines', {
    workOrder: ['Work_Order'], qtyNeeded: ['Qty_Needed'],
    recipe: opt(['Recipe']), sku: opt(['SKU']),
    displayName: opt(['Display_Name', 'Label_Name', 'Custom_Name']),
  }, missing);
  const WO = resolveCols(woT, 'Work_Orders', {
    status: ['Status'], orderNumber: opt(['Order_Number']),
    customerName: opt(['Customer_Name']), customer: opt(['Customer']),
    dueDate: opt(['Due_Date']),
  }, missing);
  const CUST = resolveCols(custT, 'Customers', { name: opt(['Customer_Name']) }, missing);

  if (missing.length) {
    document.getElementById('pane').innerHTML =
      `<div class="empty-note">Can't load — missing columns:<br><br><strong>${[...new Set(missing)].map(esc).join('<br>')}</strong></div>`;
    return;
  }
  S.cols = { LOT, REC, ALLOC, WOL, WO, CUST };
  /* Returned and drawn spools are held-back stock: General, which is now a
     formula. stockMove() writes On_Hand instead (see the stock model block). */
  S.stock2 = stock2Cols(lotsT);
  S.stockCol = S.stock2.onHand;           // truthy = stock can be written
  S.stockColLabel = 'Back stock';

  // Recipes
  S.recipes = {};
  const recipeIdBySku = {};
  (recT.id || []).forEach((id, i) => {
    S.recipes[id] = {
      id, name: columnAsArray(recT, REC.name)[i] || `Recipe #${id}`,
      fiber: columnAsArray(recT, REC.fiber)[i] || '',
      sku: normalize(columnAsArray(recT, REC.sku)[i] || ''),
    };
    if (S.recipes[id].sku) recipeIdBySku[S.recipes[id].sku] = id;
  });

  // Customers, for orders whose Customer ref is empty but the name matches.
  const custIdByName = {};
  (custT.id || []).forEach((id, i) => {
    const n = normalize(columnAsArray(custT, CUST.name)[i]);
    if (n) custIdByName[n] = id;
  });

  // Work orders
  S.orders = {};
  (woT.id || []).forEach((id, i) => {
    const name = columnAsArray(woT, WO.customerName)[i] || '';
    S.orders[id] = {
      id, status: (columnAsArray(woT, WO.status)[i] || '').toString(),
      num: columnAsArray(woT, WO.orderNumber)[i] || '',
      custName: name,
      custId: getRefId(columnAsArray(woT, WO.customer)[i]) || custIdByName[normalize(name)] || null,
      due: WO.dueDate ? columnAsArray(woT, WO.dueDate)[i] : null,
    };
  });

  // Allocations
  S.allocs = (allocT.id || []).map((id, i) => ({
    id,
    lotId: getRefId(columnAsArray(allocT, ALLOC.lot)[i]),
    lineId: getRefId(columnAsArray(allocT, ALLOC.line)[i]),
    qty: Number(columnAsArray(allocT, ALLOC.qty)[i]) || 0,
    status: (columnAsArray(allocT, ALLOC.status)[i] || '').toString(),
    // Whether the label widget has already deducted these from label stock.
    applied: ALLOC.labelsApplied ? !!columnAsArray(allocT, ALLOC.labelsApplied)[i] : false,
  }));
  const statusValues = new Set(S.allocs.map(a => a.status).filter(Boolean));
  S.packedStatus = PACKED_CANDIDATES.find(c => statusValues.has(c)) || 'Packed';

  // Lots, with free-spool counts so the drawer can suggest one.
  const allocByLot = {};
  S.allocs.forEach(a => { if (a.lotId) allocByLot[a.lotId] = (allocByLot[a.lotId] || 0) + a.qty; });
  const num = (col, i) => col ? (Number(columnAsArray(lotsT, col)[i]) || 0) : 0;
  S.lots = []; S.lotsByRecipe = {};
  (lotsT.id || []).forEach((id, i) => {
    const rid = getRefId(columnAsArray(lotsT, LOT.recipe)[i]);
    if (!rid) return;
    const rec = S.recipes[rid] || { fiber: '' };
    const row = stock2Row(lotsT, S.stock2, i);
    let total = num(LOT.spoolsMade, i);
    // A lot in hank is tracked by Hank_Est, not by its dyed yardage — falling
    // back to yards here would count the same thread twice.
    if (!total && !row.hank && LOT.yardsMade) total = Math.round(num(LOT.yardsMade, i) / yardsPerSpool(columnAsArray(lotsT, LOT.fiber)[i] || rec.fiber));
    const stock = num(LOT.storeStock, i) + num(LOT.vendorStock, i) + num(LOT.generalStock, i);
    /* Lot arithmetic counts WOUND spools only. A hank was never in Spools_Made,
       so subtracting it here would make the lot look over-drawn and cancel a
       sibling lot's real surplus in the per-recipe sum. */
    const woundStock = stock - row.hank;
    const lot = {
      id, recipeId: rid,
      number: columnAsArray(lotsT, LOT.lotNumber)[i] || `Lot #${id}`,
      date: LOT.date ? columnAsArray(lotsT, LOT.date)[i] : 0,
      total, stock, row,
      // `free` is clamped because it describes ONE bag and a bag can't hold a
      // negative. `freeSigned` is what gets summed per recipe — see availByRecipe.
      free: Math.max(0, total - (allocByLot[id] || 0) - woundStock - num(LOT.broken, i)),
      freeSigned: total - (allocByLot[id] || 0) - woundStock - num(LOT.broken, i),
      // Held back (General): what a draw from back stock may take.
      stockVal: S.stock2.general ? (Number(columnAsArray(lotsT, S.stock2.general)[i]) || 0) : 0,
      broken: num(LOT.broken, i),
      alloc: allocByLot[id] || 0,
      fiber: fiberCode(columnAsArray(lotsT, LOT.fiber)[i] || rec.fiber),
    };
    S.lots.push(lot);
    (S.lotsByRecipe[rid] = S.lotsByRecipe[rid] || []).push(lot);
  });
  Object.values(S.lotsByRecipe).forEach(arr => arr.sort((a, b) => (a.date || 0) - (b.date || 0)));

  /* Per-colorway rollup. `wound` is the number you actually asked about: spools
     already on a spool, in back stock, spoken for by nobody. `unwound` is dyed
     thread on the racks that isn't allocated yet — real, but it needs winding
     before it can go in a box, so it doesn't belong in the same figure. */
  S.availByRecipe = {};
  Object.entries(S.lotsByRecipe).forEach(([rid, arr]) => {
    S.availByRecipe[rid] = {
      wound: arr.reduce((a, x) => a + x.stock - x.row.hank, 0),
      hank: arr.reduce((a, x) => a + x.row.hank, 0),
      // Signed sum, clamped once: an over-allocated lot must cancel a sibling's
      // surplus rather than be dropped, which would invent thread that isn't there.
      unwound: Math.max(0, arr.reduce((a, x) => a + x.freeSigned, 0)),
      lots: arr.length,
    };
  });

  // Lines. Every line on a non-cancelled order, whatever its progress — this
  // widget is also how you fix something already logged.
  S.lines = [];
  (wolT.id || []).forEach((id, i) => {
    const woId = getRefId(columnAsArray(wolT, WOL.workOrder)[i]);
    const o = S.orders[woId];
    if (!o) return;
    if (/cancel/i.test(o.status)) return;
    const sku = normalize(columnAsArray(wolT, WOL.sku)[i] || '');
    const recipeId = getRefId(columnAsArray(wolT, WOL.recipe)[i]) || recipeIdBySku[sku] || null;
    const rec = S.recipes[recipeId] || null;
    const mine = S.allocs.filter(a => a.lineId === id);
    let inBin = 0, boxed = 0;
    mine.forEach(a => {
      const b = allocBucket(a.status);
      if (b === 'wound') inBin += a.qty;
      else if (b === 'boxed') boxed += a.qty;
    });
    const needed = Number(columnAsArray(wolT, WOL.qtyNeeded)[i]) || 0;
    S.lines.push({
      id, woId, order: o, recipeId,
      // Kept so the link picker can show WHICH sku failed to match a recipe.
      // Read-only here — nothing in this widget ever writes it back.
      sku,
      // The one-time name this customer asked for on this order, if any.
      displayName: WOL.displayName
        ? (columnAsArray(wolT, WOL.displayName)[i] || '').toString().trim() : '',
      name: rec ? rec.name : (sku ? `SKU ${sku}` : '(no recipe on this line)'),
      fiber: rec ? fiberCode(rec.fiber) : '',
      needed, inBin, boxed,
      remaining: Math.max(0, needed - inBin - boxed),
      allocs: mine,
    });
  });

  S.ready = true;
  render();
}

/* ---------- derived ---------- */
function lineById(id) { return S.lines.find(l => l.id === id) || null; }
function custKey(l) { return normalize(l.order.custName) || '(NO CUSTOMER)'; }
function matchLine(l) {
  const q = normalize(S.search);
  if (!q) return true;
  return normalize(`${l.name} ${l.order.num} ${l.order.custName} ${l.fiber}`).includes(q);
}
function matchCustomer(l) { return !S.customer || custKey(l) === S.customer; }
function passesFilter(l) {
  if (S.filter === 'open') return l.remaining > 0 && !/complete|closed|shipped/i.test(l.order.status);
  if (S.filter === 'bin') return l.inBin > 0;
  if (S.filter === 'done') return l.remaining === 0 && l.needed > 0;
  return true;
}
function visibleLines() { return S.lines.filter(l => matchLine(l) && matchCustomer(l) && passesFilter(l)); }
/* The dropdown deliberately ignores its own selection, so switching customer
   never empties the list you'd switch from. */
function customerOptions() {
  const map = new Map();
  S.lines.filter(l => matchLine(l) && passesFilter(l)).forEach(l => {
    const k = custKey(l);
    if (!map.has(k)) map.set(k, { key: k, label: l.order.custName || '(no customer)', n: 0 });
    map.get(k).n++;
  });
  return [...map.values()].sort((a, b) => a.label.localeCompare(b.label));
}
function pickedLines() { return S.lines.filter(l => S.picked[l.id]); }

/* Default lot for a one-click log: oldest lot of that colorway with free
   spools, else the oldest lot at all, else nothing. */
function defaultLotFor(line) {
  if (S.lotChoice[line.id] !== undefined) {
    return S.lots.find(x => x.id === S.lotChoice[line.id]) || null;
  }
  const lots = S.lotsByRecipe[line.recipeId] || [];
  return lots.find(x => x.free > 0) || lots[0] || null;
}
/* The row's quantity box means "how many spools this action covers". It
   defaults to everything not yet boxed — spools still to wind PLUS spools
   already sitting in the bin, since boxing has to be able to reach those.
   Bagging is capped separately: you can't bag what's already bagged. */
function openQty(line) { return Math.max(0, (Number(line.remaining) || 0) + (Number(line.inBin) || 0)); }
function rowQty(line) {
  const v = S.qty[line.id];
  if (v === undefined || v === '') return openQty(line);
  return Math.max(0, Number(v) || 0);
}
function binQty(line) { return Math.min(rowQty(line), Number(line.remaining) || 0); }

/* ---------- render ---------- */
function render() {
  if (!S.ready) return;
  renderLog();
  document.getElementById('modeOrders').classList.toggle('on', S.mode === 'orders');
  document.getElementById('modeStock').classList.toggle('on', S.mode === 'stock');
  if (S.mode === 'stock') { renderStock(); return; }

  const lines = visibleLines();
  const counts = {
    open: S.lines.filter(l => l.remaining > 0 && !/complete|closed|shipped/i.test(l.order.status)).length,
    bin: S.lines.filter(l => l.inBin > 0).length,
    done: S.lines.filter(l => l.remaining === 0 && l.needed > 0).length,
  };
  const fbtn = (v, label, n) =>
    `<button class="fbtn ${S.filter === v ? 'on' : ''}" data-filter="${v}">${label}${
      n != null ? ` <span class="n">${n}</span>` : ''}</button>`;

  const custOpts = customerOptions();
  const stillThere = !S.customer || custOpts.some(c => c.key === S.customer);
  const toolbar = `<div class="toolbar">
    <input class="search" id="search" placeholder="Search colorway, order, customer..." value="${esc(S.search)}">
    <select class="cust-sel" id="custSel">
      <option value="">All customers${custOpts.length ? ` (${custOpts.length})` : ''}</option>
      ${custOpts.map(c => `<option value="${esc(c.key)}" ${c.key === S.customer ? 'selected' : ''}>${
        esc(c.label)} — ${c.n}</option>`).join('')}
      ${stillThere ? '' : `<option value="${esc(S.customer)}" selected>${esc(S.customer)} — 0</option>`}
    </select>
    <div class="filters">${fbtn('open', 'Open', counts.open)}${fbtn('bin', 'In bin', counts.bin)}${
      fbtn('done', 'Done', counts.done)}${fbtn('all', 'All')}</div>
  </div>`;

  let body;
  if (!lines.length) {
    body = `<div class="empty-note">Nothing matches this filter.</div>`;
  } else {
    // Grouped by order, because that's how the bins sit on the shelf.
    const byOrder = new Map();
    lines.forEach(l => {
      if (!byOrder.has(l.woId)) byOrder.set(l.woId, []);
      byOrder.get(l.woId).push(l);
    });
    const blocks = [...byOrder.entries()].map(([woId, ls]) => {
      const o = S.orders[woId];
      const allOn = ls.every(l => S.picked[l.id]);
      // Everything not yet boxed, so "Box all" reaches spools sitting in the bin.
      const rem = ls.reduce((a, l) => a + openQty(l), 0);
      const inBin = ls.reduce((a, l) => a + l.inBin, 0);
      return `<tr class="ord-head">
          <td><input type="checkbox" ${allOn ? 'checked' : ''} data-pickorder="${woId}"></td>
          <td colspan="6">
            <span class="onum">${esc(o.num || '—')}</span>
            <span class="ocust">${esc(o.custName || '')}</span>
            <span class="ometa">&middot; ${ls.length} line${ls.length === 1 ? '' : 's'}${
              rem ? ` &middot; ${rem} to go${inBin ? `, ${inBin} in the bin` : ''}` : ' &middot; complete'}${
              o.due ? ` &middot; due ${esc(fmtDate(o.due))}` : ''}</span>
          </td>
          <td class="acts"><button class="btn tiny" data-boxorder="${woId}" ${rem ? '' : 'disabled'}>Box all ${rem || ''}</button></td>
        </tr>` + ls.map(lineRowHtml).join('');
    }).join('');

    body = `<table class="grid">
      <thead><tr>
        <th style="width:22px"></th><th>Colorway</th>
        <th class="num" style="width:44px">Need</th>
        <th class="num" style="width:44px">Bin</th>
        <th class="num" style="width:44px">Boxed</th>
        <th class="num" style="width:44px">Left</th>
        <th style="width:60px"></th>
        <th style="width:150px"></th>
      </tr></thead>
      <tbody>${blocks}</tbody>
    </table>`;
  }

  const picked = pickedLines();
  const pickedRem = picked.reduce((a, l) => a + rowQty(l), 0);
  const foot = `<div class="footbar">
    <div class="count">${picked.length
      ? `<strong>${picked.length}</strong> line${picked.length === 1 ? '' : 's'} picked &middot; <strong>${pickedRem}</strong> spools`
      : 'Tick lines to act on several at once.'}</div>
    <button class="btn" id="pickShown">Pick all shown</button>
    <button class="btn" id="pickNone" ${picked.length ? '' : 'disabled'}>Clear</button>
    <button class="btn" id="bulkBin" ${pickedRem ? '' : 'disabled'}>Into bins</button>
    <button class="btn solid" id="bulkBox" ${pickedRem ? '' : 'disabled'}>Wound &amp; boxed &#10003;</button>
  </div>`;

  document.getElementById('pane').innerHTML = toolbar + body + foot;
  bind();
}

function availFor(line) {
  return S.availByRecipe[line.recipeId] || { wound: 0, unwound: 0, lots: 0 };
}
/* Two different numbers, and hiding either one misleads:
     wound   — on a spool, in back stock, assigned to nobody. Boxable now.
     unwound — dyed and on the rack, unallocated. Needs winding first.
   A colorway with 0 wound and 13 on the dry rack is NOT empty, so the chip
   shows both rather than leading with a zero. */
function availChipHtml(l) {
  const a = availFor(l);
  if (!l.recipeId || !a.lots) return '';
  if (!a.wound && !a.unwound && !a.hank) return '';
  const parts = [];
  if (a.hank) parts.push(`<span class="avail rack"
    title="${esc('about ' + a.hank + ' spools still in hank — wind before boxing')}">~${a.hank} hank</span>`);
  if (a.wound) parts.push(`<span class="avail ${l.remaining && a.wound < l.remaining ? 'part' : 'ok'}"
    title="${esc(a.wound + ' wound, in back stock, assigned to nobody')}">${a.wound} wound</span>`);
  if (a.unwound) parts.push(`<span class="avail rack"
    title="${esc(a.unwound + ' dyed and unallocated, on the racks — needs winding before it can go in a box')}">${a.unwound} to wind</span>`);
  return parts.join(' ');
}

function lineRowHtml(l) {
  const pill = l.needed === 0 ? `<span class="pill open">no qty</span>`
    : l.remaining === 0 ? `<span class="pill done">done</span>`
    : l.inBin > 0 ? `<span class="pill bin">in bin</span>`
    : `<span class="pill open">open</span>`;
  const q = rowQty(l);
  const bq = binQty(l);
  const row = `<tr class="line ${S.picked[l.id] ? 'sel' : ''} ${l.remaining === 0 && !l.inBin ? 'done' : ''}" data-line="${l.id}">
    <td><input type="checkbox" ${S.picked[l.id] ? 'checked' : ''} data-pick="${l.id}"></td>
    <td><span class="cw">${esc(l.name)}</span>${l.fiber ? `<span class="fib">${esc(l.fiber)}</span>` : ''} ${availChipHtml(l)} ${pill}</td>
    <td class="num">${l.needed}</td>
    <td class="num bin ${l.inBin ? '' : 'zero'}">${l.inBin || '—'}</td>
    <td class="num boxed ${l.boxed ? '' : 'zero'}">${l.boxed || '—'}</td>
    <td class="num rem ${l.remaining ? '' : 'zero'}">${l.remaining || '—'}</td>
    <td><input class="qty-in" data-qty="${l.id}" value="${esc(S.qty[l.id] !== undefined ? S.qty[l.id] : openQty(l))}"></td>
    <td class="acts">
      <button class="btn tiny" data-bin="${l.id}" ${bq ? '' : 'disabled'}
        title="${l.remaining ? `Wind and bag ${bq} into the bin — labels still to do` : 'Nothing left to wind on this line'}">Bag ${bq || ''}</button>
      <button class="btn tiny solid" data-box="${l.id}" ${q ? '' : 'disabled'}
        title="${l.inBin ? `Box ${q} — ${Math.min(q, l.inBin)} of them come out of the bin` : `Wind, label and box ${q} in one go`}">Box ${q || ''} &#10003;</button>
      <button class="btn tiny" data-drawer="${l.id}">${S.openDrawer === l.id ? '&#9650;' : '&#8943;'}</button>
    </td>
  </tr>`;
  return row + (S.openDrawer === l.id ? drawerHtml(l) : '');
}

/* A line with no recipe is a dead end: no lots can be found for it, so Bin and
   Box build zero actions and only toast. It happens whenever the SKU on the
   order line doesn't exactly match a recipe's SKU_Base — a wrong suffix that
   was corrected in Shopify AFTER the order was placed (a Shopify line item
   keeps the SKU it was created with), or a custom draft line, which has no
   SKU at all.

   This block replaces the useless lot picker in that state and writes the
   line's Recipe reference.

   IT DELIBERATELY NEVER WRITES THE SKU, and that is not a simplification —
   "SS - Reprocess Open Orders" matches Grist lines to Shopify lines BY SKU.
   Give this line a SKU that the Shopify order doesn't carry and the next sync
   run finds no match for it, zeroes it to Qty_Needed 0 / Queue_Status
   Cancelled, and then re-adds the original bad-SKU line from Shopify. The
   repair would undo itself and duplicate the row. Writing the Recipe alone is
   invisible to that workflow: its quantity pass only ever patches Qty_Needed
   and Queue_Status, so the link survives every future run.

   The same trap applies in reverse to a blank-SKU custom line — the sync
   explicitly leaves those alone precisely BECAUSE they have no SKU, so
   putting one on would hand it to the cancel path. */
function linkBlockHtml(l) {
  const canWrite = !!(S.cols && S.cols.WOL && S.cols.WOL.recipe);
  const chosen = S.linkChoice[l.id];
  const opts = Object.values(S.recipes)
    .sort((a, b) => String(a.name).localeCompare(String(b.name)))
    .map(r => `<option value="${r.id}" ${chosen === r.id ? 'selected' : ''}>${
      esc(r.name)}${r.fiber ? ' — ' + esc(r.fiber) : ''}</option>`).join('');

  if (!canWrite) {
    return `<div class="dblock">
      <h4>Not linked to a colorway</h4>
      <div class="dnote">This line has no Recipe, so no lots can be found and nothing can be
        binned or boxed against it. There is no <strong>Recipe</strong> column on
        Work_Order_Lines to write, so it has to be fixed in Grist directly.</div>
    </div>`;
  }

  return `<div class="dblock">
    <h4>Link this line to a colorway</h4>
    <div class="drow">
      <select data-linksel="${l.id}">
        <option value="">choose a colorway...</option>
        ${opts}
      </select>
    </div>
    <div class="drow">
      <button class="btn tiny solid" data-dolink="${l.id}" ${chosen ? '' : 'disabled'}>Link</button>
      <span style="font-size:11px;color:var(--muted);">SKU <span class="mono">${esc(l.sku || '(none)')}</span> matched no recipe</span>
    </div>
    <div class="dnote">Nothing on this line can be binned or boxed until it knows its colorway.
      This sets the line's <strong>Recipe</strong> only — the SKU is left exactly as it is, because
      the Shopify sync matches on SKU and would cancel this line if it stopped matching.</div>
  </div>`;
}

/* A one-time name the customer asked for on this order only.

   It lives on the LINE, never on the recipe. The colourway is permanent and
   keeps its own name and history; what a customer calls it is per-order and
   gets reused — the same customer may want that name on a different colour
   next year, and two customers may want the same name on different colours.
   Putting it here means none of that collides, and the recipe stays one row
   describing one colour.

   Blank means "no override" — the label prints the recipe name, exactly as it
   always has. */
function nameBlockHtml(l) {
  const canWrite = !!(S.cols && S.cols.WOL && S.cols.WOL.displayName);
  const draft = S.nameDraft[l.id] !== undefined ? S.nameDraft[l.id] : (l.displayName || '');
  const recipeName = l.recipeId && S.recipes[l.recipeId] ? S.recipes[l.recipeId].name : '';
  const dirty = draft.trim() !== (l.displayName || '');

  if (!canWrite) {
    return `<div class="dblock">
      <h4>Name on the label</h4>
      <div class="dnote">Labels print <strong>${esc(recipeName || 'the recipe name')}</strong>.
        To let a customer ask for a one-time name, add a <strong>Display_Name</strong>
        column to Work_Order_Lines.</div>
    </div>`;
  }

  return `<div class="dblock">
    <h4>Name on the label</h4>
    <div class="drow">
      <input class="name-in" data-namein="${l.id}" value="${esc(draft)}"
        placeholder="${esc(recipeName || 'colorway name')}">
      <button class="btn tiny solid" data-doname="${l.id}" ${dirty ? '' : 'disabled'}>Save</button>
      ${l.displayName ? `<button class="btn tiny" data-clearname="${l.id}">Clear</button>` : ''}
    </div>
    <div class="dnote">${l.displayName
      ? `Labels for this line print <strong>${esc(l.displayName)}</strong> instead of
         <strong>${esc(recipeName || 'the recipe name')}</strong>. The recipe is untouched.`
      : `Leave blank and labels print <strong>${esc(recipeName || 'the recipe name')}</strong>.
         Set it only when this customer asked for a one-time name on this order.`}</div>
  </div>`;
}

function drawerHtml(l) {
  const lots = S.lotsByRecipe[l.recipeId] || [];
  const a = availFor(l);
  const chosen = defaultLotFor(l);
  const lotOpts = lots.length
    ? lots.map(x => `<option value="${x.id}" ${chosen && chosen.id === x.id ? 'selected' : ''}>${
        esc(x.number)} — ${x.free} free, ${x.stock} stock</option>`).join('')
    : `<option value="">no lots for this colorway</option>`;

  // How many other open lines want this same colorway — the "avail" chip is a
  // shared pool, so two lines can both look coverable and only one can be.
  const rivals = l.recipeId
    ? S.lines.filter(x => x.id !== l.id && x.recipeId === l.recipeId && x.remaining > 0)
    : [];
  const rivalNeed = rivals.reduce((s, x) => s + x.remaining, 0);

  // Allocated spools on this line, the pool that transfers and returns draw from.
  const allocated = l.inBin + l.boxed;
  const targets = S.lines
    .filter(x => x.id !== l.id && l.recipeId && x.recipeId === l.recipeId)
    .sort((a, b) => String(a.order.custName).localeCompare(String(b.order.custName)));
  const targetOpts = targets.length
    ? `<option value="">choose a line...</option>` + targets.map(x =>
        `<option value="${x.id}">${esc(x.order.custName || x.order.num)} — ${esc(x.order.num)} (${x.remaining} left)</option>`).join('')
    : `<option value="">${l.recipeId ? 'no other line uses this colorway' : 'no recipe on this line'}</option>`;

  return `<tr class="drawer"><td colspan="8"><div class="drawer-grid">

    ${!l.recipeId ? linkBlockHtml(l) : `
    <div class="dblock">
      <h4>Lot to draw from</h4>
      <div class="drow"><select data-lotsel="${l.id}" ${lots.length ? '' : 'disabled'}>${lotOpts}</select></div>
      ${lots.length ? `<div class="dstat">
        <span><strong>${a.wound}</strong> wound &amp; unassigned <span class="dstat-sub">— boxable now, from back stock</span></span>
        <span><strong>${a.unwound}</strong> dyed, not yet wound <span class="dstat-sub">— unallocated on the racks</span></span>
        <span class="dstat-sub">across ${a.lots} lot${a.lots === 1 ? '' : 's'}</span>
      </div>` : ''}
      ${rivalNeed ? `<div class="dstat warn">${rivals.length} other open line${rivals.length === 1 ? '' : 's'}
        want ${rivalNeed} of this colorway — the wound stock is a shared pool.</div>` : ''}
      <div class="dnote">${lots.length
        ? 'Defaults to the oldest lot with free spools. Every Bin/Boxed action on this line writes against this lot.'
        : 'No Production_Lots row exists for this colorway, so an allocation here would have no lot attached. Make the lot first if you want the count to reconcile.'}</div>
    </div>`}

    <div class="dblock">
      <h4>Transfer to another line</h4>
      <div class="drow"><select data-xfer="${l.id}" ${targets.length ? '' : 'disabled'}>${targetOpts}</select></div>
      <div class="drow">
        <input class="qty-in" data-xferqty="${l.id}" value="${esc(S.xferQty[l.id] !== undefined ? S.xferQty[l.id] : Math.min(allocated, 1) || '')}">
        <span style="font-size:11px;color:var(--muted);">of ${allocated} allocated</span>
        <button class="btn tiny solid" data-doxfer="${l.id}" ${allocated && targets.length ? '' : 'disabled'}>Move</button>
      </div>
      <div class="dnote">Moves spools already logged here over to another line, keeping the same lot and status. Only lines on the same colorway are offered — the spools are physically that colour.</div>
    </div>

    <div class="dblock">
      <h4>Return to back stock</h4>
      <div class="drow">
        <input class="qty-in" data-stockqty="${l.id}" value="${esc(S.stockQty[l.id] !== undefined ? S.stockQty[l.id] : Math.min(allocated, 1) || '')}">
        <span style="font-size:11px;color:var(--muted);">of ${allocated} allocated</span>
        <button class="btn tiny" data-dostock="${l.id}" ${allocated && S.stockCol ? '' : 'disabled'}>To stock</button>
      </div>
      <div class="dnote">${S.stockCol
        ? `Takes the spools off this line and adds them to <strong>${esc(S.stockColLabel)}</strong> on their lot. Use it when a wound spool comes back out of a box.`
        : 'No stock column on Production_Lots — add <strong>General_Stock_Spools</strong> or <strong>Store_Stock_Spools</strong>.'}</div>
    </div>

    ${nameBlockHtml(l)}

  </div></td></tr>`;
}

function renderLog() {
  document.getElementById('log').innerHTML = S.log.map((e, i) => `
    <div class="log-line ${e.cls || ''}">
      <span>${esc(e.text)}</span>
      <span class="undo" data-undo="${i}">&#8634; undo</span>
    </div>`).join('');
  document.querySelectorAll('[data-undo]').forEach(el =>
    el.addEventListener('click', () => undo(Number(el.dataset.undo))));
}

/* ---------- writes ----------
   Each action builds its own inverse before applying, so undo replays exact
   opposites rather than guessing at prior state.                             */

function newAllocAction(line, lotId, qty, status) {
  const { ALLOC } = S.cols;
  const f = {};
  f[ALLOC.lot] = lotId || 0;
  f[ALLOC.qty] = qty;
  f[ALLOC.status] = status;
  f[ALLOC.line] = line.id;
  if (ALLOC.customer && line.order.custId) f[ALLOC.customer] = line.order.custId;
  // Labels_Applied is deliberately left false. The label widget owns that flag:
  // it subtracts these spools from the printed-label inventory on its next load
  // and sets the flag itself, exactly once. Setting it here would make those
  // labels vanish from the count without ever being deducted.
  if (ALLOC.labelsApplied) f[ALLOC.labelsApplied] = false;
  return ['AddRecord', 'Lot_Allocations', null, f];
}

/* Boxing something that is already wound must PROMOTE the existing bin
   allocation, not add a second one beside it. Adding left the original row
   sitting at "Wound - Needs Labels" forever, so Wind & Box kept asking for it
   and the spools were counted twice. Only the shortfall becomes a new row. */
/* Writes ONLY Work_Order_Lines.Recipe. See linkBlockHtml for why the SKU is
   left alone — writing it would make the Shopify sync cancel this very line. */
async function doLink(lineId) {
  const l = lineById(lineId);
  if (!l) return;
  const recipeId = S.linkChoice[lineId];
  if (!recipeId) { showToast('Pick a colorway first'); return; }
  const col = S.cols && S.cols.WOL && S.cols.WOL.recipe;
  if (!col) { showToast('No Recipe column on Work_Order_Lines'); return; }

  const rec = S.recipes[recipeId];
  const before = l.recipeId || 0;
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Work_Order_Lines', lineId, { [col]: recipeId }],
    ]);
    S.log.unshift({
      text: `${l.order.num} ${l.sku || '(no sku)'} linked to ${rec ? rec.name : 'a colorway'}`,
      cls: '',
      inverse: [['UpdateRecord', 'Work_Order_Lines', lineId, { [col]: before }]],
    });
    delete S.linkChoice[lineId];
    showToast('Linked ✓');
    await loadAll();
  } catch (e) {
    console.error('Quick Log: could not link the line to a recipe', e);
    showToast('Could not link — check Work_Order_Lines');
  }
}

/* Writes Work_Order_Lines.Display_Name. Deliberately does NOT touch the recipe:
   a one-time name must never rename the colourway, or the next customer to ask
   for that name renames it again and the recipe's own history is lost. */
async function saveDisplayName(lineId, forced) {
  const l = lineById(lineId);
  if (!l) return;
  const col = S.cols && S.cols.WOL && S.cols.WOL.displayName;
  if (!col) { showToast('No Display_Name column on Work_Order_Lines'); return; }
  const next = (forced !== undefined ? forced
    : (S.nameDraft[lineId] !== undefined ? S.nameDraft[lineId] : (l.displayName || ''))).trim();
  const before = l.displayName || '';
  if (next === before) return;
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Work_Order_Lines', lineId, { [col]: next }],
    ]);
    S.log.unshift({
      text: next
        ? `${l.order.num} ${l.name} — labels will print "${next}"`
        : `${l.order.num} ${l.name} — custom label name cleared`,
      cls: '',
      inverse: [['UpdateRecord', 'Work_Order_Lines', lineId, { [col]: before }]],
    });
    delete S.nameDraft[lineId];
    showToast(next ? 'Label name set \u2713' : 'Back to the recipe name');
    await loadAll();
  } catch (e) {
    console.error('Quick Log: could not save the display name', e);
    showToast('Could not save — check Work_Order_Lines');
  }
}

async function logSpools(lines, status, label) {
  const toBin = status === BIN_STATUS;
  const jobs = lines.map(l => ({ line: l, qty: rowQty(l), lot: defaultLotFor(l) }))
    .filter(j => j.qty > 0);
  if (!jobs.length) { showToast('Nothing to log — set a quantity first'); return; }

  const actions = [], inverse = [], addIdx = [];
  let promoted = 0, fresh = 0, needLot = 0;

  /* Spools drawn out of back stock have to come OFF the back stock count, or
     they are counted twice — still sitting in General_Stock_Spools and also
     allocated to the order. `doToStock` already does this in the other
     direction; this is the matching half.

     Nobody has to declare where the spools came from, because the lot's own
     numbers say it: `free` is what is made but neither allocated nor in stock,
     so anything needed beyond `free` can only have come out of stock.

     Accumulated per lot rather than written per job — two lines drawing on one
     lot would otherwise each compute `before` from the same stale stockVal and
     the second write would silently undo the first. */
  const stockDraw = {};   // lotId -> spools taken out of the stock column
  const lotClaim = {};    // lotId -> spools newly allocated against it this run
  let shortStock = 0;     // wanted from stock but the column did not have it

  jobs.forEach(j => {
    let need = j.qty;
    if (!toBin) {
      // Spools already in this customer's bin, biggest row first so the fewest
      // records get touched.
      const pool = j.line.allocs
        .filter(a => a.qty > 0 && allocBucket(a.status) === 'wound')
        .sort((a, b) => b.qty - a.qty);
      for (const a of pool) {
        if (need <= 0) break;
        const take = Math.min(a.qty, need);
        need -= take; promoted += take;
        if (take === a.qty) {
          actions.push(['UpdateRecord', 'Lot_Allocations', a.id, { [S.cols.ALLOC.status]: S.packedStatus }]);
          inverse.push(['UpdateRecord', 'Lot_Allocations', a.id, { [S.cols.ALLOC.status]: a.status }]);
        } else {
          // Part of a bin row goes in the box: shrink it and split off a
          // packed row carrying the same lot.
          actions.push(['UpdateRecord', 'Lot_Allocations', a.id, { [S.cols.ALLOC.qty]: a.qty - take }]);
          inverse.push(['UpdateRecord', 'Lot_Allocations', a.id, { [S.cols.ALLOC.qty]: a.qty }]);
          addIdx.push(actions.length);
          actions.push(newAllocAction(j.line, a.lotId, take, S.packedStatus));
        }
      }
    }
    if (need > 0) {
      if (!j.lot) { needLot++; return; }
      fresh += need;
      addIdx.push(actions.length);
      actions.push(newAllocAction(j.line, j.lot.id, need, status));

      // Whatever this lot could not cover from free spools came out of stock.
      // Two separate running totals: how much of the lot has been claimed at
      // all (which is what exhausts `free`), and how much has been taken off
      // the stock column. Using one for both understates the draw when an
      // earlier line already ate the free spools.
      if (S.stockCol) {
        const claimedBefore = lotClaim[j.lot.id] || 0;
        const freeLeft = Math.max(0, j.lot.free - claimedBefore);
        const fromStock = Math.max(0, need - freeLeft);
        if (fromStock > 0) {
          const drawnBefore = stockDraw[j.lot.id] || 0;
          const stockLeft = Math.max(0, j.lot.stockVal - drawnBefore);
          const take = Math.min(fromStock, stockLeft);
          if (take > 0) stockDraw[j.lot.id] = drawnBefore + take;
          // Beyond what the column holds is a real over-allocation. Never write
          // the column negative — say so and let Bin Audit show the rest.
          shortStock += fromStock - take;
        }
      }
      lotClaim[j.lot.id] = (lotClaim[j.lot.id] || 0) + need;
    }
  });

  Object.entries(stockDraw).forEach(([lotId, taken]) => {
    const lot = S.lots.find(x => x.id === Number(lotId));
    if (!lot) return;
    // Held-back spools leaving the shelf: wound first, then hank.
    const m = stockMove(Object.assign({}, lot.row), S.stock2, 'general', -taken);
    if (!Object.keys(m.fields).length) return;
    actions.push(['UpdateRecord', 'Production_Lots', Number(lotId), m.fields]);
    inverse.push(['UpdateRecord', 'Production_Lots', Number(lotId), m.inverse]);
  });

  if (!actions.length) {
    showToast(needLot ? 'No lot exists for that colorway — make the lot first' : 'Nothing to log');
    return;
  }
  try {
    const res = await grist.docApi.applyUserActions(actions);
    const vals = retValues(res);
    // Undo removes the new rows first, then restores the rows that were changed.
    const inv = addIdx.map(i => vals[i]).filter(id => id != null)
      .map(id => ['RemoveRecord', 'Lot_Allocations', id]).concat(inverse);
    const total = promoted + fresh;
    const drawn = Object.values(stockDraw).reduce((a, b) => a + b, 0);
    const detail = (promoted && fresh) ? ` (${promoted} from the bin, ${fresh} newly wound)`
      : (promoted ? ' from the bin' : '');
    // Taking spools off the back stock count is a second, invisible change to a
    // different table — it gets said out loud rather than left to be noticed.
    const stockNote = drawn
      ? ` · ${drawn} came off ${S.stockColLabel.toLowerCase()}` : '';
    S.log.unshift({
      text: `${total} spool${total === 1 ? '' : 's'} ${label}${detail}${
        jobs.length > 1 ? ` across ${jobs.length} lines` : ` — ${jobs[0].line.name}`}${stockNote}`,
      cls: toBin ? 'warnish' : '',
      inverse: inv,
    });
    S.picked = {}; S.qty = {}; S.openDrawer = null;
    showToast(needLot ? `Logged — ${needLot} line${needLot === 1 ? '' : 's'} had no lot`
      : shortStock ? `Logged — ${shortStock} more than ${S.stockColLabel.toLowerCase()} had; check Bin Audit`
      : 'Logged \u2713');
    await loadAll();
  } catch (e) {
    console.error('Quick Log: could not write allocations', e);
    showToast('Write failed — check Lot_Allocations');
  }
}

/* Take `qty` spools off a line's existing allocations, largest first so the
   fewest rows get touched. Returns the actions plus what was consumed, so the
   caller can put them somewhere else. */
function consumeFromLine(line, qty) {
  const pool = line.allocs
    .filter(a => a.qty > 0 && allocBucket(a.status) !== 'pending')
    .sort((a, b) => b.qty - a.qty);
  const actions = [], inverse = [], taken = [];
  let need = qty;
  for (const a of pool) {
    if (need <= 0) break;
    const take = Math.min(a.qty, need);
    need -= take;
    taken.push({ lotId: a.lotId, qty: take, status: a.status, applied: a.applied });
    if (take === a.qty) {
      actions.push(['RemoveRecord', 'Lot_Allocations', a.id]);
      const { ALLOC } = S.cols;
      const f = {};
      f[ALLOC.lot] = a.lotId || 0; f[ALLOC.qty] = a.qty; f[ALLOC.status] = a.status; f[ALLOC.line] = line.id;
      if (ALLOC.labelsApplied) f[ALLOC.labelsApplied] = a.applied;
      inverse.push(['AddRecord', 'Lot_Allocations', a.id, f]);
    } else {
      actions.push(['UpdateRecord', 'Lot_Allocations', a.id, { [S.cols.ALLOC.qty]: a.qty - take }]);
      inverse.push(['UpdateRecord', 'Lot_Allocations', a.id, { [S.cols.ALLOC.qty]: a.qty }]);
    }
  }
  return { actions, inverse, taken, short: need };
}

async function doTransfer(lineId) {
  const from = lineById(lineId);
  const toId = Number(S.xferTarget[lineId] || 0);
  const to = lineById(toId);
  const qty = Math.max(0, Number(S.xferQty[lineId]) || 0);
  if (!from || !to) { showToast('Pick a line to move to'); return; }
  if (!qty) { showToast('Set a quantity to move'); return; }
  const c = consumeFromLine(from, qty);
  if (c.short > 0) { showToast(`Only ${qty - c.short} allocated on that line`); return; }

  const { ALLOC } = S.cols;
  // One new row per source lot+status, so lot provenance survives the move.
  const adds = c.taken.map(t => {
    const f = {};
    f[ALLOC.lot] = t.lotId || 0; f[ALLOC.qty] = t.qty; f[ALLOC.status] = t.status; f[ALLOC.line] = to.id;
    if (ALLOC.customer && to.order.custId) f[ALLOC.customer] = to.order.custId;
    // Carry the flag across. A transfer moves spools, it doesn't un-stick
    // labels — clearing it here would deduct the same labels a second time.
    if (ALLOC.labelsApplied) f[ALLOC.labelsApplied] = t.applied;
    return ['AddRecord', 'Lot_Allocations', null, f];
  });
  try {
    const res = await grist.docApi.applyUserActions(c.actions.concat(adds));
    const ids = retValues(res).slice(c.actions.length).filter(id => id != null);
    S.log.unshift({
      text: `${qty} × ${from.name} moved from ${from.order.custName || from.order.num} to ${to.order.custName || to.order.num}`,
      inverse: ids.map(id => ['RemoveRecord', 'Lot_Allocations', id]).concat(c.inverse),
    });
    S.openDrawer = null; delete S.xferQty[lineId]; delete S.xferTarget[lineId];
    showToast('Moved \u2713');
    await loadAll();
  } catch (e) {
    console.error('Quick Log: transfer failed', e);
    showToast('Transfer failed — check Lot_Allocations');
  }
}

async function doToStock(lineId) {
  const line = lineById(lineId);
  const qty = Math.max(0, Number(S.stockQty[lineId]) || 0);
  if (!line || !qty) { showToast('Set a quantity to return'); return; }
  if (!S.stockCol) { showToast(STOCK2_NOT_READY, true); return; }
  const c = consumeFromLine(line, qty);
  if (c.short > 0) { showToast(`Only ${qty - c.short} allocated on that line`); return; }
  const withLot = c.taken.filter(t => t.lotId);
  if (!withLot.length) { showToast('Those allocations have no lot, so there is nowhere to return them'); return; }

  // Roll up per lot so two allocations on one lot make a single update.
  const byLot = {};
  withLot.forEach(t => { byLot[t.lotId] = (byLot[t.lotId] || 0) + t.qty; });
  const updates = [], invUpdates = [];
  Object.entries(byLot).forEach(([lotId, add]) => {
    const lot = S.lots.find(x => x.id === Number(lotId));
    if (!lot) return;
    // Returned spools are wound and go back on the shelf, held back.
    const m = stockMove(Object.assign({}, lot.row), S.stock2, 'general', add);
    updates.push(['UpdateRecord', 'Production_Lots', Number(lotId), m.fields]);
    invUpdates.push(['UpdateRecord', 'Production_Lots', Number(lotId), m.inverse]);
  });
  try {
    await grist.docApi.applyUserActions(c.actions.concat(updates));
    S.log.unshift({
      text: `${qty} × ${line.name} returned to ${S.stockColLabel.toLowerCase()} from ${line.order.custName || line.order.num}`,
      cls: 'warnish',
      inverse: invUpdates.concat(c.inverse),
    });
    S.openDrawer = null; delete S.stockQty[lineId];
    showToast('Back in stock \u2713');
    await loadAll();
  } catch (e) {
    console.error('Quick Log: return to stock failed', e);
    showToast('Return failed — check Production_Lots');
  }
}

async function undo(i) {
  const e = S.log[i];
  if (!e || !e.inverse || !e.inverse.length) return;
  try {
    await grist.docApi.applyUserActions(e.inverse);
    S.log.splice(i, 1);
    showToast('Undone \u2713');
    await loadAll();
  } catch (err) {
    console.error('Quick Log: undo failed', err);
    showToast('Undo failed — the rows may have changed since');
  }
}

/* ---------- lot stock editor ----------
   The direct way to set a lot's numbers: what was wound, what is on the shelf,
   what is still in hank, what is listed where. Held back is never typed — it
   is whatever is left after the listings, which is what General now is. */
const SK_FIELDS = [
  ['made', 'Made', 'Spools ever wound from this lot'],
  ['onHand', 'On hand', 'Wound spools on the shelf now'],
  ['hank', 'Hank', 'Still in hank, as an estimated spool count'],
  ['vendor', 'Vendor', 'Listed on the vendor store (wound or hank)'],
  ['store', 'Retail', 'Listed on the retail store (wound only)'],
  ['broken', 'Written off', 'Gone without an order recording it'],
];
function skSaved(lot) {
  return { made: lot.row.made, onHand: lot.row.onHand, hank: lot.row.hank,
           vendor: lot.row.vendor, store: lot.row.store, broken: lot.broken };
}
function skVals(lot) {
  const v = skSaved(lot), d = S.stockDraft[lot.id] || {};
  Object.keys(d).forEach(k => { v[k] = Math.max(0, Number(d[k]) || 0); });
  return v;
}
function skChanged(lot) {
  const a = skSaved(lot), b = skVals(lot);
  return Object.keys(a).some(k => a[k] !== b[k]);
}
/* Everything that can be wrong with a lot's numbers, worst first. */
function skWarnings(lot, v) {
  const out = [];
  const held = v.onHand + v.hank - v.vendor - v.store;
  if (held < 0) out.push({ bad: true, text: `listed ${-held} more than you have` });
  if (v.store > v.onHand) out.push({ bad: true, text: 'retail is listing hank — wind it first' });
  if (v.onHand > v.made) out.push({ bad: true, text: `${v.onHand - v.made} more on hand than were wound` });
  const unacct = v.made - lot.alloc - v.onHand - v.broken;
  if (unacct < 0) out.push({ bad: true, text: `${-unacct} more accounted for than were wound` });
  else if (unacct > 0) out.push({ bad: false, text: `${unacct} wound but not on hand, ordered or written off` });
  return out;
}
function skMatches(lot) {
  const rec = S.recipes[lot.recipeId] || {};
  const q = normalize(S.stockSearch);
  if (q) return normalize(`${lot.number} ${rec.name || ''} ${lot.fiber}`).includes(q);
  if (S.stockAll) return true;
  return lot.stock > 0 || lot.row.hank > 0 || !!S.stockDraft[lot.id];
}
function skRowHtml(lot) {
  const rec = S.recipes[lot.recipeId] || {};
  const v = skVals(lot), saved = skSaved(lot);
  const held = v.onHand + v.hank - v.vendor - v.store;
  const warns = skWarnings(lot, v);
  const cells = SK_FIELDS.map(([k, , tip]) => `<td class="num"><input class="sk-in${
    v[k] !== saved[k] ? ' changed' : ''}" type="number" min="0" data-sk="${lot.id}" data-k="${k}"
    value="${v[k]}" title="${esc(tip)}"></td>`);
  // Held back sits between the listings and Written off, where it reads as a result.
  cells.splice(5, 0, `<td class="held${held < 0 ? ' bad' : ''}" data-held="${lot.id}"
    title="On hand + Hank − Vendor − Retail">${held}</td>`);
  return `<tr class="line" data-skrow="${lot.id}">
    <td><span class="cw">${esc(rec.name || '?')}</span>${lot.fiber ? `<span class="fib">${esc(lot.fiber)}</span>` : ''}
      <div class="lotno">${esc(lot.number)}${lot.alloc ? ` · ${lot.alloc} on orders` : ''}</div>
      <div data-warn="${lot.id}">${warns.map(w => `<span class="sk-warn${w.bad ? ' bad' : ''}">${esc(w.text)}</span>`).join('')}</div>
    </td>
    ${cells.join('')}
    <td class="acts"><button class="btn tiny solid" data-sksave="${lot.id}" ${skChanged(lot) ? '' : 'disabled'}>Save</button></td>
  </tr>`;
}
function renderStock() {
  const lots = S.lots.filter(skMatches).sort((a, b) => {
    const na = (S.recipes[a.recipeId] || {}).name || '', nb = (S.recipes[b.recipeId] || {}).name || '';
    return na.localeCompare(nb) || (a.date || 0) - (b.date || 0);
  });
  const dirty = Object.keys(S.stockDraft).filter(id => {
    const l = S.lots.find(x => x.id === Number(id)); return l && skChanged(l);
  }).length;
  const toolbar = `<div class="toolbar">
    <input class="search" id="skSearch" placeholder="Search colorway or lot number..." value="${esc(S.stockSearch)}">
    <div class="filters">
      <button class="fbtn ${S.stockAll ? '' : 'on'}" data-skall="0">In stock</button>
      <button class="fbtn ${S.stockAll ? 'on' : ''}" data-skall="1">All lots</button>
    </div>
  </div>
  <div class="sk-legend"><b>Held back</b> = On hand + Hank − Vendor − Retail. It's calculated, never typed.
    <b>Made</b> only counts winding, so a lot that's all hank has 0 made.</div>`;
  const body = !S.stockCol
    ? `<div class="banner">${esc(STOCK2_NOT_READY)}</div>`
    : !lots.length
      ? `<div class="empty-note">${S.stockSearch ? 'No lot matches.' : 'No lots in stock.'}</div>`
      : `<table class="grid"><thead><tr>
          <th>Lot</th>${SK_FIELDS.slice(0, 5).map(([, l]) => `<th class="num" style="width:58px">${l}</th>`).join('')}
          <th class="num" style="width:58px">Held back</th>
          <th class="num" style="width:58px">Written off</th><th style="width:52px"></th>
        </tr></thead><tbody>${lots.map(skRowHtml).join('')}</tbody></table>`;
  const foot = `<div class="footbar">
    <div class="count">${dirty ? `<strong>${dirty}</strong> lot${dirty === 1 ? '' : 's'} changed, not saved` : 'Type a number and save the row.'}</div>
    <button class="btn" id="skDiscard" ${dirty ? '' : 'disabled'}>Discard</button>
    <button class="btn solid" id="skSaveAll" ${dirty ? '' : 'disabled'}>Save all</button>
  </div>`;
  document.getElementById('pane').innerHTML = toolbar + body + foot;
  bindStock();
}
/* Typing must not re-render (focus would jump), so only this row is touched. */
function skRefreshRow(lotId) {
  const lot = S.lots.find(x => x.id === lotId);
  if (!lot) return;
  const v = skVals(lot), saved = skSaved(lot);
  const held = v.onHand + v.hank - v.vendor - v.store;
  const h = document.querySelector(`[data-held="${lotId}"]`);
  if (h) { h.textContent = held; h.classList.toggle('bad', held < 0); }
  const w = document.querySelector(`[data-warn="${lotId}"]`);
  if (w) w.innerHTML = skWarnings(lot, v).map(x => `<span class="sk-warn${x.bad ? ' bad' : ''}">${esc(x.text)}</span>`).join('');
  document.querySelectorAll(`[data-sk="${lotId}"]`).forEach(el =>
    el.classList.toggle('changed', v[el.dataset.k] !== saved[el.dataset.k]));
  const b = document.querySelector(`[data-sksave="${lotId}"]`);
  if (b) b.disabled = !skChanged(lot);
  const dirty = Object.keys(S.stockDraft).filter(id => {
    const l = S.lots.find(x => x.id === Number(id)); return l && skChanged(l);
  }).length;
  const c = document.querySelector('.footbar .count');
  if (c) c.innerHTML = dirty ? `<strong>${dirty}</strong> lot${dirty === 1 ? '' : 's'} changed, not saved` : 'Type a number and save the row.';
  ['skDiscard', 'skSaveAll'].forEach(id => { const e = document.getElementById(id); if (e) e.disabled = !dirty; });
}
async function saveStock(lotIds) {
  if (!S.stockCol) { showToast(STOCK2_NOT_READY, true); return; }
  const actions = [], inverse = [], names = [];
  lotIds.forEach(id => {
    const lot = S.lots.find(x => x.id === id);
    if (!lot || !skChanged(lot)) return;
    const v = skVals(lot);
    const d = stockSet(Object.assign({}, lot.row), S.stock2, v);
    const brokenCol = S.cols.LOT.broken;
    if (brokenCol && v.broken !== lot.broken) { d.fields[brokenCol] = v.broken; d.inverse[brokenCol] = lot.broken; }
    if (!Object.keys(d.fields).length) return;
    actions.push(['UpdateRecord', 'Production_Lots', id, d.fields]);
    inverse.push(['UpdateRecord', 'Production_Lots', id, d.inverse]);
    names.push(`${(S.recipes[lot.recipeId] || {}).name || lot.number}`);
  });
  if (!actions.length) { showToast('Nothing changed'); return; }
  try {
    await grist.docApi.applyUserActions(actions);
    S.log.unshift({
      text: `Stock set on ${names.length === 1 ? names[0] : names.length + ' lots'}`,
      inverse,
    });
    lotIds.forEach(id => { delete S.stockDraft[id]; });
    showToast('Saved ✓');
    await loadAll();
  } catch (e) {
    console.error('Quick Log: stock save failed', e);
    showToast(/formula/i.test(String(e && e.message)) ? STOCK2_NOT_READY : 'Save failed — check Production_Lots', true);
  }
}
function bindStock() {
  const s = document.getElementById('skSearch');
  if (s) s.addEventListener('input', () => {
    S.stockSearch = s.value;
    const pos = s.selectionStart;
    render();
    const s2 = document.getElementById('skSearch');
    if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); }
  });
  document.querySelectorAll('[data-skall]').forEach(el =>
    el.addEventListener('click', () => { S.stockAll = el.dataset.skall === '1'; render(); }));
  document.querySelectorAll('[data-sk]').forEach(el => el.addEventListener('input', () => {
    const id = Number(el.dataset.sk);
    (S.stockDraft[id] = S.stockDraft[id] || {})[el.dataset.k] = el.value;
    skRefreshRow(id);
  }));
  document.querySelectorAll('[data-sksave]').forEach(el =>
    el.addEventListener('click', () => saveStock([Number(el.dataset.sksave)])));
  const all = document.getElementById('skSaveAll');
  if (all) all.addEventListener('click', () => saveStock(Object.keys(S.stockDraft).map(Number)));
  const dis = document.getElementById('skDiscard');
  if (dis) dis.addEventListener('click', () => { S.stockDraft = {}; render(); });
}

/* ---------- events ---------- */
function bind() {
  const s = document.getElementById('search');
  if (s) s.addEventListener('input', () => {
    S.search = s.value;
    const pos = s.selectionStart;
    render();
    const s2 = document.getElementById('search');
    if (s2) { s2.focus(); s2.setSelectionRange(pos, pos); }
  });
  document.querySelectorAll('[data-filter]').forEach(el =>
    el.addEventListener('click', () => { S.filter = el.dataset.filter; render(); }));
  const cs = document.getElementById('custSel');
  if (cs) cs.addEventListener('change', () => { S.customer = cs.value; render(); });

  document.querySelectorAll('[data-pick]').forEach(el => el.addEventListener('change', () => {
    const id = Number(el.dataset.pick);
    if (el.checked) S.picked[id] = true; else delete S.picked[id];
    render();
  }));
  document.querySelectorAll('[data-pickorder]').forEach(el => el.addEventListener('change', () => {
    const woId = Number(el.dataset.pickorder);
    visibleLines().filter(l => l.woId === woId).forEach(l => {
      if (el.checked) S.picked[l.id] = true; else delete S.picked[l.id];
    });
    render();
  }));

  // Typing a quantity must not re-render, or the field loses focus mid-number.
  document.querySelectorAll('[data-qty]').forEach(el => el.addEventListener('input', () => {
    S.qty[Number(el.dataset.qty)] = el.value;
    const row = el.closest('tr');
    const q = Math.max(0, Number(el.value) || 0);
    row.querySelectorAll('[data-bin],[data-box]').forEach(b => { b.disabled = !q; });
    updateFootCount();
  }));

  document.querySelectorAll('[data-drawer]').forEach(el => el.addEventListener('click', () => {
    const id = Number(el.dataset.drawer);
    S.openDrawer = S.openDrawer === id ? null : id;
    render();
  }));
  document.querySelectorAll('[data-namein]').forEach(el => el.addEventListener('input', () => {
    S.nameDraft[Number(el.dataset.namein)] = el.value;
    const btn = document.querySelector(`[data-doname="${el.dataset.namein}"]`);
    const line = lineById(Number(el.dataset.namein));
    if (btn && line) btn.disabled = el.value.trim() === (line.displayName || '');
  }));
  document.querySelectorAll('[data-doname]').forEach(el =>
    el.addEventListener('click', () => saveDisplayName(Number(el.dataset.doname))));
  document.querySelectorAll('[data-clearname]').forEach(el =>
    el.addEventListener('click', () => saveDisplayName(Number(el.dataset.clearname), '')));
  document.querySelectorAll('[data-linksel]').forEach(el => el.addEventListener('change', () => {
    const id = Number(el.dataset.linksel);
    const v = Number(el.value);
    if (v) S.linkChoice[id] = v; else delete S.linkChoice[id];
    render();
  }));
  document.querySelectorAll('[data-dolink]').forEach(el =>
    el.addEventListener('click', () => doLink(Number(el.dataset.dolink))));
  document.querySelectorAll('[data-lotsel]').forEach(el => el.addEventListener('change', () => {
    S.lotChoice[Number(el.dataset.lotsel)] = Number(el.value) || null;
  }));
  document.querySelectorAll('[data-xfer]').forEach(el => el.addEventListener('change', () => {
    S.xferTarget[Number(el.dataset.xfer)] = el.value;
  }));
  document.querySelectorAll('[data-xferqty]').forEach(el => el.addEventListener('input', () => {
    S.xferQty[Number(el.dataset.xferqty)] = el.value;
  }));
  document.querySelectorAll('[data-stockqty]').forEach(el => el.addEventListener('input', () => {
    S.stockQty[Number(el.dataset.stockqty)] = el.value;
  }));

  document.querySelectorAll('[data-bin]').forEach(el => el.addEventListener('click', () => {
    const l = lineById(Number(el.dataset.bin));
    if (!l) return;
    // Bagging can't exceed what's still unwound, whatever the box says.
    S.qty[l.id] = binQty(l);
    logSpools([l], BIN_STATUS, 'wound & bagged');
  }));
  document.querySelectorAll('[data-box]').forEach(el => el.addEventListener('click', () => {
    const l = lineById(Number(el.dataset.box));
    if (l) logSpools([l], S.packedStatus, 'wound & boxed');
  }));
  document.querySelectorAll('[data-boxorder]').forEach(el => el.addEventListener('click', () => {
    const woId = Number(el.dataset.boxorder);
    const ls = visibleLines().filter(l => l.woId === woId && openQty(l) > 0);
    if (ls.length) logSpools(ls, S.packedStatus, 'wound & boxed');
  }));
  document.querySelectorAll('[data-doxfer]').forEach(el =>
    el.addEventListener('click', () => doTransfer(Number(el.dataset.doxfer))));
  document.querySelectorAll('[data-dostock]').forEach(el =>
    el.addEventListener('click', () => doToStock(Number(el.dataset.dostock))));

  const ps = document.getElementById('pickShown');
  if (ps) ps.addEventListener('click', () => { visibleLines().forEach(l => { S.picked[l.id] = true; }); render(); });
  const pn = document.getElementById('pickNone');
  if (pn) pn.addEventListener('click', () => { S.picked = {}; render(); });
  const bb = document.getElementById('bulkBox');
  if (bb) bb.addEventListener('click', () => logSpools(pickedLines(), S.packedStatus, 'wound & boxed'));
  const bn = document.getElementById('bulkBin');
  if (bn) bn.addEventListener('click', () => {
    const ls = pickedLines();
    ls.forEach(l => { S.qty[l.id] = binQty(l); });   // never bag more than is unwound
    logSpools(ls, BIN_STATUS, 'wound & bagged');
  });
}

function updateFootCount() {
  const picked = pickedLines();
  const total = picked.reduce((a, l) => a + rowQty(l), 0);
  const el = document.querySelector('.footbar .count');
  if (el) {
    el.innerHTML = picked.length
      ? `<strong>${picked.length}</strong> line${picked.length === 1 ? '' : 's'} picked &middot; <strong>${total}</strong> spools`
      : 'Tick lines to act on several at once.';
  }
  ['bulkBox', 'bulkBin'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.disabled = !total;
  });
}

function showToast(msg, sticky) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), sticky ? 6000 : 2600);
}

document.getElementById('refreshBtn').addEventListener('click', () => {
  S.picked = {}; S.qty = {}; S.openDrawer = null; loadAll();
});
document.getElementById('modeOrders').addEventListener('click', () => { S.mode = 'orders'; render(); });
document.getElementById('modeStock').addEventListener('click', () => { S.mode = 'stock'; render(); });

/* Static shell is already in the DOM; only now do we touch the plugin API, so
   a failure here shows a banner instead of killing the script silently. */
try {
  grist.ready({ requiredAccess: 'full' });
  loadAll();
} catch (e) {
  console.error('Quick Log: grist.ready failed', e);
  document.getElementById('banner').innerHTML =
    `<strong>Couldn't reach Grist.</strong> Set this widget's access to Full document and reload the page.`;
  document.getElementById('banner').className = 'banner';
  document.getElementById('pane').innerHTML = '';
}
</script>
