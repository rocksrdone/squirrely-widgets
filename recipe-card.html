<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Card</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="dye-mix.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --ink: #1A1614;
    --paper: #F7F3EE;
    --warm: #E8DFD4;
    --rule: #D4C9BC;
    --accent: #8B3A2A;
    --accent-light: #F2E8E5;
    --teal: #3A8B7A;
    --teal-light: #E5F2EF;
    --gold: #B07D2A;
    --gold-light: #F5EDD8;
    --done-bg: #EAF3DE;
    --done-border: #639922;
    --done-text: #27500A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 0;
    overflow-x: hidden;
  }

  /* ── EMPTY STATE ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #8B7D72;
    text-align: center;
    padding: 40px;
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
  .empty-title { font-family: 'Libre Baskerville', serif; font-size: 16px; color: #6B5E52; margin-bottom: 6px; }
  .empty-sub { font-size: 12px; }

  /* ── MAIN LAYOUT ── */
  .card {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: 100vh;
  }

  .panel {
    padding: 16px;
    border-right: 1px solid var(--rule);
    overflow-y: auto;
  }
  .panel:last-child { border-right: none; }

  /* ── RECIPE HEADER ── */
  .recipe-name {
    font-family: 'Libre Baskerville', serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 6px;
  }
  .recipe-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }

  .spool-badge {
    display: inline-block; margin-bottom: 10px; font-size: 10px; font-weight: 600;
    padding: 3px 9px; border-radius: 10px; letter-spacing: .02em;
  }
  .spool-done { background: var(--done-bg); color: var(--done-text); border: 1px solid var(--done-border); }
  .spool-partial { background: var(--gold-light); color: var(--gold); border: 1px solid #D4B07A; }
  .spool-none { background: var(--accent-light); color: var(--accent); border: 1px solid #D4A49A; }
  .recipe-header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .product-preview-thumb {
    flex: 0 0 auto;
    width: 56px; height: 56px;
    border-radius: 8px; overflow: hidden;
    border: 1.5px solid var(--rule);
    background: var(--warm);
    cursor: pointer;
    transition: transform .15s ease, border-color .15s ease;
  }
  .product-preview-thumb:hover { transform: scale(1.05); border-color: var(--accent); }
  .product-preview-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  body.big-mode .product-preview-thumb { width: 90px; height: 90px; }

  .preview-wrap { position: relative; flex: 0 0 auto; }
  .product-preview-thumb.empty {
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #8B7D72; border-style: dashed;
  }
  .preview-edit-btn {
    position: absolute; bottom: -8px; right: -8px;
    width: 22px; height: 22px; border-radius: 50%;
    background: white; border: 1.5px solid var(--rule);
    font-size: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-edit-btn:hover { border-color: var(--accent); }
  .preview-refresh-btn {
    position: absolute; top: -8px; right: -8px;
    width: 22px; height: 22px; border-radius: 50%;
    background: white; border: 1.5px solid var(--rule);
    font-size: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .preview-refresh-btn:hover { border-color: var(--accent); }
  .preview-picker-dropdown {
    position: absolute; top: calc(100% + 10px); right: 0; z-index: 50;
    width: 220px; max-height: 260px; overflow-y: auto;
    background: white; border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    padding: 6px;
  }
  .preview-picker-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px; border-radius: 6px; cursor: pointer;
  }
  .preview-picker-row:hover { background: var(--warm); }
  .preview-picker-row.selected { background: var(--done-bg); }
  .preview-picker-row img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; background: var(--warm); flex-shrink: 0; }
  .preview-picker-info { min-width: 0; }
  .ppr-name { font-size: 11px; font-family: 'DM Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ppr-current { font-size: 9px; color: var(--done-text); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .preview-picker-empty { font-size: 11px; color: #8B7D72; font-style: italic; padding: 10px; text-align: center; }
  .meta-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    font-weight: 500;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .tag-method { background: var(--accent-light); color: var(--accent); border: 1px solid #D4A49A; }
  .tag-fiber { background: var(--teal-light); color: var(--teal); border: 1px solid #9ACFC7; }
  .tag-scope { background: var(--gold-light); color: var(--gold); border: 1px solid #D4B07A; }

  /* ── YARDAGE ── */
  .yardage-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding: 8px 10px;
    background: var(--warm);
    border-radius: 6px;
    border: 1px solid var(--rule);
  }
  .yardage-label { font-size: 10px; font-weight: 600; color: #6B5E52; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
  .preset-btn {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: white;
    font-size: 11px;
    cursor: pointer;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
  }
  .preset-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .custom-input {
    width: 60px;
    padding: 4px 6px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    background: white;
    color: var(--ink);
    outline: none;
  }

  /* ── SECTION LABEL ── */
  .slabel {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #8B7D72;
    margin-bottom: 8px;
    margin-top: 14px;
  }
  .slabel:first-child { margin-top: 0; }

  /* ── DYE TABLE ── */
  .dye-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 14px; }
  .dye-table th {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #8B7D72;
    text-align: left;
    padding: 0 8px 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .dye-table td {
    padding: 7px 8px 7px 0;
    border-bottom: 1px solid var(--warm);
    vertical-align: middle;
  }
  .dye-table tr:last-child td { border-bottom: none; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; flex-shrink: 0; }
  .dye-name-cell { display: flex; align-items: center; }
  .brand { font-family: 'DM Mono', monospace; font-size: 9px; background: var(--warm); color: #6B5E52; border-radius: 2px; padding: 1px 4px; margin-left: 5px; border: 1px solid var(--rule); }
  .amt { font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500; }
  .dil { font-size: 10px; color: #8B7D72; font-style: italic; }

  /* ── COLOR LAYOUT ── */
  /* A badge, not another line of text — it sits directly above the ring it is
     describing and has to survive being glanced at while both hands are busy. */
  .meta-tag.tag-year { background: transparent; border: 1px solid var(--rule, #D4C9BC); color: #8B7D72; }
  .repeat-warn {
    display: inline-flex; align-items: center; gap: 7px;
    margin: 0 0 7px; padding: 5px 11px 5px 8px;
    background: #F5EDD8; color: #7A5518;
    border: 1px solid #B07D2A; border-left: 4px solid #B07D2A;
    border-radius: 4px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  }
  .rw-mark { font-size: 9px; line-height: 1; color: #B07D2A; }
  body.big-mode .repeat-warn { font-size: 15px; padding: 7px 14px 7px 11px; }
  .layout-ring-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
  .layout-wrap { background: var(--warm); border-radius: 5px; padding: 10px 12px; border: 1px solid var(--rule); margin-bottom: 14px; }
  .skein-row { margin-bottom: 6px; }
  .skein-row:last-child { margin-bottom: 0; }
  .skein-lbl { font-size: 9px; font-weight: 500; color: #8B7D72; margin-bottom: 4px; }
  .skein-bars { display: flex; gap: 2px; height: 10px; border-radius: 3px; overflow: hidden; }
  .skein-bar { height: 100%; border-radius: 2px; }
  .layout-note { font-size: 10px; color: #6B5E52; font-style: italic; margin-top: 6px; }

  /* ── PHOTOS ── */
  .photo-viewer {
    position: relative;
    width: 100%;
    height: 220px;
    border-radius: 8px;
    overflow: hidden;
    border: 1.5px solid var(--rule);
    background: var(--warm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s ease;
  }
  .photo-viewer:hover { border-color: var(--accent); }
  .photo-viewer img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .viewer-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 6px 10px;
    background: linear-gradient(to top, rgba(26,22,20,.78), rgba(26,22,20,0));
  }
  .viewer-label {
    display: block;
    font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: white;
  }
  .viewer-caption .photo-note {
    color: rgba(255,255,255,.85);
  }
  .photo-note {
    display: block;
    font-size: 9px; color: #8B7D72; font-style: italic;
    margin-top: 1px;
  }
  .viewer-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
  }
  .viewer-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--rule);
    cursor: pointer;
    transition: all .15s ease;
  }
  .viewer-dot.active { background: var(--accent); width: 20px; border-radius: 4px; }
  .viewer-undo-btn {
    position: absolute; top: 6px; right: 6px;
    font-size: 9px; padding: 3px 7px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,.4);
    background: rgba(26,22,20,.55);
    color: white;
    cursor: pointer;
  }
  .viewer-undo-btn:hover { background: rgba(26,22,20,.8); }

  .lightbox-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,12,10,.88);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
  }
  .lightbox-overlay.open { display: flex; }
  .lightbox-overlay img {
    max-width: 90%;
    max-height: 85%;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .lightbox-close {
    position: absolute;
    top: 18px; right: 22px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: white;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .lightbox-caption {
    position: absolute;
    bottom: 24px; left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,.85);
    font-size: 12px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  /* ── BIG VIEW MODE ── */
  .big-toggle-btn {
    position: fixed;
    top: 12px; right: 12px;
    z-index: 500;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--accent);
    background: white;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  body.big-mode .big-toggle-btn { background: var(--accent); color: white; }

  body.big-mode .card { grid-template-columns: 1.15fr 0.85fr; }
  body.big-mode .panel { border-right: 1px solid var(--rule); padding: 20px 24px; max-width: none; margin: 0; overflow-y: auto; height: 100vh; }
  body.big-mode #rightPanel { border-top: none; margin-top: 0; padding-top: 20px; }

  body.big-mode .recipe-name { font-size: 32px; }
  body.big-mode .meta-tag { font-size: 13px; padding: 4px 12px; }

  body.big-mode .photo-viewer { height: 46vh; max-height: 560px; }
  body.big-mode .viewer-label { font-size: 15px; }
  body.big-mode .viewer-caption .photo-note { font-size: 14px; }
  body.big-mode .photo-note { font-size: 14px; }
  body.big-mode .viewer-dots { margin-top: 12px; }
  body.big-mode .viewer-dot { width: 12px; height: 12px; }
  body.big-mode .viewer-dot.active { width: 30px; }
  body.big-mode .step-badge { width: 22px; height: 22px; font-size: 12px; }
  body.big-mode .layout-wrap { display: none; }

  body.big-mode .slabel { font-size: 12px; }
  body.big-mode .dye-table { font-size: 18px; }
  body.big-mode .dye-table th { font-size: 12px; }
  body.big-mode .swatch { width: 16px; height: 16px; margin-right: 10px; }
  body.big-mode .amt { font-size: 18px; }
  body.big-mode .dil { font-size: 14px; }
  body.big-mode .brand { font-size: 12px; padding: 2px 7px; }

  body.big-mode .notes-box { font-size: 16px; padding: 16px 18px; }
  body.big-mode .notes-title { font-size: 12px; }

  body.big-mode .step-item { padding: 16px; }
  body.big-mode .step-num { width: 30px; height: 30px; font-size: 15px; }
  body.big-mode .step-dye { font-size: 13px; }
  body.big-mode .step-text { font-size: 16px; }
  body.big-mode .step-pos { font-size: 13px; }

  /* ── NOTES ── */
  .notes-box {
    background: var(--gold-light);
    border: 1px solid #D4B07A;
    border-radius: 5px;
    padding: 10px 12px;
    font-size: 12px;
    color: #5A3E1B;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .notes-title { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #8B5A2B; margin-bottom: 4px; }

  /* ── STEPS ── */
  .steps-list { display: flex; flex-direction: column; gap: 6px; }
  .step-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px;
    border-radius: 5px;
    border: 1.5px solid var(--warm);
    background: white;
    cursor: pointer;
    user-select: none;
  }
  .step-item:hover { border-color: var(--rule); }
  .step-item.done { background: var(--done-bg); border-color: var(--done-border); }
  .step-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    flex-shrink: 0;
    background: var(--warm);
    color: #6B5E52;
    border: 1.5px solid var(--rule);
  }
  .step-item.done .step-num { background: var(--done-border); color: white; border-color: var(--done-border); }
  .step-dye { font-size: 10px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 2px; }
  .step-text { font-size: 12px; line-height: 1.5; }
  .step-item.done .step-text { color: var(--done-text); text-decoration: line-through; text-decoration-color: #9AC96A; }
  .step-pos { font-size: 10px; color: #8B7D72; margin-top: 2px; font-style: italic; }

  /* ── PROGRESS ── */
  .progress-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--rule);
  }
  .prog-label { font-size: 11px; color: #6B5E52; white-space: nowrap; }
  .prog-track { flex: 1; height: 4px; background: var(--warm); border-radius: 2px; overflow: hidden; }
  .prog-fill { height: 100%; background: var(--done-border); border-radius: 2px; transition: width .2s; }
  .reset-btn {
    font-size: 11px; padding: 3px 8px;
    border-radius: 4px; border: 1px solid var(--rule);
    background: transparent; cursor: pointer; color: #6B5E52;
    font-family: 'Inter', sans-serif;
  }

  .no-data { color: #8B7D72; font-size: 12px; padding: 10px 0; font-style: italic; }

  /* ── PREMADE DYE LOCATIONS ──
     Collapsed by default and parked at the very bottom: this is for the rare
     manual run that never went through a work order, so it must not compete
     with the mix table for attention on the ordinary pass. */
  .stash-wrap { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 10px; }
  /* Setup pop-out: dye mix + premade locations, only needed while setting up. */
  .setup-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 9px 12px; margin: 4px 0 14px;
    border: 1px solid var(--rule); border-radius: 7px; background: #fff; color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; text-align: left; }
  .setup-btn:hover { border-color: var(--accent); color: var(--accent); }
  .setup-btn .sb-meta { margin-left: auto; font-weight: 500; color: #8B7D72; font-size: 11.5px; }
  .setup-ov { position: fixed; inset: 0; background: rgba(26,22,20,.35); z-index: 900; display: flex; justify-content: flex-start; }
  .setup-panel { background: var(--paper, #F7F3EE); width: min(640px, 100%); height: 100%; overflow-y: auto; padding: 14px 16px 24px; box-shadow: 4px 0 18px rgba(0,0,0,.18); }
  .setup-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .setup-head .st-title { font-family: 'Libre Baskerville', serif; font-size: 16px; flex: 1; }
  .setup-close { border: 1px solid var(--rule); background: #fff; color: var(--ink); border-radius: 6px; padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .dye-table td.mix-cell { color: #6B5E52; }
  .stash-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--rule); background: white; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase; color: #6B5E52;
    text-align: left;
  }
  .stash-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .stash-caret { font-size: 9px; transition: transform .15s ease; }
  .stash-wrap.open .stash-caret { transform: rotate(90deg); }
  .stash-toggle .stash-count { margin-left: auto; font-weight: 500; text-transform: none; letter-spacing: 0; }
  .stash-body { margin-top: 10px; }

  .stash-walk {
    font-size: 11px; color: #6B5E52; background: var(--warm);
    border: 1px solid var(--rule); border-radius: 5px;
    padding: 7px 10px; margin-bottom: 8px; line-height: 1.5;
  }
  .stash-walk b { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--ink); }

  .stash-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid var(--warm);
  }
  .stash-row:last-child { border-bottom: none; }
  .stash-bin {
    flex: 0 0 auto; min-width: 54px; text-align: center;
    font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500;
    padding: 3px 7px; border-radius: 4px;
    border: 1.5px solid var(--ink); background: white; color: var(--ink);
  }
  .stash-bin.none { border-style: dashed; border-color: #D4A49A; color: var(--accent); font-size: 10px; font-weight: 600; }
  .stash-bin.powder { border-color: #D4B07A; background: var(--gold-light); color: var(--gold); font-size: 10px; font-weight: 600; }
  .stash-info { flex: 1 1 auto; min-width: 0; }
  .stash-name { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .stash-sub { font-size: 10.5px; color: #8B7D72; margin-top: 2px; line-height: 1.45; }
  .mix-formula { font-family: 'DM Mono', monospace; font-size: 10.5px; color: #6B5E52; margin-top: 2px; line-height: 1.4; }
  .mix-formula .draft { font-family: Inter, sans-serif; font-size: 9px; font-weight: 700; color: #B07D2A; background: #F5EDD8; border-radius: 3px; padding: 0 4px; margin-left: 4px; }
  .ing-row { display: flex; gap: 8px; align-items: baseline; padding: 4px 0 4px 18px; border-top: 1px dashed #E8DFD4; font-size: 11.5px; }

<script>
function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ── Mixed-dye bin codes — KEEP BYTE-IDENTICAL ACROSS WIDGETS ──
   The made-dye shelf is M-A1 .. M-D4: letters are columns, numbers are rows,
   matching back stock. Every widget that reads Dye_Stock.Bin_Location must
   normalise before displaying OR grouping. Skipping it is what let one drawer
   show up as several bins: "5", "b3", "B-3" and "M-B3" are all one place, and
   an un-normalised group key splits them into four.

   Only Dye_Stock goes through here. Back stock bins (bare A1-D7) are a
   different rack, are not being renamed, and must NOT be passed to normBin. */
const DYE_BIN_ROWS = 4, DYE_BIN_COLS = 4;
const BIN_LETTERS = 'ABCDEFGHIJKL';
const NO_BIN = '(no bin)';

// Fills down a column before moving to the next. Keyed on ROWS, not COLS, so
// widening the shelf later appends new letters instead of remapping every code.
function dyeBinCode(index0) {
  const col = Math.floor(index0 / DYE_BIN_ROWS);
  const row = index0 % DYE_BIN_ROWS;
  return 'M-' + BIN_LETTERS[col] + (row + 1);
}
function normBin(raw) {
  const s = String(raw || '').trim().toUpperCase().replace(/[\s\-_.]/g, '');
  if (!s) return '';
  let m = /^M?([A-L])(\d{1,2})$/.exec(s);
  if (m) return 'M-' + m[1] + Number(m[2]);
  m = /^(\d{1,3})$/.exec(s);
  if (m) {
    const n = Number(m[1]);
    if (n >= 1 && n <= DYE_BIN_ROWS * DYE_BIN_COLS) return dyeBinCode(n - 1);
  }
  return String(raw).trim();   // off-grid / unrecognised — left alone, never invented
}
// Shelf position, for sorting. Off-grid codes sort last instead of colliding at 0.
function binOrder(code) {
  const m = /^M-([A-L])(\d{1,2})$/.exec(String(code || ''));
  if (!m) return 9000;
  return BIN_LETTERS.indexOf(m[1]) * DYE_BIN_ROWS + (Number(m[2]) - 1);
}
function binSortFn(a, b) {
  const d = binOrder(a) - binOrder(b);
  return d !== 0 ? d : String(a).localeCompare(String(b));
}
// Display form. One empty-bin string everywhere, so the label a worker reads is
// the same label the grouping used.
function binLabel(raw) {
  return normBin(raw) || NO_BIN;
}
// First grid position with nothing in it. Returns '' when the shelf is full, so
// the caller can say so instead of inventing an M-E1 that does not exist.
function nextFreeBin(binGroups) {
  for (let i = 0; i < DYE_BIN_ROWS * DYE_BIN_COLS; i++) {
    const code = dyeBinCode(i);
    if (!binGroups[code] || !binGroups[code].length) return code;
  }
  return '';
}

/* Column-resolution helpers, same contracts as the other widgets: never read a
   hardcoded column name, so a rename in Grist degrades to a blank cell instead
   of a silent undefined. */
function columnAsArray(t, col) { return col && Array.isArray(t[col]) ? t[col] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k =>
      k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function stockRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
// Mixed_Date arrives as epoch seconds from the date column, but hand-entered
// rows and older imports can carry a string — both have to age correctly.
function stockDaysAgo(dateVal) {
  if (!dateVal) return null;
  const ms = typeof dateVal === 'number' ? dateVal * 1000 : new Date(dateVal).getTime();
  if (!ms || isNaN(ms)) return null;
  return Math.floor((Date.now() - ms) / 86400000);
}
function stockDateSort(v) {
  if (!v) return 0;
  return typeof v === 'number' ? v : (new Date(v).getTime() / 1000 || 0);
}
function stockShortDate(v) {
  if (!v) return '';
  const d = typeof v === 'number' ? new Date(v * 1000) : new Date(v);
  if (isNaN(d)) return '';
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}

const DYE_COLORS = {
  red:'#C8294A',rhodamine:'#D83060',pink:'#E84080',fuschia:'#D83060',fuchsia:'#D83060',
  blue:'#2060C8',aqua:'#20A0C8',teal:'#20A890',turquoise:'#20B2A0',
  green:'#40A840',yellow:'#E8D020',orange:'#E87020',purple:'#8040C8',
  black:'#2A2A2A',brown:'#8B5A2B',gold:'#C8A020',coral:'#E05040',
  mint:'#40C890',lavender:'#A080C8',navy:'#203080',forest:'#2A6040',
  grey:'#888780',gray:'#888780',white:'#F0EDE8',silver:'#A0A0A8',
  scarlet:'#C82020',crimson:'#A01830',magenta:'#C030A0',violet:'#6030C0',
  cerulean:'#2080C0',cobalt:'#2048A8',emerald:'#208050',sage:'#80A870',
  ecru:'#C8B890',cream:'#F0EAD0',caramel:'#C08040',russet:'#904030'
};

function guessColor(name) {
  if (!name || typeof name !== 'string') return '#888780';
  const l = name.toLowerCase();
  for (const [k,v] of Object.entries(DYE_COLORS)) {
    if (l.includes(k)) return v;
  }
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xFFFFFF;
  return '#' + ((h & 0xBFBFBF) | 0x404040).toString(16).padStart(6,'0');
}

function togglePreviewPicker() {
  previewPickerOpen = !previewPickerOpen;
  renderLeft();
}

async function selectPreviewPhoto(photoId) {
  const previousId = currentPreviewId;
  const actions = [];
  if (previousId && previousId !== photoId) {
    actions.push(['UpdateRecord', 'Product_Photos', previousId, { Is_Preview: false }]);
  }
  if (previousId !== photoId) {
    actions.push(['UpdateRecord', 'Product_Photos', photoId, { Is_Preview: true }]);
  }

  if (actions.length) {
    try {
      await grist.docApi.applyUserActions(actions);
    } catch (e) {
      console.error('Failed to update preview photo:', e);
      alert('Could not update the preview photo — check the widget has full document access.');
      return;
    }
  }

  currentProductPhotos = currentProductPhotos.map(p => ({ ...p, isPreview: p.id === photoId }));
  const selected = currentProductPhotos.find(p => p.id === photoId);
  currentPreviewUrl = selected ? selected.url : null;
  currentPreviewId = photoId;
  previewPickerOpen = false;
  renderLeft();
}

function toggleBigView() {

}

let currentYardage = 100;
let currentRecipe = null;
let currentComponents = [];
let setupOpen = false;   // the dye mix / premade-locations pop-out
function openSetup() {
  setupOpen = true;
  stashOpen = true;
  if (!stashState && !stashLoading) loadStash(); else renderLeft();
}
function closeSetup() { setupOpen = false; renderLeft(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && setupOpen) closeSetup(); });
let currentMix = { partsByMix: {}, mixInfo: {}, dye: {} };   // custom dye formulas (dye-mix.js)
/* "= 2 Hot Fuchsia (J 1-160) : 1.5 Sun Yellow (Pro 1-80) : …" under a custom dye. */
function mixLineHtml(dyeId) {
  if (!window.DyeMix || !DyeMix.isMix(currentMix, dyeId)) return '';
  const info = currentMix.mixInfo[dyeId] || {};
  return `<div class="mix-formula">= ${esc(DyeMix.formula(currentMix, dyeId))}${info.form === 'Dry' ? ' · mix powders' : ''}${info.confirmed ? '' : '<span class="draft" title="Formula not checked yet in the Dye Library">draft</span>'}</div>`;
}
let currentPhotoIndex = 0;
let currentPreviewUrl = null;
let currentBaseSegments = [];
let currentOverlayMarks = [];
let currentSpoolStats = { needed: 0, made: 0, perOrder: [] };
let currentShopifyUrl = '';
let currentHistoryEntries = [];
let currentPreviewId = null;
let currentProductPhotos = [];
let previewPickerOpen = false;

// Premade-dye locations. Fetched the first time the panel is opened rather than
// on every recipe click: the panel is for the occasional off-plan manual run, so
// clicking through recipes must stay as cheap as it is now. The fetched tables
// are cached for the session and re-read by the ↻ button, since a jar that moves
// bins while this widget sits open would otherwise keep pointing at the old one.
let stashOpen = false;
let stashState = null;        // { jarsByDye, dye } once loaded
let stashLoading = false;
let stashError = '';

function getPhotoList(r) {
  const list = [];
  if (r.Photo_Process_1) list.push({ url: r.Photo_Process_1, label: 'Step 1', note: r.Photo_Process_1_Note });
  if (r.Photo_Process_2) list.push({ url: r.Photo_Process_2, label: 'Step 2', note: r.Photo_Process_2_Note });
  if (r.Photo_Finished) list.push({ url: r.Photo_Finished, label: 'Finished', note: r.Photo_Finished_Note });
  // Inspiration sits last — there for reference, not the first thing you see.
  if (r.Photo_Inspiration) list.push({ url: r.Photo_Inspiration, label: 'Inspiration', note: r.Photo_Inspiration_Note });
  return list;
}

const PHOTO_SLOT_MAP = {
  'Step 1': { photoField: 'Photo_Process_1', noteField: 'Photo_Process_1_Note' },
  'Step 2': { photoField: 'Photo_Process_2', noteField: 'Photo_Process_2_Note' },
  'Finished': { photoField: 'Photo_Finished', noteField: 'Photo_Finished_Note' },
  'Inspiration': { photoField: 'Photo_Inspiration', noteField: 'Photo_Inspiration_Note' },
};

function renderPhotoViewer() {
  const wrap = document.getElementById('photoViewerWrap');
  if (!wrap || !currentRecipe) return;

  const photos = getPhotoList(currentRecipe);
  if (!photos.length) { wrap.innerHTML = ''; return; }
  if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;

  const p = photos[currentPhotoIndex];
  const dotsHTML = photos.length > 1
    ? `<div class="viewer-dots">${photos.map((_, i) =>
        `<span class="viewer-dot ${i === currentPhotoIndex ? 'active' : ''}" onclick="event.stopPropagation(); jumpToPhoto(${i})"></span>`
      ).join('')}</div>`
    : '';

  wrap.innerHTML = `
    <div class="photo-viewer" onclick="nextPhoto()" title="${photos.length > 1 ? 'Click for next photo' : ''}">
      <img src="${p.url}" alt="${esc(p.label)}" onerror="this.style.display='none'">
      <div class="viewer-caption">
        <span class="viewer-label">${esc(p.label)}${photos.length > 1 ? ` · ${currentPhotoIndex + 1}/${photos.length}` : ''}</span>
        ${p.note ? `<span class="photo-note">${esc(p.note)}</span>` : ''}
      </div>
      <button class="viewer-undo-btn" onclick="event.stopPropagation(); sendPhotoToReview('${esc(p.label)}')" title="Send this photo back to the inbox for re-review">↩ Redo</button>
    </div>
    ${dotsHTML}
  `;
}

function nextPhoto() {
  const photos = getPhotoList(currentRecipe || {});
  if (photos.length < 2) return;
  currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
  renderPhotoViewer();
}

function jumpToPhoto(i) {
  currentPhotoIndex = i;
  renderPhotoViewer();
}

const UNFILE_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/unfile-photo';

async function sendPhotoToReview(label) {
  const slot = PHOTO_SLOT_MAP[label];
  if (!slot || !currentRecipe) return;

  const url = currentRecipe[slot.photoField];
  if (!url) return;

  let sourcePath;
  try {
    sourcePath = decodeURIComponent(new URL(url).searchParams.get('path'));
  } catch (e) {
    console.error('Could not parse source path from URL:', url);
    alert('Could not determine the file location for this photo — it may not use the standard proxy URL format.');
    return;
  }

  if (!confirm(`Send this "${label}" photo back to the inbox for re-review? It will be removed from this recipe until you re-file it.`)) return;

  try {
    const res = await fetch(UNFILE_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source_path: sourcePath,
        recipe_id: currentRecipe.id,
        photo_field: slot.photoField,
        note_field: slot.noteField,
      }),
    });
    if (!res.ok) throw new Error('Webhook returned ' + res.status);

    currentRecipe[slot.photoField] = '';
    currentRecipe[slot.noteField] = '';
    currentPhotoIndex = 0;
    renderLeft();
  } catch (e) {
    console.error('Send to review failed:', e);
    alert('Could not send this photo back for review — is the n8n webhook live?');
  }
}

// Read a field off a Grist row/record object by trying candidate column ids,
// matched ignoring case and non-alphanumerics — so a rename doesn't break it.
function rowField(row, candidates) {
  if (!row) return undefined;
  const keys = Object.keys(row);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return row[hit];
  }
  return undefined;
}

function calcTsp(base) {
  if (!base || isNaN(base)) return '—';
  const v = parseFloat(base) * currentYardage / 100;
  if (v <= 0) return '—';
  if (v <= 0.125) return '⅛ tsp';
  if (v <= 0.25) return '¼ tsp';
  if (v <= 0.375) return '⅜ tsp';
  if (v <= 0.5) return '½ tsp';
  if (v <= 0.75) return '¾ tsp';
  if (Number.isInteger(v)) return `${v} tsp`;
  return `${v.toFixed(1)} tsp`;
}

function calcMl(base) {
  if (!base || isNaN(base)) return '—';
  const v = parseFloat(base) * currentYardage / 100;
  if (v <= 0) return '—';
  return `${Math.round(v)} mL`;
}

function setYardage(val, btn) {
  currentYardage = val;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('customInput').value = '';
  if (currentRecipe) renderLeft();
}

function setCustomYardage(val) {
  const n = parseInt(val);
  if (n > 0) {
    currentYardage = n;
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    if (currentRecipe) renderLeft();
  }
}

function mixColors(hex1, hex2, ratioTo2) {
  const c1 = parseInt(hex1.replace('#', ''), 16);
  const c2 = parseInt(hex2.replace('#', ''), 16);
  const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
  const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
  const t = Math.max(0, Math.min(100, ratioTo2)) / 100;
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function ringGetMidPct(startPct, endPct) {
  let end = endPct;
  if (end <= startPct) end += 100;
  return ((startPct + end) / 2) % 100;
}

function ringAbbreviateLabel(name, widthDeg) {
  if (!name) return '';
  const maxChars = widthDeg < 18 ? 3 : widthDeg < 32 ? 6 : widthDeg < 55 ? 10 : 16;
  if (name.length <= maxChars) return name;
  return name.slice(0, Math.max(1, maxChars - 1)) + '…';
}

function ringPolarToCartesian(cx, cy, r, angleDeg) {
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
}

function ringDescribeAnnulusSector(cx, cy, rOuter, rInner, startPct, endPct) {
  let startAngle = (startPct / 100) * 360;
  let endAngle = (endPct / 100) * 360;
  if (endAngle <= startAngle) endAngle += 360;
  if (endAngle - startAngle > 359.9) endAngle = startAngle + 359.9;
  const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;
  const outerStart = ringPolarToCartesian(cx, cy, rOuter, startAngle);
  const outerEnd = ringPolarToCartesian(cx, cy, rOuter, endAngle);
  const innerEnd = ringPolarToCartesian(cx, cy, rInner, endAngle);
  const innerStart = ringPolarToCartesian(cx, cy, rInner, startAngle);
  return [
    `M ${outerStart.x} ${outerStart.y}`,
    `A ${rOuter} ${rOuter} 0 ${largeArc} 1 ${outerEnd.x} ${outerEnd.y}`,
    `L ${innerEnd.x} ${innerEnd.y}`,
    `A ${rInner} ${rInner} 0 ${largeArc} 0 ${innerStart.x} ${innerStart.y}`,
    'Z'
  ].join(' ');
}

/* Uneven repeat warning — KEEP IN STEP WITH recipe-builder.html.
   Whether a colourway tiles changes how it is wound, and this card is what gets
   looked at while making the product — so the warning matters more here than in
   the builder. 34 of the 50 layouts in the document are uneven, which makes it
   the common case rather than an exception, but it still has to be noticed.

   Only the uneven case says anything. An even repeat needs no comment.

   Judged on the SEQUENCE of dyes, not their widths. Widths were compared at
   first and it was wrong twice over: boundaries are dragged by hand so the same
   band differs by a percent or two between passes, and the last segment wraps
   through zero, giving it a negative width that no comparison survives. Acadia
   tiles cleanly three times and was being called uneven on both counts.
   "Uneven" here means the counts or the order differ \u2014 which is what it means
   at the bench. */
function normRepeatName(v) {
  return String(v == null ? '' : v).toLowerCase().replace(/[^a-z0-9]/g, '');
}

function isUnevenRepeat(segs) {
  if (!segs || segs.length < 2) return false;
  const names = segs.map(x => normRepeatName(x.dyeName));
  if (new Set(names).size === names.length) return false;   // nothing repeats
  for (let n = 2; n <= names.length; n++) {
    if (names.length % n) continue;
    const per = names.length / n;
    let ok = true;
    for (let r = 1; r < n && ok; r++) {
      for (let k = 0; k < per; k++) {
        if (names[k] !== names[r * per + k]) { ok = false; break; }
      }
    }
    if (ok) return false;   // the sequence tiles
  }
  return true;
}

function buildLayoutRingSvg(baseSegs, overlays) {
  const CX = 200, CY = 200;
  const BASE_R_OUT = 160, BASE_R_IN = 100;
  const OVERLAY_R_OUT = 185, OVERLAY_R_IN = 165;

  let inner = '<defs><pattern id="cardBlendHatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="rgba(255,255,255,0.6)" stroke-width="2.5"></line></pattern></defs>';

  baseSegs.forEach((seg, idx) => {
    const path = ringDescribeAnnulusSector(CX, CY, BASE_R_OUT, BASE_R_IN, seg.startPct, seg.endPct);
    let fill;
    if (seg.type === 'Space') {
      fill = '#F0EDE8';
    } else if (seg.type === 'Blend') {
      const n = baseSegs.length;
      const prevColor = guessColor(baseSegs[(idx - 1 + n) % n].dyeName);
      const nextColor = guessColor(baseSegs[(idx + 1) % n].dyeName);
      fill = mixColors(prevColor, nextColor, seg.blendRatio ?? 50);
    } else {
      fill = guessColor(seg.dyeName);
    }
    inner += `<path d="${path}" fill="${fill}" stroke="white" stroke-width="1"></path>`;
    if (seg.type === 'Blend') {
      inner += `<path d="${path}" fill="url(#cardBlendHatch)"></path>`;
    }
  });

  overlays.forEach(mark => {
    const path = ringDescribeAnnulusSector(CX, CY, OVERLAY_R_OUT, OVERLAY_R_IN, mark.startPct, mark.endPct);
    const app = mark.applicationType || 'Dye';
    const col = guessColor(mark.dyeName);
    if (!/^Powder/.test(app)) { inner += `<path d="${path}" fill="${col}" stroke="white" stroke-width="1"></path>`; return; }
    // Same drawing as the layout designer: speckles = scattered, lines = stripes.
    inner += `<path d="${path}" fill="${col}" fill-opacity="0.12" stroke-dasharray="3,2" stroke="#B9AC9D" stroke-width="1"></path>`;
    let a0 = mark.startPct, a1 = mark.endPct; if (a1 <= a0) a1 += 100;
    const span = a1 - a0;
    if (app === 'Powder' || /scattered/.test(app)) {
      let seed = 1 + Math.round(a0 * 1000) % 9973;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const dots = Math.max(6, Math.round(span * 2.2));
      for (let k = 0; k < dots; k++) {
        const p = ringPolarToCartesian(CX, CY, OVERLAY_R_IN + 2 + rnd() * (OVERLAY_R_OUT - OVERLAY_R_IN - 4), ((a0 + rnd() * span) / 100) * 360);
        inner += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(1.1 + rnd() * 1.1).toFixed(1)}" fill="${col}"></circle>`;
      }
    }
    if (/stripes/.test(app)) {
      const n = Math.max(1, Math.min(40, Number(mark.stripes) || 5));
      for (let k = 0; k < n; k++) {
        const deg = ((a0 + span * (k + 0.5) / n) / 100) * 360;
        const p = ringPolarToCartesian(CX, CY, OVERLAY_R_IN - 1, deg), q = ringPolarToCartesian(CX, CY, OVERLAY_R_OUT + 1, deg);
        inner += `<line x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="${col}" stroke-width="3" stroke-linecap="round"></line>`;
      }
    }
  });

  baseSegs.forEach((seg, idx) => {
    let widthPct = seg.endPct - seg.startPct;
    if (widthPct <= 0) widthPct += 100;
    const widthDeg = (widthPct / 100) * 360;
    const label = seg.type === 'Blend'
      ? (widthDeg < 22 ? '⇄' : `⇄ ${Math.round(seg.blendRatio ?? 50)}%`)
      : ringAbbreviateLabel(seg.dyeName, widthDeg);
    if (label) {
      const midPct = ringGetMidPct(seg.startPct, seg.endPct);
      const pt = ringPolarToCartesian(CX, CY, (BASE_R_OUT + BASE_R_IN) / 2, (midPct / 100) * 360);
      inner += `<text x="${pt.x}" y="${pt.y}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-family="Inter, sans-serif" font-weight="600" fill="white" stroke="rgba(0,0,0,0.55)" stroke-width="3" paint-order="stroke">${esc(label)}</text>`;
    }
  });

  overlays.forEach(mark => {
    const midPct = ringGetMidPct(mark.startPct, mark.endPct);
    const label = ringAbbreviateLabel(mark.dyeName, 22);
    if (label) {
      const pt = ringPolarToCartesian(CX, CY, OVERLAY_R_OUT + 9, (midPct / 100) * 360);
      inner += `<text x="${pt.x}" y="${pt.y}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-family="Inter, sans-serif" font-weight="600" fill="#6B5E52">${esc(label)}</text>`;
    }
  });

  inner += `<circle cx="${CX}" cy="${CY}" r="${BASE_R_IN - 10}" fill="#F7F3EE"></circle>`;

  const displaySize = document.body.classList.contains('big-mode') ? 440 : 340;
  return `<svg viewBox="0 0 400 400" width="${displaySize}" height="${displaySize}">${inner}</svg>`;
}

/* ── PREMADE DYE LOCATIONS ──
   For the manual run that was never put on a work order: where each of this
   recipe's dyes is sitting right now, and therefore where it goes back at the
   end. Read-only on purpose — nothing here writes to Grist, so using it off the
   normal flow cannot leave the production tables in a half-logged state.

   Keyed on the dye's Grist row ID, never its name: 26 names are shared across
   brands, so a name-keyed lookup would happily point at the wrong brand's jar. */
async function loadStash() {
  stashLoading = true;
  stashError = '';
  renderLeft();
  try {
    const [stkT, dyeT] = await Promise.all([
      grist.docApi.fetchTable('Dye_Stock'),
      grist.docApi.fetchTable('Dyes'),
    ]);

    const S = {
      dye: findColumn(stkT, ['Dye']),
      qty: findColumn(stkT, ['Quantity_mL']),
      mixed: findColumn(stkT, ['Mixed_Date']),
      bin: findColumn(stkT, ['Bin_Location']),
    };
    const D = {
      name: findColumn(dyeT, ['Dye_Name']),
      brand: findColumn(dyeT, ['Brand']),
      serial: findColumn(dyeT, ['Serial']),
      // Both spellings are in the wild across the doc's history.
      shelf: findColumn(dyeT, ['Shelf_Life_days', 'Shelf_Life_days_']),
    };
    if (!S.dye) throw new Error('Dye_Stock has no Dye column');

    const dye = {};
    (dyeT.id || []).forEach((id, i) => {
      dye[id] = {
        name: columnAsArray(dyeT, D.name)[i] || '',
        brand: columnAsArray(dyeT, D.brand)[i] || '',
        serial: columnAsArray(dyeT, D.serial)[i] || '',
        shelf: Number(columnAsArray(dyeT, D.shelf)[i]) || 0,
      };
    });

    const jarsByDye = {};
    (stkT.id || []).forEach((id, i) => {
      const did = stockRefId(columnAsArray(stkT, S.dye)[i]);
      if (!did) return;
      (jarsByDye[did] = jarsByDye[did] || []).push({
        id,
        qty: Number(columnAsArray(stkT, S.qty)[i]) || 0,
        mixed: columnAsArray(stkT, S.mixed)[i] || '',
        bin: normBin(columnAsArray(stkT, S.bin)[i]),
      });
    });
    // One jar per dye is the rule, so a second row is a stale record rather than
    // a second container. Newest first, and the count gets flagged on the row.
    Object.values(jarsByDye).forEach(a => a.sort((x, y) => stockDateSort(y.mixed) - stockDateSort(x.mixed)));

    stashState = { jarsByDye, dye };
  } catch (e) {
    console.error('Failed to load premade dye locations:', e);
    stashState = null;
    stashError = (e && e.message) ? e.message : String(e);
  }
  stashLoading = false;
  renderLeft();
}

function toggleStash() {
  stashOpen = !stashOpen;
  if (stashOpen && !stashState && !stashLoading) { loadStash(); return; }
  renderLeft();
}

function refreshStash() {
  if (stashLoading) return;
  stashState = null;
  loadStash();
}

/* One line per dye in the recipe, deduped by dye row ID — a dye used at two
   steps is still one jar in one bin, and listing it twice would read as two. */
function buildStashLines() {
  const seen = new Map();
  [...currentComponents]
    .sort((a, b) => (a.Step_Number || 99) - (b.Step_Number || 99))
    .forEach(c => {
      const key = c.Dye_Id || ('name:' + (c.Dye_Name || ''));
      const rate = Number(c.Effective_mL_per_100_yd) || Number(c.Default_mL_per_100_yds) || 0;
      const existing = seen.get(key);
      if (existing) {
        existing.need += rate * (currentYardage / 100);
        if (!existing.isPowder && c.Is_Powder) existing.isPowder = true;
        return;
      }
      seen.set(key, {
        dyeId: c.Dye_Id || null,
        name: c.Dye_Name || '',
        dilution: c.Dilution_Ratio || '',
        isPowder: !!c.Is_Powder,
        need: rate * (currentYardage / 100),
      });
    });

  return [...seen.values()].map(line => {
    const rec = line.dyeId && stashState ? stashState.dye[line.dyeId] : null;
    const jars = line.dyeId && stashState ? (stashState.jarsByDye[line.dyeId] || []) : [];
    const jar = jars.find(j => j.qty > 0) || jars[0] || null;
    const age = jar ? stockDaysAgo(jar.mixed) : null;
    const shelf = rec ? rec.shelf : 0;
    return {
      ...line,
      brand: rec ? rec.brand : '',
      serial: rec ? rec.serial : '',
      jar,
      dupes: jars.length > 1 ? jars.length : 0,
      age,
      expired: shelf > 0 && age !== null && age > shelf,
      shelf,
      empty: !!jar && jar.qty <= 0,
      short: !!jar && jar.qty > 0 && line.need > 0 && jar.qty < line.need,
      // A dye with no row ID can't be looked up at all — say that rather than
      // reporting "no premade jar", which would be a guess dressed as a fact.
      unresolved: !line.dyeId,
      ingredients: mixIngredients(line.dyeId),
    };
  });
}

/* A custom mix's ingredients for the pull list: each one's made jar if there
   is one ("if usable"), and its powder when the mix says always pull powder or
   there's no jar to use. */
function mixIngredients(dyeId) {
  if (!window.DyeMix || !DyeMix.isMix(currentMix, dyeId)) return null;
  return DyeMix.expand(currentMix, dyeId).map(p => {
    const jars = stashState ? (stashState.jarsByDye[p.dyeId] || []) : [];
    const jar = jars.find(j => j.qty > 0) || null;
    const info = currentMix.mixInfo[p.parentMix] || {};
    const powder = !p.isMix && (info.alwaysPowder !== false || !jar || info.form === 'Dry');
    return { ...p, name: (currentMix.dye[p.dyeId] || {}).name || '?', brand: (currentMix.dye[p.dyeId] || {}).brand || '', jar, powder };
  });
}
function ingredientRowsHtml(L) {
  if (!L.ingredients || !L.ingredients.length) return '';
  return L.ingredients.map(p => {
    const pull = [];
    if (p.jar) pull.push(`made: ${esc(binLabel(p.jar.bin))} · ${p.jar.qty} mL${p.powder ? ' (if usable)' : ''}`);
    if (p.powder) pull.push('powder');
    if (p.isMix) pull.push(p.jar ? '' : 'mix it ↓');
    return `<div class="ing-row" style="padding-left:${18 * p.depth}px">
      <span class="ing-name">↳ ${esc(String(Math.round(p.parts * 1000) / 1000))}${(currentMix.mixInfo[p.parentMix] || {}).form === 'Dry' ? ' tsp' : ' mL'} ${esc(p.name)}${p.brand ? ` <span class="brand">${esc(p.brand)}</span>` : ''}${p.strength ? ` <span style="color:#8B7D72">${esc(p.strength)}</span>` : ''}</span>
      <span class="ing-pull">${pull.filter(Boolean).join(' + ') || '—'}</span>
    </div>`;
  }).join('');
}

function stashRowHtml(L) {
  const flags = [];
  if (L.dupes) flags.push(`<span class="stash-flag bad">${L.dupes} jars logged</span>`);
  if (L.expired) flags.push(`<span class="stash-flag warn">past ${L.shelf}-day shelf life</span>`);
  if (L.short) flags.push(`<span class="stash-flag warn">may not cover the run</span>`);
  if (L.jar && L.jar.qty > 0 && L.jar.qty <= 5) flags.push(`<span class="stash-flag warn">nearly empty</span>`);

  let bin, sub, qty;
  if (L.isPowder) {
    bin = `<div class="stash-bin powder">POWDER</div>`;
    sub = 'Recipe calls for dry powder — from the alphabetical powder box, not the made-dye shelf.';
    qty = `<div class="stash-have">&mdash;</div><div class="stash-need">powder shelf</div>`;
  } else if (L.unresolved) {
    bin = `<div class="stash-bin none">NO DYE<br>RECORD</div>`;
    sub = 'This component does not point at a row in the Dyes table, so there is nothing to look up. Fix the link in Recipe Dye Components.';
    qty = `<div class="stash-have">&mdash;</div><div class="stash-need">&nbsp;</div>`;
  } else if (!L.jar) {
    bin = `<div class="stash-bin none">NO<br>PREMADE</div>`;
    sub = L.ingredients ? 'No jar of this mix — make it from the ingredients below.' : 'No jar logged for this dye — mix it from powder.';
    qty = `<div class="stash-have">&mdash;</div><div class="stash-need">${L.need > 0 ? 'need ~' + Math.round(L.need) + ' mL' : 'no rate set'}</div>`;
  } else if (L.empty) {
    bin = `<div class="stash-bin">${esc(binLabel(L.jar.bin))}</div>`;
    sub = 'Jar is logged as empty — mix from powder, and the empty goes back to this bin.';
    qty = `<div class="stash-have">0 mL</div><div class="stash-need">${L.need > 0 ? 'need ~' + Math.round(L.need) + ' mL' : 'no rate set'}</div>`;
  } else {
    bin = `<div class="stash-bin">${esc(binLabel(L.jar.bin))}</div>`;
    sub = L.ingredients ? 'Mix on the shelf — the ingredients are listed below in case it needs topping up or remaking.' : '';
    qty = `<div class="stash-have">${L.jar.qty} mL</div>
      <div class="stash-need">${L.need > 0 ? 'need ~' + Math.round(L.need) + ' mL' : 'no rate set'}${
        L.jar.mixed ? ' · mixed ' + esc(stockShortDate(L.jar.mixed)) : ''}</div>`;
  }

  const ident = [L.brand, L.serial, L.dilution].filter(Boolean).map(esc).join(' · ');

  return `<div class="stash-row">
    ${bin}
    <div class="stash-info">
      <div class="stash-name">
        <span class="swatch" style="background:${guessColor(L.name)}"></span>
        ${esc(L.name || '(unnamed dye)')}
        ${flags.join('')}
      </div>
      ${ident ? `<div class="stash-sub">${ident}</div>` : ''}
      ${sub ? `<div class="stash-sub">${esc(sub)}</div>` : ''}
    </div>
    <div class="stash-qty">${qty}</div>
  </div>`;
}

function stashBodyHtml() {
  if (stashLoading) return `<div class="no-data">Reading Dye Stock…</div>`;
  if (stashError) {
    return `<div class="no-data">Could not read Dye Stock — ${esc(stashError)}.
      The rest of the card is unaffected.</div>`;
  }
  if (!stashState) return `<div class="no-data">Not loaded yet.</div>`;
  if (!currentComponents.length) {
    return `<div class="no-data">This recipe has no dye components, so there is nothing to locate.</div>`;
  }

  const lines = buildStashLines();
  // Powder lines are excluded even when a jar happens to exist for that dye: the
  // recipe calls for dry powder, so sending someone to the made-dye shelf for it
  // would contradict the row directly beneath.
  const bins = [...new Set(
    lines.filter(L => !L.isPowder && L.jar && L.jar.qty > 0 && L.jar.bin).map(L => L.jar.bin)
  )].sort(binSortFn);
  const missing = lines.filter(L => !L.isPowder && !L.unresolved && (!L.jar || L.empty)).length;
  const powders = lines.filter(L => L.isPowder).length;
  const noBin = lines.some(L => L.jar && L.jar.qty > 0 && !L.jar.bin);

  const walkBits = [];
  if (bins.length) walkBits.push(`Bins to visit: ${bins.map(b => `<b>${esc(b)}</b>`).join(' · ')}`);
  if (noBin) walkBits.push('one jar has no bin recorded — give it one in Dye Stock');
  if (missing) walkBits.push(`${missing} to mix from powder`);
  if (powders) walkBits.push(`${powders} called for as dry powder`);

  return `
    ${walkBits.length ? `<div class="stash-walk">${walkBits.join(' &nbsp;·&nbsp; ')}</div>` : ''}
    ${lines.map(L => stashRowHtml(L) + ingredientRowsHtml(L)).join('')}
    <div class="stash-foot">Put-back: each jar returns to the bin shown beside it.
      Nothing on this panel writes to Grist — if you mix a fresh jar or move one, log it in Dye Stock.</div>
  `;
}

function stashPanelHtml() {
  const count = currentComponents.length;
  return `
    <div class="stash-wrap ${stashOpen ? 'open' : ''}">
      <button class="stash-toggle" onclick="toggleStash()">
        <span class="stash-caret">▶</span>
        <span>Premade dye locations</span>
        <span class="stash-count">${count} dye${count === 1 ? '' : 's'}${
          stashOpen && stashState ? ` <span class="stash-refresh" onclick="event.stopPropagation(); refreshStash()">↻ refresh</span>` : ''
        }</span>
      </button>
      ${stashOpen ? `<div class="stash-body">${stashBodyHtml()}</div>` : ''}
    </div>`;
}

function renderLeft() {
  const r = currentRecipe;
  const comps = [...currentComponents].sort((a,b) => (a.Step_Number||99) - (b.Step_Number||99));

  const tags = [
    r.Dye_Method ? `<span class="meta-tag tag-method">${esc(r.Dye_Method)}</span>` : '',
    r.Fiber_Type ? `<span class="meta-tag tag-fiber">${r.Fiber_Type}</span>` : '',
    r.Recipe_Scope ? `<span class="meta-tag tag-scope">${esc(r.Recipe_Scope)}</span>` : '',
    // Year the colourway was made. Reference rather than something to act on,
    // so it sits quietly at the end of the meta row.
    r.Year_Made ? `<span class="meta-tag tag-year">${esc(String(r.Year_Made).trim())}</span>` : '',
  ].join('');

  const dyeRows = comps.map(c => {
    const col = guessColor(c.Dye_Name || '');
    const brand = (c.Dye_Full || '').match(/\(([A-Za-z]+)\)/);
    return `<tr>
      <td><div class="dye-name-cell">
        <span class="swatch" style="background:${col}"></span>
        ${esc(c.Dye_Name || '—')}
        ${brand ? `<span class="brand">${brand[1]}</span>` : ''}
      </div></td>
      ${window.DyeMix && DyeMix.isMix(currentMix, c.Dye_Id)
        ? `<td colspan="3" class="mix-cell">${mixLineHtml(c.Dye_Id)}</td>`
        : `<td><span class="amt">${calcTsp(rowField(c, ['Std_Powder_tsp_']))}</span></td>
      <td><span class="amt">${calcMl(rowField(c, ['Std_Water_mL_']))}</span></td>
      <td><span class="amt">${calcMl(rowField(c, ['Effective_mL_per_100_yd']) || rowField(c, ['Default_mL_per_100_yds']))}</span></td>`}
      <td>${c.Is_Powder ? `<span class="dil" style="background:#EFE7D8;color:#8A6D2A;">powder</span>` : (c.Dilution_Ratio ? `<span class="dil">${c.Dilution_Ratio}</span>` : '')}</td>
    </tr>`;
  }).join('');

  const previewPickerHTML = previewPickerOpen ? `
    <div class="preview-picker-dropdown">
      ${currentProductPhotos.length ? currentProductPhotos.map(p => `
        <div class="preview-picker-row ${p.isPreview ? 'selected' : ''}" onclick="selectPreviewPhoto(${p.id})">
          <img src="${p.url}" alt="${esc(p.filename || '')}" onerror="this.style.opacity=0.2">
          <div class="preview-picker-info">
            <div class="ppr-name">${esc(p.filename || 'Untitled')}</div>
            ${p.isPreview ? '<div class="ppr-current">current preview</div>' : ''}
          </div>
        </div>
      `).join('') : `<div class="preview-picker-empty">No product photos filed for this recipe yet</div>`}
    </div>
  ` : '';

function toggleStep(el) {
  el.classList.toggle('done');
  updateProgress();
}

function updateProgress() {
  const steps = document.querySelectorAll('.step-item');
  const done = [...steps].filter(s => s.classList.contains('done')).length;
  const l = document.getElementById('progLabel');
  const f = document.getElementById('progFill');
  if (l) l.textContent = `${done} of ${steps.length} done`;
  if (f) f.style.width = steps.length ? `${Math.round(done/steps.length*100)}%` : '0%';
}

function resetSteps() {
  document.querySelectorAll('.step-item').forEach(s => s.classList.remove('done'));
  updateProgress();
}

/* ══ KETTLE DYE (solid colours) ═════════════════════════════════════════════
   Recipes whose Dye_Method is "Kettle Dye" show this panel on the right in
   place of the hand-dye layout. Set up in Recipe Builder's Kettle section:
     Recipes.Kettle_Temp_F / Kettle_Heat_min, Kettle_Dyes (one row per dye),
     Kettle_Steps (timer; none = standard steps).
   Dye always goes in as STOCK SOLUTION made fresh at the recipe's strength
   (powder in stock water) — never as powder. Pot maths, with the vinegar
   portion now just water:
     net thread = weighed − ties              (ties from Kettle_Dye_Defaults)
     water      = net × 7 × 1.1 mL            (old water + old vinegar)
     stock      = net × 7 × 1% × DOS mL, per dye
   Stock is made in whole batches of the recipe strength; what is left over
   goes into that dye's jar on the made-dye rack (Dye_Stock). */
let currentKettle = null;
const kettleState = { weight: '', spools: '', showCitric: false, showWorker: false, recipeId: null };
const KETTLE_STOCK_SPARE_ML = 5;
const KETTLE_STOCK_CONTAINER_ML = 160;   // largest container used for stock solution   // extra stock made so the pot never runs short
const KETTLE_GLASS_MAX_ML = 2000, KETTLE_METAL_MAX_ML = 13000;
const kettleTimer = { running: false, paused: false, startedAt: 0, pausedMs: 0, pauseAt: 0, events: [], fired: 0,
  totalMin: 60, recipeName: '', tick: null, done: false };
let kettleAudio = null;
const KETTLE_DEFAULT_TEMP = 185, KETTLE_DEFAULT_HEAT = 60;
const KETTLE_STANDARD_STEPS = [
  { at: 0, every: null, until: null, text: 'Thread in — stir constantly', beeps: 1 },
  { at: 5, every: null, until: null, text: 'Constant stirring done — stir every 10 min from here', beeps: 3 },
  { at: 15, every: 10, until: null, text: 'Stir', beeps: 2 },
];

/* Small self-contained notice (this card had no toast of its own). */
function kettleToast(msg) {
  let t = document.getElementById('ktToast');
  if (!t) { t = document.createElement('div'); t.id = 'ktToast';
    t.style.cssText = 'position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#1A1614;color:#fff;padding:8px 14px;border-radius:7px;font-size:13px;z-index:2000;transition:opacity .3s';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1'; clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, 2600);
}
function isKettleRecipe(r) { return /kettle/i.test(String((r && rowField(r, ['Dye_Method'])) || '')); }
function kettleFmt(n, dp) { const p = Math.pow(10, dp); return (Math.round(n * p) / p).toString(); }

async function loadKettle(recipeId) {
  const K = { recipeId, temp: null, heat: null, burner: null, name: '', dyes: [], steps: [], standardSteps: false, defaults: { ties: 2.1, burner: 3 }, spoolG: 11.27, spoolYds: 100, err: '' };
  const safe = async t => { try { return await grist.docApi.fetchTable(t); } catch (e) { return null; } };
  const [kd, ks, dy, st, df, rc, pr] = await Promise.all(['Kettle_Dyes', 'Kettle_Steps', 'Dyes', 'Dye_Stock', 'Kettle_Dye_Defaults', 'Recipes', 'Products'].map(safe));
  const g = (t, c, i) => (t && Array.isArray(t[c]) ? t[c][i] : undefined);
  if (!kd) { K.err = 'Kettle_Dyes table not found.'; return K; }
  if (rc) { const i = (rc.id || []).indexOf(recipeId); if (i >= 0) { K.temp = Number(g(rc, 'Kettle_Temp_F', i)) || null; K.heat = Number(g(rc, 'Kettle_Heat_min', i)) || null; K.burner = Number(g(rc, 'Kettle_Burner', i)) || null; K.name = g(rc, 'Recipe_Name', i) || ''; } }
  if (df && df.id && df.id.length) { K.defaults.ties = Number(g(df, 'Yarn_Ties_Weight', 0)) || 2.1; K.defaults.burner = Number(g(df, 'Large_Burner_Gauge', 0)) || 3; }
  /* Thread per spool, from Products (nylon, thread only, no spool). */
  if (pr) { const i = (pr.id || []).findIndex((id, j) => /nylon/i.test(String(g(pr, 'Fiber', j) || '')) && Number(g(pr, 'Thread_Weight_g', j)) > 0);
    if (i >= 0) { K.spoolG = Number(g(pr, 'Thread_Weight_g', i)); K.spoolYds = Number(g(pr, 'Yards_Per_Spool', i)) || 100; } }
  const dye = {};
  if (dy) (dy.id || []).forEach((id, i) => { dye[id] = { name: g(dy, 'Dye_Name', i) || '', brand: g(dy, 'Brand', i) || '',
    tsp: Number(g(dy, 'Std_Powder_tsp_', i)) || null, ml: Number(g(dy, 'Std_Water_mL_', i)) || null, g: Number(g(dy, 'Std_Dry_Weight_g_', i)) || null }; });
  const jar = {};
  if (st) {
    const S = { dye: findColumn(st, ['Dye']), qty: findColumn(st, ['Quantity_mL']), bin: findColumn(st, ['Bin_Location']), mixed: findColumn(st, ['Mixed_Date']) };
    (st.id || []).forEach((id, i) => { const d = stockRefId(columnAsArray(st, S.dye)[i]); if (!d || jar[d]) return;
      jar[d] = { id, qty: Number(columnAsArray(st, S.qty)[i]) || 0, bin: S.bin ? binLabel(columnAsArray(st, S.bin)[i]) : '', cols: S }; });
  }
  K.dyes = (kd.id || []).map((id, i) => ({ id, rec: stockRefId(g(kd, 'Recipe', i)), dyeId: stockRefId(g(kd, 'Dye', i)), dos: Number(g(kd, 'DOS_pct', i)) || 0,
    amt: Number(g(kd, 'Powder_Amount', i)) || 0, unit: g(kd, 'Powder_Unit', i) || 'tsp', grams: Number(g(kd, 'Powder_g', i)) || 0,
    water: Number(g(kd, 'Stock_Water_mL', i)) || 0, sort: Number(g(kd, 'Sort', i)) || 0, notes: g(kd, 'Notes', i) || '' }))
    .filter(r => r.rec === recipeId).sort((a, b) => a.sort - b.sort)
    .map(r => Object.assign(r, { d: dye[r.dyeId] || null, jar: jar[r.dyeId] || null }));
  K.steps = ks ? (ks.id || []).map((id, i) => ({ rec: stockRefId(g(ks, 'Recipe', i)), at: Number(g(ks, 'At_min', i)) || 0,
    every: Number(g(ks, 'Repeat_Every_min', i)) || 0, until: Number(g(ks, 'Until_min', i)) || 0, text: g(ks, 'Instruction', i) || '',
    beeps: Number(g(ks, 'Beeps', i)) || 1, sort: Number(g(ks, 'Sort', i)) || 0 })).filter(r => r.rec === recipeId) : [];
  if (!K.steps.length) { K.steps = KETTLE_STANDARD_STEPS.slice(); K.standardSteps = true; }
  return K;
}

function kettleEvents(K) {
  const heat = K.heat || KETTLE_DEFAULT_HEAT, ev = [];
  K.steps.forEach(s => {
    if (s.every > 0) { const end = s.until > 0 ? Math.min(s.until, heat) : heat;
      for (let t = s.at; t < end - 1e-9; t += s.every) ev.push({ t, text: s.text, beeps: s.beeps }); }
    else if (s.at <= heat) ev.push({ t: s.at, text: s.text, beeps: s.beeps });
  });
  ev.push({ t: heat, text: 'Done — heat time up. Check it exhausted.', beeps: 4, end: true });
  ev.sort((a, b) => a.t - b.t || (a.end ? 1 : 0) - (b.end ? 1 : 0));
  const out = [];
  ev.forEach(e => { const last = out[out.length - 1];
    if (last && Math.abs(last.t - e.t) < 1e-9) { last.text += ' · ' + e.text; last.beeps = Math.max(last.beeps, e.beeps); last.end = last.end || e.end; }
    else out.push(Object.assign({}, e)); });
  return out;
}

function kettleMaths(K) {
  const w = Number(kettleState.weight) || 0, net = Math.max(0, w - K.defaults.ties), base = net * 7;
  const spools = Math.max(0, Number(kettleState.spools) || 0), estNet = spools * K.spoolG;
  /* Stock is sized to the weighed thread once there is a weight, otherwise to
     the spool estimate, plus a 5 mL spare. Only that much gets made. */
  const planNet = net > 0 ? net : estNet;
  const water = base * 1.1;
  const dyes = K.dyes.map(r => {
    const stock = base * 0.01 * r.dos;                       // into the pot
    const need = planNet * 7 * 0.01 * r.dos;
    const make = need > 0 && r.water > 0 ? Math.ceil(need + KETTLE_STOCK_SPARE_ML) : 0;   // mL of stock to mix
    const f = r.water > 0 ? make / r.water : 0;
    const estNeed = estNet * 7 * 0.01 * r.dos;
    return Object.assign({}, r, { stock, need, make, powderG: r.grams ? r.grams * f : 0, powderAmt: r.amt * f,
      left: Math.max(0, make - (net > 0 ? stock : need)), same: kettleSameStrength(r),
      short: net > 0 && estNet > 0 && stock > estNeed + KETTLE_STOCK_SPARE_ML ? stock - (estNeed + KETTLE_STOCK_SPARE_ML) : 0 });
  });
  return { net, estNet, spools, planNet, water, dyes, total: water + dyes.reduce((t, d) => t + d.stock, 0) };
}

/* Can leftover stock go into this dye's standard jar? Only when the recipe's
   stock is the same strength as the dye's standard (within 3%). By weight
   when both have grams, otherwise by teaspoons. null = can't tell. */
function kettleSameStrength(r) {
  const d = r.d; if (!d || !d.ml || !(r.water > 0)) return null;
  const close = (a, b) => Math.abs(a - b) <= 0.03 * b;
  if (r.grams > 0 && d.g) return close(r.grams / r.water, d.g / d.ml);
  if (r.unit === 'tsp' && r.amt > 0 && d.tsp) return close(r.amt / r.water, d.tsp / d.ml);
  return null;
}
/* Stock is mixed in containers of at most 160 mL; bigger amounts are split
   into equal containers. */
function kettleMakeText(d, html) {
  const b = x => html ? `<b>${x}</b>` : x;
  const n = Math.max(1, Math.ceil(d.make / KETTLE_STOCK_CONTAINER_ML)), ml = Math.ceil(d.make / n);
  const f = n > 1 ? ml / d.make : 1;
  const powder = d.powderG ? `${kettleFmt(d.powderG * f, 2)} g powder` : `${kettleFmt(d.powderAmt * f, 2)} ${d.unit} powder`;
  return (n > 1 ? `${b(n + ' containers')}, each ` : '') + `${b(powder)} + ${b(ml + ' mL water')}`;
}
/* Where this dye's premade stock already is (the jar excess goes into). */
function kettleJarText(d, html) {
  const b = x => html ? `<b>${esc(x)}</b>` : esc(x);
  if (!d.jar) return 'no premade jar yet';
  return `premade jar in bin ${b(d.jar.bin || 'no bin set')}` + (d.same === true ? '' : ' (different strength — don’t combine)');
}
function kettleLeftoverText(d) {
  if (d.same === true) return d.jar ? `pour into the made-dye jar in bin ${d.jar.bin || '(no bin set)'}` : 'pour into a new made-dye jar, label it, put it on the made-dye rack';
  if (d.same === false) return 'DISCARD — this recipe’s stock is a different strength from the standard jar';
  return 'DISCARD — the dye’s standard strength isn’t recorded, so it can’t be combined';
}

function kettlePanelHtml() {
  const K = currentKettle;
  if (!K) return '';
  if (K.err) return `<div class="kt-box"><div class="kt-warn">${esc(K.err)}</div></div>`;
  const temp = K.temp || KETTLE_DEFAULT_TEMP, heat = K.heat || KETTLE_DEFAULT_HEAT, M = kettleMaths(K), has = M.net > 0;
  const noDyes = !K.dyes.length;
  const dyeCards = M.dyes.map(d => {
    const name = d.d ? `${esc(d.d.brand)} ${esc(d.d.name)}` : '<i>dye not set</i>';

function kettleBurner(K) { return K.burner || K.defaults.burner || 3; }
/* Glass pot up to 2,000 mL; over that the metal pot (up to 13,000 mL). */

/* Worker steps, filled in with this recipe's numbers. Shared by the on-screen
   list and the printed sheet, so the two can never disagree. Blanks to write
   in when no weight has been entered yet. */
function kettleWorkerSteps(K, M) {
  const has = M.net > 0, b = kettleBurner(K), temp = K.temp || KETTLE_DEFAULT_TEMP;

  const list = items => items.length > 1 ? `<ul>${items.map(t => `<li>${t}</li>`).join('')}</ul>` : ' ' + (items[0] || '');
  const makes = M.dyes.map(d => d.make
    ? `<b>${esc(nm(d))}</b>: ${kettleMakeText(d, true)}`

  const adds = M.dyes.map(d => has && d.dos ? `<b>${kettleFmt(d.stock, 1)} mL</b> of ${esc(nm(d))} stock` : `${blank} mL of ${esc(nm(d))} stock`);
  const lefts = M.dyes.map(d => `${esc(nm(d))}: <b>${esc(kettleLeftoverText(d))}</b>`);
  const pot = has ? (M.total > KETTLE_METAL_MAX_ML ? 'two pots — too much for one' : kettlePot(M.total) === 'metal' ? 'the METAL pot' : 'the glass pot') : 'glass pot if under 2,000 mL total, metal pot if over';

    `Once the thread is in, drop the burner to <b>${kettleFmt(b - 1, 1)}</b>.`,
    'Press <b>Start</b> on the timer and follow its instructions.',
    'Rinse the thread.',
    'Fill a container with water and <b>1 tablespoon of Synthrapol</b>. Mix the Synthrapol in until bubbly.',
    'Add the thread and leave it for <b>20 minutes</b>.',
    'Do a second rinse. If there is a lot of excess dye, use fresh water (no Synthrapol needed the second time).',

function kettleWorkerStepsHtml(K, M) {

}

/* Printable sheet: the worker steps plus the timer schedule, for the bench.

/* Timer rows for the printed sheet: repeats of the same instruction share one

function kettleTimerGroups(ev) {

let kettleRecalcT = null;
function kettleRecalcSoon() {

async function kettleLogLeftover(kettleDyeId) {
  const K = currentKettle; if (!K) return;
  const M = kettleMaths(K), d = M.dyes.find(x => x.id === kettleDyeId); if (!d || !d.dyeId) return;
  const ans = prompt(`Millilitres of ${d.d ? d.d.name : 'this dye'} going into the jar?`, String(Math.round(d.left)));
  if (ans == null) return;
  const ml = Number(ans); if (!(ml > 0)) { kettleToast('Enter the millilitres left over'); return; }
  try {
    if (d.jar) {
      const C = d.jar.cols;
      await grist.docApi.applyUserActions([['UpdateRecord', 'Dye_Stock', d.jar.id, { [C.qty || 'Quantity_mL']: Math.round((d.jar.qty + ml) * 10) / 10 }]]);
      kettleToast(`Added ${ml} mL to the jar${d.jar.bin ? ' in ' + d.jar.bin : ''} ✓`);
    } else {
      await grist.docApi.applyUserActions([['AddRecord', 'Dye_Stock', null, { Dye: d.dyeId, Quantity_mL: ml, Mixed_Date: Math.floor(Date.now() / 1000) }]]);
      kettleToast(`New jar logged (${ml} mL) — give it a bin in Dye Stock`);
    }
    const k = await loadKettle(K.recipeId); if (currentKettle && currentKettle.recipeId === K.recipeId) { currentKettle = k; kettleRedraw(); }
  } catch (e) { console.error('Leftover log failed', e); kettleToast('Could not log it — check Dye_Stock'); }
}

/* ── Timer ── Calls out each step at its minute, from the recipe's steps. */
function kettleElapsedMs() { const T = kettleTimer; if (!T.running) return 0; return (T.paused ? T.pauseAt : Date.now()) - T.startedAt - T.pausedMs; }
function kettleClock(ms) { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function kettleTimerHtml() {
  const T = kettleTimer, K = currentKettle;
  if (!T.running) {
    const ev = K ? kettleEvents(K) : [];
    return `<div class="kt-h2">Timer</div>
      <ol class="kt-plan">${ev.slice(0, 8).map(e => `<li><b>${kettleClock(e.t * 60000)}</b> ${esc(e.text)}</li>`).join('')}${ev.length > 8 ? `<li>…${ev.length - 8} more</li>` : ''}</ol>

    <div class="kt-clock">${kettleClock(el)} <span>/ ${kettleClock(totalMs)}</span></div>
    ${last ? `<div class="kt-now">${T.done ? '✓ ' : 'Now: '}<b>${esc(last.text)}</b></div>` : ''}
    ${next && !T.done ? `<div class="kt-next">Next at ${kettleClock(next.t * 60000)} — ${esc(next.text)} <b>(in ${kettleClock(next.t * 60000 - el)})</b></div>` : ''}
    <div class="kt-bar"><i style="width:${Math.min(100, el / totalMs * 100)}%"></i></div>
    <div class="kt-btns">

function kettleBeep(times) {

      o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.5, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35); o.start(t0); o.stop(t0 + 0.4);
    }

}
function kettleTick() {
  const T = kettleTimer; if (!T.running || T.paused || T.done) { kettlePaintTimer(); return; }
  const el = kettleElapsedMs(); let beeps = 0;
  while (T.fired < T.events.length && T.events[T.fired].t * 60000 <= el) { beeps = Math.max(beeps, T.events[T.fired].beeps || 1); if (T.events[T.fired].end) T.done = true; T.fired++; }
  if (beeps) kettleBeep(beeps);
  kettlePaintTimer();
}
function kettlePaintTimer() { const box = document.getElementById('ktTimer'); if (box) box.innerHTML = kettleTimerHtml(); }
function kettleStart() {
  const K = currentKettle; if (!K) return;
  Object.assign(kettleTimer, { running: true, paused: false, startedAt: Date.now(), pausedMs: 0, pauseAt: 0, done: false, fired: 0,
    events: kettleEvents(K), totalMin: K.heat || KETTLE_DEFAULT_HEAT, recipeName: currentRecipe ? currentRecipe.Recipe_Name : '' });
  if (!kettleTimer.tick) kettleTimer.tick = setInterval(kettleTick, 1000);

}
function kettlePause() { const T = kettleTimer; if (!T.running) return;

// Kettle recipes get their panel at the top of the RIGHT side (the left keeps
