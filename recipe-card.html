/* ── The E Nylon row is a catalogue entry, not a recipe ───────────────────
   E and FF are the same dye wound onto different spools, so the FF card IS the
   nylon recipe. The E row exists because the SKU, the 150-yard count and the
   stock column need something to hang on — it carries no instructions of its
   own and is not meant to be opened here.

   Rendering it as a card with no steps would read as a recipe somebody forgot
   to write. So it says where the recipe actually is instead.

   THE ESCAPE HATCH IS THE ABSENCE OF INSTRUCTIONS, not a flag. The moment an E
   row is given components of its own — the rare case where E genuinely needs
   something different — it stops being a pointer and renders as the recipe it
   has become. Nothing to set, nothing to remember. */
function eVariantNotice(record, components) {
  const fib = String(rowField(record, ['Fiber_Type']) || '').trim();
  if (!/^e\s*nylon$/i.test(fib)) return null;
  if (components && components.length) return null;   // it has its own recipe now
  return String(rowField(record, ['Recipe_Name']) || '').trim();
}

grist.onRecord(async (record) => {
  const myGeneration = ++loadGeneration;
  await SSSettings.load();

  if (!record || !rowField(record, ['Recipe_Name'])) {
    if (myGeneration !== loadGeneration) return;
    showEmpty('🧵', 'No recipe selected',
      'Click a row in the Recipes table to load its production card');
    document.getElementById('cardView').style.display = 'none';
    return;
  }

  const recipeRowId = record.id;

  // Everything below is built into LOCAL variables first — nothing touches
  // the shared global state until we've confirmed at the very end that no
  // newer record selection has come in while these fetches were in flight.
  // Without this, clicking through recipes quickly could let a slow, stale
  // fetch for a previously-selected recipe finish last and overwrite the
  // display for whatever recipe is actually selected now.

  let localComponents = [];
  const localMix = window.DyeMix ? await DyeMix.load(grist.docApi) : currentMix;
  try {
    const [tableData, dyesTable] = await Promise.all([
      grist.docApi.fetchTable('Recipe_Dye_Components'),
      grist.docApi.fetchTable('Dyes'),
    ]);
    const ids = tableData.id || [];

    const getRefIdLocal = (ref) => {
      if (typeof ref === 'number') return ref || null;
      if (Array.isArray(ref)) return ref[1];
      if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
      return null;
    };

    // Dye_Name on Recipe_Dye_Components is a Ref:Dyes link, not text — resolve
    // it through the Dyes table to get the actual name instead of a raw ref.
    const dyeIds = dyesTable.id || [];
    const dyeNameCol = Array.isArray(dyesTable.Dye_Name) ? dyesTable.Dye_Name : [];
    const dyeNameById = {};
    dyeIds.forEach((id, i) => { dyeNameById[id] = dyeNameCol[i] || ''; });

    localComponents = ids.map((id, i) => {
      const get = (col) => Array.isArray(tableData[col]) ? tableData[col][i] : undefined;
      const dyeRef = get('Dye_Name');
      const dyeRefId = getRefIdLocal(dyeRef);
      const resolvedDyeName = dyeRefId ? (dyeNameById[dyeRefId] || '') : (typeof dyeRef === 'string' ? dyeRef : '');
      return {
        id,
        Recipe: get('Recipe'),
        Dye_Name: resolvedDyeName,
        // Kept alongside the resolved name because the premade-jar lookup keys on
        // the row ID: 26 dye names are shared across brands, so matching on name
        // would point at whichever brand's jar happened to be filed first.
        Dye_Id: dyeRefId,
        Dye_Full: get('Dye_Full'),
        'Std_Powder_tsp_': get('Std_Powder_tsp_'),
        'Std_Water_mL_': get('Std_Water_mL_'),
        'Default_mL_per_100_yds': get('Default_mL_per_100_yds'),
        'Effective_mL_per_100_yd': get('Effective_mL_per_100_yd'),
        Dilution_Ratio: get('Dilution') || get('Dilution_Ratio'),
        Is_Powder: !!get('Is_Powder'),
        Step_Order: get('Step_Order'),
        Step_Number: get('Step_Number'),
        Application_Notes: get('Application_Notes'),
        Position: get('Position'),
        Technique: get('Technique'),
        Layer_Order: get('Layer_Order'),
      };
    }).filter(c => {
      const ref = c.Recipe;
      if (typeof ref === 'number') return ref === recipeRowId;
      if (Array.isArray(ref)) return ref[1] === recipeRowId;
      if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId === recipeRowId;
      return false;
    });
  } catch (e) {
    console.error('Failed to fetch components:', e);
    localComponents = [];
  }

  let localBaseSegments = [];
  let localOverlayMarks = [];
  try {
    const layoutTable = await grist.docApi.fetchTable('Recipe_Layout_Segments');
    const lIds = layoutTable.id || [];
    const lRefs = layoutTable.Recipe || [];
    const getRefIdLocal = (ref) => {
      if (typeof ref === 'number') return ref;
      if (Array.isArray(ref)) return ref[1];
      if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
      return null;
    };
    const base = [];
    const overlays = [];
    for (let i = 0; i < lIds.length; i++) {
      if (getRefIdLocal(lRefs[i]) !== recipeRowId) continue;
      const get = (col) => Array.isArray(layoutTable[col]) ? layoutTable[col][i] : undefined;
      const row = {
        dyeName: get('Dye_Name') || '',
        startPct: Number(get('Start_Pct')) || 0,
        endPct: Number(get('End_Pct')) || 0,
        type: get('Segment_Type') || 'Solid',
        blendRatio: Number(get('Blend_Ratio')) || 50,
        applicationType: get('Application_Type') || 'Dye',
        stripes: Number(get('Stripe_Count')) || 0,
        order: get('Segment_Order') || 0,
      };
      if (get('Layer') === 'Overlay') overlays.push(row);
      else base.push(row);
    }
    base.sort((a, b) => a.startPct - b.startPct);
    localBaseSegments = base;
    localOverlayMarks = overlays;
  } catch (e) {
    console.error('Failed to fetch layout segments:', e);
    localBaseSegments = [];
    localOverlayMarks = [];
  }

  // Columns the record may not carry yet. Read straight from the table rather
  // than trusted to arrive; cheap, and it fails to an empty object.
  let localExtraFields = {};
  try {
    const recs = await grist.docApi.fetchTable('Recipes');
    const idx = (recs.id || []).indexOf(record.id);
    if (idx !== -1) {
      ['Year_Made', 'Needs_Review', 'Review_Note', 'Needs_Layout_Photo', 'Layout_Photo_Not_Needed', 'Discussion_Link'].forEach(name => {
        const key = Object.keys(recs).find(k =>
          k.toLowerCase().replace(/[^a-z0-9]/g, '') === name.toLowerCase().replace(/[^a-z0-9]/g, ''));
        // The newest columns can arrive stale (blank/false) rather than missing,
        // so for those the table always wins.
        const late = ['Needs_Layout_Photo', 'Layout_Photo_Not_Needed', 'Discussion_Link'].includes(name);
        if (key && (record[name] === undefined || late)) localExtraFields[name] = recs[key][idx];
      });
    }
  } catch (e) {
    localExtraFields = {};
  }

  let localSpoolStats = { needed: 0, made: 0, perOrder: [] };
  try {
    const recipeSku = (rowField(record, ['SKU_Base']) || rowField(record, ['Shopify_SKU']) || '').toString().trim().toUpperCase();

    if (recipeSku) {
      const [woTable, wolTable] = await Promise.all([
        grist.docApi.fetchTable('Work_Orders'),
        grist.docApi.fetchTable('Work_Order_Lines'),
      ]);

      const woIds = woTable.id || [];
      const woStatus = woTable.Status || [];
      const activeWoIds = new Set();
      for (let i = 0; i < woIds.length; i++) {
        if ((woStatus[i] || '').toString() === 'Active') activeWoIds.add(woIds[i]);
      }

      const getRefIdLocal = (ref) => {
        if (typeof ref === 'number') return ref;
        if (Array.isArray(ref)) return ref[1];
        if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
        return null;
      };

      const woCustomer = woTable.Customer_Name || [];
      const woCustomerByIdx = {};
      for (let i = 0; i < woIds.length; i++) woCustomerByIdx[woIds[i]] = woCustomer[i] || '';

      const lIds = wolTable.id || [];
      const lSku = wolTable.SKU || [];
      const lWo = wolTable.Work_Order || [];
      const lNeeded = wolTable.Qty_Needed || [];
      const lDyed = wolTable.Qty_Dyed || [];

      let needed = 0, made = 0;
      const perOrder = [];
      for (let i = 0; i < lIds.length; i++) {
        const sku = (lSku[i] || '').toString().trim().toUpperCase();
        if (sku !== recipeSku) continue;
        const woId = getRefIdLocal(lWo[i]);
        if (!activeWoIds.has(woId)) continue;
        needed += Number(lNeeded[i]) || 0;
        made += Number(lDyed[i]) || 0;
        const remaining = (Number(lNeeded[i]) || 0) - (Number(lDyed[i]) || 0);
        if (remaining > 0) {
          perOrder.push({ customerName: woCustomerByIdx[woId] || '—', qty: remaining });
        }
      }
      localSpoolStats = { needed, made, perOrder };
    }
  } catch (e) {
    console.error('Failed to compute spool stats:', e);
    localSpoolStats = { needed: 0, made: 0, perOrder: [] };
  }

  let localHistoryEntries = [];
  try {
    const historyTable = await grist.docApi.fetchTable('Recipe_Change_Log');
    const hIds = historyTable.id || [];
    const hRefs = historyTable.Recipe || [];
    const getRefIdLocal = (ref) => {
      if (typeof ref === 'number') return ref;
      if (Array.isArray(ref)) return ref[1];
      if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
      return null;
    };
    const entries = [];
    for (let i = 0; i < hIds.length; i++) {
      if (getRefIdLocal(hRefs[i]) !== recipeRowId) continue;
      entries.push({
        date: Array.isArray(historyTable.Change_Date) ? historyTable.Change_Date[i] : null,
        note: Array.isArray(historyTable.Change_Note) ? historyTable.Change_Note[i] : '',
      });
    }
    entries.sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));
    localHistoryEntries = entries;
  } catch (e) {
    console.error('Failed to load history log:', e);
    localHistoryEntries = [];
  }

  const previewResult = await refreshPreviewPhotos(recipeRowId);

  // A newer record selection came in while we were still loading this one —
  // discard everything we just fetched instead of letting it clobber the
  // display for whatever recipe is actually selected now.
  if (myGeneration !== loadGeneration) return;

  // Grist caches the widget's view of the schema, so onRecord does not always
  // carry a recently added column — the field saves correctly and then reads
  // back missing until the whole page is reloaded. Merged in from the table so
  // a new column shows up straight away.
  currentRecipe = Object.assign({}, record, localExtraFields);
  currentPhotoIndex = 0;
  previewPickerOpen = false;
  currentComponents = localComponents;
  currentMix = localMix;
  currentBaseSegments = localBaseSegments;
  currentOverlayMarks = localOverlayMarks;
  currentSpoolStats = localSpoolStats;
  currentShopifyUrl = rowField(record, ['Shopify_URL']) || '';
  currentHistoryEntries = localHistoryEntries;
  currentProductPhotos = previewResult.candidates;
  currentPreviewUrl = previewResult.matchUrl;
  currentPreviewId = previewResult.matchId;

  const eName = isKettleRecipe(record) ? '' : eVariantNotice(record, localComponents);
  if (eName) {
    if (myGeneration !== loadGeneration) return;
    showEmpty('🧵', esc(eName) + ' — E Nylon',
      'Same dye as the FF Nylon version, wound onto the longer spool, so the recipe lives on ' +
      'the <strong>FF Nylon</strong> card for ' + esc(eName) + '.<br><br>' +
      'If E ever needs something different, add its steps to this row and they will show here.');
    document.getElementById('cardView').style.display = 'none';
    return;
  }

  // Kettle recipes: load their kettle row before drawing.
  if (isKettleRecipe(record)) {
    const k = await loadKettle(recipeRowId);
    if (myGeneration !== loadGeneration) return;
    if (kettleState.recipeId !== recipeRowId) { kettleState.showCitric = false; kettleState.recipeId = recipeRowId; kettleLoadJob(recipeRowId); }
    currentKettle = k;
  } else currentKettle = null;

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('cardView').style.display = 'grid';

  try {
    renderLeft();
    renderRight();
    // Left open from the previous recipe, so re-read the jars rather than showing
    // the last recipe's snapshot: a bin code is only useful if it is current, and
    // a stale one walks someone to the wrong drawer.
    if (stashOpen) loadStash();
  } catch (e) {
    console.error('Rendering failed for recipe', recipeRowId, e);
    document.getElementById('leftPanel').innerHTML = `<div class="no-data">Something went wrong displaying this recipe — check the browser console for details.</div>`;
  }
});
</script>
</body>
</html>
