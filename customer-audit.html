<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Audit</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC;
  --accent: #8B3A2A; --accent-light: #F2E8E5; --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8; --done-bg: #EAF3DE; --done-text: #27500A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; padding: 14px; }
.top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
.subtitle { font-size: 11.5px; color: #8B7D72; margin-bottom: 12px; }
.readonly-flag { display: inline-block; font-size: 9.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .05em; padding: 3px 8px; border-radius: 10px;
  background: var(--done-bg); color: var(--done-text); border: 1px solid #BBD79A; }

.btn { font-size: 11px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--teal);
  background: var(--teal); color: white; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn.secondary { background: white; color: var(--ink); border-color: var(--rule); font-weight: 500; }
.btn.tiny { font-size: 10px; padding: 4px 9px; }
.btn:disabled { opacity: .5; cursor: default; }

.banner { margin-bottom: 12px; padding: 9px 12px; border-radius: 6px; font-size: 11.5px; line-height: 1.6;
  background: white; border: 1px solid var(--rule); color: #6B5E52; }
.banner.warn { background: var(--gold-light); border-color: #E4CF9E; color: #6E4C13; }
.banner.bad { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.banner.good { background: var(--done-bg); border-color: #BBD79A; color: var(--done-text); }
.banner code { font-family: 'DM Mono', monospace; background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 3px; }

.strip { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.stat { font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 600;
  background: white; border: 1px solid var(--rule); color: #6B5E52; cursor: pointer; }
.stat.on { background: var(--ink); border-color: var(--ink); color: white; }
.stat.ok:not(.on) { border-color: #BBD79A; color: var(--done-text); }
.stat.warn:not(.on) { border-color: var(--gold); color: var(--gold); }
.stat.bad:not(.on) { border-color: var(--accent); color: var(--accent); }

.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  color: #8B7D72; margin: 18px 0 6px; }
.card { background: white; border: 1.5px solid var(--rule); border-radius: 8px;
  padding: 11px 13px; margin-bottom: 6px; }
.card.ok { border-left: 4px solid var(--teal); }
.card.warn { border-left: 4px solid var(--gold); background: #FEFCF7; }
.card.bad { border-left: 4px solid var(--accent); background: #FDFAF9; }
.card.none { border-left: 4px solid var(--rule); }
.card-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.name { font-size: 14px; font-weight: 600; }
.code { font-family: 'DM Mono', monospace; font-size: 11px; color: #8B7D72; }
.badge { font-size: 9px; padding: 3px 8px; border-radius: 10px; text-transform: uppercase;
  letter-spacing: .03em; font-weight: 700; white-space: nowrap; margin-left: auto; }
.badge.ok { background: var(--done-bg); color: var(--done-text); }
.badge.warn { background: var(--gold-light); color: var(--gold); }
.badge.bad { background: var(--accent-light); color: var(--accent); }
.badge.none { background: var(--warm); color: #6B5E52; }
.row { display: flex; gap: 8px; align-items: baseline; font-size: 11.5px; margin-top: 4px; flex-wrap: wrap; }
.row .k { color: #8B7D72; min-width: 74px; }
.row .v { font-family: 'DM Mono', monospace; }
.row .v.miss { font-family: 'Inter', sans-serif; font-style: italic; color: #B8ABA0; }
.why { font-size: 11px; color: #6B5E52; font-style: italic; margin-top: 6px; }
.why.bad { color: var(--accent); }
.match { margin-top: 6px; padding: 7px 9px; background: var(--gold-light); border-radius: 5px; font-size: 11.5px; }
.match .em { font-family: 'DM Mono', monospace; font-weight: 600; }

.empty { color: #8B7D72; font-style: italic; padding: 26px; text-align: center; }
.toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 9px 16px; border-radius: 6px; font-size: 12px;
  opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="top-bar">
  <div><span class="title">Customer Audit</span> <span class="readonly-flag">read only</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="code" id="stamp"></span>
    <button class="btn" id="runBtn" onclick="runAudit()">Check against Shopify</button>
  </div>
</div>
<div class="subtitle">
  Whether each Grist customer can be found in the vendor store by the email you hold for them.
  That email is the only thing joining the two, so a mismatch makes a duplicate the first time an order is pushed.
</div>

<div id="banners"></div>
<div class="strip" id="strip"></div>
<div id="list"></div>

<div class="toast" id="toast"></div>

<script>
/* ── Customer Audit ────────────────────────────────────────────────────────
   The push-to-Shopify step attaches a customer with `toUpsert`, which matches
   on EMAIL and creates one when there is no match. That is the behaviour you
   want — Grist keeps the operational record, Shopify gets just enough to own
   the order history — but it has one sharp edge: an email that does not match
   does not fail, it quietly creates a second customer. You would only find out
   later, looking at a customer with half their orders.

   So this screen asks one question per customer, and asks it before any order
   is pushed rather than after. It also reports the case an email check alone
   would miss: a customer who plainly exists in the store under some OTHER
   address, which is the one that actually produces the duplicate.

   Nothing here writes. The workflow it calls has no write node either. */

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function columnAsArray(t, c) { return c && Array.isArray(t[c]) ? t[c] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k =>
      k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}

/* Accent folding — KEEP BYTE-IDENTICAL ACROSS WIDGETS.
   normalize() strips anything outside a-z0-9, which DELETES accented letters
   rather than folding them: "Pathétique" became "pathtique" while the file
   "Pathetique.jpg" became "pathetique", so the two never matched and the widget
   reported nothing found. NFD splits a letter from its diacritic so the
   diacritic can be dropped and the base letter kept; the map handles the
   characters that have no decomposition (ß, ø, æ and friends).
   Display is untouched — this only ever builds comparison keys. */
const ACCENT_FOLD_MAP = { 'æ':'ae','Æ':'ae','œ':'oe','Œ':'oe','ø':'o','Ø':'o',
  'ß':'ss','đ':'d','Đ':'d','ð':'d','Ð':'d','ł':'l','Ł':'l','þ':'th','Þ':'th' };
function foldAccents(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[æÆœŒøØßđĐðÐłŁþÞ]/g, c => ACCENT_FOLD_MAP[c] || c);
}
function nameKey(s) { return foldAccents(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

/* Shopify matches emails case-insensitively and nothing else. Plus-addressing
   is NOT an alias to it: sales+web@shop.com and sales@shop.com are two
   different customers, so comparing them folded would report a match that the
   push will not make. Lowercase and trim only. */
function emailKey(s) { return String(s == null ? '' : s).trim().toLowerCase(); }

const LOOKUP_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/customer-lookup';
const LOOKUP_TIMEOUT_MS = 60000;
/* Customers per call. Each one contributes up to TWO search terms (an email and
   a quoted company), so 12 means at most 24 OR-terms and a search string well
   under a kilobyte. Shopify's search parser gets unhappy long before that, and
   a refused search fails the whole batch rather than one name — cheaper to make
   one extra round trip than to lose 25 customers to one long query. */
const BATCH = 12;

const S = {
  customers: [], unlinkedOrders: [],
  shopify: null, rows: [],
  filter: 'all', loading: true, error: '', lookupError: '', busy: false, notes: [],
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── Grist side ─────────────────────────────────────────────────────────── */

async function loadGrist() {
  S.loading = true; S.error = '';
  try {
    const t = await grist.docApi.fetchTable('Customers');
    const c = (cands) => findColumn(t, cands);
    const COL = {
      name: c(['Customer_Name', 'Name']), code: c(['Code']),
      email: c(['Email', 'Customer_Email', 'Contact_Email']),
      shipName: c(['Ship_To_Name', 'Ship_Name']),
    };
    S.customers = (t.id || []).map((id, i) => ({
      id,
      name: (columnAsArray(t, COL.name)[i] || '').toString().trim(),
      code: (columnAsArray(t, COL.code)[i] || '').toString().trim(),
      email: (columnAsArray(t, COL.email)[i] || '').toString().trim(),
      hasEmailCol: !!COL.email,
    })).filter(c => c.name || c.code)
      .sort((a, b) => a.name.localeCompare(b.name));

    /* Work orders carrying a customer NAME but no link. Same root cause as a
       missing email — nothing about that customer is reachable from the order,
       so pricing, label settings and the ship-to address all silently do not
       apply, and the order still looks perfectly normal. */
    S.unlinkedOrders = [];
    try {
      const wo = await grist.docApi.fetchTable('Work_Orders');
      const w = (cands) => findColumn(wo, cands);
      const W = { num: w(['Order_Number']), name: w(['Customer_Name']),
                  cust: w(['Customer']), status: w(['Status']) };
      const known = new Set(S.customers.map(c => nameKey(c.name)));
      const byName = {};
      (wo.id || []).forEach((id, i) => {
        if (W.cust && getRefId(columnAsArray(wo, W.cust)[i])) return;   // already linked
        const nm = (columnAsArray(wo, W.name)[i] || '').toString().trim();
        if (!nm) return;
        const k = nameKey(nm);
        if (!byName[k]) byName[k] = { name: nm, orders: [], inGrist: known.has(k) };
        byName[k].orders.push((columnAsArray(wo, W.num)[i] || ('row ' + id)).toString());
      });
      S.unlinkedOrders = Object.values(byName).sort((a, b) => b.orders.length - a.orders.length);
    } catch (e) {
      console.warn('Work_Orders unavailable — skipping the unlinked-order check', e);
    }
  } catch (e) {
    console.error('Could not read Customers:', e);
    S.error = (e && e.message) || String(e);
  }
  S.loading = false;
}

/* ── Shopify side ───────────────────────────────────────────────────────── */

async function runAudit() {
  if (S.busy) return;
  S.busy = true; S.lookupError = ''; S.notes = []; render();
  const btn = document.getElementById('runBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }

  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), LOOKUP_TIMEOUT_MS) : null;

  const found = [];
  try {
    for (let i = 0; i < S.customers.length; i += BATCH) {
      const batch = S.customers.slice(i, i + BATCH)
        .map(c => ({ id: c.id, name: c.name, email: c.email }));
      const res = await fetch(LOOKUP_WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customers: batch }), cache: 'no-store',
        ...(ctrl ? { signal: ctrl.signal } : {}),
      });
      if (!res.ok) throw new Error(`the workflow answered ${res.status} ${res.statusText}`);
      const data = await res.json();
      if (data && data.ok === false) throw new Error(data.error || 'the lookup failed');
      found.push(...((data && data.customers) || []));
      (data && data.notes || []).forEach(n => { if (!S.notes.includes(n)) S.notes.push(n); });
    }
    S.shopify = found;
    build();
    document.getElementById('stamp').textContent = 'checked ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Customer lookup failed:', e);
    S.lookupError = (e && e.name === 'AbortError')
      ? `Shopify didn't answer within ${Math.round(LOOKUP_TIMEOUT_MS / 1000)} seconds.`
      : ((e && e.message) || String(e));
    S.shopify = null; S.rows = [];
  } finally {
    if (timer) clearTimeout(timer);
    S.busy = false;
    if (btn) { btn.disabled = false; btn.textContent = 'Check against Shopify'; }
    render();
  }
}

/* ── The comparison ─────────────────────────────────────────────────────── */

function build() {
  const byEmail = {};
  (S.shopify || []).forEach(sc => {
    const k = emailKey(sc.email);
    if (k) (byEmail[k] = byEmail[k] || []).push(sc);
  });

  S.rows = S.customers.map(c => {
    const key = emailKey(c.email);

    /* Anything in the store whose company or display name is plainly this
       customer. Used only when the email did not match — it is the evidence
       that a push would create a duplicate rather than a new record. */
    const lookalikes = (S.shopify || []).filter(sc =>
      nameKey(sc.company) && nameKey(sc.company) === nameKey(c.name)
      || (nameKey(sc.displayName) && nameKey(sc.displayName) === nameKey(c.name)));

    if (!c.email) {
      return { c, state: 'noemail', lookalikes,
        why: lookalikes.length
          ? 'No email in Grist, but the store has someone under this name. Copy their address in, or the push will make a second one.'
          : 'No email in Grist. The push will send the order with no customer attached, so their order history will not collect.' };
    }
    const hit = byEmail[key];
    if (hit && hit.length) {
      return { c, state: 'ok', match: hit[0], lookalikes: [],
        why: `Matches ${hit[0].displayName || hit[0].email} in the store.` };
    }
    if (lookalikes.length) {
      return { c, state: 'mismatch', lookalikes,
        why: 'This customer is in the store under a different email. Pushing an order would create a SECOND customer rather than adding to theirs.' };
    }
    return { c, state: 'new', lookalikes: [],
      why: 'Not in the store yet. The first pushed order will create them — nothing to fix unless you expected them to be there already.' };
  });
}

function counts() {
  const n = { ok: 0, mismatch: 0, noemail: 0, new: 0 };
  S.rows.forEach(r => { n[r.state] = (n[r.state] || 0) + 1; });
  return n;
}

/* ── Render ─────────────────────────────────────────────────────────────── */

function setFilter(f) { S.filter = f; render(); }

function renderBanners() {
  const out = [];
  if (S.error) out.push(`<div class="banner bad"><strong>Couldn't read Customers.</strong> ${esc(S.error)}</div>`);
  if (S.lookupError) {
    out.push(`<div class="banner bad"><strong>Couldn't reach Shopify.</strong> ${esc(S.lookupError)}
      <div style="margin-top:6px">Nothing was changed — this screen only reads. Check that
      <strong>SS - Shopify Customer Lookup</strong> is active in n8n, and that the custom app has
      <code>read_customers</code>: that scope is separate from <code>write_orders</code>, so the order
      push can work while this does not.</div></div>`);
  }
  S.notes.forEach(n => out.push(`<div class="banner warn">${esc(n)}</div>`));

  const noEmailCol = S.customers.length && !S.customers[0].hasEmailCol;
  if (noEmailCol) {
    out.push(`<div class="banner bad"><strong>The Customers table has no email column.</strong>
      Nothing can be matched without one — add <code>Email</code> and fill it in for your wholesale
      accounts.</div>`);
  }

  if (S.unlinkedOrders.length) {
    const total = S.unlinkedOrders.reduce((n, u) => n + u.orders.length, 0);
    out.push(`<div class="banner warn"><strong>${total} work order(s) have a customer name but no link.</strong>
      Pricing, label settings and the ship-to address all come through that link, so on these orders none
      of it applies — and they look perfectly normal.
      <ul style="margin:5px 0 0 16px">${S.unlinkedOrders.slice(0, 8).map(u =>
        `<li><strong>${esc(u.name)}</strong> — ${u.orders.length} order(s): ${esc(u.orders.slice(0, 6).join(', '))}${
          u.orders.length > 6 ? '…' : ''} ${u.inGrist
            ? '<em>(this customer IS in Grist — the orders just never got linked)</em>'
            : '<em>(no Grist customer by this name)</em>'}</li>`).join('')}
      ${S.unlinkedOrders.length > 8 ? `<li>…and ${S.unlinkedOrders.length - 8} more</li>` : ''}</ul></div>`);
  }

  if (S.shopify && !S.lookupError) {
    const n = counts();
    if (!n.mismatch && !n.noemail) {
      out.push(`<div class="banner good">Every customer with an email either matches the store or is
        genuinely new. Nothing will duplicate.</div>`);
    }
  }
  document.getElementById('banners').innerHTML = out.join('');
}

function renderStrip() {
  const box = document.getElementById('strip');
  if (!S.shopify) { box.innerHTML = ''; return; }
  const n = counts();
  const chip = (k, label, cls) =>
    `<button class="stat ${cls} ${S.filter === k ? 'on' : ''}" onclick="setFilter('${k}')">${n[k] || 0} ${label}</button>`;
  box.innerHTML =
    `<button class="stat ${S.filter === 'all' ? 'on' : ''}" onclick="setFilter('all')">${S.rows.length} customers</button>` +
    chip('mismatch', 'under another email', 'bad') +
    chip('noemail', 'no email in Grist', 'warn') +
    chip('new', 'not in the store yet', '') +
    chip('ok', 'matched', 'ok');
}

const STATE_META = {
  ok: { cls: 'ok', label: 'matched' },
  mismatch: { cls: 'bad', label: 'duplicate risk' },
  noemail: { cls: 'warn', label: 'no email' },
  new: { cls: 'none', label: 'not in store' },
};

function cardHtml(r) {
  const meta = STATE_META[r.state];
  return `<div class="card ${meta.cls}">
    <div class="card-top">
      <span class="name">${esc(r.c.name || '(unnamed)')}</span>
      ${r.c.code ? `<span class="code">${esc(r.c.code)}</span>` : ''}
      <span class="badge ${meta.cls}">${esc(meta.label)}</span>
    </div>
    <div class="row"><span class="k">Grist email</span>
      <span class="v ${r.c.email ? '' : 'miss'}">${r.c.email ? esc(r.c.email) : 'none recorded'}</span></div>
    ${r.match ? `<div class="row"><span class="k">In Shopify</span>
      <span class="v">${esc(r.match.email)}</span>
      <span class="code">${esc([r.match.displayName, r.match.company, r.match.where].filter(Boolean).join(' · '))}</span></div>` : ''}
    ${r.lookalikes.length ? `<div class="match">
      Found in the store under
      ${r.lookalikes.slice(0, 3).map(l => `<span class="em">${esc(l.email || '(no email)')}</span>${
        l.company ? ` (${esc(l.company)})` : ''}`).join(', ')}${
        r.lookalikes.length > 3 ? ` and ${r.lookalikes.length - 3} more` : ''}.
      </div>` : ''}
    <div class="why ${r.state === 'mismatch' ? 'bad' : ''}">${esc(r.why)}</div>
  </div>`;
}

function render() {
  renderBanners();
  renderStrip();
  const box = document.getElementById('list');

  if (S.loading) { box.innerHTML = `<div class="empty">Loading…</div>`; return; }
  if (S.busy) { box.innerHTML = `<div class="empty">Asking Shopify about ${S.customers.length} customer(s)…</div>`; return; }
  if (!S.customers.length) { box.innerHTML = `<div class="empty">No customers in Grist yet.</div>`; return; }
  if (!S.shopify) {
    box.innerHTML = `<div class="empty">${S.customers.length} customer(s) in Grist.
      Press <strong>Check against Shopify</strong> — it only reads.</div>`;
    return;
  }

  /* Problems first. A clean row is worth seeing but never worth scrolling past. */
  const order = { mismatch: 0, noemail: 1, new: 2, ok: 3 };
  const rows = S.rows
    .filter(r => S.filter === 'all' || r.state === S.filter)
    .sort((a, b) => order[a.state] - order[b.state] || a.c.name.localeCompare(b.c.name));

  box.innerHTML = rows.length
    ? rows.map(cardHtml).join('')
    : `<div class="empty">Nothing in that group.</div>`;
}

grist.ready({ requiredAccess: 'read table' });
loadGrist().then(render);
</script>
</body>
</html>
