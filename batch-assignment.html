<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Assignment</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614;
  --paper: #F7F3EE;
  --warm: #E8DFD4;
  --rule: #D4C9BC;
  --accent: #8B3A2A;
  --teal: #3A8B7A;
  --teal-light: #E5F2EF;
  --done-text: #27500A;
  --done-bg: #EAF3DE;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 12px;
  line-height: 1.4;
  padding: 8px;
}
.header-title { font-family: 'Libre Baskerville', serif; font-size: 14px; font-weight: 700; }
.header-line { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 5px; }
.header-sub { font-size: 10px; color: #8B7D72; }
.empty-state { text-align: center; color: #8B7D72; padding: 24px 12px; font-size: 12px; }
.order-log-row { display: flex; gap: 5px; align-items: center; margin-top: 4px; }
.order-log-row input {
  flex: 1; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px; font-size: 12px;
}
.log-btn {
  font-size: 11px; padding: 4px 10px; border-radius: 4px;
  border: 1px solid var(--teal); background: var(--teal-light); color: var(--teal); cursor: pointer; font-weight: 600;
}
.log-btn:hover { background: var(--teal); color: white; }
.order-confirm {
  font-size: 10px; color: var(--done-text); margin-top: 3px; display: flex; justify-content: space-between; align-items: center;
}
.undo-link { color: var(--accent); cursor: pointer; font-weight: 600; }
.undo-link:hover { text-decoration: underline; }
.cleanup-row { font-size: 11px; padding: 4px 6px; border-radius: 5px; margin-bottom: 3px; }
.cleanup-oneoff { background: #F5E0E4; color: #A01830; }
.cleanup-keep { background: var(--teal-light); color: var(--teal); }
.cleanup-stage { background: #1A1614; color: #F7F3EE; }
.dye-action-row { margin-bottom: 8px; }

/* Put-away board. Sized to be read from where the bins are, not from the chair —
   that walk-and-squint loop was the whole problem. */
.putaway {
  border: 2px solid var(--done-border); border-radius: 8px;
  background: var(--done-bg); padding: 6px 9px; margin: 4px 0 7px;
}
.putaway-cap {
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--done-text); font-weight: 700; margin-bottom: 4px;
}
.putaway-line {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 3px 0; border-top: 1px solid rgba(0,0,0,.09);
}
.putaway-line:first-of-type { border-top: none; }
.putaway-dye { font-size: 17px; font-weight: 700; line-height: 1.15; }
.putaway-bin {
  font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 700;
  color: var(--done-text); white-space: nowrap;
}
.putaway-bin.muted { color: #8B7D72; font-size: 15px; }

/* One dye = one bordered block, so a row of buttons can never look like it
   belongs to the dye above it. */
.dye-block { border: 1px solid var(--rule); border-left: 3px solid var(--rule); border-radius: 6px; padding: 5px 7px; margin-bottom: 4px; }
.dye-block:first-of-type { margin-top: 6px; }
.dye-block.stage { border-left-color: var(--gold); }
.dye-block.keep  { border-left-color: var(--teal); }
.dye-block.oneoff{ border-left-color: var(--rule); }
.dye-block.done  { border-left-color: var(--done-border); background: var(--done-bg); }
.dye-block-name { font-size: 13px; font-weight: 700; margin-bottom: 1px; }
.dye-block-why { font-size: 10px; color: #8B7D72; margin-bottom: 4px; }
.btn-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: stretch; }
/* Glove-sized: 40px min height is the smallest reliable target with nitrile on. */
.act-btn {
  flex: 1 1 auto; min-height: 30px; min-width: 52px; padding: 4px 9px;
  border: 1px solid var(--rule); border-radius: 5px; background: white;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  color: var(--ink); cursor: pointer;
}
.act-btn:active { transform: translateY(1px); }
.act-btn.bin {
  flex: 2 1 auto; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 700;
  background: var(--done-bg); border-color: var(--done-border); color: var(--done-text);
}
.act-btn.stage-btn { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }
.act-btn.dump { color: var(--accent); }
.ml-input {
  width: 46px; min-height: 30px; padding: 3px 5px; border: 1px solid var(--rule);
  border-radius: 5px; font-size: 13px; font-family: 'DM Mono', monospace; text-align: center;
}
.dye-done-line { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }

/* Orders: one line each, name small. The customer is context, not the subject. */
.ord-strip { border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.ord-line { display: flex; justify-content: space-between; gap: 8px; padding: 3px 8px; font-size: 11px; border-top: 1px solid var(--rule); }
.ord-line:first-child { border-top: none; }
.ord-line.total { background: var(--warm); font-weight: 700; font-size: 11.5px; }
.ord-who { color: #6B5E52; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ord-n { font-family: 'DM Mono', monospace; white-space: nowrap; }
.ord-n.complete { color: var(--done-text); font-weight: 700; }

/* Draft button parked in the header — rarely wanted, previously easy to hit. */
.header-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.draft-mini {
  flex: none; font-size: 10px; padding: 4px 7px; border-radius: 5px;
  border: 1px dashed var(--rule); background: white; color: #8B7D72; cursor: pointer;
}
.draft-mini:hover { border-color: var(--accent); color: var(--accent); }
.action-done-banner {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--done-bg); border: 1px solid var(--done-text); border-radius: 5px;
  padding: 6px 10px; font-size: 11px; color: var(--done-text); font-weight: 600;
}
.undo-link { color: var(--accent); cursor: pointer; text-decoration: underline; font-weight: 600; }
.undo-link:hover { opacity: .8; }
.action-fields { display: flex; gap: 5px; margin-top: 4px; }
.action-fields input {
  flex: 1; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px; font-size: 11px;
}
.action-confirm-btn {
  font-size: 11px; padding: 4px 10px; border-radius: 4px; white-space: nowrap;
  border: 1px solid var(--teal); background: var(--teal-light); color: var(--teal); cursor: pointer; font-weight: 600;
}
.action-confirm-btn:hover { background: var(--teal); color: white; }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
}
.toast.show { opacity: 1; }
.pull-row { display:flex; align-items:center; gap:8px; justify-content:space-between; background:var(--teal-light,#E4F0EF); border:1px solid #2A6B6B; border-radius:5px; padding:6px 9px; margin-bottom:6px; font-size:11px; color:#2A6B6B; }
.pull-btn { background:#2A6B6B; color:white; border:none; border-radius:4px; padding:5px 10px; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
.coverage { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--ink); background:#F7F3EE; border:1px solid var(--rule); border-radius:5px; padding:6px 9px; margin-bottom:6px; }
.coverage .make-more { color:#8B5A2A; font-weight:700; }
.coverage .make-none { color:var(--done-text); font-weight:700; }
.pot-panel { background: white; border: 1px solid var(--rule); border-radius: 6px; padding: 8px; margin-bottom: 6px; }
.method-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 10px; }
.method-hand { background: #F0E4D4; color: #8B3A2A; }
.method-kettle { background: var(--teal-light); color: var(--teal); }
.method-unknown { background: #EEE; color: #8B7D72; }
.method-note { font-size: 10px; color: #8B7D72; font-style: italic; }
.pot-row { display: flex; gap: 5px; align-items: center; }
.pot-row input { flex: 1; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 4px; font-size: 13px; }
.running-total { font-size: 11px; color: var(--done-text); background: var(--done-bg); border: 1px solid var(--done-text); border-radius: 5px; padding: 5px 8px; margin-bottom: 4px; }
.pot-done { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--ink); background: #F7F3EE; border: 1px solid var(--rule); border-radius: 5px; padding: 4px 8px; margin-bottom: 3px; }
</style>
</head>
<body>

<div id="content">
  <div class="empty-state">Select a colorway in Morning Batch Planning to see details here.</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ── Mixed-dye bin codes — KEEP BYTE-IDENTICAL ACROSS WIDGETS ──
   The made-dye shelf is M-A1 .. M-D4: letters are columns, numbers are rows,
   matching back stock. Every widget that reads Dye_Stock.Bin_Location must
   normalise before displaying OR grouping. Skipping it is what let one drawer
   show up as several bins: "5", "b3", "B-3" and "M-B3" are all one place, and
   an un-normalised group key splits them into four.

   Only Dye_Stock goes through here. Back stock bins (bare A1-D7) are a
   different rack, are not being renamed, and must NOT be passed to normBin. */
const DYE_BIN_ROWS = 4, DYE_BIN_COLS = 4;
const BIN_LETTERS = 'ABCDEFGHIJKL';
const NO_BIN = '(no bin)';

// Fills down a column before moving to the next. Keyed on ROWS, not COLS, so
// widening the shelf later appends new letters instead of remapping every code.
function dyeBinCode(index0) {
  const col = Math.floor(index0 / DYE_BIN_ROWS);
  const row = index0 % DYE_BIN_ROWS;
  return 'M-' + BIN_LETTERS[col] + (row + 1);
}
function normBin(raw) {
  const s = String(raw || '').trim().toUpperCase().replace(/[\s\-_.]/g, '');
  if (!s) return '';
  let m = /^M?([A-L])(\d{1,2})$/.exec(s);
  if (m) return 'M-' + m[1] + Number(m[2]);
  m = /^(\d{1,3})$/.exec(s);
  if (m) {
    const n = Number(m[1]);
    if (n >= 1 && n <= DYE_BIN_ROWS * DYE_BIN_COLS) return dyeBinCode(n - 1);
  }
  return String(raw).trim();   // off-grid / unrecognised — left alone, never invented
}
// Shelf position, for sorting. Off-grid codes sort last instead of colliding at 0.
function binOrder(code) {
  const m = /^M-([A-L])(\d{1,2})$/.exec(String(code || ''));
  if (!m) return 9000;
  return BIN_LETTERS.indexOf(m[1]) * DYE_BIN_ROWS + (Number(m[2]) - 1);
}
function binSortFn(a, b) {
  const d = binOrder(a) - binOrder(b);
  return d !== 0 ? d : String(a).localeCompare(String(b));
}
// Display form. One empty-bin string everywhere, so the label a worker reads is
// the same label the grouping used.
function binLabel(raw) {
  return normBin(raw) || NO_BIN;
}
// First grid position with nothing in it. Returns '' when the shelf is full, so
// the caller can say so instead of inventing an M-E1 that does not exist.
function nextFreeBin(binGroups) {
  for (let i = 0; i < DYE_BIN_ROWS * DYE_BIN_COLS; i++) {
    const code = dyeBinCode(i);
    if (!binGroups[code] || !binGroups[code].length) return code;
  }
  return '';
}

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
// Byte-identical copy of the helper in batch-planner.html — keep them in sync.
// Matches a column id ignoring case and non-alphanumerics, trying each candidate.
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
// Resolve a table's columns by trying candidate ids. spec maps a logical key to
// either ['Cand1','Cand2'] (required) or { cands:[...], required:false } (optional).
// Returns { key: actualColId|null }; pushes "Table.FirstCand" into `missing` for any
// REQUIRED column that isn't found, so the widget can banner instead of silently
// reading an empty column after a rename.
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${esc(tableName)}.${cands[0]}`);
  }
  return out;
}
// Resolved Dye_Stock column ids, stashed at load time so the put/hold/dump/undo
// actions (which run later, outside loadForRecipe's scope) use the same ids.
let RC_STOCK = null;
// Resolved Dye_Stock column id for a logical key, falling back to the canonical
// name (so a brand-new doc missing an optional column can still have it created).
function stockCol(key, fallback) { return (RC_STOCK && RC_STOCK[key]) || fallback; }

// Recipes.Fiber_Type holds long names ("FF Nylon"); Production_Lots.Fiber holds
// codes (FFN/FFC/EN/BW). Same map used in recipe-builder / photo-inbox / kettle-calc.
const FIBER_NAME_TO_CODE = { 'FF Nylon': 'FFN', 'E Nylon': 'EN', 'FF Cotton': 'FFC', 'Blackwing': 'BW' };
function fiberCode(v) {
  const s = (v || '').toString().trim();
  if (!s) return '';
  if (FIBER_NAME_TO_CODE[s]) return FIBER_NAME_TO_CODE[s];
  const up = s.toUpperCase();
  return ['FFN', 'FFC', 'EN', 'BW'].includes(up) ? up : s; // already a code, or unknown
}
// Spools -> yards. E Nylon is 150 yд/spool, the rest 100. Works off the CODE, so
// it's correct whether the recipe stored "E Nylon" or "EN".
function yardsPerSpool(fiber) {
  return fiberCode(fiber) === 'EN' ? 150 : 100;
}
function dueValue(d) { const n = Number(d); return isFinite(n) && n > 0 ? n : Infinity; }

// Pots logged for the currently-selected colorway this session (for running total + undo).
let sessionPots = [];
// Back-stock bucket column id + resolved allocation/line ids, stashed for fulfillFromStock.
let RC_STOCKBUCKET = null;
let RC_ALLOC = null, RC_WOL = null;
let S_COLS = { ALLOC: {} };  // resolved Lot_Allocations column ids for stock fulfillment
let S = { woundStatus: 'Wound - Needs Labels' };  // detected "boxed" status string

// ── STAGING SHELF ──────────────────────────────────────────────────
// Must match stgCols in dye-pull-sheet.html and PULL_CFG.stgCols in
// print-day.html. If those change and this doesn't, this widget will name a
// staging bin the printed sheet never assigned.
const STG_COLS = 5;

// Byte-identical to stageCode() in both print widgets — keep them in sync.
// Fills across a shelf before dropping down: A1 B1 C1 D1 E1, then A2.
function stageCode(index0, cols) {
  return 'S-' + BIN_LETTERS[index0 % cols] + String(Math.floor(index0 / cols) + 1);
}
// ───────────────────────────────────────────────────────────────────

// Grist Date columns store epoch seconds at UTC midnight of the calendar day.
function todayEpochSeconds() {
  const n = new Date();
  return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000;
}

let currentEntry = null;
let completedActions = {}; // cleanupInfo idx -> {label, undo: asyncFn} for dye cleanup actions

async function loadForRecipe(record) {
  if (!record || !record.id) {
    document.getElementById('content').innerHTML = `<div class="empty-state">Select a colorway in Morning Batch Planning to see details here.</div>`;
    currentEntry = null;
    return;
  }
  document.getElementById('content').innerHTML = `<div class="empty-state">Loading...</div>`;

  try {
    const [woTable, wolTable, compTable, recipesTable, dyesTable, stockTableUpfront] = await Promise.all([
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Recipe_Dye_Components'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Dyes'),
      grist.docApi.fetchTable('Dye_Stock'),
    ]);

    // Coverage is DERIVED, never stored: what orders need, minus what's already
    // been allocated to them, minus unwound spools still sitting in lots. A stored
    // "dyed" guess made at the kettle goes stale the moment winding assigns the
    // spools differently, so we compute it from physical records instead.
    let allocByLine = {}, unwoundByRecipe = {}, stockByRecipe = {}, stockLotsByRecipe = {}, stockColId = null;
    const clampRecipeTotals = m => { Object.keys(m).forEach(k => { if (m[k] < 0) m[k] = 0; }); };
    try {
      const [lotsT, allocT] = await Promise.all([
        grist.docApi.fetchTable('Production_Lots'),
        grist.docApi.fetchTable('Lot_Allocations'),
      ]);
      const aLine = findColumn(allocT, ['Work_Order_Line']);
      const aQty = findColumn(allocT, ['Qty_Spools']);
      const aLot = findColumn(allocT, ['Lot']);
      const aStatus = findColumn(allocT, ['Status']);
      const aCustomer = findColumn(allocT, ['Customer']);
      S_COLS = { ALLOC: { lot: aLot, qty: aQty, status: aStatus, customer: aCustomer, line: aLine } };
      // Pick the "boxed" status the doc already uses, else the live default.
      const seen = new Set();
      if (aStatus) (allocT.id || []).forEach((id, i) => { const v = columnAsArray(allocT, aStatus)[i]; if (v) seen.add(v.toString()); });
      S.woundStatus = ['Packed', 'Wound - Needs Labels', 'Wound', 'Packaged - Shipped'].find(v => seen.has(v)) || 'Wound - Needs Labels';
      const allocByLot = {};
      (allocT.id || []).forEach((id, i) => {
        const q = Number(columnAsArray(allocT, aQty)[i]) || 0;
        const lineId = aLine ? getRefId(columnAsArray(allocT, aLine)[i]) : null;
        if (lineId) allocByLine[lineId] = (allocByLine[lineId] || 0) + q;
        const lotId = aLot ? getRefId(columnAsArray(allocT, aLot)[i]) : null;
        if (lotId) allocByLot[lotId] = (allocByLot[lotId] || 0) + q;
      });
      const lRecipe = findColumn(lotsT, ['Recipe']);
      const lSpools = findColumn(lotsT, ['Spools_Made']);
      const lYards = findColumn(lotsT, ['Total_Yards_Made']);
      const lStore = findColumn(lotsT, ['Store_Stock_Spools']);
      const lVendor = findColumn(lotsT, ['Vendor_Stock_Spools']);
      const lGeneral = findColumn(lotsT, ['General_Stock_Spools']);
      const lNumber = findColumn(lotsT, ['Lot_Number']);
      const lDate = findColumn(lotsT, ['Date_Dyed']);
      const lBroken = findColumn(lotsT, ['Broken_Spools']);
      const lFiber = findColumn(lotsT, ['Fiber']);
      stockColId = lGeneral || lStore; // the single back-stock bucket we read/write
      const num = (col, i) => col ? (Number(columnAsArray(lotsT, col)[i]) || 0) : 0;
      (lotsT.id || []).forEach((id, i) => {
        const rid = lRecipe ? getRefId(columnAsArray(lotsT, lRecipe)[i]) : null;
        if (!rid) return;
        let total = num(lSpools, i);
        if (!total && lYards) {
          const f = lFiber ? columnAsArray(lotsT, lFiber)[i] : '';
          total = Math.round(num(lYards, i) / yardsPerSpool(f));
        }
        const stock = num(lStore, i) + num(lVendor, i) + num(lGeneral, i);
        const free = total - (allocByLot[id] || 0) - stock - num(lBroken, i);
        // Sum SIGNED across a recipe's lots, clamp once at the end. Clamping per
        // lot silently discards over-allocated lots (allocated > Spools_Made),
        // leaving the surplus lots standing alone as thread that does not exist.
        unwoundByRecipe[rid] = (unwoundByRecipe[rid] || 0) + free;
        if (stock > 0 && stockColId) {
          stockByRecipe[rid] = (stockByRecipe[rid] || 0) + stock;
          (stockLotsByRecipe[rid] = stockLotsByRecipe[rid] || []).push({
            lotId: id, lotNumber: lNumber ? columnAsArray(lotsT, lNumber)[i] : `Lot #${id}`,
            stock, date: lDate ? columnAsArray(lotsT, lDate)[i] : 0,
          });
        }
      });
      clampRecipeTotals(unwoundByRecipe);
      // oldest stock first — clear the bin's oldest thread before newer
      Object.values(stockLotsByRecipe).forEach(arr => arr.sort((a, b) => (a.date || 0) - (b.date || 0)));
    } catch (err) {
      console.warn('Lots/allocations unavailable — coverage will show needs only', err);
    }
    RC_STOCKBUCKET = stockColId;

    // ── Resolve every column id up front (rename-proofing) ──────────────
    // Required columns missing => named banner, not a silently-empty widget.
    // Optional (display-only / fallback-path) columns just degrade quietly.
    const missing = [];
    const opt = cands => ({ cands, required: false });
    const DYE = resolveCols(dyesTable, 'Dyes', {
      name: ['Dye_Name'], brand: opt(['Brand']), serial: opt(['Serial']), dyeType: opt(['Dye_Type']),
    }, missing);
    const WO = resolveCols(woTable, 'Work_Orders', {
      status: ['Status'], orderNumber: opt(['Order_Number']),
      customerName: opt(['Customer_Name']), customer: opt(['Customer']), dueDate: opt(['Due_Date']),
    }, missing);
    const REC = resolveCols(recipesTable, 'Recipes', {
      name: ['Recipe_Name'], sku: opt(['SKU_Base']), fiber: opt(['Fiber_Type']),
      method: opt(['Dye_Method']),
    }, missing);
    const COMP = resolveCols(compTable, 'Recipe_Dye_Components', {
      recipe: ['Recipe'], dye: ['Dye_Name'], powder: opt(['Is_Powder', 'Powder']),
    }, missing);
    const WOL = resolveCols(wolTable, 'Work_Order_Lines', {
      workOrder: ['Work_Order'], qtyNeeded: ['Qty_Needed'],
      recipe: opt(['Recipe']), sku: opt(['SKU']),
    }, missing);
    const STOCK = resolveCols(stockTableUpfront, 'Dye_Stock', {
      dye: ['Dye'], quantity: ['Quantity_mL'], bin: opt(['Bin_Location']), mixedDate: opt(['Mixed_Date']),
    }, missing);
    RC_STOCK = STOCK; // used later by put/hold/dump/undo

    if (missing.length) {
      document.getElementById('content').innerHTML =
        `<div class="empty-state">Can't load — these expected columns are missing:<br><br>` +
        `<strong>${[...new Set(missing)].join('<br>')}</strong><br><br>` +
        `<span style="font-size:10px;color:#8B7D72">A table or column was likely renamed. Fix the name in Grist, or update the widget.</span></div>`;
      currentEntry = null;
      return;
    }
    // ────────────────────────────────────────────────────────────────────

    // Dye_Name on Recipe_Dye_Components is a Ref:Dyes link — resolve it through
    // this table to get the actual name/brand/serial/type, rather than displaying
    // the raw row id.
    const dIds = dyesTable.id || [];
    const dyeInfoById = {};
    dIds.forEach((id, i) => {
      dyeInfoById[id] = {
        name: columnAsArray(dyesTable, DYE.name)[i] || '',
        brand: columnAsArray(dyesTable, DYE.brand)[i] || '',
        serial: columnAsArray(dyesTable, DYE.serial)[i] || '',
        dyeType: columnAsArray(dyesTable, DYE.dyeType)[i] || '',
      };
    });
    function dyeShortName(dyeId) {
      const d = dyeInfoById[dyeId];
      return d && d.name ? d.name : `Dye #${dyeId}`;
    }
    function dyeDisplayLabel(dyeId) {
      const d = dyeInfoById[dyeId];
      if (!d) return `Dye #${dyeId}`;
      return [d.name, d.brand, d.serial, d.dyeType].filter(Boolean).join(' · ');
    }

    const woIds = woTable.id || [];
    const woInfo = {};
    woIds.forEach((id, i) => {
      woInfo[id] = {
        active: (columnAsArray(woTable, WO.status)[i] || '').toString() === 'Active',
        orderNumber: columnAsArray(woTable, WO.orderNumber)[i],
        customerName: columnAsArray(woTable, WO.customerName)[i],
        customerId: getRefId(columnAsArray(woTable, WO.customer)[i]),
        dueDate: columnAsArray(woTable, WO.dueDate)[i],
      };
    });

    const rIds = recipesTable.id || [];
    const recipeNameById = {};
    const recipeSkuById = {};
    const recipeFiberById = {};
    const recipeMethodById = {};
    rIds.forEach((id, i) => {
      recipeNameById[id] = columnAsArray(recipesTable, REC.name)[i];
      recipeSkuById[id] = normalize(columnAsArray(recipesTable, REC.sku)[i] || '');
      recipeFiberById[id] = columnAsArray(recipesTable, REC.fiber)[i];
      recipeMethodById[id] = columnAsArray(recipesTable, REC.method)[i];
    });
    const recipeIdBySku = {};
    Object.entries(recipeSkuById).forEach(([id, sku]) => { if (sku) recipeIdBySku[sku] = Number(id); });

    // recipeId -> [dyeId, dyeId, ...] — dyeId is the real Dyes row id, resolved via getRefId
    // Is_Powder = sprinkled dry. Powder dyes come off an alphabetical rack, not the
    // prep bench: no staging slot, no reuse grouping, no bin. Skipped here so this
    // map stays identical to batch-planner's.
    const cIds = compTable.id || [];
    const dyesByRecipeId = {};
    cIds.forEach((id, i) => {
      const recipeRef = getRefId(columnAsArray(compTable, COMP.recipe)[i]);
      const dyeRef = getRefId(columnAsArray(compTable, COMP.dye)[i]);
      if (!recipeRef || !dyeRef) return;
      if (COMP.powder && columnAsArray(compTable, COMP.powder)[i]) return;
      if (!dyesByRecipeId[recipeRef]) dyesByRecipeId[recipeRef] = [];
      if (!dyesByRecipeId[recipeRef].includes(dyeRef)) dyesByRecipeId[recipeRef].push(dyeRef);
    });

    // Which dyes get used together in the same recipe — used to group bin suggestions.
    const coUsedDyes = {};
    Object.values(dyesByRecipeId).forEach(dyeList => {
      dyeList.forEach(d1 => {
        if (!coUsedDyes[d1]) coUsedDyes[d1] = new Set();
        dyeList.forEach(d2 => { if (d2 !== d1) coUsedDyes[d1].add(d2); });
      });
    });

    const dyeIds = dyesByRecipeId[record.id] || [];
    // Read the selected recipe's SKU from the resolved Recipes table rather than the
    // raw onRecord payload, so a SKU_Base rename doesn't silently break matching.
    const recipeSku = recipeSkuById[record.id] || '';

    const wolIds = wolTable.id || [];
    const orders = [];
    const pendingRecipeIds = new Set();

    for (let i = 0; i < wolIds.length; i++) {
      const woId = getRefId(columnAsArray(wolTable, WOL.workOrder)[i]);
      const info = woInfo[woId];
      if (!info || !info.active) continue;

      const qtyNeeded = Number(columnAsArray(wolTable, WOL.qtyNeeded)[i]) || 0;
      const allocated = allocByLine[wolIds[i]] || 0;
      const directRecipeId = getRefId(columnAsArray(wolTable, WOL.recipe)[i]);
      const sku = normalize(columnAsArray(wolTable, WOL.sku)[i] || '');
      const lineRecipeId = directRecipeId || recipeIdBySku[sku] || null;
      if (lineRecipeId) pendingRecipeIds.add(lineRecipeId);

      const matches = directRecipeId === record.id || (recipeSku && sku === recipeSku);
      if (!matches) continue;
      if (allocated >= qtyNeeded) continue; // fully handed over, don't clutter the list

      orders.push({
        lineId: wolIds[i],
        orderNumber: info.orderNumber,
        customerName: info.customerName,
        customerId: info.customerId,
        qtyNeeded,
        allocated,
        dueDate: info.dueDate,
      });
    }

    // Bin suggestion — prefer a bin that already holds only this dye and has room,
    // computed upfront so it can show right in the row, not just after a click.
    const BIN_CAPACITY = 12;
    const GENERIC_FILL_CAP = 6;
    const stockEntries = [];
    (stockTableUpfront.id || []).forEach((id, i) => {
      stockEntries.push({
        dyeRef: getRefId(columnAsArray(stockTableUpfront, STOCK.dye)[i]),
        bin: columnAsArray(stockTableUpfront, STOCK.bin)[i] || '',
      });
    });
    function isTrueOneOff(dyeId) {
      const coUsed = coUsedDyes[dyeId];
      return !coUsed || coUsed.size === 0;
    }

    function suggestBinFor(dyeId) {
      const binGroups = {};
      stockEntries.forEach(s => {
        const bin = normBin(s.bin);
        if (!bin) return;
        if (!binGroups[bin]) binGroups[bin] = [];
        binGroups[bin].push(s);
      });
      // 1. Prefer a bin that already has this same dye and still has room.
      for (const [bin, entries] of Object.entries(binGroups)) {
        if (entries.some(e => e.dyeRef === dyeId) && entries.length < BIN_CAPACITY) {
          return { bin, note: 'already has this dye' };
        }
      }

      if (isTrueOneOff(dyeId)) {
        // Route to whichever existing bin already holds only other one-offs —
        // packed full, kept separate from the bins you actually search often.
        let catchAllBin = null;
        for (const [bin, entries] of Object.entries(binGroups)) {
          const allOneOff = entries.every(e => isTrueOneOff(e.dyeRef));
          if (allOneOff && entries.length < BIN_CAPACITY) {
            // Furthest along the shelf, so one-offs collect at the far end.
            if (catchAllBin === null || binOrder(bin) > binOrder(catchAllBin)) catchAllBin = bin;
          }
        }
        if (catchAllBin) return { bin: catchAllBin, note: 'one-off — catch-all bin, out of the way' };
        const next = nextFreeBin(binGroups);
        return next
          ? { bin: next, note: 'one-off — starting a new catch-all bin' }
          : { bin: '', note: 'shelf is full — no empty bin to start' };
      }

      // 2. Prefer a bin holding dyes this one is used together with in the same recipe.
      const coUsed = coUsedDyes[dyeId] || new Set();
      if (coUsed.size) {
        let bestBin = null, bestNeighbors = [];
        for (const [bin, entries] of Object.entries(binGroups)) {
          if (entries.length >= BIN_CAPACITY) continue;
          const neighbors = [...new Set(entries.filter(e => coUsed.has(e.dyeRef)).map(e => e.dyeRef))];
          if (neighbors.length > bestNeighbors.length) { bestNeighbors = neighbors; bestBin = bin; }
        }
        if (bestBin) {
          const names = bestNeighbors.map(dyeShortName).filter(Boolean);
          return { bin: bestBin, note: names.length ? `near ${names.join(', ')} — used together` : 'used together with a dye already there' };
        }
      }

      // 3. Generic fallback: only fill a bin up to the soft cap, leaving
      // headroom for a genuinely related dye to join it later.
      for (const [bin, entries] of Object.entries(binGroups)) {
        if (entries.length < GENERIC_FILL_CAP) return { bin, note: 'next open bin — leaving room for related dyes later' };
      }
      // 4. Nothing eligible — start a new bin.
      const next = nextFreeBin(binGroups);
      return next ? { bin: next, note: 'new bin' } : { bin: '', note: 'shelf is full — no empty bin to start' };
    }

    // ── Today's saved plan (from Batch Planner's "Save Today's Plan") ──
    // Lets us say "keep it out, stage at P2" instead of "put it in a bin",
    // when the dye gets used again soon enough for a prep zone to still be free.
    // Missing table / no plan saved = silently fall back to bin advice.
    let planRows = [];
    try {
      const dpTable = await grist.docApi.fetchTable('Day_Plan');
      // Day_Plan is a bonus (staging advice); resolve its columns but never banner —
      // a missing/renamed column here just drops back to plain bin advice.
      const dpMissing = [];
      const DP = resolveCols(dpTable, 'Day_Plan', {
        planDate: ['Plan_Date'], recipe: ['Recipe'], sequence: ['Sequence'], slot: ['Prep_Slot'],
      }, dpMissing);
      if (dpMissing.length) throw new Error('Day_Plan columns changed: ' + dpMissing.join(', '));
      const today = todayEpochSeconds();
      (dpTable.id || []).forEach((id, i) => {
        if (Number(columnAsArray(dpTable, DP.planDate)[i]) !== today) return;
        const rid = getRefId(columnAsArray(dpTable, DP.recipe)[i]);
        if (!rid) return;
        planRows.push({
          recipeId: rid,
          seq: Number(columnAsArray(dpTable, DP.sequence)[i]) || 0,
          slot: (columnAsArray(dpTable, DP.slot)[i] || '').toString().trim(),
        });
      });
      planRows.sort((a, b) => a.seq - b.seq);
    } catch (err) {
      planRows = [];
    }

    // Day_Plan holds one row per order line, but several lines can share a
    // Sequence when two customers ordered the same colorway — that's one batch
    // at the kettle. Collapse to distinct recipes in running order, or the
    // allocator would think a dye is needed again later and hold a zone for it.
    const planRecipes = [];
    planRows.forEach(r => {
      if (planRecipes.length && planRecipes[planRecipes.length - 1] === r.recipeId) return;
      if (planRecipes.indexOf(r.recipeId) >= 0) return;
      planRecipes.push(r.recipeId);
    });

    // Where a dye goes when it is not going back to a bin: onto the staging shelf
    // with the sheet of the next recipe that needs it. Staging bins follow the
    // day-plan order, so the code here is the same one the pull sheet printed on
    // that recipe's sheet — S-B2 means the bin already holding that sheet and the
    // rest of its dyes.
    //
    // The old prep-zone allocation is gone: it answered "will a zone still be
    // free by then", which mattered when dyes sat on a shared prep table. They
    // now travel to the shelf with the sheet, so the only question is whether
    // anything later today needs this dye at all.
    function stagingFor(dyeId) {
      const meIdx = planRecipes.indexOf(record.id);
      if (meIdx < 0) return null;

      let nextIdx = -1;
      for (let i = meIdx + 1; i < planRecipes.length; i++) {
        if ((dyesByRecipeId[planRecipes[i]] || []).includes(dyeId)) { nextIdx = i; break; }
      }
      if (nextIdx < 0) return null; // not needed again today — it goes in a bin

      return {
        slot: stageCode(nextIdx, STG_COLS),
        recipeName: recipeNameById[planRecipes[nextIdx]] || `Recipe #${planRecipes[nextIdx]}`,
        gap: nextIdx - meIdx,
        inReach: true,
      };
    }

    const cleanupInfo = dyeIds.map(dyeId => {
      const others = [];
      pendingRecipeIds.forEach(rid => {
        if (rid === record.id) return;
        const otherDyeIds = dyesByRecipeId[rid] || [];
        if (otherDyeIds.includes(dyeId)) others.push(recipeNameById[rid] || `Recipe #${rid}`);
      });
      const binSuggestion = suggestBinFor(dyeId);
      return {
        dyeId,
        dyeName: dyeShortName(dyeId),
        dyeDetail: dyeDisplayLabel(dyeId),
        isOneOff: others.length === 0,
        others,
        suggestedBin: binSuggestion.bin,
        suggestedBinNote: binSuggestion.note,
        staging: stagingFor(dyeId),
      };
    });

    const outstanding = orders.reduce((s, o) => s + Math.max(0, o.qtyNeeded - o.allocated), 0);
    const inBins = unwoundByRecipe[record.id] || 0;
    const inStock = stockByRecipe[record.id] || 0;
    currentEntry = {
      recipeId: record.id,
      recipeName: recipeNameById[record.id] || record.Recipe_Name || `Recipe #${record.id}`,
      fiberType: recipeFiberById[record.id] || record.Fiber_Type || '',
      method: recipeMethodById[record.id] || record.Dye_Method || '',
      dyeCount: dyeIds.length, orders, cleanupInfo,
      outstanding, inBins, inStock,
      stockLots: stockLotsByRecipe[record.id] || [],
      stillToMake: Math.max(0, outstanding - inBins - inStock),
    };
    completedActions = {};
    render();
  } catch (e) {
    console.error('Failed to load batch assignment:', e);
    const msg = (e && e.message ? e.message : String(e)).replace(/[<>]/g, '');
    document.getElementById('content').innerHTML =
      `<div class="empty-state">Failed to load.<br><span style="font-size:10px;color:#8B7D72">${msg}</span></div>`;
  }
}

function render() {
  if (!currentEntry) {
    document.getElementById('content').innerHTML = `<div class="empty-state">Select a colorway in Morning Batch Planning to see details here.</div>`;
    return;
  }
  const e = currentEntry;

  const canPull = e.inStock > 0 && e.outstanding > 0;
  const pullHtml = canPull
    ? `<div class="pull-row">
         <span>${Math.min(e.inStock, e.outstanding)} spool${Math.min(e.inStock, e.outstanding) === 1 ? '' : 's'} in the bin can fill waiting orders now</span>
         <button class="pull-btn" onclick="fulfillFromStock()">Pull from stock →</button>
       </div>`
    : '';

  const coverageHtml = `
    <div class="coverage">
      <span><strong>${e.outstanding}</strong> owed</span>
      <span>·</span>
      <span><strong>${e.inBins}</strong> in bins</span>
      ${e.inStock ? `<span>·</span><span><strong>${esc(e.inStock)}</strong> in stock</span>` : ''}
      <span>·</span>
      <span class="${e.stillToMake > 0 ? 'make-more' : 'make-none'}">${e.stillToMake > 0 ? `make ${e.stillToMake} more` : 'enough ✓'}</span>
    </div>
    ${pullHtml}`;

  // One line per order, customer small. Seeing the names is enough to know what
  // is going on, so the heading and the large type both came out.
  const ordersHtml = e.orders.length
    ? `<div class="ord-strip">
         ${e.orders.map(o => {
           const complete = o.allocated >= o.qtyNeeded;
           return `<div class="ord-line">
             <span class="ord-who">${esc(o.customerName || '—')}</span>
             <span class="ord-n ${complete ? 'complete' : ''}">${o.allocated}/${o.qtyNeeded}</span>
           </div>`;
         }).join('')}
         <div class="ord-line total">
           <span class="ord-who">${e.orders.length} order${e.orders.length === 1 ? '' : 's'}</span>
           <span class="ord-n">${e.orders.reduce((t, o) => t + o.allocated, 0)}/${e.orders.reduce((t, o) => t + o.qtyNeeded, 0)}</span>
         </div>
       </div>`
    : `<div class="empty-state">No open orders — anything you make goes to back stock.</div>`;

  const sessionSpools = sessionPots.reduce((s, p) => s + p.spools, 0);
  const runningHtml = sessionPots.length
    ? `<div class="running-total">This colorway so far: <strong>${sessionSpools} spool${sessionSpools === 1 ? '' : 's'}</strong> across ${sessionPots.length} lot${sessionPots.length === 1 ? '' : 's'}</div>` +
      sessionPots.map((p, i) => `
        <div class="pot-done">
          <span>✓ <strong>${esc(p.lotNumber)}</strong> — ${p.spools} spool${p.spools === 1 ? '' : 's'}${p.leftover ? ` · to ${esc(p.bucket)} stock` : ''}</span>
          <span class="undo-link" onclick="undoPot(${i})">↺ undo</span>
        </div>`).join('')
    : '';

  // Just the count and the button. The destination radios and stock-bucket select
  // are gone: every pot stays free for orders, and where spools end up is decided
  // at winding when the real yield is known. logPot() defaults accordingly.
  const potPanelHtml = `
    <div class="pot-panel">
      <div class="pot-row">
        <input type="number" id="pot-spools" placeholder="Spools this pot" min="1">
        <button class="log-btn" onclick="logPot()">✓ Log pot</button>
      </div>
    </div>`;

  // One bordered block per dye. Previously the description and the control were
  // separate siblings, so with several dyes on screen it was guesswork which
  // dropdown belonged to which name.
  const cleanupHtml = e.cleanupInfo.map((c, idx) => {
    const done = completedActions[idx];
    if (done) {
      return `<div class="dye-block done">
        <div class="dye-done-line">
          <span>✓ <strong>${esc(c.dyeDetail)}</strong> — ${esc(done.label)}</span>
          <span class="undo-link" onclick="undoAction(${idx})">Undo</span>
        </div>
      </div>`;
    }

    // Why-line trimmed to the shortest thing that still changes what you do.
    let cls = 'oneoff', why;
    if (c.staging) {
      cls = 'stage';
      // Recipe name alongside the number: if the plan shifts under you, the name
      // is what you match against the sheet on the shelf.
      why = `needed next by ${esc(c.staging.recipeName)}`;
    } else if (c.isOneOff) {
      why = 'one-off';
    } else {
      cls = 'keep';
      why = `also needed by: ${c.others.join(', ')}`;
    }

    // Buttons, not a select — a dropdown needs two accurate taps in gloves and
    // this needs one. The bin is baked into its own button so the suggestion
    // never has to be retyped. Any misclick is one Undo away.
    const stageBtn = c.staging
      ? `<button class="act-btn stage-btn" onclick="stageDye(${idx})">→ ${esc(c.staging.slot)}</button>`
      : '';
    const binBtn = c.suggestedBin
      ? `<button class="act-btn bin" onclick="putAwayDye(${idx})">→ ${esc(c.suggestedBin)}</button>`
      : `<button class="act-btn" onclick="holdDye(${idx})">Hold — shelf full</button>`;

    return `
      <div class="dye-block ${cls}">
        <div class="dye-block-name">${esc(c.dyeDetail)}</div>
        <div class="dye-block-why">${why}</div>
        <div class="btn-row">
          <input type="number" class="ml-input" id="qty-${idx}" placeholder="mL" min="0" max="999" maxlength="3">
          ${stageBtn}
          ${binBtn}
          <button class="act-btn dump" onclick="dumpDye(${idx})">Dump</button>
        </div>
      </div>`;
  }).join('');

  // Everything confirmed for put-away, collected in one place in large type so the
  // list can be read from where the bins are instead of walking back to re-read.
  const putAway = e.cleanupInfo
    .map((c, idx) => ({ c, done: completedActions[idx] }))
    .filter(x => x.done && x.done.board);
  const putAwayHtml = putAway.length
    ? `<div class="putaway">
         <div class="putaway-cap">Put away — ${putAway.length} of ${e.cleanupInfo.length}</div>
         ${putAway.map(x => `
           <div class="putaway-line">
             <span class="putaway-dye">${esc(x.c.dyeDetail)}</span>
             <span class="putaway-bin ${x.done.board.muted ? 'muted' : ''}">${esc(x.done.board.where)}</span>
           </div>`).join('')}
       </div>`
    : '';



  document.getElementById('content').innerHTML = `
    <div class="header-bar">
      <div class="header-line">
        <span class="header-title">${esc(e.recipeName)}</span>
        <span class="header-sub">${e.dyeCount} color${e.dyeCount === 1 ? '' : 's'}${e.fiberType ? ` · ${e.fiberType}` : ''}</span>
      </div>
      <button class="draft-mini" id="draftBtn" onclick="createColorDraft()" title="Combined leftovers into something new?">🎨 draft</button>
    </div>
    ${coverageHtml}
    ${potPanelHtml}
    ${runningHtml}
    ${ordersHtml}
    ${cleanupHtml ? `${putAwayHtml}${cleanupHtml}` : ''}
  `;
}

// Pull existing back-stock spools to cover waiting orders, instead of dyeing new.
// Creates allocations (boxed) from stock lots — oldest bin first — and decrements
// each lot's back-stock bucket. Prefers filling whole orders, like winding does.
async function fulfillFromStock() {
  const e = currentEntry;
  const bucket = RC_STOCKBUCKET;
  if (!bucket) { showToast('No stock bucket column found'); return; }

  // Orders still owed, soonest-due first
  const need = e.orders
    .map(o => ({ ...o, want: Math.max(0, o.qtyNeeded - o.allocated) }))
    .filter(o => o.want > 0)
    .sort((a, b) => dueValue(a.dueDate) - dueValue(b.dueDate));
  if (!need.length) { showToast('No open orders to fill'); return; }
  const noCust = need.find(o => !o.customerId && !o.customerName);
  // (allocations still work off the line link; customer is set if the column exists)

  // Stock lots, oldest first, each with spools to give
  const lots = e.stockLots.map(l => ({ ...l, left: l.stock })).filter(l => l.left > 0);
  const totalStock = lots.reduce((s, l) => s + l.left, 0);
  if (totalStock <= 0) { showToast('No stock left'); return; }

  const { ALLOC } = S_COLS;
  const allocActions = [];   // AddRecord Lot_Allocations
  const lotDelta = {};       // lotId -> spools removed from its bucket

  // Walk orders; for each, draw from stock lots (oldest first) until filled.
  let li = 0;
  for (const o of need) {
    let want = o.want;
    while (want > 0 && li < lots.length) {
      const lot = lots[li];
      if (lot.left <= 0) { li++; continue; }
      const take = Math.min(want, lot.left);
      const f = {};
      f[ALLOC.lot] = lot.lotId;
      f[ALLOC.qty] = take;
      f[ALLOC.status] = S.woundStatus || 'Wound - Needs Labels';
      if (ALLOC.customer && o.customerId) f[ALLOC.customer] = o.customerId;
      if (ALLOC.line) f[ALLOC.line] = o.lineId;
      allocActions.push(['AddRecord', 'Lot_Allocations', null, f]);
      lotDelta[lot.lotId] = (lotDelta[lot.lotId] || 0) + take;
      lot.left -= take;
      want -= take;
      if (lot.left <= 0) li++;
    }
    if (li >= lots.length) break; // stock exhausted
  }

  if (!allocActions.length) { showToast('Nothing to pull'); return; }

  try {
    // Decrement each stock lot's bucket
    const lotActions = e.stockLots
      .filter(l => lotDelta[l.lotId])
      .map(l => ['UpdateRecord', 'Production_Lots', l.lotId, { [bucket]: Math.max(0, l.stock - lotDelta[l.lotId]) }]);
    await grist.docApi.applyUserActions([...allocActions, ...lotActions]);
    showToast(`Pulled ${allocActions.reduce((s, a) => s + a[3][ALLOC.qty], 0)} from stock ✓`);
    await loadForRecipe({ id: e.recipeId });
  } catch (err) {
    console.error('Failed to fulfill from stock:', err);
    showToast('Failed — check Lot_Allocations');
  }
}
function nextLotNumber(lotsTable, lotNumberCol) {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const prefix = 'LOT-' + String(d.getFullYear()).slice(2) + p(d.getMonth() + 1) + p(d.getDate()) + '-';
  let max = 0;
  const scan = v => {
    const s = (v || '').toString();
    if (s.indexOf(prefix) === 0) {
      const n = parseInt(s.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  };
  (columnAsArray(lotsTable, lotNumberCol) || []).forEach(scan);
  sessionPots.forEach(p2 => scan(p2.lotNumber)); // belt-and-suspenders within a session
  return prefix + (max + 1);
}

// Log one pot = one dye lot. Creates a Production_Lots row, covers pending orders
// (soonest-due first) by bumping Qty_Dyed, and sends any leftover to a stock bucket.
// Per-customer physical assignment is deferred to winding — no allocations here.
async function logPot() {
  const spoolsInput = document.getElementById('pot-spools');
  const spools = Number(spoolsInput.value) || 0;
  if (spools <= 0) { showToast('Enter how many spools this pot made'); return; }

  const e = currentEntry;
  // Every pot stays free for orders. Sending spools to a stock bucket is a
  // sit-down inventory decision, not a wet-gloves-at-the-kettle one.
  const mode = 'cover';
  const bucket = 'store';
  const yds = yardsPerSpool(e.fiberType);

  // Nothing is assigned to a customer here. Who gets which spools is decided at
  // winding, when the real yield is known — so the pot either stays free for
  // orders (unassigned on the lot) or goes straight to a stock bucket.
  const leftover = mode === 'stock' ? spools : 0;

  try {
    // Resolve Production_Lots columns fresh (rename-proof) and mint a lot number.
    const lotsTable = await grist.docApi.fetchTable('Production_Lots');
    const lm = [];
    const opt = cands => ({ cands, required: false });
    const LOT = resolveCols(lotsTable, 'Production_Lots', {
      lotNumber: ['Lot_Number'], recipe: opt(['Recipe']),
      yardsMade: opt(['Total_Yards_Made']), spoolsMade: opt(['Spools_Made']),
      dryingStatus: opt(['Drying_Status']), fiber: opt(['Fiber', 'Form', 'Fiber_Type']),
      date: opt(['Date_Dyed', 'Lot_Date', 'Date']),
      storeStock: opt(['Store_Stock_Spools']), vendorStock: opt(['Vendor_Stock_Spools']),
      generalStock: opt(['General_Stock_Spools']),
    }, lm);
    if (lm.length) { showToast('Production_Lots missing ' + lm.join(', ')); return; }

    const lotNumber = nextLotNumber(lotsTable, LOT.lotNumber);
    const lotFields = {};
    lotFields[LOT.lotNumber] = lotNumber;
    if (LOT.recipe) lotFields[LOT.recipe] = e.recipeId;
    if (LOT.yardsMade) lotFields[LOT.yardsMade] = spools * yds;
    if (LOT.spoolsMade) lotFields[LOT.spoolsMade] = spools;
    if (LOT.dryingStatus) lotFields[LOT.dryingStatus] = 'Drying - Wet Rack';
    if (LOT.fiber && e.fiberType) lotFields[LOT.fiber] = fiberCode(e.fiberType);
    if (LOT.date) lotFields[LOT.date] = todayEpochSeconds();
    if (leftover > 0) {
      const col = bucket === 'vendor' ? (LOT.vendorStock || LOT.generalStock)
                                      : (LOT.storeStock || LOT.generalStock);
      if (col) lotFields[col] = leftover;
    }

    const addRes = await grist.docApi.applyUserActions([['AddRecord', 'Production_Lots', null, lotFields]]);
    const newLotId = addRes.retValues[0];

    sessionPots.push({ lotId: newLotId, lotNumber, spools, leftover, bucket });
    spoolsInput.value = '';
    await loadForRecipe({ id: e.recipeId }); // recompute coverage from the new lot
    showToast(`Logged ${lotNumber} — ${spools} spool${spools === 1 ? '' : 's'} ✓`);
  } catch (err) {
    console.error('Failed to log pot:', err);
    showToast('Failed — check Production_Lots / Work_Order_Lines');
  }
}

async function undoPot(idx) {
  const pot = sessionPots[idx];
  if (!pot) return;
  try {
    await grist.docApi.applyUserActions([['RemoveRecord', 'Production_Lots', pot.lotId]]);
    sessionPots.splice(idx, 1);
    await loadForRecipe({ id: currentEntry.recipeId });
    showToast('Pot undone ✓');
  } catch (err) {
    console.error('Failed to undo pot:', err);
    showToast('Undo failed — check Production_Lots');
  }
}

// Staging writes nothing to Dye_Stock on purpose — the dye never left the bench,
// so there's no stock location to record. It just closes out the row for the day.
async function stageDye(idx) {
  const c = currentEntry.cleanupInfo[idx];
  const slot = c.staging ? c.staging.slot : '?';
  const next = c.staging ? ` (${esc(c.staging.recipeName)})` : '';
  completedActions[idx] = {
    label: `→ ${esc(slot)}${next}`,
    board: { where: slot, muted: false },
    undo: async () => {},
  };
  render();
}

async function putAwayDye(idx) {
  const c = currentEntry.cleanupInfo[idx];
  if (!c.dyeId) { showToast(`${c.dyeName} isn't linked to a Dyes row — can't log stock`); return; }
  const qty = Number(document.getElementById(`qty-${idx}`).value) || 0;
  if (qty <= 0) { showToast('Enter how many mL are left'); return; }

  // Bin comes from the button, already normalised when suggestBinFor computed it.
  // There is no bin field to read any more: the suggestion was never overridden
  // in practice, and a free-text box in gloves is how bad codes got in.
  const bin = normBin(c.suggestedBin);
  if (!bin) { showToast('No bin available — shelf may be full'); return; }

  try {
    // One dye, one jar. Rather than asking "same batch or freshly mixed?" on every
    // put-away, an existing row for this dye is updated in place — a new mix always
    // replaces the old one, so a second row would be a data error either way.
    const stockTable = await grist.docApi.fetchTable('Dye_Stock');
    const sIds = stockTable.id || [];
    let existingId = null;
    for (let i = 0; i < sIds.length; i++) {
      if (getRefId(columnAsArray(stockTable, stockCol('dye','Dye'))[i]) === c.dyeId) { existingId = sIds[i]; break; }
    }

    if (existingId === null) {
      const result = await grist.docApi.applyUserActions([
        ['AddRecord', 'Dye_Stock', null, { [stockCol('dye','Dye')]: c.dyeId, [stockCol('quantity','Quantity_mL')]: qty, [stockCol('bin','Bin_Location')]: bin, [stockCol('mixedDate','Mixed_Date')]: Math.floor(Date.now() / 1000) }]
      ]);
      const newRowId = result.retValues[0];
      completedActions[idx] = {
        label: `${qty}mL → ${bin}`,
        board: { where: bin, muted: false },
        undo: async () => {
          await grist.docApi.applyUserActions([['RemoveRecord', 'Dye_Stock', newRowId]]);
        },
      };
    } else {
      const rowIdx = sIds.indexOf(existingId);
      const originalQty = columnAsArray(stockTable, stockCol('quantity','Quantity_mL'))[rowIdx];
      const originalBin = columnAsArray(stockTable, stockCol('bin','Bin_Location'))[rowIdx];
      const originalDate = columnAsArray(stockTable, stockCol('mixedDate','Mixed_Date'))[rowIdx];
      await grist.docApi.applyUserActions([
        ['UpdateRecord', 'Dye_Stock', existingId, { [stockCol('quantity','Quantity_mL')]: qty, [stockCol('bin','Bin_Location')]: bin, [stockCol('mixedDate','Mixed_Date')]: Math.floor(Date.now() / 1000) }]
      ]);
      completedActions[idx] = {
        label: `${qty}mL → ${bin}`,
        board: { where: bin, muted: false },
        undo: async () => {
          await grist.docApi.applyUserActions([['UpdateRecord', 'Dye_Stock', existingId, { [stockCol('quantity','Quantity_mL')]: originalQty, [stockCol('bin','Bin_Location')]: originalBin, [stockCol('mixedDate','Mixed_Date')]: originalDate }]]);
        },
      };
    }
    render();
  } catch (e) {
    console.error('Failed to put away dye:', e);
    showToast('Failed — check the Dye_Stock table');
  }
}

async function holdDye(idx) {
  const c = currentEntry.cleanupInfo[idx];
  if (!c.dyeId) { showToast(`${c.dyeName} isn't linked to a Dyes row — can't log stock`); return; }
  const qty = Number(document.getElementById(`qty-${idx}`).value) || 0;
  if (qty <= 0) { showToast('Enter how many mL are left'); return; }

  try {
    // Same one-jar-per-dye upsert as putAwayDye, minus the bin.
    const stockTable = await grist.docApi.fetchTable('Dye_Stock');
    const sIds = stockTable.id || [];
    let existingId = null;
    for (let i = 0; i < sIds.length; i++) {
      if (getRefId(columnAsArray(stockTable, stockCol('dye','Dye'))[i]) === c.dyeId) { existingId = sIds[i]; break; }
    }

    if (existingId === null) {
      const result = await grist.docApi.applyUserActions([
        ['AddRecord', 'Dye_Stock', null, { [stockCol('dye','Dye')]: c.dyeId, [stockCol('quantity','Quantity_mL')]: qty, [stockCol('mixedDate','Mixed_Date')]: Math.floor(Date.now() / 1000) }]
      ]);
      const newRowId = result.retValues[0];
      completedActions[idx] = {
        label: `held — ${qty}mL, no bin`,
        board: { where: 'no bin yet', muted: true },
        undo: async () => { await grist.docApi.applyUserActions([['RemoveRecord', 'Dye_Stock', newRowId]]); },
      };
    } else {
      const rowIdx = sIds.indexOf(existingId);
      const originalQty = columnAsArray(stockTable, stockCol('quantity','Quantity_mL'))[rowIdx];
      await grist.docApi.applyUserActions([
        ['UpdateRecord', 'Dye_Stock', existingId, { [stockCol('quantity','Quantity_mL')]: qty }]
      ]);
      completedActions[idx] = {
        label: `held — ${qty}mL, no bin`,
        board: { where: 'no bin yet', muted: true },
        undo: async () => { await grist.docApi.applyUserActions([['UpdateRecord', 'Dye_Stock', existingId, { [stockCol('quantity','Quantity_mL')]: originalQty }]]); },
      };
    }
    render();
  } catch (e) {
    console.error('Failed to hold dye:', e);
    showToast('Failed — check the Dye_Stock table');
  }
}

async function dumpDye(idx) {
  const c = currentEntry.cleanupInfo[idx];
  if (!c.dyeId) {
    completedActions[idx] = { label: 'dumped', undo: async () => {} };
    render();
    return;
  }

  let existing = [];
  try {
    const stockTable = await grist.docApi.fetchTable('Dye_Stock');
    const sIds = stockTable.id || [];
    sIds.forEach((id, i) => {
      const dyeRef = getRefId(columnAsArray(stockTable, stockCol('dye','Dye'))[i]);
      if (dyeRef !== c.dyeId) return;
      existing.push({
        id,
        dye: c.dyeId,
        qty: columnAsArray(stockTable, stockCol('quantity','Quantity_mL'))[i],
        bin: columnAsArray(stockTable, stockCol('bin','Bin_Location'))[i],
        mixedDate: columnAsArray(stockTable, stockCol('mixedDate','Mixed_Date'))[i],
      });
    });
  } catch (e) {
    console.error('Could not check existing stock before dumping:', e);
  }

  if (!existing.length) {
    completedActions[idx] = { label: 'Dumped (no premade stock was on record)', undo: async () => {} };
    render();
    return;
  }

  const totalQty = existing.reduce((s, e) => s + (Number(e.qty) || 0), 0);
  if (!confirm(`This will remove ${totalQty}mL of recorded premade stock for ${c.dyeName}. Continue?`)) return;

  try {
    await grist.docApi.applyUserActions(existing.map(e => ['RemoveRecord', 'Dye_Stock', e.id]));
    completedActions[idx] = {
      label: `dumped — ${totalQty}mL removed from stock`,
      undo: async () => {
        await grist.docApi.applyUserActions(existing.map(e => ['AddRecord', 'Dye_Stock', null, { [stockCol('dye','Dye')]: e.dye, [stockCol('quantity','Quantity_mL')]: e.qty, [stockCol('bin','Bin_Location')]: e.bin, [stockCol('mixedDate','Mixed_Date')]: e.mixedDate }]));
      },
    };
    render();
  } catch (e) {
    console.error('Failed to dump dye stock:', e);
    showToast('Failed — check the Dye_Stock table');
  }
}

async function undoAction(idx) {
  const done = completedActions[idx];
  if (!done) return;
  try {
    await done.undo();
    delete completedActions[idx];
    render();
    showToast('Undone — pick an option again if needed');
  } catch (e) {
    console.error('Undo failed:', e);
    showToast('Undo failed — check the Dye_Stock table');
  }
}

// One click, no typing: mint the next draft code, create the Recipe named for it
// and its Production_Lot, then show the code big enough to copy onto a tag with
// dye on your hands. Everything else — dyes, amounts, what you were going for —
// gets written on the tag and entered at control later.
//
// Format matches Quick Draft exactly (DR-YYMMDD-n) and the next number is read
// from Production_Lots.Draft_Code, so the two can be used interchangeably and
// will never collide.
async function createColorDraft() {
  const btn = document.getElementById('draftBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  try {
    const lotsT = await grist.docApi.fetchTable('Production_Lots');
    const cDraft  = findColumn(lotsT, ['Draft_Code']);
    const cRecipe = findColumn(lotsT, ['Recipe']);
    const cStatus = findColumn(lotsT, ['Drying_Status']);
    const cDate   = findColumn(lotsT, ['Date_Dyed']);
    const cFiber  = findColumn(lotsT, ['Fiber']);
    if (!cDraft) throw new Error('Production_Lots has no Draft_Code column');

    const d = new Date(), pad = n => String(n).padStart(2, '0');
    const prefix = 'DR-' + String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate()) + '-';
    let max = 0;
    columnAsArray(lotsT, cDraft).forEach(v => {
      const c = String(v || '');
      if (c.indexOf(prefix) === 0) {
        const n = parseInt(c.slice(prefix.length), 10);
        if (!isNaN(n) && n > max) max = n;
      }
    });
    const code = prefix + (max + 1);

    const rec = await grist.docApi.applyUserActions([['AddRecord', 'Recipes', null, {
      Recipe_Name: code,
      Notes: currentEntry ? `Draft started at the kettle while working on ${currentEntry.recipeName}` : 'Draft started at the kettle',
    }]]);
    const recipeId = rec && rec.retValues && rec.retValues[0];

    const lot = {};
    lot[cDraft] = code;
    if (cRecipe && recipeId) lot[cRecipe] = recipeId;
    if (cStatus) lot[cStatus] = 'Drying - Metal Rack';
    if (cFiber && currentEntry && currentEntry.fiber) lot[cFiber] = currentEntry.fiber;
    // Grist DateTime wants epoch SECONDS at UTC midnight, never milliseconds.
    if (cDate) lot[cDate] = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 1000;
    await grist.docApi.applyUserActions([['AddRecord', 'Production_Lots', null, lot]]);

    showDraftCode(code);
  } catch (e) {
    console.error('Failed to create draft:', e);
    showToast('Failed — ' + (e && e.message ? e.message : 'check Production_Lots'));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🎨 New colour draft — get a code'; }
  }
}

// Big, high-contrast, stays until dismissed. You're going to read this with dye
// on your hands from a foot away, so it doesn't time out like a toast.
function showDraftCode(code) {
  let el = document.getElementById('draftCodeOverlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'draftCodeOverlay';
    el.style.cssText = 'position:fixed;inset:0;background:rgba(20,15,13,.93);z-index:9999;'
      + 'display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;';
    el.onclick = () => el.remove();
    document.body.appendChild(el);
  }
  el.innerHTML = '<div style="color:#C9B8AE;font-size:15px;letter-spacing:2px;'
    + 'text-transform:uppercase;margin-bottom:14px;">write this on the tag</div>'
    + '<div style="font-family:\'Courier New\',monospace;font-size:64px;font-weight:bold;'
    + 'color:#fff;letter-spacing:3px;">' + esc(code) + '</div>'
    + '<div style="color:#9C8A80;font-size:14px;margin-top:22px;">'
    + 'Lot created. Dyes, amounts and spool count go on the tag — control enters them later.</div>'
    + '<div style="color:#6E5F58;font-size:12px;margin-top:30px;">tap anywhere to close</div>';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

grist.ready({
  requiredAccess: 'full'
});

grist.onRecord((record) => {
  sessionPots = [];
  loadForRecipe(record);
});
</script>
