<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614;
  --paper: #F7F3EE;
  --warm: #E8DFD4;
  --rule: #D4C9BC;
  --accent: #8B3A2A;
  --accent-light: #F2E8E5;
  --teal: #3A8B7A;
  --teal-light: #E5F2EF;
  --gold: #B07D2A;
  --gold-light: #F5EDD8;
  --done-bg: #EAF3DE;
  --done-border: #639922;
  --done-text: #27500A;
  --star: #C8A020;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  line-height: 1.5;
  padding: 16px;
}
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 80vh;
  color: #8B7D72;
  text-align: center;
  padding: 40px;
}
.empty-icon { font-size: 40px; margin-bottom: 12px; opacity: .4; }
.empty-title { font-family: 'Libre Baskerville', serif; font-size: 16px; color: #6B5E52; margin-bottom: 6px; }
.empty-sub { font-size: 12px; }
.order-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.order-title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
.order-sub { font-size: 12px; color: #6B5E52; }
.order-tag {
  font-size: 10px; padding: 2px 7px; border-radius: 3px; font-weight: 500;
  letter-spacing: .03em; text-transform: uppercase;
  background: var(--teal-light); color: var(--teal); border: 1px solid #9ACFC7;
}
.search-row { margin: 14px 0 18px; }
.search-input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--rule); border-radius: 6px;
  font-family: 'Inter', sans-serif; font-size: 13px; background: white; color: var(--ink); outline: none;
}
.search-input:focus { border-color: var(--accent); }
.slabel {
  font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: #8B7D72; margin: 20px 0 10px;
}
.slabel:first-of-type { margin-top: 0; }
.line-block {
  border: 1px solid var(--rule); border-radius: 8px; padding: 12px; margin-bottom: 14px; background: white;
}
.line-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.line-sku { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }
.line-qty { font-size: 11px; color: #8B7D72; }
.line-guess { font-size: 11px; color: #8B7D72; font-style: italic; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.no-match { color: #8B7D72; font-size: 12px; font-style: italic; padding: 6px 0; }
.pcard {
  border: 1.5px solid var(--warm); border-radius: 6px; overflow: hidden; background: white;
}
.pcard.fav { border-color: var(--star); }
.pcard img {
  width: 100%; height: 150px; object-fit: contain; display: block;
  background: var(--warm); padding: 4px; box-sizing: border-box;
}
.pcard img.lazy-photo:not(.loaded) { opacity: 0.3; }
.pcard img.lazy-photo { transition: opacity 0.2s; }
.pcard-body { padding: 8px; }
.pcard-name { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
.pcard-meta { font-size: 10px; color: #8B7D72; margin-bottom: 6px; }
.pcard-status {
  display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 3px;
  text-transform: uppercase; letter-spacing: .04em; font-weight: 500; margin-bottom: 6px;
}
.status-approved { background: var(--done-bg); color: var(--done-text); }
.status-pending { background: var(--gold-light); color: var(--gold); }
.status-rejected { background: var(--accent-light); color: var(--accent); }
.status-other { background: var(--warm); color: #6B5E52; }
.pcard-actions { display: flex; align-items: center; gap: 6px; }
.star-btn {
  background: none; border: none; cursor: pointer; font-size: 16px; color: var(--rule); line-height: 1; padding: 2px;
}
.star-btn.on { color: var(--star); }
.rot-btn {
  background: none; border: 1px solid var(--rule); border-radius: 3px; cursor: pointer;
  font-size: 12px; line-height: 1; padding: 3px 5px; color: #6B5E52;
  font-family: 'Inter', sans-serif;
}
.rot-btn:hover { border-color: var(--accent); color: var(--accent); }
.rot-btn:disabled { opacity: .4; cursor: default; }
.share-btn {
  flex: 1; font-size: 11px; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--accent);
  background: var(--accent); color: white; cursor: pointer; font-family: 'Inter', sans-serif;
}
.share-btn:disabled { opacity: .6; cursor: default; }
.share-btn.shared { background: var(--done-bg); border-color: var(--done-border); color: var(--done-text); }
.share-note { font-size: 9px; color: #8B7D72; margin-top: 4px; }
.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="empty" id="emptyState">
  <div class="empty-icon">🖼️</div>
  <div class="empty-title">No order selected</div>
  <div class="empty-sub">Click a row in the Work Orders table to see its photo matches</div>
</div>

<div id="mainView" style="display:none">
  <div class="order-header">
    <div class="order-title" id="orderTitle"></div>
    <div class="order-sub" id="orderSub"></div>
    <div class="order-tag" id="orderChannel"></div>
  </div>

  <div class="search-row">
    <input class="search-input" id="searchBox" type="text" placeholder="Search this order's colorways..." oninput="renderSearch(this.value)">
  </div>
  <div id="searchResults"></div>

  <div id="linesContainer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
// Replace with the production webhook URL once the n8n workflow
// "SS - Share Photo to Vendor" is built and activated.
const WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/share-photo';
// Vendor codes drive SKU-suffix parsing. The literal below is only a SEED so
// parsing still works before the Customers fetch lands — refreshVendorCodes()
// then replaces it with the live list, so adding a customer in Grist can never
// again leave a vendor unrecognised and glue its code onto the colorway name.
// Keep this pair byte-identical across widgets.
let VENDOR_CODES = ['RDG','MMI','DNR','HBO','FOR','OBO','BMW','CDR','VVM','ACD','SOB',
  'JIR','TRM','BAF','MYO','DWK','ALA','VAR','BBR','KPA','RIG','NWW'];
function refreshVendorCodes(customersTable) {
  if (!customersTable) return;
  const col = findColumn(customersTable, ['Code', 'Vendor_Code', 'Customer_Code', 'Abbreviation']);
  if (!col) return;
  const codes = (Array.isArray(customersTable[col]) ? customersTable[col] : [])
    .map(c => String(c || '').trim().toUpperCase()).filter(Boolean);
  if (codes.length) VENDOR_CODES = [...new Set(codes)];
}

let currentOrder = null;
let orderLines = [];
let allPhotos = [];
let existingShares = []; // [{photoId, workOrderId, destPath, sharedAt}]
let vendorCode = '';

function getRefId(ref) {
  if (typeof ref === 'number') return ref;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
/* Accent folding — KEEP BYTE-IDENTICAL ACROSS WIDGETS.
   normalize() strips anything outside a-z0-9, which DELETES accented letters
   rather than folding them: "Pathétique" became "pathtique" while the file
   "Pathetique.jpg" became "pathetique", so the two never matched and the widget
   reported nothing found. NFD splits a letter from its diacritic so the
   diacritic can be dropped and the base letter kept; the map handles the
   characters that have no decomposition (ß, ø, æ and friends).
   Display is untouched — this only ever builds comparison keys. */
const ACCENT_FOLD_MAP = { 'æ':'ae','Æ':'ae','œ':'oe','Œ':'oe','ø':'o','Ø':'o',
  'ß':'ss','đ':'d','Đ':'d','ð':'d','Ð':'d','ł':'l','Ł':'l','þ':'th','Þ':'th' };
function foldAccents(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[æÆœŒøØßđĐðÐłŁþÞ]/g, c => ACCENT_FOLD_MAP[c] || c);
}

function normalize(s) {
  return foldAccents((s || '').toString()).toLowerCase().replace(/[^a-z0-9]/g, '');
}
// normalize() strips separators entirely, which destroys word boundaries and makes
// raw substring tests dangerously loose: "ukraineflag".includes("rain") is true, so
// Ukraine Flag photos were matching every FFN_RAIN_* line. Keep words separated so
// containment can be tested at whole-word granularity instead.
function normWords(s) {
  return foldAccents((s || '').toString()).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}
// True only when `needle`'s words appear as a complete whole-word run inside `hay`.
// "sunset" matches "sunset glow"; "rain" does NOT match "ukraine flag".
function wordContains(hay, needle) {
  if (!hay || !needle) return false;
  return (' ' + hay + ' ').includes(' ' + needle + ' ');
}
function parseColorwayFromSKU(sku) {
  if (!sku) return '';
  const parts = sku.split('_');
  if (parts.length < 2) return sku;
  parts.shift(); // drop fiber prefix (FFN, EN, FFC, BW)
  const last = parts[parts.length - 1];
  if (parts.length > 1 && VENDOR_CODES.includes((last || '').toUpperCase())) {
    parts.pop(); // drop trailing vendor reservation tag
  }
  return parts.join(' ');
}
function columnAsArray(tableData, col) {
  return Array.isArray(tableData[col]) ? tableData[col] : [];
}
function rowsFromTableData(tableData, colNames) {
  const ids = tableData.id || [];
  return ids.map((id, i) => {
    const row = { id };
    colNames.forEach(c => { row[c] = columnAsArray(tableData, c)[i]; });
    return row;
  });
}
function findColumn(tableData, candidates) {
  const keys = Object.keys(tableData);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase() === cand.toLowerCase());
    if (hit) return hit;
  }
  return null;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function statusClass(status) {
  const s = (status || '').toLowerCase();
  if (s.includes('approve')) return 'status-approved';
  if (s.includes('pend')) return 'status-pending';
  if (s.includes('reject')) return 'status-rejected';
  return 'status-other';
}

async function loadData(record) {
  currentOrder = record;
  const orderId = record.id;

  document.getElementById('orderTitle').textContent = record.Order_Number || 'Order';
  document.getElementById('orderSub').textContent = record.Customer_Name || '';
  document.getElementById('orderChannel').textContent = record.Channel || record.Order_Type || '';

  try {
    const [linesData, photosData, customersData, sharesData] = await Promise.all([
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Product_Photos'),
      grist.docApi.fetchTable('Customers'),
      grist.docApi.fetchTable('Photo_Shares').catch(() => null),
    ]);
    refreshVendorCodes(customersData);

    // Work order lines for this order
    const lineRows = rowsFromTableData(linesData, ['Work_Order', 'SKU', 'Qty_Needed', 'Qty_Dyed', 'Production_Priority']);
    orderLines = lineRows.filter(l => getRefId(l.Work_Order) === orderId);

    // All product photos
    allPhotos = rowsFromTableData(photosData, ['Colorway_Name', 'Recipe', 'Fiber_Type', 'Lot_Date',
      'Nextcloud_URL', 'Status', 'Share_With', 'Is_Favorite', 'Notes', 'Source_Filename']);

    // Vendor code lookup — tries common column names, falls back gracefully
    const nameCol = findColumn(customersData, ['Name', 'Customer_Name', 'Vendor_Name']);
    const codeCol = findColumn(customersData, ['Code', 'Vendor_Code', 'Customer_Code', 'Abbreviation']);
    vendorCode = '';
    if (nameCol && codeCol) {
      const names = columnAsArray(customersData, nameCol);
      const codes = columnAsArray(customersData, codeCol);
      const idx = names.findIndex(n => normalize(n) === normalize(record.Customer_Name));
      if (idx >= 0) vendorCode = codes[idx];
    }
    if (!vendorCode) {
      // fallback: guess from the customer name itself if it's already a short code
      vendorCode = (record.Customer_Name || '').toString().slice(0, 3).toUpperCase();
    }

    // Existing shares, if the Photo_Shares table exists yet
    existingShares = [];
    if (sharesData) {
      const shareRows = rowsFromTableData(sharesData, ['Photo', 'Work_Order', 'Dest_Path', 'Shared_At']);
      existingShares = shareRows.map(s => ({
        shareId: s.id,
        photoId: getRefId(s.Photo),
        workOrderId: getRefId(s.Work_Order),
        destPath: s.Dest_Path,
        sharedAt: s.Shared_At,
      }));
    }
  } catch (e) {
    console.error('Failed to load data:', e);
    orderLines = [];
    allPhotos = [];
    existingShares = [];
  }

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('searchBox').value = '';
  document.getElementById('searchResults').innerHTML = '';
  renderLines();
}

function photoSort(a, b) {
  if (!!b.Is_Favorite !== !!a.Is_Favorite) return (b.Is_Favorite ? 1 : 0) - (a.Is_Favorite ? 1 : 0);
  return (Number(b.Lot_Date) || 0) - (Number(a.Lot_Date) || 0);
}

// Two tiers, because sharing the wrong colorway to a vendor is a real cost:
//   exact — normalized names are identical. Shown by default.
//   close — one name's words fully contain the other's ("Sunset" vs "Sunset Glow").
//           Shown only when there is no exact match, and labelled as approximate.
function matchPhotos(colorwayGuess) {
  const gTight = normalize(colorwayGuess);
  const gWords = normWords(colorwayGuess);
  if (!gTight) return { exact: [], close: [] };

  const exact = [];
  const close = [];
  allPhotos.forEach(p => {
    const nTight = normalize(p.Colorway_Name);
    if (!nTight) return;
    if (nTight === gTight) { exact.push(p); return; }
    const nWords = normWords(p.Colorway_Name);
    if (wordContains(nWords, gWords) || wordContains(gWords, nWords)) close.push(p);
  });

  return { exact: exact.sort(photoSort), close: close.sort(photoSort) };
}

// Every colorway guess derived from this order's own line items — used to
// keep manual search scoped to what's actually relevant to this order,
// instead of searching the entire photo library.
function orderColorwayGuesses() {
  // Raw (not normalize()d) so callers can still see word boundaries.
  return orderLines.map(l => parseColorwayFromSKU(l.SKU)).filter(Boolean);
}

function photoCardHTML(p) {
  const shareRecord = existingShares.find(s => s.photoId === p.id && s.workOrderId === currentOrder.id);
  const fav = !!p.Is_Favorite;
  const safeDestPath = shareRecord ? shareRecord.destPath.replace(/'/g, "\\'").replace(/"/g, '&quot;') : '';
  const sharedDateLabel = shareRecord && shareRecord.sharedAt
    ? new Date(shareRecord.sharedAt * 1000).toLocaleDateString()
    : '';
  return `
    <div class="pcard ${fav ? 'fav' : ''}" id="pcard-${p.id}">
      <img class="lazy-photo" data-src="${p.Nextcloud_URL || ''}" alt="${p.Colorway_Name || ''}">
      <div class="pcard-body">
        <div class="pcard-name">${p.Colorway_Name || 'Untitled'}</div>
        <div class="pcard-meta">${p.Fiber_Type || ''}${p.Lot_Date ? ' · ' + p.Lot_Date : ''}</div>
        <span class="pcard-status ${statusClass(p.Status)}">${p.Status || 'unknown'}</span>
        <div class="pcard-actions">
          <button class="star-btn ${fav ? 'on' : ''}" onclick="toggleFavorite(${p.id}, ${fav})" title="Mark as favorite">★</button>
          <button class="rot-btn" onclick="rotatePhoto(${p.id}, 'ccw', this)" title="Rotate 90° counter-clockwise">↺</button>
          <button class="rot-btn" onclick="rotatePhoto(${p.id}, 'cw', this)" title="Rotate 90° clockwise">↻</button>
          ${shareRecord
            ? `<button class="share-btn shared" onclick="unsharePhoto(${p.id}, ${shareRecord.shareId}, '${safeDestPath}', this)" title="Click to remove from vendor folder">Shared ✓ — undo</button>`
            : `<button class="share-btn" onclick="sharePhoto(${p.id}, this)">Share to order</button>`}
        </div>
        ${shareRecord ? `<div class="share-note">Sent${sharedDateLabel ? ' ' + sharedDateLabel : ''} — click to remove</div>` : ''}
      </div>
    </div>`;
}

function renderLines() {
  const container = document.getElementById('linesContainer');
  if (!orderLines.length) {
    container.innerHTML = `<div class="no-match">No line items found for this order.</div>`;
    return;
  }
  container.innerHTML = orderLines.map(line => {
    const guess = parseColorwayFromSKU(line.SKU);
    const { exact, close } = matchPhotos(guess);
    let body;
    if (exact.length) {
      body = `<div class="photo-grid">${exact.map(photoCardHTML).join('')}</div>`;
    } else if (close.length) {
      body = `
        <div class="no-match">No exact match for "${guess}" — close names only, check before sharing.</div>
        <div class="photo-grid">${close.map(photoCardHTML).join('')}</div>`;
    } else {
      body = `<div class="no-match">No photos matched automatically — search below to find one manually.</div>`;
    }
    return `
      <div class="line-block">
        <div class="line-head">
          <span class="line-sku">${line.SKU || '—'}</span>
          <span class="line-qty">qty ${line.Qty_Needed ?? '—'}</span>
          <span class="line-guess">matching "${guess}"</span>
        </div>
        ${body}
      </div>`;
  }).join('');
  loadImagesInBatches();
}

// Load photos a few at a time instead of all at once. Firing every thumbnail
// request at the n8n photo2 proxy simultaneously overwhelms it and trips n8n's
// crash detection, which takes the workflow offline. Two-at-a-time, with one
// retry on error, keeps the proxy's queue small. (Same pattern as photo-inbox.)
async function loadImagesInBatches() {
  const images = Array.from(document.querySelectorAll('img.lazy-photo:not(.loaded)'));
  const BATCH_SIZE = 2;
  for (let i = 0; i < images.length; i += BATCH_SIZE) {
    const batch = images.slice(i, i + BATCH_SIZE);
    await Promise.all(batch.map(img => loadOneImageWithRetry(img)));
  }
}

function loadOneImageWithRetry(img) {
  return new Promise(resolve => {
    const src = img.getAttribute('data-src');
    if (!src) { resolve(); return; }
    let retried = false;
    img.onload = () => { img.classList.add('loaded'); resolve(); };
    img.onerror = () => {
      if (!retried) {
        retried = true;
        setTimeout(() => { img.src = src; }, 1500);
      } else {
        img.style.opacity = 0.2;
        resolve();
      }
    };
    img.src = src;
  });
}

function renderSearch(query) {
  const results = document.getElementById('searchResults');
  const q = normalize(query);
  if (!q) { results.innerHTML = ''; return; }

  const orderGuesses = orderColorwayGuesses();

  const matches = allPhotos
    .filter(p => {
      const n = normalize(p.Colorway_Name);
      if (!n) return false;
      // Must belong to a colorway that's actually on this order — whole-word
      // containment only, same rule as matchPhotos().
      const nWords = normWords(p.Colorway_Name);
      const belongsToOrder = orderGuesses.some(g =>
        g && (normalize(g) === n || wordContains(nWords, normWords(g)) || wordContains(normWords(g), nWords)));
      if (!belongsToOrder) return false;
      // ...and match what was typed.
      return n.includes(q);
    })
    .sort((a, b) => (Number(b.Lot_Date) || 0) - (Number(a.Lot_Date) || 0));

  results.innerHTML = `
    <div class="slabel">Search results (this order's colorways only)</div>
    <div class="photo-grid">
      ${matches.length ? matches.map(photoCardHTML).join('') : '<div class="no-match">No matching photos found among this order\'s colorways.</div>'}
    </div>`;
  loadImagesInBatches();
}

async function toggleFavorite(photoId, currentlyFav) {
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Product_Photos', photoId, { Is_Favorite: !currentlyFav }]
    ]);
    const p = allPhotos.find(p => p.id === photoId);
    if (p) p.Is_Favorite = !currentlyFav;
    renderLines();
    renderSearch(document.getElementById('searchBox').value);
  } catch (e) {
    console.error('Failed to update favorite:', e);
    showToast('Could not update favorite — check widget access level');
  }
}

async function sharePhoto(photoId, btnEl) {
  const p = allPhotos.find(p => p.id === photoId);
  if (!p || !currentOrder) return;
  if (!p.Source_Filename) {
    showToast('Missing Source_Filename for this photo — add it in Product Photos first');
    return;
  }

  btnEl.disabled = true;
  const originalText = btnEl.textContent;
  btnEl.textContent = 'Sharing...';

  const payload = {
    photo_id: photoId,
    work_order_id: currentOrder.id,
    source_filename: p.Source_Filename,
    source_path: p.Nextcloud_URL,
    vendor_code: vendorCode,
    order_number: currentOrder.Order_Number,
    colorway_name: p.Colorway_Name,
  };

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error('Webhook returned ' + res.status);

    showToast(`Sent to ${vendorCode} — order ${currentOrder.Order_Number}`);
    const searchValue = document.getElementById('searchBox').value;
    await loadData(currentOrder);
    document.getElementById('searchBox').value = searchValue;
    renderSearch(searchValue);
  } catch (e) {
    console.error('Share failed:', e);
    btnEl.textContent = originalText;
    btnEl.disabled = false;
    showToast('Share failed — is the n8n webhook live?');
  }
}

const ROTATE_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/rotate-photo';

// Rotates the master file in Nextcloud, in place, 90 degrees.
//
// The returned new_url carries a fresh &r= cache-buster and is written back to
// Grist. Without that write the rotation is invisible: SS - Serve Photo - CACHED
// marks these `immutable`, so a browser holding the old copy never revalidates.
// Persisting it to Grist (rather than only busting locally) means the kiosk and
// every other widget reading Nextcloud_URL pick up the change too.
async function rotatePhoto(photoId, direction, btnEl) {
  const p = allPhotos.find(p => p.id === photoId);
  if (!p) return;
  if (!p.Source_Filename) {
    showToast('Missing Source_Filename for this photo — add it in Product Photos first');
    return;
  }

  const card = document.getElementById('pcard-' + photoId);
  const btns = card ? card.querySelectorAll('.rot-btn') : [btnEl];
  btns.forEach(b => { b.disabled = true; });
  showToast('Rotating...');

  try {
    const res = await fetch(ROTATE_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        photo_id: photoId,
        source_filename: p.Source_Filename,
        nextcloud_url: p.Nextcloud_URL || '',
        direction: direction,
      }),
    });
    if (!res.ok) throw new Error('Webhook returned ' + res.status);
    const out = await res.json();
    if (!out || !out.success) throw new Error('Workflow reported failure');

    if (out.new_url) {
      await grist.docApi.applyUserActions([
        ['UpdateRecord', 'Product_Photos', photoId, { Nextcloud_URL: out.new_url }]
      ]);
      p.Nextcloud_URL = out.new_url;
    }

    renderLines();
    renderSearch(document.getElementById('searchBox').value);
    showToast('Rotated — thumbnail refreshed');
  } catch (e) {
    console.error('Rotate failed:', e);
    btns.forEach(b => { b.disabled = false; });
    showToast('Rotate failed — is the n8n webhook live?');
  }
}

const UNSHARE_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/unshare-photo';

async function unsharePhoto(photoId, shareId, destPath, btnEl) {
  if (!confirm('Remove this photo from the vendor folder for this order?')) return;

  btnEl.disabled = true;
  const originalText = btnEl.textContent;
  btnEl.textContent = 'Removing...';

  try {
    const res = await fetch(UNSHARE_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ share_id: shareId, dest_path: destPath }),
    });
    if (!res.ok) throw new Error('Webhook returned ' + res.status);

    existingShares = existingShares.filter(s => s.shareId !== shareId);
    renderLines();
    renderSearch(document.getElementById('searchBox').value);
    showToast('Removed from vendor folder');
  } catch (e) {
    console.error('Unshare failed:', e);
    btnEl.disabled = false;
    btnEl.textContent = originalText;
    showToast('Remove failed — is the n8n webhook live?');
  }
}

grist.onRecord(async (record) => {
  if (!record) {
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('mainView').style.display = 'none';
    return;
  }
  await loadData(record);
});
