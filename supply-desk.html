<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supply Desk</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
/* ══ Supply Desk ═════════════════════════════════════════════════════════════
   Where to go to reorder things. Two parts:

   1. Dyes to reorder — worked out from Dye_Powder, the jar-by-jar dye stock.
      Per dye: an open jar marked Low with no sealed spare behind it means
      REORDER; down to one jar (open, not low) with no spare means WATCH.
      This is real stock, not a forecast, so it is as right as the Low ticks
      and the Sealed/Open states are.

   2. Every supply, grouped by supplier, with an Order button. The button opens
      the supply's own Order_Link, else the supplier's Website. Item codes copy
      on click, for suppliers whose sites want a code typed in.

   Read only. Nothing here writes to Grist or places an order.

   Later stages, not built: On_Hand / Reorder_At on Supplies for a count-based
   flag on everything else, then a forecast from open orders.              */
:root {
  --ink: #1A1614; --rule: #E8DFD4; --paper: #FDFBF7; --panel: #fff;
  --muted: #8B7D72; --accent: #8B3A2A; --accent-light: #F2E8E5;
  --teal: #2A6B6B; --teal-light: #E4F0EF; --gold: #B07D2A; --gold-light: #F5EDD8;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 12px; background: var(--paper); color: var(--ink);
       font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif; font-size: 13px; }
.hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hd h1 { font-size: 17px; margin: 0; } .hd .sub { font-size: 11.5px; color: var(--muted); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.search { flex: 1; min-width: 160px; padding: 8px 10px; border: 1.5px solid var(--rule); border-radius: 6px; font: inherit; background: #fff; color: var(--ink); }
select { font: inherit; padding: 7px 8px; border: 1.5px solid var(--rule); border-radius: 6px; background: #fff; color: var(--ink); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 18px 0 6px; display: flex; gap: 8px; align-items: baseline; }
h2 .n { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; }
.panel { background: var(--panel); border: 1.5px solid var(--rule); border-radius: 7px; overflow: hidden; }
.row { display: flex; gap: 10px; align-items: center; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; }
.row .nm { font-weight: 600; }
.row .meta { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; flex: none; }
.chip.reorder { background: var(--accent-light); color: var(--accent); }
.chip.watch { background: var(--gold-light); color: var(--gold); }
.btn { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 6px; cursor: pointer; text-decoration: none;
       border: 1.5px solid var(--rule); background: #fff; color: var(--ink); flex: none; white-space: nowrap; }
.btn.go { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.off { opacity: .45; pointer-events: none; }
.code { font-family: 'DM Mono', ui-monospace, monospace; font-size: 11px; border: 1px dashed var(--rule); border-radius: 4px; padding: 1px 6px;
        cursor: copy; background: #FAF6F0; }
.sup-hd { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #FAF6F0; border-bottom: 1.5px solid var(--rule); }
.sup-hd .nm { font-weight: 700; flex: 1; }
.empty { padding: 14px; color: var(--muted); font-size: 12.5px; }
.status { font-size: 12px; color: var(--muted); }
.status.bad { color: var(--accent); }
.toast { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 7px 13px;
         border-radius: 6px; font-size: 12.5px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="hd"><h1>Supply Desk</h1><span class="sub">What to reorder, and the page to order it from</span></div>
<div class="bar">
  <input id="q" class="search" placeholder="Search supplies, codes, suppliers…">
  <select id="cat"><option value="">All categories</option></select>
</div>
<div id="status" class="status">Loading…</div>
<div id="dyes"></div>
<div id="list"></div>
<div class="toast" id="toast"></div>

<script>
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
const findCol = (t, names) => Object.keys(t || {}).find(k => names.some(n => norm(n) === norm(k))) || null;
const col = (t, c) => (c && t && Array.isArray(t[c]) ? t[c] : []);
const refId = v => typeof v === 'number' ? v || null : (Array.isArray(v) && v[0] === 'R' ? v[1] || null : null);
const fmtDate = v => { const n = Number(v); return n > 0 ? new Date(n * 1000).toLocaleDateString(undefined, { timeZone: 'UTC', year: 'numeric', month: 'short', day: 'numeric' }) : ''; };
const money = v => Number(v) > 0 ? '$' + Number(v).toFixed(2) : '';
const isUrl = u => /^https?:\/\//i.test(String(u || '').trim());
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

const S = { supplies: [], suppliers: {}, dyes: {}, dyeRows: [], ready: false };

async function load() {
  const safe = async n => { try { return await grist.docApi.fetchTable(n); } catch (e) { return null; } };
  const [supT, splT, dyeT, powT] = await Promise.all(['Supplies', 'Suppliers', 'Dyes', 'Dye_Powder'].map(safe));
  if (!supT) throw new Error('no Supplies table');

  if (splT) {
    const c = { name: findCol(splT, ['Name']), web: findCol(splT, ['Website']), acct: findCol(splT, ['Account_No']), last: findCol(splT, ['Last_Order']) };
    (splT.id || []).forEach((id, i) => { S.suppliers[id] = { id, name: String(col(splT, c.name)[i] || 'Supplier #' + id),
      web: String(col(splT, c.web)[i] || '').trim(), acct: String(col(splT, c.acct)[i] || ''), last: col(splT, c.last)[i] }; });
  }
  const c = {}; ['Name', 'Category', 'Supplier', 'Item_Code', 'Buy_Unit', 'Dye', 'Retired', 'Last_Ordered', 'Last_Price', 'Landed_Per_Buy', 'Manual_Price', 'Order_Link', 'Times_Ordered']
    .forEach(n => { c[n] = findCol(supT, [n]); });
  S.supplies = (supT.id || []).map((id, i) => {
    const g = n => col(supT, c[n])[i];
    const sup = S.suppliers[refId(g('Supplier'))] || null;
    const own = String(g('Order_Link') || '').trim();
    return { id, name: String(g('Name') || ''), cat: String(g('Category') || 'Other'), sup, code: String(g('Item_Code') || ''),
      unit: String(g('Buy_Unit') || ''), dye: refId(g('Dye')), retired: !!g('Retired'), last: g('Last_Ordered'),
      price: Number(g('Last_Price')) || Number(g('Landed_Per_Buy')) || Number(g('Manual_Price')) || 0, times: Number(g('Times_Ordered')) || 0,
      link: isUrl(own) ? own : (sup && isUrl(sup.web) ? sup.web : ''), linkIsOwn: isUrl(own) };
  }).filter(s => s.name && !s.retired);

  /* Dyes from the jar stock. */
  if (dyeT && powT) {
    const dn = findCol(dyeT, ['Dye_Name']), db = findCol(dyeT, ['Brand']);
    (dyeT.id || []).forEach((id, i) => { S.dyes[id] = { id, name: String(col(dyeT, dn)[i] || ''), brand: String(col(dyeT, db)[i] || '') }; });
    const pc = { dye: findCol(powT, ['Dye']), state: findCol(powT, ['State']), low: findCol(powT, ['Low']), size: findCol(powT, ['Size_g']) };
    const by = {};
    (powT.id || []).forEach((id, i) => {
      const d = refId(col(powT, pc.dye)[i]); if (!d) return;
      const e = by[d] = by[d] || { open: 0, sealed: 0, low: 0, sizes: new Set() };
      const st = String(col(powT, pc.state)[i] || '').toLowerCase();
      if (/seal/.test(st)) e.sealed++; else e.open++;
      if (col(powT, pc.low)[i]) e.low++;
      const g = Number(col(powT, pc.size)[i]); if (g > 0) e.sizes.add(g);
    });
    const supplyByDye = {};
    S.supplies.forEach(s => { if (s.dye && !supplyByDye[s.dye]) supplyByDye[s.dye] = s; });
    S.dyeRows = Object.entries(by).map(([d, e]) => {
      const dye = S.dyes[d] || { name: 'Dye #' + d, brand: '' };
      /* Reorder: nothing sealed, and every open jar is marked low (or there is
         none). Watch: nothing sealed and exactly one good open jar left — the
         normal state for most dyes, so it is hidden unless asked for. */
      const good = e.open - e.low;
      let level = null;
      if (!e.sealed && good <= 0) level = 'reorder';
      else if (!e.sealed && good === 1) level = 'watch';
      return { id: Number(d), ...dye, ...e, level, supply: supplyByDye[d] || null };
    }).filter(r => r.level).sort((a, b) => (a.level === b.level ? 0 : a.level === 'reorder' ? -1 : 1) || a.name.localeCompare(b.name));
  }
  const cats = [...new Set(S.supplies.map(s => s.cat))].sort();
  document.getElementById('cat').innerHTML = '<option value="">All categories</option>' + cats.map(x => `<option>${esc(x)}</option>`).join('');
}

function orderBtn(s, label) {
  if (!s || !s.link) return `<span class="btn off" title="No Order_Link on this supply and no Website on its supplier">${label || 'Order'} ↗</span>`;
  return `<a class="btn go" href="${esc(s.link)}" target="_blank" rel="noopener" title="${s.linkIsOwn ? 'This product’s page' : 'The supplier’s site — add an Order_Link on the supply to go straight to the product'}">${label || 'Order'} ↗</a>`;
}

function render() {
  const q = norm(document.getElementById('q').value), cat = document.getElementById('cat').value;
  const st = document.getElementById('status');
  const linked = S.supplies.filter(s => s.linkIsOwn).length;
  st.className = 'status';
  st.textContent = `${S.supplies.length} supplies · ${linked} with their own order page · ${S.supplies.length - linked} use the supplier’s site or have none`;

  /* Dyes */
  const dyes = S.dyeRows.filter(r => (S.showWatch || r.level === 'reorder' || q) && (!q || norm(r.name + r.brand).includes(q)));
  const nRe = S.dyeRows.filter(r => r.level === 'reorder').length, nW = S.dyeRows.length - nRe;
  document.getElementById('dyes').innerHTML = (cat && cat !== 'Dye powder') ? '' : `
    <h2>Dyes to reorder <span class="n">${nRe}</span>
      <button class="btn" id="watchBtn" style="margin-left:auto;text-transform:none;letter-spacing:0" title="Dyes with nothing sealed and one good open jar left">${S.showWatch ? 'Hide' : 'Show'} ${nW} down to their last jar</button></h2>
    <div class="panel">${dyes.length ? dyes.map(r => `<div class="row">
      <span class="chip ${r.level}">${r.level === 'reorder' ? 'Reorder' : 'Watch'}</span>
      <div class="main"><div class="nm">${esc(r.brand ? r.brand + ' ' : '')}${esc(r.name)}</div>
        <div class="meta">${r.open} open${r.low ? ` (${r.low} marked low)` : ''} · ${r.sealed} sealed spare${[...r.sizes].length ? ' · jars of ' + [...r.sizes].map(g => g + ' g').join(', ') : ''}${
          r.supply && r.supply.last ? ' · last ordered ' + esc(fmtDate(r.supply.last)) : ''}${r.supply && r.supply.price ? ' · ' + money(r.supply.price) : ''}</div></div>
      ${r.supply && r.supply.code ? `<span class="code" data-copy="${esc(r.supply.code)}" title="Copy">${esc(r.supply.code)}</span>` : ''}
      ${orderBtn(r.supply)}</div>`).join('')
      : `<div class="empty">${q ? 'No dye matches.' : 'Nothing to reorder: every dye has a sealed spare or an open jar that isn’t marked low.'}</div>`}</div>
    <div class="status" style="margin-top:4px">From Dye_Powder: Reorder means no sealed spare and every open jar ticked <b>Low</b>. Tick Low on a jar when it runs low and this list stays right.</div>`;
  const wb = document.getElementById('watchBtn');
  if (wb) wb.onclick = () => { S.showWatch = !S.showWatch; render(); };

  /* Supplies by supplier */
  const list = S.supplies.filter(s => (!cat || s.cat === cat) && (!q || norm([s.name, s.code, s.cat, s.sup && s.sup.name].join(' ')).includes(q))
    && !(s.cat === 'Dye powder' && !q && !cat));          // dye jars are listed above; search or pick the category to see them all
  const groups = {};
  list.forEach(s => { const k = s.sup ? s.sup.id : 0; (groups[k] = groups[k] || []).push(s); });
  const keys = Object.keys(groups).sort((a, b) => (a === '0') - (b === '0') || (S.suppliers[a] || {}).name.localeCompare((S.suppliers[b] || {}).name));
  document.getElementById('list').innerHTML = `<h2>All supplies <span class="n">${list.length}</span></h2>` + (keys.length ? keys.map(k => {
    const sup = S.suppliers[k];
    const items = groups[k].sort((a, b) => a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));
    return `<div class="panel" style="margin-bottom:10px">
      <div class="sup-hd"><span class="nm">${esc(sup ? sup.name : 'No supplier set')}</span>
        ${sup && sup.acct ? `<span class="code" data-copy="${esc(sup.acct)}" title="Account number — copy">acct ${esc(sup.acct)}</span>` : ''}
        ${sup && isUrl(sup.web) ? `<a class="btn" href="${esc(sup.web)}" target="_blank" rel="noopener">Site ↗</a>` : ''}</div>
      ${items.map(s => `<div class="row">
        <div class="main"><div class="nm">${esc(s.name)}</div>
          <div class="meta">${esc(s.cat)}${s.unit ? ' · per ' + esc(s.unit) : ''}${s.price ? ' · ' + money(s.price) : ''}${s.last ? ' · last ordered ' + esc(fmtDate(s.last)) : ''}${s.times ? ` · ordered ${s.times}×` : ''}</div></div>
        ${s.code ? `<span class="code" data-copy="${esc(s.code)}" title="Copy">${esc(s.code)}</span>` : ''}
        ${orderBtn(s)}</div>`).join('')}</div>`;
  }).join('') : '<div class="panel"><div class="empty">Nothing matches.</div></div>')
    + (!q && !cat ? `<div class="status">Dye powder jars are left out of this list to keep it short — search, or pick the category, to see them.</div>` : '');
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('cat').addEventListener('change', render);
document.body.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (!c) return;
  navigator.clipboard.writeText(c.dataset.copy).then(() => toast('Copied ' + c.dataset.copy), () => toast(c.dataset.copy));
});

grist.ready({ requiredAccess: 'read table' });
(async () => {
  try { await load(); render(); }
  catch (e) { const st = document.getElementById('status'); st.className = 'status bad'; st.textContent = 'Could not load: ' + (e.message || e); }
})();
</script>
</body>
</html>
