<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dye Library</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614;
  --paper: #F7F3EE;
  --warm: #E8DFD4;
  --rule: #D4C9BC;
  --accent: #8B3A2A;
  --accent-light: #F2E8E5;
  --teal: #3A8B7A;
  --teal-light: #E5F2EF;
  --gold: #B07D2A;
  --gold-light: #F5EDD8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif;
  font-size: 13px; line-height: 1.5; padding: 14px;
}
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
.top-actions { display: flex; gap: 8px; }
.btn {
  font-size: 12px; padding: 7px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rule); background: white; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn-primary.unsaved::after { content: ' •'; }
.btn-teal { background: var(--teal); border-color: var(--teal); color: white; }
.btn.active-tab { background: var(--ink); border-color: var(--ink); color: white; }

.layout-grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .layout-grid { grid-template-columns: 1fr; } }

.list-panel { background: white; border: 1px solid var(--rule); border-radius: 8px; padding: 10px; }
.search-input {
  width: 100%; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 6px;
  font-size: 12px; margin-bottom: 8px; font-family: 'Inter', sans-serif;
}
.filter-row { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
.filter-chip {
  font-size: 10px; padding: 4px 8px; border-radius: 10px; border: 1px solid var(--rule);
  background: white; color: #6B5E52; cursor: pointer;
}
.filter-chip.active { background: var(--teal); border-color: var(--teal); color: white; }
.dye-list { max-height: 640px; overflow-y: auto; }
.dye-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
  cursor: pointer; margin-bottom: 2px;
}
.dye-row:hover { background: var(--paper); }
.dye-row.selected { background: var(--accent-light); }
.swatch-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,.15); }
.swatch-dot.no-manual { border: 1px dashed #8B7D72; }
.dye-row-name { font-size: 12.5px; flex: 1; }
.dye-row-brand { font-size: 10px; color: #8B7D72; }
.list-empty { font-size: 11px; color: #8B7D72; font-style: italic; padding: 10px; text-align: center; }
.use-badge {
  font-family: 'DM Mono', monospace; font-size: 9.5px; min-width: 17px; text-align: center;
  padding: 1px 4px; border-radius: 8px; background: var(--warm); color: #6B5E52; flex-shrink: 0;
}
.use-badge.zero { background: transparent; color: #C0B6A8; }

/* Recipe usage panel */
.usage-head { display: flex; align-items: baseline; gap: 8px; }
.usage-summary { font-size: 11px; color: #8B7D72; }
.usage-box { max-height: 230px; overflow-y: auto; border: 1px solid var(--rule); border-radius: 6px; }
.usage-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px;
  border-bottom: 1px solid var(--warm);
}
.usage-row:last-child { border-bottom: none; }
.usage-row:nth-child(even) { background: #FCFAF7; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; background: #C0B6A8; }
.status-dot.active { background: var(--teal); }
.status-dot.retired { background: #C9BFB2; }
.usage-main { flex: 1; min-width: 0; }
.usage-recipe { font-size: 12.5px; }
.usage-sku { font-family: 'DM Mono', monospace; font-size: 10px; color: #8B7D72; margin-left: 6px; }
.usage-detail { font-size: 10.5px; color: #8B7D72; font-family: 'DM Mono', monospace; margin-top: 1px; }
.usage-tag {
  font-size: 9px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 5px;
  border-radius: 3px; background: var(--gold-light); color: var(--gold); margin-left: 6px;
}
.usage-empty { font-size: 11.5px; color: #8B7D72; font-style: italic; padding: 12px; text-align: center; }
.usage-warn { font-size: 11px; color: var(--accent); padding: 8px 9px; }
.link-btn { font-size: 10px; color: var(--accent); cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; }

.edit-panel, .mix-panel {
  background: white; border: 1px solid var(--rule); border-radius: 8px; padding: 20px;
}
.no-selection { color: #8B7D72; font-style: italic; padding: 40px; text-align: center; }

.section-title {
  font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--teal); margin: 18px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule);
}
.section-title:first-child { margin-top: 0; }
.field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.field-row { display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
.field-label { font-size: 10px; color: #8B7D72; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.field-input, .field-select, textarea.field-input {
  padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px;
  font-family: 'Inter', sans-serif; font-size: 13px; outline: none; width: 100%;
}
.field-input:focus, .field-select:focus { border-color: var(--accent); }
textarea.field-input { resize: vertical; min-height: 44px; }
.checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.checkbox-row label { font-size: 12px; color: #6B5E52; }

.swatch-editor { display: flex; align-items: center; gap: 10px; }
.swatch-editor input[type="color"] { width: 44px; height: 36px; border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; padding: 2px; }
.swatch-editor input[type="text"] { width: 100px; font-family: 'DM Mono', monospace; }
.guess-compare { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8B7D72; margin-top: 6px; }
.guess-compare .mini-swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }

.picker-wrap { position: relative; }
.picker-suggestions {
  position: absolute; z-index: 30; background: white; border: 1px solid var(--rule); border-top: none;
  border-radius: 0 0 6px 6px; max-height: 160px; overflow-y: auto; width: 100%;
  box-shadow: 0 6px 16px rgba(0,0,0,.08);
}
.picker-suggestion-row { padding: 6px 8px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.picker-suggestion-row:hover { background: var(--warm); }
.picker-chip {
  display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px;
  background: var(--paper); border: 1px solid var(--rule); font-size: 12px; margin-top: 4px;
}
.picker-chip .clear-link { margin-left: auto; font-size: 10px; color: var(--accent); cursor: pointer; text-decoration: underline; }

.mix-row { display: flex; gap: 16px; align-items: flex-start; }
.mix-col { flex: 1; }
.mix-preview-box {
  display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px;
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; min-width: 160px;
}
.mix-swatch-big { width: 90px; height: 90px; border-radius: 12px; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.mix-hex-label { font-family: 'DM Mono', monospace; font-size: 12px; color: #6B5E52; }
.mix-slider-wrap { margin: 14px 0; }
.mix-slider-wrap input[type="range"] { width: 100%; }
.mix-slider-labels { display: flex; justify-content: space-between; font-size: 10px; color: #8B7D72; }

.toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">Dye Library</div>
  <div class="top-actions">
    <button class="btn" id="tabEdit" onclick="setViewMode('edit')">Edit Dyes</button>
    <button class="btn" id="tabMix" onclick="setViewMode('mix')">🧪 Mix Lab</button>
    <button class="btn btn-teal" onclick="createNewDye()">+ New Dye</button>
  </div>
</div>

<div class="layout-grid">
  <div class="list-panel">
    <input class="search-input" id="dyeSearch" placeholder="Search name or brand..." oninput="renderDyeList()">
    <div class="filter-row">
      <button class="filter-chip" id="filterAll" onclick="setFilter('all')">All</button>
      <button class="filter-chip" id="filterMissing" onclick="setFilter('missing')">Missing Color</button>
      <button class="filter-chip" id="filterCustom" onclick="setFilter('custom')">Custom Mixes</button>
      <button class="filter-chip" id="filterUnused" onclick="setFilter('unused')">Unused</button>
    </div>
    <div class="dye-list" id="dyeList"></div>
  </div>

  <div id="editPanel" class="edit-panel">
    <div class="no-selection">Select a dye from the list, or create a new one.</div>
  </div>

  <div id="mixPanel" class="mix-panel" style="display:none; grid-column: 2;">
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DYE_COLORS = {
  red:'#C8294A',rhodamine:'#D83060',pink:'#E84080',fuschia:'#D83060',fuchsia:'#D83060',
  blue:'#2060C8',aqua:'#20A0C8',teal:'#20A890',turquoise:'#20B2A0',
  green:'#40A840',yellow:'#E8D020',orange:'#E87020',purple:'#8040C8',
  black:'#2A2A2A',brown:'#8B5A2B',gold:'#C8A020',coral:'#E05040',
  mint:'#40C890',lavender:'#A080C8',navy:'#203080',forest:'#2A6040',
  grey:'#888780',gray:'#888780',white:'#F0EDE8',silver:'#A0A0A8',
  scarlet:'#C82020',crimson:'#A01830',magenta:'#C030A0',violet:'#6030C0',
  cerulean:'#2080C0',cobalt:'#2048A8',emerald:'#208050',sage:'#80A870',
  ecru:'#C8B890',cream:'#F0EAD0',caramel:'#C08040',russet:'#904030'
};

function guessColor(name) {
  if (!name) return '#888780';
  const l = name.toLowerCase();
  for (const [k, v] of Object.entries(DYE_COLORS)) {
    if (l.includes(k)) return v;
  }
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xFFFFFF;
  return '#' + ((h & 0xBFBFBF) | 0x404040).toString(16).padStart(6, '0');
}

function mixColors(hex1, hex2, ratioTo2) {
  const c1 = parseInt((hex1 || '#888780').replace('#', ''), 16);
  const c2 = parseInt((hex2 || '#888780').replace('#', ''), 16);
  const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
  const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
  const t = Math.max(0, Math.min(100, ratioTo2)) / 100;
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}

function normalize(s) {
  return (s || '').toString().toLowerCase().replace(/[^a-z0-9]/g, '');
}

function esc(s) {
  return (s === null || s === undefined ? '' : String(s))
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function columnAsArray(tableData, col) {
  return Array.isArray(tableData[col]) ? tableData[col] : [];
}
function findColumn(tableData, candidates) {
  const keys = Object.keys(tableData);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// Fallbacks only — the real lists are read from the Grist column settings at load
// time by loadColumnChoices(), so adding a choice in Grist shows up here on refresh.
let DYE_TYPE_CHOICES = ['Acid', 'Super Fast Acid', 'Procion MX', 'Procion MX Ice', 'Basic', 'Cochineal', 'Indigo', 'iDye Natural', 'iDye Poly', 'Conc Vinyl Sulphon', 'Silk Colors', 'Custom Mix'];
let STATUS_CHOICES = ['Active', 'Discontinued', 'Reformulated', 'Needs Review'];
let SOURCE_TYPE_CHOICES = ['Commercial Dye', 'Custom Color'];
let BRAND_CHOICES = [];   // populated from Dye_Brands, then Choice settings, then existing values

// Which table the brand list comes from, and how Brand is stored on Dyes.
const BRAND_TABLE_CANDIDATES = ['Dye_Brands', 'Brands', 'Dye_Brand'];
let dyeColTypes = {};     // Dyes colId -> declared Grist type, filled by loadColumnChoices
let brandRows = [];       // [{id, name}] from the brands table, when one exists
let brandTableId = null;  // actual table name found, or null
let brandColIsRef = false; // true when Dyes.Brand is itself a Ref column

// grist.docApi.applyUserActions() resolves to {actionNum, retValues, ...}, not a
// bare array. Reading result[0] silently yields undefined, which is how new rows
// were being created but never selected (and then saved against row id undefined).
function firstRetValue(result) {
  if (Array.isArray(result)) return result[0];
  if (result && Array.isArray(result.retValues)) return result.retValues[0];
  return null;
}

// Read the Choice lists straight out of the Dyes column settings so the widget
// never drifts from Grist. Falls back to the constants above if metadata is
// unreadable (e.g. the widget is granted less than full access).
async function loadColumnChoices() {
  try {
    const tables = await grist.docApi.fetchTable('_grist_Tables');
    const tIdx = (tables.tableId || []).indexOf('Dyes');
    if (tIdx < 0) return;
    const dyesRef = tables.id[tIdx];

    const cols = await grist.docApi.fetchTable('_grist_Tables_column');
    const byColId = {};
    (cols.id || []).forEach((rowId, i) => {
      if (cols.parentId[i] !== dyesRef) return;
      // Record the declared type of every Dyes column. Brand may be Text, Choice,
      // or Ref:Dye_Brands, and each of those needs a different read/write path —
      // guessing from the value alone is unreliable (a Ref reads as a bare number,
      // which is indistinguishable from a numeric Text value).
      dyeColTypes[cols.colId[i]] = (cols.type && cols.type[i]) || '';
      let opts = {};
      try { opts = JSON.parse(cols.widgetOptions[i] || '{}'); } catch (err) { /* not JSON */ }
      if (Array.isArray(opts.choices) && opts.choices.length) byColId[cols.colId[i]] = opts.choices;
    });

    const pick = (cands) => {
      const keys = Object.keys(byColId);
      for (const cand of cands) {
        const hit = keys.find(k => normalize(k) === normalize(cand));
        if (hit) return byColId[hit];
      }
      return null;
    };

    DYE_TYPE_CHOICES = pick(['Dye_Type']) || DYE_TYPE_CHOICES;
    STATUS_CHOICES = pick(['Status']) || STATUS_CHOICES;
    SOURCE_TYPE_CHOICES = pick(['Dye_Source_Type']) || SOURCE_TYPE_CHOICES;
    BRAND_CHOICES = pick(['Brand']) || BRAND_CHOICES;
  } catch (e) {
    console.warn('Could not read column choices from Grist — using built-in lists.', e);
  }
}

// ── STATE ──
let allDyes = [];       // full catalog, each: {id, Dye_Name, Brand, ..., Swatch_Hex}
let editingDye = null;  // working copy of the currently-selected dye
let currentDyeId = null;
let listFilter = 'all';
let unsavedChanges = false;
let viewMode = 'edit';
let hasSwatchColumn = true;
let colMap = {};   // logical field -> actual Grist column id, resolved at load
let swatchColId = null;

// Recipe usage: dye row id -> array of the recipe components that use it.
// Built once from Recipe_Dye_Components + Recipes and keyed on row id, never on
// dye name -- names repeat across brands (Turquoise exists as CC, J and PF).
let usageByDye = {};
let usageError = '';
let usageLoaded = false;

// Mix Lab state
let mixDyeA = null;
let mixDyeB = null;
let mixRatio = 50;

// Load the brand list from its own table so brands are managed in one place
// instead of being retyped (and misspelled) on every dye. Degrades in order:
// Dye_Brands table -> Brand column's Choice settings -> distinct values already
// on Dyes. The field stays usable even if none of those exist.
async function loadBrands() {
  brandRows = [];
  brandTableId = null;
  for (const name of BRAND_TABLE_CANDIDATES) {
    try {
      const t = await grist.docApi.fetchTable(name);
      const nameCol = findColumn(t, ['Brand_Name', 'Name', 'Brand', 'Title']);
      if (!nameCol) continue;
      const ids = t.id || [];
      brandRows = ids.map((id, i) => ({ id, name: (columnAsArray(t, nameCol)[i] || '').toString() }))
                     .filter(b => b.name);
      brandRows.sort((a, b) => a.name.localeCompare(b.name));
      brandTableId = name;
      break;
    } catch (e) { /* table not present — try the next candidate */ }
  }
  brandColIsRef = /^Ref(List)?:/.test(dyeColTypes['Brand'] || '');
}

// Brand may be a row id (Ref) or a plain string. Everything that displays or
// searches brand text goes through here so the two shapes never leak out.
function brandLabel(d) {
  if (!d) return '';
  const raw = d.Brand;
  if (brandColIsRef) {
    const id = getRefId(raw);
    const hit = brandRows.find(b => b.id === id);
    return hit ? hit.name : '';
  }
  return (raw === null || raw === undefined) ? '' : raw.toString();
}

// The full option set for the Brand dropdown, as {value, label} pairs. For a Ref
// column the value is the row id; otherwise it is the brand name itself.
function brandOptions() {
  if (brandColIsRef) return brandRows.map(b => ({ value: String(b.id), label: b.name }));
  const names = new Set();
  brandRows.forEach(b => names.add(b.name));
  BRAND_CHOICES.forEach(c => names.add(c));
  allDyes.forEach(d => { const v = (d.Brand || '').toString().trim(); if (v) names.add(v); });
  return [...names].sort((a, b) => a.localeCompare(b)).map(n => ({ value: n, label: n }));
}

function brandSource() {
  if (brandTableId) return `from ${brandTableId}`;
  if (BRAND_CHOICES.length) return 'from the Brand choice list';
  return 'from existing dyes';
}

// Pull every Recipe_Dye_Components row and group it under the dye it points at.
// Mixes created in the Mix Lab record their parents only as Blend_Description
// text, so a recipe using a mix shows under the mix, not under its ingredients.
async function loadRecipeUsage() {
  usageByDye = {};
  usageError = '';
  usageLoaded = false;
  try {
    const recipes = await grist.docApi.fetchTable('Recipes');
    const rc = (cands) => findColumn(recipes, cands);
    const rName = rc(['Recipe_Name']);
    const rStatus = rc(['Status']);
    const rSku = rc(['SKU_Base']);
    const rScope = rc(['Recipe_Scope']);
    const recipeById = {};
    (recipes.id || []).forEach((id, i) => {
      recipeById[id] = {
        id,
        name: (columnAsArray(recipes, rName)[i] || '').toString(),
        status: (rStatus ? columnAsArray(recipes, rStatus)[i] : '') || '',
        sku: (rSku ? columnAsArray(recipes, rSku)[i] : '') || '',
        scope: (rScope ? columnAsArray(recipes, rScope)[i] : '') || '',
      };
    });

    const rdc = await grist.docApi.fetchTable('Recipe_Dye_Components');
    const cc = (cands) => findColumn(rdc, cands);
    const cRecipe = cc(['Recipe']);
    const cDye = cc(['Dye_Name']);
    if (!cRecipe || !cDye) {
      usageError = 'Recipe_Dye_Components has no Recipe or Dye_Name column.';
      return;
    }
    const cStep = cc(['Step_Number']);
    const cPowder = cc(['Std_Powder_tsp_', 'Std_Powder_tsp']);
    const cWater = cc(['Std_Water_mL_', 'Std_Water_mL']);
    const cDilution = cc(['Dilution']);
    const cIsPowder = cc(['Is_Powder']);
    const cTechnique = cc(['Technique']);

    (rdc.id || []).forEach((rowId, i) => {
      const dyeId = getRefId(columnAsArray(rdc, cDye)[i]);
      const recipeId = getRefId(columnAsArray(rdc, cRecipe)[i]);
      if (!dyeId || !recipeId) return;
      const r = recipeById[recipeId];
      if (!r) return;
      const val = (col) => (col ? columnAsArray(rdc, col)[i] : '');
      if (!usageByDye[dyeId]) usageByDye[dyeId] = [];
      usageByDye[dyeId].push({
        recipeId,
        recipeName: r.name || '(unnamed recipe)',
        status: r.status,
        sku: r.sku,
        scope: r.scope,
        step: val(cStep),
        powder: val(cPowder),
        water: val(cWater),
        dilution: val(cDilution),
        isPowder: val(cIsPowder) === true || val(cIsPowder) === 'True',
        technique: val(cTechnique),
      });
    });

    Object.values(usageByDye).forEach(list => list.sort((a, b) => {
      // Active recipes first — those are the ones that break if the dye goes away.
      const aAct = a.status === 'Active' ? 0 : 1;
      const bAct = b.status === 'Active' ? 0 : 1;
      if (aAct !== bAct) return aAct - bAct;
      const n = a.recipeName.localeCompare(b.recipeName);
      return n !== 0 ? n : (Number(a.step) || 99) - (Number(b.step) || 99);
    }));
    usageLoaded = true;
  } catch (e) {
    console.error('Failed to load recipe usage:', e);
    usageError = 'Could not read Recipes / Recipe_Dye_Components.';
  }
}

function usageFor(dyeId) { return usageByDye[dyeId] || []; }

function usageRecipeCount(dyeId) {
  return new Set(usageFor(dyeId).map(u => u.recipeId)).size;
}

async function refreshUsage() {
  await loadRecipeUsage();
  renderDyeList();
  if (viewMode === 'edit') renderEditPanel();
  showToast('Recipe usage refreshed.');
}

// One-line dose summary for a component row, skipping anything blank so an
// under-filled recipe doesn't render as a row of stray separators.
function usageDoseLine(u) {
  const bits = [];
  if (u.step !== '' && u.step !== null && u.step !== undefined) bits.push('Step ' + u.step);
  if (u.powder !== '' && u.powder !== null && u.powder !== undefined) bits.push(u.powder + ' tsp');
  if (u.water !== '' && u.water !== null && u.water !== undefined) bits.push(u.water + ' mL');
  if (u.dilution) bits.push(String(u.dilution));
  if (u.technique) bits.push(String(u.technique));
  return bits.join('  \u00b7  ');
}

function renderUsageSection() {
  if (!editingDye) return '';
  const rows = usageFor(editingDye.id);
  const recipeCount = usageRecipeCount(editingDye.id);
  const activeCount = new Set(rows.filter(u => u.status === 'Active').map(u => u.recipeId)).size;

  let body;
  if (usageError) {
    body = `<div class="usage-warn">${esc(usageError)}</div>`;
  } else if (!usageLoaded) {
    body = `<div class="usage-empty">Loading recipes...</div>`;
  } else if (!rows.length) {
    body = `<div class="usage-empty">Not used in any recipe.</div>`;
  } else {
    body = rows.map(u => {
      const dose = usageDoseLine(u);
      const statusClass = u.status === 'Active' ? 'active' : (u.status ? 'retired' : '');
      return `
        <div class="usage-row">
          <span class="status-dot ${statusClass}" title="${esc(u.status || 'No status')}"></span>
          <div class="usage-main">
            <div class="usage-recipe">${esc(u.recipeName)}${u.sku ? `<span class="usage-sku">${esc(u.sku)}</span>` : ''}${u.isPowder ? '<span class="usage-tag">powder</span>' : ''}</div>
            ${dose ? `<div class="usage-detail">${esc(dose)}</div>` : ''}
          </div>
        </div>`;
    }).join('');
  }

  const summary = usageError ? ''
    : !usageLoaded ? ''
    : recipeCount === 0 ? 'no recipes'
    : `${recipeCount} recipe${recipeCount === 1 ? '' : 's'}${activeCount ? `, ${activeCount} active` : ''}`;

  return `
    <div class="section-title usage-head">
      <span>Recipe Usage</span>
      <span class="usage-summary">${esc(summary)}</span>
      <span style="margin-left:auto"><button class="link-btn" onclick="refreshUsage()">refresh</button></span>
    </div>
    <div class="usage-box">${body}</div>
  `;
}

function resolvedColor(dye) {
  if (!dye) return '#888780';
  return dye.Swatch_Hex || guessColor(dye.Dye_Name);
}
function dyeDetailLine(d) {
  return [brandLabel(d), d.Serial, d.Dye_Type].filter(Boolean).join(' · ');
}

async function loadAllDyes() {
  try {
    const table = await grist.docApi.fetchTable('Dyes');
    const ids = table.id || [];
    const col = (cands) => findColumn(table, cands);

    const swatchCol = col(['Swatch_Hex', 'Manual_Hex', 'Swatch_Color', 'Hex_Color']);
    hasSwatchColumn = !!swatchCol;
    swatchColId = swatchCol;

    const c = {
      name: col(['Dye_Name']),
      brand: col(['Brand']),
      brandRef: col(['Brand_Ref', 'Brand_Link']),
      serial: col(['Serial']),
      sourceType: col(['Dye_Source_Type']),
      dyeType: col(['Dye_Type']),
      status: col(['Status']),
      statusNotes: col(['Status_Notes']),
      stdPowder: col(['Std_Powder_tsp']),
      stdWater: col(['Std_Water_mL']),
      defaultMlPer100: col(['Default_mL_per_100_yds']),
      stdDryWeight: col(['Std_Dry_Weight_g']),
      shelfLife: col(['Shelf_Life_days']),
      ageSensitive: col(['Age_Sensitive']),
      cleanupOrder: col(['Cleanup_Order']),
      stainsEquipment: col(['Stains_Equipment']),
      dyeFamily: col(['Dye_Family']),
      swapBurden: col(['Swap_Burden']),
      tinctorial: col(['Tinctorial_Strength']),
      bleedRisk: col(['Bleed_Risk']),
      undertone: col(['Undertone']),
      usageNotes: col(['Typical_Usage_Notes']),
      agingNotes: col(['Aging_Notes']),
      notes: col(['Notes']),
      blendDesc: col(['Blend_Description']),
      replacementDye: col(['Replacement_Dye']),
    };
    colMap = c;

    allDyes = ids.map((id, i) => ({
      id,
      Dye_Name: columnAsArray(table, c.name)[i] || '',
      Brand: columnAsArray(table, c.brand)[i] ?? '',
      Serial: columnAsArray(table, c.serial)[i] || '',
      Dye_Source_Type: columnAsArray(table, c.sourceType)[i] || '',
      Dye_Type: columnAsArray(table, c.dyeType)[i] || '',
      Status: columnAsArray(table, c.status)[i] || '',
      Status_Notes: columnAsArray(table, c.statusNotes)[i] || '',
      Std_Powder_tsp: columnAsArray(table, c.stdPowder)[i] ?? '',
      Std_Water_mL: columnAsArray(table, c.stdWater)[i] ?? '',
      Default_mL_per_100_yds: columnAsArray(table, c.defaultMlPer100)[i] ?? '',
      Std_Dry_Weight_g: columnAsArray(table, c.stdDryWeight)[i] ?? '',
      Shelf_Life_days: columnAsArray(table, c.shelfLife)[i] ?? '',
      Age_Sensitive: columnAsArray(table, c.ageSensitive)[i] || '',
      Cleanup_Order: columnAsArray(table, c.cleanupOrder)[i] ?? '',
      Stains_Equipment: columnAsArray(table, c.stainsEquipment)[i] || '',
      Dye_Family: columnAsArray(table, c.dyeFamily)[i] ?? '',
      Swap_Burden: columnAsArray(table, c.swapBurden)[i] ?? '',
      Tinctorial_Strength: columnAsArray(table, c.tinctorial)[i] ?? '',
      Bleed_Risk: columnAsArray(table, c.bleedRisk)[i] ?? '',
      Undertone: columnAsArray(table, c.undertone)[i] ?? '',
      Typical_Usage_Notes: columnAsArray(table, c.usageNotes)[i] ?? '',
      Aging_Notes: columnAsArray(table, c.agingNotes)[i] ?? '',
      Notes: columnAsArray(table, c.notes)[i] || '',
      Blend_Description: columnAsArray(table, c.blendDesc)[i] || '',
      Replacement_Dye: getRefId(columnAsArray(table, c.replacementDye)[i]),
      Swatch_Hex: swatchCol ? (columnAsArray(table, swatchCol)[i] || '') : '',
    })).filter(d => d.Dye_Name);

    allDyes.sort((a, b) => a.Dye_Name.localeCompare(b.Dye_Name));

    if (!hasSwatchColumn) {
      showToast('No "Swatch_Hex" column found on Dyes — add a Text column with that name in Grist to enable manual colors.');
    }

    renderDyeList();
    if (viewMode === 'mix') renderMixPanel();
  } catch (e) {
    console.error('Failed to load Dyes table:', e);

function setFilter(f) {
  listFilter = f;
  renderDyeList();
}

function setViewMode(mode) {
  viewMode = mode;
  document.getElementById('editPanel').style.display = mode === 'edit' ? 'block' : 'none';
  document.getElementById('mixPanel').style.display = mode === 'mix' ? 'block' : 'none';
  document.getElementById('tabEdit').classList.toggle('active-tab', mode === 'edit');
  document.getElementById('tabMix').classList.toggle('active-tab', mode === 'mix');
  if (mode === 'mix') renderMixPanel();
}

function renderDyeList() {
  const box = document.getElementById('dyeList');
  document.getElementById('filterAll').classList.toggle('active', listFilter === 'all');
  document.getElementById('filterMissing').classList.toggle('active', listFilter === 'missing');
  document.getElementById('filterCustom').classList.toggle('active', listFilter === 'custom');
  document.getElementById('filterUnused').classList.toggle('active', listFilter === 'unused');

  const q = normalize(document.getElementById('dyeSearch').value);
  let list = allDyes;
  if (listFilter === 'missing') list = list.filter(d => !d.Swatch_Hex);
  if (listFilter === 'custom') list = list.filter(d => d.Dye_Source_Type === 'Custom Color');
  if (listFilter === 'unused') list = list.filter(d => usageRecipeCount(d.id) === 0);
  if (q) list = list.filter(d => normalize(d.Dye_Name).includes(q) || normalize(brandLabel(d)).includes(q));

  if (!list.length) {
    box.innerHTML = `<div class="list-empty">No dyes match.</div>`;
    return;
  }

  box.innerHTML = list.map(d => {
    const n = usageRecipeCount(d.id);
    return `
    <div class="dye-row ${d.id === currentDyeId ? 'selected' : ''}" onclick="selectDye(${d.id})">
      <span class="swatch-dot ${d.Swatch_Hex ? '' : 'no-manual'}" style="background:${resolvedColor(d)}"></span>
      <span class="dye-row-name">${esc(d.Dye_Name)}</span>
      <span class="dye-row-brand">${esc(brandLabel(d))}</span>
      <span class="use-badge ${n ? '' : 'zero'}" title="${n} recipe${n === 1 ? '' : 's'} use this dye">${n || '\u2013'}</span>
    </div>`;
  }).join('');
}

function markUnsaved() {
  unsavedChanges = true;
  const btn = document.getElementById('saveBtn');
  if (btn) btn.classList.add('unsaved');
}
function clearUnsaved() {
  unsavedChanges = false;
  const btn = document.getElementById('saveBtn');
  if (btn) btn.classList.remove('unsaved');
}

function selectDye(id) {
  if (unsavedChanges && !confirm('Discard unsaved changes to the current dye?')) return;
  currentDyeId = id;
  editingDye = { ...allDyes.find(d => d.id === id) };
  viewMode = 'edit';
  setViewMode('edit');
  renderDyeList();
  renderEditPanel();
}

function updateField(field, value) {
  if (!editingDye) return;
  editingDye[field] = value;
  markUnsaved();
}

  updateField('Swatch_Hex', '');

function renderReplacementPicker() {
  const current = editingDye.Replacement_Dye ? allDyes.find(d => d.id === editingDye.Replacement_Dye) : null;
  if (current) {
    return `
      <div class="picker-chip">
        <span class="swatch-dot" style="width:12px;height:12px;background:${resolvedColor(current)}"></span>
        <div>
          <div>${current.Dye_Name}</div>
          <div style="font-size:10px;color:#8B7D72;">${dyeDetailLine(current)}</div>
        </div>
        <span class="clear-link" onclick="updateField('Replacement_Dye', null); renderEditPanel();">clear</span>
      </div>
    `;
  }
  return `
    <div class="picker-wrap">
      <input class="field-input" placeholder="Search dyes..." id="replacementSearch"
        oninput="searchReplacementDye(this.value)"
        onblur="setTimeout(() => { const b = document.getElementById('replacementSuggestions'); if (b) b.style.display='none'; }, 150)">
      <div class="picker-suggestions" id="replacementSuggestions" style="display:none"></div>

function searchReplacementDye(query) {
  const box = document.getElementById('replacementSuggestions');
  const q = normalize(query);
  if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const matches = allDyes.filter(d => d.id !== currentDyeId && normalize(d.Dye_Name).includes(q)).slice(0, 8);
  if (!matches.length) { box.innerHTML = `<div class="picker-suggestion-row" style="color:#8B7D72;font-style:italic">No matches</div>`; box.style.display = 'block'; return; }
  box.innerHTML = matches.map(d => `
    <div class="picker-suggestion-row" onmousedown="event.preventDefault(); updateField('Replacement_Dye', ${d.id}); renderEditPanel();">
      <span class="swatch-dot" style="width:12px;height:12px;background:${resolvedColor(d)}"></span>
      <div>
        <div>${d.Dye_Name}</div>
        <div style="font-size:10px;color:#8B7D72;">${dyeDetailLine(d) || 'No brand/serial on file'}</div>
      </div>
    </div>
  `).join('');
  box.style.display = 'block';
}

function selectOption(field, choices, currentValue) {
  const list = choices.slice();
  // A value already on the row but missing from the Choice list would otherwise
  // be silently reset to blank the next time the dye is saved.
  if (currentValue && !list.includes(currentValue)) list.unshift(currentValue);
  return `<option value=""></option>` + list.map(c =>
    `<option value="${esc(c)}" ${currentValue === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

function brandSelectOptions(d) {
  const current = brandColIsRef
    ? (getRefId(d.Brand) ? String(getRefId(d.Brand)) : '')
    : ((d.Brand === null || d.Brand === undefined) ? '' : d.Brand.toString());
  const opts = brandOptions();
  // A brand already on the row but absent from the list would otherwise be
  // silently blanked the next time this dye is saved.
  if (current && !opts.some(o => o.value === current)) {
    opts.unshift({ value: current, label: brandColIsRef ? `(unknown brand #${current})` : current });
  }
  return `<option value=""></option>` + opts.map(o =>
    `<option value="${esc(o.value)}" ${o.value === current ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
}

async function addBrand() {
  const name = (window.prompt('New brand name') || '').trim();
  if (!name) return;
  if (brandRows.some(b => normalize(b.name) === normalize(name)) || BRAND_CHOICES.some(c => normalize(c) === normalize(name))) {
    showToast('That brand is already on the list.');
    return;
  }
  if (brandTableId) {
    try {
      const t = await grist.docApi.fetchTable(brandTableId);
      const nameCol = findColumn(t, ['Brand_Name', 'Name', 'Brand', 'Title']) || 'Brand_Name';
      const result = await grist.docApi.applyUserActions([['AddRecord', brandTableId, null, { [nameCol]: name }]]);
      const newId = firstRetValue(result);
      await loadBrands();
      if (editingDye) {
        updateField('Brand', brandColIsRef ? (newId || null) : name);
        renderEditPanel();
      }
      showToast(`Added "${name}" to ${brandTableId}.`);
    } catch (e) {
      console.error('Could not add brand:', e);
      showToast('Could not add the brand — check the console.');
    }
    return;
  }
  // No brands table yet: usable for this session, but say so plainly rather than
  // pretending it was stored somewhere.
  BRAND_CHOICES.push(name);
  if (editingDye) { updateField('Brand', name); renderEditPanel(); }
  showToast('Used for now — create a Dye_Brands table to keep brands in one list.');
}

async function saveDye() {
  if (!editingDye) return;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  // Write to the column ids resolved at load time, never to hardcoded literals.
  // One bad key makes Grist reject the whole UpdateRecord, so a single renamed
  // column used to silently kill the entire save, plain text fields included.
  const fields = {};
  const skipped = [];
  const put = (key, value) => {
    if (colMap[key]) fields[colMap[key]] = value;
    else skipped.push(key);
  };
  const num = (v) => (v === '' || v === null || v === undefined ? null : Number(v));

  put('name', editingDye.Dye_Name);
  // A Ref column must receive a row id (or null); a Text/Choice column must
  // receive the name. Sending the wrong shape makes Grist reject the whole
  // UpdateRecord, which would take every other field down with it.
  put('brand', brandColIsRef ? (getRefId(editingDye.Brand) || null) : (editingDye.Brand || ''));
  // If a separate Brand_Ref column exists alongside a text Brand, keep it pointed
  // at the matching row so the link is available to other widgets and formulas.
  if (colMap.brandRef && !brandColIsRef) {
    const hit = brandRows.find(b => normalize(b.name) === normalize(editingDye.Brand || ''));
    fields[colMap.brandRef] = hit ? hit.id : null;
  }
  put('serial', editingDye.Serial);
  put('sourceType', editingDye.Dye_Source_Type);
  put('dyeType', editingDye.Dye_Type);
  put('status', editingDye.Status);
  put('statusNotes', editingDye.Status_Notes);
  put('stdPowder', num(editingDye.Std_Powder_tsp));
  put('stdWater', num(editingDye.Std_Water_mL));
  put('defaultMlPer100', num(editingDye.Default_mL_per_100_yds));
  put('stdDryWeight', num(editingDye.Std_Dry_Weight_g));
  put('shelfLife', editingDye.Shelf_Life_days);
  put('ageSensitive', editingDye.Age_Sensitive);
  put('cleanupOrder', editingDye.Cleanup_Order);
  put('stainsEquipment', editingDye.Stains_Equipment);
  put('dyeFamily', editingDye.Dye_Family);
  put('swapBurden', editingDye.Swap_Burden);
  put('tinctorial', editingDye.Tinctorial_Strength);
  put('bleedRisk', editingDye.Bleed_Risk);
  put('undertone', editingDye.Undertone);
  put('usageNotes', editingDye.Typical_Usage_Notes);
  put('agingNotes', editingDye.Aging_Notes);
  put('notes', editingDye.Notes);
  put('blendDesc', editingDye.Blend_Description);
  put('replacementDye', editingDye.Replacement_Dye || null);
  if (hasSwatchColumn && swatchColId) fields[swatchColId] = editingDye.Swatch_Hex;

  if (skipped.length) console.warn('No matching Dyes column for:', skipped.join(', '));

  try {
    if (!currentDyeId) throw new Error('No row selected — cannot save.');
    await grist.docApi.applyUserActions([['UpdateRecord', 'Dyes', currentDyeId, fields]]);
    Object.assign(allDyes.find(d => d.id === currentDyeId), editingDye);
    clearUnsaved();
    showToast('Saved.');
    renderDyeList();
  } catch (e) {
    console.error('Save failed:', e);
    showToast('Save failed: ' + (e && e.message ? e.message : 'check the console for details.'));
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Save';
  }
}

async function createNewDye() {
  try {
    const fields = {};
    fields[colMap.name || 'Dye_Name'] = 'New Dye';
    if (colMap.sourceType) fields[colMap.sourceType] = 'Commercial Dye';
    const result = await grist.docApi.applyUserActions([['AddRecord', 'Dyes', null, fields]]);
    const newId = firstRetValue(result);
    await loadAllDyes();
    if (!newId) { showToast('Row added, but Grist did not return its id — reopen the widget.'); return; }
    selectDye(newId);
    showToast('New dye created — fill in the details and Save.');
  } catch (e) {
    console.error('Create failed:', e);
    showToast('Could not create a new dye: ' + (e && e.message ? e.message : 'check the console.'));
  }
}

// ── MIX LAB ──
function renderMixPanel() {
  const panel = document.getElementById('mixPanel');
  const a = mixDyeA ? allDyes.find(d => d.id === mixDyeA) : null;
  const b = mixDyeB ? allDyes.find(d => d.id === mixDyeB) : null;
  const colorA = a ? resolvedColor(a) : '#CCCCCC';
  const colorB = b ? resolvedColor(b) : '#CCCCCC';
  const mixed = (a && b) ? mixColors(colorA, colorB, mixRatio) : '#EEEEEE';

  panel.innerHTML = `
    <div style="font-family:'Libre Baskerville',serif; font-size:18px; margin-bottom:14px;">🧪 Mix Lab — preview a blend before you dye it</div>
    <div class="mix-row">
      <div class="mix-col">
        <div class="field-row">
          <span class="field-label">Dye A</span>
          ${mixPickerHtml('A', a)}
        </div>
        <div class="field-row">
          <span class="field-label">Dye B</span>
          ${mixPickerHtml('B', b)}
        </div>
        <div class="mix-slider-wrap">
          <input type="range" min="0" max="100" value="${mixRatio}" oninput="setMixRatio(this.value)">
          <div class="mix-slider-labels">
            <span>100% ${a ? a.Dye_Name : 'A'}</span>
            <span>${mixRatio}% toward B</span>
            <span>100% ${b ? b.Dye_Name : 'B'}</span>
          </div>
        </div>
        <div class="section-title">Save as a new dye</div>
        <div class="field-row">
          <span class="field-label">New Dye Name</span>
          <input class="field-input" id="mixNewName" placeholder="${a && b ? a.Dye_Name + ' / ' + b.Dye_Name + ' Mix' : 'e.g. Sunset Blend'}">
        </div>
        <div class="field-row">
          <span class="field-label">Brand</span>
          <select class="field-select" id="mixNewBrand">${brandSelectOptions({ Brand: '' })}</select>
        </div>
        <button class="btn btn-teal" ${a && b ? '' : 'disabled'} onclick="saveMixAsNewDye()">+ Save as New Dye</button>
      </div>
      <div class="mix-col" style="flex:0 0 auto;">
        <div class="mix-preview-box">
          <div class="mix-swatch-big" style="background:${mixed}"></div>
          <div class="mix-hex-label">${mixed}</div>
        </div>
      </div>
    </div>
  `;
}

function mixPickerHtml(slot, dye) {
  if (dye) {
    return `
      <div class="picker-chip">
        <span class="swatch-dot" style="width:12px;height:12px;background:${resolvedColor(dye)}"></span>
        <div>
          <div>${dye.Dye_Name}</div>
          <div style="font-size:10px;color:#8B7D72;">${dyeDetailLine(dye)}</div>
        </div>
        <span class="clear-link" onclick="setMixDye('${slot}', null)">change</span>
      </div>
    `;
  }
  return `
    <div class="picker-wrap">
      <input class="field-input" placeholder="Search dyes..." id="mixSearch${slot}"
        oninput="searchMixDye('${slot}', this.value)"
        onblur="setTimeout(() => { const b = document.getElementById('mixSuggestions${slot}'); if (b) b.style.display='none'; }, 150)">
      <div class="picker-suggestions" id="mixSuggestions${slot}" style="display:none"></div>
    </div>
  `;
}

function searchMixDye(slot, query) {
  const box = document.getElementById(`mixSuggestions${slot}`);
  const q = normalize(query);
  if (!q) { box.style.display = 'none'; box.innerHTML = ''; return; }
  const matches = allDyes.filter(d => normalize(d.Dye_Name).includes(q)).slice(0, 8);
  if (!matches.length) { box.innerHTML = `<div class="picker-suggestion-row" style="color:#8B7D72;font-style:italic">No matches</div>`; box.style.display = 'block'; return; }
  box.innerHTML = matches.map(d => `
    <div class="picker-suggestion-row" onmousedown="event.preventDefault(); setMixDye('${slot}', ${d.id})">
      <span class="swatch-dot" style="width:12px;height:12px;background:${resolvedColor(d)}"></span>
      <div>
        <div>${d.Dye_Name}</div>
        <div style="font-size:10px;color:#8B7D72;">${dyeDetailLine(d) || 'No brand/serial on file'}</div>
      </div>
    </div>
  `).join('');
  box.style.display = 'block';
}

function setMixDye(slot, id) {
  if (slot === 'A') mixDyeA = id; else mixDyeB = id;
  renderMixPanel();
}

function setMixRatio(value) {
  mixRatio = Number(value);
  renderMixPanel();
}

async function saveMixAsNewDye() {
  const a = allDyes.find(d => d.id === mixDyeA);
  const b = allDyes.find(d => d.id === mixDyeB);
  if (!a || !b) return;
  const mixed = mixColors(resolvedColor(a), resolvedColor(b), mixRatio);
  const name = document.getElementById('mixNewName').value.trim() || `${a.Dye_Name} / ${b.Dye_Name} Mix`;
  const brandVal = document.getElementById('mixNewBrand').value;

  const fields = {};
  const set = (key, value) => { if (colMap[key]) fields[colMap[key]] = value; };
  fields[colMap.name || 'Dye_Name'] = name;
  set('brand', brandColIsRef ? (Number(brandVal) || null) : brandVal.trim());
  if (colMap.brandRef && !brandColIsRef) {
    const hit = brandRows.find(x => normalize(x.name) === normalize(brandVal));
    if (hit) fields[colMap.brandRef] = hit.id;
  }
  set('sourceType', 'Custom Color');
  set('dyeType', 'Custom Mix');
  set('blendDesc', `Mix of ${a.Dye_Name} and ${b.Dye_Name} (${mixRatio}% toward ${b.Dye_Name})`);
  if (hasSwatchColumn && swatchColId) fields[swatchColId] = mixed;

  try {
    const result = await grist.docApi.applyUserActions([['AddRecord', 'Dyes', null, fields]]);
    const newId = firstRetValue(result);
    await loadAllDyes();
    showToast(`Saved "${name}" as a new dye.`);
    setViewMode('edit');
    selectDye(newId);
  } catch (e) {
    console.error('Failed to save mix:', e);
    showToast('Could not save the new dye — check the console.');
  }
}

// ── GRIST INTEGRATION ──
grist.ready({ requiredAccess: 'full' });
(async () => {
  await loadColumnChoices();  // must run first: it discovers whether Brand is a Ref
  await loadBrands();
  await loadRecipeUsage();   // before the list renders so the count badges are populated
  await loadAllDyes();
})();
</script>
