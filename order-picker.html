<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Picker</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="settings.js?v=20261101"></script>
<script src="photo-status.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC;
  --accent: #8B3A2A; --accent-light: #F2E8E5; --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8; --done-bg: #EAF3DE; --done-text: #27500A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; padding: 14px; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
.controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 13px; }
.sort-select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 12px; background: white; color: var(--ink); }
.filter-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-chip { font-size: 11px; padding: 5px 10px; border-radius: 12px; border: 1px solid var(--rule); background: white; color: #6B5E52; cursor: pointer; }
.filter-chip.active { background: var(--ink); border-color: var(--ink); color: white; }
.result-count { font-size: 11px; color: #8B7D72; margin-bottom: 10px; }

.summary-strip { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.summary-item {
  font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 600;
  background: white; border: 1px solid var(--rule); color: #6B5E52;
}
.summary-item.warn { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.summary-item.soon { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }

.badge.rush { background: var(--accent); color: white; }
.badge.prod-ready { background: var(--done-bg); color: var(--done-text); }
.badge.prod-progress { background: var(--gold-light); color: var(--gold); }
.badge.prod-notstarted { background: var(--rule); color: #6B5E52; }
/* Pipeline bar: boxed | wound | in hank | still to make, in spools. */
.pipe { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--rule); margin-top: 6px; }
.pipe span { display: block; height: 100%; }
.pipe .b { background: #2A6B6B; } .pipe .w { background: #5B4A8B; } .pipe .h { background: #B07D2A; }
.pipe-txt { font-size: 10.5px; color: #8B7D72; margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pipe-txt i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
.det-link { font-size: 10.5px; color: var(--teal); cursor: pointer; text-decoration: underline; margin-left: auto; }
.det { margin-top: 8px; border-top: 1px dashed var(--rule); padding-top: 8px; cursor: default; }
.det-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; font-size: 11.5px; }
.det-grid .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: #8B7D72; }
.det table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11.5px; }
.det th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; color: #8B7D72; border-bottom: 1px solid var(--rule); padding: 3px 4px; }
.det td { border-bottom: 1px solid var(--rule); padding: 4px; vertical-align: top; }
.det td.n { text-align: right; font-family: 'DM Mono', ui-monospace, monospace; }
.det td.z { color: #C9BFB4; }
.ph-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; padding:7px 9px; border-radius:6px; background:#F7F3EE; font-size:11.5px; }
.ph-row select, .ph-row button { font-size:11px; padding:3px 8px; border:1px solid #D9CFC4; border-radius:4px; background:#fff; cursor:pointer; font-family:inherit; }
.ph-row button.go { background:#2A6B6B; color:#fff; border-color:#2A6B6B; }
.ph-link { font-family:'DM Mono',monospace; font-size:10.5px; word-break:break-all; }
.ph-mini { font-size:10px; padding:1px 6px; border:1px solid #D9CFC4; border-radius:4px; background:#fff; cursor:pointer; margin-left:4px; }
.det .stg { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }

.order-list { display: flex; flex-direction: column; gap: 8px; }
.order-card {
  background: white; border: 1.5px solid var(--rule); border-radius: 8px; padding: 12px 14px;
  cursor: pointer; transition: border-color .12s;
}
.order-card:hover { border-color: var(--accent); }
.order-card.selected { border-color: var(--accent); background: var(--accent-light); }
.order-card.overdue { border-left: 4px solid var(--accent); }
.order-card.channel-wholesale { border-left: 4px solid var(--teal); }
.order-card.channel-retail { border-left: 4px solid var(--gold); }
.order-card.channel-custom { border-left: 4px solid var(--accent); }
/* A closed order is history, not work. It stays legible but stops competing
   for attention with the orders that still need making. */
.order-card.is-closed { background: #FBF9F6; border-style: dashed; }
.order-card.is-closed .card-ordernum,
.order-card.is-closed .card-customer { color: #6B5E52; }

.shopify-link { color: var(--teal); text-decoration: none; }
.shopify-link:hover { text-decoration: underline; }

.view-toggle-btn { font-size: 11px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--rule); background: white; color: var(--ink); cursor: pointer; }
.view-toggle-btn.active { background: var(--ink); border-color: var(--ink); color: white; }

.pinned-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 4px; }
.pinned-divider { border: none; border-top: 1px dashed var(--rule); margin: 10px 0; }

.order-list.dense .order-card { padding: 7px 12px; }
.order-list.dense .card-notes-row { display: none; }
.order-list.dense .card-shopify { display: none; }
.order-list.dense .card-meta-row { margin-top: 2px; }
/* The shipment row survives compact view on purpose — a tracking number is the
   thing being looked up when the list is long enough to want compacting. */
.order-list.dense .card-ship { margin-top: 3px; padding-top: 3px; }

.card-notes-row { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.card-notes { font-size: 11px; color: #8B7D72; font-style: italic; flex: 1; }
.no-note { font-size: 11px; color: #B8ABA0; font-style: italic; flex: 1; }
.note-edit-link { font-size: 10px; color: var(--teal); cursor: pointer; text-decoration: underline; white-space: nowrap; }
.note-edit { margin-top: 6px; }
.note-textarea {
  width: 100%; min-height: 44px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px;
  font-size: 11px; font-family: 'Inter', sans-serif; resize: vertical; outline: none;
}
.note-textarea:focus { border-color: var(--accent); }
.note-edit-actions { display: flex; gap: 6px; margin-top: 5px; }
.note-save-btn, .note-cancel-btn {
  font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--rule);
}
.note-save-btn { background: var(--teal); border-color: var(--teal); color: white; font-weight: 600; }
.note-cancel-btn { background: white; color: #6B5E52; }

/* Close / reopen. Deliberately small and text-like rather than a big primary
   button: closing an order is a bookkeeping act, not the point of this screen,
   and an eye-catching button beside every card invites mis-clicks. */
.status-action {
  font-size: 10px; padding: 4px 9px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--rule); background: white; color: #6B5E52; white-space: nowrap;
}
.status-action:hover { border-color: var(--ink); color: var(--ink); }
.status-action.reopen:hover { border-color: var(--teal); color: var(--teal); }
.status-action:disabled { opacity: .5; cursor: default; }

.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-ordernum { font-family: 'DM Mono', monospace; font-weight: 700; font-size: 14px; }
.card-customer { font-size: 14px; font-weight: 600; }
.card-badges { margin-left: auto; display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 9px; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; white-space: nowrap; }
.badge.status { background: var(--teal-light); color: var(--teal); }
.badge.status.closed { background: var(--rule); color: #6B5E52; }
.badge.pay-unpaid { background: var(--accent-light); color: var(--accent); }
.badge.pay-paid { background: var(--done-bg); color: var(--done-text); }
.badge.pay-other { background: var(--gold-light); color: var(--gold); }
.badge.channel { background: var(--warm); color: #6B5E52; }
.badge.ful-done { background: var(--done-bg); color: var(--done-text); }
.badge.ful-moving { background: var(--teal-light); color: var(--teal); }
.badge.ful-none { background: var(--rule); color: #6B5E52; }
.badge.ful-other { background: var(--gold-light); color: var(--gold); }
.badge.draft { background: var(--gold-light); color: var(--gold); }
.card-meta-row { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; font-size: 11px; color: #8B7D72; }
.due-tag { font-weight: 700; padding: 1px 6px; border-radius: 8px; }
.due-tag.soon { background: var(--accent-light); color: var(--accent); }
.card-notes { font-size: 11px; color: #8B7D72; font-style: italic; margin-top: 6px; }
.card-shopify { font-family: 'DM Mono', monospace; font-size: 10px; color: #8B7D72; margin-top: 4px; }

/* Shipment row. Deliberately monospaced and one line: a tracking number is
   read character by character when it is being checked against a label, and a
   proportional font makes that harder than it needs to be. */
.card-ship {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  margin-top: 5px; padding-top: 5px; border-top: 1px dotted var(--rule);
  font-size: 10.5px; color: #6B5E52;
}
.ship-carrier { font-weight: 600; text-transform: uppercase; letter-spacing: .03em; font-size: 9.5px; color: #8B7D72; }
.ship-track { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--teal); text-decoration: none; }
.ship-track:hover { text-decoration: underline; }
.ship-track.plain { color: var(--ink); }
.ship-date { color: #8B7D72; }
.ship-action {
  font-size: 10px; padding: 3px 8px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--rule); background: white; color: #6B5E52; white-space: nowrap;
}
.ship-action:hover { border-color: var(--teal); color: var(--teal); }
.ship-none { color: #B8ABA0; font-style: italic; }

.empty-state { color: #8B7D72; font-style: italic; padding: 30px; text-align: center; }
.choice-hint {
  margin-bottom: 12px; padding: 9px 12px; border-radius: 6px; font-size: 11.5px; line-height: 1.6;
  background: var(--gold-light); border: 1px solid #E4CF9E; color: #6E4C13;
}
.choice-hint strong { font-family: 'DM Mono', monospace; }
.choice-hint code { font-family: 'DM Mono', monospace; background: rgba(0,0,0,.05); padding: 1px 4px; border-radius: 3px; }

/* Refresh report. One line when it went fine, a list when something needs
   doing — the point is that a quiet run stays quiet. */
.sync-box {
  margin-bottom: 12px; padding: 9px 12px; border-radius: 6px; font-size: 11.5px; line-height: 1.6;
  background: white; border: 1px solid var(--rule); color: #6B5E52;
}
.sync-box.good { background: var(--done-bg); border-color: #BBD79A; color: var(--done-text); }
.sync-box.warn { background: var(--gold-light); border-color: #E4CF9E; color: #6E4C13; }
.sync-box.bad { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.sync-box ul { margin: 5px 0 0 16px; }
.sync-box li { margin-bottom: 2px; }
.sync-box code { font-family: 'DM Mono', monospace; background: rgba(0,0,0,.06); padding: 1px 4px; border-radius: 3px; }
.sync-dismiss { float: right; cursor: pointer; font-size: 14px; line-height: 1; opacity: .5; padding-left: 8px; }
.sync-dismiss:hover { opacity: 1; }
.sync-stamp { font-size: 10.5px; color: #8B7D72; }
.refresh-btn {
  font-size: 11px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--teal);
  background: var(--teal); color: white; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.refresh-btn:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="title">Orders</div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="sync-stamp" id="syncStamp"></span>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshFromShopify()"
      title="Re-read Shopify: payment, fulfilment and tracking on every order, plus any new orders and edited draft quantities">↻ Refresh from Shopify</button>
  </div>
</div>

<div class="summary-strip" id="summaryStrip"></div>
<div id="syncReport"></div>
<div id="shipHint"></div>
<div id="choiceHint"></div>

<div class="controls">
  <input class="search-input" id="searchBox" placeholder="Search customer, order #, Shopify ID, tracking..." oninput="renderList()">
  <select class="sort-select" id="sortSelect" onchange="renderList()">
    <option value="due">Sort: Due date (soonest)</option>
    <option value="orderdate">Sort: Order date (newest)</option>
    <option value="customer">Sort: Customer A–Z</option>
  </select>
  <button class="view-toggle-btn active" id="closedToggle" onclick="toggleClosed()">Hiding closed</button>
  <button class="view-toggle-btn" id="denseToggle" onclick="toggleDense()">Compact view</button>
</div>

<div class="filter-row" id="statusFilters"></div>
<div class="filter-row" id="channelFilters"></div>

<div class="result-count" id="resultCount"></div>
<div id="orderList" class="order-list"></div>

<script>
function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
/* For a value going into a JS string inside an HTML attribute, e.g.
   onclick="setStatusFilter(...)". JSON.stringify quotes and escapes it for JS,
   esc() then makes it safe as attribute text. A status value containing an
   apostrophe used to break the chip's onclick outright. */
function jsAttr(v) { return esc(JSON.stringify(v == null ? '' : String(v))); }

/* Accent folding — KEEP BYTE-IDENTICAL ACROSS WIDGETS.
   normalize() strips anything outside a-z0-9, which DELETES accented letters
   rather than folding them: "Pathétique" became "pathtique" while the file
   "Pathetique.jpg" became "pathetique", so the two never matched and the widget
   reported nothing found. NFD splits a letter from its diacritic so the
   diacritic can be dropped and the base letter kept; the map handles the
   characters that have no decomposition (ß, ø, æ and friends).
   Display is untouched — this only ever builds comparison keys. */
const ACCENT_FOLD_MAP = { 'æ':'ae','Æ':'ae','œ':'oe','Œ':'oe','ø':'o','Ø':'o',
  'ß':'ss','đ':'d','Đ':'d','ð':'d','Ð':'d','ł':'l','Ł':'l','þ':'th','Þ':'th' };
function foldAccents(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[æÆœŒøØßđĐðÐłŁþÞ]/g, c => ACCENT_FOLD_MAP[c] || c);
}

function normalize(s) { return foldAccents((s || '').toString()).toLowerCase().trim(); }
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function daysFromToday(dateVal) {
  if (!dateVal) return null;
  const ms = typeof dateVal === 'number' ? dateVal * 1000 : new Date(dateVal).getTime();
  if (!ms || isNaN(ms)) return null;
  return Math.round(ms / 86400000 - Date.now() / 86400000);
}
function fmtDate(dateVal) {
  if (!dateVal) return '';
  const ms = typeof dateVal === 'number' ? dateVal * 1000 : new Date(dateVal).getTime();
  if (!ms || isNaN(ms)) return '';
  return new Date(ms).toISOString().slice(0, 10);
}

/* ---------- closing an order ----------
   "Closed" is not an arbitrary label. Two places already test for this exact
   word, so anything else leaves the order looking finished in one view and
   still active in another:
     - renderSummaryStrip() below counts active orders as status !== 'closed'
     - (order-overview.html, now retired, listed active orders as Status === 'Active' || blank)
   A blank status therefore also means OPEN everywhere, which is why an order
   never leaves a list until this field is written.
   Kept as a constant so there is one place to change if the vocabulary ever
   moves — Quick Log's isClosedStatus() tests the same word.               */
const CLOSED_STATUS = 'Closed';
function isClosedValue(s) { return (s || '').toString().trim().toLowerCase() === 'closed'; }

/* Kept byte-identical with quick-log.html, wind-routing.html and
   label-batch.html (there named allocBucketLB). Order matters: "Wound - Needs
   Labels" contains "Wound", so the needs-labels test has to run before the
   catch-all.

   This screen had its own drifted inline version — missing "to wind", and with
   no wound bucket at all — which is how unwound allocations came to read as
   ready to ship. Copy this one verbatim rather than rewriting it; the point is
   that all four agree. */
function allocBucket(status) {
  const s = (status == null ? '' : status).toString();
  if (/unwound|in bin|to wind/i.test(s)) return 'pending';
  if (/needs? labels?|awaiting labels?|unlabel/i.test(s)) return 'wound';
  return 'boxed';
}

let allOrders = [];
let orderLineData = {}; // workOrderId -> {needed, dyed, wound, packed, hasRush, skus: []}
let statusFilter = 'ALL';
let channelFilter = 'ALL';
let selectedId = null;
let denseMode = false;
let editingNoteId = null;
let hideClosed = true;      // closed orders are history; off the list by default
let statusBusyId = null;    // guards against a double-click writing twice
let sawClosedOnLoad = false; // was 'Closed' already a value in the column?
let choiceHintShown = false;
let statusColName = 'Status';
let shipCols = {};          // which shipment columns actually exist on Work_Orders
let syncBusy = false;

/* ── Refreshing from Shopify ───────────────────────────────────────────────
   This calls the order-sync webhook (Order Sync, now retired, used the same one) — the production URL
   of the "Run From Dashboard" node on "SS - Reprocess Open Orders". There is
   deliberately no second, lighter workflow: that one already contains a
   dedicated status pass ("Diff Order Status") whose whole job is exactly what
   was asked for here — re-read payment, fulfilment, tracking number, tracking
   URL, carrier and shipped date on EVERY work order, including archived and
   cancelled ones, and write nothing else. A status-only workflow would have to
   repeat the same two Shopify fetches and the same Grist read, so it would not
   actually be cheaper; it would just be a second thing to keep in step.

   BE AWARE, because pressing this does more than refresh statuses: the same run
   also imports Shopify orders that are not in Grist yet, and syncs quantities
   on drafts and unshipped orders. That is usually what you want from this
   screen, but it is a write, not a read — the report below names everything it
   changed. */
const SYNC_WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/sync-drafts';

/* Two Shopify pages plus four Grist tables, so this is slow by nature. Without
   a ceiling a stalled workflow leaves the button spinning forever with no way
   to tell a slow run from a dead one. */
const SYNC_TIMEOUT_MS = 120000;

/* ── ShipStation ──────────────────────────────────────────────────────────
   ShipStation publishes no per-order URL — linking straight to an order has
   been an open feature request on their own community forum for years, and
   neither their help centre nor their API docs document a search query string.
   Rather than invent a URL that would 404 or silently land on the wrong
   screen, the button copies the order number and opens ShipStation, which is
   one paste into Quicksearch away from the order.

   If a working deep link ever turns up, put it here with {order} where the
   order number goes — e.g. 'https://ship.shipstation.com/orders/...?q={order}'
   — and the button will use it directly instead of copying. */
const SHIPSTATION_URL = 'https://ship.shipstation.com/';
const SHIPSTATION_DEEP_LINK = '';   // '' = copy-and-open; set a {order} template to link directly

let allocByLine = {};
const openDetails = new Set();
function toggleDense() {
  denseMode = !denseMode;
  document.getElementById('denseToggle').classList.toggle('active', denseMode);
  document.getElementById('orderList').classList.toggle('dense', denseMode);
}
function toggleClosed() {
  hideClosed = !hideClosed;
  const b = document.getElementById('closedToggle');
  b.classList.toggle('active', hideClosed);
  b.textContent = hideClosed ? 'Hiding closed' : 'Showing closed';
  renderList();
}

async function loadOrders() {
  try {
    const [table, linesTable] = await Promise.all([
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Work_Order_Lines'),
    ]);
    const c = (cands) => findColumn(table, cands);
    const custCol = c(['Customer_Name']) || 'Customer_Name';
    const orderDateCol = c(['Order_Date']);
    const dueCol = c(['Due_Date']);
    const statusCol = c(['Status']);
    const shopifyCol = c(['Shopify_Order_ID']);
    const payCol = c(['Payment_Status']);
    const channelCol = c(['Channel']);
    const numCol = c(['Order_Number']) || 'Order_Number';
    const typeCol = c(['Order_Type']);
    const notesCol = c(['Notes']);

    /* Shipment columns, all optional. The n8n status pass discovers its own
       writable columns the same way and skips the ones that do not exist, so
       an absent column here means "nothing has ever been written to it",
       not "the sync is broken" — which is why a missing one produces the
       setup hint below rather than an error. */
    shipCols = {
      tracking: c(['Tracking_Number', 'Tracking']),
      trackingUrl: c(['Tracking_URL']),
      carrier: c(['Carrier']),
      shippedDate: c(['Shipped_Date']),
      fulfillment: c(['Fulfillment_Status']),
    };
    const rowOpt = (col, i) => (col ? (columnAsArray(table, col)[i] || '') : '');

    // Write to the resolved column id, never the literal — a renamed Status
    // column would otherwise make every close silently fail.
    statusColName = statusCol || null;

    allOrders = (table.id || []).map((id, i) => ({
      id,
      tracking: rowOpt(shipCols.tracking, i),
      trackingUrl: rowOpt(shipCols.trackingUrl, i),
      carrier: rowOpt(shipCols.carrier, i),
      shippedDate: shipCols.shippedDate ? columnAsArray(table, shipCols.shippedDate)[i] : null,
      fulfillment: rowOpt(shipCols.fulfillment, i),
      customerName: columnAsArray(table, custCol)[i] || '',
      orderDate: orderDateCol ? columnAsArray(table, orderDateCol)[i] : null,
      dueDate: dueCol ? columnAsArray(table, dueCol)[i] : null,
      status: statusCol ? (columnAsArray(table, statusCol)[i] || '') : '',
      shopifyId: shopifyCol ? columnAsArray(table, shopifyCol)[i] : '',
      paymentStatus: payCol ? (columnAsArray(table, payCol)[i] || '') : '',
      channel: channelCol ? (columnAsArray(table, channelCol)[i] || '') : '',
      orderNumber: columnAsArray(table, numCol)[i] || '',
      orderType: typeCol ? (columnAsArray(table, typeCol)[i] || '') : '',
      notes: notesCol ? (columnAsArray(table, notesCol)[i] || '') : '',
      paymentTerms: rowOpt(c(['Payment_Terms']), i), paymentMethod: rowOpt(c(['Payment_Method']), i), poNumber: rowOpt(c(['PO_Number']), i),
    }));

    sawClosedOnLoad = allOrders.some(o => isClosedValue(o.status));

    // Per-order production summary from Work_Order_Lines
    // "Packed" now comes from Lot_Allocations: a line can be filled from several
    // lots, so the per-line Qty_Packed can't say which bag the spools came from.
    // Winding, labelling and boxing are one physical act here, so any allocation
    // past "in bin" counts as boxed. Legacy Qty_Packed is still honoured
    // (whichever is higher) until that column is deleted.
    const allocBoxedByLine = {};
    /* Every allocation, by line and stage, for the pipeline bar and the
       details panel: hank (put away, not wound), wound (needs labels),
       boxed. Lot numbers and order bins ride along for the details. */
    allocByLine = {};
    try {
      const allocTable = await grist.docApi.fetchTable('Lot_Allocations');
      const aLineCol = findColumn(allocTable, ['Work_Order_Line']);
      const aQtyCol = findColumn(allocTable, ['Qty_Spools']);
      const aStatusCol = findColumn(allocTable, ['Status']);
      const aLotCol = findColumn(allocTable, ['Lot']);
      const aBinCol = findColumn(allocTable, ['Order_Bin']);
      const lotNumById = {};
      try {
        const lotsT = await grist.docApi.fetchTable('Production_Lots');
        const ln = findColumn(lotsT, ['Lot_Number']);
        (lotsT.id || []).forEach((id, i) => { lotNumById[id] = String(columnAsArray(lotsT, ln)[i] || ''); });
      } catch (e) { /* lot numbers are a nicety */ }
      if (aLineCol && aQtyCol) {
        (allocTable.id || []).forEach((id, i) => {
          const lineId = getRefId(columnAsArray(allocTable, aLineCol)[i]);
          if (!lineId) return;
          const status = (aStatusCol ? columnAsArray(allocTable, aStatusCol)[i] : '') || '';
          const q0 = Number(columnAsArray(allocTable, aQtyCol)[i]) || 0;
          const bk = allocBucket(status);
          const st = allocByLine[lineId] = allocByLine[lineId] || { hank: 0, wound: 0, boxed: 0, lots: new Set(), bins: new Set() };
          st[bk === 'pending' ? 'hank' : bk === 'wound' ? 'wound' : 'boxed'] += q0;
          const lotRef = aLotCol ? getRefId(columnAsArray(allocTable, aLotCol)[i]) : null;
          if (lotRef && lotNumById[lotRef]) st.lots.add(lotNumById[lotRef]);
          const ob = aBinCol ? String(columnAsArray(allocTable, aBinCol)[i] || '').trim() : '';
          if (ob) st.bins.add(ob);
          /* Only genuinely boxed spools count toward "Ready to ship". This
             used to test /unwound|in bin/i and count everything else as
             boxed — two drifts from the canonical function: "to wind" was
             missing, and there was no wound bucket at all, so an allocation
             reading "Wound - Needs Labels" counted as packed.

             An order allocated "To Wind" therefore read 100% packed, showed
             Ready to ship, and Close wrote Status = Closed on it — after
             which it left this screen, left Quick Log (which skips closed
             orders) and left Order Overview, with nothing wound and no screen
             able to reach the allocations again. */
          if (allocBucket(status) !== 'boxed') return;
          allocBoxedByLine[lineId] = (allocBoxedByLine[lineId] || 0) + (Number(columnAsArray(allocTable, aQtyCol)[i]) || 0);
        });
      }
    } catch (e) {
      console.warn('Lot_Allocations unavailable — falling back to Qty_Packed', e);
    }

    const lc = (cands) => findColumn(linesTable, cands);
    const lWoCol = lc(['Work_Order']) || 'Work_Order';
    const lNeededCol = lc(['Qty_Needed']);
    const lDyedCol = lc(['Qty_Dyed']);
    const lPackedCol = lc(['Qty_Packed']);
    const lPriorityCol = lc(['Production_Priority']);
    const lSkuCol = lc(['SKU']);

    const lRecipeCol = lc(['Recipe']);
    const lNotesCol = lc(['Notes']);
    const recipeNameById = {};
    try {
      const rt = await grist.docApi.fetchTable('Recipes');
      const rn = findColumn(rt, ['Recipe_Name']), rf = findColumn(rt, ['Fiber_Type']);
      (rt.id || []).forEach((id, i) => { recipeNameById[id] = { name: String(columnAsArray(rt, rn)[i] || ''), fiber: String(columnAsArray(rt, rf)[i] || '') }; });
    } catch (e) { /* names are a nicety; the SKU still shows */ }
    orderLineData = {};
    (linesTable.id || []).forEach((id, i) => {
      const woId = getRefId(columnAsArray(linesTable, lWoCol)[i]);
      if (!woId) return;
      if (!orderLineData[woId]) orderLineData[woId] = { needed: 0, dyed: 0, packed: 0, hasRush: false, skus: [], lines: 0, unlinked: 0,
        hank: 0, wound: 0, boxed: 0, made: 0, detail: [] };
      const d = orderLineData[woId];
      const needed = lNeededCol ? Number(columnAsArray(linesTable, lNeededCol)[i]) || 0 : 0;
      d.needed += needed;
      d.lines += 1;
      d.dyed += Math.min(lDyedCol ? Number(columnAsArray(linesTable, lDyedCol)[i]) || 0 : 0, needed || Infinity);
      const legacyPacked = lPackedCol ? Number(columnAsArray(linesTable, lPackedCol)[i]) || 0 : 0;
      const boxed = Math.max(allocBoxedByLine[id] || 0, legacyPacked);
      d.packed += Math.min(boxed, needed || Infinity);
      if (lPriorityCol && columnAsArray(linesTable, lPriorityCol)[i] === 'Rush') d.hasRush = true;
      const sku = lSkuCol ? columnAsArray(linesTable, lSkuCol)[i] : '';
      if (sku) d.skus.push(sku); else d.unlinked += 1;
      const a = allocByLine[id] || { hank: 0, wound: 0, boxed: 0, lots: new Set(), bins: new Set() };
      const cap = v => Math.min(v, needed || Infinity);
      d.hank += a.hank; d.wound += a.wound; d.boxed += a.boxed;
      d.made += cap(a.hank + a.wound + a.boxed);
      const rec = recipeNameById[getRefId(lRecipeCol ? columnAsArray(linesTable, lRecipeCol)[i] : null)] || null;
      d.detail.push({ id, sku: sku || '', name: rec ? rec.name : '', fiber: rec ? rec.fiber : '', needed,
        hank: a.hank, wound: a.wound, boxed: a.boxed, lots: [...a.lots], bins: [...a.bins],
        notes: lNotesCol ? String(columnAsArray(linesTable, lNotesCol)[i] || '') : '',
        priority: lPriorityCol ? String(columnAsArray(linesTable, lPriorityCol)[i] || '') : '' });
      // A line with no SKU is usually a custom or limited-edition item made to
      // order. It is called out in the close confirmation because it can never
      // be matched by the Shopify sync, so it will not close itself.
    });

    try { photoState = await SSPhotos.load(grist.docApi); } catch (e) { console.warn('photo state', e); photoState = null; }
    renderShipHint();
    renderFilters();
    renderList();
  } catch (e) {
    console.error('Failed to load orders:', e);
    document.getElementById('orderList').innerHTML = `<div class="empty-state">Failed to load Work_Orders — check widget access.</div>`;
  }
}

function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}

function renderFilters() {
  const statuses = [...new Set(allOrders.map(o => o.status).filter(Boolean))];
  const statusBox = document.getElementById('statusFilters');
  statusBox.innerHTML = ['ALL', ...statuses].map(s => `
    <button class="filter-chip ${statusFilter === s ? 'active' : ''}" onclick="setStatusFilter(${jsAttr(s)})">${s === 'ALL' ? 'All Statuses' : esc(s)}</button>
  `).join('');

  const channels = [...new Set(allOrders.map(o => o.channel).filter(Boolean))];
  const channelBox = document.getElementById('channelFilters');
  channelBox.innerHTML = ['ALL', ...channels].map(c => `
    <button class="filter-chip ${channelFilter === c ? 'active' : ''}" onclick="setChannelFilter(${jsAttr(c)})">${c === 'ALL' ? 'All Channels' : esc(c)}</button>
  `).join('');
}
function setStatusFilter(s) { statusFilter = s; renderFilters(); renderList(); }
function setChannelFilter(c) { channelFilter = c; renderFilters(); renderList(); }

/* Fulfilment wording comes from the n8n status pass, which titleizes whatever
   Shopify's newest fulfillment reports — so 'Delivered', 'In Transit',
   'Out For Delivery', 'Shipped', 'Partially Shipped', 'Restocked' and
   'Unfulfilled' are all possible. Matched loosely rather than exhaustively: an
   unrecognised value gets the neutral badge instead of no badge at all. */
function fulfillmentBadgeClass(status) {
  const s = (status || '').toLowerCase();
  if (/deliver/.test(s) && !/out for/.test(s)) return 'ful-done';
  if (/transit|out for|shipped/.test(s)) return 'ful-moving';
  if (/unfulfilled|restock/.test(s)) return 'ful-none';
  return 'ful-other';
}

function paymentBadgeClass(status) {
  const s = (status || '').toLowerCase();
  if (s === 'unpaid') return 'pay-unpaid';
  if (s.includes('paid') || s === 'invoiced') return 'pay-paid';
  return 'pay-other';
}

/* Where the order is, from its allocations (what has actually been put away,
   wound and boxed) rather than Qty_Dyed, which nothing keeps current — an MMI
   order with 140 spools in its bin read "Not started". */
function productionStatus(orderId) {
  const d = orderLineData[orderId];
  if (!d || !d.needed) return null;
  if (d.packed >= d.needed) return { cls: 'prod-ready', label: 'Ready to ship' };
  const toMake = Math.max(0, d.needed - d.made);
  if (!d.made) return { cls: 'prod-notstarted', label: 'To dye' };
  if (d.wound || (d.boxed && d.boxed < d.needed && !d.hank)) return { cls: 'prod-progress', label: toMake ? 'Labelling · some to dye' : 'Labelling & boxing' };
  if (d.hank) return { cls: 'prod-progress', label: toMake ? 'Winding · some to dye' : 'To wind' };
  return { cls: 'prod-progress', label: 'Part made' };
}
function stageOfLine(l) {
  if (!l.needed) return { t: '—', c: '#8B7D72' };
  if (l.boxed >= l.needed) return { t: 'Boxed', c: '#2A6B6B' };
  if (l.wound) return { t: 'Wound, to label', c: '#5B4A8B' };
  if (l.hank) return { t: 'In hank, to wind', c: '#B07D2A' };
  if (l.boxed) return { t: 'Part boxed', c: '#2A6B6B' };
  return { t: 'To dye', c: '#8B7D72' };
}
function pipelineHtml(o) {
  const d = orderLineData[o.id];
  if (!d || !d.needed) return '';
  const toMake = Math.max(0, d.needed - d.made);
  const pct = v => (100 * Math.min(v, d.needed) / d.needed).toFixed(2) + '%';
  const seg = [['b', d.boxed, 'boxed'], ['w', d.wound, 'wound'], ['h', d.hank, 'in hank']];
  return `<div class="pipe" title="${d.boxed} boxed · ${d.wound} wound · ${d.hank} in hank · ${toMake} to dye, of ${d.needed}">
      ${seg.map(([c, v]) => v ? `<span class="${c}" style="width:${pct(v)}"></span>` : '').join('')}</div>
    <div class="pipe-txt"><span>${d.needed} spools</span>
      ${seg.map(([c, v, l]) => v ? `<span><i class="${c}" style="background:${c === 'b' ? '#2A6B6B' : c === 'w' ? '#5B4A8B' : '#B07D2A'}"></i>${v} ${l}</span>` : '').join('')}
      ${toMake ? `<span><i style="background:#E8DFD4"></i>${toMake} to dye</span>` : ''}
      ${photoChip(o.id)}
      <span class="det-link" onclick="event.stopPropagation(); toggleDetails(${o.id})">${openDetails.has(o.id) ? 'Hide details ▴' : 'Details ▾'}</span></div>`;
}
function detailsHtml(o) {
  if (!openDetails.has(o.id)) return '';
  const d = orderLineData[o.id] || { detail: [] };
  const f = (k, v) => v ? `<div><div class="k">${k}</div><div>${v}</div></div>` : '';
  const n = v => v ? `<td class="n">${v}</td>` : '<td class="n z">·</td>';
  const ship = o.trackingUrl ? `<a href="${esc(o.trackingUrl)}" target="_blank" rel="noopener">${esc(o.tracking || 'track')} ↗</a>` : esc(o.tracking || '');
  return `<div class="det" onclick="event.stopPropagation()">
    <div class="det-grid">
      ${f('Order', esc(o.orderNumber))}${f('Customer', esc(o.customerName))}${f('Type', esc([o.orderType, o.channel].filter(Boolean).join(' · ')))}
      ${f('Ordered', o.orderDate ? esc(fmtDate(o.orderDate)) : '')}${f('Due', o.dueDate ? esc(fmtDate(o.dueDate)) : '')}
      ${f('Status', esc(o.status))}${f('Payment', esc([o.paymentStatus, o.paymentTerms, o.paymentMethod].filter(Boolean).join(' · ')))}
      ${f('PO', esc(o.poNumber))}${f('Fulfilment', esc(o.fulfillment))}${f('Shipped', o.shippedDate ? esc(fmtDate(o.shippedDate)) : '')}
      ${f('Carrier', esc(o.carrier))}${f('Tracking', ship)}
    </div>
    ${photoRowHtml(o)}
    ${d.detail.length ? `<table><tr><th>Colourway</th><th>SKU</th><th style="text-align:right">Need</th><th style="text-align:right">To dye</th>
        <th style="text-align:right">Hank</th><th style="text-align:right">Wound</th><th style="text-align:right">Boxed</th><th>Stage</th>${photoOn(o.id) ? '<th>Photo</th>' : ''}</tr>
      ${d.detail.map(l => { const sg = stageOfLine(l), toMake = Math.max(0, l.needed - l.hank - l.wound - l.boxed);
        return `<tr><td><b>${esc(l.name || '—')}</b>${l.fiber ? ` <span style="color:#8B7D72">${esc(l.fiber)}</span>` : ''}${l.priority === 'Rush' ? ' <span class="badge rush">Rush</span>' : ''}
          ${l.lots.length || l.bins.length ? `<div style="font-size:10px;color:#8B7D72">${esc([l.lots.join(', '), l.bins.join(', ')].filter(Boolean).join(' · '))}</div>` : ''}
          ${l.notes ? `<div style="font-size:10.5px;color:#6B5E52">${esc(l.notes)}</div>` : ''}</td>
          <td style="font-family:'DM Mono',monospace;font-size:10.5px">${esc(l.sku)}</td>${n(l.needed)}${n(toMake)}${n(l.hank)}${n(l.wound)}${n(l.boxed)}
          <td><span class="stg" style="color:${sg.c}">${sg.t}</span></td>${photoOn(o.id) ? `<td>${photoCell(l.id)}</td>` : ''}</tr>`; }).join('')}</table>`
      : '<div style="font-size:11.5px;color:#8B7D72;margin-top:6px">No lines on this order.</div>'}
  </div>`;
}
/* ── Photos (photo-status.js) ─────────────────────────────────────────
   Whether the order wants photos, how many colourways are done, any spool
   still out at command, and the order's own share link to send. */
let photoState = null;
function photoOn(woId) { const o = photoState && photoState.order(woId); return !!(o && o.wanted); }
function photoChip(woId) {
  const o = photoState && photoState.order(woId);
  if (!o || !o.wanted || !o.total) return '';
  const c = o.counts, col = c.command ? '#8B3A2A' : c.needed ? '#B07D2A' : '#2E5E1A';
  const t = c.command ? `${c.command} at command` : `${c.done}/${o.total}`;
  return `<span style="color:${col};font-weight:600" title="${esc(SSPhotos.orderSummary(o).text)}">📷 ${t}</span>`;
}
function photoCell(lineId) {
  const L = photoState && photoState.line(lineId);
  if (!L) return '';
  const b = SSPhotos.lineBadge(L);
  if (L.state === 'command') return b + `<button class="ph-mini" onclick="photoLine(${lineId}, 'Done')" title="Photo taken and the spool is back with the order">back ✓</button>`;
  if (L.state === 'needed') return b + `<button class="ph-mini" onclick="photoLine(${lineId}, 'Not needed')">skip</button>`;
  if (L.state === 'skip') return b + `<button class="ph-mini" onclick="photoLine(${lineId}, '')">undo</button>`;
  return b;
}
function photoRowHtml(ord) {
  const o = photoState && photoState.order(ord.id);
  if (!o) return '';
  const def = o.customerWants ? 'yes' : 'no';
  const sel = `<select onchange="setSendPhotos(${ord.id}, this.value)" title="Blank follows the customer's setting">
      <option value="" ${!o.override ? 'selected' : ''}>Customer default (${def})</option>
      <option value="Yes" ${o.override === 'Yes' ? 'selected' : ''}>Yes</option>
      <option value="No" ${o.override === 'No' ? 'selected' : ''}>No</option></select>`;
  if (!o.wanted) return `<div class="ph-row"><b>📷 Photos</b> ${sel}</div>`;
  const link = o.link
    ? `<span class="ph-link">${esc(o.link)}</span><button class="go" onclick="copyPhotoLink(${ord.id})">Copy link</button><a href="${esc(o.link)}" target="_blank" rel="noopener" style="font-size:11px">open ↗</a>`
    : (o.folder ? `<button class="go" onclick="copyPhotoLink(${ord.id})">Make share link</button>`
                : `<span style="color:#8B7D72">Link appears after the first photo is shared (Photo Gallery)</span>`);
  return `<div class="ph-row"><b>📷 Photos</b> ${sel} <span>${esc(SSPhotos.orderSummary(o).text.replace(/^📷 /, ''))}</span> ${link}</div>`;
}
async function setSendPhotos(woId, v) {
  try { await grist.docApi.applyUserActions([['UpdateRecord', 'Work_Orders', woId, { Send_Photos: v || null }]]); await refreshPhotos(); }
  catch (e) { console.error(e); alert('Could not save — check the Send_Photos column exists on Work_Orders.'); }
}
async function photoLine(lineId, v) {
  try { await SSPhotos.setLines(grist.docApi, [lineId], v); await refreshPhotos(); }
  catch (e) { console.error(e); alert('Could not save the photo status.'); }
}
async function copyPhotoLink(woId) {
  const o = photoState && photoState.order(woId);
  if (!o) return;
  try {
    const url = await SSPhotos.ensureLink(grist.docApi, o);
    try { await navigator.clipboard.writeText(url); } catch (e) { prompt('Copy this link:', url); }
    renderList();
  } catch (e) { console.error(e); alert(e.message || 'Could not make the link'); }
}
async function refreshPhotos() {
  try { photoState = await SSPhotos.load(grist.docApi); } catch (e) { console.warn(e); }
  renderList();
}
function toggleDetails(id) { if (openDetails.has(id)) openDetails.delete(id); else openDetails.add(id); renderList(); }
function orderHasRush(orderId) {
  const d = orderLineData[orderId];
  return !!(d && d.hasRush);
}
function orderSkuText(orderId) {
  const d = orderLineData[orderId];
  return d ? d.skus.join(' ') : '';
}

function startEditNote(id) {
  editingNoteId = id;
  renderList();
  setTimeout(() => {
    const el = document.getElementById(`noteInput-${id}`);
    if (el) el.focus();
  }, 0);
}
function cancelEditNote() {
  editingNoteId = null;
  renderList();
}
async function saveNote(id) {
  const el = document.getElementById(`noteInput-${id}`);
  const value = el ? el.value : '';
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Work_Orders', id, { Notes: value }]]);
    const o = allOrders.find(o => o.id === id);
    if (o) o.notes = value;
    editingNoteId = null;
    renderList();
  } catch (e) {
    console.error('Failed to save note:', e);
    alert('Could not save note — check the console.');
  }
}

/* What is still outstanding on an order, in words, for the close confirmation.
   Returns '' when there is nothing to warn about. */
function outstandingText(id) {
  const d = orderLineData[id];
  if (!d || !d.lines) return 'this order has no line items at all';
  if (!d.needed) return 'no quantities are set on its lines';
  const parts = [];
  if (d.packed < d.needed) parts.push(`${d.needed - d.packed} of ${d.needed} spools are not recorded as boxed`);
  if (d.unlinked) parts.push(`${d.unlinked} line${d.unlinked === 1 ? '' : 's'} with no SKU`);
  return parts.join(', ');
}

/* One write, one field. Closing is deliberately dumb: it does not touch
   quantities, allocations, lots or Shopify. Nothing downstream is reversed by
   reopening, which is what makes reopening safe. */
async function setOrderStatus(id, value) {
  if (!statusColName) {
    alert('Work_Orders has no Status column — nothing to write to.');
    return false;
  }
  const o = allOrders.find(x => x.id === id);
  if (!o) return false;
  const previous = o.status;
  statusBusyId = id;
  renderList();
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Work_Orders', id, { [statusColName]: value }],
    ]);
    o.status = value;
    statusBusyId = null;
    renderFilters();   // a brand-new status value needs its own filter chip
    renderList();
    maybeShowChoiceHint(value);
    return true;
  } catch (e) {
    console.error('Failed to set order status:', e);
    o.status = previous;
    statusBusyId = null;
    renderList();
    alert('Could not change the status — this widget needs Full document access. Nothing was changed.');
    return false;
  }
}

/* If "Closed" was not already in the column, and Status is a Choice column,
   Grist stores the value but flags it as an invalid choice until it is added
   to the column's option list. Say so once rather than leaving a mystery
   red cell. */
function maybeShowChoiceHint(value) {
  if (choiceHintShown || sawClosedOnLoad || !isClosedValue(value)) return;
  choiceHintShown = true;
  document.getElementById('choiceHint').innerHTML =
    `<div class="choice-hint">Saved. This is the first time <strong>${esc(CLOSED_STATUS)}</strong> has been used in this document —
     if <strong>Status</strong> is a Choice column, the cell will show as an invalid choice until you add
     <strong>${esc(CLOSED_STATUS)}</strong> to that column's options in the creator panel. The value itself is stored either way.</div>`;
}

async function closeOrder(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  const out = outstandingText(id);
  const who = [o.orderNumber, o.customerName].filter(Boolean).join(' — ') || 'this order';
  let msg = `Close ${who}?\n\nStatus becomes "${CLOSED_STATUS}", which takes it off the active list here and in Order Overview.`;
  if (out) {
    msg += `\n\nStill outstanding: ${out}.\n\n` +
      `That is fine for a custom or limited-edition item you made by hand and never allocated — ` +
      `closing only changes the status. Production records are left exactly as they are.`;
  }
  msg += `\n\nYou can reopen it from the same card.`;
  if (!confirm(msg)) return;
  await setOrderStatus(id, CLOSED_STATUS);
}

async function reopenOrder(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  const who = [o.orderNumber, o.customerName].filter(Boolean).join(' — ') || 'this order';
  if (!confirm(`Reopen ${who}?\n\nStatus goes back to "Active" and it returns to the active list.`)) return;
  await setOrderStatus(id, 'Active');
}

/* ── Shipment display ─────────────────────────────────────────────────────
   Every field here is optional and read through a resolved column, so this
   whole block is inert on a document that has none of them. */

const SHIP_COL_TYPES = {
  Tracking_Number: 'Text', Tracking_URL: 'Text', Carrier: 'Text',
  Shipped_Date: 'Date', Fulfillment_Status: 'Text',
};

/* Said once, on load, and only when a column is genuinely absent. The n8n
   status pass reports the same list in its own run summary — but nobody reads
   that until something is already wrong, and this is the screen where the
   absence is actually noticeable. */
function renderShipHint() {
  const box = document.getElementById('shipHint');
  if (!box) return;
  const missing = Object.keys(SHIP_COL_TYPES).filter(name => {
    const k = { Tracking_Number: 'tracking', Tracking_URL: 'trackingUrl', Carrier: 'carrier',
                Shipped_Date: 'shippedDate', Fulfillment_Status: 'fulfillment' }[name];
    return !shipCols[k];
  });
  if (!missing.length) { box.innerHTML = ''; return; }
  box.innerHTML = `<div class="choice-hint">Shipping information can't be shown for
    ${missing.length === Object.keys(SHIP_COL_TYPES).length ? 'any order' : 'every order'} —
    <strong>Work_Orders</strong> has no
    ${missing.map(m => `<code>${esc(m)}</code>`).join(', ')} column${missing.length === 1 ? '' : 's'}.
    Add ${missing.length === 1 ? 'it' : 'them'} in Grist
    (${missing.map(m => `<code>${esc(m)}</code> as ${esc(SHIP_COL_TYPES[m])}`).join(', ')}),
    then press <strong>Refresh from Shopify</strong> — the sync fills
    ${missing.length === 1 ? 'it' : 'them'} in and skips whatever is missing rather than failing.</div>`;
}

function shortShipDate(v) {
  if (!v) return '';
  const ms = typeof v === 'number' ? v * 1000 : Date.parse(v);
  if (!ms || isNaN(ms)) return '';
  // Grist Date columns hold epoch SECONDS at UTC midnight, so this must be
  // formatted in UTC — local formatting lands on the previous day west of UTC.
  return new Date(ms).toLocaleDateString(undefined,
    { month: 'short', day: 'numeric', timeZone: 'UTC' });
}

/* The ShipStation action. With no deep link available it copies the order
   number and opens ShipStation in a new tab, so the number is already on the
   clipboard when Quicksearch has focus. Clipboard access can be refused inside
   an iframe, so the tab is opened either way and the copy is best-effort. */
async function openShipStation(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  const num = String(o.orderNumber || '').trim();

  if (SHIPSTATION_DEEP_LINK && num) {
    window.open(SHIPSTATION_DEEP_LINK.replace('{order}', encodeURIComponent(num)), '_blank');
    return;
  }

  let copied = false;
  if (num) {
    try {
      await navigator.clipboard.writeText(num);
      copied = true;
    } catch (e) {
      console.warn('Clipboard refused — the order number was not copied', e);
    }
  }
  window.open(SHIPSTATION_URL, '_blank');
  const btn = document.getElementById(`ssBtn-${id}`);
  if (btn) {
    btn.textContent = copied ? `${num} copied` : (num ? `paste ${num}` : 'ShipStation');
    setTimeout(() => { const b = document.getElementById(`ssBtn-${id}`); if (b) b.textContent = 'ShipStation'; }, 4000);
  }
}

function shipRowHtml(o) {
  const date = shortShipDate(o.shippedDate);
  const hasAny = o.tracking || o.carrier || date;
  // Nothing shipped and nothing to look up — don't spend a row saying so.
  if (!hasAny && !o.orderNumber) return '';

  /* A multi-parcel shipment stores every tracking number, comma-separated, but
     only ONE tracking URL — the n8n pass keeps `urls[0]`, because Shopify hands
     back a list and nothing links a url to a particular number. Rendering the
     whole joined string as one link would claim that url tracks all of them,
     which is wrong for every parcel after the first. So only the first number
     is a link; the rest are plain text to be pasted into the carrier's site. */
  const numbers = String(o.tracking || '').split(',').map(s => s.trim()).filter(Boolean);
  let trackHtml;
  if (!numbers.length) {
    trackHtml = `<span class="ship-none">no tracking yet</span>`;
  } else {
    trackHtml = numbers.map((n, idx) => (idx === 0 && o.trackingUrl)
      ? `<a class="ship-track" href="${esc(o.trackingUrl)}" target="_blank" onclick="event.stopPropagation()"
           title="Tracks this parcel${numbers.length > 1 ? ' — the other numbers have no link of their own' : ''}">${esc(n)} ↗</a>`
      : `<span class="ship-track plain">${esc(n)}</span>`).join(' ');
    if (numbers.length > 1) {
      trackHtml += ` <span class="ship-date">${numbers.length} parcels</span>`;
    }
  }

  return `
    <div class="card-ship" onclick="event.stopPropagation()">
      ${o.carrier ? `<span class="ship-carrier">${esc(o.carrier)}</span>` : ''}
      ${trackHtml}
      ${date ? `<span class="ship-date">shipped ${esc(date)}</span>` : ''}
      ${o.orderNumber ? `<button class="ship-action" id="ssBtn-${o.id}" onclick="openShipStation(${o.id})"
          title="Copies ${esc(o.orderNumber)} and opens ShipStation — paste it into Quicksearch">ShipStation</button>` : ''}
    </div>`;
}

/* ── Refresh from Shopify ─────────────────────────────────────────────────── */

function setRefreshBusy(busy) {
  syncBusy = busy;
  const btn = document.getElementById('refreshBtn');
  if (btn) {
    btn.disabled = busy;
    btn.textContent = busy ? 'Reading Shopify…' : '↻ Refresh from Shopify';
  }
  const stamp = document.getElementById('syncStamp');
  if (stamp && busy) stamp.textContent = 'this takes up to a minute';
}

function dismissSyncReport() { document.getElementById('syncReport').innerHTML = ''; }

function syncList(items, cap) {
  const list = (items || []).filter(Boolean);
  if (!list.length) return '';
  const shown = list.slice(0, cap);
  return '<ul>' + shown.map(i => `<li>${esc(i)}</li>`).join('') +
    (list.length > shown.length ? `<li>…and ${list.length - shown.length} more</li>` : '') + '</ul>';
}

/* The report is assembled from the webhook's own answer rather than from the
   fact that the call returned 200. "Applied" on the status pass means the PATCH
   response came back clean — the workflow computes that by reading Grist's
   reply, because its write node continues on error and a rejected write would
   otherwise flow onward looking like a success. */
function renderSyncReport(data) {
  const st = data.status || {};
  const c = data.counts || {};
  const missing = st.columns_missing || [];
  const parts = [];

  const statusChanges = st.changes || [];
  const imported = data.imported_orders || [];
  const qtyChanges = data.changes || [];
  const touched = statusChanges.length + imported.length + qtyChanges.length;

  let cls = 'good';
  if (st.write_error || missing.length) cls = 'warn';

  parts.push(`<span class="sync-dismiss" onclick="dismissSyncReport()" title="Dismiss">×</span>`);

  if (!touched) {
    parts.push(`<strong>Nothing changed.</strong> ${st.matched || 0} order(s) checked against Shopify —
      payment, fulfilment and tracking already matched.`);
  } else {
    parts.push(`<strong>Updated from Shopify.</strong> `);
    if (statusChanges.length) {
      parts.push(`${statusChanges.length} order(s) had payment, fulfilment or tracking corrected:` +
        syncList(statusChanges, 8));
    }
    if (imported.length) {
      parts.push(`${imported.length} order(s) imported that weren't in Grist yet:` + syncList(imported, 8));
    }
    if (qtyChanges.length) {
      parts.push(`${qtyChanges.length} line quantity change(s):` + syncList(qtyChanges, 8));
    }
  }

  if (st.write_error) {
    cls = 'bad';
    parts.push(`<div style="margin-top:6px">The status write was rejected by Grist —
      <code>${esc(st.write_error)}</code>. Nothing on this screen was updated.</div>`);
  }
  if (missing.length) {
    parts.push(`<div style="margin-top:6px">Skipped ${missing.length} field(s) with no column on
      Work_Orders: ${missing.map(m => `<code>${esc(m)}</code>`).join(', ')}.</div>`);
  }
  if (st.dry_run) {
    cls = 'warn';
    parts.push(`<div style="margin-top:6px">The status pass is in <strong>dry run</strong> —
      it reported what it would change but wrote nothing. Set <code>DRY_RUN = false</code> in the
      <strong>Diff Order Status</strong> node in n8n.</div>`);
  }

  document.getElementById('syncReport').innerHTML =
    `<div class="sync-box ${cls}">${parts.join('')}</div>`;
}

async function refreshFromShopify() {
  if (syncBusy) return;
  setRefreshBusy(true);
  dismissSyncReport();

  /* AbortController rather than a bare await: a stalled n8n run would otherwise
     hold the button hostage with nothing to distinguish slow from dead. */
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), SYNC_TIMEOUT_MS) : null;

  try {
    const res = await fetch(SYNC_WEBHOOK_URL, {
      method: 'GET', cache: 'no-store', headers: await SSSettings.hookHeaders(),
      ...(ctrl ? { signal: ctrl.signal } : {}),
    });
    if (!res.ok) throw new Error(`the workflow answered ${res.status} ${res.statusText}`);
    const data = await res.json();
    renderSyncReport(data || {});
    // Grist is the source of truth for this screen; the webhook only wrote to
    // it. Re-read rather than patching allOrders from the response, so what is
    // on screen is what is actually stored.
    await loadOrders();
    const stamp = document.getElementById('syncStamp');
    if (stamp) stamp.textContent = 'last refreshed ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Refresh from Shopify failed:', e);
    const aborted = e && (e.name === 'AbortError');
    document.getElementById('syncReport').innerHTML = `<div class="sync-box bad">
      <span class="sync-dismiss" onclick="dismissSyncReport()" title="Dismiss">×</span>
      <strong>Couldn't refresh.</strong> ${aborted
        ? `The workflow didn't answer within ${Math.round(SYNC_TIMEOUT_MS / 1000)} seconds. It may still
           be running in n8n — check its execution list before pressing this again, because a second run
           on top of the first can import the same order twice.`
        : esc(e.message)}
      <div style="margin-top:6px">Nothing on this screen was changed. Check that
      <strong>SS - Reprocess Open Orders</strong> is <strong>active</strong> in n8n and that
      <code>${esc(SYNC_WEBHOOK_URL)}</code> is the production URL on its
      <strong>Run From Dashboard</strong> node.</div></div>`;
    const stamp = document.getElementById('syncStamp');
    if (stamp) stamp.textContent = 'last refresh failed';
  } finally {
    if (timer) clearTimeout(timer);
    setRefreshBusy(false);
  }
}

function channelClass(channel) {
  const c = (channel || '').toLowerCase();
  if (c === 'wholesale') return 'channel-wholesale';
  if (c === 'retail') return 'channel-retail';
  if (c === 'custom') return 'channel-custom';
  return '';
}
function shopifyAdminUrl(shopifyId, orderType) {
  if (!shopifyId) return null;
  const path = orderType === 'Draft' ? 'draft_orders' : 'orders';
  return `https://squirrelvender.myshopify.com/admin/${path}/${shopifyId}`;
}

function renderSummaryStrip() {
  const now = allOrders.filter(o => !isClosedValue(o.status));
  const overdue = now.filter(o => { const d = daysFromToday(o.dueDate); return d !== null && d < 0; });
  const dueThisWeek = now.filter(o => { const d = daysFromToday(o.dueDate); return d !== null && d >= 0 && d <= 7; });
  const rush = now.filter(o => orderHasRush(o.id));
  const ready = now.filter(o => { const p = productionStatus(o.id); return p && p.cls === 'prod-ready'; });

  const strip = document.getElementById('summaryStrip');
  const parts = [];
  parts.push(`<span class="summary-item">${now.length} active order${now.length === 1 ? '' : 's'}</span>`);
  if (overdue.length) parts.push(`<span class="summary-item warn">${overdue.length} overdue</span>`);
  if (dueThisWeek.length) parts.push(`<span class="summary-item soon">${dueThisWeek.length} due this week</span>`);
  if (rush.length) parts.push(`<span class="summary-item warn">${rush.length} rush</span>`);
  // Everything boxed but still open — these are the ones waiting to be closed.
  if (ready.length) parts.push(`<span class="summary-item">${ready.length} all boxed, still open</span>`);
  strip.innerHTML = parts.join('');
}

function renderList() {
  renderSummaryStrip();

  const q = normalize(document.getElementById('searchBox').value);
  const sortMode = document.getElementById('sortSelect').value;

  // Asking for the Closed status explicitly beats the hide-closed toggle —
  // otherwise picking that chip would show an empty list.
  const wantsClosed = statusFilter !== 'ALL' && isClosedValue(statusFilter);
  let hiddenClosed = 0;

  let list = allOrders.filter(o => {
    if (statusFilter !== 'ALL' && o.status !== statusFilter) return false;
    if (channelFilter !== 'ALL' && o.channel !== channelFilter) return false;
    if (hideClosed && !wantsClosed && isClosedValue(o.status)) { hiddenClosed++; return false; }
    if (q) {
      const hay = normalize(o.customerName + ' ' + o.orderNumber + ' ' + o.shopifyId + ' ' +
        o.tracking + ' ' + o.carrier + ' ' + orderSkuText(o.id));
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    if (sortMode === 'due') {
      const ad = daysFromToday(a.dueDate), bd = daysFromToday(b.dueDate);
      return (ad === null ? Infinity : ad) - (bd === null ? Infinity : bd);
    }
    if (sortMode === 'orderdate') {
      const ad = a.orderDate ? Number(a.orderDate) : 0, bd = b.orderDate ? Number(b.orderDate) : 0;
      return bd - ad;
    }
    return a.customerName.localeCompare(b.customerName);
  });

  document.getElementById('resultCount').textContent =
    `${list.length} order${list.length === 1 ? '' : 's'}` +
    (hiddenClosed ? ` · ${hiddenClosed} closed hidden` : '');

  const box = document.getElementById('orderList');

  // If the currently selected order got filtered/searched out, pin it above
  // the regular results so context isn't lost while narrowing the list.
  const pinnedOrder = selectedId ? allOrders.find(o => o.id === selectedId) : null;
  const pinnedIsHidden = pinnedOrder && !list.some(o => o.id === selectedId);

  if (!list.length && !pinnedIsHidden) {
    box.innerHTML = `<div class="empty-state">No orders match.${hiddenClosed ? ' Closed orders are hidden — use the toggle above.' : ''}</div>`;
    return;
  }

  const cardHtml = (o) => {
    const dueDays = daysFromToday(o.dueDate);
    const dueSoon = dueDays !== null && dueDays <= 7;
    const overdue = dueDays !== null && dueDays < 0;
    const dueLabel = dueDays === null ? '' : dueDays < 0 ? `${Math.abs(dueDays)}d overdue` : dueDays === 0 ? 'due today' : `due in ${dueDays}d`;
    const prodStatus = productionStatus(o.id);
    const isRush = orderHasRush(o.id);
    const closed = isClosedValue(o.status);
    const borderClass = overdue && !closed ? 'overdue' : channelClass(o.channel);
    const shopifyUrl = shopifyAdminUrl(o.shopifyId, o.orderType);
    const busy = statusBusyId === o.id;

    const statusBtn = closed
      ? `<button class="status-action reopen" ${busy ? 'disabled' : ''} onclick="reopenOrder(${o.id})">${busy ? 'Saving…' : 'Reopen'}</button>`
      : `<button class="status-action" ${busy ? 'disabled' : ''} onclick="closeOrder(${o.id})"
           title="Set Status to ${esc(CLOSED_STATUS)} — production records are left alone">${busy ? 'Saving…' : 'Close order'}</button>`;

    return `
      <div class="order-card ${o.id === selectedId ? 'selected' : ''} ${borderClass} ${closed ? 'is-closed' : ''}" onclick="selectOrder(${o.id})">
        <div class="card-top">
          <span class="card-ordernum">${esc(o.orderNumber || '—')}</span>
          <span class="card-customer">${esc(o.customerName || '(no customer)')}</span>
          <div class="card-badges">
            ${isRush && !closed ? '<span class="badge rush">★ Rush</span>' : ''}
            ${o.orderType === 'Draft' ? '<span class="badge draft">Draft</span>' : ''}
            ${prodStatus && !closed ? `<span class="badge ${prodStatus.cls}">${esc(prodStatus.label)}</span>` : ''}
            ${o.status ? `<span class="badge status ${closed ? 'closed' : ''}">${esc(o.status)}</span>` : ''}
            ${o.paymentStatus ? `<span class="badge ${paymentBadgeClass(o.paymentStatus)}">${esc(o.paymentStatus)}</span>` : ''}
            ${o.fulfillment ? `<span class="badge ${fulfillmentBadgeClass(o.fulfillment)}">${esc(o.fulfillment)}</span>` : ''}
            ${o.channel ? `<span class="badge channel">${esc(o.channel)}</span>` : ''}
          </div>
        </div>
        <div class="card-meta-row">
          ${o.orderDate ? `<span>Ordered ${fmtDate(o.orderDate)}</span>` : ''}
          ${dueLabel && !closed ? `<span class="${dueSoon ? 'due-tag soon' : ''}">${esc(dueLabel)}</span>` : ''}
        </div>
        ${!closed ? pipelineHtml(o) : `<div class="pipe-txt"><span class="det-link" onclick="event.stopPropagation(); toggleDetails(${o.id})">${openDetails.has(o.id) ? 'Hide details ▴' : 'Details ▾'}</span></div>`}
        ${detailsHtml(o)}
        ${o.shopifyId ? `<div class="card-shopify">${shopifyUrl ? `<a class="shopify-link" href="${esc(shopifyUrl)}" target="_blank" onclick="event.stopPropagation()">Shopify #${esc(o.shopifyId)} ↗</a>` : `Shopify #${esc(o.shopifyId)}`}</div>` : ''}
        ${shipRowHtml(o)}
        ${editingNoteId === o.id
          ? `<div class="note-edit" onclick="event.stopPropagation()">
               <textarea class="note-textarea" id="noteInput-${o.id}">${esc(o.notes || '')}</textarea>
               <div class="note-edit-actions">
                 <button class="note-save-btn" onclick="saveNote(${o.id})">Save</button>
                 <button class="note-cancel-btn" onclick="cancelEditNote()">Cancel</button>
               </div>
             </div>`
          : `<div class="card-notes-row" onclick="event.stopPropagation()">
               ${o.notes ? `<span class="card-notes">${esc(o.notes)}</span>` : `<span class="no-note">No note</span>`}
               <span class="note-edit-link" onclick="startEditNote(${o.id})">${o.notes ? 'edit' : '+ add note'}</span>
               ${statusBtn}
             </div>`}
      </div>
    `;
  };

  let html = '';
  if (pinnedIsHidden) {
    html += `<div class="pinned-label">Currently selected (hidden by filter/search)</div>`;
    html += cardHtml(pinnedOrder);
    html += `<hr class="pinned-divider">`;
  }
  html += list.map(cardHtml).join('');
  box.innerHTML = html || `<div class="empty-state">No orders match.</div>`;
}

async function selectOrder(id) {
  selectedId = id;
  renderList();
  try {
    await grist.setCursorPos({ rowId: id });
  } catch (e) {
    console.error('Could not set cursor position:', e);
  }
}

grist.ready({ requiredAccess: 'full' });
loadOrders();
</script>
</body>
</html>
