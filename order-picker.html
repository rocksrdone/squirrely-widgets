<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Picker</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC;
  --accent: #8B3A2A; --accent-light: #F2E8E5; --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8; --done-bg: #EAF3DE; --done-text: #27500A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; padding: 14px; }
.top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
.controls { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 13px; }
.sort-select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 12px; background: white; color: var(--ink); }
.filter-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-chip { font-size: 11px; padding: 5px 10px; border-radius: 12px; border: 1px solid var(--rule); background: white; color: #6B5E52; cursor: pointer; }
.filter-chip.active { background: var(--ink); border-color: var(--ink); color: white; }
.result-count { font-size: 11px; color: #8B7D72; margin-bottom: 10px; }

.summary-strip { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.summary-item {
  font-size: 11px; padding: 6px 12px; border-radius: 6px; font-weight: 600;
  background: white; border: 1px solid var(--rule); color: #6B5E52;
}
.summary-item.warn { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
.summary-item.soon { background: var(--gold-light); border-color: var(--gold); color: var(--gold); }

.badge.rush { background: var(--accent); color: white; }
.badge.prod-ready { background: var(--done-bg); color: var(--done-text); }
.badge.prod-progress { background: var(--gold-light); color: var(--gold); }
.badge.prod-notstarted { background: var(--rule); color: #6B5E52; }

.order-list { display: flex; flex-direction: column; gap: 8px; }
.order-card {
  background: white; border: 1.5px solid var(--rule); border-radius: 8px; padding: 12px 14px;
  cursor: pointer; transition: border-color .12s;
}
.order-card:hover { border-color: var(--accent); }
.order-card.selected { border-color: var(--accent); background: var(--accent-light); }
.order-card.overdue { border-left: 4px solid var(--accent); }
.order-card.channel-wholesale { border-left: 4px solid var(--teal); }
.order-card.channel-retail { border-left: 4px solid var(--gold); }
.order-card.channel-custom { border-left: 4px solid var(--accent); }
/* A closed order is history, not work. It stays legible but stops competing
   for attention with the orders that still need making. */
.order-card.is-closed { background: #FBF9F6; border-style: dashed; }
.order-card.is-closed .card-ordernum,
.order-card.is-closed .card-customer { color: #6B5E52; }

.shopify-link { color: var(--teal); text-decoration: none; }
.shopify-link:hover { text-decoration: underline; }

.view-toggle-btn { font-size: 11px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--rule); background: white; color: var(--ink); cursor: pointer; }
.view-toggle-btn.active { background: var(--ink); border-color: var(--ink); color: white; }

.pinned-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 4px; }
.pinned-divider { border: none; border-top: 1px dashed var(--rule); margin: 10px 0; }

.order-list.dense .order-card { padding: 7px 12px; }
.order-list.dense .card-notes-row { display: none; }
.order-list.dense .card-shopify { display: none; }
.order-list.dense .card-meta-row { margin-top: 2px; }

.card-notes-row { display: flex; align-items: baseline; gap: 8px; margin-top: 6px; }
.card-notes { font-size: 11px; color: #8B7D72; font-style: italic; flex: 1; }
.no-note { font-size: 11px; color: #B8ABA0; font-style: italic; flex: 1; }
.note-edit-link { font-size: 10px; color: var(--teal); cursor: pointer; text-decoration: underline; white-space: nowrap; }
.note-edit { margin-top: 6px; }
.note-textarea {
  width: 100%; min-height: 44px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 5px;
  font-size: 11px; font-family: 'Inter', sans-serif; resize: vertical; outline: none;
}
.note-textarea:focus { border-color: var(--accent); }
.note-edit-actions { display: flex; gap: 6px; margin-top: 5px; }
.note-save-btn, .note-cancel-btn {
  font-size: 10px; padding: 4px 10px; border-radius: 4px; cursor: pointer; border: 1px solid var(--rule);
}
.note-save-btn { background: var(--teal); border-color: var(--teal); color: white; font-weight: 600; }
.note-cancel-btn { background: white; color: #6B5E52; }

/* Close / reopen. Deliberately small and text-like rather than a big primary
   button: closing an order is a bookkeeping act, not the point of this screen,
   and an eye-catching button beside every card invites mis-clicks. */
.status-action {
  font-size: 10px; padding: 4px 9px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--rule); background: white; color: #6B5E52; white-space: nowrap;
}
.status-action:hover { border-color: var(--ink); color: var(--ink); }
.status-action.reopen:hover { border-color: var(--teal); color: var(--teal); }
.status-action:disabled { opacity: .5; cursor: default; }

.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-ordernum { font-family: 'DM Mono', monospace; font-weight: 700; font-size: 14px; }
.card-customer { font-size: 14px; font-weight: 600; }
.card-badges { margin-left: auto; display: flex; gap: 5px; flex-wrap: wrap; }
.badge { font-size: 9px; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700; white-space: nowrap; }
.badge.status { background: var(--teal-light); color: var(--teal); }
.badge.status.closed { background: var(--rule); color: #6B5E52; }
.badge.pay-unpaid { background: var(--accent-light); color: var(--accent); }
.badge.pay-paid { background: var(--done-bg); color: var(--done-text); }
.badge.pay-other { background: var(--gold-light); color: var(--gold); }
.badge.channel { background: var(--warm); color: #6B5E52; }
.badge.draft { background: var(--gold-light); color: var(--gold); }
.card-meta-row { display: flex; gap: 14px; margin-top: 6px; flex-wrap: wrap; font-size: 11px; color: #8B7D72; }
.due-tag { font-weight: 700; padding: 1px 6px; border-radius: 8px; }
.due-tag.soon { background: var(--accent-light); color: var(--accent); }
.card-notes { font-size: 11px; color: #8B7D72; font-style: italic; margin-top: 6px; }
.card-shopify { font-family: 'DM Mono', monospace; font-size: 10px; color: #8B7D72; margin-top: 4px; }

.empty-state { color: #8B7D72; font-style: italic; padding: 30px; text-align: center; }
.choice-hint {
  margin-bottom: 12px; padding: 9px 12px; border-radius: 6px; font-size: 11.5px; line-height: 1.6;
  background: var(--gold-light); border: 1px solid #E4CF9E; color: #6E4C13;
}
.choice-hint strong { font-family: 'DM Mono', monospace; }
</style>
</head>
<body>

<div class="top-bar"><div class="title">Orders</div></div>

<div class="summary-strip" id="summaryStrip"></div>
<div id="choiceHint"></div>

<div class="controls">
  <input class="search-input" id="searchBox" placeholder="Search customer, order #, Shopify ID..." oninput="renderList()">
  <select class="sort-select" id="sortSelect" onchange="renderList()">
    <option value="due">Sort: Due date (soonest)</option>
    <option value="orderdate">Sort: Order date (newest)</option>
    <option value="customer">Sort: Customer A–Z</option>
  </select>
  <button class="view-toggle-btn active" id="closedToggle" onclick="toggleClosed()">Hiding closed</button>
  <button class="view-toggle-btn" id="denseToggle" onclick="toggleDense()">Compact view</button>
</div>

<div class="filter-row" id="statusFilters"></div>
<div class="filter-row" id="channelFilters"></div>

<div class="result-count" id="resultCount"></div>
<div id="orderList" class="order-list"></div>

<script>
function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
/* For a value going into a JS string inside an HTML attribute, e.g.
   onclick="setStatusFilter(...)". JSON.stringify quotes and escapes it for JS,
   esc() then makes it safe as attribute text. A status value containing an
   apostrophe used to break the chip's onclick outright. */
function jsAttr(v) { return esc(JSON.stringify(v == null ? '' : String(v))); }

/* Accent folding — KEEP BYTE-IDENTICAL ACROSS WIDGETS.
   normalize() strips anything outside a-z0-9, which DELETES accented letters
   rather than folding them: "Pathétique" became "pathtique" while the file
   "Pathetique.jpg" became "pathetique", so the two never matched and the widget
   reported nothing found. NFD splits a letter from its diacritic so the
   diacritic can be dropped and the base letter kept; the map handles the
   characters that have no decomposition (ß, ø, æ and friends).
   Display is untouched — this only ever builds comparison keys. */
const ACCENT_FOLD_MAP = { 'æ':'ae','Æ':'ae','œ':'oe','Œ':'oe','ø':'o','Ø':'o',
  'ß':'ss','đ':'d','Đ':'d','ð':'d','Ð':'d','ł':'l','Ł':'l','þ':'th','Þ':'th' };
function foldAccents(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[æÆœŒøØßđĐðÐłŁþÞ]/g, c => ACCENT_FOLD_MAP[c] || c);
}

function normalize(s) { return foldAccents((s || '').toString()).toLowerCase().trim(); }
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function daysFromToday(dateVal) {
  if (!dateVal) return null;
  const ms = typeof dateVal === 'number' ? dateVal * 1000 : new Date(dateVal).getTime();
  if (!ms || isNaN(ms)) return null;
  return Math.round(ms / 86400000 - Date.now() / 86400000);
}
function fmtDate(dateVal) {
  if (!dateVal) return '';
  const ms = typeof dateVal === 'number' ? dateVal * 1000 : new Date(dateVal).getTime();
  if (!ms || isNaN(ms)) return '';
  return new Date(ms).toISOString().slice(0, 10);
}

/* ---------- closing an order ----------
   "Closed" is not an arbitrary label. Two places already test for this exact
   word, so anything else leaves the order looking finished in one view and
   still active in another:
     - renderSummaryStrip() below counts active orders as status !== 'closed'
     - order-overview.html lists active orders as Status === 'Active' || blank
   A blank status therefore also means OPEN everywhere, which is why an order
   never leaves a list until this field is written.
   Kept as a constant so there is one place to change if the vocabulary ever
   moves — and if it moves, order-overview has to move with it.            */
const CLOSED_STATUS = 'Closed';
function isClosedValue(s) { return (s || '').toString().trim().toLowerCase() === 'closed'; }

let allOrders = [];
let orderLineData = {}; // workOrderId -> {needed, dyed, wound, packed, hasRush, skus: []}
let statusFilter = 'ALL';
let channelFilter = 'ALL';
let selectedId = null;
let denseMode = false;
let editingNoteId = null;
let hideClosed = true;      // closed orders are history; off the list by default
let statusBusyId = null;    // guards against a double-click writing twice
let sawClosedOnLoad = false; // was 'Closed' already a value in the column?
let choiceHintShown = false;
let statusColName = 'Status';

function toggleDense() {
  denseMode = !denseMode;
  document.getElementById('denseToggle').classList.toggle('active', denseMode);
  document.getElementById('orderList').classList.toggle('dense', denseMode);
}
function toggleClosed() {
  hideClosed = !hideClosed;
  const b = document.getElementById('closedToggle');
  b.classList.toggle('active', hideClosed);
  b.textContent = hideClosed ? 'Hiding closed' : 'Showing closed';
  renderList();
}

async function loadOrders() {
  try {
    const [table, linesTable] = await Promise.all([
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Work_Order_Lines'),
    ]);
    const c = (cands) => findColumn(table, cands);
    const custCol = c(['Customer_Name']) || 'Customer_Name';
    const orderDateCol = c(['Order_Date']);
    const dueCol = c(['Due_Date']);
    const statusCol = c(['Status']);
    const shopifyCol = c(['Shopify_Order_ID']);
    const payCol = c(['Payment_Status']);
    const channelCol = c(['Channel']);
    const numCol = c(['Order_Number']) || 'Order_Number';
    const typeCol = c(['Order_Type']);
    const notesCol = c(['Notes']);

    // Write to the resolved column id, never the literal — a renamed Status
    // column would otherwise make every close silently fail.
    statusColName = statusCol || null;

    allOrders = (table.id || []).map((id, i) => ({
      id,
      customerName: columnAsArray(table, custCol)[i] || '',
      orderDate: orderDateCol ? columnAsArray(table, orderDateCol)[i] : null,
      dueDate: dueCol ? columnAsArray(table, dueCol)[i] : null,
      status: statusCol ? (columnAsArray(table, statusCol)[i] || '') : '',
      shopifyId: shopifyCol ? columnAsArray(table, shopifyCol)[i] : '',
      paymentStatus: payCol ? (columnAsArray(table, payCol)[i] || '') : '',
      channel: channelCol ? (columnAsArray(table, channelCol)[i] || '') : '',
      orderNumber: columnAsArray(table, numCol)[i] || '',
      orderType: typeCol ? (columnAsArray(table, typeCol)[i] || '') : '',
      notes: notesCol ? (columnAsArray(table, notesCol)[i] || '') : '',
    }));

    sawClosedOnLoad = allOrders.some(o => isClosedValue(o.status));

    // Per-order production summary from Work_Order_Lines
    // "Packed" now comes from Lot_Allocations: a line can be filled from several
    // lots, so the per-line Qty_Packed can't say which bag the spools came from.
    // Winding, labelling and boxing are one physical act here, so any allocation
    // past "in bin" counts as boxed. Legacy Qty_Packed is still honoured
    // (whichever is higher) until that column is deleted.
    const allocBoxedByLine = {};
    try {
      const allocTable = await grist.docApi.fetchTable('Lot_Allocations');
      const aLineCol = findColumn(allocTable, ['Work_Order_Line']);
      const aQtyCol = findColumn(allocTable, ['Qty_Spools']);
      const aStatusCol = findColumn(allocTable, ['Status']);
      if (aLineCol && aQtyCol) {
        (allocTable.id || []).forEach((id, i) => {
          const lineId = getRefId(columnAsArray(allocTable, aLineCol)[i]);
          if (!lineId) return;
          const status = (aStatusCol ? columnAsArray(allocTable, aStatusCol)[i] : '') || '';
          if (/unwound|in bin/i.test(status.toString())) return;
          allocBoxedByLine[lineId] = (allocBoxedByLine[lineId] || 0) + (Number(columnAsArray(allocTable, aQtyCol)[i]) || 0);
        });
      }
    } catch (e) {
      console.warn('Lot_Allocations unavailable — falling back to Qty_Packed', e);
    }

    const lc = (cands) => findColumn(linesTable, cands);
    const lWoCol = lc(['Work_Order']) || 'Work_Order';
    const lNeededCol = lc(['Qty_Needed']);
    const lDyedCol = lc(['Qty_Dyed']);
    const lPackedCol = lc(['Qty_Packed']);
    const lPriorityCol = lc(['Production_Priority']);
    const lSkuCol = lc(['SKU']);

    orderLineData = {};
    (linesTable.id || []).forEach((id, i) => {
      const woId = getRefId(columnAsArray(linesTable, lWoCol)[i]);
      if (!woId) return;
      if (!orderLineData[woId]) orderLineData[woId] = { needed: 0, dyed: 0, packed: 0, hasRush: false, skus: [], lines: 0, unlinked: 0 };
      const d = orderLineData[woId];
      const needed = lNeededCol ? Number(columnAsArray(linesTable, lNeededCol)[i]) || 0 : 0;
      d.needed += needed;
      d.lines += 1;
      d.dyed += Math.min(lDyedCol ? Number(columnAsArray(linesTable, lDyedCol)[i]) || 0 : 0, needed || Infinity);
      const legacyPacked = lPackedCol ? Number(columnAsArray(linesTable, lPackedCol)[i]) || 0 : 0;
      const boxed = Math.max(allocBoxedByLine[id] || 0, legacyPacked);
      d.packed += Math.min(boxed, needed || Infinity);
      if (lPriorityCol && columnAsArray(linesTable, lPriorityCol)[i] === 'Rush') d.hasRush = true;
      const sku = lSkuCol ? columnAsArray(linesTable, lSkuCol)[i] : '';
      if (sku) d.skus.push(sku);
      // A line with no SKU is usually a custom or limited-edition item made to
      // order. It is called out in the close confirmation because it can never
      // be matched by the Shopify sync, so it will not close itself.
      else d.unlinked += 1;
    });

    renderFilters();
    renderList();
  } catch (e) {
    console.error('Failed to load orders:', e);
    document.getElementById('orderList').innerHTML = `<div class="empty-state">Failed to load Work_Orders — check widget access.</div>`;
  }
}

function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}

function renderFilters() {
  const statuses = [...new Set(allOrders.map(o => o.status).filter(Boolean))];
  const statusBox = document.getElementById('statusFilters');
  statusBox.innerHTML = ['ALL', ...statuses].map(s => `
    <button class="filter-chip ${statusFilter === s ? 'active' : ''}" onclick="setStatusFilter(${jsAttr(s)})">${s === 'ALL' ? 'All Statuses' : esc(s)}</button>
  `).join('');

  const channels = [...new Set(allOrders.map(o => o.channel).filter(Boolean))];
  const channelBox = document.getElementById('channelFilters');
  channelBox.innerHTML = ['ALL', ...channels].map(c => `
    <button class="filter-chip ${channelFilter === c ? 'active' : ''}" onclick="setChannelFilter(${jsAttr(c)})">${c === 'ALL' ? 'All Channels' : esc(c)}</button>
  `).join('');
}
function setStatusFilter(s) { statusFilter = s; renderFilters(); renderList(); }
function setChannelFilter(c) { channelFilter = c; renderFilters(); renderList(); }

function paymentBadgeClass(status) {
  const s = (status || '').toLowerCase();
  if (s === 'unpaid') return 'pay-unpaid';
  if (s.includes('paid') || s === 'invoiced') return 'pay-paid';
  return 'pay-other';
}

function productionStatus(orderId) {
  const d = orderLineData[orderId];
  if (!d || !d.needed) return null;
  if (d.packed >= d.needed) return { cls: 'prod-ready', label: 'Ready to ship' };
  if (d.dyed === 0) return { cls: 'prod-notstarted', label: 'Not started' };
  return { cls: 'prod-progress', label: 'In progress' };
}
function orderHasRush(orderId) {
  const d = orderLineData[orderId];
  return !!(d && d.hasRush);
}
function orderSkuText(orderId) {
  const d = orderLineData[orderId];
  return d ? d.skus.join(' ') : '';
}

function startEditNote(id) {
  editingNoteId = id;
  renderList();
  setTimeout(() => {
    const el = document.getElementById(`noteInput-${id}`);
    if (el) el.focus();
  }, 0);
}
function cancelEditNote() {
  editingNoteId = null;
  renderList();
}
async function saveNote(id) {
  const el = document.getElementById(`noteInput-${id}`);
  const value = el ? el.value : '';
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', 'Work_Orders', id, { Notes: value }]]);
    const o = allOrders.find(o => o.id === id);
    if (o) o.notes = value;
    editingNoteId = null;
    renderList();
  } catch (e) {
    console.error('Failed to save note:', e);
    alert('Could not save note — check the console.');
  }
}

/* What is still outstanding on an order, in words, for the close confirmation.
   Returns '' when there is nothing to warn about. */
function outstandingText(id) {
  const d = orderLineData[id];
  if (!d || !d.lines) return 'this order has no line items at all';
  if (!d.needed) return 'no quantities are set on its lines';
  const parts = [];
  if (d.packed < d.needed) parts.push(`${d.needed - d.packed} of ${d.needed} spools are not recorded as boxed`);
  if (d.unlinked) parts.push(`${d.unlinked} line${d.unlinked === 1 ? '' : 's'} with no SKU`);
  return parts.join(', ');
}

/* One write, one field. Closing is deliberately dumb: it does not touch
   quantities, allocations, lots or Shopify. Nothing downstream is reversed by
   reopening, which is what makes reopening safe. */
async function setOrderStatus(id, value) {
  if (!statusColName) {
    alert('Work_Orders has no Status column — nothing to write to.');
    return false;
  }
  const o = allOrders.find(x => x.id === id);
  if (!o) return false;
  const previous = o.status;
  statusBusyId = id;
  renderList();
  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', 'Work_Orders', id, { [statusColName]: value }],
    ]);
    o.status = value;
    statusBusyId = null;
    renderFilters();   // a brand-new status value needs its own filter chip
    renderList();
    maybeShowChoiceHint(value);
    return true;
  } catch (e) {
    console.error('Failed to set order status:', e);
    o.status = previous;
    statusBusyId = null;
    renderList();
    alert('Could not change the status — this widget needs Full document access. Nothing was changed.');
    return false;
  }
}

/* If "Closed" was not already in the column, and Status is a Choice column,
   Grist stores the value but flags it as an invalid choice until it is added
   to the column's option list. Say so once rather than leaving a mystery
   red cell. */
function maybeShowChoiceHint(value) {
  if (choiceHintShown || sawClosedOnLoad || !isClosedValue(value)) return;
  choiceHintShown = true;
  document.getElementById('choiceHint').innerHTML =
    `<div class="choice-hint">Saved. This is the first time <strong>${esc(CLOSED_STATUS)}</strong> has been used in this document —
     if <strong>Status</strong> is a Choice column, the cell will show as an invalid choice until you add
     <strong>${esc(CLOSED_STATUS)}</strong> to that column's options in the creator panel. The value itself is stored either way.</div>`;
}

async function closeOrder(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  const out = outstandingText(id);
  const who = [o.orderNumber, o.customerName].filter(Boolean).join(' — ') || 'this order';
  let msg = `Close ${who}?\n\nStatus becomes "${CLOSED_STATUS}", which takes it off the active list here and in Order Overview.`;
  if (out) {
    msg += `\n\nStill outstanding: ${out}.\n\n` +
      `That is fine for a custom or limited-edition item you made by hand and never allocated — ` +
      `closing only changes the status. Production records are left exactly as they are.`;
  }
  msg += `\n\nYou can reopen it from the same card.`;
  if (!confirm(msg)) return;
  await setOrderStatus(id, CLOSED_STATUS);
}

async function reopenOrder(id) {
  const o = allOrders.find(x => x.id === id);
  if (!o) return;
  const who = [o.orderNumber, o.customerName].filter(Boolean).join(' — ') || 'this order';
  if (!confirm(`Reopen ${who}?\n\nStatus goes back to "Active" and it returns to the active list.`)) return;
  await setOrderStatus(id, 'Active');
}

function channelClass(channel) {
  const c = (channel || '').toLowerCase();
  if (c === 'wholesale') return 'channel-wholesale';
  if (c === 'retail') return 'channel-retail';
  if (c === 'custom') return 'channel-custom';
  return '';
}
function shopifyAdminUrl(shopifyId, orderType) {
  if (!shopifyId) return null;
  const path = orderType === 'Draft' ? 'draft_orders' : 'orders';
  return `https://squirrelvender.myshopify.com/admin/${path}/${shopifyId}`;
}

function renderSummaryStrip() {
  const now = allOrders.filter(o => !isClosedValue(o.status));
  const overdue = now.filter(o => { const d = daysFromToday(o.dueDate); return d !== null && d < 0; });
  const dueThisWeek = now.filter(o => { const d = daysFromToday(o.dueDate); return d !== null && d >= 0 && d <= 7; });
  const rush = now.filter(o => orderHasRush(o.id));
  const ready = now.filter(o => { const p = productionStatus(o.id); return p && p.cls === 'prod-ready'; });

  const strip = document.getElementById('summaryStrip');
  const parts = [];
  parts.push(`<span class="summary-item">${now.length} active order${now.length === 1 ? '' : 's'}</span>`);
  if (overdue.length) parts.push(`<span class="summary-item warn">${overdue.length} overdue</span>`);
  if (dueThisWeek.length) parts.push(`<span class="summary-item soon">${dueThisWeek.length} due this week</span>`);
  if (rush.length) parts.push(`<span class="summary-item warn">${rush.length} rush</span>`);
  // Everything boxed but still open — these are the ones waiting to be closed.
  if (ready.length) parts.push(`<span class="summary-item">${ready.length} all boxed, still open</span>`);
  strip.innerHTML = parts.join('');
}

function renderList() {
  renderSummaryStrip();

  const q = normalize(document.getElementById('searchBox').value);
  const sortMode = document.getElementById('sortSelect').value;

  // Asking for the Closed status explicitly beats the hide-closed toggle —
  // otherwise picking that chip would show an empty list.
  const wantsClosed = statusFilter !== 'ALL' && isClosedValue(statusFilter);
  let hiddenClosed = 0;

  let list = allOrders.filter(o => {
    if (statusFilter !== 'ALL' && o.status !== statusFilter) return false;
    if (channelFilter !== 'ALL' && o.channel !== channelFilter) return false;
    if (hideClosed && !wantsClosed && isClosedValue(o.status)) { hiddenClosed++; return false; }
    if (q) {
      const hay = normalize(o.customerName + ' ' + o.orderNumber + ' ' + o.shopifyId + ' ' + orderSkuText(o.id));
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  list.sort((a, b) => {
    if (sortMode === 'due') {
      const ad = daysFromToday(a.dueDate), bd = daysFromToday(b.dueDate);
      return (ad === null ? Infinity : ad) - (bd === null ? Infinity : bd);
    }
    if (sortMode === 'orderdate') {
      const ad = a.orderDate ? Number(a.orderDate) : 0, bd = b.orderDate ? Number(b.orderDate) : 0;
      return bd - ad;
    }
    return a.customerName.localeCompare(b.customerName);
  });

  document.getElementById('resultCount').textContent =
    `${list.length} order${list.length === 1 ? '' : 's'}` +
    (hiddenClosed ? ` · ${hiddenClosed} closed hidden` : '');

  const box = document.getElementById('orderList');

  // If the currently selected order got filtered/searched out, pin it above
  // the regular results so context isn't lost while narrowing the list.
  const pinnedOrder = selectedId ? allOrders.find(o => o.id === selectedId) : null;
  const pinnedIsHidden = pinnedOrder && !list.some(o => o.id === selectedId);

  if (!list.length && !pinnedIsHidden) {
    box.innerHTML = `<div class="empty-state">No orders match.${hiddenClosed ? ' Closed orders are hidden — use the toggle above.' : ''}</div>`;
    return;
  }

  const cardHtml = (o) => {
    const dueDays = daysFromToday(o.dueDate);
    const dueSoon = dueDays !== null && dueDays <= 7;
    const overdue = dueDays !== null && dueDays < 0;
    const dueLabel = dueDays === null ? '' : dueDays < 0 ? `${Math.abs(dueDays)}d overdue` : dueDays === 0 ? 'due today' : `due in ${dueDays}d`;
    const prodStatus = productionStatus(o.id);
    const isRush = orderHasRush(o.id);
    const closed = isClosedValue(o.status);
    const borderClass = overdue && !closed ? 'overdue' : channelClass(o.channel);
    const shopifyUrl = shopifyAdminUrl(o.shopifyId, o.orderType);
    const busy = statusBusyId === o.id;

    const statusBtn = closed
      ? `<button class="status-action reopen" ${busy ? 'disabled' : ''} onclick="reopenOrder(${o.id})">${busy ? 'Saving…' : 'Reopen'}</button>`
      : `<button class="status-action" ${busy ? 'disabled' : ''} onclick="closeOrder(${o.id})"
           title="Set Status to ${esc(CLOSED_STATUS)} — production records are left alone">${busy ? 'Saving…' : 'Close order'}</button>`;

    return `
      <div class="order-card ${o.id === selectedId ? 'selected' : ''} ${borderClass} ${closed ? 'is-closed' : ''}" onclick="selectOrder(${o.id})">
        <div class="card-top">
          <span class="card-ordernum">${esc(o.orderNumber || '—')}</span>
          <span class="card-customer">${esc(o.customerName || '(no customer)')}</span>
          <div class="card-badges">
            ${isRush && !closed ? '<span class="badge rush">★ Rush</span>' : ''}
            ${o.orderType === 'Draft' ? '<span class="badge draft">Draft</span>' : ''}
            ${prodStatus && !closed ? `<span class="badge ${prodStatus.cls}">${esc(prodStatus.label)}</span>` : ''}
            ${o.status ? `<span class="badge status ${closed ? 'closed' : ''}">${esc(o.status)}</span>` : ''}
            ${o.paymentStatus ? `<span class="badge ${paymentBadgeClass(o.paymentStatus)}">${esc(o.paymentStatus)}</span>` : ''}
            ${o.channel ? `<span class="badge channel">${esc(o.channel)}</span>` : ''}
          </div>
        </div>
        <div class="card-meta-row">
          ${o.orderDate ? `<span>Ordered ${fmtDate(o.orderDate)}</span>` : ''}
          ${dueLabel && !closed ? `<span class="${dueSoon ? 'due-tag soon' : ''}">${esc(dueLabel)}</span>` : ''}
        </div>
        ${o.shopifyId ? `<div class="card-shopify">${shopifyUrl ? `<a class="shopify-link" href="${esc(shopifyUrl)}" target="_blank" onclick="event.stopPropagation()">Shopify #${esc(o.shopifyId)} ↗</a>` : `Shopify #${esc(o.shopifyId)}`}</div>` : ''}
        ${editingNoteId === o.id
          ? `<div class="note-edit" onclick="event.stopPropagation()">
               <textarea class="note-textarea" id="noteInput-${o.id}">${esc(o.notes || '')}</textarea>
               <div class="note-edit-actions">
                 <button class="note-save-btn" onclick="saveNote(${o.id})">Save</button>
                 <button class="note-cancel-btn" onclick="cancelEditNote()">Cancel</button>
               </div>
             </div>`
          : `<div class="card-notes-row" onclick="event.stopPropagation()">
               ${o.notes ? `<span class="card-notes">${esc(o.notes)}</span>` : `<span class="no-note">No note</span>`}
               <span class="note-edit-link" onclick="startEditNote(${o.id})">${o.notes ? 'edit' : '+ add note'}</span>
               ${statusBtn}
             </div>`}
      </div>
    `;
  };

  let html = '';
  if (pinnedIsHidden) {
    html += `<div class="pinned-label">Currently selected (hidden by filter/search)</div>`;
    html += cardHtml(pinnedOrder);
    html += `<hr class="pinned-divider">`;
  }
  html += list.map(cardHtml).join('');
  box.innerHTML = html || `<div class="empty-state">No orders match.</div>`;
}

async function selectOrder(id) {
  selectedId = id;
  renderList();
  try {
    await grist.setCursorPos({ rowId: id });
  } catch (e) {
    console.error('Could not set cursor position:', e);
  }
}

grist.ready({ requiredAccess: 'full' });
loadOrders();
</script>
</body>
</html>
