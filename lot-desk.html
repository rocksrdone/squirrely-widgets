<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Desk</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="stock-ops.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600;700&display=swap');
:root {
  --ink: #1A1614; --paper: #F7F3EE; --warm: #E8DFD4; --rule: #D4C9BC; --muted: #8B7D72;
  --accent: #8B3A2A; --accent-light: #F2E8E5; --teal: #3A8B7A; --teal-light: #E5F2EF;
  --gold: #B07D2A; --gold-light: #F5EDD8; --purple: #5B4A8B; --purple-light: #EEE8F7;
  color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.45; padding: 14px; }
.title { font-family: 'Libre Baskerville', serif; font-size: 20px; }
.sub { font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
.cols { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.side { width: 300px; flex-shrink: 0; }
.main { flex: 1; min-width: 340px; }
.search { width: 100%; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; font: inherit; font-size: 12.5px; background: white; color: var(--ink); margin-bottom: 8px; }
.count { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.lot { background: white; border: 1.5px solid var(--rule); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
.lot:hover { border-color: var(--teal); }
.lot.sel { border-color: var(--accent); background: var(--accent-light); }
.lot .nm { font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: baseline; }
.lot .nm .n { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; }
.lot .mt { font-size: 10.5px; color: var(--muted); font-family: 'DM Mono', monospace; }
.lot.old { border-left: 4px solid var(--gold); }
.fib { font-size: 9.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); background: var(--warm); color: #6B5E52; }
.fib.FFN { background: #E7EEFA; color: #2F5FA8; border-color: #A9C2E8; }
.fib.EN  { background: #F2E9F9; color: #7A3FA8; border-color: #CEB2E4; }
.fib.FFC { background: #FAE8F1; color: #A8366F; border-color: #E6B3CC; }
.panel { background: white; border: 1.5px solid var(--rule); border-radius: 8px; padding: 14px; }
.panel h2 { font-family: 'Libre Baskerville', serif; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.panel .meta { font-size: 11px; color: var(--muted); margin: 2px 0 12px; font-family: 'DM Mono', monospace; }
.big { display: inline-block; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 4px 10px; margin-bottom: 12px; }
.big b { font-family: 'DM Mono', monospace; font-size: 20px; }
.big span { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-left: 6px; }
h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid var(--warm); border-radius: 6px; margin-bottom: 5px; flex-wrap: wrap; }
.row.on { border-color: #9ACFC7; background: var(--teal-light); }
.row .who { flex: 1 1 160px; min-width: 0; }
.row .who b { font-size: 12.5px; }
.row .who div { font-size: 10.5px; color: var(--muted); }
.row .bin { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--purple); background: var(--purple-light); padding: 1px 6px; border-radius: 4px; }
input.q { width: 64px; padding: 6px; border: 1.5px solid var(--rule); border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 15px; text-align: center; background: white; color: var(--ink); }
input.q:focus { outline: none; border-color: var(--teal); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
.seg button { border: none; background: white; color: var(--muted); font: inherit; font-size: 11px; padding: 6px 10px; cursor: pointer; }
.seg button.on { background: var(--ink); color: white; }
.lab { font-size: 11px; color: var(--muted); }
select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 6px; font: inherit; font-size: 12px; background: white; color: var(--ink); }
.none { font-size: 11.5px; color: var(--muted); font-style: italic; padding: 4px 0; }
.sum { margin-top: 14px; padding: 10px 12px; border-radius: 7px; font-size: 13px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sum.ok { background: var(--teal-light); color: var(--teal); }
.sum.short { background: var(--gold-light); color: #6E4C13; }
.sum.over { background: var(--purple-light); color: var(--purple); }
.sum.bad { background: var(--accent-light); color: var(--accent); }
.sum label { font-weight: 500; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.btn { font: inherit; font-size: 12px; font-weight: 600; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--teal); background: var(--teal); color: white; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: white; color: var(--ink); border-color: var(--rule); font-weight: 500; }
.btn.small { font-size: 11px; padding: 5px 10px; }
.actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
.log { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 8px; }
.log div { font-size: 11.5px; padding: 3px 0; display: flex; gap: 8px; border-bottom: 1px solid var(--warm); }
.log a { margin-left: auto; color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 10.5px; }
.empty { color: var(--muted); font-style: italic; padding: 24px; text-align: center; }
.banner { background: var(--accent-light); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; padding: 8px 11px; font-size: 11.5px; margin-bottom: 12px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99; }
.toast.show { opacity: 1; }
.lot.prob { border-color: var(--accent); border-left: 4px solid var(--accent); background: #FDF7F5; }
.lot.prob.sel { background: var(--accent-light); }
.pnote { background: var(--paper); border-left: 3px solid var(--rule); padding: 6px 10px; font-size: 12.5px; margin: 0 0 10px; font-style: italic; }
.step { border: 1px solid var(--warm); border-radius: 7px; padding: 10px 12px; margin-bottom: 8px; }
.step .hd { font-weight: 600; font-size: 12.5px; margin-bottom: 6px; display: flex; gap: 8px; align-items: baseline; }
.step .hd .k { font-family: 'DM Mono', monospace; color: var(--muted); font-weight: 500; }
.step.done { border-color: #9ACFC7; background: var(--teal-light); }
.counts { font-family: 'DM Mono', monospace; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="title">Lot Desk</div>
  <button class="btn small" id="logPot" style="margin-left:auto">+ Log a pot</button>
  <button class="btn ghost small" id="extraPots" title="Pots logged today with + Log a pot — for labelling their bags">⬇ Today's extra pots</button></div>
<div class="sub">Put away what came off the kettle — into customer bins or back stock, in one step.</div>
<div id="banner"></div>
<div class="cols">
  <div class="side">
    <input class="search" id="search" placeholder="Search colourway or lot…">
    <div class="count" id="count"></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
  <div class="main" id="main"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ── Lot Desk ──────────────────────────────────────────────────────────────
   Replaces the wet/dry rack step. A lot is simply "waiting" from the kettle
   until it is put away; drying is not recorded. Put-away splits the lot
   between open orders (counted against them at once) and back stock, and
   saves in one go — every rule lives in stock-ops.js. */
const { esc, num } = StockOps;
const S = { model: null, sel: null, plan: null, search: '', log: [], busy: false, prob: null, fixed: {}, fix: null, fixDone: null, delAsk: false };
const OLD_DAYS = 14;

function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); }
function age(d) { return d ? Math.floor((Date.now() / 1000 - d) / 86400) : null; }
function fib(code, name) { return code ? `<span class="fib ${esc(code)}">${esc(code)}</span>` : (name ? `<span class="fib">${esc(name)}</span>` : ''); }

async function load(keepSel) {
  try {
    S.model = await StockOps.load(grist.docApi);
  } catch (e) {
    console.error(e);
    document.getElementById('list').innerHTML = `<div class="empty">Could not load — ${esc(e.message || e)}</div>`;
    return;
  }
  document.getElementById('banner').innerHTML = S.model.missing.length
    ? `<div class="banner">Missing columns: <b>${esc(S.model.missing.join(', '))}</b>. Put-away is off until they exist.</div>` : '';
  if (S.prob && !S.model.problems.some(p => p.id === S.prob)) S.prob = null;
  if (S.fix && !S.model.lots.some(l => l.id === S.fix)) { S.fix = null; S.fixDone = null; }
  const still = keepSel && waiting().find(l => l.id === S.sel);
  if (!still) { S.sel = null; S.plan = null; }
  else S.plan = StockOps.defaultPlan(S.model, still);
  render();
}

function waiting() {
  return S.model.lots.filter(l => l.waiting > 0 && l.recipe.id)
    .sort((a, b) => (a.date || 0) - (b.date || 0) || a.id - b.id);
}

function renderList() {
  const q = S.search.trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const all = waiting();
  const rows = all.filter(l => !q || l.recipe.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().includes(q) || l.lotNumber.toLowerCase().includes(q));
  const spools = all.reduce((t, l) => t + l.waiting, 0);
  document.getElementById('count').textContent = `${all.length} lot${all.length === 1 ? '' : 's'} waiting · ${spools} spools`;
  const probs = S.model.problems.slice().sort((a, b) => a.created - b.created);
  const probHtml = probs.length ? `<div class="count" style="color:var(--accent);font-weight:600">Problems to fix · ${probs.length}</div>` +
    probs.map(p => `<div class="lot prob ${p.id === S.prob ? 'sel' : ''}" data-prob="${p.id}">
      <div class="nm">${esc(p.text.split(':')[0] || p.type)}</div>
      <div class="mt">${esc(p.type)}${p.found != null ? ` · found ${p.found}${p.qty != null ? ` of ${p.qty}` : ''}` : ''}</div>
    </div>`).join('') + '<div style="height:10px"></div>' : '';
  document.getElementById('list').innerHTML = probHtml + (rows.length ? rows.map(l => {
    const d = age(l.date);
    return `<div class="lot ${l.id === S.sel ? 'sel' : ''} ${d != null && d > OLD_DAYS ? 'old' : ''}" data-lot="${l.id}">
      <div class="nm">${esc(l.recipe.name)} ${fib(l.fiber)}<span class="n">${l.waiting}</span></div>
      <div class="mt">${esc(l.lotNumber)}${d != null ? ` · ${d}d` : ''}${l.binCode ? ` · ${esc(l.binCode)}` : ''}${
        (S.model.linesByRecipe[l.recipe.id] || []).length ? ' · on order' : ''}</div>
    </div>`;
  }).join('') : `<div class="empty">${q ? 'Nothing waiting matches.' : 'Nothing waiting — all put away.'}</div>`);

  /* Lots leave the waiting list once put away, which looked like they had
     vanished. The last RECENT_DAYS days of put-away lots stay listed here —
     read-only — with where they went and whether the job was done. */
  const recent = recentlyPutAway().filter(l => !q || l.recipe.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().includes(q) || l.lotNumber.toLowerCase().includes(q));
  document.getElementById('list').innerHTML += recent.length ? `<div class="count" style="margin-top:14px">Recently put away${q ? '' : ` · last ${RECENT_DAYS} days`}</div>` +
    recent.map(l => {
      const parts = [];
      if (l.onHand) parts.push(`${l.onHand} wound`);
      if (l.hank) parts.push(`${l.hank} hank`);
      const where = [parts.length ? `${parts.join(' + ')}${l.binCode ? ' → ' + l.binCode : ''}` : '']
        .concat(l.allocs.map(a => `${a.qty} → ${a.bin || 'order'}`)).filter(Boolean).join(' · ');
      const j = l.jobs;
      const job = j.problem ? `<span style="color:var(--accent);font-weight:600">problem</span>`
        : j.open ? `<span style="color:var(--gold);font-weight:600">job to do</span>`
        : j.done ? `<span style="color:var(--teal)">done \u2713</span>` : '';
      return `<div class="lot done-lot ${l.id === S.fix ? 'sel' : ''}" data-fix="${l.id}" style="opacity:.9" title="Click to fix or delete this lot">
        <div class="nm">${esc(l.recipe.name)} ${fib(l.fiber)}<span class="n" style="font-size:12px;color:var(--teal)">put away</span></div>
        <div class="mt">${esc(l.lotNumber)}${l.date ? ' · ' + new Date(l.date * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''}${job ? ' · ' + job : ''}</div>
        <div class="mt" style="color:var(--ink)">${esc(where || 'nothing on record')}${l.vendor ? ` · ${l.vendor} on vendor` : ''}</div>
        ${l.recipe.sku ? `<button class="btn ghost small" data-vs="${l.id}" style="margin-top:5px">Vendor store \u2197</button>` : ''}
      </div>`;
    }).join('') : '';
  if (q) {
    const shown = new Set(all.map(l => l.id).concat(recent.map(l => l.id)));
    const older = S.model.lots.filter(l => !shown.has(l.id) && l.recipe.id && (l.onHand + l.hank + l.vendor) > 0
        && (l.recipe.name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().includes(q) || l.lotNumber.toLowerCase().includes(q)))
      .sort((a, b) => (b.date || 0) - (a.date || 0));
    if (older.length) document.getElementById('list').innerHTML += `<div class="count" style="margin-top:14px">Older stock</div>` +
      older.map(l => `<div class="lot ${l.id === S.fix ? 'sel' : ''}" data-fix="${l.id}" title="Click to fix or delete this lot">
        <div class="nm">${esc(l.recipe.name)} ${fib(l.fiber)}<span class="n" style="font-size:12px">${l.onHand + l.hank}</span></div>
        <div class="mt">${esc(l.lotNumber)}${l.date ? ' · ' + new Date(l.date * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''}${l.binCode ? ' · ' + esc(l.binCode) : ''}</div>
        <div class="mt" style="color:var(--ink)">${l.onHand} wound · ${l.hank} hank${l.vendor ? ` · ${l.vendor} on vendor` : ''}</div>
      </div>`).join('');
  }
  document.querySelectorAll('[data-lot]').forEach(el => el.addEventListener('click', () => pick(Number(el.dataset.lot))));
  document.querySelectorAll('[data-fix]').forEach(el => el.addEventListener('click', () => openFix(Number(el.dataset.fix))));
  document.querySelectorAll('[data-prob]').forEach(el => el.addEventListener('click', () => { S.prob = Number(el.dataset.prob); S.sel = null; S.plan = null; S.fix = null; render(); }));
  document.querySelectorAll('[data-vs]').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation();
    const l = S.model.lots.find(x => x.id === Number(el.dataset.vs));
    if (!l) return;
    // Grist's vendor total for this SKU across all its lots.
    const listed = S.model.lots.filter(x => x.recipe.id === l.recipe.id).reduce((t, x) => t + x.vendor, 0);
    StockOps.openVendorStock(l.recipe.sku, { target: listed, targetLabel: 'listed in Grist',
      title: `${l.recipe.name}${l.fiber ? ' ' + l.fiber : ''}`, onGrist: () => load(true) });
  }));
}

const RECENT_DAYS = 14;
function recentlyPutAway() {
  const since = Date.now() / 1000 - RECENT_DAYS * 86400;
  return S.model.lots.filter(l => l.recipe.id && l.waiting <= 0 && l.date >= since
      && (l.onHand + l.hank + l.alloc) > 0)
    .sort((a, b) => (b.date || 0) - (a.date || 0) || b.id - a.id);
}

function pick(id) {
  const lot = waiting().find(l => l.id === id);
  if (!lot) return;
  S.sel = id; S.prob = null; S.fix = null;
  S.plan = StockOps.defaultPlan(S.model, lot);
  render();
}

function lotSel() { return S.sel ? S.model.lots.find(l => l.id === S.sel) : null; }

function renderMain() {
  const box = document.getElementById('main');
  if (S.prob) return renderProblem(box);
  if (S.fix) return renderFix(box);
  const lot = lotSel();
  if (!lot || !S.plan) { box.innerHTML = `<div class="panel"><div class="empty">Pick a lot on the left.</div></div>`; return; }
  const p = S.plan;
  const lines = S.model.linesByRecipe[lot.recipe.id] || [];
  const orderRows = lines.length ? lines.map((ln, i) => {
    const o = p.orders[i];
    return `<div class="row ${num(o.qty) > 0 ? 'on' : ''}">
      <div class="who"><b>${esc(ln.order.number)}</b> ${esc(ln.order.customerName)}
        <div>needs ${ln.short}${ln.need !== ln.short ? ` of ${ln.need}` : ''}</div></div>
      ${ln.bin ? `<span class="bin" title="Customer bin">${esc(ln.bin)}</span>` : ''}
      <input class="q" type="number" min="0" data-ord="${i}" value="${num(o.qty) || ''}" placeholder="0">
      <span class="seg"><button data-form="${i}" data-v="hank" class="${o.form === 'hank' ? 'on' : ''}">Hank</button><button
        data-form="${i}" data-v="wound" class="${o.form === 'wound' ? 'on' : ''}">Wound</button></span>
    </div>`;
  }).join('') : `<div class="none">No open orders for ${esc(lot.recipe.name)}${lot.fiber ? ' ' + esc(lot.fiber) : ''}.</div>`;

  // Each bin shows how full it is, so a different pick is an informed one.
  const binOpts = S.model.bins.slice().sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }))
    .map(b => `<option value="${b.id}" ${b.id === p.binId ? 'selected' : ''}>${esc(b.code)} · ${
      StockOps.binFillFor(S.model, b.id, lot)}/${b.cap}${b.fiber ? ' ' + esc(b.fiber) : ''}${b.reserved ? ' · reserved' : ''}</option>`).join('');

  box.innerHTML = `<div class="panel">
    <h2>${esc(lot.recipe.name)} ${fib(lot.fiber, lot.recipe.fiberName)}</h2>
    <div class="meta">${esc(lot.lotNumber)}${lot.date ? ' · dyed ' + new Date(lot.date * 1000).toLocaleDateString() : ''}${lot.recipe.sku ? ' · ' + esc(lot.recipe.sku) : ''}</div>
    <div class="big"><b>${lot.waiting}</b><span>spools to put away</span></div>

    <h3>To orders</h3>
    ${orderRows}

    <h3>To back stock</h3>
    <div class="row">
      <span class="lab">Wound</span><input class="q" type="number" min="0" id="bw" value="${p.backWound || ''}" placeholder="0">
      <span class="lab">Hank</span><input class="q" type="number" min="0" id="bh" value="${p.backHank || ''}" placeholder="0">
      <span class="lab">Bin</span><select id="bin"><option value="">—</option>${binOpts}</select>
      <label class="lab" style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" id="lv" ${p.listVendor ? 'checked' : ''}> list on vendor store</label>
      ${p.binWhy ? `<div class="lab" id="binWhy" style="flex-basis:100%;${p.binTight ? 'color:var(--accent);font-weight:600' : ''}">Suggested: ${esc(p.binWhy)}</div>` : ''}
    </div>

    <div id="sum"></div>
    <div class="actions">
      <button class="btn" id="save">Put away</button>
      <button class="btn ghost small" id="reset">Reset</button>
      <button class="btn ghost small" id="fixThis" style="margin-left:auto">Fix or delete this lot</button>
    </div>
    ${S.log.length ? `<div class="log">${S.log.map((e, i) => `<div><span>${esc(e.text)}</span><a data-undo="${i}">undo</a></div>`).join('')}</div>` : ''}
  </div>`;

  box.querySelectorAll('[data-ord]').forEach(el => el.addEventListener('input', () => { p.orders[Number(el.dataset.ord)].qty = el.value; el.closest('.row').classList.toggle('on', num(el.value) > 0); renderSum(); }));
  box.querySelectorAll('[data-form]').forEach(el => el.addEventListener('click', () => { p.orders[Number(el.dataset.form)].form = el.dataset.v; renderMain(); }));
  document.getElementById('bw').addEventListener('input', e => { p.backWound = e.target.value; renderSum(); });
  document.getElementById('bh').addEventListener('input', e => { p.backHank = e.target.value; renderSum(); });
  document.getElementById('bin').addEventListener('change', e => {
    p.binId = Number(e.target.value) || null;
    const w = document.getElementById('binWhy'); if (w) w.textContent = 'Chosen by you';
    renderSum();
  });
  document.getElementById('lv').addEventListener('change', e => { p.listVendor = e.target.checked; });
  document.getElementById('save').addEventListener('click', save);
  document.getElementById('reset').addEventListener('click', () => { S.plan = StockOps.defaultPlan(S.model, lot); renderMain(); });
  document.getElementById('fixThis').addEventListener('click', () => openFix(lot.id));
  box.querySelectorAll('[data-undo]').forEach(el => el.addEventListener('click', () => undo(Number(el.dataset.undo))));
  renderSum();
}

/* ── Fix or delete any lot ─────────────────────────────────────────────────
   For when Grist and the shelf disagree outside a job: set what's really
   there (wound / hank / listed on vendor), zero a lot that's gone, or delete
   a lot that was entered twice. Store numbers stay yours to set. */
function openFix(id) { S.fix = id; S.fixDone = null; S.delAsk = false; S.sel = null; S.plan = null; S.prob = null; render(); }

function renderFix(box) {
  const lot = S.model.lots.find(l => l.id === S.fix);
  if (!lot) { S.fix = null; return renderMain(); }
  const listed = S.model.lots.filter(l => l.recipe.id === lot.recipe.id).reduce((t, l) => t + l.vendor, 0);
  const jobs = S.model.taskRows.filter(t => t.lotId === lot.id).length;
  const done = S.fixDone;
  box.innerHTML = `<div class="panel">
    <h2>${esc(lot.recipe.name)} ${fib(lot.fiber, lot.recipe.fiberName)}</h2>
    <div class="meta">${esc(lot.lotNumber)}${lot.date ? ' · dyed ' + new Date(lot.date * 1000).toLocaleDateString() : ''}${lot.binCode ? ' · bin ' + esc(lot.binCode) : ''}${lot.recipe.sku ? ' · ' + esc(lot.recipe.sku) : ''}</div>
    <div class="counts">Grist now: ${lot.onHand} wound · ${lot.hank} hank · ${lot.vendor} listed on vendor${lot.store ? ` · ${lot.store} retail` : ''}${lot.alloc ? ` · ${lot.alloc} to orders` : ''}${lot.waiting > 0 ? ` · ${lot.waiting} waiting` : ''}${lot.broken ? ` · ${lot.broken} broken` : ''}</div>

    <div class="step ${done ? 'done' : ''}"><div class="hd"><span class="k">1</span>${done ? 'Fixed ✓' : "What's really on the shelf?"}</div>
      ${done ? `<div class="lab">${esc(done.text)}${done.capped ? ' — vendor capped at what is on the shelf' : ''} <a href="#" id="fundo" style="color:var(--accent);margin-left:6px">undo</a></div>` : `
      <div class="row" style="border:none;padding:0">
        <span class="lab">Wound</span><input class="q" type="number" min="0" id="fw" value="${lot.onHand}">
        <span class="lab">Hank</span><input class="q" type="number" min="0" id="fh" value="${lot.hank}">
        <span class="lab">Listed on vendor</span><input class="q" type="number" min="0" id="fv" value="${lot.vendor}">
      </div>
      <input class="search" id="fwhy" placeholder="Why? (optional — goes in the lot's notes)" style="margin:8px 0">
      <div class="actions" style="margin-top:0">
        <button class="btn small" id="fsave">Save</button>
        <button class="btn ghost small" id="fzero">None left — zero it</button>
      </div>
      <div class="lab" style="margin-top:6px">Fewer wound than Grist had are recorded as broken, so the lot doesn't come back as "waiting".</div>`}
    </div>

    ${lot.recipe.sku ? `<div class="step"><div class="hd"><span class="k">2</span>Vendor store</div>
      <div class="lab" style="margin-bottom:8px">Grist lists ${listed} ${esc(lot.recipe.name)} on the vendor store across all its lots.</div>
      <button class="btn ghost small" id="fvs">Vendor store ↗</button></div>` : ''}

    <div class="step"><div class="hd">Entered twice?</div>
      ${lot.allocs.length ? `<div class="lab">Can't delete — ${lot.alloc} spools of this lot are on orders. Zero it instead, or move the order spools first.</div>`
        : S.delAsk ? `<div class="lab" style="margin-bottom:8px;color:var(--accent);font-weight:600">Delete ${esc(lot.lotNumber)}${jobs ? ` and its ${jobs} job${jobs === 1 ? '' : 's'}` : ''}? Only do this if the lot never existed.</div>
          <button class="btn small" id="fdelyes" style="background:var(--accent);border-color:var(--accent)">Yes, delete it</button>
          <button class="btn ghost small" id="fdelno">No</button>`
        : `<button class="btn ghost small" id="fdel">Delete this lot</button>
          <span class="lab" style="margin-left:6px">removes the lot${jobs ? ` and its ${jobs} job${jobs === 1 ? '' : 's'}` : ''} — Ctrl+Z in Grist brings it back</span>`}
    </div>
    ${lot.notes ? `<div class="lab" style="white-space:pre-line;margin-top:6px">${esc(lot.notes)}</div>` : ''}
  </div>`;

  const apply = async (want) => {
    if (S.busy) return;
    const built = StockOps.lotSetActions(lot, want, (document.getElementById('fwhy') || {}).value || '');
    if (!built) { toast('Nothing changed'); return; }
    S.busy = true;
    try {
      await grist.docApi.applyUserActions(built.acts);
      S.fixDone = built;
      S.log.unshift({ text: `${lot.recipe.name} ${lot.lotNumber}: ${built.text}`, undo: built.undo });
      toast('Lot fixed ✓');
      await load();
    } catch (e) { console.error(e); toast('Could not save — nothing was changed'); }
    finally { S.busy = false; }
  };
  const $ = (id) => document.getElementById(id);
  if ($('fsave')) $('fsave').addEventListener('click', () => apply({ wound: $('fw').value, hank: $('fh').value, vendor: $('fv').value }));
  if ($('fzero')) $('fzero').addEventListener('click', () => apply({ wound: 0, hank: 0, vendor: 0 }));
  if ($('fundo')) $('fundo').addEventListener('click', async (e) => {
    e.preventDefault();
    try { await grist.docApi.applyUserActions(done.undo); S.fixDone = null; toast('Undone'); await load(); }
    catch (err) { console.error(err); toast('Undo failed'); }
  });
  if ($('fvs')) $('fvs').addEventListener('click', () => StockOps.openVendorStock(lot.recipe.sku, { target: listed, targetLabel: 'listed in Grist',
    title: `${lot.recipe.name}${lot.fiber ? ' ' + lot.fiber : ''}`, onGrist: () => load() }));
  if ($('fdel')) $('fdel').addEventListener('click', () => { S.delAsk = true; renderMain(); });
  if ($('fdelno')) $('fdelno').addEventListener('click', () => { S.delAsk = false; renderMain(); });
  if ($('fdelyes')) $('fdelyes').addEventListener('click', async () => {
    const d = StockOps.lotDeleteActions(S.model, lot);
    if (d.error) { toast(d.error); return; }
    S.busy = true;
    try {
      await grist.docApi.applyUserActions(d.acts);
      toast(`${lot.lotNumber} deleted`);
      S.fix = null; S.delAsk = false;
      await load();
    } catch (e) { console.error(e); toast('Could not delete'); }
    finally { S.busy = false; }
  });
}

/* ── Fixing a job a worker flagged ────────────────────────────────────────
   1 correct the lot in Grist (put-away count off), 2 bring the store in line,
   3 mark it resolved. Store numbers are always yours to set — nothing is sent
   to Shopify without the Set click in the vendor store pop-up. */
function renderProblem(box) {
  const p = S.model.problems.find(x => x.id === S.prob);
  if (!p) { S.prob = null; return renderMain(); }
  const lot = p.lotId ? S.model.lots.find(l => l.id === p.lotId) : null;
  const recipeId = (lot && lot.recipe.id) || p.recipeId;
  const recipe = S.model.recipes[recipeId] || (lot && lot.recipe) || null;
  const sku = p.sku || (recipe && recipe.sku) || '';
  const d = p.found != null && p.qty != null ? p.found - p.qty : 0;
  const toOrder = /^O-/i.test(p.bin) || /→ order/i.test(p.text);
  const fixed = S.fixed[p.id];
  const wound = /wound/i.test(p.form);
  const formWord = wound ? 'wound' : 'hank';
  const listed = recipeId ? S.model.lots.filter(l => l.recipe.id === recipeId).reduce((t, l) => t + l.vendor, 0) : null;

  let step1 = '';
  if (p.type === 'Put away' && lot && d) {
    if (fixed) {
      step1 = `<div class="step done"><div class="hd"><span class="k">1</span>Grist fixed ✓</div>
        <div class="lab">${esc(fixed.lot)}: ${esc(fixed.text)} <a href="#" id="pundo" style="color:var(--accent);margin-left:6px">undo</a></div></div>`;
    } else if (d < 0 && toOrder) {
      step1 = `<div class="step"><div class="hd"><span class="k">1</span>The order is ${-d} short</div>
        <div class="lab">This went to an order, so the order needs ${-d} more. Fix the order's count by hand (or dye more), then resolve.</div></div>`;
    } else {
      const listDefault = d > 0 && lot.vendor > 0;
      step1 = `<div class="step"><div class="hd"><span class="k">1</span>Correct ${esc(lot.lotNumber)} in Grist</div>
        <div class="counts">now: ${lot.onHand} wound · ${lot.hank} hank · ${lot.vendor} listed on vendor</div>
        <div class="lab" style="margin-bottom:8px">${d > 0
          ? `${d} more ${formWord} than Grist has → add ${d} ${formWord}.`
          : `${-d} fewer ${formWord} than Grist has → take ${-d} ${formWord} off${lot.vendor ? '; the vendor listing drops only if it would list more than is there' : ''}.`}</div>
        ${d > 0 ? `<label class="lab" style="display:flex;gap:5px;align-items:center;margin-bottom:8px"><input type="checkbox" id="plist" ${listDefault ? 'checked' : ''}> list the ${d} extra on the vendor store</label>` : ''}
        <button class="btn small" id="pfix">Fix Grist</button></div>`;
    }
  } else if (p.type === 'Retail store') {
    step1 = `<div class="step"><div class="hd"><span class="k">1</span>Retail store</div>
      <div class="lab">Check the spools and set the regular store's count in Shopify by hand.</div></div>`;
  }

  const step2 = sku ? `<div class="step"><div class="hd"><span class="k">${step1 ? 2 : 1}</span>Vendor store</div>
      <div class="lab" style="margin-bottom:8px">Grist lists ${listed != null ? listed : '?'} on the vendor store. Check what the store shows and set it to match — or set what's really there and let it fix Grist.</div>
      <button class="btn ghost small" id="pvs">Vendor store ↗</button></div>` : '';
  const n3 = 1 + (step1 ? 1 : 0) + (step2 ? 1 : 0);

  box.innerHTML = `<div class="panel">
    <h2>${esc(p.text.split(':')[0] || p.type)}</h2>
    <div class="meta">${esc(p.type)} job${p.created ? ' · ' + new Date(p.created * 1000).toLocaleDateString() : ''}${p.bin ? ' · bin ' + esc(p.bin) : ''}</div>
    <div class="lab" style="margin-bottom:8px">${esc(p.text.includes(':') ? p.text.slice(p.text.indexOf(':') + 1).trim() : p.text)}</div>
    ${p.found != null ? `<div class="big"><b>${p.found}</b><span>found${p.qty != null ? ` · job said ${p.qty}${p.form ? ' ' + esc(p.form.toLowerCase()) : ''}` : ''}</span></div>` : ''}
    ${p.note ? `<div class="pnote">“${esc(p.note)}”</div>` : ''}
    ${step1}${step2}
    <div class="step"><div class="hd"><span class="k">${n3}</span>Done?</div>
      <button class="btn small" id="pres">Mark resolved</button>
      <span class="lab" style="margin-left:6px">takes it off the dashboard and the Jobs list</span></div>
  </div>`;

  const fx = document.getElementById('pfix');
  if (fx) fx.addEventListener('click', async () => {
    if (S.busy) return;
    S.busy = true; fx.disabled = true;
    try {
      const lv = document.getElementById('plist');
      const r = await StockOps.lotCountFix(grist.docApi, lot.id, p.form, d, !!(lv && lv.checked));
      if (!r.ok) { toast(r.error); fx.disabled = false; return; }
      S.fixed[p.id] = r;
      toast('Grist fixed ✓');
      await load();
    } catch (e) { console.error(e); toast('Could not save — nothing was changed'); fx.disabled = false; }
    finally { S.busy = false; }
  });
  const un = document.getElementById('pundo');
  if (un) un.addEventListener('click', async (e) => {
    e.preventDefault();
    try { await grist.docApi.applyUserActions(fixed.undo); delete S.fixed[p.id]; toast('Undone'); await load(); }
    catch (err) { console.error(err); toast('Undo failed'); }
  });
  const vs = document.getElementById('pvs');
  if (vs) vs.addEventListener('click', () => StockOps.openVendorStock(sku, { target: listed, targetLabel: 'listed in Grist',
    title: recipe ? `${recipe.name}${recipe.fiber ? ' ' + recipe.fiber : ''}` : sku, onGrist: () => load() }));
  document.getElementById('pres').addEventListener('click', async () => {
    const T = S.model.cols.T;
    if (!T || S.busy) return;
    S.busy = true;
    try {
      const f = { [T.status]: 'Resolved' };
      if (T.doneAt) f[T.doneAt] = Math.floor(Date.now() / 1000);
      await grist.docApi.applyUserActions([['UpdateRecord', 'Worker_Tasks', p.id, f]]);
      delete S.fixed[p.id]; S.prob = null;
      toast('Resolved ✓');
      await load();
    } catch (e) { console.error(e); toast('Could not save'); }
    finally { S.busy = false; }
  });
}

function renderSum() {
  const lot = lotSel(); const el = document.getElementById('sum');
  if (!lot || !el) return;
  const b = StockOps.putAwayActions(S.model, lot, S.plan);
  let cls = 'ok', html = `${b.total} of ${lot.waiting} ✓`;
  if (b.problems.length) { cls = 'bad'; html = esc(b.problems[0]); }
  else if (b.diff < 0) {
    cls = 'short';
    html = `${b.total} of ${lot.waiting} — the other ${-b.diff}:
      <label><input type="radio" name="sm" value="later" ${S.plan.shortMeans !== 'final' ? 'checked' : ''}> still to come</label>
      <label><input type="radio" name="sm" value="final" ${S.plan.shortMeans === 'final' ? 'checked' : ''}> that's all there was</label>`;
  } else if (b.diff > 0) {
    cls = 'over'; html = `${b.total} of ${lot.waiting} — ${b.diff} more than dyed; the lot is corrected to match`;
  }
  el.className = 'sum ' + cls; el.innerHTML = html;
  el.querySelectorAll('input[name=sm]').forEach(r => r.addEventListener('change', () => { S.plan.shortMeans = r.value; }));
  const sv = document.getElementById('save');
  if (sv) sv.disabled = !!b.problems.length || S.busy || S.model.missing.length > 0;
}

async function save() {
  const lot = lotSel();
  if (!lot || S.busy) return;
  const b = StockOps.putAwayActions(S.model, lot, S.plan);
  if (b.problems.length) { toast(b.problems[0]); return; }
  S.busy = true; renderSum();
  try {
    const undoActs = await StockOps.applyPutAway(grist.docApi, b);
    const parts = [];
    if (b.ordered) parts.push(`${b.ordered} to orders`);
    if (b.bw) parts.push(`${b.bw} wound`);
    if (b.bh) parts.push(`${b.bh} hank`);
    S.log.unshift({ text: `${lot.recipe.name} ${lot.lotNumber}: ${parts.join(', ')}`, undo: undoActs });
    toast('Put away ✓');
    await load(b.stillWaiting > 0);
  } catch (e) {
    console.error('Put-away failed', e);
    toast('Could not save — nothing was changed');
  } finally { S.busy = false; renderSum(); }
}

async function undo(i) {
  const e = S.log[i];
  if (!e) return;
  try {
    await grist.docApi.applyUserActions(e.undo);
    S.log.splice(i, 1);
    toast('Undone');
    await load(true);
  } catch (err) { console.error(err); toast('Undo failed'); }
}

function render() { renderList(); renderMain(); }

document.getElementById('logPot').addEventListener('click', () =>
  StockOps.openLogPot(grist.docApi, async (r, recipe) => {
    toast(`Logged ${r.lotNumber} — ${r.spools} ${recipe.name}`);
    await load();
    if (r.lotId) pick(r.lotId);
  }));
document.getElementById('extraPots').addEventListener('click', async () => {
  try {
    const n = await StockOps.printExtraPots(grist.docApi, new Date());
    toast(n ? `${n} extra pot${n === 1 ? '' : 's'} — PDF downloaded` : 'No pots logged with + Log a pot today');
  } catch (e) { console.error(e); toast('Could not make the PDF'); }
});
document.getElementById('search').addEventListener('input', e => { S.search = e.target.value; renderList(); });
try { grist.ready({ requiredAccess: 'full' }); load(); }
catch (e) { document.getElementById('list').innerHTML = `<div class="empty">Grist plugin API unavailable</div>`; }
</script>
