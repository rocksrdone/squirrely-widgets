<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --ink: #3A3028; --rule: #DDD3C7; --paper: #FDFBF7;
    --teal: #2A6B6B; --teal-light: #E4F0EF;
    --g-none: #EDE7DE; --g-none-t: #7A6E60;
    --g-make: #FBE3D4; --g-make-t: #8B4A2A;
    --g-dry: #F5EFD4; --g-dry-t: #7A6A1A;
    --g-wind: #E0ECF7; --g-wind-t: #2A5B8B;
    --g-done: #E0F0E0; --g-done-t: #2D6A2D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #8B7D72; margin-bottom: 8px; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .search-input { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 13px; }
  .filter-select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 12px; background: white; color: var(--ink); color-scheme: light; }

  .summary { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip {
    font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 10px; cursor: pointer;
    border: 1px solid transparent;
  }
  .chip.active { border-color: var(--ink); }
  .chip-none { background: var(--g-none); color: var(--g-none-t); }
  .chip-make { background: var(--g-make); color: var(--g-make-t); }
  .chip-dry { background: var(--g-dry); color: var(--g-dry-t); }
  .chip-wind { background: var(--g-wind); color: var(--g-wind-t); }
  .chip-done { background: var(--g-done); color: var(--g-done-t); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: #8B7D72;
    text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper);
  }
  tbody td { padding: 6px; border-bottom: 1px solid #F0EAE1; font-size: 12px; vertical-align: top; }
  .col-name { font-weight: 600; }
  .fiber-tag { font-size: 9px; font-weight: 700; color: var(--teal); background: var(--teal-light); padding: 1px 5px; border-radius: 8px; vertical-align: middle; }
  .col-sub { font-size: 10px; color: #8B7D72; }
  .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .stage {
    font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 9px; white-space: nowrap; display: inline-block;
  }
  .s-none { background: var(--g-none); color: var(--g-none-t); }
  .s-make { background: var(--g-make); color: var(--g-make-t); }
  .s-dry { background: var(--g-dry); color: var(--g-dry-t); }
  .s-wind { background: var(--g-wind); color: var(--g-wind-t); }
  .s-done { background: var(--g-done); color: var(--g-done-t); }
  .past { color: #A01830; font-weight: 700; }
  .bump-dot { color: #8B6A00; }

  .empty-state { text-align: center; color: #8B7D72; padding: 24px 12px; font-size: 12px; line-height: 1.6; }
  .group-head { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--teal); padding: 10px 6px 3px; }
</style>
</head>
<body>
<div id="content"><div class="empty-state">Loading...</div></div>

<script>
function getRefId(ref) {
  if (ref == null) return null;
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1] || null;
  if (typeof ref === 'object' && ref.rowId) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
function esc(s) { return (s == null ? '' : String(s)).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function dueValue(d) { const n = Number(d); return isFinite(n) && n > 0 ? n : Infinity; }
function fmtDate(v) { if (!v) return ''; const ms = typeof v === 'number' ? v * 1000 : new Date(v).getTime(); return (!ms || isNaN(ms)) ? '' : new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
function todayEpochSeconds() { const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000; }
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${tableName}.${cands[0]}`);
  }
  return out;
}
const FIBER_NAME_TO_CODE = { 'FF Nylon': 'FFN', 'E Nylon': 'EN', 'FF Cotton': 'FFC', 'Blackwing': 'BW' };
function fiberCode(v) {
  const s = (v || '').toString().trim();
  if (!s) return '';
  if (FIBER_NAME_TO_CODE[s]) return FIBER_NAME_TO_CODE[s];
  const up = s.toUpperCase();
  return ['FFN', 'FFC', 'EN', 'BW'].includes(up) ? up : s;
}
function yardsPerSpool(fiber) { return fiberCode(fiber) === 'EN' ? 150 : 100; }

const STAGES = {
  none: { label: 'Not started', cls: 's-none', chip: 'chip-none' },
  make: { label: 'To make', cls: 's-make', chip: 'chip-make' },
  dry:  { label: 'Drying', cls: 's-dry', chip: 'chip-dry' },
  wind: { label: 'Ready to wind', cls: 's-wind', chip: 'chip-wind' },
  done: { label: 'Wound & boxed', cls: 's-done', chip: 'chip-done' },
};
const STAGE_ORDER = ['make', 'wind', 'dry', 'none', 'done'];

let S = { lines: [], search: '', stageFilter: '', dyesByRecipe: {}, sort: 'urgency' };

async function loadAll() {
  try {
    const [lotsT, recipesT, allocT, wolT, woT, compT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Lot_Allocations'),
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Recipe_Dye_Components'),
    ]);
    const missing = [];
    const opt = cands => ({ cands, required: false });
    const LOT = resolveCols(lotsT, 'Production_Lots', {
      recipe: ['Recipe'], spoolsMade: opt(['Spools_Made']), yardsMade: opt(['Total_Yards_Made']),
      drying: opt(['Drying_Status']), fiber: opt(['Fiber']),
      store: opt(['Store_Stock_Spools']), vendor: opt(['Vendor_Stock_Spools']),
      general: opt(['General_Stock_Spools']), broken: opt(['Broken_Spools']),
    }, missing);
    const REC = resolveCols(recipesT, 'Recipes', {
      name: ['Recipe_Name'], fiber: opt(['Fiber_Type']), sku: opt(['SKU_Base']), method: opt(['Dye_Method']),
    }, missing);
    const ALLOC = resolveCols(allocT, 'Lot_Allocations', {
      lot: ['Lot'], qty: ['Qty_Spools'], status: opt(['Status']), line: opt(['Work_Order_Line']),
    }, missing);
    const WOL = resolveCols(wolT, 'Work_Order_Lines', {
      workOrder: ['Work_Order'], qtyNeeded: ['Qty_Needed'], recipe: opt(['Recipe']), sku: opt(['SKU']),
    }, missing);
    const WO = resolveCols(woT, 'Work_Orders', {
      status: ['Status'], orderNumber: opt(['Order_Number']), customerName: opt(['Customer_Name']),
      dueDate: opt(['Due_Date']), bump: opt(['Priority_Bump']),
    }, missing);
    const COMP = resolveCols(compT, 'Recipe_Dye_Components', { recipe: ['Recipe'], dye: ['Dye_Name'] }, missing);
    if (missing.length) {
      document.getElementById('content').innerHTML =
        `<div class="empty-state">Can't load — missing columns:<br><br><strong>${[...new Set(missing)].join('<br>')}</strong></div>`;
      return;
    }

    const recipeById = {}, recipeIdBySku = {};
    (recipesT.id || []).forEach((id, i) => {
      const r = {
        name: columnAsArray(recipesT, REC.name)[i] || `Recipe #${id}`,
        fiber: columnAsArray(recipesT, REC.fiber)[i] || '',
        sku: normalize(columnAsArray(recipesT, REC.sku)[i] || ''),
        method: columnAsArray(recipesT, REC.method)[i] || '',
      };
      recipeById[id] = r;
      if (r.sku) recipeIdBySku[r.sku] = id;
    });

    // dye names per recipe (for dye search)
    const dyeNameById = {}; // not needed — components store Ref to Dyes; we resolve name via Dyes if present
    // Build recipe -> dye display via component ref ids mapped through Recipes? Components link to Dyes.
    // Simpler: many widgets store dye name directly; try both.
    const dyesByRecipe = {};
    (compT.id || []).forEach((id, i) => {
      const rid = getRefId(columnAsArray(compT, COMP.recipe)[i]);
      const raw = columnAsArray(compT, COMP.dye)[i];
      const name = (typeof raw === 'string') ? raw : (getRefId(raw) ? `#${getRefId(raw)}` : '');
      if (rid && name) (dyesByRecipe[rid] = dyesByRecipe[rid] || []).push(name);
    });
    S.dyesByRecipe = dyesByRecipe;

    // Allocations by line, and dry-rack availability by recipe
    const allocByLine = {};
    (allocT.id || []).forEach((id, i) => {
      const lineId = ALLOC.line ? getRefId(columnAsArray(allocT, ALLOC.line)[i]) : null;
      if (lineId) allocByLine[lineId] = (allocByLine[lineId] || 0) + (Number(columnAsArray(allocT, ALLOC.qty)[i]) || 0);
    });
    const allocByLot = {};
    (allocT.id || []).forEach((id, i) => {
      const lotId = getRefId(columnAsArray(allocT, ALLOC.lot)[i]);
      if (lotId) allocByLot[lotId] = (allocByLot[lotId] || 0) + (Number(columnAsArray(allocT, ALLOC.qty)[i]) || 0);
    });

    const DRY = /dry rack|wood rack|overnight|ready to assign/i;
    const WET = /wet rack|metal rack|day rack/i;
    const dryByRecipe = {}, wetByRecipe = {};
    (lotsT.id || []).forEach((id, i) => {
      const rid = getRefId(columnAsArray(lotsT, LOT.recipe)[i]);
      if (!rid) return;
      const recipe = recipeById[rid] || { fiber: '' };
      let total = Number(columnAsArray(lotsT, LOT.spoolsMade)[i]) || 0;
      if (!total && LOT.yardsMade) total = Math.round((Number(columnAsArray(lotsT, LOT.yardsMade)[i]) || 0) / yardsPerSpool(recipe.fiber));
      const stock = (Number(columnAsArray(lotsT, LOT.store)[i]) || 0) + (Number(columnAsArray(lotsT, LOT.vendor)[i]) || 0) + (LOT.general ? Number(columnAsArray(lotsT, LOT.general)[i]) || 0 : 0);
      const broken = LOT.broken ? Number(columnAsArray(lotsT, LOT.broken)[i]) || 0 : 0;
      const free = Math.max(0, total - (allocByLot[id] || 0) - stock - broken);
      if (free <= 0) return;
      const status = (columnAsArray(lotsT, LOT.drying)[i] || '').toString();
      const isDry = DRY.test(status) || (!WET.test(status) && !!status);
      if (isDry) dryByRecipe[rid] = (dryByRecipe[rid] || 0) + free;
      else wetByRecipe[rid] = (wetByRecipe[rid] || 0) + free;
    });
    // stock counts as available-to-wind too
    (lotsT.id || []).forEach((id, i) => {
      const rid = getRefId(columnAsArray(lotsT, LOT.recipe)[i]);
      if (!rid) return;
      const stock = (Number(columnAsArray(lotsT, LOT.store)[i]) || 0) + (Number(columnAsArray(lotsT, LOT.vendor)[i]) || 0) + (LOT.general ? Number(columnAsArray(lotsT, LOT.general)[i]) || 0 : 0);
      if (stock > 0) dryByRecipe[rid] = (dryByRecipe[rid] || 0) + stock;
    });

    // Work orders
    const woInfo = {};
    (woT.id || []).forEach((id, i) => {
      woInfo[id] = {
        active: (columnAsArray(woT, WO.status)[i] || '').toString() === 'Active',
        orderNumber: columnAsArray(woT, WO.orderNumber)[i],
        customerName: columnAsArray(woT, WO.customerName)[i] || '',
        dueDate: WO.dueDate ? columnAsArray(woT, WO.dueDate)[i] : null,
        bump: WO.bump ? !!columnAsArray(woT, WO.bump)[i] : false,
      };
    });

    // Working pools we draw down as we assign stage per line
    const dryPool = { ...dryByRecipe };
    const wetPool = { ...wetByRecipe };
    const today = todayEpochSeconds();

    const lines = [];
    (wolT.id || []).forEach((id, i) => {
      const woId = getRefId(columnAsArray(wolT, WOL.workOrder)[i]);
      const info = woInfo[woId];
      if (!info || !info.active) return;
      const sku = normalize(columnAsArray(wolT, WOL.sku)[i] || '');
      const rid = getRefId(columnAsArray(wolT, WOL.recipe)[i]) || recipeIdBySku[sku] || null;
      const recipe = (rid && recipeById[rid]) || { name: sku || 'Unknown', fiber: '', method: '' };
      const needed = Number(columnAsArray(wolT, WOL.qtyNeeded)[i]) || 0;
      const boxed = allocByLine[id] || 0;
      const outstanding = Math.max(0, needed - boxed);

      let stage;
      if (outstanding <= 0 && needed > 0) stage = 'done';
      else {
        // draw from dry pool, then wet pool, for THIS line's colorway
        const dryAvail = dryPool[rid] || 0;
        const takeDry = Math.min(outstanding, dryAvail);
        dryPool[rid] = dryAvail - takeDry;
        let rem = outstanding - takeDry;
        const wetAvail = wetPool[rid] || 0;
        const takeWet = Math.min(rem, wetAvail);
        wetPool[rid] = wetAvail - takeWet;
        rem -= takeWet;
        if (takeDry >= outstanding) stage = 'wind';       // enough dry-rack/stock to finish
        else if (takeDry + takeWet >= outstanding) stage = 'dry'; // some still drying
        else if (boxed > 0 || takeDry > 0 || takeWet > 0) stage = 'make'; // partially there
        else stage = 'none';                              // nothing made
      }

      lines.push({
        lineId: id, recipeId: rid, recipeName: recipe.name, method: recipe.method,
        fiber: fiberCode(recipe.fiber),
        customerName: info.customerName, orderNumber: info.orderNumber,
        dueDate: info.dueDate, bump: info.bump,
        pastDue: info.dueDate && dueValue(info.dueDate) < today,
        needed, boxed, outstanding, stage,
      });
    });

    S.lines = lines;
    render();
  } catch (e) {
    console.error('Failed to load overview:', e);
    const msg = (e && e.message ? e.message : String(e)).replace(/[<>]/g, '');
    document.getElementById('content').innerHTML = `<div class="empty-state">Failed to load.<br><span style="font-size:10px">${msg}</span></div>`;
  }
}

function onSearch(v) { S.search = v; renderTable(); }
function setStage(st) { S.stageFilter = S.stageFilter === st ? '' : st; render(); }
function setSort(mode) { S.sort = mode; render(); }

function sortLines(arr) {
  const byName = (a, b) => a.recipeName.localeCompare(b.recipeName) || (dueValue(a.dueDate) - dueValue(b.dueDate));
  const byUrgency = (a, b) => (b.pastDue - a.pastDue) || (b.bump - a.bump) || (dueValue(a.dueDate) - dueValue(b.dueDate)) || a.recipeName.localeCompare(b.recipeName);
  return arr.slice().sort(S.sort === 'alpha' ? byName : byUrgency);
}

function filtered() {
  const q = normalize(S.search);
  const rows = S.lines.filter(l => {
    if (S.stageFilter && l.stage !== S.stageFilter) return false;
    if (!q) return true;
    const dyes = (S.dyesByRecipe[l.recipeId] || []).join(' ');
    return normalize(`${l.recipeName} ${l.customerName} ${l.orderNumber || ''} ${dyes}`).includes(q);
  });
  return sortLines(rows);
}

function rowHtml(l) {
  const st = STAGES[l.stage];
  const prog = l.needed ? `${l.boxed}/${l.needed}` : '—';
  const due = l.dueDate ? fmtDate(l.dueDate) : '—';
  return `
    <tr>
      <td>
        <div class="col-name">${esc(l.recipeName)}${l.fiber ? ` <span class="fiber-tag">${esc(l.fiber)}</span>` : ''}</div>
        <div class="col-sub">${esc(l.customerName || '—')}${l.orderNumber ? ' · ' + esc(l.orderNumber) : ''}</div>
      </td>
      <td class="num">${prog}</td>
      <td class="num ${l.pastDue ? 'past' : ''}">${l.bump ? '<span class="bump-dot">●</span> ' : ''}${due}</td>
      <td><span class="stage ${st.cls}">${st.label}</span></td>
    </tr>`;
}

function renderTable() {
  const el = document.getElementById('tableWrap');
  if (!el) return;
  const rows = filtered();
  if (!rows.length) {
    el.innerHTML = `<div class="empty-state">${S.search || S.stageFilter ? 'Nothing matches.' : 'No active order lines.'}</div>`;
    return;
  }
  el.innerHTML = `
    <table>
      <thead><tr><th>Colorway / order</th><th class="num">Boxed</th><th class="num">Due</th><th>Stage</th></tr></thead>
      <tbody>${rows.map(rowHtml).join('')}</tbody>
    </table>`;
}

function render() {
  const counts = { none: 0, make: 0, dry: 0, wind: 0, done: 0 };
  S.lines.forEach(l => { counts[l.stage] = (counts[l.stage] || 0) + 1; });
  const chips = STAGE_ORDER.map(st => `
    <span class="chip ${STAGES[st].chip} ${S.stageFilter === st ? 'active' : ''}" onclick="setStage('${st}')">${STAGES[st].label} ${counts[st] || 0}</span>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="header-title">Work Overview</div>
    <div class="header-sub">Every active order line and where it stands.</div>
    <div class="controls">
      <input class="search-input" id="searchBox" placeholder="Search colorway, customer, order, or dye..." value="${esc(S.search)}" oninput="onSearch(this.value)">
      <select class="filter-select" onchange="setSort(this.value)">
        <option value="urgency" ${S.sort === 'urgency' ? 'selected' : ''}>By urgency</option>
        <option value="alpha" ${S.sort === 'alpha' ? 'selected' : ''}>Alphabetical</option>
      </select>
    </div>
    <div class="summary">${chips}</div>
    <div id="tableWrap"></div>
  `;
  renderTable();
}

grist.ready({ requiredAccess: 'read table' });
loadAll();
</script>
</body>
</html>
