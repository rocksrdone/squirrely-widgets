<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dye Prep Sequence</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --ink: #1A1614;
    --paper: #F7F3EE;
    --warm: #E8DFD4;
    --rule: #D4C9BC;
    --accent: #8B3A2A;
    --accent-light: #F2E8E5;
    --teal: #3A8B7A;
    --teal-light: #E5F2EF;
    --gold: #B07D2A;
    --gold-light: #F5EDD8;
    --done-bg: #EAF3DE;
    --done-border: #639922;
    --done-text: #27500A;
    --urgent: #A01830;
    --urgent-light: #F5E0E4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 16px;
  }

  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .header-title { font-family: 'Libre Baskerville', serif; font-size: 20px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #8B7D72; }
  .refresh-btn {
    font-size: 11px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--rule); background: white; color: var(--ink); cursor: pointer;
  }

  .empty-state { text-align: center; color: var(--done-text); padding: 60px 20px; font-size: 14px; }

  .work-table { width: 100%; border-collapse: collapse; }
  .work-table thead th {
    text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: #8B7D72; padding: 6px 8px; border-bottom: 2px solid var(--rule);
    position: sticky; top: 0; background: var(--paper); z-index: 2;
  }
  .work-table td { padding: 7px 8px; border-bottom: 1px solid var(--warm); vertical-align: middle; font-size: 12px; }
  .dye-row { cursor: pointer; background: white; }
  .dye-row:hover { background: var(--warm); }
  .dye-row.urgent-expiry td:first-child { border-left: 3px solid var(--urgent); }
  .dye-row.urgent-priority td:first-child { border-left: 3px solid var(--gold); }
  .dye-row:not(.urgent-expiry):not(.urgent-priority) td:first-child { border-left: 3px solid transparent; }

  .dye-name { font-family: 'Libre Baskerville', serif; font-size: 13px; font-weight: 700; }
  .dye-brand { font-family: 'DM Mono', monospace; font-size: 10px; color: #8B7D72; }

  .expiry-flag {
    display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    padding: 1px 6px; border-radius: 3px; background: var(--urgent-light); color: var(--urgent); white-space: nowrap;
  }
  .stock-ok { color: var(--done-text); font-size: 11px; }
  .stock-none { color: #8B7D72; font-size: 11px; font-style: italic; }

  .mix-amount { font-family: 'DM Mono', monospace; font-weight: 700; font-size: 13px; }
  .mix-amount.zero { color: var(--done-text); font-weight: 500; }

  .orders-cell { text-align: right; font-size: 11px; color: var(--teal); font-weight: 600; white-space: nowrap; }

  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td { padding: 0; border-bottom: 1px solid var(--rule); }
  .detail-wrap { padding: 10px 14px; background: var(--warm); }

  .order-line {
    display: flex; justify-content: space-between; font-size: 11px; color: #6B5E52;
    padding: 4px 0; border-bottom: 1px solid var(--rule);
  }
  .order-line:last-child { border-bottom: none; }

  .log-stock-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); }
  .log-stock-row input {
    width: 90px; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 5px; font-size: 12px;
  }
  .log-stock-row button {
    font-size: 11px; padding: 6px 10px; border-radius: 5px; border: 1px solid var(--teal);
    background: var(--teal-light); color: var(--teal); cursor: pointer;
  }
  .log-stock-row button:hover { background: var(--teal); color: white; }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header-row">
  <div>
    <div class="header-title">Dye Prep Sequence</div>
    <div class="header-sub" id="headerSub">Loading...</div>
  </div>
  <button class="refresh-btn" onclick="loadEverything()">↻ Refresh</button>
</div>

<div id="content"></div>

<div class="toast" id="toast"></div>

<script>
function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const DYE_COLORS = {
  red:'#C8294A',rhodamine:'#D83060',pink:'#E84080',fuschia:'#D83060',fuchsia:'#D83060',
  blue:'#2060C8',aqua:'#20A0C8',teal:'#20A890',turquoise:'#20B2A0',
  green:'#40A840',yellow:'#E8D020',orange:'#E87020',purple:'#8040C8',
  black:'#2A2A2A',brown:'#8B5A2B',gold:'#C8A020',coral:'#E05040',
  mint:'#40C890',lavender:'#A080C8',navy:'#203080',forest:'#2A6040',
  grey:'#888780',gray:'#888780',white:'#F0EDE8',silver:'#A0A0A8',
  scarlet:'#C82020',crimson:'#A01830',magenta:'#C030A0',violet:'#6030C0',
  cerulean:'#2080C0',cobalt:'#2048A8',emerald:'#208050',sage:'#80A870',
  ecru:'#C8B890',cream:'#F0EAD0',caramel:'#C08040',russet:'#904030'
};
function guessColor(name) {
  if (!name) return '#888780';
  const l = name.toLowerCase();
  for (const [k, v] of Object.entries(DYE_COLORS)) if (l.includes(k)) return v;
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xFFFFFF;
  return '#' + ((h & 0xBFBFBF) | 0x404040).toString(16).padStart(6, '0');
}

const PRIORITY_RANK = { 'Urgent': 0, 'High': 1, 'Normal': 2, 'Low': 3 };
function priorityRank(p) { return PRIORITY_RANK[p] ?? 2; }

function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${esc(tableName)}.${cands[0]}`);
  }
  return out;
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }

let dyeGroups = [];
let STOCK_COLS = { dye: 'Dye', quantity: 'Quantity_mL', mixedDate: 'Mixed_Date', bin: 'Bin_Location' };

async function loadEverything() {
  document.getElementById('headerSub').textContent = 'Loading...';

  try {
    const [woTable, wolTable, recipesTable, compTable, dyesTable, stockTable] = await Promise.all([
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Recipe_Dye_Components'),
      grist.docApi.fetchTable('Dyes'),
      grist.docApi.fetchTable('Dye_Stock'),
    ]);

    // Coverage is derived, not stored. Qty_Dyed is no longer written (pot-logging
    // creates lots instead), so "remaining to make" = order need − spools already
    // allocated to the line − unwound spools sitting in that colorway's lots.
    // Without this, the mL totals below would tell you to mix dye for thread you've
    // already made.
    let allocByLine = {}, unwoundByRecipe = {};
    try {
      const [allocT, lotsT] = await Promise.all([
        grist.docApi.fetchTable('Lot_Allocations'),
        grist.docApi.fetchTable('Production_Lots'),
      ]);
      const aLine = findColumn(allocT, ['Work_Order_Line']);
      const aQty = findColumn(allocT, ['Qty_Spools']);
      const aLot = findColumn(allocT, ['Lot']);
      const byLot = {};
      (allocT.id || []).forEach((id, i) => {
        const q = Number(columnAsArray(allocT, aQty)[i]) || 0;
        const li = aLine ? getRefId(columnAsArray(allocT, aLine)[i]) : null;
        if (li) allocByLine[li] = (allocByLine[li] || 0) + q;
        const lo = aLot ? getRefId(columnAsArray(allocT, aLot)[i]) : null;
        if (lo) byLot[lo] = (byLot[lo] || 0) + q;
      });
      const lR = findColumn(lotsT, ['Recipe']);
      const lS = findColumn(lotsT, ['Spools_Made']);
      // Only spools that CANNOT fill an order reduce what's available: committed
      // to a shop, or broken. Back stock exists to fill orders, so it is coverage.
      const buckets = ['Store_Stock_Spools', 'Vendor_Stock_Spools', 'Broken_Spools']
        .map(c => findColumn(lotsT, [c]));
      const cBack = findColumn(lotsT, ['General_Stock_Spools']);
      (lotsT.id || []).forEach((id, i) => {
        const rid = lR ? getRefId(columnAsArray(lotsT, lR)[i]) : null;
        if (!rid) return;
        const back = cBack ? Number(columnAsArray(lotsT, cBack)[i]) || 0 : 0;
        let free = (lS ? Number(columnAsArray(lotsT, lS)[i]) || 0 : 0) - (byLot[id] || 0);
        buckets.forEach(c => { if (c) free -= Number(columnAsArray(lotsT, c)[i]) || 0; });
        // Sum SIGNED across a recipe's lots, clamp once at the end. Clamping per
        // lot silently discards over-allocated lots (allocated > Spools_Made),
        // leaving the surplus lots standing alone as thread that does not exist.
        unwoundByRecipe[rid] = (unwoundByRecipe[rid] || 0) + free;
      });
      Object.keys(unwoundByRecipe).forEach(k => { if (unwoundByRecipe[k] < 0) unwoundByRecipe[k] = 0; });
    } catch (e) {
      console.warn('Lots/allocations unavailable — dye amounts fall back to full order need', e);
    }
    // Working copy of bin stock, drawn down per line so two lines of a colorway
    // don't both discount the same unwound spools.
    const binPool = { ...unwoundByRecipe };

    // ── Resolve every column id up front (rename-proofing) ──────────────
    const missing = [];
    const optC = cands => ({ cands, required: false });
    const rc = (table, name, spec) => resolveCols(table, name, spec, missing);
    const WO = rc(woTable, 'Work_Orders', {
      status: ['Status'], orderNumber: optC(['Order_Number']),
      customerName: optC(['Customer_Name']), dueDate: optC(['Due_Date']),
    });
    const REC = rc(recipesTable, 'Recipes', { name: ['Recipe_Name'], sku: optC(['SKU_Base']) });
    const COMP = rc(compTable, 'Recipe_Dye_Components', {
      recipe: ['Recipe'], dye: ['Dye_Name'],
      effRate: optC(['Effective_mL_per_100_yd']), defRate: optC(['Default_mL_per_100_yds']),
    });
    const DYE = rc(dyesTable, 'Dyes', {
      name: ['Dye_Name'], brand: optC(['Brand']),
      cleanup: optC(['Cleanup_Order']), shelf: optC(['Shelf_Life_days_']),
    });
    const STK = rc(stockTable, 'Dye_Stock', {
      dye: ['Dye'], quantity: ['Quantity_mL'], mixedDate: optC(['Mixed_Date']),
      bin: optC(['Bin_Location']),
    });
    STOCK_COLS = {
      dye: STK.dye || 'Dye', quantity: STK.quantity || 'Quantity_mL',
      mixedDate: STK.mixedDate || 'Mixed_Date', bin: STK.bin || 'Bin_Location',
    };
    const WOL = rc(wolTable, 'Work_Order_Lines', {
      workOrder: ['Work_Order'], qtyNeeded: ['Qty_Needed'],
      sku: optC(['SKU']), recipe: optC(['Recipe']), priority: optC(['Production_Priority']),
    });
    if (missing.length) {
      document.getElementById('content').innerHTML =
        `<div class="empty-state">Can't load — missing columns:<br><br><strong>${[...new Set(missing)].join('<br>')}</strong><br><br><span style="font-size:10px">A table or column was likely renamed.</span></div>`;
      return;
    }
    // ────────────────────────────────────────────────────────────────────

    const woIds = woTable.id || [];
    const woInfo = {};
    woIds.forEach((id, i) => {
      woInfo[id] = {
        active: (columnAsArray(woTable, WO.status)[i] || '').toString() === 'Active',
        orderNumber: columnAsArray(woTable, WO.orderNumber)[i],
        customerName: columnAsArray(woTable, WO.customerName)[i],
        dueDate: columnAsArray(woTable, WO.dueDate)[i],
      };
    });

    const rIds = recipesTable.id || [];
    const recipeById = {};
    const recipeBySku = {};
    rIds.forEach((id, i) => {
      const rec = { id, name: columnAsArray(recipesTable, REC.name)[i] };
      recipeById[id] = rec;
      const sku = normalize(columnAsArray(recipesTable, REC.sku)[i]);
      if (sku) recipeBySku[sku] = rec;
    });

    const cIds = compTable.id || [];
    const compsByRecipe = {};
    const preDyeIds = dyesTable.id || [];
    const dyeNameById = {};
    preDyeIds.forEach((id, i) => { dyeNameById[id] = columnAsArray(dyesTable, DYE.name)[i] || ''; });
    cIds.forEach((id, i) => {
      const recipeRef = getRefId(columnAsArray(compTable, COMP.recipe)[i]);
      if (!recipeRef) return;
      const rate = Number(columnAsArray(compTable, COMP.effRate)[i]) ||
                   Number(columnAsArray(compTable, COMP.defRate)[i]) || 0;
      const rawDye = columnAsArray(compTable, COMP.dye)[i];
      const dyeRefId = getRefId(rawDye);
      const resolvedName = dyeRefId ? (dyeNameById[dyeRefId] || '') : (typeof rawDye === 'string' ? rawDye : '');
      const entry = { dyeId: dyeRefId, dyeName: resolvedName, rate };
      if (!compsByRecipe[recipeRef]) compsByRecipe[recipeRef] = [];
      compsByRecipe[recipeRef].push(entry);
    });

    const dIds = dyesTable.id || [];
    // Keyed by row id, never by name: 26 dye names are shared across brands, and
    // a name-keyed map silently hands you the last brand loaded.
    const dyeById = {};
    dIds.forEach((id, i) => {
      dyeById[id] = {
        id,
        name: columnAsArray(dyesTable, DYE.name)[i],
        brand: columnAsArray(dyesTable, DYE.brand)[i],
        cleanupOrder: Number(columnAsArray(dyesTable, DYE.cleanup)[i]) || 999,
        shelfLifeDays: Number(columnAsArray(dyesTable, DYE.shelf)[i]) || null,
      };
    });

    const sIds = stockTable.id || [];
    const stockByDyeId = {};
    sIds.forEach((id, i) => {
      const dyeRef = getRefId(columnAsArray(stockTable, STK.dye)[i]);
      if (!dyeRef) return;
      const qty = Number(columnAsArray(stockTable, STK.quantity)[i]) || 0;
      const mixedDate = columnAsArray(stockTable, STK.mixedDate)[i];
      const bin = STK.bin ? columnAsArray(stockTable, STK.bin)[i] : '';
      if (!stockByDyeId[dyeRef]) stockByDyeId[dyeRef] = [];
      stockByDyeId[dyeRef].push({ id, qty, mixedDate, bin });
    });

    const wolIds = wolTable.id || [];
    const groups = {};
    const recipeDyeSets = {}; // recipeId -> Set of dye keys (row id), for clustering
    const dyeKey = comp => comp.dyeId ? 'd' + comp.dyeId : 'n:' + normalize(comp.dyeName);

    for (let i = 0; i < wolIds.length; i++) {
      const woId = getRefId(columnAsArray(wolTable, WOL.workOrder)[i]);
      const info = woInfo[woId];
      if (!info || !info.active) continue;

      const qtyNeeded = Number(columnAsArray(wolTable, WOL.qtyNeeded)[i]) || 0;
      const allocated = allocByLine[wolIds[i]] || 0;
      let remaining = qtyNeeded - allocated;
      if (remaining <= 0) continue;

      const sku = columnAsArray(wolTable, WOL.sku)[i] || '';
      let recipe = null;
      const directRecipeId = getRefId(columnAsArray(wolTable, WOL.recipe)[i]);
      if (directRecipeId && recipeById[directRecipeId]) recipe = recipeById[directRecipeId];
      else recipe = recipeBySku[normalize(sku)] || null;

      if (!recipe || !compsByRecipe[recipe.id]) continue;

      // Discount unwound spools already sitting in this colorway's bins — no need
      // to mix dye for thread that's made but not yet wound.
      const fromBin = Math.min(remaining, binPool[recipe.id] || 0);
      binPool[recipe.id] = (binPool[recipe.id] || 0) - fromBin;
      remaining -= fromBin;
      if (remaining <= 0) continue;

      if (!recipeDyeSets[recipe.id]) recipeDyeSets[recipe.id] = new Set();
      compsByRecipe[recipe.id].forEach(comp => {
        if (comp.dyeId || comp.dyeName) recipeDyeSets[recipe.id].add(dyeKey(comp));
      });

      const priority = columnAsArray(wolTable, WOL.priority)[i] || 'Normal';

      compsByRecipe[recipe.id].forEach(comp => {
        if (!comp.dyeId && !comp.dyeName) return;
        const key = dyeKey(comp);
        const hasRate = comp.rate > 0;
        const mlNeeded = hasRate ? comp.rate * remaining : 0;

        if (!groups[key]) {
          const dyeInfo = (comp.dyeId && dyeById[comp.dyeId])
            || { id: null, name: comp.dyeName, brand: '', cleanupOrder: 999, shelfLifeDays: null };
          groups[key] = {
            key,
            dyeName: dyeInfo.name,
            brand: dyeInfo.brand,
            dyeId: dyeInfo.id,
            cleanupOrder: dyeInfo.cleanupOrder,
            shelfLifeDays: dyeInfo.shelfLifeDays,
            totalMlNeeded: 0,
            totalQtyNeeded: 0,
            hasAnyRate: false,
            missingRateCount: 0,
            bestPriority: priority,
            earliestDue: info.dueDate || null,
            orders: [],
          };
        }
        const g = groups[key];
        g.totalMlNeeded += mlNeeded;
        g.totalQtyNeeded += remaining;
        if (hasRate) g.hasAnyRate = true;
        else g.missingRateCount += 1;
        if (priorityRank(priority) < priorityRank(g.bestPriority)) g.bestPriority = priority;
        if (info.dueDate && (!g.earliestDue || Number(info.dueDate) < Number(g.earliestDue))) g.earliestDue = info.dueDate;
        g.orders.push({
          orderNumber: info.orderNumber,
          customerName: info.customerName,
          dueDate: info.dueDate,
          priority,
          recipeName: recipe.name,
          mlNeeded,
          hasRate,
          qty: remaining,
        });
      });
    }

    // Run the same isolation/clustering algorithm as Recipe Make Sequence, so both
    // tools agree on baseline ordering. Derive a per-dye "efficiency rank" (the round
    // at which that dye gets addressed) to use as Dye Prep Sequence's tiebreaker,
    // below the genuinely urgent signals (expiring stock, priority/due date).
    let clusterRemaining = Object.entries(recipeDyeSets).map(([recipeId, dyeSet]) => ({
      recipeId, dyes: Array.from(dyeSet),
    }));
    const dyeEfficiencyRank = {};
    let round = 0;
    while (clusterRemaining.length > 0) {
      const dyeDemand = {};
      clusterRemaining.forEach(r => r.dyes.forEach(d => {
        const key = d;
        dyeDemand[key] = (dyeDemand[key] || 0) + 1;
      }));

      const isolated = clusterRemaining.filter(r => r.dyes.every(d => dyeDemand[d] === 1));
      let thisRoundIds;
      if (isolated.length > 0) {
        thisRoundIds = new Set(isolated.map(r => r.recipeId));
        isolated.forEach(r => r.dyes.forEach(d => {
          const key = d;
          if (!(key in dyeEfficiencyRank)) dyeEfficiencyRank[key] = round;
        }));
      } else {
        let smallestDye = null, smallestCount = Infinity;
        Object.entries(dyeDemand).forEach(([d, c]) => { if (c < smallestCount) { smallestCount = c; smallestDye = d; } });
        const cluster = clusterRemaining.filter(r => r.dyes.some(d => d === smallestDye));
        thisRoundIds = new Set(cluster.map(r => r.recipeId));
        cluster.forEach(r => r.dyes.forEach(d => {
          const key = d;
          if (!(key in dyeEfficiencyRank)) dyeEfficiencyRank[key] = round;
        }));
      }
      clusterRemaining = clusterRemaining.filter(r => !thisRoundIds.has(r.recipeId));
      round++;
    }

    Object.values(groups).forEach(g => {
      const stockRows = g.dyeId ? (stockByDyeId[g.dyeId] || []) : [];
      let totalStock = 0;
      let soonestExpiryDays = null;
      const nowSeconds = Date.now() / 1000;

      stockRows.forEach(s => {
        totalStock += s.qty;
        if (g.shelfLifeDays && s.mixedDate) {
          const ageDays = (nowSeconds - Number(s.mixedDate)) / 86400;
          const daysLeft = g.shelfLifeDays - ageDays;
          if (soonestExpiryDays === null || daysLeft < soonestExpiryDays) soonestExpiryDays = daysLeft;
        }
      });

      g.stockRows = stockRows.slice().sort((a, b) => (Number(b.mixedDate) || 0) - (Number(a.mixedDate) || 0));
      g.stockMl = totalStock;
      g.expiryDaysLeft = soonestExpiryDays;
      g.mlToMix = Math.max(0, g.totalMlNeeded - totalStock);
      g.efficiencyRank = dyeEfficiencyRank[g.key] ?? 999;
    });

    dyeGroups = Object.values(groups).sort((a, b) => {
      const aExpiring = a.expiryDaysLeft !== null && a.expiryDaysLeft <= 3;
      const bExpiring = b.expiryDaysLeft !== null && b.expiryDaysLeft <= 3;
      if (aExpiring !== bExpiring) return aExpiring ? -1 : 1;
      if (aExpiring && bExpiring) return a.expiryDaysLeft - b.expiryDaysLeft;

      const pr = priorityRank(a.bestPriority) - priorityRank(b.bestPriority);
      if (pr !== 0) return pr;

      const ad = a.earliestDue ? Number(a.earliestDue) : Infinity;
      const bd = b.earliestDue ? Number(b.earliestDue) : Infinity;
      if (ad !== bd) return ad - bd;

      return a.efficiencyRank - b.efficiencyRank;
    });

    document.getElementById('headerSub').textContent =
      `${dyeGroups.length} dye${dyeGroups.length === 1 ? '' : 's'} needed across active orders`;
    renderList();
  } catch (e) {
    console.error('Failed to load dye prep sequence:', e);
    const msg = (e && e.message ? e.message : String(e)).replace(/[<>]/g, '');
    document.getElementById('headerSub').textContent = 'Failed to load — ' + msg;
  }
}

function renderList() {
  const content = document.getElementById('content');

  if (!dyeGroups.length) {
    content.innerHTML = `<div class="empty-state">🎉 Nothing needs dyeing right now.</div>`;
    return;
  }

  const rows = dyeGroups.map((g, idx) => {
    const isExpiring = g.expiryDaysLeft !== null && g.expiryDaysLeft <= 3;
    const isUrgentPriority = g.bestPriority === 'Urgent' || g.bestPriority === 'High';
    const rowClass = isExpiring ? 'urgent-expiry' : isUrgentPriority ? 'urgent-priority' : '';
    const rowId = `dye-detail-${idx}`;

    const stockHtml = g.stockMl > 0
      ? `<span class="${isExpiring ? '' : 'stock-ok'}">${g.stockMl.toFixed(0)}mL on hand${isExpiring ? ` <span class="expiry-flag">${Math.max(0, Math.round(g.expiryDaysLeft))}d left</span>` : ''}</span>`
      : `<span class="stock-none">none on hand</span>`;

    const ordersHtml = g.orders.map(o => {
      const due = o.dueDate ? new Date(Number(o.dueDate) * 1000).toLocaleDateString() : '—';
      const amount = o.hasRate ? `${o.mlNeeded.toFixed(0)}mL` : `${o.qty} spools (no rate yet)`;
      return `<div class="order-line"><span>#${esc(o.orderNumber || '—')} · ${esc(o.customerName || '—')} · ${esc(o.recipeName)}</span><span>${amount} · due ${due}</span></div>`;
    }).join('');

    const mixCellHtml = g.hasAnyRate
      ? `<span class="mix-amount ${g.mlToMix <= 0 ? 'zero' : ''}">${g.mlToMix <= 0 ? 'Covered by stock' : g.mlToMix.toFixed(0) + 'mL'}</span>`
      : `<span class="mix-amount">${g.totalQtyNeeded} spools <span style="font-size:10px;color:#8B7D72;font-weight:500;">(no rate yet)</span></span>`;

    const totalCellHtml = g.hasAnyRate
      ? `${g.totalMlNeeded.toFixed(0)}mL total`
      : `${g.totalQtyNeeded} spools total`;

    return `
      <tr class="dye-row ${rowClass}" onclick="document.getElementById('${rowId}').classList.toggle('open')">
        <td>
          <div class="dye-name" style="color:${guessColor(g.dyeName)}">${esc(g.dyeName)}</div>
          <div class="dye-brand">${esc(g.brand || '')}</div>
        </td>
        <td>${stockHtml}</td>
        <td>${mixCellHtml}</td>
        <td class="orders-cell">▾ ${g.orders.length} batch${g.orders.length === 1 ? '' : 'es'} · ${totalCellHtml}</td>
      </tr>
      <tr class="detail-row" id="${rowId}">
        <td colspan="4">
          <div class="detail-wrap">
            ${ordersHtml}
            <div class="log-stock-row">
              <span style="font-size:11px;color:#6B5E52;">Just mixed a batch?</span>
              <input type="number" id="logAmount-${idx}" placeholder="mL">
              <button onclick="logMixedStock(${idx})">+ Log to stock</button>
            </div>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  content.innerHTML = `
    <table class="work-table">
      <thead>
        <tr>
          <th>Dye</th>
          <th>Stock on hand</th>
          <th>Need to mix</th>
          <th style="text-align:right">Batches</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function logMixedStock(idx) {
  const g = dyeGroups[idx];
  const input = document.getElementById(`logAmount-${idx}`);
  const amount = Number(input.value);
  if (!amount || amount <= 0) { showToast('Enter a valid mL amount'); return; }
  if (!g.dyeId) { showToast('This dye isn\'t linked to a Dyes row — cannot log stock'); return; }

  // One jar per dye, always. A fresh mix replaces what was there — it is used up
  // or dumped, never set beside the old — so this updates the existing jar and
  // clears any stale extra rows rather than adding a second container.
  const rows = g.stockRows || [];
  const now = Math.floor(Date.now() / 1000);
  const actions = [];
  let note;
  if (rows.length) {
    const keep = rows[0];
    const fields = { [STOCK_COLS.quantity]: amount, [STOCK_COLS.mixedDate]: now };
    if (keep.bin) fields[STOCK_COLS.bin] = keep.bin;
    actions.push(['UpdateRecord', 'Dye_Stock', keep.id, fields]);
    rows.slice(1).forEach(r => actions.push(['RemoveRecord', 'Dye_Stock', r.id]));
    note = rows.length > 1
      ? `${g.dyeName} jar updated to ${amount}mL · ${rows.length - 1} stale row${rows.length === 2 ? '' : 's'} cleared`
      : `${g.dyeName} jar updated to ${amount}mL${keep.bin ? ' · bin ' + keep.bin : ''}`;
  } else {
    actions.push(['AddRecord', 'Dye_Stock', null, {
      [STOCK_COLS.dye]: g.dyeId,
      [STOCK_COLS.quantity]: amount,
      [STOCK_COLS.mixedDate]: now,
    }]);
    note = `New jar of ${g.dyeName} — ${amount}mL, needs a bin`;
  }

  try {
    await grist.docApi.applyUserActions(actions);
    showToast(note);
    await loadEverything();
  } catch (e) {
    console.error('Failed to log stock:', e);
    showToast('Failed — check the Dye_Stock table exists with the right columns');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

grist.ready({
  requiredAccess: 'full'
});

loadEverything();
</script>
</body>
</html>
