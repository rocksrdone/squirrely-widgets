<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Order Sync</title>
<style>
  :root {
    --bg: #fff; --ink: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --good: #047857; --warn: #b45309; --goodbg: #ecfdf5; --warnbg: #fffbeb;
    --infobg: #eff6ff; --info: #1d4ed8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 12px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         color: var(--ink); background: var(--bg); }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  button { font: inherit; font-weight: 600; padding: 9px 18px; border: 0; border-radius: 6px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  .stamp { color: var(--muted); font-size: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .card > h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .01em; }
  .card > h2 .sub { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .banner { border-radius: 6px; padding: 9px 12px; margin-bottom: 10px; font-weight: 600; }
  .banner.good { background: var(--goodbg); color: var(--good); }
  .banner.warn { background: var(--warnbg); color: var(--warn); }
  .banner.info { background: var(--infobg); color: var(--info); }
  .banner .thin { font-weight: 400; display: block; margin-top: 3px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; }
  .stat { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .stat .n { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .stat .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  .stat.alert { border-color: #fcd34d; background: var(--warnbg); }
  .stat.alert .n { color: var(--warn); }
  h3 { margin: 14px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; }
  code { background: #f3f4f6; padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<!-- Static shell renders first; nothing here depends on Grist or the network. -->
<div class="bar">
  <button id="runBtn">Run order sync</button>
  <span class="stamp" id="stamp">Not run yet this session</span>
</div>
<div id="out"></div>

<script>
/* Production webhook URL from the "Run From Dashboard" node. The workflow must be
   ACTIVE for this to answer — the test URL only listens while you're watching the
   canvas in n8n. */
const WEBHOOK_URL = 'https://squirrelystash.app.n8n.cloud/webhook/sync-drafts';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function list(items, emptyText) {
  if (!items || !items.length) return `<div class="empty">${esc(emptyText)}</div>`;
  return '<ul>' + items.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>';
}

function stat(n, label, alert) {
  return `<div class="stat${alert ? ' alert' : ''}"><div class="n">${esc(n)}</div><div class="l">${esc(label)}</div></div>`;
}

/* The two passes are gated independently — each has its own DRY_RUN — so each
   gets its own banner naming the node to flip. One shared banner used to imply
   a single switch that does not exist. */
function quantityCard(r) {
  const c = r.counts || {};
  const banner = r.dry_run
    ? `<div class="banner warn">DRY RUN — no quantities written.
         <span class="thin">Set <code>DRY_RUN = false</code> in the <strong>Diff Draft Quantities</strong> node to apply.</span></div>`
    : (r.applied
        ? `<div class="banner good">Applied ${c.lines_updated} update(s) and ${c.lines_added} new line(s) to Grist.</div>`
        : `<div class="banner good">Quantities already matched Shopify — nothing to change.</div>`);

  return banner + `
    <div class="card">
      <h2>Quantities and new orders<span class="sub">drafts and unshipped orders only</span></h2>
      <div class="grid">
        ${stat(c.lines_updated || 0, 'Qty updated')}
        ${stat(c.lines_added || 0, 'Lines added')}
        ${stat(c.orders_imported || 0, 'Orders imported')}
        ${stat(c.matched || 0, 'Orders checked')}
        ${stat((r.unmatched || []).length, 'Not checked')}
        ${stat(c.skipped_blank_sku || 0, 'Blank SKU')}
      </div>
      <h3>Changes</h3>
      ${list(r.changes, 'No quantity changes.')}
      <h3>New orders imported</h3>
      ${list(r.imported_orders, 'No new orders.')}
      <h3>Needs a look</h3>
      ${list((r.notes || []).filter(n => /^(HOLD|SKIP|WARN|NOTE)/.test(n)), 'Nothing flagged.')}
      <h3>Not checked against Shopify</h3>
      ${list((r.unmatched || []).map(u => `${u.order} — ${u.reason}`),
             'Every active order was checked.')}
    </div>`;
}

/* Payment / fulfillment / tracking. Absent entirely on a workflow without the
   Diff Order Status node — say so plainly rather than rendering an empty card,
   because "which version am I running?" is otherwise unanswerable from here. */
function statusCard(r) {
  const st = r.status;
  if (!st) {
    return `<div class="banner info">Payment and tracking refresh is not installed in this workflow.
      <span class="thin">This run only checked quantities. Payment status stays frozen at whatever it was on import day.</span></div>`;
  }
  const missing = st.columns_missing || [];
  /* Three outcomes, not two. "Attempted but rejected" used to render as the
     success banner, because applied was computed from intent rather than from
     the HTTP response — so a 401 read as "Updated 11 order(s)" and the only
     symptom was the next run reporting the very same 11 changes again. */
  const banner = st.dry_run
    ? `<div class="banner warn">DRY RUN — no payment or tracking written.
         <span class="thin">Set <code>DRY_RUN = false</code> in the <strong>Diff Order Status</strong> node to apply.</span></div>`
    : st.write_error
      ? `<div class="banner bad">Write REJECTED — nothing was saved.
           <span class="thin">Grist said: ${esc(st.write_error)}</span>
           <span class="thin">The run still reports success because <code>Apply Status Updates</code> is set to continue on error. Open that node in n8n for the full response.</span></div>`
      : st.applied
        ? `<div class="banner good">Updated payment and tracking on ${st.orders_updated} order(s).</div>`
        : st.attempted
          ? `<div class="banner bad">${st.orders_updated} change(s) were prepared but the write did not run.
               <span class="thin">Check the <code>Is Status Dry Run?</code> branch in n8n.</span></div>`
          : `<div class="banner good">Payment and tracking already matched Shopify — nothing to change.</div>`;

  const setup = missing.length
    ? `<div class="banner warn">${missing.length} column(s) missing on Work_Orders, so those fields were skipped.
         <span class="thin">Add ${missing.map(m => `<code>${esc(m)}</code>`).join(', ')} — <code>Shipped_Date</code> as a Date column, the rest as Text.</span></div>`
    : '';

  return banner + setup + `
    <div class="card">
      <h2>Payment and tracking<span class="sub">all orders, including archived</span></h2>
      <div class="grid">
        ${stat(st.orders_updated || 0, 'Orders updated')}
        ${stat(st.matched || 0, 'Matched')}
        ${stat((st.unmatched || []).length, 'Not matched')}
        ${stat(missing.length, 'Columns missing', missing.length > 0)}
      </div>
      <h3>Status changes</h3>
      ${list(st.changes, 'No payment or tracking changes.')}
      <h3>Left alone on purpose</h3>
      ${list((st.notes || []).filter(n => /^(HOLD|WARN|NOTE)/.test(n)),
             'Nothing held back.')}
      <h3>No Shopify match</h3>
      ${list((st.unmatched || []).map(u => `${u.order} — ${u.reason}`),
             'Every work order matched a Shopify order.')}
    </div>`;
}

function render(r) {
  $('out').innerHTML = quantityCard(r) + statusCard(r);
}

async function run() {
  const btn = $('runBtn');
  btn.disabled = true;
  btn.textContent = 'Running…';
  $('stamp').textContent = 'Working — this takes a few seconds';
  $('out').innerHTML = '';
  try {
    const res = await fetch(WEBHOOK_URL, { method: 'GET', cache: 'no-store' });
    if (!res.ok) throw new Error(`webhook returned ${res.status} ${res.statusText}`);
    const data = await res.json();
    render(data);
    $('stamp').textContent = 'Last run ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('out').innerHTML = `<div class="banner warn">Couldn't reach the workflow — ${esc(e.message)}</div>
      <div class="card">Check that the n8n workflow is <strong>active</strong>, that
      <code>${esc(WEBHOOK_URL)}</code> is the production URL from the
      "Run From Dashboard" node, and that its CORS setting allows this page.</div>`;
    $('stamp').textContent = 'Last attempt failed';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run order sync';
  }
}

$('runBtn').addEventListener('click', run);

// Grist is optional here — this widget reads no tables. Kept in a try/catch so a
// plugin-API hiccup can't kill the script before the button is wired up.
try { if (window.grist) grist.ready(); } catch (e) { console.warn('grist.ready failed', e); }
</script>
</body>
</html>
