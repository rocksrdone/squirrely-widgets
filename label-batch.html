<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spool Label Batch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');
:root {
  --ink: #1A1614;
  --paper: #F7F3EE;
  --warm: #E8DFD4;
  --rule: #D4C9BC;
  --accent: #8B3A2A;
  --teal: #3A8B7A;
  --gold: #9A6B22;
  --gold-light: #F6EDDA;
  --muted: #8B7D72;
  --mid: #6B5E52;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.5; padding: 0 0 96px;
}

.banner { background: #FBEDE9; border-bottom: 1px solid var(--accent); color: var(--accent); padding: 8px 16px; font-size: 11px; line-height: 1.6; }
.banner .banner-title { font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 10px; margin-bottom: 3px; }
.banner strong { font-family: 'DM Mono', monospace; font-weight: 500; }

.head { padding: 14px 16px 0; display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.head h1 { font-family: 'Libre Baskerville', serif; font-size: 20px; margin: 0 0 2px; }
.head .sub { font-size: 11px; color: var(--muted); }
.head-actions { margin-left: auto; display: flex; gap: 6px; }

.tabs { display: flex; gap: 4px; padding: 12px 16px 0; border-bottom: 1px solid var(--rule); }
.tab { font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 6px 6px 0 0; cursor: pointer; border: 1px solid transparent; border-bottom: none; color: var(--mid); }
.tab:hover { background: var(--warm); }
.tab.active { background: white; border-color: var(--rule); color: var(--ink); margin-bottom: -1px; }

.btn { font-size: 11px; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 600; border: 1px solid var(--rule); background: white; color: var(--ink); font-family: 'Inter', sans-serif; }
.btn:hover { border-color: var(--accent); }
.btn.solid { background: var(--accent); border-color: var(--accent); color: white; }
.btn.solid:hover { filter: brightness(1.08); }
.btn.tiny { font-size: 10px; padding: 3px 8px; font-weight: 500; }
.btn:disabled { opacity: .4; cursor: default; filter: none; }

.pane { padding: 14px 16px 0; }

.pick-box { background: white; border: 1px solid var(--rule); border-radius: 8px; padding: 12px; }
.pick-row { display: flex; gap: 8px; align-items: center; }
.pick-row input { flex: 1; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; background: #fff; color: var(--ink); }
.pick-row input:focus { border-color: var(--accent); }
.order-list { margin-top: 10px; max-height: 240px; overflow-y: auto; }
.order-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 5px; cursor: pointer; font-size: 12px; border: 1px solid var(--rule); margin-bottom: 4px; background: var(--paper); }
.order-row:hover, .order-row.active { border-color: var(--accent); background: white; }
.order-row .ord-num { font-family: 'DM Mono', monospace; font-weight: 600; }
.order-row .ord-cust { color: var(--mid); flex: 1; }
.order-row .ord-meta { font-size: 10px; color: var(--muted); white-space: nowrap; }
.empty-note { font-size: 11px; color: var(--muted); font-style: italic; padding: 10px 0; }

.profile { margin-top: 12px; background: white; border: 1px solid var(--rule); border-radius: 8px; padding: 11px 13px; display: flex; gap: 22px; flex-wrap: wrap; }
.profile .pf { min-width: 130px; }
.profile .pf-label { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.profile .pf-value { font-size: 13px; font-weight: 500; margin-top: 2px; }
.profile .pf-value.warn { color: var(--accent); font-weight: 600; }
.profile .pf-value.dim { color: var(--muted); font-style: italic; font-weight: 400; }

.alert { margin-top: 10px; padding: 9px 12px; border-radius: 6px; font-size: 11.5px; line-height: 1.6; background: var(--gold-light); border: 1px solid #E4CF9E; color: #6E4C13; }
.alert strong { font-weight: 700; }

/* ---------- stock group ---------- */
.group { margin-top: 18px; background: white; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.group.unassigned { border-color: var(--accent); }
.group-head { padding: 10px 13px; background: var(--warm); border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.group-code { font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; }
.group-desc { font-size: 11px; color: var(--mid); }
.group-fibers { display: flex; gap: 4px; }
.group-head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.calib { padding: 8px 13px; background: #FBF8F4; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11px; }
.calib-vals { font-family: 'DM Mono', monospace; color: var(--mid); }
.calib-vals b { color: var(--ink); font-weight: 500; }
.calib-date { color: var(--muted); font-style: italic; }
.calib-missing { color: var(--accent); font-style: italic; }
.calib-form { padding: 10px 13px; background: #FBF8F4; border-bottom: 1px solid var(--rule); display: none; }
.calib-form.open { display: block; }
.calib-fields { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.calib-field { display: flex; flex-direction: column; }
.calib-field label { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
.calib-field input[type=text] { width: 82px; padding: 5px 7px; border: 1px solid var(--rule); border-radius: 5px; font-family: 'DM Mono', monospace; font-size: 12px; outline: none; background: #fff; color: var(--ink); }
.calib-field input:focus { border-color: var(--accent); }
.calib-note { font-size: 10.5px; color: var(--mid); margin-top: 8px; line-height: 1.55; }
.group-foot { padding: 9px 13px; display: flex; align-items: center; gap: 10px; background: var(--paper); border-top: 1px solid var(--rule); }
.group-total { font-size: 12px; }
.group-total strong { font-family: 'DM Mono', monospace; font-size: 15px; color: var(--accent); }
.group-foot-actions { margin-left: auto; display: flex; gap: 6px; }

table.lbl { width: 100%; border-collapse: collapse; }
table.lbl thead th { text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: white; background: var(--ink); padding: 7px 9px; font-weight: 600; white-space: nowrap; }
table.lbl td { padding: 7px 9px; border-bottom: 1px solid var(--rule); font-size: 12px; vertical-align: middle; }
table.lbl tbody tr:nth-child(even) { background: #FBF8F4; }
table.lbl tbody tr.skipped { opacity: .5; }
table.lbl tbody tr.skipped .colorway { text-decoration: line-through; }
.colorway { font-weight: 500; }
.sku { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--mid); }
.num { font-family: 'DM Mono', monospace; text-align: center; }
.num.print { font-weight: 700; color: var(--accent); }
.num.zero { color: var(--muted); font-weight: 400; }
.col-chk { width: 34px; text-align: center; }
.col-num { width: 66px; }
.col-stock { width: 116px; }
.fiber-tag { font-size: 9px; font-weight: 700; color: #2A6B6B; background: #E4F0EF; padding: 1px 5px; border-radius: 8px; white-space: nowrap; }
input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--teal); margin: 0; cursor: pointer; }
input[type=checkbox]:disabled { cursor: default; }
.qty-input { width: 52px; padding: 3px 5px; border: 1px solid var(--rule); border-radius: 4px; font-family: 'DM Mono', monospace; font-size: 12px; text-align: center; outline: none; background: #fff; color: var(--ink); }
.qty-input::placeholder { color: var(--muted); opacity: 1; }
/* Front-label controls: explicit colours so nothing is inherited from the host page. */
.f-lab { font-size: 11px; color: var(--mid); display: flex; flex-direction: column; gap: 3px; }
.f-sel, .f-txt { padding: 5px 7px; border: 1px solid var(--rule); border-radius: 5px; font-size: 12px;
  font-family: 'Inter', sans-serif; background: #fff; color: var(--ink); outline: none; }
.f-sel:focus, .f-txt:focus { border-color: var(--accent); }
.f-txt { font-family: 'DM Mono', monospace; text-align: center; width: 72px; }
.f-saved { color: var(--teal); font-weight: 700; }
.qty-input:focus { border-color: var(--accent); }
.stock-cell { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.stock-cell label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--mid); }
.stock-cell.disabled label { cursor: default; color: var(--muted); font-style: italic; }
.hint-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

.front-summary { margin-top: 16px; background: white; border: 1px solid var(--rule); border-radius: 8px; padding: 11px 13px; }
.front-summary h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--teal); font-weight: 700; margin: 0 0 7px; }
.front-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
.front-row .fr-qty { font-family: 'DM Mono', monospace; font-weight: 600; }

.footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1.5px solid var(--rule); padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; z-index: 20; }
.footer-count { font-size: 12px; }
.footer-count strong { font-family: 'DM Mono', monospace; font-size: 17px; color: var(--accent); }
.footer-opt { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--mid); }
.footer-actions { margin-left: auto; display: flex; gap: 6px; }

.start-at { font-size: 11px; color: var(--mid); display: flex; align-items: center; gap: 5px; }
.start-at .qty-input { width: 46px; }
.start-at select { padding: 3px 5px; border: 1px solid var(--rule); border-radius: 4px; font-size: 11px; font-family: 'Inter', sans-serif; background: white; color: var(--ink); outline: none; }
.start-at select:focus { border-color: var(--accent); }
.geom-warn { padding: 8px 13px; background: var(--gold-light); border-top: 1px solid #E4CF9E; color: #6E4C13; font-size: 11px; line-height: 1.5; }
.toast { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999; max-width: 82vw; }
.toast.show { opacity: 1; }
.toast.err { background: var(--accent); }
</style>
</head>
<body>

<div id="banner"></div>

<div class="head">
  <div>
    <h1>Spool Label Batch</h1>
    <div class="sub">Back labels for Maestro mail merge, split by label sheet — one file per stock code.</div>
  </div>
  <div class="head-actions"><button class="btn" id="refreshBtn">↻ Refresh</button></div>
</div>

<div class="tabs">
  <div class="tab active" data-mode="order">Order batch</div>
  <div class="tab" data-mode="store">Store listings</div>
  <div class="tab" data-mode="front">Front labels</div>
</div>

<div class="pane" id="pane"><div class="empty-note">Loading...</div></div>

<div class="footer-bar">
  <div class="footer-count"><strong id="totalCount">0</strong> labels across <span id="groupCount">0</span> sheet type(s)</div>
  <label class="footer-opt"><input type="checkbox" id="oneRowPerSpool" checked> One row per spool <span style="color:var(--muted)">(CSV)</span></label>
  <label class="footer-opt"><input type="checkbox" id="proofMode"> Proof outlines <span style="color:var(--muted)">(PDF)</span></label>
  <div class="footer-actions">
    <button class="btn solid" id="csvAllBtn">Download all files</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ============================================================
   Spool Label Batch — Squirrely Stash

   Label sheets differ by fiber (OL3012WI for FFN/CN, OL1025WI for
   EN), so a mixed-fiber order can NEVER go out as one merge file.
   Rows are grouped by stock code and each group exports its own CSV.

   Sheet calibration (left/top margin, bleed) drifts between packs of
   label stock. It lives on Label_Templates so there's one place to
   change it, it's dated, and the future PDF generator can read the
   same numbers instead of you re-deriving them.

   Requires FULL access — writes the sheet-on-hand toggle and
   calibration values back to Grist.
   ============================================================ */

/* ---------- PDF constants ----------
   Ring artwork is fetched at runtime rather than embedded, so regenerating a
   ring (e.g. EN moving from 140 to 150 yards) is a file swap in the repo with
   no widget change. One PNG per fiber code, transparent, ~900ppi.            */
/* The ring is drawn as live text, not embedded artwork. Yardage therefore comes
   from yardsPerSpool() — the same function thread-board, wind-routing and
   work-overview already use — so changing a spool length in one place updates
   every printed label. No PNG to regenerate, ever.                            */
const RING_SPEC = {
  FFN: { material: '100% Nylon',  size: 'FF' },
  FFC: { material: '100% Cotton', size: 'FF' },
  EN:  { material: '100% Nylon',  size: 'E'  },
};

/* Measured off the real Maestro sheets: text sits at 0.4217 x diameter on
   OL3012 and 0.4152 on OL1025. One ratio covers both.                        */
const RING_RADIUS_RATIO = 0.42;
const RING_FONT_RATIO = 0.058;   // of diameter, when no Ring_Font_Size_Pt is set
const METRES_PER_YARD = 0.9144;

/* Front labels: one fixed logo per customer, no variable data.
   Artwork comes from a Grist Attachments column on Customers — private, backed
   up with the document, and added by dragging a file into the cell. Nothing is
   hosted externally. Front_Logo_URL remains as an escape hatch for anything
   served elsewhere, but that host must send CORS headers or the browser will
   block the fetch and jsPDF gets nothing.                                     */

/* Helvetica-Bold is a PDF base-14 font: no download, cannot fail to load, and
   renders identically everywhere. OLSansserif3-Bold is a Helvetica-class
   grotesque, so this is also the closest available match.                     */
const NAME_FONT = ['helvetica', 'bold'];
const NAME_FIT_RATIO = 0.72;   // usable width inside the ring, as a fraction of diameter
const NAME_LINE_HEIGHT = 1.15;   // line spacing as a multiple of font size

/* ---------- helpers ---------- */
function esc(s) {
  return (s === null || s === undefined ? '' : String(s))
    .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function columnAsArray(t, c) { return c && Array.isArray(t[c]) ? t[c] : []; }
function findColumn(t, candidates) {
  const keys = Object.keys(t || {});
  const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
  for (const cand of candidates) {
    const hit = keys.find(k => norm(k) === norm(cand));
    if (hit) return hit;
  }
  return null;
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
function fmtDate(v) {
  if (!v) return '';
  const ms = typeof v === 'number' ? v * 1000 : new Date(v).getTime();
  if (!ms || isNaN(ms)) return '';
  return new Date(ms).toISOString().slice(0, 10);
}
function todayEpochSeconds() { const d = new Date(); d.setHours(0, 0, 0, 0); return Math.floor(d.getTime() / 1000); }
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 3200);
}
function fiberCode(f) {
  const s = normalize(f);
  if (!s) return '';
  if (/^(FFN|FFC|EN|BW|CN)$/.test(s)) return s;
  if (/E\s*NYLON/.test(s)) return 'EN';
  if (/COTTON/.test(s)) return 'FFC';
  if (/BLACKWING/.test(s)) return 'BW';
  if (/NYLON/.test(s)) return 'FFN';
  return s;
}
function yardsPerSpool(fiber) { return fiberCode(fiber) === 'EN' ? 150 : 100; }
function numOrNull(v) {
  const s = String(v ?? '').trim();
  if (!s) return null;
  const n = Number(s.replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? null : n;
}

/* ---------- state ---------- */
const S = {
  mode: 'order',
  cols: {},
  recipes: {}, customers: {}, custByName: {},
  orders: [], lines: [],
  templates: [],        // [{id, code, desc, perSheet, left, top, bleed, reverse, calibratedOn, batchNote, fibers:[]}]
  tplByFiber: {},       // FFN -> template
  hasTemplates: false,
  selectedOrderId: null,
  rowState: {},
  openCalib: null,      // template id whose calibration form is open
  orderSearch: '',
  storeQtyDefault: 6,
  startAt: {},          // group key -> first label position on the sheet
  fillBlanks: {},       // group key -> fiber code for blank ring fill, or ''
  frontCust: null, frontStock: '', frontQty: 48, frontStart: 1,
  frontFit: '', frontScale: '', frontImg: null,
  labelSettings: [], clsCols: null,
  proof: false,         // draw cut circles for a plain-paper test print
  ready: false,
};

/* ---------- load ---------- */
async function loadAll() {
  document.getElementById('pane').innerHTML = '<div class="empty-note">Loading...</div>';
  const problems = [];
  let recT, custT, woT, wolT;
  try {
    [recT, custT, woT, wolT] = await Promise.all([
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Customers'),
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Work_Order_Lines'),
    ]);
  } catch (e) {
    console.error(e);
    setBanner([{ title: "Can't read the document",
      body: 'Needs <strong>Recipes</strong>, <strong>Customers</strong>, <strong>Work_Orders</strong> and <strong>Work_Order_Lines</strong>, with widget access set to <strong>Full document</strong>.' }]);
    document.getElementById('pane').innerHTML = '<div class="empty-note">Not connected.</div>';
    return;
  }

  const rc = {
    name: findColumn(recT, ['Recipe_Name', 'Name', 'Colorway_Name']),
    sku: findColumn(recT, ['SKU_Base', 'SKU']),
    shopifySku: findColumn(recT, ['Shopify_SKU']),
    fiber: findColumn(recT, ['Fiber_Type', 'Fiber']),
    sheet: findColumn(recT, ['Label_Sheet_On_Hand', 'Has_Printed_Sheet']),
    store: findColumn(recT, ['Store_Listing_Active', 'Store_Active', 'Active_Listing']),
  };
  S.cols.recipe = rc;
  if (!rc.sheet) problems.push({ title: 'No sheet-on-hand column on Recipes',
    body: 'Add a Toggle column <strong>Label_Sheet_On_Hand</strong> to Recipes and the stock checkboxes become live. Until then every colorway is treated as "no sheet on hand".' });
  if (!rc.store) problems.push({ title: 'No store-listing column on Recipes',
    body: 'Add a Toggle column <strong>Store_Listing_Active</strong> to Recipes to drive the Store listings tab. Until then it lists every recipe with a Shopify SKU.' });

  S.recipes = {};
  (recT.id || []).forEach((id, i) => {
    S.recipes[id] = {
      id,
      name: columnAsArray(recT, rc.name)[i] || '',
      sku: columnAsArray(recT, rc.sku)[i] || columnAsArray(recT, rc.shopifySku)[i] || '',
      shopifySku: rc.shopifySku ? columnAsArray(recT, rc.shopifySku)[i] || '' : '',
      fiber: columnAsArray(recT, rc.fiber)[i] || '',
      sheetOnHand: rc.sheet ? !!columnAsArray(recT, rc.sheet)[i] : false,
      storeActive: rc.store ? !!columnAsArray(recT, rc.store)[i]
                            : !!(rc.shopifySku && columnAsArray(recT, rc.shopifySku)[i]),
      stock: 0,
    };
  });
  const recipeIdBySku = {};
  Object.values(S.recipes).forEach(r => {
    if (r.sku) recipeIdBySku[normalize(r.sku)] = r.id;
    if (r.shopifySku) recipeIdBySku[normalize(r.shopifySku)] = r.id;
  });

  const cc = {
    name: findColumn(custT, ['Customer_Name', 'Name']),
    code: findColumn(custT, ['Code', 'Vendor_Code']),
    front: findColumn(custT, ['Label_Front_Logo', 'Front_Label_Logo']),
    back: findColumn(custT, ['Label_Back_Style', 'Back_Label_Style']),
    notes: findColumn(custT, ['Label_Notes']),
    logo: findColumn(custT, ['Front_Logo', 'Logo', 'Front_Label_Art']),
    logoUrl: findColumn(custT, ['Front_Logo_URL', 'Logo_URL']),
    logoFit: findColumn(custT, ['Front_Logo_Fit', 'Logo_Fit']),
    logoScale: findColumn(custT, ['Front_Logo_Scale', 'Logo_Scale']),
  };
  if (!cc.front || !cc.back) problems.push({ title: 'Label preferences not set up on Customers',
    body: 'Add <strong>Label_Front_Logo</strong> and <strong>Label_Back_Style</strong> to Customers so this batch knows which front logo to pull and whether the back is a custom design.' });

  S.customers = {}; S.custByName = {};
  (custT.id || []).forEach((id, i) => {
    const o = {
      id,
      name: columnAsArray(custT, cc.name)[i] || '',
      code: columnAsArray(custT, cc.code)[i] || '',
      front: cc.front ? columnAsArray(custT, cc.front)[i] || '' : '',
      back: cc.back ? columnAsArray(custT, cc.back)[i] || '' : '',
      notes: cc.notes ? columnAsArray(custT, cc.notes)[i] || '' : '',
      logoAtt: cc.logo ? attachmentId(columnAsArray(custT, cc.logo)[i]) : null,
      logoUrl: cc.logoUrl ? String(columnAsArray(custT, cc.logoUrl)[i] || '').trim() : '',
      logoFit: cc.logoFit ? String(columnAsArray(custT, cc.logoFit)[i] || '').trim() : '',
      logoScale: cc.logoScale ? Number(columnAsArray(custT, cc.logoScale)[i]) || null : null,
    };
    S.customers[id] = o;
    if (o.name) S.custByName[normalize(o.name)] = o;
  });

  const wc = {
    num: findColumn(woT, ['Order_Number']), cust: findColumn(woT, ['Customer']),
    custName: findColumn(woT, ['Customer_Name']), date: findColumn(woT, ['Order_Date']),
    due: findColumn(woT, ['Due_Date']), status: findColumn(woT, ['Status']),
  };
  S.orders = (woT.id || []).map((id, i) => ({
    id,
    num: columnAsArray(woT, wc.num)[i] || '',
    custId: wc.cust ? getRefId(columnAsArray(woT, wc.cust)[i]) : null,
    custName: columnAsArray(woT, wc.custName)[i] || '',
    date: wc.date ? columnAsArray(woT, wc.date)[i] : null,
    due: wc.due ? columnAsArray(woT, wc.due)[i] : null,
    status: wc.status ? columnAsArray(woT, wc.status)[i] || '' : '',
  })).sort((a, b) => (Number(b.date) || 0) - (Number(a.date) || 0));

  const lc = {
    wo: findColumn(wolT, ['Work_Order']), recipe: findColumn(wolT, ['Recipe']),
    sku: findColumn(wolT, ['SKU']), qty: findColumn(wolT, ['Qty_Needed']),
    product: findColumn(wolT, ['Product_Name']),
  };
  S.lines = (wolT.id || []).map((id, i) => {
    const sku = columnAsArray(wolT, lc.sku)[i] || '';
    let rid = lc.recipe ? getRefId(columnAsArray(wolT, lc.recipe)[i]) : null;
    if (!rid) rid = recipeIdBySku[normalize(sku)] || null;
    return {
      id, woId: getRefId(columnAsArray(wolT, lc.wo)[i]), recipeId: rid, sku,
      productName: lc.product ? columnAsArray(wolT, lc.product)[i] || '' : '',
      qty: Number(columnAsArray(wolT, lc.qty)[i]) || 0,
    };
  });

  await loadTemplates(problems);
  await loadLabelSettings();
  // Match the dropdown's own fallback so the two never disagree.
  if (!S.frontStock && S.templates.length) S.frontStock = S.templates[0].code;

  try {
    const lotsT = await grist.docApi.fetchTable('Production_Lots');
    const pc = { recipe: findColumn(lotsT, ['Recipe']), store: findColumn(lotsT, ['Store_Stock_Spools']), general: findColumn(lotsT, ['General_Stock_Spools']) };
    if (pc.recipe) {
      (lotsT.id || []).forEach((id, i) => {
        const rid = getRefId(columnAsArray(lotsT, pc.recipe)[i]);
        if (!rid || !S.recipes[rid]) return;
        S.recipes[rid].stock += (Number(columnAsArray(lotsT, pc.store)[i]) || 0) + (Number(columnAsArray(lotsT, pc.general)[i]) || 0);
      });
    }
  } catch (e) { console.warn('Production_Lots unavailable — stock hints hidden', e); }

  setBanner(problems);
  S.ready = true;
  render();
}

async function loadTemplates(problems) {
  S.templates = []; S.tplByFiber = {}; S.hasTemplates = false;
  let t;
  try {
    t = await grist.docApi.fetchTable('Label_Templates');
  } catch (e) {
    problems.push({ title: 'Label_Templates table not found',
      body: 'Add a table <strong>Label_Templates</strong> with columns <strong>Stock_Code</strong>, <strong>Description</strong>, ' +
        '<strong>Fiber_Codes</strong>, <strong>Labels_Per_Sheet</strong>, <strong>Left_Margin_In</strong>, <strong>Top_Margin_In</strong>, ' +
        '<strong>Bleed_In</strong>, <strong>Reverse_Print</strong> (Toggle), <strong>Calibrated_On</strong> (Date), <strong>Batch_Note</strong>. ' +
        'Seed it with: <strong>OL3012WI</strong> (FFN, CN — Circle 48/sheet, L 0.31, T 0.27, bleed 0.125), ' +
        '<strong>OL1025WI</strong> (EN), <strong>OL5125WR</strong> (removable, bin labels). ' +
        'Until then, batches group by fiber with no calibration record.' });
    return;
  }
  const c = {
    code: findColumn(t, ['Stock_Code', 'Code', 'OL_Code']),
    desc: findColumn(t, ['Description', 'Desc', 'Name']),
    fibers: findColumn(t, ['Fiber_Codes', 'Fibers', 'Fiber']),
    perSheet: findColumn(t, ['Labels_Per_Sheet', 'Per_Sheet']),
    left: findColumn(t, ['Left_Margin_In', 'Left_Margin']),
    top: findColumn(t, ['Top_Margin_In', 'Top_Margin']),
    bleed: findColumn(t, ['Bleed_In', 'Bleed']),
    reverse: findColumn(t, ['Reverse_Print', 'Reverse']),
    calDate: findColumn(t, ['Calibrated_On', 'Calibration_Date']),
    batchNote: findColumn(t, ['Batch_Note', 'Notes', 'Note']),
    cols: findColumn(t, ['Columns', 'Cols', 'Across']),
    rows: findColumn(t, ['Rows', 'Down']),
    pitchX: findColumn(t, ['Pitch_X_In', 'Horizontal_Pitch_In', 'Pitch_X']),
    pitchY: findColumn(t, ['Pitch_Y_In', 'Vertical_Pitch_In', 'Pitch_Y']),
    dia: findColumn(t, ['Label_Diameter_In', 'Diameter_In', 'Diameter']),
    fontPt: findColumn(t, ['Name_Font_Size_Pt', 'Font_Size_Pt']),
    ringPt: findColumn(t, ['Ring_Font_Size_Pt']),
    ringRatio: findColumn(t, ['Ring_Radius_Ratio']),
    scaleX: findColumn(t, ['Scale_X', 'X_Scale']),
    scaleY: findColumn(t, ['Scale_Y', 'Y_Scale', 'Feed_Scale']),
  };
  if (!c.code) {
    problems.push({ title: 'Label_Templates has no stock-code column',
      body: 'Add a <strong>Stock_Code</strong> column (e.g. OL3012WI). Batches group by fiber until then.' });
    return;
  }
  S.cols.tpl = c;
  S.hasTemplates = true;
  (t.id || []).forEach((id, i) => {
    const code = normalize(columnAsArray(t, c.code)[i]);
    if (!code) return;
    const fibers = String(columnAsArray(t, c.fibers)[i] || '')
      .split(/[,;/|\s]+/).map(normalize).filter(Boolean);
    const tpl = {
      id, code, fibers,
      desc: c.desc ? columnAsArray(t, c.desc)[i] || '' : '',
      perSheet: c.perSheet ? Number(columnAsArray(t, c.perSheet)[i]) || null : null,
      left: c.left ? columnAsArray(t, c.left)[i] : null,
      top: c.top ? columnAsArray(t, c.top)[i] : null,
      bleed: c.bleed ? columnAsArray(t, c.bleed)[i] : null,
      reverse: c.reverse ? !!columnAsArray(t, c.reverse)[i] : false,
      calDate: c.calDate ? columnAsArray(t, c.calDate)[i] : null,
      batchNote: c.batchNote ? columnAsArray(t, c.batchNote)[i] || '' : '',
      cols: c.cols ? Number(columnAsArray(t, c.cols)[i]) || null : null,
      rows: c.rows ? Number(columnAsArray(t, c.rows)[i]) || null : null,
      pitchX: c.pitchX ? Number(columnAsArray(t, c.pitchX)[i]) || null : null,
      pitchY: c.pitchY ? Number(columnAsArray(t, c.pitchY)[i]) || null : null,
      dia: c.dia ? Number(columnAsArray(t, c.dia)[i]) || null : null,
      fontPt: c.fontPt ? Number(columnAsArray(t, c.fontPt)[i]) || null : null,
      ringPt: c.ringPt ? Number(columnAsArray(t, c.ringPt)[i]) || null : null,
      ringRatio: c.ringRatio ? Number(columnAsArray(t, c.ringRatio)[i]) || null : null,
      scaleX: c.scaleX ? Number(columnAsArray(t, c.scaleX)[i]) || null : null,
      scaleY: c.scaleY ? Number(columnAsArray(t, c.scaleY)[i]) || null : null,
    };
    S.templates.push(tpl);
    fibers.forEach(f => { if (!S.tplByFiber[f]) S.tplByFiber[f] = tpl; });
  });
}

/* Fit and size are remembered per customer AND per sheet: a mark that reads
   well at 1.25" often needs different treatment at 1", so one setting on the
   customer isn't enough. Missing table just means nothing is remembered. */
async function loadLabelSettings() {
  S.labelSettings = []; S.clsCols = null;
  try {
    const t = await grist.docApi.fetchTable('Customer_Label_Settings');
    const c = {
      cust: findColumn(t, ['Customer', 'Customer_ID']),
      stock: findColumn(t, ['Stock_Code', 'Label_Stock', 'Code']),
      fit: findColumn(t, ['Fit', 'Logo_Fit', 'Front_Logo_Fit']),
      scale: findColumn(t, ['Scale', 'Logo_Scale', 'Front_Logo_Scale']),
    };
    if (!c.cust || !c.stock) return;
    S.clsCols = c;
    (t.id || []).forEach((id, i) => {
      S.labelSettings.push({
        id,
        custId: getRefId(columnAsArray(t, c.cust)[i]),
        stock: normalize(columnAsArray(t, c.stock)[i]),
        fit: c.fit ? String(columnAsArray(t, c.fit)[i] || '') : '',
        scale: c.scale ? Number(columnAsArray(t, c.scale)[i]) || 0 : 0,
      });
    });
  } catch (e) {
    // table absent — fit and size fall back to the customer, then to defaults
  }
}
/* The sheet dropdown falls back to the first template for display, so state
   and display must resolve identically — otherwise a saved setting is only
   found once the dropdown has been touched. */
function frontTpl() {
  return S.templates.find(t => t.code === S.frontStock) || S.templates[0] || null;
}
function savedSetting() {
  const t = frontTpl();
  if (!S.frontCust || !t) return null;
  return S.labelSettings.find(r => r.custId === S.frontCust.id
    && r.stock === normalize(t.code)) || null;
}

function setBanner(items) {
  const el = document.getElementById('banner');
  if (!items || !items.length) { el.innerHTML = ''; el.className = ''; return; }
  el.className = 'banner';
  el.innerHTML = items.map(i => `<div class="banner-title">${esc(i.title)}</div><div>${i.body}</div>`).join('<div style="height:7px"></div>');
}

/* ---------- rows & grouping ---------- */
function currentRows() {
  if (S.mode === 'order') {
    if (!S.selectedOrderId) return [];
    return S.lines.filter(l => l.woId === S.selectedOrderId && l.qty > 0).map(l => {
      const r = S.recipes[l.recipeId] || null;
      return {
        rowKey: 'L' + l.id, recipeId: l.recipeId,
        name: r ? r.name : (l.productName || l.sku || '(unmatched SKU)'),
        sku: (r && r.sku) || l.sku, fiber: r ? r.fiber : '',
        sheetOnHand: r ? r.sheetOnHand : false, matched: !!r,
        defaultQty: l.qty, stock: r ? r.stock : 0,
      };
    });
  }
  return Object.values(S.recipes).filter(r => r.storeActive)
    .sort((a, b) => String(a.name).localeCompare(String(b.name)))
    .map(r => ({
      rowKey: 'R' + r.id, recipeId: r.id, name: r.name, sku: r.sku, fiber: r.fiber,
      sheetOnHand: r.sheetOnHand, matched: true, defaultQty: S.storeQtyDefault, stock: r.stock,
    }));
}
function stateFor(row) {
  if (!S.rowState[row.rowKey]) S.rowState[row.rowKey] = { include: !row.sheetOnHand, qty: row.defaultQty };
  return S.rowState[row.rowKey];
}
function effectiveQty(row) {
  const st = stateFor(row);
  if (!st.include || row.sheetOnHand) return 0;
  return Math.max(0, Number(st.qty) || 0);
}

// Fiber alone decides the sheet: Label_Templates.Fiber_Codes is the whole
// mapping. Nothing customer-specific enters here.
function templateForRow(row) {
  return S.tplByFiber[fiberCode(row.fiber)] || null;
}

function groupRows(rows) {
  const map = new Map();
  rows.forEach(r => {
    const tpl = templateForRow(r);
    const key = tpl ? tpl.code : ('?' + (fiberCode(r.fiber) || 'UNKNOWN'));
    if (!map.has(key)) {
      map.set(key, {
        key, tpl,
        code: tpl ? tpl.code : '',
        fallbackFiber: tpl ? '' : (fiberCode(r.fiber) || 'no fiber set'),
        rows: [],
      });
    }
    map.get(key).rows.push(r);
  });
  const groups = [...map.values()];
  groups.forEach(g => { g.total = g.rows.reduce((a, r) => a + effectiveQty(r), 0); });
  groups.sort((a, b) => (a.tpl ? 0 : 1) - (b.tpl ? 0 : 1) || String(a.key).localeCompare(String(b.key)));
  return groups;
}

/* ---------- render ---------- */
function render() {
  if (!S.ready) return;
  document.getElementById('pane').innerHTML =
    S.mode === 'order' ? orderPaneHtml() : S.mode === 'front' ? frontPaneHtml() : storePaneHtml();
  bindPane();
  updateFooter();
}
function currentOrder() { return S.orders.find(o => o.id === S.selectedOrderId) || null; }
function customerForOrder(o) {
  if (!o) return null;
  if (o.custId && S.customers[o.custId]) return S.customers[o.custId];
  return S.custByName[normalize(o.custName)] || null;
}

function orderPickerHtml() {
  const q = S.orderSearch.trim().toLowerCase();
  const matches = S.orders.filter(o => !q || (String(o.num) + ' ' + String(o.custName)).toLowerCase().includes(q)).slice(0, 40);
  const listHtml = matches.length ? matches.map(o => `<div class="order-row ${o.id === S.selectedOrderId ? 'active' : ''}" data-order="${o.id}">
      <span class="ord-num">${esc(o.num || '—')}</span>
      <span class="ord-cust">${esc(o.custName || '')}</span>
      <span class="ord-meta">${esc(fmtDate(o.date))}${o.status ? ' · ' + esc(o.status) : ''}</span>
    </div>`).join('') : '<div class="empty-note">No orders match.</div>';
  return `<div class="pick-box">
    <div class="pick-row"><input id="orderSearch" placeholder="Search order number or customer..." value="${esc(S.orderSearch)}"></div>
    <div class="order-list">${listHtml}</div>
  </div>`;
}

function orderPaneHtml() {
  const o = currentOrder();
  if (!o) return orderPickerHtml();
  const cust = customerForOrder(o);
  const rows = currentRows();
  const groups = groupRows(rows);
  const customBack = cust && /custom/i.test(String(cust.back || ''));
  const unmatched = rows.filter(r => !r.matched);

  return orderPickerHtml() + profileHtml(cust, o) +
    (customBack ? `<div class="alert"><strong>Custom back design.</strong> ${esc(cust.name)} doesn't take the standard colorway-name back.
      ${cust.notes ? 'Notes: ' + esc(cust.notes) : 'No label notes recorded — check the Customer Card.'}</div>` : '') +
    (unmatched.length ? `<div class="alert"><strong>${unmatched.length} line${unmatched.length === 1 ? '' : 's'} had no matching recipe.</strong>
      The SKU isn't in Recipes, so there's no colorway name and no fiber to pick a sheet from. Fix the SKU or link the recipe.</div>` : '') +
    (groups.length ? groups.map(g => groupHtml(g)).join('') : '<div class="empty-note">Nothing on this order to label.</div>') +
    frontSummaryHtml(rows, cust);
}

function storePaneHtml() {
  const rows = currentRows();
  if (!rows.length) {
    return `<div class="empty-note">No recipes are marked active on the store. Tick <strong>Store_Listing_Active</strong> on the recipes you're listing, or add that column to Recipes.</div>`;
  }
  const groups = groupRows(rows);
  return `<div class="pick-box">
      <div class="pick-row" style="gap:12px;flex-wrap:wrap;">
        <label style="font-size:11px;color:var(--mid);display:flex;align-items:center;gap:6px;">Labels per colorway
          <input class="qty-input" id="storeDefault" value="${esc(S.storeQtyDefault)}"></label>
        <button class="btn tiny" id="applyDefault">Apply to all</button>
        <button class="btn tiny" id="useStock">Use stock counts</button>
        <button class="btn tiny" id="selectAll">Select all</button>
        <button class="btn tiny" id="selectNone">Select none</button>
      </div>
    </div>` + groups.map(g => groupHtml(g)).join('');
}

function profileHtml(cust, o) {
  if (!cust) return `<div class="profile"><div class="pf"><div class="pf-label">Customer</div>
    <div class="pf-value warn">${esc(o.custName || 'Unknown')} — not linked to a Customers row</div></div></div>`;
  const pf = (l, v, cls) => `<div class="pf"><div class="pf-label">${esc(l)}</div><div class="pf-value ${cls || ''}">${esc(v)}</div></div>`;
  return `<div class="profile">
    ${pf('Customer', cust.name + (cust.code ? ' (' + cust.code + ')' : ''))}
    ${cust.front ? pf('Front of spool', cust.front) : pf('Front of spool', 'not set', 'dim')}
    ${cust.back ? pf('Back of spool', cust.back) : pf('Back of spool', 'not set', 'dim')}
    ${pf('Order', (o.num || '—') + (o.due ? ' · due ' + fmtDate(o.due) : ''))}
  </div>`;
}

function calibHtml(tpl) {
  if (!tpl) return '';
  const has = tpl.left !== null && tpl.left !== undefined && tpl.left !== '';
  const open = S.openCalib === tpl.id;
  const vals = has
    ? `<span class="calib-vals">left <b>${esc(tpl.left)}"</b> · top <b>${esc(tpl.top)}"</b> · bleed <b>${esc(tpl.bleed)}"</b> · reverse <b>${tpl.reverse ? 'yes' : 'no'}</b></span>
       ${tpl.calDate ? `<span class="calib-date">set ${esc(fmtDate(tpl.calDate))}${tpl.batchNote ? ' · ' + esc(tpl.batchNote) : ''}</span>` : ''}`
    : `<span class="calib-missing">no calibration recorded for this sheet</span>`;
  return `<div class="calib">
      <span style="font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;">Page setup</span>
      ${vals}
      <button class="btn tiny" style="margin-left:auto;" data-calib="${tpl.id}">${open ? 'Close' : 'Recalibrate'}</button>
    </div>
    <div class="calib-form ${open ? 'open' : ''}" data-calibform="${tpl.id}">
      <div class="calib-fields">
        <div class="calib-field"><label>Left margin (in)</label><input type="text" data-cf="left" value="${esc(tpl.left ?? '')}"></div>
        <div class="calib-field"><label>Top margin (in)</label><input type="text" data-cf="top" value="${esc(tpl.top ?? '')}"></div>
        <div class="calib-field"><label>Bleed (in)</label><input type="text" data-cf="bleed" value="${esc(tpl.bleed ?? '')}"></div>
        <div class="calib-field"><label>Reverse print</label><div style="padding:6px 0;"><input type="checkbox" data-cf="reverse" ${tpl.reverse ? 'checked' : ''}></div></div>
        <div class="calib-field" style="flex:1;min-width:170px;"><label>Which pack of sheets</label>
          <input type="text" data-cf="batchNote" value="${esc(tpl.batchNote || '')}" placeholder="e.g. box opened July 2026" style="width:100%;"></div>
        <button class="btn solid" data-calibsave="${tpl.id}">Save calibration</button>
      </div>
      <div class="calib-note">Copy these into Maestro under <strong>File → Page Setup</strong> before printing. Saving stamps today's date, so when a print comes out crooked you can see whether the numbers changed since the last good run.</div>
    </div>`;
}

function groupHtml(g) {
  const tpl = g.tpl;
  const rows = g.rows;
  const geom = pdfGeometry(tpl);
  // How many positions the last sheet leaves unused, and which rings could fill them.
  const perSheet = geom.ok ? geom.cols * geom.rows : 0;
  const used = perSheet ? (g.total + (Number(S.startAt[g.key]) || 1) - 1) % perSheet : 0;
  const leftover = perSheet && g.total && used ? perSheet - used : 0;
  const fillOpts = fibersForTemplate(tpl);
  const gFibers = fibersInGroup(g);
  const hasSheetCol = !!S.cols.recipe.sheet;
  const body = rows.map(r => {
    const st = stateFor(r);
    const printing = effectiveQty(r);
    return `<tr class="${printing ? '' : 'skipped'}" data-row="${esc(r.rowKey)}">
      <td class="col-chk"><input type="checkbox" data-include="${esc(r.rowKey)}" ${st.include ? 'checked' : ''} ${r.sheetOnHand ? 'disabled' : ''}></td>
      <td><div class="colorway">${esc(r.name)}</div><div class="sku">${esc(r.sku || '')}</div></td>
      <td>${r.fiber ? `<span class="fiber-tag">${esc(fiberCode(r.fiber) || r.fiber)}</span>` : ''}</td>
      <td class="col-num"><input class="qty-input" data-qty="${esc(r.rowKey)}" value="${esc(st.qty)}"></td>
      <td class="col-stock">
        <div class="stock-cell ${hasSheetCol ? '' : 'disabled'}">
          <label><input type="checkbox" data-sheet="${esc(r.recipeId || '')}" ${r.sheetOnHand ? 'checked' : ''} ${hasSheetCol && r.recipeId ? '' : 'disabled'}> sheet on hand</label>
        </div>${r.stock ? `<div class="hint-num">${r.stock} in stock</div>` : ''}
      </td>
      <td class="col-num num print ${printing ? '' : 'zero'}">${printing}</td>
    </tr>`;
  }).join('');

  const sheetsNeeded = tpl && tpl.perSheet && g.total ? Math.ceil(g.total / tpl.perSheet) : null;

  return `<div class="group ${tpl ? '' : 'unassigned'}">
    <div class="group-head">
      <span class="group-code">${tpl ? esc(tpl.code) : 'No sheet assigned'}</span>
      ${tpl && tpl.desc ? `<span class="group-desc">${esc(tpl.desc)}</span>` : ''}
      <span class="group-fibers">${[...new Set(rows.map(r => fiberCode(r.fiber)).filter(Boolean))].map(f => `<span class="fiber-tag">${esc(f)}</span>`).join('')}</span>
      ${gFibers.length > 1 ? `<span class="group-desc" style="color:var(--gold);">mixed fibers — one PDF sheet, ${gFibers.length} separate CSV merges</span>` : ''}
      ${!tpl ? `<span class="group-desc" style="color:var(--accent);">${esc(g.fallbackFiber)} isn't mapped to a stock code — add it to Fiber_Codes on Label_Templates</span>` : ''}
      ${sheetsNeeded ? `<span class="group-head-right"><span class="group-desc">${sheetsNeeded} sheet${sheetsNeeded === 1 ? '' : 's'} at ${tpl.perSheet}/sheet</span></span>` : ''}
    </div>
    ${calibHtml(tpl)}
    <table class="lbl">
      <thead><tr><th class="col-chk"></th><th>Colorway</th><th>Fiber</th><th class="col-num">Qty</th><th class="col-stock">Printed stock</th><th class="col-num">Print</th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="group-foot">
      <div class="group-total"><strong data-grouptotal="${esc(g.key)}">${g.total}</strong> labels on this sheet type</div>
      ${geom.ok ? `<label class="start-at" title="Skip this many positions so a part-used sheet gets finished">
        start at <input class="qty-input" data-startat="${esc(g.key)}" value="${esc(S.startAt[g.key] || 1)}"> of ${geom.cols * geom.rows}
      </label>` : ''}
      ${geom.ok && leftover ? `<label class="start-at" title="Print rings with no name on the unused positions, to write on by hand">
        ${leftover} spare: <select data-fill="${esc(g.key)}">
          <option value="">leave empty</option>
          ${fillOpts.map(f => `<option value="${esc(f)}" ${S.fillBlanks[g.key] === f ? 'selected' : ''}>blank ${esc(f)} rings</option>`).join('')}
        </select>
      </label>` : ''}
      <div class="group-foot-actions">
        <button class="btn tiny" data-copy="${esc(g.key)}">Copy</button>
        <button class="btn" data-csv="${esc(g.key)}" ${g.total ? '' : 'disabled'}
          title="${gFibers.length > 1 ? esc(gFibers.length + ' files, one per fiber (each needs its own Maestro design)') : 'One merge file'}">CSV${gFibers.length > 1 ? ' \u00d7' + gFibers.length : ''}</button>
        <button class="btn solid" data-pdf="${esc(g.key)}" ${g.total && geom.ok ? '' : 'disabled'}
          ${geom.ok ? '' : `title="Add to Label_Templates: ${esc(geom.missing.join(', '))}"`}>Download PDF</button>
      </div>
    </div>
    ${geom.ok ? '' : `<div class="geom-warn">PDF needs geometry on <strong>${esc(g.code || 'this template')}</strong> — missing ${esc(geom.missing.join(', '))}. CSV still works.</div>`}
  </div>`;
}

function frontSummaryHtml(rows, cust) {
  const total = rows.reduce((a, r) => a + effectiveQty(r), 0);
  if (!total || !cust) return '';
  return `<div class="front-summary">

/* ---------- PDF generation ----------
   Draws the sheet directly rather than handing data to Maestro. The win is
   `startAt`: a half-used sheet gets finished instead of being thrown away,
   which is where sheet labels quietly waste the most money.                  */

// "Made in USA • 100% Nylon • Size E • 137 Meters / 150 Yards"
function ringText(fiber) {
  const spec = RING_SPEC[fiberCode(fiber)];
  if (!spec) return null;
  const yd = yardsPerSpool(fiber);
  const m = Math.round(yd * METRES_PER_YARD);
  return `Made in USA \u2022 ${spec.material} \u2022 Size ${spec.size} \u2022 ${m} Meters / ${yd} Yards`;
}

/* Lays the string around the full circle, one character at a time, each rotated
   to sit tangent to the path. Character angles are proportional to glyph width
   so spacing stays even, and the string is scaled to close the loop exactly —
   which is why a longer string ("150 Yards") still fits without adjustment.
   Midpoint sits at 12 o'clock, matching the existing Maestro design.          */
function drawRingText(doc, text, cx, cy, dia, fontPt, ratio) {
  const chars = [...(text + ' \u2022 ')];   // trailing bullet closes the loop
  doc.setFontSize(fontPt);
  const widths = chars.map(ch => doc.getTextWidth(ch));
  const total = widths.reduce((a, b) => a + b, 0);
  if (!total) return;
  const radius = dia * (ratio > 0 ? ratio : RING_RADIUS_RATIO);
  let acc = 0;
  chars.forEach((ch, i) => {
    const frac = (acc + widths[i] / 2) / total;
    acc += widths[i];
    if (ch === ' ') return;
    const theta = (frac - 0.5) * 360;             // degrees clockwise from top
    const rad = theta * Math.PI / 180;
    const x = cx + radius * Math.sin(rad);
    const y = cy - radius * Math.cos(rad);
    doc.text(ch, x, y, { angle: -theta, align: 'center', baseline: 'middle' });
  });
}

// Fibers this stock can carry: whatever Fiber_Codes lists, restricted to
// fibers that actually have ring text defined.
function fibersForTemplate(tpl) {
  if (!tpl) return [];
  const listed = (tpl.fibers || []).filter(f => RING_SPEC[f]);
  return listed.length ? listed : Object.keys(RING_SPEC);
}

// Every geometry field the generator needs, or a list of what's missing.
function pdfGeometry(tpl) {
  if (!tpl) return { ok: false, missing: ['a Label_Templates row'] };
  const need = {
    Columns: tpl.cols, Rows: tpl.rows,
    Pitch_X_In: tpl.pitchX, Pitch_Y_In: tpl.pitchY,
    Label_Diameter_In: tpl.dia,
    Left_Margin_In: tpl.left, Top_Margin_In: tpl.top,
  };
  const missing = Object.keys(need).filter(k => !(Number(need[k]) > 0));
  if (missing.length) return { ok: false, missing };
  return {
    ok: true,
    cols: Number(tpl.cols), rows: Number(tpl.rows),
    pitchX: Number(tpl.pitchX), pitchY: Number(tpl.pitchY),
    dia: Number(tpl.dia),
    left: Number(tpl.left), top: Number(tpl.top),
    fontPt: Number(tpl.fontPt) > 0 ? Number(tpl.fontPt) : 7.5,
    ringPt: Number(tpl.ringPt) > 0 ? Number(tpl.ringPt) : Number(tpl.dia) * 72 * RING_FONT_RATIO,
    ringRatio: Number(tpl.ringRatio) > 0 ? Number(tpl.ringRatio) : RING_RADIUS_RATIO,
    /* Printer feed correction. A printer whose rollers run 0.5% large stretches
       everything down the page — fine at row 1, worst at the last row. Scale_Y
       is measured/nominal, so we pre-shrink by dividing. Horizontal is usually
       exact because the carriage places it optically, but Scale_X is here for
       the printer where it isn't.                                            */
    scaleX: Number(tpl.scaleX) > 0 ? Number(tpl.scaleX) : 1,
    scaleY: Number(tpl.scaleY) > 0 ? Number(tpl.scaleY) : 1,
  };
}

/* Name fitting, in order of preference:
     1. one line at full size
     2. two lines at full size, split at the word break that balances them best
     3. two lines, shrinking only as far as needed
   Wrapping before shrinking because two lines of 8.5pt read better on a spool
   than one line of 6.5pt. Chord width is used rather than the flat clear width,
   since a second line sits off-centre where the circle is narrower.           */
function nameChordWidth(dia, pt, lineCount, lineIndex, ringRatio) {
  // Name space is defined by where the ring sits, so pulling the ring inward
  // for more edge padding correctly tightens the name too.
  const r = ringRatio > 0 ? ringRatio : RING_RADIUS_RATIO;
  const clearR = dia * (NAME_FIT_RATIO / 2) * (r / RING_RADIUS_RATIO);
  if (lineCount < 2) return clearR * 2;
  const lead = pt * NAME_LINE_HEIGHT / 72;
  const offset = Math.abs((lineIndex - (lineCount - 1) / 2) * lead) + pt * 0.36 / 72;
  const inner = clearR * clearR - offset * offset;
  return inner > 0 ? 2 * Math.sqrt(inner) : 0;
}

// Break at whichever word gap leaves the two lines closest in width.
function splitTwo(doc, words) {
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
    const diff = Math.abs(doc.getTextWidth(a) - doc.getTextWidth(b));
    if (!best || diff < best.diff) best = { diff, lines: [a, b] };
  }
  return best ? best.lines : [words.join(' ')];
}

function fitName(doc, name, dia, basePt, ringRatio) {
  const words = name.trim().split(/\s+/);
  for (let pt = basePt; pt >= 5; pt -= 0.25) {
    doc.setFontSize(pt);
    if (doc.getTextWidth(name) <= nameChordWidth(dia, pt, 1, 0, ringRatio)) return { lines: [name], pt };
    if (words.length > 1) {
      const lines = splitTwo(doc, words);
      if (lines.every((ln, i) => doc.getTextWidth(ln) <= nameChordWidth(dia, pt, 2, i, ringRatio))) {
        return { lines, pt };
      }
    }
  }
  doc.setFontSize(5);
  return { lines: words.length > 1 ? splitTwo(doc, words) : [name], pt: 5 };
}

/* One entry per physical label. Sorted by fiber first so a mixed FFN/FFC sheet
   comes off the printer in blocks rather than interleaved — you peel all the
   cotton, then all the nylon, instead of hunting across the sheet.           */
function expandLabels(group) {
  const rows = group.rows.slice().sort((a, b) =>
    String(fiberCode(a.fiber)).localeCompare(String(fiberCode(b.fiber))) ||
    String(a.name).localeCompare(String(b.name)));
  const out = [];
  rows.forEach(r => {
    const q = effectiveQty(r);
    for (let i = 0; i < q; i++) out.push(r);
  });
  return out;
}

// Distinct fibers actually being printed in this group.
function fibersInGroup(g) {
  return [...new Set(g.rows.filter(r => effectiveQty(r) > 0)
    .map(r => fiberCode(r.fiber) || 'GEN'))].sort();
}

async function buildPdf(group) {
  const g = pdfGeometry(group.tpl);
  if (!g.ok) {
    showToast('Missing on Label_Templates: ' + g.missing.join(', '), true);
    return;
  }
  if (!window.jspdf || !window.jspdf.jsPDF) {
    showToast('PDF library did not load — check the network and refresh.', true);
    return;
  }

  const labels = expandLabels(group);
  if (!labels.length) return;

  const startAt = Math.max(1, Math.min(g.cols * g.rows, Number(S.startAt[group.key]) || 1));
  const perSheet = g.cols * g.rows;
  const proof = !!S.proof;

  // A fiber with no RING_SPEC entry still prints, just without the ring.
  const fibers = [...new Set(labels.map(r => fiberCode(r.fiber) || 'GEN'))];
  const missingArt = fibers.filter(f => !ringText(f));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'in', format: 'letter', compress: true });
  doc.setFont(NAME_FONT[0], NAME_FONT[1]);

  /* Calibration marks: crosses at exact, known distances from the page edge.
     Die cuts are white-on-white and effectively unmeasurable, so instead of
     trying to see them, measure paper-edge -> cross with a ruler. The gap
     between what you measure and what's printed beside it IS the printer
     offset, and it goes straight onto the margins.                          */
  if (proof) {
    doc.setDrawColor(120); doc.setLineWidth(0.004);
    doc.setFontSize(6); doc.setTextColor(120);
    doc.setFont(NAME_FONT[0], 'normal');
    [[0.5, 0.5], [8.0, 0.5], [0.5, 10.5], [8.0, 10.5]].forEach(([mx, my]) => {
      const px = mx / g.scaleX, py = my / g.scaleY;
      doc.line(px - 0.15, py, px + 0.15, py);
      doc.line(px, py - 0.15, px, py + 0.15);
      doc.text(`${mx}" , ${my}"`, px, py - 0.22, { align: 'center' });
    });
    doc.setFontSize(7);
    doc.text('Edge to cross = offset (fix margins). Cross to cross should be 7.500" across, 10.000" down (fix Scale_X / Scale_Y).',
      4.25 / g.scaleX, 0.22 / g.scaleY, { align: 'center' });
    doc.setTextColor(0);
  }

  const shrunk = new Set();   // names that wouldn't fit at full size
  let slot = startAt - 1;   // 0-based position on the current sheet
  labels.forEach((r, idx) => {
    if (idx > 0 && slot === 0) doc.addPage();
    const col = slot % g.cols;
    const row = Math.floor(slot / g.cols);
    const cx = (g.left + col * g.pitchX + g.dia / 2) / g.scaleX;
    const cy = (g.top + row * g.pitchY + g.dia / 2) / g.scaleY;

    if (proof) {
      doc.setDrawColor(200); doc.setLineWidth(0.005);
      doc.circle(cx, cy, g.dia / 2, 'S');
    }

    const rt = ringText(r.fiber);
    if (rt) drawRingText(doc, rt, cx, cy, g.dia, g.ringPt, g.ringRatio);

    // Shrink long colorway names to stay inside the ring rather than
    // letting them run under the curved text.
    doc.setFont(NAME_FONT[0], NAME_FONT[1]);
    doc.setTextColor(0);
    const fit = fitName(doc, String(r.name), g.dia, g.fontPt, g.ringRatio);
    if (fit.pt < g.fontPt) shrunk.add(r.name);
    // Two lines straddle the centre; one line sits on it.
    const lead = fit.pt * NAME_LINE_HEIGHT / 72;
    const y0 = cy - lead * (fit.lines.length - 1) / 2;
    fit.lines.forEach((ln, li) => {
      doc.text(ln, cx, y0 + li * lead, { align: 'center', baseline: 'middle' });
    });

    slot = (slot + 1) % perSheet;
  });

  /* Fill the tail of the last sheet with ring-only labels. No centre text —
     the colorway gets written on by hand. Nothing is re-fed through the
     printer, so the remainder of the sheet stops being offcut.               */
  let blanks = 0;
  const fillCode = S.fillBlanks[group.key];
  const fillRing = fillCode ? ringText(fillCode) : null;
  if (fillRing && slot !== 0) {
    doc.setFont(NAME_FONT[0], NAME_FONT[1]);
    while (slot !== 0) {
      const col = slot % g.cols;
      const row = Math.floor(slot / g.cols);
      const cx = (g.left + col * g.pitchX + g.dia / 2) / g.scaleX;
      const cy = (g.top + row * g.pitchY + g.dia / 2) / g.scaleY;
      if (proof) {
        doc.setDrawColor(200); doc.setLineWidth(0.005);
        doc.circle(cx, cy, g.dia / 2, 'S');
      }
      drawRingText(doc, fillRing, cx, cy, g.dia, g.ringPt, g.ringRatio);
      blanks++;
      slot = (slot + 1) % perSheet;
    }
  }

  const stamp = new Date().toISOString().slice(0, 10);
  const stock = (group.code || ('fiber-' + group.fallbackFiber)).replace(/[^A-Za-z0-9_-]/g, '');
  const o = currentOrder();
  const base = S.mode === 'order'
    ? `labels_order-${String((o && o.num) || 'batch').replace(/[^A-Za-z0-9_-]/g, '')}_${stock}`
    : `labels_store-listings_${stock}`;
  doc.save(`${base}_${stamp}.pdf`);

  const sheets = Math.ceil((labels.length + startAt - 1) / perSheet);
  let msg = `${labels.length} labels over ${sheets} sheet${sheets === 1 ? '' : 's'}`;
  if (startAt > 1) msg += `, starting at position ${startAt}`;
  if (blanks) msg += ` + ${blanks} blank ${fillCode} ring${blanks === 1 ? '' : 's'} to hand-write`;
  if (shrunk.size) msg += ` — ${shrunk.size} name${shrunk.size === 1 ? '' : 's'} shrunk to fit (${[...shrunk].slice(0, 2).join(', ')}${shrunk.size > 2 ? '...' : ''})`;
  if (missingArt.length) msg += ` — no ring spec for ${missingArt.join(', ')}, names only`;
  showToast(msg + '.', missingArt.length > 0);
}

/* ---------- front labels ----------
   A logo sheet is one customer, one image, N identical labels. No merge data,
   which is exactly why fronts never appear in the CSV. Bleed matters here in a
   way it never did for the back: a solid image must overrun the die cut or a
   hair of misregistration leaves a white crescent.                            */

const logoCache = {};

// Grist stores an Attachments cell as ['L', id, id...]; we want the first.
function attachmentId(v) {
  if (Array.isArray(v) && v[0] === 'L' && v.length > 1) return v[1];
  if (typeof v === 'number' && v > 0) return v;
  return null;
}

/* A short-lived read-only token lets the widget pull attachments from the
   Grist API across origins. Cached until shortly before it expires.          */
let _tok = null;
async function accessToken() {
  if (_tok && Date.now() < _tok.expires) return _tok;
  const t = await grist.docApi.getAccessToken({ readOnly: true });
  _tok = { ...t, expires: Date.now() + Math.max(10000, (t.ttlMsecs || 60000) - 10000) };
  return _tok;
}

function logoSourceLabel(cust) {
  if (!cust) return '';
  if (cust.logoAtt) return 'Grist attachment #' + cust.logoAtt;
  return cust.logoUrl || '';
}
function logoUrlFor(cust) {
  if (!cust || !cust.logoUrl) return '';
  return /^https?:\/\//i.test(cust.logoUrl) ? cust.logoUrl : 'https://' + cust.logoUrl;
}

async function loadLogo(cust) {
  if (!cust) return null;
  const key = cust.logoAtt ? 'att:' + cust.logoAtt : logoUrlFor(cust);
  if (!key) return null;
  if (key in logoCache) return logoCache[key];
  let url = logoUrlFor(cust);
  try {
    if (cust.logoAtt) {
      const t = await accessToken();
      url = `${t.baseUrl}/attachments/${cust.logoAtt}/download?auth=${encodeURIComponent(t.token)}`;
    }
    const resp = await fetch(url, { cache: 'no-cache' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    const dataUrl = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('read failed'));
      fr.readAsDataURL(blob);
    });
    const dims = await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight });
      im.onerror = () => rej(new Error('decode failed'));
      im.src = dataUrl;
    });
    logoCache[key] = { dataUrl, ...dims };
  } catch (e) {
    console.warn('logo load failed', key, e);
    logoCache[key] = null;
  }
  return logoCache[key];
}

/* Bleed can never exceed half the gap between die cuts, or a label's artwork
   prints onto its neighbour. Every sheet is clipped to this radius regardless
   of what Bleed_In says.                                                      */
function safeBleed(tpl, g) {
  const gap = Math.min(g.pitchX, g.pitchY) - g.dia;
  const cap = Math.max(0, gap / 2);
  const want = Number(tpl && tpl.bleed) > 0 ? Number(tpl.bleed) : cap;
  return Math.min(want, cap);
}

// session override -> saved for this customer+sheet -> customer default -> computed
function frontFit() {
  if (S.frontFit) return S.frontFit;
  const sv = savedSetting();
  if (sv && sv.fit) return sv.fit;
  return (S.frontCust && S.frontCust.logoFit) || 'Cover';
}
function frontScale(g, tpl) {
  let v = Number(S.frontScale) || 0;
  if (!v) { const sv = savedSetting(); if (sv && sv.scale > 0) v = sv.scale; }
  if (!v) v = (S.frontCust && S.frontCust.logoScale) || 0;
  if (v > 0) return v;
  // Cover defaults out to the bleed edge; contain sits comfortably inside.
  return /contain/i.test(frontFit()) ? 0.85 : (g.dia + 2 * safeBleed(tpl, g)) / g.dia;
}

        <label class="f-lab">Fit ${sv && sv.fit ? '<span class="f-saved">saved</span>' : ''}
          <select class="f-sel" id="fFit">

        <label class="f-lab">Size \u00d7 dia ${sv && sv.scale > 0 ? '<span class="f-saved">saved</span>' : ''}

        <div class="pf"><div class="pf-label">Front setting</div>

      </div>
      ${g.ok ? `<div class="alert" style="background:#E9F2F0;border-color:#B9D8D2;color:#245F55">

async function buildFrontPdf() {
  const tpl = frontTpl();
  const g = pdfGeometry(tpl);
  const c = S.frontCust;
  if (!g.ok || !c) return;
  const logo = await loadLogo(c);
  if (!logo) {
    showToast(c.logoAtt
      ? 'Could not read the attachment — this widget needs Full document access.'
      : 'No artwork for ' + (c.name || 'this customer') + ' — add a file to Front_Logo, or a CORS-enabled Front_Logo_URL.', true);
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'in', format: 'letter', compress: true });
  const perSheet = g.cols * g.rows;
  const qty = Math.max(1, Number(S.frontQty) || 1);
  const startAt = Math.max(1, Math.min(perSheet, Number(S.frontStart) || 1));
  const sb = safeBleed(tpl, g);
  const clipR = g.dia / 2 + sb;
  const target = frontScale(g, tpl) * g.dia;
  const contain = /contain/i.test(frontFit());
  const ar = logo.w / logo.h;
  // contain fits the whole mark inside the target circle; cover fills it.
  let dw, dh;
  if (contain) { if (ar >= 1) { dw = target; dh = target / ar; } else { dh = target; dw = target * ar; } }
  else { if (ar >= 1) { dh = target; dw = target * ar; } else { dw = target; dh = target / ar; } }
  const canClip = typeof doc.clip === 'function' && typeof doc.discardPath === 'function';

  let slot = startAt - 1;
  for (let i = 0; i < qty; i++) {
    if (i > 0 && slot === 0) doc.addPage();
    const col = slot % g.cols, row = Math.floor(slot / g.cols);
    const cx = (g.left + col * g.pitchX + g.dia / 2) / g.scaleX;
    const cy = (g.top + row * g.pitchY + g.dia / 2) / g.scaleY;
    if (canClip) {
      doc.saveGraphicsState();
      doc.circle(cx, cy, clipR, null);
      doc.clip(); doc.discardPath();
    }
    doc.addImage(logo.dataUrl, cx - dw / 2, cy - dh / 2, dw, dh, undefined, 'FAST');
    if (canClip) doc.restoreGraphicsState();
    if (S.proof) {
      doc.setDrawColor(200); doc.setLineWidth(0.005);
      doc.circle(cx, cy, g.dia / 2, 'S');
    }
    slot = (slot + 1) % perSheet;
  }

  const stamp = new Date().toISOString().slice(0, 10);
  doc.save(`front-labels_${String(c.code || c.name).replace(/[^A-Za-z0-9_-]/g, '')}_${tpl.code}_${stamp}.pdf`);
  const sheets = Math.ceil((qty + startAt - 1) / perSheet);
  showToast(`${qty} front labels over ${sheets} sheet${sheets === 1 ? '' : 's'}` +
    (canClip ? '' : ' — clipping unavailable in this browser, artwork not trimmed'));
}

/* ---------- CSV ---------- */
function csvCell(v) {
  const s = (v === null || v === undefined) ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* onlyFiber restricts output to one fiber. The ring is baked into the Maestro
   design, and the ring differs per fiber — so one merge file can only ever be
   one fiber, even when both print on the same physical sheet. The PDF path has
   no such limit because it draws each ring itself.                            */
function buildCsv(g, onlyFiber) {
  const perSpool = document.getElementById('oneRowPerSpool').checked;
  const o = currentOrder();
  const cust = S.mode === 'order' ? customerForOrder(o) : null;
  const headers = ['Name', 'Fiber', 'Yards', 'SKU', 'Customer', 'Order'];
  if (!perSpool) headers.push('Qty');
  const lines = [headers.join(',')];
  g.rows.forEach(r => {
    const qty = effectiveQty(r);
    if (!qty) return;
    if (onlyFiber && (fiberCode(r.fiber) || 'GEN') !== onlyFiber) return;
    const base = [r.name, fiberCode(r.fiber) || r.fiber || '', yardsPerSpool(r.fiber),
      r.sku || '', cust ? cust.name : '', o ? o.num : ''];
    if (perSpool) { for (let i = 0; i < qty; i++) lines.push(base.map(csvCell).join(',')); }
    else lines.push(base.concat([qty]).map(csvCell).join(','));
  });
  return lines.join('\r\n');
}
function csvFilename(g, onlyFiber) {
  const stamp = new Date().toISOString().slice(0, 10);
  let stock = (g.code || ('fiber-' + g.fallbackFiber)).replace(/[^A-Za-z0-9_-]/g, '');
  if (onlyFiber) stock += '_' + onlyFiber;
  if (S.mode === 'order') {
    const o = currentOrder();
    return `labels_order-${String((o && o.num) || 'batch').replace(/[^A-Za-z0-9_-]/g, '')}_${stock}_${stamp}.csv`;
  }
  return `labels_store-listings_${stock}_${stamp}.csv`;
}
function saveCsvFile(name, csv) {
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadGroup(g) {
  if (!g.total) return;
  const fibers = fibersInGroup(g);
  if (fibers.length <= 1) {
    saveCsvFile(csvFilename(g), buildCsv(g));
    return;
  }
  // Mixed sheet: one file per fiber, since each needs its own Maestro design.
  fibers.forEach((f, i) => setTimeout(() => saveCsvFile(csvFilename(g, f), buildCsv(g, f)), i * 400));
  showToast(`${fibers.length} files — one per fiber, because each needs its own Maestro design.`);
}

document.getElementById('csvAllBtn').addEventListener('click', () => {
  const groups = allGroups().filter(g => g.total > 0);
  // Browsers throttle simultaneous downloads, so stagger them.
  groups.forEach((g, i) => setTimeout(() => downloadGroup(g), i * 450));
  showToast(`${groups.length} file${groups.length === 1 ? '' : 's'} downloading — one per sheet type.`);
});
document.getElementById('oneRowPerSpool').addEventListener('change', updateFooter);
document.getElementById('proofMode').addEventListener('change', e => { S.proof = e.target.checked; });
document.getElementById('refreshBtn').addEventListener('click', () => { S.rowState = {}; loadAll(); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  S.mode = t.dataset.mode; S.rowState = {}; S.openCalib = null;
  render();
}));

/* ---------- boot ---------- */
try {
  grist.ready({ requiredAccess: 'full' });
  loadAll();
} catch (e) {
  console.error(e);
  setBanner([{ title: 'Grist plugin API unavailable',
    body: 'The widget loaded but could not reach Grist. Reload the page; if it persists, re-add the custom widget URL.' }]);
  document.getElementById('pane').innerHTML = '<div class="empty-note">Not connected.</div>';
}
</script>
