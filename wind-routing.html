<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --ink: #3A3028; --rule: #DDD3C7; --paper: #FDFBF7;
    --teal: #2A6B6B; --teal-light: #E4F0EF;
    --done-bg: #E8F3E8; --done-text: #2D6A2D;
    --warn-bg: #FBF0E4; --warn-text: #8B5A2A;
    --broken-bg: #F3EAF5; --broken-text: #6B3A7A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 10px; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px;
  }
  .header-title { font-size: 15px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #8B7D72; margin-bottom: 8px; }
  .section-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: #8B7D72; margin: 10px 0 4px;
  }
  .empty-state { text-align: center; color: #8B7D72; padding: 18px 10px; font-size: 12px; line-height: 1.5; }

  .lot-card {
    background: white; border: 1px solid var(--rule); border-radius: 6px;
    padding: 7px 9px; margin-bottom: 4px; cursor: pointer;
  }
  .lot-card:hover { border-color: var(--teal); }
  .lot-card.active { border-color: var(--teal); background: var(--teal-light); }
  .lot-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .lot-number { font-weight: 700; font-size: 13px; }
  .lot-avail { font-size: 12px; font-weight: 700; color: var(--teal); white-space: nowrap; }
  .lot-meta { font-size: 10px; color: #8B7D72; margin-top: 1px; }

  .panel { background: white; border: 1px solid var(--rule); border-radius: 6px; padding: 9px; margin-bottom: 6px; }
  .badge {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 10px; background: #F0E4D4; color: #8B3A2A;
  }
  .badge.kettle { background: var(--teal-light); color: var(--teal); }
  .note { font-size: 10px; color: #8B7D72; font-style: italic; }

  .alloc-row { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
  .alloc-row:last-child { border-bottom: none; }
  .alloc-who { flex: 1; min-width: 0; }
  .alloc-name { font-weight: 600; font-size: 12px; }
  .alloc-meta { font-size: 10px; color: #8B7D72; }
  .alloc-row input {
    width: 58px; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px;
    font-size: 13px; text-align: center;
  }
  .alloc-need { font-size: 10px; color: #8B7D72; white-space: nowrap; min-width: 52px; text-align: right; }

  .broken-row {
    display: flex; align-items: center; gap: 6px; margin-top: 7px; padding: 6px 8px;
    background: var(--broken-bg); border-radius: 5px; font-size: 11px; color: var(--broken-text);
  }
  .broken-row input {
    width: 58px; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px;
    font-size: 13px; text-align: center;
  }
  .stock-row {
    display: flex; align-items: center; gap: 6px; margin-top: 7px; padding: 6px 8px;
    background: var(--teal-light); border-radius: 5px; font-size: 11px; color: var(--teal);
  }
  .stock-row input { width: 58px; padding: 4px 6px; border: 1px solid var(--rule); border-radius: 4px; font-size: 13px; text-align: center; }
  .stock-row select { padding: 3px 5px; border: 1px solid var(--rule); border-radius: 4px; font-size: 11px; background: white; color: var(--teal); }
  .tally { font-size: 11px; margin-top: 7px; padding: 6px 8px; border-radius: 5px; }
  .tally.ok { background: var(--done-bg); color: var(--done-text); }
  .tally.over { background: var(--warn-bg); color: var(--warn-text); }

  button.go {
    width: 100%; margin-top: 8px; padding: 9px; border: none; border-radius: 5px;
    background: var(--teal); color: white; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  button.go:disabled { background: #C3BCB2; cursor: not-allowed; }

  .done-line {
    display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 11px;
    border-radius: 5px; padding: 5px 8px; margin-bottom: 3px;
  }
  .done-line.wound { background: var(--teal-light); color: var(--teal); }
  .done-line.boxed { background: var(--done-bg); color: var(--done-text); }
  .undo-link { color: var(--teal); cursor: pointer; text-decoration: underline; font-size: 10px; white-space: nowrap; }
  .done-line.boxed .undo-link { color: var(--done-text); }
  .warn { background: var(--warn-bg); color: var(--warn-text); border-radius: 5px; padding: 6px 8px; font-size: 11px; margin-bottom: 6px; }


  .search-input { width:100%; padding:8px 10px; border:1px solid var(--rule); border-radius:6px; font-size:13px; margin-bottom:8px; }
  .section-title.muted { color:#B0A596; }
  .viewbar { display:flex; gap:4px; margin-bottom:5px; }
  .viewbtn { flex:1; padding:6px 4px; font-size:11px; font-weight:700; border:1px solid var(--rule);
             border-radius:5px; background:white; color:#8B7D72; cursor:pointer; }
  .viewbtn.on { background:var(--teal); color:white; border-color:var(--teal); }
  .viewbtn .n { opacity:.75; font-weight:600; }
  .view-hint { font-size:10.5px; color:#8B7D72; line-height:1.5; margin-bottom:8px; }

  .bin-card { background:white; border:1px solid var(--rule);
              border-radius:6px; padding:6px 8px; margin-bottom:5px; }
  .bin-head { display:flex; align-items:center; gap:8px; }
  .bin-who { flex:1; min-width:0; }
  .bin-name { font-weight:700; font-size:13px; }
  .bin-meta { font-size:10px; color:#8B7D72; }
  .bin-items { margin-top:4px; }
  .bin-item { display:flex; align-items:center; gap:8px; padding:4px 0;
              border-top:1px solid var(--rule); font-size:12px; color:#5A5048; }
  .bin-item-name { flex:1; min-width:0; }
  .bin-item-qty { font-weight:700; color:var(--teal); }
  .bin-item.done { color:var(--done-text); }
  .bin-item.done .bin-item-name { text-decoration:line-through; opacity:.65; }
  .bin-item-tick { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
                   background:var(--done-bg); color:var(--done-text); border-radius:9px; padding:2px 7px; }
  button.mini { background:var(--teal); color:white; border:0; border-radius:5px; padding:7px 11px;
                font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
  button.mini.ghost { background:white; color:var(--teal); border:1px solid var(--teal); padding:5px 9px; }

  .line-card { background:white; border:1px solid var(--rule); border-radius:6px; padding:5px 8px; margin-bottom:3px; cursor:pointer; }
  .line-card:hover { border-color:var(--teal); }
  .line-card.active { border-color:var(--teal); background:var(--teal-light); }
  .line-card.not-ready { opacity:.7; cursor:default; background:#FBF9F5; }
  .line-top { display:flex; justify-content:space-between; align-items:baseline; gap:6px; }
  .line-who { display:flex; flex-direction:row; align-items:baseline; gap:6px; min-width:0; overflow:hidden; }
  .line-cust { font-weight:700; font-size:13px; white-space:nowrap; }
  .line-color { font-size:11px; color:#8B7D72; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .line-qty { font-size:12px; font-weight:700; color:var(--teal); white-space:nowrap; }
  .line-qty .unit { font-size:9.5px; font-weight:600; opacity:.75; text-transform:uppercase; letter-spacing:.03em; }
  .line-sub { font-size:10px; color:#8B7D72; margin-top:1px; }
  .section-title { margin-top:8px; }
  .drying-note { color:var(--wet-text,#2A5B8B); }
  .tag { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:9px; margin-left:4px; }
  .tag.past { background:#F5D8DC; color:#A01830; }
  .tag.bump { background:#FBECC9; color:#8B6A00; }
  .fill-panel { background:var(--teal-light); border:1px solid var(--teal); border-radius:6px; padding:9px; margin:-2px 0 6px; }
  .lot-line { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid #D6E5E4; }
  .lot-line:last-of-type { border-bottom:none; }
  .lot-line-info { display:flex; flex-direction:column; }
  .lot-line-no { font-weight:700; font-size:12px; }
  .lot-line-src { font-size:10px; color:#5B7B7B; }
  /* The bin chip is the thing someone reads from across the room before
     walking to a shelf, so it is deliberately louder than the lot number. */
  .lot-bin {
    display:inline-block; margin-left:6px; padding:1px 7px; border-radius:4px;
    font-family:'DM Mono', monospace; font-size:12px; font-weight:700;
    background:#2F5D62; color:#fff; letter-spacing:.03em;
  }
  .lot-bin-none { background:#EDE7E0; color:#A89A8C; font-weight:600; }
  .lot-line input { width:56px; padding:4px 6px; border:1px solid var(--rule); border-radius:4px; font-size:13px; text-align:center; }
  .mix-warn { background:#FBECC9; color:#8B5A2A; font-size:10px; border-radius:4px; padding:5px 7px; margin-top:6px; }
  .extra-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; padding:5px 7px; background:var(--broken-bg); border-radius:5px; font-size:11px; color:var(--broken-text); }
  .extra-row.stock { background:white; color:var(--teal); }
  .extra-row input { width:56px; padding:4px 6px; border:1px solid var(--rule); border-radius:4px; font-size:13px; text-align:center; }
  .tally.partial { background:var(--warn-bg); color:var(--warn-text); }
  #toast {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 8px 14px; border-radius: 5px;
    font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="content"><div class="empty-state">Loading...</div></div>
<div id="toast"></div>

<script>
function getRefId(ref) {
  if (ref == null) return null;
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1] || null;
  if (typeof ref === 'object' && ref.rowId) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
function esc(s) { return (s == null ? '' : String(s)).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function dueValue(d) { const n = Number(d); return isFinite(n) && n > 0 ? n : Infinity; }
function fmtDate(v) {
  if (!v) return '';
  const ms = typeof v === 'number' ? v * 1000 : new Date(v).getTime();
  if (!ms || isNaN(ms)) return '';
  return new Date(ms).toLocaleDateString();
}

// Match a column id ignoring case and non-alphanumerics.
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${tableName}.${cands[0]}`);
  }
  return out;
}

const FIBER_NAME_TO_CODE = { 'FF Nylon': 'FFN', 'E Nylon': 'EN', 'FF Cotton': 'FFC', 'Blackwing': 'BW' };
function fiberCode(v) {
  const s = (v || '').toString().trim();
  if (!s) return '';
  if (FIBER_NAME_TO_CODE[s]) return FIBER_NAME_TO_CODE[s];
  const up = s.toUpperCase();
  return ['FFN', 'FFC', 'EN', 'BW'].includes(up) ? up : s;
}
function yardsPerSpool(fiber) { return fiberCode(fiber) === 'EN' ? 150 : 100; }
function todayEpochSeconds() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  return Math.floor(d.getTime() / 1000);
}

/* Winding no longer finishes a line. Spools come off the winder bagged and go
   straight into the customer's order bin, unlabelled; someone labels and boxes
   them later. So winding writes BIN_STATUS, and the "Mark labelled & boxed"
   button writes the packed status.

   BIN_STATUS is hardcoded rather than sniffed from existing data, because on
   the day this ships no allocation carries it yet — sniffing would find only
   the old values and keep collapsing the two steps back into one. */
const BIN_STATUS = 'Wound - Needs Labels';
const PACKED_CANDIDATES = ['Packed', 'Packaged - Shipped', 'Wound'];
/* Kept byte-identical with order-overview.html, quick-log.html and
   label-batch.html. Order matters: "Wound - Needs Labels" contains "Wound",
   so the needs-labels test has to run before the catch-all. */
function allocBucket(status) {
  const s = (status == null ? '' : status).toString();
  if (/unwound|in bin|to wind/i.test(s)) return 'pending';
  if (/needs? labels?|awaiting labels?|unlabel/i.test(s)) return 'wound';
  return 'boxed';
}
function pickPackedStatus(existingValues) {
  for (const c of PACKED_CANDIDATES) if (existingValues.has(c)) return c;
  return 'Packed';
}

let S = { view: 'wind', lines: [], bins: [], selected: null, draw: {}, woundStatus: '', packedStatus: '', brokenCol: null, hasLineLink: true, done: [], boxed: [], cols: null };

async function loadEverything() {
  document.getElementById('content').innerHTML = `<div class="empty-state">Loading...</div>`;
  try {
    const [lotsT, recipesT, allocT, wolT, woT, custT] = await Promise.all([
      grist.docApi.fetchTable('Production_Lots'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Lot_Allocations'),
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Customers'),
    ]);

    const missing = [];
    const opt = cands => ({ cands, required: false });
    const LOT = resolveCols(lotsT, 'Production_Lots', {
      lotNumber: ['Lot_Number'], recipe: ['Recipe'],
      spoolsMade: opt(['Spools_Made']), yardsMade: opt(['Total_Yards_Made']),
      drying: opt(['Drying_Status']), fiber: opt(['Fiber']),
      storeStock: opt(['Store_Stock_Spools']), vendorStock: opt(['Vendor_Stock_Spools']),
      generalStock: opt(['General_Stock_Spools']),
      broken: opt(['Broken_Spools', 'Broken_Spool_Count']),
      date: opt(['Date_Dyed']),
      bin: opt(['Storage_Bin']),
    }, missing);
    const REC = resolveCols(recipesT, 'Recipes', {
      name: ['Recipe_Name'], fiber: opt(['Fiber_Type']), sku: opt(['SKU_Base']),
      method: opt(['Dye_Method']),
    }, missing);

    /* Where each lot physically sits. Fetched separately and swallowed on
       failure on purpose: Storage_Locations is new, and a doc that hasn't got
       it yet must still be able to wind. No table, or no Storage_Bin column,
       just means no bin chip — never a broken widget. */
    let binById = {};
    try {
      const binsT = await grist.docApi.fetchTable('Storage_Locations');
      const BIN = resolveCols(binsT, 'Storage_Locations', { code: ['Bin_Code'] }, []);
      if (BIN.code) {
        (binsT.id || []).forEach((id, i) => {
          binById[id] = (columnAsArray(binsT, BIN.code)[i] || '').toString();
        });
      }
    } catch (e) {
      console.warn('Storage_Locations not available — bin locations hidden.', e);
    }
    const ALLOC = resolveCols(allocT, 'Lot_Allocations', {
      lot: ['Lot'], qty: ['Qty_Spools'], status: ['Status'],
      customer: opt(['Customer']), line: opt(['Work_Order_Line']),
    }, missing);
    const WOL = resolveCols(wolT, 'Work_Order_Lines', {
      workOrder: ['Work_Order'], qtyNeeded: ['Qty_Needed'],
      recipe: opt(['Recipe']), sku: opt(['SKU']),
    }, missing);
    const WO = resolveCols(woT, 'Work_Orders', {
      status: ['Status'], orderNumber: opt(['Order_Number']),
      customerName: opt(['Customer_Name']), customer: opt(['Customer']),
      dueDate: opt(['Due_Date']), bump: opt(['Priority_Bump']),
    }, missing);
    const CUST = resolveCols(custT, 'Customers', { name: opt(['Customer_Name']) }, missing);

    if (missing.length) {
      document.getElementById('content').innerHTML =
        `<div class="empty-state">Can't load — missing columns:<br><br><strong>${[...new Set(missing)].join('<br>')}</strong></div>`;
      return;
    }

    S.brokenCol = LOT.broken;
    S.hasLineLink = !!ALLOC.line;
    S.cols = { LOT, REC, ALLOC, WOL, WO, CUST };

    // Recipes
    const recipeById = {};
    (recipesT.id || []).forEach((id, i) => {
      recipeById[id] = {
        name: columnAsArray(recipesT, REC.name)[i] || `Recipe #${id}`,
        fiber: columnAsArray(recipesT, REC.fiber)[i] || '',
        sku: normalize(columnAsArray(recipesT, REC.sku)[i] || ''),
        method: columnAsArray(recipesT, REC.method)[i] || '',
      };
    });
    const recipeIdBySku = {};
    Object.entries(recipeById).forEach(([id, r]) => { if (r.sku) recipeIdBySku[r.sku] = Number(id); });

    // Customers
    const custIdByName = {};
    (custT.id || []).forEach((id, i) => {
      const n = normalize(columnAsArray(custT, CUST.name)[i]);
      if (n) custIdByName[n] = id;
    });

    // Existing allocations — used both for "already spoken for" and status detection
    const statusValues = new Set();
    const allocs = (allocT.id || []).map((id, i) => {
      const st = columnAsArray(allocT, ALLOC.status)[i] || '';
      if (st) statusValues.add(st.toString());
      return {
        id,
        lotId: getRefId(columnAsArray(allocT, ALLOC.lot)[i]),
        lineId: ALLOC.line ? getRefId(columnAsArray(allocT, ALLOC.line)[i]) : null,
        qty: Number(columnAsArray(allocT, ALLOC.qty)[i]) || 0,
        status: st,
      };
    });
    S.woundStatus = BIN_STATUS;
    S.packedStatus = pickPackedStatus(statusValues);

    // Work orders
    const woInfo = {};
    (woT.id || []).forEach((id, i) => {
      woInfo[id] = {
        active: (columnAsArray(woT, WO.status)[i] || '').toString() === 'Active',
        orderNumber: columnAsArray(woT, WO.orderNumber)[i],
        customerName: columnAsArray(woT, WO.customerName)[i] || '',
        customerId: getRefId(columnAsArray(woT, WO.customer)[i]),
        dueDate: columnAsArray(woT, WO.dueDate)[i],
        bump: WO.bump ? !!columnAsArray(woT, WO.bump)[i] : false,
      };
    });

    // Per-lot free spools, split by rack. Only DRY-rack (or stock) spools are
    // windable; wet-rack spools are shown as "drying", never assignable.
    const DRY = /dry rack|wood rack|overnight|ready to assign/i;
    const WET = /wet rack|metal rack|day rack/i;
    const lotsByRecipe = {};
    (lotsT.id || []).forEach((id, i) => {
      const recipeId = getRefId(columnAsArray(lotsT, LOT.recipe)[i]);
      if (!recipeId) return;
      const recipe = recipeById[recipeId] || { name: `Recipe #${recipeId}`, fiber: '', method: '' };
      let total = Number(columnAsArray(lotsT, LOT.spoolsMade)[i]) || 0;
      if (!total && LOT.yardsMade) total = Math.round((Number(columnAsArray(lotsT, LOT.yardsMade)[i]) || 0) / yardsPerSpool(recipe.fiber));
      const alloc = allocs.filter(a => a.lotId === id).reduce((s, a) => s + a.qty, 0);
      const store = Number(columnAsArray(lotsT, LOT.storeStock)[i]) || 0;
      const vendor = Number(columnAsArray(lotsT, LOT.vendorStock)[i]) || 0;
      const general = LOT.generalStock ? (Number(columnAsArray(lotsT, LOT.generalStock)[i]) || 0) : 0;
      const stock = store + vendor + general;
      const broken = LOT.broken ? (Number(columnAsArray(lotsT, LOT.broken)[i]) || 0) : 0;
      const unwound = Math.max(0, total - alloc - stock - broken); // fresh spools not yet spoken for
      const rawStatus = (columnAsArray(lotsT, LOT.drying)[i] || '').toString();
      const isDry = DRY.test(rawStatus) || (!WET.test(rawStatus) && !!rawStatus); // unknown non-wet => treat dry
      const windableFresh = unwound > 0 && isDry;
      if (unwound <= 0 && stock <= 0) return;
      (lotsByRecipe[recipeId] = lotsByRecipe[recipeId] || []).push({
        lotId: id, recipeId,
        lotNumber: columnAsArray(lotsT, LOT.lotNumber)[i] || `Lot #${id}`,
        fiber: fiberCode(columnAsArray(lotsT, LOT.fiber)[i] || recipe.fiber),
        method: recipe.method,
        rawStatus, isDry,
        date: LOT.date ? columnAsArray(lotsT, LOT.date)[i] : 0,
        // "available to wind now" = dry fresh spools + already-made stock (stock is
        // ready regardless of rack, since it was set aside deliberately)
        freshDry: windableFresh ? unwound : 0,
        freshWet: (unwound > 0 && !isDry) ? unwound : 0,
        stock,
        bin: LOT.bin ? (binById[getRefId(columnAsArray(lotsT, LOT.bin)[i])] || '') : '',
        storeCol: LOT.generalStock || LOT.storeStock,
        storeVal: general || store,
      });
    });
    Object.values(lotsByRecipe).forEach(arr => arr.sort((a, b) => (a.date || 0) - (b.date || 0))); // oldest first

    /* Allocations sitting in a customer bin waiting for labels, grouped by order
       because that is how the bins are physically arranged. Built from a plain
       line->order map rather than S.lines, since a fully wound line drops out of
       S.lines entirely and would take its bin with it. */
    const lineMeta = {};
    (wolT.id || []).forEach((id, i) => {
      const sku = normalize(columnAsArray(wolT, WOL.sku)[i] || '');
      lineMeta[id] = {
        woId: getRefId(columnAsArray(wolT, WOL.workOrder)[i]),
        recipeId: getRefId(columnAsArray(wolT, WOL.recipe)[i]) || recipeIdBySku[sku] || null,
      };
    });
    const binsByWo = {};
    allocs.forEach(a => {
      // Same three-bucket test the other widgets use, rather than an exact
      // match on whichever packed string happened to exist at load time. An
      // exact match made this widget disagree with Quick Log about what
      // "boxed" means, so boxed spools kept reappearing as needing labels.
      const bucket = allocBucket(a.status);
      const waiting = bucket === 'wound';
      const boxed = bucket === 'boxed';
      if (!waiting && !boxed) return;
      const meta = lineMeta[a.lineId];
      if (!meta || !meta.woId) return;
      const info = woInfo[meta.woId];
      if (!info) return;
      const b = binsByWo[meta.woId] = binsByWo[meta.woId] || {
        woId: meta.woId, orderNumber: info.orderNumber || '',
        customerName: info.customerName || '', items: {}, total: 0,
      };
      // One row per order line, because that is one colorway going into the box.
      const key = a.lineId != null ? `L${a.lineId}` : `R${meta.recipeId}`;
      const it = b.items[key] = b.items[key] || {
        key, name: (recipeById[meta.recipeId] || {}).name || 'Unknown colorway',
        qty: 0, allocIds: [], boxedQty: 0,
      };
      if (waiting) { it.qty += a.qty; it.allocIds.push(a.id); b.total += a.qty; }
      else { it.boxedQty += a.qty; }
    });
    // Only orders with something still waiting; already-boxed rows ride along so
    // the card shows how far through the box you are.
    S.bins = Object.values(binsByWo)
      .filter(b => b.total > 0)
      .map(b => {
        b.itemList = Object.values(b.items).sort((x, y) => x.name.localeCompare(y.name));
        b.doneCount = b.itemList.filter(i => i.qty === 0).length;
        return b;
      })
      .sort((x, y) => String(x.customerName).localeCompare(String(y.customerName)));

    // Build one windable row per order LINE. A line is "ready" only when its
    // colorway has enough dry-rack + stock spools to fill it completely.
    S.lines = [];
    (wolT.id || []).forEach((id, i) => {
      const woId = getRefId(columnAsArray(wolT, WOL.workOrder)[i]);
      const info = woInfo[woId];
      if (!info || !info.active) return;
      const sku = normalize(columnAsArray(wolT, WOL.sku)[i] || '');
      const recipeId = getRefId(columnAsArray(wolT, WOL.recipe)[i]) || recipeIdBySku[sku] || null;
      if (!recipeId) return;
      const qtyNeeded = Number(columnAsArray(wolT, WOL.qtyNeeded)[i]) || 0;
      const already = allocs.filter(a => a.lineId === id).reduce((s, a) => s + a.qty, 0);
      const outstanding = qtyNeeded - already;
      if (outstanding <= 0) return; // fully boxed
      const recipe = recipeById[recipeId] || { name: `Recipe #${recipeId}`, method: '' };
      const lots = lotsByRecipe[recipeId] || [];
      const availNow = lots.reduce((s, l) => s + l.freshDry + l.stock, 0);
      const drying = lots.reduce((s, l) => s + l.freshWet, 0);
      const ready = availNow >= outstanding;         // fully windable now
      const shortByDrying = !ready && (availNow + drying) >= outstanding; // only wet thread is holding it up
      S.lines.push({
        lineId: id, recipeId, recipeName: recipe.name, method: recipe.method,
        customerId: info.customerId || custIdByName[normalize(info.customerName)] || null,
        customerName: info.customerName, orderNumber: info.orderNumber, dueDate: info.dueDate,
        bump: !!info.bump,
        qtyNeeded, outstanding, availNow, drying, ready, shortByDrying,
        lots,
      });
    });

    // Sort: past-due first, then Priority_Bump, then soonest due.
    const today = todayEpochSeconds ? todayEpochSeconds() : Math.floor(Date.now() / 1000);
    S.lines.forEach(l => { l.pastDue = l.dueDate && dueValue(l.dueDate) < today; });
    S.lines.sort((a, b) =>
      (b.pastDue - a.pastDue) || (b.bump - a.bump) || (dueValue(a.dueDate) - dueValue(b.dueDate))
    );

    render();
  } catch (e) {
    console.error('Failed to load wind routing:', e);
    const msg = (e && e.message ? e.message : String(e)).replace(/[<>]/g, '');
    document.getElementById('content').innerHTML = `<div class="empty-state">Failed to load.<br><span style="font-size:10px">${msg}</span></div>`;
  }
}

function onSearch(v) {
  S.search = v;
  // Re-filter without a full re-render so the search box keeps focus/cursor.
  const q = normalize(v || '');
  const match = l => !q || normalize(`${l.recipeName} ${l.customerName || ''} ${l.orderNumber || ''}`).includes(q);
  const ready = S.lines.filter(l => l.ready && match(l));
  const waiting = S.lines.filter(l => !l.ready && match(l));
  // Patch the two lists in place rather than re-rendering, so the search box
  // keeps focus and the cursor stays where the worker left it.
  const secEl = document.getElementById('lineSections');
  if (secEl) {
    const sec = (list, label, cls) => list.length
      ? `<div class="section-title ${cls}">${label}</div>${list.map(rowHtml).join('')}` : '';
    secEl.innerHTML = S.view === 'labels' ? ''
      : sec(ready, 'Ready to wind', '') + sec(waiting, 'Made — still drying / short', 'muted');
  }
  const binEl = document.getElementById('binSections');
  if (binEl) binEl.innerHTML = S.view === 'wind' ? '' : binsHtml(S.view === 'all');
  if (S.selected != null) updateTally();
}

function selectLine(id) {
  S.selected = S.selected === id ? null : id;
  // pre-fill draw suggestion: oldest dry lots + stock first, up to outstanding
  if (S.selected != null) {
    const line = S.lines.find(l => l.lineId === id);
    S.draw = {};
    if (line) {
      let need = line.outstanding;
      for (const lot of line.lots) {
        if (need <= 0) break;
        const avail = lot.freshDry + lot.stock;
        if (avail <= 0) continue;
        const take = Math.min(avail, need);
        S.draw[lot.lotId] = take;
        need -= take;
      }
    }
  }
  render();
}

function rowHtml(l) {
  const open = S.selected === l.lineId;
  const tag = l.pastDue ? `<span class="tag past">past due</span>`
    : (l.bump ? `<span class="tag bump">bumped</span>` : '');
  const due = l.dueDate ? `due ${fmtDate(l.dueDate)}` : 'no due date';
  const sub = l.ready
    ? `${due}${l.drying ? ` · ${l.drying} more drying` : ''}`
    : (l.shortByDrying
        ? `${due} · <span class="drying-note">${l.availNow} ready, ${l.outstanding - l.availNow} still on wet rack</span>`
        : `${due} · only ${l.availNow} of ${l.outstanding} made`);
  return `
    <div class="line-card ${open ? 'active' : ''} ${l.ready ? '' : 'not-ready'}" onclick="selectLine(${l.lineId})">
      <div class="line-top">
        <div class="line-who">
          <span class="line-cust">${esc(l.recipeName)}</span>
          <span class="line-color">${esc(l.customerName || '—')}</span>
        </div>
        <span class="line-qty" title="Spools still to wind for this line">${l.outstanding} <span class="unit">to wind</span></span>
      </div>
      <div class="line-sub">${esc(l.orderNumber || '')}${l.orderNumber ? ' · ' : ''}${sub} ${tag}</div>
    </div>
    ${open && l.ready ? fillPanel(l) : ''}`;
}

function binMatch(b) {
  const q = normalize(S.search || '');
  if (!q) return true;
  return normalize(`${b.customerName} ${b.orderNumber} ${b.itemList.map(i => i.name).join(' ')}`).includes(q);
}

function binsHtml(withTitle) {
  const list = S.bins.filter(binMatch);
  if (!list.length) return '';
  return (withTitle ? `<div class="section-title">Step 2 — label &amp; box</div>` : '') + list.map(b => {
    // Buttons are verbs (what pressing this does); chips are past tense (what
    // already happened). The old wording used "In box ✓" for both, so the same
    // words meant "do this" on one row and "done" on the next.
    const rows = b.itemList.map(it => it.qty === 0
      ? `<div class="bin-item done">
           <span class="bin-item-name">${esc(it.name)} &times;${it.boxedQty}</span>
           <span class="bin-item-tick">&#10003; boxed</span>
         </div>`
      : `<div class="bin-item">
           <span class="bin-item-name">${esc(it.name)} <span class="bin-item-qty">&times;${it.qty}</span></span>
           <button class="mini" onclick="markPacked(${b.woId}, '${it.key}')"
             title="Labels are on these ${it.qty} spool${it.qty === 1 ? '' : 's'} and they're in the box">Labelled &rarr; box</button>
         </div>`).join('');
    const openItems = b.itemList.filter(i => i.qty > 0).length;
    // Spools and colorways are different units — say which is which rather
    // than running "12 to go · 2 of 5" together and leaving it ambiguous.
    const progress = b.doneCount
      ? ` &middot; ${b.doneCount} of ${b.itemList.length} colorways boxed`
      : '';
    return `
      <div class="bin-card">
        <div class="bin-head">
          <div class="bin-who">
            <div><span class="bin-name">${esc(b.customerName || 'order')}</span></div>
            <div class="bin-meta">${esc(b.orderNumber || '')}${b.orderNumber ? ' &middot; ' : ''}${
              b.total} spool${b.total === 1 ? '' : 's'} still to label${progress}</div>
          </div>
          ${openItems > 1 ? `<button class="mini ghost" onclick="markPacked(${b.woId}, null)"
            title="Mark all ${openItems} remaining colorways labelled and boxed">All ${openItems} done</button>` : ''}
        </div>
        <div class="bin-items">${rows}</div>
      </div>`;
  }).join('');
}

/* Three views rather than one long scroll. The worker doing the labelling only
   ever wants the middle one, and reaching it should not mean scrolling past
   every windable line. The numbers say these are stages of one job, not three
   unrelated screens. */
function setView(v) { S.view = v; render(); }

const VIEW_HINT = {
  wind: 'Pick a line, choose which lots to draw from, then wind and bag into that customer\u2019s bin.',
  labels: 'Print the labels, stick them on, then tick each colorway as it goes in the box.',
  all: 'Everything at once — winding queue on top of what\u2019s waiting on labels.',
};

function viewBar() {
  const nWind = S.lines.filter(l => l.ready).length;
  const nBins = S.bins.length;
  const btn = (v, label, n) =>
    `<button class="viewbtn ${S.view === v ? 'on' : ''}" onclick="setView('${v}')">${label}${
      n != null ? ` <span class="n">${n}</span>` : ''}</button>`;
  return `<div class="viewbar">${btn('wind', '1 · Wind & bag', nWind)}${
    btn('labels', '2 · Label & box', nBins)}${btn('all', 'Both')}</div>
    <div class="view-hint">${VIEW_HINT[S.view] || ''}</div>`;
}

/* itemKey null = everything still waiting in this order's bin. */
async function markPacked(woId, itemKey) {
  const b = S.bins.find(x => x.woId === woId);
  if (!b) return;
  const items = (itemKey ? b.itemList.filter(i => i.key === itemKey) : b.itemList)
    .filter(i => i.qty > 0);
  const ids = items.reduce((acc, i) => acc.concat(i.allocIds), []);
  if (!ids.length) return;
  const { ALLOC } = S.cols;
  try {
    await grist.docApi.applyUserActions([['BulkUpdateRecord', 'Lot_Allocations', ids,
      { [ALLOC.status]: ids.map(() => S.packedStatus) }]]);
    S.boxed.unshift({
      allocIds: ids, customerName: b.customerName,
      summary: items.map(i => `${i.name} ×${i.qty}`).join(' · '),
    });
    showToast(items.length === 1 ? `${items[0].name} in the box` : `${b.customerName || 'Order'} boxed`);
    await loadEverything();
  } catch (e) {
    console.error('Could not mark packed:', e);
    showToast('Could not update — see console');
  }
}

async function undoBox(i) {
  const d = S.boxed[i];
  if (!d) return;
  try {
    await grist.docApi.applyUserActions([['BulkUpdateRecord', 'Lot_Allocations', d.allocIds,
      { [S.cols.ALLOC.status]: d.allocIds.map(() => BIN_STATUS) }]]);
    S.boxed.splice(i, 1);
    showToast('Back in the bin');
    await loadEverything();
  } catch (e) {
    console.error('Could not undo box:', e);
    showToast('Undo failed');
  }
}

function render() {
  const c = document.getElementById('content');
  if (!S.lines.length && !S.bins.length) {
    c.innerHTML = `<div class="header-title">Wind &amp; Box</div>
      <div class="empty-state">Nothing to wind.<br>Orders show up here once their thread is on the dry rack.</div>`;
    return;
  }

  // Two different events, so two different looks. Both used to be a grey strip
  // with a tick, which made "wound into the bin" and "boxed and gone" read the
  // same at a glance.
  const doneHtml = S.done.map((d, i) => `
    <div class="done-line wound">
      <span>&#129525; <strong>${esc(d.customerName || 'order')}</strong> — ${esc(d.summary)} wound into the bin</span>
      <span class="undo-link" onclick="undoWind(${i})">↺ undo</span>
    </div>`).join('');

  const boxedHtml = S.boxed.map((d, i) => `
    <div class="done-line boxed">
      <span>&#128230; <strong>${esc(d.customerName || 'order')}</strong> — ${esc(d.summary)} labelled &amp; boxed</span>
      <span class="undo-link" onclick="undoBox(${i})">↺ undo</span>
    </div>`).join('');

  const q = normalize(S.search || '');
  const match = l => !q || normalize(`${l.recipeName} ${l.customerName || ''} ${l.orderNumber || ''}`).includes(q);
  const ready = S.lines.filter(l => l.ready && match(l));
  const waiting = S.lines.filter(l => !l.ready && match(l));

  const section = (list, label, cls) => list.length
    ? `<div class="section-title ${cls}">${label}</div>${list.map(rowHtml).join('')}`
    : '';

  const showWind = S.view !== 'labels';
  const showBins = S.view !== 'wind';
  const binBlock = showBins ? binsHtml(S.view === 'all') : '';

  c.innerHTML = `
    <div class="header-title">Wind &amp; Box</div>
    ${viewBar()}
    <input class="search-input" id="searchBox" placeholder="Search colorway, order, or customer..." value="${esc(S.search || '')}" oninput="onSearch(this.value)">
    ${doneHtml}
    ${showBins ? boxedHtml : ''}
    <div id="binSections">${binBlock}</div>
    <div id="lineSections">
      ${showWind ? section(ready, S.view === 'all' ? 'Step 1 — wind &amp; bag' : 'Ready to wind now', '') : ''}
      ${showWind ? section(waiting, 'Not windable yet — still drying or short', 'muted') : ''}
    </div>
    ${showBins && !binBlock && S.view === 'labels'
      ? `<div class="empty-state">Nothing waiting on labels.<br>Bagged spools land here after you wind them.</div>` : ''}
    ${showWind && !ready.length && !waiting.length && S.view === 'wind'
      ? `<div class="empty-state">Nothing ready to wind.<br>Lines appear once their thread is dry.</div>` : ''}
  `;
  if (S.selected != null) updateTally();
}

function fillPanel(l) {
  const isHand = /hand/i.test(l.method);
  const lotsWithSpools = l.lots.filter(lot => (lot.freshDry + lot.stock) > 0);
  const usedLots = lotsWithSpools.filter(lot => (S.draw[lot.lotId] || 0) > 0).length;
  const lotRows = lotsWithSpools.map(lot => {
    const cap = lot.freshDry + lot.stock;
    const src = lot.stock > 0 && lot.freshDry === 0 ? 'back stock'
      : (lot.stock > 0 ? `${lot.freshDry} dry + ${lot.stock} stock` : 'dry rack');
    return `
      <div class="lot-line">
        <div class="lot-line-info">
          <span class="lot-line-no">${esc(lot.lotNumber)}</span>
          ${lot.bin ? `<span class="lot-bin">${esc(lot.bin)}</span>` : `<span class="lot-bin lot-bin-none">no bin</span>`}
          <span class="lot-line-src">${src} · ${cap} avail</span>
        </div>
        <input type="number" min="0" max="${cap}" id="draw-${lot.lotId}"
               value="${S.draw[lot.lotId] || 0}" oninput="onDraw(${lot.lotId}, ${cap})">
      </div>`;
  }).join('');

  const mixWarn = (isHand && usedLots > 1)
    ? `<div class="mix-warn">Mixing ${usedLots} lots on a hand-dyed order — check they match before winding.</div>` : '';

  const brokenHtml = S.brokenCol
    ? `<div class="extra-row"><span>Broken / tied-off spools</span><input type="number" min="0" id="broken-qty" value="0" oninput="updateTally()"></div>`
    : '';
  const stockHtml = `<div class="extra-row stock"><span>Extra good spools → back stock</span><input type="number" min="0" id="stock-qty" value="0" oninput="updateTally()"></div>`;

  return `
    <div class="fill-panel">
      ${lotRows}
      ${mixWarn}
      ${brokenHtml}
      ${stockHtml}
      <div id="tally" class="tally ok"></div>
      <button class="go" id="confirmBtn" onclick="confirmWind()">✓ Wind &amp; bag for ${esc(l.customerName || 'order')}</button>
    </div>`;
}

function onDraw(lotId, cap) {
  const el = document.getElementById(`draw-${lotId}`);
  let v = Math.max(0, Math.min(cap, Number(el.value) || 0));
  S.draw[lotId] = v;
  updateTally();
}

function currentPlan() {
  const line = S.lines.find(l => l.lineId === S.selected);
  if (!line) return null;
  const draws = line.lots
    .map(lot => ({ lot, qty: Math.max(0, Number((document.getElementById(`draw-${lot.lotId}`) || {}).value) || 0) }))
    .filter(d => d.qty > 0);
  const toOrder = draws.reduce((s, d) => s + d.qty, 0);
  const brokenEl = document.getElementById('broken-qty');
  const broken = brokenEl ? Math.max(0, Number(brokenEl.value) || 0) : 0;
  const stockEl = document.getElementById('stock-qty');
  const stock = stockEl ? Math.max(0, Number(stockEl.value) || 0) : 0;
  // over-draw check is per-lot (handled by max), here we check the ORDER need
  return { line, draws, toOrder, broken, stock };
}

function updateTally() {
  const p = currentPlan();
  if (!p) return;
  const t = document.getElementById('tally');
  const btn = document.getElementById('confirmBtn');
  if (!t) return;
  const over = p.toOrder > p.line.outstanding;
  t.className = 'tally ' + (over ? 'over' : (p.toOrder === p.line.outstanding ? 'ok' : 'partial'));
  t.innerHTML = over
    ? `Over by ${p.toOrder - p.line.outstanding} — this order needs ${p.line.outstanding}.`
    : `${p.toOrder} of ${p.line.outstanding} for this order${p.toOrder < p.line.outstanding ? ' (partial — rest stays open)' : ''}${p.stock ? ` · ${p.stock} to stock` : ''}${p.broken ? ` · ${p.broken} broken` : ''}`;
  if (btn) btn.disabled = over || p.toOrder === 0;
}

async function confirmWind() {
  const p = currentPlan();
  if (!p || p.toOrder === 0) { showToast('Draw some spools first'); return; }
  if (p.toOrder > p.line.outstanding) { showToast('More than this order needs'); return; }
  if (!p.line.customerId) { showToast(`No customer row for ${p.line.customerName || 'this order'} — allocation needs one`); return; }

  const { ALLOC } = S.cols;
  try {
    // One allocation per lot drawn from
    const actions = p.draws.map(d => {
      const f = {};
      f[ALLOC.lot] = d.lot.lotId;
      f[ALLOC.qty] = d.qty;
      f[ALLOC.status] = S.woundStatus;
      if (ALLOC.customer) f[ALLOC.customer] = p.line.customerId;
      if (ALLOC.line) f[ALLOC.line] = p.line.lineId;
      return ['AddRecord', 'Lot_Allocations', null, f];
    });

    // Extra good spools -> back stock on the FIRST lot drawn (or first lot with spools)
    const anchor = p.draws[0] ? p.draws[0].lot : (p.line.lots[0] || null);
    let stockBefore = null, stockCol = null, stockLotId = null;
    if (p.stock > 0 && anchor && anchor.storeCol) {
      stockCol = anchor.storeCol; stockLotId = anchor.lotId; stockBefore = anchor.storeVal || 0;
    }
    let brokenBefore = null, brokenLotId = null;
    if (p.broken > 0 && S.brokenCol && anchor) {
      brokenLotId = anchor.lotId; brokenBefore = anchor.broken || 0;
    }

    const res = await grist.docApi.applyUserActions(actions);
    const newIds = res.retValues || [];

    const lotUpdate = {};
    if (stockCol) lotUpdate[stockCol] = (stockBefore || 0) + p.stock;
    if (brokenLotId != null && S.brokenCol) lotUpdate[S.brokenCol] = (brokenBefore || 0) + p.broken;
    if (Object.keys(lotUpdate).length) {
      await grist.docApi.applyUserActions([['UpdateRecord', 'Production_Lots', anchor.lotId, lotUpdate]]);
    }

    S.done.unshift({
      customerName: p.line.customerName, allocIds: newIds,
      stockCol, stockLotId, stockBefore, stockAdded: p.stock,
      brokenLotId, brokenBefore, brokenAdded: p.broken,
      summary: `${p.toOrder} spool${p.toOrder === 1 ? '' : 's'} ${esc(p.line.recipeName)}`
        + (p.draws.length > 1 ? ` (${p.draws.length} lots)` : '')
        + (p.stock ? ` · ${p.stock} to stock` : '')
        + (p.broken ? ` · ${p.broken} broken` : ''),
    });
    S.selected = null; S.draw = {};
    showToast('Boxed ✓');
    await loadEverything();
  } catch (e) {
    console.error('Failed to wind:', e);
    showToast('Failed — check Lot_Allocations');
  }
}

async function undoWind(i) {
  const d = S.done[i];
  if (!d) return;
  try {
    const actions = (d.allocIds || []).map(id => ['RemoveRecord', 'Lot_Allocations', id]);
    if (d.stockAdded > 0 && d.stockCol && d.stockLotId != null && d.stockBefore != null) {
      actions.push(['UpdateRecord', 'Production_Lots', d.stockLotId, { [d.stockCol]: d.stockBefore }]);
    }
    if (d.brokenAdded > 0 && S.brokenCol && d.brokenLotId != null && d.brokenBefore != null) {
      actions.push(['UpdateRecord', 'Production_Lots', d.brokenLotId, { [S.brokenCol]: d.brokenBefore }]);
    }
    await grist.docApi.applyUserActions(actions);
    S.done.splice(i, 1);
    showToast('Undone ✓');
    await loadEverything();
  } catch (e) {
    console.error('Failed to undo wind:', e);
    showToast('Undo failed');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

grist.ready({ requiredAccess: 'full' });
loadEverything();
</script>
</body>
</html>
