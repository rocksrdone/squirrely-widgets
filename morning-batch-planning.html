<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Batch Planning</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

  :root {
    --ink: #1A1614;
    --paper: #F7F3EE;
    --warm: #E8DFD4;
    --rule: #D4C9BC;
    --accent: #8B3A2A;
    --teal: #3A8B7A;
    --teal-light: #E5F2EF;
    --gold: #B07D2A;
    --gold-light: #F5EDD8;
    --done-text: #27500A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 16px;
  }

  .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .header-title { font-family: 'Libre Baskerville', serif; font-size: 19px; font-weight: 700; }
  .header-sub { font-size: 11px; color: #8B7D72; margin-bottom: 12px; }
  .refresh-btn {
    font-size: 11px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid var(--rule); background: white; color: var(--ink); cursor: pointer;
  }

  .counter-row { display: flex; gap: 16px; margin-bottom: 12px; }
  .counter-chip {
    background: white; border: 1px solid var(--rule); border-radius: 8px; padding: 8px 14px;
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 700;
  }
  .counter-chip span { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; color: #8B7D72; margin-left: 4px; }

  .controls-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 180px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 13px;
  }
  .filter-select { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; font-size: 12px; background: white; color: var(--ink); color-scheme: light; }
  .filter-select option { background: white; color: var(--ink); }

  .empty-state { text-align: center; color: var(--done-text); padding: 60px 20px; font-size: 14px; }

  .work-table { width: 100%; border-collapse: collapse; }
  .work-table thead th {
    text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: #8B7D72; padding: 6px 8px; border-bottom: 2px solid var(--rule);
    position: sticky; top: 0; background: var(--paper); z-index: 2;
  }
  .work-table td { padding: 8px; border-bottom: 1px solid var(--warm); vertical-align: top; font-size: 12px; }
  .recipe-row { cursor: pointer; background: white; }
  .recipe-row:hover { background: var(--warm); }
  .recipe-row.selected { background: var(--teal-light); }

  .recipe-name-cell { font-family: 'Libre Baskerville', serif; font-size: 13px; font-weight: 700; }
  .recipe-meta-cell { font-size: 10px; color: #8B7D72; margin-top: 2px; }

  .priority-pill {
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em;
    padding: 2px 8px; border-radius: 8px; white-space: nowrap;
  }
  .priority-Urgent { background: #F5E0E4; color: #A01830; }
  .priority-High { background: var(--gold-light); color: var(--gold); }
  .priority-Normal { background: var(--warm); color: #6B5E52; }
  .priority-Low { background: #EAF3DE; color: var(--done-text); }

  .stock-line { font-size: 11px; padding: 1px 0; }
  .bin-tag {
    font-family: 'DM Mono', monospace; font-size: 10px; background: var(--warm); padding: 1px 6px; border-radius: 4px;
  }
  .no-stock { color: #8B7D72; font-style: italic; }
  .peek-line { font-size: 11px; color: #6B5E52; padding: 1px 0; }

  .recipe-row.planned { box-shadow: inset 3px 0 0 var(--teal); }
  .plan-badge {
    font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 700;
    background: var(--teal); color: var(--paper); padding: 1px 6px; border-radius: 8px;
    margin-left: 6px; vertical-align: middle; letter-spacing: .04em;
  }
  .plan-slots { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--teal); margin-top: 2px; }
  .not-planned { font-size: 9px; color: #A89C90; font-style: italic; margin-left: 6px; }

  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: white; padding: 8px 16px; border-radius: 6px; font-size: 12px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="header-row">
  <div>
    <div class="header-title">Morning Batch Planning</div>
  </div>
  <button class="refresh-btn" onclick="loadEverything()">↻ Refresh</button>
</div>
<div class="header-sub" id="headerSub">Loading...</div>

<div class="counter-row" id="counterRow"></div>

<div class="controls-row">
  <input class="search-input" id="searchBox" placeholder="Search colorway, SKU, or customer..." oninput="renderList()">
  <select class="filter-select" id="customerFilter" onchange="renderList()">
    <option value="">All customers</option>
  </select>
  <select class="filter-select" id="planFilter" onchange="renderList()">
    <option value="">All pending work</option>
    <option value="planned">Today's plan only</option>
    <option value="unplanned">Not in today's plan</option>
  </select>
  <select class="filter-select" id="coverFilter" onchange="renderList()">
    <option value="todye">Needs dyeing</option>
    <option value="all">Include already covered</option>
    <option value="covered">Covered only</option>
  </select>
  <select class="filter-select" id="priorityFilter" onchange="renderList()">
    <option value="">All priorities</option>
    <option value="Urgent">Urgent only</option>
    <option value="High">High only</option>
    <option value="Normal">Normal only</option>
    <option value="Low">Low only</option>
  </select>
</div>

<div id="content"></div>

<div class="toast" id="toast"></div>

<script>
/* ── Mixed-dye bin codes — KEEP BYTE-IDENTICAL ACROSS WIDGETS ──
   The made-dye shelf is M-A1 .. M-D4: letters are columns, numbers are rows,
   matching back stock. Every widget that reads Dye_Stock.Bin_Location must
   normalise before displaying OR grouping. Skipping it is what let one drawer
   show up as several bins: "5", "b3", "B-3" and "M-B3" are all one place, and
   an un-normalised group key splits them into four.

   Only Dye_Stock goes through here. Back stock bins (bare A1-D7) are a
   different rack, are not being renamed, and must NOT be passed to normBin. */
const DYE_BIN_ROWS = 4, DYE_BIN_COLS = 4;
const BIN_LETTERS = 'ABCDEFGHIJKL';
const NO_BIN = '(no bin)';

// Fills down a column before moving to the next. Keyed on ROWS, not COLS, so
// widening the shelf later appends new letters instead of remapping every code.
function dyeBinCode(index0) {
  const col = Math.floor(index0 / DYE_BIN_ROWS);
  const row = index0 % DYE_BIN_ROWS;
  return 'M-' + BIN_LETTERS[col] + (row + 1);
}
function normBin(raw) {
  const s = String(raw || '').trim().toUpperCase().replace(/[\s\-_.]/g, '');
  if (!s) return '';
  let m = /^M?([A-L])(\d{1,2})$/.exec(s);
  if (m) return 'M-' + m[1] + Number(m[2]);
  m = /^(\d{1,3})$/.exec(s);
  if (m) {
    const n = Number(m[1]);
    if (n >= 1 && n <= DYE_BIN_ROWS * DYE_BIN_COLS) return dyeBinCode(n - 1);
  }
  return String(raw).trim();   // off-grid / unrecognised — left alone, never invented
}
// Shelf position, for sorting. Off-grid codes sort last instead of colliding at 0.
function binOrder(code) {
  const m = /^M-([A-L])(\d{1,2})$/.exec(String(code || ''));
  if (!m) return 9000;
  return BIN_LETTERS.indexOf(m[1]) * DYE_BIN_ROWS + (Number(m[2]) - 1);
}
function binSortFn(a, b) {
  const d = binOrder(a) - binOrder(b);
  return d !== 0 ? d : String(a).localeCompare(String(b));
}
// Display form. One empty-bin string everywhere, so the label a worker reads is
// the same label the grouping used.
function binLabel(raw) {
  return normBin(raw) || NO_BIN;
}
// First grid position with nothing in it. Returns '' when the shelf is full, so
// the caller can say so instead of inventing an M-E1 that does not exist.
function nextFreeBin(binGroups) {
  for (let i = 0; i < DYE_BIN_ROWS * DYE_BIN_COLS; i++) {
    const code = dyeBinCode(i);
    if (!binGroups[code] || !binGroups[code].length) return code;
  }
  return '';
}

function esc(s) {
  return (s == null ? '' : String(s)).replace(/[&<>"']/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function getRefId(ref) {
  if (typeof ref === 'number') return ref || null;
  if (Array.isArray(ref)) return ref[1];
  if (typeof ref === 'object' && ref !== null && 'rowId' in ref) return ref.rowId;
  return null;
}
function columnAsArray(t, c) { return Array.isArray(t[c]) ? t[c] : []; }
function normalize(s) { return (s || '').toString().trim().toUpperCase(); }
// Matches a column id ignoring case and non-alphanumerics, trying each candidate.
// Keep in sync with the copy in batch-assignment/batch-planner.
function findColumn(t, candidates) {
  const keys = Object.keys(t);
  for (const cand of candidates) {
    const hit = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cand.toLowerCase().replace(/[^a-z0-9]/g, ''));
    if (hit) return hit;
  }
  return null;
}
// Resolve a table's columns; push "Table.FirstCand" into `missing` for any REQUIRED
// column not found, so we can banner instead of silently reading an empty column.
// spec value is either ['Cand'] (required) or { cands:[...], required:false }.
function resolveCols(table, tableName, spec, missing) {
  const out = {};
  for (const [key, def] of Object.entries(spec)) {
    const cands = Array.isArray(def) ? def : def.cands;
    const required = Array.isArray(def) ? true : def.required !== false;
    const hit = findColumn(table, cands);
    out[key] = hit;
    if (!hit && required) missing.push(`${esc(tableName)}.${cands[0]}`);
  }
  return out;
}
const PRIORITY_RANK = { 'Urgent': 0, 'High': 1, 'Normal': 2, 'Low': 3 };
function priorityRank(p) { return PRIORITY_RANK[p] ?? 2; }

let recipeData = [];
let selectedRecipeId = null;
let planByRecipe = {};  // recipeId -> {seq, slots} from today's saved Day_Plan

// Grist Date columns store epoch seconds at UTC midnight of the calendar day.
function dueValue(d) { const n = Number(d); return isFinite(n) && n > 0 ? n : Infinity; }
// Grist dates are epoch SECONDS.
// Every order gets an effective due date: the one you set, or Order_Date + this
// many days when you haven't. Setting Due_Date later than the default pushes the
// work down the list; setting it earlier pulls it up. One number, no second rule.
const DEFAULT_WINDOW_DAYS = 14;
const DAY = 86400;
function epoch(d) { const n = Number(d); return isFinite(n) && n > 0 ? n : null; }
function effectiveDue(orderDate, dueDate) {
  const due = epoch(dueDate);
  if (due) return { at: due, explicit: true };
  const ord = epoch(orderDate);
  if (ord) return { at: ord + DEFAULT_WINDOW_DAYS * DAY, explicit: false };
  return { at: Infinity, explicit: false };           // no dates at all: sorts last
}
function daysOverdue(at) {
  if (!isFinite(at)) return -Infinity;
  return Math.floor((Date.now() / 1000 - at) / DAY);
}
function todayEpochSeconds() {
  const n = new Date();
  return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 1000;
}

// Today's plan, as saved by Batch Planner. Read-only here — this widget shows
// the plan, it never writes one. Missing table or no plan saved yet just means
// nothing is marked, and everything behaves as it always did.
async function loadTodaysPlan() {
  planByRecipe = {};
  try {
    const dp = await grist.docApi.fetchTable('Day_Plan');
    // Day_Plan is optional (it only adds "in today's plan" marking). Resolve its
    // columns but never banner — a rename here just leaves nothing marked.
    const dpMissing = [];
    const DP = resolveCols(dp, 'Day_Plan', {
      planDate: ['Plan_Date'], recipe: ['Recipe'], sequence: ['Sequence'], slot: ['Prep_Slot'],
    }, dpMissing);
    if (dpMissing.length) throw new Error('Day_Plan columns changed');
    const today = todayEpochSeconds();
    (dp.id || []).forEach((id, i) => {
      if (Number(columnAsArray(dp, DP.planDate)[i]) !== today) return;
      const rid = getRefId(columnAsArray(dp, DP.recipe)[i]);
      if (!rid || planByRecipe[rid]) return; // repeat orders share a recipe — keep the first
      planByRecipe[rid] = {
        seq: Number(columnAsArray(dp, DP.sequence)[i]) || 0,
        slots: (columnAsArray(dp, DP.slot)[i] || '').toString(),
      };
    });
  } catch (e) {
    planByRecipe = {};
  }
}

function jumpToRecipe(recipeId) {
  selectedRecipeId = recipeId;
  try {
    grist.setCursorPos({ rowId: recipeId });
  } catch (e) {
    console.error('Could not jump to recipe:', e);
    showToast('Could not jump — check widget access level');
  }
  renderList();
}

async function loadEverything() {
  document.getElementById('headerSub').textContent = 'Loading...';

  try {
    const [woTable, wolTable, recipesTable, compTable, dyesTable, stockTable] = await Promise.all([
      grist.docApi.fetchTable('Work_Orders'),
      grist.docApi.fetchTable('Work_Order_Lines'),
      grist.docApi.fetchTable('Recipes'),
      grist.docApi.fetchTable('Recipe_Dye_Components'),
      grist.docApi.fetchTable('Dyes'),
      grist.docApi.fetchTable('Dye_Stock'),
    ]);

    await loadTodaysPlan();

    // Coverage is derived, not stored: a "dyed" count written at the kettle goes
    // stale as soon as winding assigns those spools to a different customer.
    const allocByLine = {}, unwoundByRecipe = {}, backStockByRecipe = {};
    try {
      const [allocT, lotsT] = await Promise.all([
        grist.docApi.fetchTable('Lot_Allocations'),
        grist.docApi.fetchTable('Production_Lots'),
      ]);
      const aLine = findColumn(allocT, ['Work_Order_Line']);
      const aQty = findColumn(allocT, ['Qty_Spools']);
      const aLot = findColumn(allocT, ['Lot']);
      const byLot = {};
      (allocT.id || []).forEach((id, i) => {
        const q = Number(columnAsArray(allocT, aQty)[i]) || 0;
        const li = aLine ? getRefId(columnAsArray(allocT, aLine)[i]) : null;
        if (li) allocByLine[li] = (allocByLine[li] || 0) + q;
        const lo = aLot ? getRefId(columnAsArray(allocT, aLot)[i]) : null;
        if (lo) byLot[lo] = (byLot[lo] || 0) + q;
      });
      const lR = findColumn(lotsT, ['Recipe']), lS = findColumn(lotsT, ['Spools_Made']);
      // Only spools that CANNOT fill an order reduce coverage: committed to a shop
      // (store/vendor) or broken. Back stock is the whole point of back stock — it
      // fills orders, so it counts as coverage, it does not cancel it out.
      const spoken = ['Store_Stock_Spools', 'Vendor_Stock_Spools', 'Broken_Spools']
        .map(c => findColumn(lotsT, [c]));
      const cBack = findColumn(lotsT, ['General_Stock_Spools']);
      (lotsT.id || []).forEach((id, i) => {
        const rid = lR ? getRefId(columnAsArray(lotsT, lR)[i]) : null;
        if (!rid) return;
        const back = cBack ? Number(columnAsArray(lotsT, cBack)[i]) || 0 : 0;
        let free = (lS ? Number(columnAsArray(lotsT, lS)[i]) || 0 : 0) - (byLot[id] || 0) - back;
        spoken.forEach(c => { if (c) free -= Number(columnAsArray(lotsT, c)[i]) || 0; });
        // Accumulate SIGNED, then clamp per recipe. Clamping per lot would throw
        // away over-allocated lots (allocated > Spools_Made) and leave the
        // positive lots standing alone as thread that does not exist.
        unwoundByRecipe[rid] = (unwoundByRecipe[rid] || 0) + free;
        if (back > 0) backStockByRecipe[rid] = (backStockByRecipe[rid] || 0) + back;
      });
      Object.keys(unwoundByRecipe).forEach(k => {
        if (unwoundByRecipe[k] < 0) unwoundByRecipe[k] = 0;
      });
    } catch (e) {
      console.warn('Lots/allocations unavailable — planning will show full order need', e);
    }

    // ── Resolve every column id up front (rename-proofing) ──────────────
    const missing = [];
    const opt = cands => ({ cands, required: false });
    const WO = resolveCols(woTable, 'Work_Orders', {
      status: ['Status'], orderNumber: opt(['Order_Number']), customerName: opt(['Customer_Name']),
      dueDate: opt(['Due_Date']), orderDate: opt(['Order_Date']), bump: opt(['Priority_Bump']),
    }, missing);
    const REC = resolveCols(recipesTable, 'Recipes', {
      name: ['Recipe_Name'], sku: opt(['SKU_Base']),
    }, missing);
    const DYE = resolveCols(dyesTable, 'Dyes', {
      name: ['Dye_Name'], brand: opt(['Brand']), powderLoc: opt(['Powder_Location']),
    }, missing);
    const COMP = resolveCols(compTable, 'Recipe_Dye_Components', {
      recipe: ['Recipe'], dye: ['Dye_Name'],
    }, missing);
    const STOCK = resolveCols(stockTable, 'Dye_Stock', {
      dye: ['Dye'], quantity: ['Quantity_mL'], bin: opt(['Bin_Location']),
    }, missing);
    const WOL = resolveCols(wolTable, 'Work_Order_Lines', {
      workOrder: ['Work_Order'], qtyNeeded: ['Qty_Needed'],
      sku: opt(['SKU']), recipe: opt(['Recipe']), priority: opt(['Production_Priority']),
    }, missing);

    if (missing.length) {
      document.getElementById('headerSub').textContent =
        'Missing columns: ' + [...new Set(missing)].join(', ') + ' — a table/column was likely renamed';
      recipeData = [];
      renderList();
      return;
    }
    // ────────────────────────────────────────────────────────────────────

    const woIds = woTable.id || [];
    const woInfo = {};
    woIds.forEach((id, i) => {
      woInfo[id] = {
        active: (columnAsArray(woTable, WO.status)[i] || '').toString() === 'Active',
        orderNumber: columnAsArray(woTable, WO.orderNumber)[i],
        customerName: columnAsArray(woTable, WO.customerName)[i],
        dueDate: WO.dueDate ? columnAsArray(woTable, WO.dueDate)[i] : null,
        orderDate: WO.orderDate ? columnAsArray(woTable, WO.orderDate)[i] : null,
        bump: WO.bump ? !!columnAsArray(woTable, WO.bump)[i] : false,
      };
    });

    const rIds = recipesTable.id || [];
    const recipeById = {};
    const recipeBySku = {};
    rIds.forEach((id, i) => {
      const rec = { id, name: columnAsArray(recipesTable, REC.name)[i], sku: columnAsArray(recipesTable, REC.sku)[i] };
      recipeById[id] = rec;
      const sku = normalize(rec.sku);
      if (sku) recipeBySku[sku] = rec;
    });

    // ── Dye catalog, keyed by ROW ID ────────────────────────────────────
    // Twenty-six dye names in the catalog belong to more than one brand —
    // Turquoise exists as CC, J and PF. Keying stock, powder location or
    // peek-ahead by NAME merges those into one dye, so a recipe using CC
    // Turquoise shows the bins of all three. Everything below keys on the
    // Dyes row id; a name is only ever a display label or a last-resort
    // match for a component that stored free text instead of a reference.
    const dIds = dyesTable.id || [];
    const dyeById = {};
    const dyeNameCounts = {};
    dIds.forEach((id, i) => {
      const name = (columnAsArray(dyesTable, DYE.name)[i] || '').toString();
      dyeById[id] = {
        id,
        name,
        brand: (columnAsArray(dyesTable, DYE.brand)[i] || '').toString(),
        powderLoc: (columnAsArray(dyesTable, DYE.powderLoc)[i] || '').toString(),
      };
      const k = normalize(name);
      if (k) dyeNameCounts[k] = (dyeNameCounts[k] || 0) + 1;
    });

    // Free text can only be resolved when the name belongs to exactly one dye.
    // An ambiguous name resolves to nothing rather than to a coin flip.
    const dyeIdByUniqueName = {};
    dIds.forEach(id => {
      const k = normalize(dyeById[id].name);
      if (k && dyeNameCounts[k] === 1) dyeIdByUniqueName[k] = id;
    });

    // A name shared by two brands is never shown bare — the brand is the only
    // thing that tells the two jars apart on the shelf.
    const dyeLabel = info => {
      if (!info) return '';
      return (dyeNameCounts[normalize(info.name)] > 1 && info.brand)
        ? `${info.name} (${info.brand})`
        : info.name;
    };
    const dyeKey = (id, name) => (id ? 'id:' + id : 'nm:' + normalize(name));

    const cIds = compTable.id || [];
    const dyesByRecipe = {};
    cIds.forEach((id, i) => {
      const recipeRef = getRefId(columnAsArray(compTable, COMP.recipe)[i]);
      const rawDyeVal = columnAsArray(compTable, COMP.dye)[i];
      let dyeRefId = getRefId(rawDyeVal);
      if (!dyeRefId && typeof rawDyeVal === 'string') {
        dyeRefId = dyeIdByUniqueName[normalize(rawDyeVal)] || null;
      }
      const info = dyeRefId ? dyeById[dyeRefId] : null;
      const dyeName = info ? info.name : (typeof rawDyeVal === 'string' ? rawDyeVal : '');
      if (!recipeRef || !dyeName) return;
      if (!dyesByRecipe[recipeRef]) dyesByRecipe[recipeRef] = [];
      dyesByRecipe[recipeRef].push({
        id: dyeRefId,
        name: dyeName,
        label: info ? dyeLabel(info) : dyeName,
        key: dyeKey(dyeRefId, dyeName),
      });
    });

    const sIds = stockTable.id || [];
    const stockByDyeKey = {};
    sIds.forEach((id, i) => {
      const dyeRef = getRefId(columnAsArray(stockTable, STOCK.dye)[i]);
      if (!dyeRef || !dyeById[dyeRef]) return;
      const key = 'id:' + dyeRef;
      if (!stockByDyeKey[key]) stockByDyeKey[key] = [];
      stockByDyeKey[key].push({
        qty: Number(columnAsArray(stockTable, STOCK.quantity)[i]) || 0,
        binLocation: normBin(columnAsArray(stockTable, STOCK.bin)[i]),
      });
    });

    const wolIds = wolTable.id || [];
    const pendingByRecipe = {};

    for (let i = 0; i < wolIds.length; i++) {
      const woId = getRefId(columnAsArray(wolTable, WOL.workOrder)[i]);
      const info = woInfo[woId];
      if (!info || !info.active) continue;

      const qtyNeeded = Number(columnAsArray(wolTable, WOL.qtyNeeded)[i]) || 0;
      const remaining = qtyNeeded - (allocByLine[wolIds[i]] || 0);
      if (remaining <= 0) continue;

      const sku = columnAsArray(wolTable, WOL.sku)[i] || '';
      let recipe = null;
      const directRecipeId = getRefId(columnAsArray(wolTable, WOL.recipe)[i]);
      if (directRecipeId && recipeById[directRecipeId]) recipe = recipeById[directRecipeId];
      else recipe = recipeBySku[normalize(sku)] || null;
      if (!recipe) continue;

      const priority = columnAsArray(wolTable, WOL.priority)[i] || 'Normal';

      if (!pendingByRecipe[recipe.id]) {
        pendingByRecipe[recipe.id] = {
          recipe,
          dyes: dyesByRecipe[recipe.id] || [],
          orders: [],
          bestPriority: priority,
          soonestDue: Infinity,
          effDue: Infinity,
          anyExplicitDue: false,
          anyBump: false,
        };
      }
      const entry = pendingByRecipe[recipe.id];
      if (priorityRank(priority) < priorityRank(entry.bestPriority)) entry.bestPriority = priority;
      const due = dueValue(info.dueDate);
      if (due < entry.soonestDue) entry.soonestDue = due;
      const eff = effectiveDue(info.orderDate, info.dueDate);
      if (eff.at < entry.effDue) { entry.effDue = eff.at; entry.anyExplicitDue = eff.explicit; }
      if (info.bump) entry.anyBump = true;
      entry.orders.push({
        orderNumber: info.orderNumber,
        customerName: info.customerName,
        qty: remaining,
        dueDate: info.dueDate,
        orderDate: info.orderDate,
        bump: info.bump,
      });
    }

    // Peek-ahead: dye -> [{recipeName, qty}] across all pending recipes
    const dyeUsageMap = {};
    Object.values(pendingByRecipe).forEach(entry => {
      const totalQty = entry.orders.reduce((s, o) => s + o.qty, 0);
      entry.dyes.forEach(d => {
        if (!dyeUsageMap[d.key]) dyeUsageMap[d.key] = [];
        dyeUsageMap[d.key].push({ recipeName: entry.recipe.name, qty: totalQty });
      });
    });

    recipeData = Object.values(pendingByRecipe).map(entry => {
      const totalQty = entry.orders.reduce((s, o) => s + o.qty, 0);
      const stock = entry.dyes.map(d => {
        const rows = stockByDyeKey[d.key] || [];
        const total = rows.reduce((s, r) => s + r.qty, 0);
        // Two containers of the same dye in the same bin is one place to look.
        // Two genuinely different bins still both show — that one is real.
        const bins = [...new Set(rows.map(r => r.binLocation).filter(Boolean))];
        const powderLoc = (d.id && dyeById[d.id]) ? dyeById[d.id].powderLoc : '';
        return { dyeName: d.label, total, bins, powderLoc };
      });
      const peek = entry.dyes.map(d => {
        const others = (dyeUsageMap[d.key] || []).filter(u => u.recipeName !== entry.recipe.name);
        return { dyeName: d.label, others };
      }).filter(p => p.others.length > 0);

      const inBins = unwoundByRecipe[entry.recipe.id] || 0;      // dyed, not yet wound
      const inStock = backStockByRecipe[entry.recipe.id] || 0;    // wound, sitting in back stock
      const covered = inBins + inStock;
      const stillToMake = Math.max(0, totalQty - covered);
      const overdue = daysOverdue(entry.effDue);   // >0 = past its date
      const isLate = overdue > 0;
      // Rows only get reshuffled for dye efficiency against others with the same key.
      const urgencyKey = isLate ? 'L' + overdue : 'D' + entry.effDue;
      return { ...entry, totalQty, inBins, inStock, covered, stillToMake, stock, peek,
               overdue, isLate, urgencyKey, plan: planByRecipe[entry.recipe.id] || null };
    }).sort((a, b) => {
      // Committed-to-today first, in the sequence Batch Planner set. Everything
      // else: past-due, then Priority_Bump, then soonest due — the SAME order
      // Wind & Box uses, so "important" means one thing across both.
      if (a.plan && b.plan) return a.plan.seq - b.plan.seq;
      if (a.plan !== null && b.plan === null) return -1;
      if (a.plan === null && b.plan !== null) return 1;
      // Past its effective due date first, worst overrun leading. Then a manual
      // bump, then whatever is due soonest. Efficiency is applied afterwards and
      // can never move an overdue batch behind a newer one.
      return (b.isLate - a.isLate)
        || (b.overdue - a.overdue)
        || (b.anyBump - a.anyBump)
        || (a.effDue - b.effDue)
        || (b.stillToMake - a.stillToMake);
    });

    // ── Efficiency pass ──────────────────────────────────────────────────
    // Within a run of equally-urgent recipes (same age, neither committed to
    // today's plan) reorder greedily so consecutive batches share dyes. This
    // only ever shuffles rows that already tie on urgency, so no late order
    // can be pushed behind a newer one to save a dye change.
    recipeData = clusterByDye(recipeData);

    // Populate customer filter dropdown
    const allCustomers = new Set();
    recipeData.forEach(e => e.orders.forEach(o => { if (o.customerName) allCustomers.add(o.customerName); }));
    const customerFilter = document.getElementById('customerFilter');
    const prevVal = customerFilter.value;
    customerFilter.innerHTML = '<option value="">All customers</option>' +
      Array.from(allCustomers).sort().map(c => `<option value="${c}">${c}</option>`).join('');
    customerFilter.value = prevVal;

    const plannedCount = recipeData.filter(e => e.plan).length;
    document.getElementById('headerSub').textContent =
      `${recipeData.length} colorways pending` +
      (plannedCount
        ? ` · ${plannedCount} in today's plan`
        : ` · no plan saved for today (use Batch Planner)`);
    renderList();
  } catch (e) {
    console.error('Failed to load morning batch planning:', e);
    const msg = (e && e.message ? e.message : String(e)).replace(/[<>]/g, '');
    document.getElementById('headerSub').textContent = 'Failed to load — ' + msg;
  }
}

function duePill(e) {
  if (e.isLate) return `<span class="priority-pill" style="background:#F5D8DC;color:#A01830;">${e.overdue}d over</span>`;
  if (e.anyBump) return '<span class="priority-pill" style="background:#FBECC9;color:#8B6A00;">bumped</span>';
  if (!isFinite(e.effDue)) return `<span class="priority-pill priority-${e.bestPriority}">no date</span>`;
  const inDays = -e.overdue;
  const style = inDays <= 3 ? 'background:#FBECC9;color:#8B6A00;' : '';
  return `<span class="priority-pill ${style ? '' : 'priority-' + e.bestPriority}" style="${style}">due in ${inDays}d</span>`;
}
function dueNote(e) {
  if (!isFinite(e.effDue)) return 'no order or due date';
  const d = new Date(e.effDue * 1000);
  const when = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return e.anyExplicitDue ? `due ${when}` : `${when} — default ${DEFAULT_WINDOW_DAYS}d`;
}

// Greedy dye clustering, applied only inside runs that tie on urgency.
function clusterByDye(list) {
  const out = [];
  let i = 0;
  while (i < list.length) {
    let j = i + 1;
    while (j < list.length
           && !list[j].plan && !list[i].plan
           && list[j].urgencyKey === list[i].urgencyKey) j++;
    const run = list.slice(i, j);
    if (run.length > 2) {
      const setOf = e => new Set((e.dyes || []).map(d => d.key));
      const pool = run.map((e, idx) => ({ e, idx, set: setOf(e) }));
      const ordered = [pool.shift()];
      while (pool.length) {
        const prev = ordered[ordered.length - 1].set;
        let best = 0, bestShared = -1;
        pool.forEach((c, k) => {
          let shared = 0;
          c.set.forEach(d => { if (prev.has(d)) shared++; });
          if (shared > bestShared) { bestShared = shared; best = k; }
        });
        ordered.push(pool.splice(best, 1)[0]);
      }
      ordered.forEach(o => out.push(o.e));
    } else {
      run.forEach(e => out.push(e));
    }
    i = j;
  }
  return out;
}

function renderList() {
  const search = normalize(document.getElementById('searchBox').value);
  const customerVal = document.getElementById('customerFilter').value;
  const priorityVal = document.getElementById('priorityFilter').value;
  const planVal = document.getElementById('planFilter').value;
  const coverVal = document.getElementById('coverFilter').value;

  let filtered = recipeData.filter(e => {
    if (coverVal !== 'all') {
      const isCovered = e.stillToMake === 0;
      if (coverVal === 'todye' && isCovered) return false;
      if (coverVal === 'covered' && !isCovered) return false;
    }
    if (planVal === 'planned' && !e.plan) return false;
    if (planVal === 'unplanned' && e.plan) return false;
    if (priorityVal && e.bestPriority !== priorityVal) return false;
    if (customerVal && !e.orders.some(o => o.customerName === customerVal)) return false;
    if (search) {
      const hay = normalize(e.recipe.name + ' ' + (e.recipe.sku || '') + ' ' + e.orders.map(o => o.customerName).join(' '));
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Counter reflects the FILTERED set, so it's useful when narrowing by customer etc.
  const totalSpools = filtered.reduce((s, e) => s + e.stillToMake, 0);
  const plannedShown = filtered.filter(e => e.plan).length;
  const coveredCount = recipeData.filter(e => e.stillToMake === 0).length;
  const lateShown = filtered.filter(e => e.isLate).length;
  document.getElementById('counterRow').innerHTML = `
    <div class="counter-chip">${totalSpools}<span>to dye</span></div>
    <div class="counter-chip">${filtered.length}<span>colorways</span></div>
    ${plannedShown ? `<div class="counter-chip">${plannedShown}<span>planned today</span></div>` : ''}
    ${lateShown ? `<div class="counter-chip" style="background:#F5D8DC;color:#A01830;">${lateShown}<span>past due</span></div>` : ''}
    ${(coverVal === 'todye' && coveredCount) ? `<div class="counter-chip">${coveredCount}<span>covered, hidden</span></div>` : ''}
  `;

  const content = document.getElementById('content');
  if (!filtered.length) {
    content.innerHTML = `<div class="empty-state">🎉 Nothing matches — try clearing filters, or you're all caught up.</div>`;
    return;
  }

  const rows = filtered.map(e => {
    const stockHtml = e.stock.map(s => {
      if (!s.total) {
        return `<div class="stock-line no-stock">${esc(s.dyeName)}: none${s.powderLoc ? ` · powder <span class="bin-tag">${esc(s.powderLoc)}</span>` : ''}</div>`;
      }
      const bins = s.bins.map(b => `<span class="bin-tag">${esc(b)}</span>`).join(' ');
      return `<div class="stock-line">${esc(s.dyeName)}: ${s.total.toFixed(0)}mL ${bins}</div>`;
    }).join('');

    const peekHtml = e.peek.map(p =>
      `<div class="peek-line"><strong>${esc(p.dyeName)}</strong> → ${p.others.map(o => `${esc(o.recipeName)} (${o.qty})`).join(', ')}</div>`
    ).join('') || '<div class="peek-line" style="color:#8B7D72;font-style:italic;">No overlap with other pending recipes</div>';

    const isSelected = e.recipe.id === selectedRecipeId;
    const planBadge = e.plan
      ? `<span class="plan-badge">#${e.plan.seq} today</span>`
      : `<span class="not-planned">not in today's plan</span>`;
    const planSlots = e.plan && e.plan.slots && e.plan.slots !== '—'
      ? `<div class="plan-slots">${e.plan.slots}</div>`
      : '';

    return `
      <tr class="recipe-row ${isSelected ? 'selected' : ''} ${e.plan ? 'planned' : ''}" onclick="jumpToRecipe(${e.recipe.id})">
        <td>
          <div class="recipe-name-cell">${esc(e.recipe.name)}${planBadge}</div>
          <div class="recipe-meta-cell">${esc(e.recipe.sku || '')} · ${e.dyes.length} color${e.dyes.length === 1 ? '' : 's'}</div>
          ${planSlots}
        </td>
        <td>${duePill(e)}<div style="font-size:9px;color:#8B7D72">${dueNote(e)}</div></td>
        <td>${e.stillToMake > 0 ? `<strong>${e.stillToMake}</strong> to dye` : '<span style="color:#2D6A2D">covered ✓</span>'}<div style="font-size:9px;color:#8B7D72">${e.totalQty} owed${e.inBins ? ` · ${e.inBins} to wind` : ''}${e.inStock ? ` · ${esc(e.inStock)} back stock` : ''}</div></td>
        <td>${stockHtml}</td>
        <td>${peekHtml}</td>
      </tr>
    `;
  }).join('');

  content.innerHTML = `
    <table class="work-table">
      <thead>
        <tr>
          <th>Colorway</th>
          <th>Priority</th>
          <th>To dye</th>
          <th>Premade Stock</th>
          <th>Peek Ahead</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

grist.ready({
  requiredAccess: 'full',
  allowSelectBy: true
});

loadEverything();
</script>
</body>
